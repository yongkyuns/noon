[package]
name = "noon-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
noon-core = { path = "../crates/noon-core" }
noon-geometry = { path = "../crates/noon-geometry" }

[[bin]]
name = "semantic_transaction"
path = "fuzz_targets/semantic_transaction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tessellation"
path = "fuzz_targets/tessellation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "morph"
path = "fuzz_targets/morph.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
