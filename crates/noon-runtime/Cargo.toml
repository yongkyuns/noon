[package]
name = "noon-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic renderer-free runtime for compiled Noon scenes"
readme = "README.md"

[dependencies]
noon-core = { path = "../noon-core" }
noon-geometry = { path = "../noon-geometry" }
noon-compile = { path = "../noon-compile" }

[features]
# Experimental #2211; not enabled by default.
prepared-prefix = ["noon-compile/prepared-prefix"]
