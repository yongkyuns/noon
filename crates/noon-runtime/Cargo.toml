[package]
name = "noon-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
description = "Deterministic renderer-free runtime for compiled Noon scenes"

[dependencies]
noon-core = { version = "0.1.0", path = "../noon-core" }
noon-geometry = { version = "0.1.0", path = "../noon-geometry" }
noon-compile = { version = "0.1.0", path = "../noon-compile" }

[features]
# Experimental #2211; not enabled by default.
prepared-prefix = ["noon-compile/prepared-prefix"]
