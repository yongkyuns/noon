[package]
name = "noon-render-wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
description = "Reusable retained WGPU renderer for Noon runtime state"

[features]
# Optional authored-source validation; no default parser dependency.
wgsl-effects = ["noon-core/wgsl-effects"]
default = ["native", "ci-noop"]
native = [
    "wgpu/dx12",
    "wgpu/metal",
    "wgpu/gles",
    "wgpu/vulkan",
]
web = [
    "wgpu/webgpu",
    "wgpu/webgl",
]
ci-noop = [
    "wgpu/noop",
]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
noon-core = { version = "0.1.0", path = "../noon-core" }
noon-compile = { version = "0.1.0", path = "../noon-compile" }
noon-geometry = { version = "0.1.0", path = "../noon-geometry" }
noon-runtime = { version = "0.1.0", path = "../noon-runtime" }
noon-text = { version = "0.1.0", path = "../noon-text" }
swash = "=0.2.10"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl"] }

[dev-dependencies]
serde_json = "1.0"
half = "=2.7.1"
pollster = "=1.0.1"
noon-typst = { path = "../noon-typst" }
