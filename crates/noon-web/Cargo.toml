[package]
name = "noon-web"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Browser-facing persistent runtime and live patch control for Noon"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ciborium = "0.2"
noon = { path = "../noon" }
noon-compile = { path = "../noon-compile" }
noon-core = { path = "../noon-core" }
noon-geometry = { path = "../noon-geometry" }
noon-ir = { path = "../noon-ir" }
noon-runtime = { path = "../noon-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
noon-render-wgpu = { path = "../noon-render-wgpu", default-features = false, features = ["web"] }
noon-text-render-wgpu = { path = "../noon-text-render-wgpu", default-features = false, features = ["web"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Event", "EventTarget", "HtmlCanvasElement", "OffscreenCanvas", "Performance", "Window"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "webgpu", "webgl"] }

[dev-dependencies]
noon-render-wgpu = { path = "../noon-render-wgpu", default-features = false, features = ["ci-noop"] }
