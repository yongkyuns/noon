[package]
name = "noon-web"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Browser-facing persistent runtime and live patch control for Noon"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["renderer"]
# Explicit release-profile qualification only; production builds omit the fixtures.
renderer-smoke = ["renderer"]
# Opt-in typed replay fixtures for optimized qualification, not production exports.
replay-smoke = []
renderer = [
    "dep:noon-render-wgpu",
    "dep:wgpu",
]

[dependencies]
ciborium = "0.2"
noon = { path = "../noon", features = ["diagnostics"] }
noon-compile = { path = "../noon-compile" }
noon-core = { path = "../noon-core" }
noon-geometry = { path = "../noon-geometry" }
noon-runtime = { path = "../noon-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
noon-render-wgpu = { path = "../noon-render-wgpu", default-features = false, features = ["web"], optional = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Event", "EventTarget", "HtmlCanvasElement", "OffscreenCanvas", "Performance", "Window"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "webgpu", "webgl"], optional = true }

[dev-dependencies]
noon-render-wgpu = { path = "../noon-render-wgpu", default-features = false, features = ["ci-noop"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "noop"] }
