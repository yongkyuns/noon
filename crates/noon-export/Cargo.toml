[package]
name = "noon-export"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
description = "Windowless native capture and output integration for the shared Noon engine"

[features]
default = ["native-text", "typst", "bundled-fonts", "image-decode"]
native-text = ["noon/native-text"]
typst = ["noon/typst"]
bundled-fonts = ["noon/bundled-fonts"]
image-decode = ["noon/image-decode"]
latex = ["noon/latex"]
wgsl-effects = ["noon/wgsl-effects"]

[[example]]
name = "first_lesson"
required-features = ["native-text", "typst", "bundled-fonts"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
noon = { version = "0.1.0", path = "../noon", default-features = false }
noon-core = { version = "0.1.0", path = "../noon-core" }
noon-render-wgpu = { version = "0.1.0", path = "../noon-render-wgpu", default-features = false, features = ["native"] }
pollster = "=1.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std"] }
