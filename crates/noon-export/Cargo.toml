[package]
name = "noon-export"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Windowless native capture and output integration for the shared Noon engine"

[features]
default = ["native-text", "typst", "bundled-fonts", "image-decode"]
native-text = ["noon/native-text"]
typst = ["noon/typst"]
bundled-fonts = ["noon/bundled-fonts"]
image-decode = ["noon/image-decode"]
latex = ["noon/latex"]
ffmpeg = []
png = ["dep:image"]

[[example]]
name = "export_video"
required-features = ["ffmpeg"]

[[example]]
name = "export_png"
required-features = ["png"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"], optional = true }
noon = { path = "../noon", default-features = false }
noon-core = { path = "../noon-core" }
noon-render-wgpu = { path = "../noon-render-wgpu", default-features = false, features = ["native"] }
pollster = "=1.0.1"
wgpu = { version = "30.0.1", default-features = false, features = ["std"] }
