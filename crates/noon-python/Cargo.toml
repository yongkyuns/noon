[package]
name = "noon-python"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native CPython binding to the shared Noon authoring and execution API"

[lib]
name = "_noon_native"
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
noon = { path = "../noon", default-features = false }
noon-core = { path = "../noon-core" }
pyo3 = { version = "=0.29.2", features = ["extension-module"] }
