[package]
# Distributed as a native Python wheel, not a separate Rust SDK.
publish = false
name = "noon-python"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
description = "Native CPython binding to the shared Noon authoring and execution API"

[features]
default = ["window", "capture", "native-text", "bundled-fonts", "image-decode", "typst", "wgsl-effects"]
native-text = ["noon/native-text"]
typst = ["noon/typst"]
wgsl-effects = ["noon/wgsl-effects"]
bundled-fonts = ["native-text", "noon/bundled-fonts"]
image-decode = ["noon/image-decode"]
window = ["dep:noon-native"]
capture = ["dep:noon-export", "dep:png"]

[lib]
name = "_noon_native"
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
noon = { version = "0.1.0", path = "../noon", default-features = false }
noon-core = { version = "0.1.0", path = "../noon-core" }
noon-geometry = { version = "0.1.0", path = "../noon-geometry" }
noon-native = { version = "0.1.0", path = "../noon-native", optional = true }
noon-export = { version = "0.1.0", path = "../noon-export", default-features = false, optional = true }
png = { version = "=0.18.1", optional = true }
pyo3 = { version = "=0.29.2" }

[build-dependencies]
pyo3-build-config = "=0.29.2"
