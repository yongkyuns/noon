[package]
name = "noon-python"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native CPython binding to the shared Noon authoring and execution API"

[features]
default = []
native-text = ["noon/native-text"]
bundled-fonts = ["native-text", "noon/bundled-fonts"]
image-decode = ["noon/image-decode"]
export = ["dep:noon-export"]

[lib]
name = "_noon_native"
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
noon = { path = "../noon", default-features = false }
noon-core = { path = "../noon-core" }
noon-export = { path = "../noon-export", default-features = false, optional = true }
pyo3 = { version = "=0.29.2" }

[build-dependencies]
pyo3-build-config = "=0.29.2"
