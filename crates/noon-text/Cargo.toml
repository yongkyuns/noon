[package]
name = "noon-text"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CPU text shaping and glyph raster services for Noon"

[dependencies]
noon-core = { path = "../noon-core" }
swash = "=0.2.10"
skrifa = { version = "=0.48.0", default-features = false, features = ["std"] }

[dev-dependencies]
typst-assets = { version = "=0.15.1", features = ["fonts"] }
