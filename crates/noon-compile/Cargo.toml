[package]
name = "noon-compile"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
description = "Typed semantic lowering into renderer-independent execution data"

[dependencies]
noon-core = { version = "0.1.0", path = "../noon-core" }
noon-geometry = { version = "0.1.0", path = "../noon-geometry" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
noon-core = { path = "../noon-core", features = ["wgsl-effects"] }

[features]
# Experimental #2211; not enabled by default.
prepared-prefix = []
