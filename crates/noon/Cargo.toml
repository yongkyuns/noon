[package]
name = "noon"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Ergonomic language-neutral authoring facade for Noon"

[features]
# Experimental #2211; not enabled by default.
prepared-prefix = ["noon-runtime/prepared-prefix"]
image-decode = ["dep:image"]
# Convenience product configuration. Geometry-only consumers disable defaults.
default = ["native-text", "typst", "bundled-fonts", "image-decode", "code"]
native-text = ["dep:noon-text", "dep:swash"]
code = ["native-text", "dep:syntect", "dep:two-face"]
latex = ["dep:noon-text"]
typst = ["dep:noon-typst"]
# Weak forwarding does not activate the Typst compiler for native-text consumers.
bundled-fonts = ["dep:typst-assets", "noon-typst?/bundled-fonts"]
diagnostics = ["dep:serde_json"]

[[example]]
name = "cross_language_parity"
required-features = ["diagnostics"]

[[example]]
name = "manim_elbow_oracle"
required-features = ["diagnostics"]

[[example]]
name = "manim_dot_ellipse_oracle"
required-features = ["diagnostics"]

[[example]]
name = "glow_scene_playback"
required-features = ["typst", "bundled-fonts"]

[dependencies]
num-bigint = { version = "=0.4.8", default-features = false }
serde_json = { version = "1", optional = true }
noon-compile = { path = "../noon-compile" }
noon-core = { path = "../noon-core" }
noon-geometry = { path = "../noon-geometry" }
noon-runtime = { path = "../noon-runtime" }
noon-text = { path = "../noon-text", optional = true }
noon-typst = { path = "../noon-typst", optional = true, default-features = false }
swash = { version = "=0.2.10", optional = true }
syntect = { version = "=5.3.0", optional = true, default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
two-face = { version = "=0.5.2", optional = true, default-features = false, features = ["syntect-fancy"] }
typst-assets = { version = "=0.15.1", features = ["fonts"], optional = true }
usvg = { version = "=0.48.1", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }

[dev-dependencies]
serde_json = "1"
noon-render-wgpu = { path = "../noon-render-wgpu", default-features = false, features = ["ci-noop", "native"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl"] }
pollster = "=1.0.1"

[[test]]
name = "retained_images"
required-features = ["image-decode"]

# The mixed-content raster fixture uses native shaping and its deterministic font.
[[test]]
name = "selection_overlay_raster"
required-features = ["native-text", "bundled-fonts"]
