<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>Noon Manim compatibility smoke</title>
  </head>
  <body>
    <canvas id="retained-write-smoke" width="640" height="360"></canvas>
    <script type="module">
      import init, { semanticFrameJson } from "./pkg/noon_web.js";
      import { PythonAuthoringClient } from "./authoring-client.js";

      const client = new PythonAuthoringClient();
      const runForExport = (source) => client.run(source, {}, { exportDocument: true });
      async function runLiveSources(sources) {
        const { AuthoringExecutionClient } = await import("./authoring-execution-client.js");
        const canvas = document.createElement("canvas");
        canvas.width = 640;
        canvas.height = 360;
        document.body.append(canvas);
        const execution = new AuthoringExecutionClient(canvas);
        const results = [];
        let started = false;
        let sameCanvas = true;
        try {
          for (const source of sources) {
            const result = await client.run(source, {}, {
              async onSemanticContinuation(registration) {
                const options = {
                  authoringClient: client,
                  loopDurationSeconds: registration.duration,
                };
                if (started) {
                  await execution.reconcileSemanticExecution(registration.semanticExecution, options);
                } else {
                  await execution.startSemanticExecution(registration.semanticExecution, {
                    ...options,
                    transportMode: "transferable",
                  });
                  started = true;
                }
              },
            });
            sameCanvas &&= execution.canvas === canvas;
            results.push({ duration: result.duration, metrics: (await execution.metrics()).metrics });
          }
          return { results, sameCanvas };
        } finally {
          execution.terminate();
          canvas.remove();
        }
      }
      async function runLive(source) {
        return (await runLiveSources([source])).results[0];
      }
      const wasmReady = init();
      const familyCreateSource = `
from noon import *

class RetainedFamilyCreateSmoke(Scene):
    def construct(self):
        family = VGroup(Text("AB"), Circle(radius=0.25))
        self.play(Create(family), run_time=1.0, rate_func=linear)
`;
      const familyWriteSource = `
from noon import *

class RetainedFamilyWriteSmoke(Scene):
    def construct(self):
        # Source length is 15 while the rendered family has 14 visible glyphs.
        # Manim Write must therefore retain its <15-member one-second default.
        self.play(Write(Text("ABCDEFG HIJKLMN")))
`;
      const familyUnwriteSource = `
from noon import *

class RetainedFamilyUnwriteSmoke(Scene):
    def construct(self):
        text = Text("AB")
        self.add(text)
        self.play(Unwrite(text))
`;
      const sequentialFamilySource = `
from noon import *

class RetainedSequentialFamilySmoke(Scene):
    def construct(self):
        text = Text("AB")
        self.play(Write(text), run_time=1.0, rate_func=linear)
        self.play(Unwrite(text), run_time=1.0, rate_func=linear)
`;

      let readyPromise = null;
      let writeResult = null;
      let writeRenderResult = null;

      function retainedTextView(result, label = "retained text") {
        if (result.kind !== "scene_document") {
          throw new Error(`${label} returned ${result.kind}`);
        }
        if (result.retainedDocument != null) {
          throw new Error(`${label} must export mixed content through SceneSpec only`);
        }
        const sceneSpec = result.sceneSpec;
        if (!sceneSpec || sceneSpec.version !== 1 || !Array.isArray(sceneSpec.objects)) {
          throw new Error(`${label} did not produce SceneSpec v1 objects`);
        }
        const textEntries = sceneSpec.objects
          .map((object, order) => ({ object, order }))
          .filter(({ object }) => object.content?.kind === "text");
        if (textEntries.length === 0) return null;
        const ids = new Set(textEntries.map(({ object }) => object.id));
        return {
          channel: "noon.authoring.retained",
          protocol_version: 2,
          objects: textEntries.map(({ object, order }) => ({
            object: object.id,
            order,
            text: {
              ...object.content.value,
              transform: object.transform,
              style: object.style,
            },
          })),
          tracks: (sceneSpec.tracks ?? []).filter((track) => ids.has(track.object)),
        };
      }

      async function waitForRenderedState(
        execution,
        { label, seekTime, expectedObjectCount, errors },
      ) {
        let latest = null;
        for (let attempt = 0; attempt < 100; attempt += 1) {
          latest = await execution.metrics();
          if (errors.length !== 0) {
            throw new Error(`${label} retained execution reported errors: ${errors.join("; ")}`);
          }
          const renderTime = Number(latest.metrics.time);
          if (
            Math.abs(renderTime - seekTime) <= 1e-6 &&
            latest.metrics.objectCount === expectedObjectCount
          ) {
            return latest;
          }
          await new Promise((resolve) => setTimeout(resolve, 20));
        }
        const renderTime = latest == null ? "unavailable" : latest.metrics.time;
        const objectCount = latest == null ? "unavailable" : latest.metrics.objectCount;
        throw new Error(
          `${label} renderer did not converge to t=${seekTime} with ${expectedObjectCount} visible objects; ` +
            `last state was t=${renderTime}, objects=${objectCount}`,
        );
      }

      function assertCanonicalRenderedState(metrics, label, seekTime) {
        if (!metrics.metrics.ready || !metrics.metrics.retained || metrics.executionMode !== "semantic") {
          throw new Error(`${label} did not run through shared semantic retained execution`);
        }
        if (metrics.metrics.presentedFrames < 1 || metrics.metrics.drawCalls < 1 || metrics.metrics.instancesDrawn < 1) {
          throw new Error(`${label} did not produce a presented retained render frame`);
        }
        if (Math.abs(Number(metrics.engineMetrics.time) - seekTime) > 1e-6) {
          throw new Error(`${label} deterministic seek drifted to ${metrics.engineMetrics.time}`);
        }
      }

      async function renderSequentialFamilySwitch() {
        const { AuthoringExecutionClient } = await import("./authoring-execution-client.js");
        const canvas = document.querySelector("#retained-write-smoke");
        const errors = [];
        let resolveAttached;
        let rejectAttached;
        const attached = new Promise((resolve, reject) => {
          resolveAttached = resolve;
          rejectAttached = reject;
        });
        const execution = new AuthoringExecutionClient(canvas, {
          onError(error, owner) {
            const message = `${owner}: ${error}`;
            errors.push(message);
            rejectAttached(new Error(message));
          },
        });
        let readyState;
        const authored = client.run(sequentialFamilySource, {}, {
          async onSemanticContinuation(registration) {
            readyState = await execution.startSemanticExecution(registration.semanticExecution, {
              authoringClient: client,
              loopDurationSeconds: registration.duration,
              transportMode: "transferable",
              pacing: "external_samples",
            });
            resolveAttached();
          },
        });
        authored.then(() => rejectAttached(new Error("Write/Unwrite did not register a continuation")), rejectAttached);
        try {
          await attached;
          await execution.sampleToAuthoredTime(0.5);
          const first = await waitForRenderedState(execution, {
            label: "shared Text Write",
            seekTime: 0.5,
            expectedObjectCount: 1,
            errors,
          });
          assertCanonicalRenderedState(first, "shared Text Write", 0.5);
          await execution.sampleToAuthoredTime(1.5);
          const second = await waitForRenderedState(execution, {
            label: "shared Text Unwrite",
            seekTime: 1.5,
            expectedObjectCount: 1,
            errors,
          });
          assertCanonicalRenderedState(second, "shared Text Unwrite", 1.5);
          if (second.metrics.presentedFrames <= first.metrics.presentedFrames) {
            throw new Error("shared Text Unwrite did not publish a new frame");
          }
          const [, completed] = await Promise.all([execution.sampleToAuthoredTime(2.0), authored]);
          if (completed.duration !== 2.0 || (await execution.metrics()).metrics.objectCount !== 0) {
            throw new Error("shared Text Unwrite did not remove its member at completion");
          }
          return {
            backend: second.metrics.backend,
            presentedFrames: second.metrics.presentedFrames,
            drawCalls: second.metrics.drawCalls,
            instancesDrawn: second.metrics.instancesDrawn,
            engineTime: second.engineMetrics.time,
            renderTime: second.metrics.time,
            objectCount: second.metrics.objectCount,
            readyState,
          };
        } finally {
          execution.terminate();
        }
      }

      async function ready() {
        if (readyPromise == null) {
          readyPromise = (async () => {
            await Promise.all([client.ready(), wasmReady]);

            const create = await runLive(familyCreateSource);
            if (create.duration !== 1.0 || create.metrics.objectCount !== 2) {
              throw new Error(
                `mixed family Create must share one-second timing and render both Text and geometry: ${JSON.stringify(create)}`,
              );
            }
            if (create.metrics.presentedFrames < 1) {
              throw new Error("mixed family Create must present through shared execution");
            }

            writeResult = await runLive(familyWriteSource);
            if (writeResult.duration !== 1.0 || writeResult.metrics.objectCount !== 1) {
              throw new Error("Text Write must derive one-second duration from 14 visible glyphs");
            }
            const unwrite = await runLive(familyUnwriteSource);
            if (unwrite.duration !== 1.0 || unwrite.metrics.objectCount !== 0) {
              throw new Error("default Text Unwrite must remove its target after one second");
            }
            writeRenderResult = await renderSequentialFamilySwitch();

            return {
              create,
              write: writeResult,
              unwrite,
              writeRender: writeRenderResult,
            };
          })();
        }
        return readyPromise;
      }

      window.noonManimCompat = {
        ready,
        renderRetainedWriteMidpoint: async () => {
          await ready();
          return writeRenderResult;
        },
        retainedTextView,
        run: runForExport,
        runLive,
        runLiveSources,
        semanticFrame: (sceneJson, time) => JSON.parse(semanticFrameJson(sceneJson, time)),
      };
    </script>
  </body>
</html>
