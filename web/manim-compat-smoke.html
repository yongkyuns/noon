<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>Noon Manim compatibility smoke</title>
  </head>
  <body>
    <canvas id="retained-write-smoke" width="640" height="360"></canvas>
    <canvas id="retained-stress-smoke" width="640" height="360"></canvas>
    <script type="module">
      import init, { semanticFrameJson } from "./pkg/noon_web.js";
      import { PythonAuthoringClient } from "./authoring-client.js";
      import { ExecutionWorkerClient } from "./execution-worker-client.js";

      const client = new PythonAuthoringClient();
      const wasmReady = init();
      const familyCreateSource = `
from noon import *

class RetainedFamilyCreateSmoke(Scene):
    def construct(self):
        family = VGroup(Text("AB"), Circle(radius=0.25))
        self.play(Create(family), run_time=1.0, rate_func=linear)
`;
      const familyWriteSource = `
from noon import *

class RetainedFamilyWriteSmoke(Scene):
    def construct(self):
        # Source length is 15 while the rendered family has 14 visible glyphs.
        # Manim Write must therefore retain its <15-member one-second default.
        self.play(Write(Text("ABCDEFG HIJKLMN")))
`;
      const familyUnwriteSource = `
from noon import *

class RetainedFamilyUnwriteSmoke(Scene):
    def construct(self):
        text = Text("AB")
        self.add(text)
        self.play(Unwrite(text))
`;

      let readyPromise = null;
      let writeResult = null;
      let writeRenderResult = null;
      let stressResult = null;
      let stressRenderResult = null;

      function oneFamilyRequest(result, label) {
        if (result.kind !== "scene_document") {
          throw new Error(`${label} smoke returned ${result.kind}`);
        }
        const retained = result.retainedDocument;
        if (!retained || retained.objects.length !== 1) {
          throw new Error(`${label} smoke expected one retained native Text leaf`);
        }
        if (!Array.isArray(retained.family_animations) || retained.family_animations.length !== 1) {
          throw new Error(`${label} smoke did not author exactly one retained family request`);
        }
        const sceneSpec = result.sceneSpec;
        if (!sceneSpec || !Array.isArray(sceneSpec.family_animations) || sceneSpec.family_animations.length !== 1) {
          throw new Error(`${label} smoke did not reach canonical SceneSpec family animations`);
        }
        const request = sceneSpec.family_animations[0];
        const serialized = JSON.stringify(request);
        for (const forbidden of ["glyph_id", "atlas_id", "font_bytes"]) {
          if (serialized.includes(forbidden)) {
            throw new Error(`${label} request leaked ${forbidden}`);
          }
        }
        return request;
      }

      async function waitForRenderedState(
        execution,
        { label, seekTime, expectedObjectCount, errors },
      ) {
        let latest = null;
        for (let attempt = 0; attempt < 100; attempt += 1) {
          latest = await execution.metrics();
          if (errors.length !== 0) {
            throw new Error(`${label} retained execution reported errors: ${errors.join("; ")}`);
          }
          const renderTime = Number(latest.metrics.time);
          if (
            Math.abs(renderTime - seekTime) <= 1e-6 &&
            latest.metrics.objectCount === expectedObjectCount
          ) {
            return latest;
          }
          await new Promise((resolve) => setTimeout(resolve, 20));
        }
        const renderTime = latest == null ? "unavailable" : latest.metrics.time;
        const objectCount = latest == null ? "unavailable" : latest.metrics.objectCount;
        throw new Error(
          `${label} renderer did not converge to t=${seekTime} with ${expectedObjectCount} visible objects; ` +
            `last state was t=${renderTime}, objects=${objectCount}`,
        );
      }

      async function renderCanonicalMidpoint({
        result,
        canvasSelector,
        label,
        loopDurationSeconds,
        seekTime,
        expectedObjectCount,
      }) {
        if (result == null) {
          throw new Error(`${label} authoring result is unavailable`);
        }

        const canvas = document.querySelector(canvasSelector);
        const errors = [];
        const execution = new ExecutionWorkerClient(canvas, {
          onError(error, owner) {
            errors.push(`${owner}: ${error}`);
          },
        });
        try {
          const readyState = await execution.startRetainedCanonical(
            JSON.stringify(result.sceneSpec),
            {
              loopDurationSeconds,
              transportMode: "transferable",
            },
          );
          await execution.pause();
          await execution.seek(seekTime);
          const metrics = await waitForRenderedState(execution, {
            label,
            seekTime,
            expectedObjectCount,
            errors,
          });
          if (!metrics.metrics.ready || !metrics.metrics.retained || !metrics.engineMetrics.canonical) {
            throw new Error(`${label} midpoint did not run through canonical retained execution`);
          }
          if (metrics.metrics.presentedFrames < 1 || metrics.metrics.drawCalls < 1 || metrics.metrics.instancesDrawn < 1) {
            throw new Error(`${label} midpoint did not produce a presented retained render frame`);
          }
          if (Math.abs(Number(metrics.engineMetrics.time) - seekTime) > 1e-6) {
            throw new Error(`${label} deterministic seek drifted to ${metrics.engineMetrics.time}`);
          }
          return {
            backend: metrics.metrics.backend,
            presentedFrames: metrics.metrics.presentedFrames,
            drawCalls: metrics.metrics.drawCalls,
            instancesDrawn: metrics.metrics.instancesDrawn,
            engineTime: metrics.engineMetrics.time,
            renderTime: metrics.metrics.time,
            objectCount: metrics.metrics.objectCount,
            readyState,
          };
        } finally {
          execution.terminate();
        }
      }

      async function ready() {
        if (readyPromise == null) {
          readyPromise = (async () => {
            await Promise.all([client.ready(), wasmReady]);

            const create = await client.run(familyCreateSource);
            if (create.document.objects.length !== 1) {
              throw new Error(
                `family Create smoke expected one geometry leaf, got ${create.document.objects.length}`,
              );
            }
            const createRequest = oneFamilyRequest(create, "family Create");
            if (createRequest.spec.mode !== "reveal") {
              throw new Error(`family Create authored unexpected mode ${createRequest.spec.mode}`);
            }

            writeResult = await client.run(familyWriteSource);
            const writeRequest = oneFamilyRequest(writeResult, "family Write");
            if (writeRequest.spec.mode !== "draw_border_then_fill") {
              throw new Error(`family Write authored unexpected mode ${writeRequest.spec.mode}`);
            }
            if (Math.abs(Number(writeRequest.spec.duration) - 1.0) > 1e-12) {
              throw new Error(
                `family Write must derive one-second duration from 14 rendered members, got ${writeRequest.spec.duration}`,
              );
            }
            if (Math.abs(Number(writeRequest.spec.lag_ratio) - 0.2) > 1e-12) {
              throw new Error(`family Write default lag ratio drifted to ${writeRequest.spec.lag_ratio}`);
            }
            if (writeRequest.spec.rate_function !== "linear") {
              throw new Error(`family Write default rate function drifted to ${writeRequest.spec.rate_function}`);
            }
            if (writeRequest.spec.reverse_rate_function || writeRequest.spec.reverse_member_order) {
              throw new Error("forward Write unexpectedly reversed rate or member order");
            }
            if (Math.abs(Number(writeResult.duration) - 1.0) > 1e-12) {
              throw new Error(`family Write scene cursor did not use Rust-resolved duration: ${writeResult.duration}`);
            }

            const unwrite = await client.run(familyUnwriteSource);
            const unwriteRequest = oneFamilyRequest(unwrite, "family Unwrite");
            if (unwriteRequest.spec.mode !== "draw_border_then_fill") {
              throw new Error(`family Unwrite authored unexpected mode ${unwriteRequest.spec.mode}`);
            }
            if (!unwriteRequest.spec.reverse_rate_function || !unwriteRequest.spec.reverse_member_order) {
              throw new Error("default Unwrite must reverse both per-member rate and semantic member order");
            }

            writeRenderResult = await renderCanonicalMidpoint({
              result: writeResult,
              canvasSelector: "#retained-write-smoke",
              label: "family Write",
              loopDurationSeconds: 1.0,
              seekTime: 0.5,
              expectedObjectCount: 1,
            });

            const stressResponse = await fetch("./python/examples/manim_parity_stress_grid.py");
            if (!stressResponse.ok) {
              throw new Error(`stress source fetch failed with HTTP ${stressResponse.status}`);
            }
            const stressSource = await stressResponse.text();
            stressResult = await client.run(stressSource);
            if (stressResult.kind !== "scene_document") {
              throw new Error(`stress smoke returned ${stressResult.kind}`);
            }
            if (Math.abs(Number(stressResult.duration) - 5.0) > 1e-12) {
              throw new Error(`stress scene duration drifted to ${stressResult.duration}`);
            }
            if (!stressResult.sceneSpec) {
              throw new Error("stress scene did not produce canonical SceneSpec");
            }
            if (stressResult.document.objects.length !== 800) {
              throw new Error(
                `stress scene expected 800 geometry objects, got ${stressResult.document.objects.length}`,
              );
            }
            if (stressResult.retainedDocument?.objects?.length !== 26) {
              throw new Error(
                `stress scene expected 26 retained Text objects, got ${stressResult.retainedDocument?.objects?.length}`,
              );
            }
            if (stressResult.sceneSpec.objects.length !== 826) {
              throw new Error(
                `stress canonical SceneSpec expected 826 mixed objects, got ${stressResult.sceneSpec.objects.length}`,
              );
            }
            stressRenderResult = await renderCanonicalMidpoint({
              result: stressResult,
              canvasSelector: "#retained-stress-smoke",
              label: "dynamic load stress",
              loopDurationSeconds: 5.0,
              seekTime: 3.0,
              // At t=3.0 all 600 primary shapes and all 26 retained Text objects
              // are present. The 200 pulse circles are authored but enter later.
              expectedObjectCount: 626,
            });

            return {
              create,
              write: writeResult,
              unwrite,
              writeRender: writeRenderResult,
              stress: stressResult,
              stressRender: stressRenderResult,
            };
          })();
        }
        return readyPromise;
      }

      window.noonManimCompat = {
        ready,
        renderRetainedWriteMidpoint: async () => {
          await ready();
          return writeRenderResult;
        },
        renderStressMidpoint: async () => {
          await ready();
          return stressRenderResult;
        },
        run: (source) => client.run(source),
        semanticFrame: (sceneJson, time) => JSON.parse(semanticFrameJson(sceneJson, time)),
      };
    </script>
  </body>
</html>
