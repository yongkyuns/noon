<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Noon WebGPU playback</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #090c13;
        color: #f6f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 0%, #17213c 0, transparent 38rem),
          #090c13;
      }

      main {
        width: min(92vw, 68rem);
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.4rem, 3vw, 2.4rem);
        letter-spacing: -0.04em;
      }

      p {
        margin: 0.35rem 0 0;
        color: #aeb6c9;
      }

      #status {
        flex: none;
        padding: 0.45rem 0.7rem;
        border: 1px solid #34405d;
        border-radius: 999px;
        color: #c7d4f1;
        font: 0.78rem ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 1px solid #29334b;
        border-radius: 1rem;
        background: #090c13;
        box-shadow: 0 1.5rem 5rem rgb(0 0 0 / 45%);
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-top: 1rem;
      }

      button {
        appearance: none;
        border: 1px solid #52658f;
        border-radius: 0.7rem;
        padding: 0.65rem 0.9rem;
        background: #17213c;
        color: #f6f7fb;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #223055;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.5;
      }

      #patch-status {
        color: #8fa0c3;
        font: 0.78rem ui-monospace, SFMono-Regular, Menlo, monospace;
        text-align: right;
      }

      @media (max-width: 44rem) {
        header {
          display: block;
        }

        #status {
          display: inline-block;
          margin-top: 0.8rem;
        }

        canvas {
          aspect-ratio: 4 / 3;
        }

        .controls {
          align-items: start;
          flex-direction: column;
        }

        #patch-status {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Noon, running without Python</h1>
          <p>Deterministic scene runtime → analytic batches → WebGPU canvas</p>
        </div>
        <output id="status">Starting WebGPU…</output>
      </header>
      <canvas id="scene" aria-label="Animated Noon scene"></canvas>
      <section class="controls" aria-label="Live scene controls">
        <button id="apply-patch" type="button" disabled>Apply live patch</button>
        <output id="patch-status">Waiting for the runtime…</output>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
