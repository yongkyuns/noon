<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Noon Playground: author mathematical animation in Python and preview it in the browser."
    />
    <link rel="icon" href="data:," />
    <title>Noon Playground</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #07090f;
        color: #f7f8fb;
        --panel: rgb(14 18 28 / 88%);
        --panel-strong: #101521;
        --border: #263149;
        --border-strong: #3a4968;
        --muted: #96a2ba;
        --muted-2: #6f7d99;
        --accent: #8e7cff;
        --accent-strong: #aa9cff;
        --accent-bg: rgb(142 124 255 / 13%);
        --success: #75d7b0;
        --danger: #ff8f9d;
        --code: #080b12;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 14% -10%, rgb(83 68 178 / 22%), transparent 32rem),
          radial-gradient(circle at 88% 6%, rgb(35 113 143 / 14%), transparent 28rem),
          #07090f;
      }

      button,
      textarea {
        font: inherit;
      }

      button:focus-visible,
      textarea:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--accent-strong);
        outline-offset: 2px;
      }

      .shell {
        width: min(100% - 2rem, 92rem);
        margin: 0 auto;
        padding: 1rem 0 2rem;
      }

      .topbar {
        display: flex;
        min-height: 3rem;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 0.75rem;
      }

      .brand {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 0.65rem;
      }

      .mark {
        display: grid;
        width: 2rem;
        height: 2rem;
        flex: none;
        place-items: center;
        border: 1px solid #514691;
        border-radius: 0.65rem;
        background: linear-gradient(145deg, #2a2351, #171426);
        color: #d7d0ff;
        font-weight: 800;
        letter-spacing: -0.08em;
      }

      h1 {
        margin: 0;
        overflow: hidden;
        font-size: 1rem;
        letter-spacing: -0.02em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .runtime-status {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 0.42rem;
        padding: 0.35rem 0.5rem;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 0.72rem;
      }

      .status-dot {
        width: 0.42rem;
        height: 0.42rem;
        flex: none;
        border-radius: 50%;
        background: #71809c;
      }

      .runtime-status[data-state="running"] .status-dot {
        background: var(--success);
      }

      .runtime-status[data-state="error"] .status-dot {
        background: var(--danger);
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(24rem, 1fr) minmax(0, 1.15fr);
        min-height: 38rem;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 1rem;
        background: rgb(7 10 16 / 78%);
        box-shadow: 0 1.5rem 5rem rgb(0 0 0 / 28%);
      }

      .editor-pane,
      .preview-pane {
        min-width: 0;
      }

      .editor-pane {
        display: flex;
        min-height: 38rem;
        flex-direction: column;
        border-right: 1px solid var(--border);
        background: var(--panel-strong);
      }

      .pane-toolbar,
      .preview-head {
        display: flex;
        min-height: 3rem;
        align-items: center;
        justify-content: space-between;
        gap: 0.8rem;
        padding: 0 0.8rem;
        border-bottom: 1px solid var(--border);
      }

      .file-label,
      .preview-title {
        color: #d5dbea;
        font-size: 0.78rem;
        font-weight: 700;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 0.38rem;
      }

      .secondary-button,
      .primary-button {
        appearance: none;
        border: 1px solid var(--border-strong);
        border-radius: 0.58rem;
        padding: 0.46rem 0.68rem;
        cursor: pointer;
        font-size: 0.76rem;
        font-weight: 700;
      }

      .secondary-button {
        background: #171d2a;
        color: #d9deeb;
      }

      .secondary-button:hover:not(:disabled) {
        background: #20283a;
      }

      .primary-button {
        border-color: #7061d1;
        background: #6658c6;
        color: white;
      }

      .primary-button:hover:not(:disabled) {
        background: #7567d6;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.48;
      }

      .editor-stack,
      .editor-panel {
        display: flex;
        min-height: 0;
        flex: 1;
      }

      .editor-panel {
        width: 100%;
        flex-direction: column;
      }

      textarea {
        display: block;
        width: 100%;
        min-height: 0;
        flex: 1;
        resize: none;
        border: 0;
        padding: 1rem 1.05rem 1.4rem 3.25rem;
        background:
          linear-gradient(90deg, #0b0f18 0 2.55rem, transparent 2.55rem),
          var(--code);
        color: #dce4f7;
        font: 0.82rem/1.58 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
        tab-size: 4;
        caret-color: #d6d0ff;
      }

      .editor-footer {
        display: flex;
        min-height: 2.35rem;
        align-items: center;
        padding: 0.48rem 0.8rem;
        border-top: 1px solid var(--border);
        color: var(--muted-2);
        font-size: 0.7rem;
      }

      #patch-status {
        min-width: 0;
        overflow: hidden;
        color: #9aa9c4;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #patch-status[data-state="applied"] {
        color: var(--success);
      }

      #patch-status[data-state="error"] {
        color: var(--danger);
      }

      .preview-pane {
        display: flex;
        min-height: 38rem;
        flex-direction: column;
        background:
          radial-gradient(circle at 50% 42%, rgb(62 70 100 / 16%), transparent 22rem),
          #090c13;
      }

      .canvas-wrap {
        display: grid;
        min-height: 0;
        flex: 1;
        place-items: center;
        padding: clamp(0.8rem, 2vw, 1.4rem);
      }

      .canvas-frame {
        position: relative;
        width: 100%;
        max-width: 44rem;
        align-self: center;
        justify-self: center;
      }

      .canvas-frame::before {
        display: block;
        padding-top: 56.25%;
        content: "";
      }

      canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        border: 1px solid #202a3e;
        border-radius: 0.8rem;
        background: #090c13;
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 2%);
      }

      /*
       * These surfaces are still produced/updated by the current runtime JS for
       * diagnostics and compatibility, but they are deliberately not part of
       * the default public playground chrome. Follow-up #880 work removes the
       * legacy DOM hooks once the UI/runtime state split is complete.
       */
      .selected-example,
      .badges,
      .metrics,
      .shortcut {
        display: none !important;
      }

      @media (max-width: 68rem) {
        .workspace {
          grid-template-columns: 1fr;
        }

        .editor-pane {
          min-height: 31rem;
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }

        .preview-pane {
          min-height: 30rem;
        }
      }

      @media (max-width: 44rem) {
        .shell {
          width: min(100% - 1rem, 92rem);
          padding-top: 0.6rem;
        }

        .topbar {
          min-height: 2.6rem;
          margin-bottom: 0.55rem;
        }

        .runtime-status {
          max-width: 48%;
          overflow: hidden;
        }

        #status-text {
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .workspace {
          border-radius: 0.8rem;
        }

        .pane-toolbar {
          padding: 0 0.6rem;
        }

        .actions button {
          min-width: 4.5rem;
        }

        textarea {
          min-height: 25rem;
          padding-left: 0.85rem;
          background: var(--code);
          font-size: 0.76rem;
        }

        .preview-pane {
          min-height: 25rem;
        }

        .canvas-wrap {
          padding: 0.55rem;
        }

        .canvas-frame::before {
          padding-top: 75%;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="mark" aria-hidden="true">N</div>
          <h1>Noon Playground</h1>
        </div>
        <output id="status" class="runtime-status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-text">Loading…</span>
        </output>
      </header>

      <section class="workspace" aria-label="Noon interactive playground">
        <section class="editor-pane" aria-label="Python editor">
          <div class="pane-toolbar">
            <span class="file-label">main.py</span>
            <div class="actions">
              <button id="replace-scene" class="primary-button" type="button" disabled>
                Run
              </button>
            </div>
          </div>

          <div class="editor-stack">
            <div id="scene-editor-panel" class="editor-panel">
              <textarea
                id="python-scene-source"
                aria-label="Python scene source"
                autocomplete="off"
                autocorrect="off"
                spellcheck="false"
              ></textarea>
            </div>
          </div>

          <footer class="editor-footer">
            <output id="patch-status" aria-live="polite">Loading Python examples…</output>
          </footer>

          <!--
            Temporary internal compatibility hooks for main.js. They are not public UI.
            Remove with the #880 JS/state cleanup once patch-era references are deleted.
          -->
          <div hidden aria-hidden="true">
            <button id="scene-tab" type="button"></button>
            <button id="patch-tab" type="button"></button>
            <button id="apply-patch" type="button" disabled></button>
            <div id="patch-editor-panel">
              <textarea id="python-source" aria-label="Internal Python patch source"></textarea>
            </div>
          </div>
        </section>

        <section class="preview-pane" aria-label="Animation preview">
          <div class="preview-head">
            <span class="preview-title">Preview</span>
          </div>
          <div class="canvas-wrap">
            <div class="canvas-frame">
              <canvas id="scene" aria-label="Animated Noon scene"></canvas>
            </div>
          </div>

          <!-- Runtime metrics remain available to the current JS but are not default chrome. -->
          <div class="metrics" hidden aria-hidden="true">
            <output id="metric-objects">—</output>
            <output id="metric-draws">—</output>
            <output id="metric-upload">—</output>
            <output id="metric-time">—</output>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
