<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>Noon updater callback smoke</title>
  </head>
  <body>
    <script type="module">
      import { PythonAuthoringClient } from "./authoring-client.js";
      import { AuthoringExecutionClient } from "./authoring-execution-client.js";

      const authoring = new PythonAuthoringClient();
      const readyPromise = authoring.ready();

      window.noonUpdaterSmoke = {
        ready: () => readyPromise,
        run: async (source, times) => {
          await readyPromise;
          const authored = await authoring.run(source);
          if (authored.semanticExecution === null) {
            throw new Error("updater smoke requires canonical semantic execution");
          }

          const canvas = document.createElement("canvas");
          canvas.width = 640;
          canvas.height = 360;
          document.body.append(canvas);
          const execution = new AuthoringExecutionClient(canvas);
          try {
            const ready = await execution.startSemanticExecution(authored.semanticExecution, {
              authoringClient: authoring,
              loopDurationSeconds: 1,
              transportMode: "transferable",
            });
            const paused = await execution.pause();
            if (paused.time > times[0]) {
              throw new Error(`updater smoke advanced past ${times[0]} before pause`);
            }

            const phases = [];
            for (const time of times) {
              const advanced = await execution.advanceToWithRendererObservation(time);
              if (advanced.time !== time || advanced.playing !== false) {
                throw new Error(`updater smoke did not remain paused at ${time}`);
              }
              if (advanced.rendererObservation?.outcome !== "presented") {
                throw new Error(
                  `updater publication was not presented: ${JSON.stringify(advanced)}`,
                );
              }
              phases.push(advanced.rendererObservation);
            }
            return {
              result: authored,
              ready,
              paused,
              phases,
              state: await execution.state(),
              metrics: await execution.metrics(),
            };
          } finally {
            execution.terminate();
            canvas.remove();
          }
        },
      };
    </script>
  </body>
</html>
