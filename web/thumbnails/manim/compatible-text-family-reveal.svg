  <g font-family="DejaVu Sans Mono, monospace" font-weight="700" fill="#f8fafc">
    <text x="68" y="69" font-size="31">I</text>
    <text x="151" y="69" font-size="31">LONG</text>
    <text x="68" y="131" font-size="25">ONE</text>
  </g>
  <rect x="227" y="108" width="29" height="29" fill="none" stroke="#58c4dd" stroke-width="5"/>
  <path d="M112 82h110" stroke="#f8fafc" stroke-width="3" stroke-dasharray="8 7" opacity="0.7"/>
  <path d="M221 82l-11-6v12z" fill="#f8fafc" opacity="0.8"/>
