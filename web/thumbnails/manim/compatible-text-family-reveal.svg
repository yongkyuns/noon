<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Text family reveal</title>
  <desc id="desc">I and LONG reveal from left to right above a moving square</desc>
