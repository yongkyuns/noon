name: Apply Manim style parity patch

on:
  push:
    branches:
      - parity/manim-vmobject-style

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parity/manim-vmobject-style
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/_apply_manim_style_parity.py
      - name: Validate Python syntax
        run: python3 -m py_compile web/python/_manim_phase_b.py web/python/_manim_semantic_handles.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: match Manim VMobject default style and Cairo stroke units"
          git push origin HEAD:parity/manim-vmobject-style
