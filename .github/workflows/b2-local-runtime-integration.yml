name: B2 local timeline integration

on:
  push:
    branches:
      - arch/b2-slot-storage

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/b2-slot-storage
          fetch-depth: 0

      - name: Apply local timeline migration
        run: python3 scripts/b2_local_runtime_integration.py

      - name: Format and validate runtime slice
        run: |
          cargo fmt --all
          cargo clippy -p noon-compile -p noon-runtime -p noon-render-wgpu -p noon-web --all-targets --all-features -- -D warnings
          cargo test -p noon-compile --all-features
          cargo test -p noon-runtime --all-features
          cargo test -p noon-render-wgpu --all-features
          cargo test -p noon-web --all-features

      - name: Commit integrated source and remove helpers
        run: |
          rm .github/workflows/b2-local-runtime-integration.yml scripts/b2_local_runtime_integration.py
          git config user.name "Yongkyun Shin"
          git config user.email "yongkyuns@gmail.com"
          git add -A
          git commit -m "Relower only affected runtime timeline channels"
          git push origin HEAD:arch/b2-slot-storage
