name: Apply parity stroke slice

on:
  push:
    branches:
      - agent/parity-185-stroke-create

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply screen-space stroke parity slice
        shell: bash
        run: |
          cat > /tmp/apply-parity179.b64 <<'B64'
          
          
          
          ''      
          B64
          base64 -d /tmp/apply-parity179.b64 > /tmp/apply-parity179.py
          python3 /tmp/apply-parity179.py

      - name: Validate formatting and focused tests
        shell: bash
        run: |
          rustup component add rustfmt
          cargo fmt --all
          python3 -m unittest discover -s web/python -p 'test_*.py'
          node --check scripts/manim-compat-smoke.mjs
          cargo check --workspace --all-targets --all-features
          cargo test -p noon-ir -p noon-runtime -p noon-render-wgpu --all-features

      - name: Commit validated parity slice
        shell: bash
        run: |
          rm .github/workflows/agent-source-snapshot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Match Manim screen-space stroke defaults'
          git push
