name: Apply agent parity patch

on:
  push:
    branches:
      - agent/parity-185-stroke-create

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and apply exact patch
        shell: bash
        run: |
          cat .github/agent-parity185/chunk*.py.part > /tmp/apply_parity179.py
          python /tmp/apply_parity179.py
          python -m py_compile web/python/_manim_compat.py web/python/_manim_updaters.py web/python/_noon_ir.py
          node --check scripts/manim-compat-smoke.mjs
          python -m unittest discover -s web/python -p 'test_*.py'
          git diff --check

      - name: Commit source and remove transport files
        shell: bash
        run: |
          rm -rf .github/agent-parity185
          rm .github/workflows/agent-source-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Match Manim screen-space stroke and VMobject defaults"
          git push origin HEAD:agent/parity-185-stroke-create
