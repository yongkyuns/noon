name: Temporary regression repair v4

on:
  push:
    branches:
      - fix/playground-regression-gate

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/playground-regression-gate
      - name: Patch renderer failure injection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/renderer-init-failure-smoke.mjs")
          text = p.read_text()
          old = '''  await unavailablePage.addInitScript(() => {\n    const originalGetContext = HTMLCanvasElement.prototype.getContext;\n    Object.defineProperty(HTMLCanvasElement.prototype, "getContext", {\n      configurable: true,\n      value(type, ...args) {\n        const normalized = String(type).toLowerCase();\n        if (\n          normalized === "webgl" ||\n          normalized === "webgl2" ||\n          normalized === "experimental-webgl"\n        ) {\n          return null;\n        }\n        return originalGetContext.call(this, type, ...args);\n      },\n    });\n  });'''
          new = '''  await unavailablePage.addInitScript(() => {\n    const rejectWebGlContexts = (prototype) => {\n      if (!prototype || typeof prototype.getContext !== "function") return;\n      const originalGetContext = prototype.getContext;\n      Object.defineProperty(prototype, "getContext", {\n        configurable: true,\n        value(type, ...args) {\n          const normalized = String(type).toLowerCase();\n          if (\n            normalized === "webgl" ||\n            normalized === "webgl2" ||\n            normalized === "experimental-webgl"\n          ) {\n            return null;\n          }\n          return originalGetContext.call(this, type, ...args);\n        },\n      });\n    };\n    rejectWebGlContexts(HTMLCanvasElement.prototype);\n    if (typeof OffscreenCanvas !== "undefined") {\n      rejectWebGlContexts(OffscreenCanvas.prototype);\n    }\n  });'''
          if old not in text:
              raise SystemExit("renderer failure injection block changed unexpectedly")
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit repair
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "noreply@openai.com"
          git add scripts/renderer-init-failure-smoke.mjs
          git commit -m "test: inject WebGL loss into offscreen renderer"
          git push origin HEAD:fix/playground-regression-gate
