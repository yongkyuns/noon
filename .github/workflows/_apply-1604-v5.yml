name: Publish issue 1604 candidate

on:
  push:
    branches: [fix/1604-family-become-state-contract]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/1604-family-become-state-contract
      - name: Generate corrected source candidate
        run: |
          python3 .github/tmp/apply_1604.py
          python3 .github/tmp/post_apply_1604.py
          cargo fmt --all
          git diff --check
      - name: Publish only production and regression files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/noon-core/src/semantic_store/object_content.rs crates/noon/src/state_replacement.rs crates/noon/tests/family_state.rs
          git commit -m 'fix(become): preserve receiver-owned state on expansion'
          git push origin HEAD:fix/1604-family-become-state-contract
