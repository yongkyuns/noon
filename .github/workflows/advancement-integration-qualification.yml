name: Family callback translation qualification
on:
  push:
    branches: [codex/1349-full-landing]
permissions:
  contents: write
  actions: read
concurrency:
  group: family-callback-translation-qualification
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: 'true'
  SCCACHE_GHA_RW_MODE: READ_ONLY
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 0a2c32d81a1aede75f391ae0b39f410b83273fa7
          fetch-depth: 0
          path: source
      - name: Integrate the existing implementation without changing independent tests
        working-directory: source
        run: |
          mkdir -p "$RUNNER_TEMP/family-evidence"
          echo "EVIDENCE=$RUNNER_TEMP/family-evidence" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import ast, subprocess
          HEAD='0a2c32d81a1aede75f391ae0b39f410b83273fa7'
          BASE='dd23347d4675d13395468d4ccd1bc06c22c9e1bb'
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def text(ref,path): return subprocess.check_output(['git','show',f'{ref}:{path}'],text=True)
          def methods(s):
              return {n.name:ast.dump(n,include_attributes=False) for n in ast.walk(ast.parse(s)) if isinstance(n,ast.FunctionDef) and n.name.startswith('test_')}
          assert git('rev-parse','HEAD')==HEAD and not git('status','--porcelain')
          subprocess.run(['git','config','user.name','Noon development tooling'],check=True)
          subprocess.run(['git','config','user.email','development@noon.invalid'],check=True)
          subprocess.run(['git','merge','--no-ff','--no-commit',BASE])
          runner='scripts/typed-authoring-errors-smoke.mjs'
          assert set(git('diff','--name-only','--diff-filter=U').splitlines())=={runner}
          s=text(BASE,runner)
          assert s.count('assert.equal(report.python.additionalTests, 12);')==1
          Path(runner).write_text(s.replace('assert.equal(report.python.additionalTests, 12);','assert.equal(report.python.additionalTests, 13);'))
          p=Path('web/python/test_manim_group_animate_shared_target.py');s=p.read_text()
          old='                def setFill(self, *arguments):\n'
          assert s.count(old)==1
          s=s.replace(old,'''                def layout(self):
                              self.calls.append("layout")
                              return self

                          def shiftBy(self, x, y):
                              # This double observes forwarding, not shared Rust semantics.
                              self.calls.append(("shiftBy", float(x), float(y)))

                          def setFill(self, *arguments):
          '''.replace('          ', '', 1)) if False else s
          replacement=('                def layout(self):\n'
                       '                    self.calls.append("layout")\n'
                       '                    return self\n\n'
                       '                def shiftBy(self, x, y):\n'
                       '                    # This double observes forwarding, not shared Rust semantics.\n'
                       '                    self.calls.append(("shiftBy", float(x), float(y)))\n\n'
                       '                def setFill(self, *arguments):\n')
          s=s.replace(old,replacement,1)
          old=('            assert target_first._current_raw().transform["translation"]["x"] == 1.0\n'
               '            assert target_second._current_raw().transform["translation"]["x"] == 1.0\n'
               '            # Rust owns family paint semantics; this frontend test checks one dispatch.\n')
          replacement=('            # Shared Rust owns family translation and paint. The test double\n'
                       '            # records a single family dispatch; no leaf fallback may run here.\n'
                       '            assert target._semantic_family_handle.calls[:2] == ["layout", ("shiftBy", 1.0, 0.0)]\n'
                       '            assert not any(isinstance(call, tuple) and call[0] == "shift"\n'
                       '                           for handle in (target_first._semantic_handle, target_second._semantic_handle)\n'
                       '                           for call in handle.calls)\n')
          assert old in s
          p.write_text(s.replace(old,replacement))
          path='web/python/test_noon_errors_wasm.py'
          before=methods(text(BASE,path));after=methods(Path(path).read_text())
          assert len(before)==12 and len(after)==13
          assert all(after[name]==body for name,body in before.items())
          name='test_callback_family_shift_is_unique_and_atomic_with_same_phase_retry'
          assert after[name]==methods(text(HEAD,path))[name]
          for path in ('web/python/test_noon_callback_errors_wasm.py','crates/noon-web/src/authoring_error.rs'):
              assert Path(path).read_text()==text(BASE,path),path
          subprocess.run(['git','add','-A'],check=True)
          assert git('write-tree')=='0815cec4e627ed97e9cb5276a74ba078142464b9'
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','commit.gpgSign=false','-c','core.hooksPath=/dev/null','commit','-m','fix: preserve landed callback/content coverage and shared target dispatch'],check=True)
          assert not git('status','--porcelain')
          PY
          test "$(git ls-remote origin refs/heads/codex/1359-callback-family-translation | cut -f1)" = 0a2c32d81a1aede75f391ae0b39f410b83273fa7
          git push origin HEAD:refs/heads/codex/1359-integrated-candidate
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/family-evidence/revisions.txt"
          git diff dd23347d4675d13395468d4ccd1bc06c22c9e1bb HEAD > "$RUNNER_TEMP/family-evidence/product.patch"
          git archive --format=tar.gz --output="$RUNNER_TEMP/family-evidence/source.tar.gz" HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: family-translation-source
          path: ${{ runner.temp }}/family-evidence
          retention-days: 3
          if-no-files-found: error
      - uses: actions/download-artifact@v8
        with:
          name: r3-callback-final-qualification
          run-id: 34381814450
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline-input
      - name: Preserve the original qualified dependency lock
        working-directory: source
        run: |
          cp "$RUNNER_TEMP/baseline-input/Cargo.lock" Cargo.lock
          sha256sum Cargo.lock > "$EVIDENCE/lock-before.txt"
          { rustup show; node --version; python3 --version; } > "$EVIDENCE/toolchain.txt"
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: Linux-cargo-sources-${{ hashFiles('source/Cargo.toml', 'source/crates/**/Cargo.toml') }}
          restore-keys: |
            Linux-cargo-sources-
            provider-sources-Linux-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Execute shared atomicity and paired native callback tests
        working-directory: source
        run: |
          cargo test -p noon --no-default-features --test family_callback_translation --test family_callback_paint > "$EVIDENCE/native.log" 2>&1 || { tail -120 "$EVIDENCE/native.log"; exit 1; }
          cargo test -p noon --no-default-features --lib example_scenes::continuation_tests::ordinary_sparse_reads_cover_initial_signal_track_and_persistent_hold -- --exact >> "$EVIDENCE/native.log" 2>&1 || { tail -120 "$EVIDENCE/native.log"; exit 1; }
          grep -F 'ordinary_sparse_reads_cover_initial_signal_track_and_persistent_hold ... ok' "$EVIDENCE/native.log"
          cargo clippy --workspace --all-targets --all-features -- -D warnings > "$EVIDENCE/clippy.log" 2>&1 || { tail -120 "$EVIDENCE/clippy.log"; exit 1; }
          tail -25 "$EVIDENCE/native.log"
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: wasm-pack@0.15.0
      - name: Build the diagnostic package with the existing preflight
        working-directory: source
        run: |
          NOON_WASM_PROFILE=dev NOON_WASM_SKIP_OPT=1 bash scripts/build-web-demo.sh > "$EVIDENCE/dev-build.log" 2>&1 || { tail -140 "$EVIDENCE/dev-build.log"; exit 1; }
          cp -r web/pkg "$EVIDENCE/pkg"
          sha256sum web/pkg/* > "$EVIDENCE/package-hashes.txt"
          cp Cargo.lock "$EVIDENCE/Cargo.lock"
      - name: Install the existing browser runner dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Reproduce both defects using the retained original WASM, without rebuilding it
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast, hashlib, os, shutil, tarfile
          bundle=Path(os.environ['RUNNER_TEMP'])/'baseline-input'
          assert (bundle/'final-revisions.txt').read_text().splitlines()[0]=='8a19ea03af9e4e87f48ccb761b196dbb8061ceb5'
          binary=bundle/'pkg/noon_web_bg.wasm'
          assert hashlib.sha256(binary.read_bytes()).hexdigest()=='cab275e552ec61373f62eb68a3f0e17ac713cd2afde7b84e7238081d516821d4'
          root=Path('baseline'); root.mkdir()
          with tarfile.open(bundle/'source.tar.gz') as archive: archive.extractall(root,filter='data')
          shutil.copytree(bundle/'pkg',root/'web/pkg',dirs_exist_ok=True)
          source=Path('source/web/python/test_noon_errors_wasm.py').read_text()
          name='test_callback_family_shift_is_unique_and_atomic_with_same_phase_retry'
          method=next(n for n in ast.walk(ast.parse(source)) if isinstance(n,ast.FunctionDef) and n.name==name)
          addition='\n'+''.join(source.splitlines(keepends=True)[method.lineno-1:method.end_lineno])+'\n'
          p=root/'web/python/test_noon_errors_wasm.py'; old=p.read_text(); tree=ast.parse(old)
          cls=next(n for n in tree.body if isinstance(n,ast.ClassDef) and n.name=='WasmErrorProjectionTests')
          lines=old.splitlines(keepends=True); p.write_text(''.join(lines[:cls.end_lineno])+addition+''.join(lines[cls.end_lineno:]))
          p=root/'scripts/typed-authoring-errors-smoke.mjs'; s=p.read_text()
          assert s.count('assert.equal(report.python.additionalTests, 10);')==1
          p.write_text(s.replace('assert.equal(report.python.additionalTests, 10);','assert.equal(report.python.additionalTests, 11);'))
          Path(os.environ['EVIDENCE'],'baseline-wasm-sha256.txt').write_text(hashlib.sha256(binary.read_bytes()).hexdigest()+'\n')
          PY
          (cd baseline && node scripts/build-python-worker.mjs)
          set +e
          (cd baseline && NOON_TYPED_ERRORS_ARTIFACTS="$EVIDENCE/baseline-browser" node scripts/typed-authoring-errors-smoke.mjs) > "$EVIDENCE/baseline.log" 2>&1
          status=$?
          set -e
          test "$status" != 0
          grep -F 'alias received a second translation' "$EVIDENCE/baseline.log"
          grep -F 'late failure retained an earlier +1 write' "$EVIDENCE/baseline.log"
      - name: Qualify the unchanged new test and paired production callbacks
        working-directory: source
        run: |
          NOON_TYPED_ERRORS_ARTIFACTS="$EVIDENCE/typed-errors" node scripts/typed-authoring-errors-smoke.mjs > "$EVIDENCE/typed-errors.log" 2>&1 || { tail -130 "$EVIDENCE/typed-errors.log"; exit 1; }
          node scripts/shared-authoring-smoke.mjs > "$EVIDENCE/shared.log" 2>&1 || { tail -100 "$EVIDENCE/shared.log"; exit 1; }
          node scripts/manim-compat-smoke.mjs > "$EVIDENCE/manim.log" 2>&1 || { tail -100 "$EVIDENCE/manim.log"; exit 1; }
          git diff --exit-code
          sha256sum Cargo.lock > "$EVIDENCE/lock-after.txt"
          diff "$EVIDENCE/lock-before.txt" "$EVIDENCE/lock-after.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: family-translation-focused-qualification
          path: |
            ${{ runner.temp }}/family-evidence
            source/browser-smoke-artifacts/
          retention-days: 3
          if-no-files-found: error
