name: Family callback translation qualification
on:
  push:
    branches: [codex/1349-full-landing]
permissions:
  contents: write
  actions: read
concurrency:
  group: family-callback-translation-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e1e44eb1d381d24ddb375240fdb5c2692745c18a
          fetch-depth: 0
          path: source
      - uses: actions/download-artifact@v8
        with:
          name: family-translation-browser-qualification
          run-id: 34399111572
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/retained
      - name: Retain proven test correction and use f32-aware paired observations
        working-directory: source
        run: |
          mkdir -p "$RUNNER_TEMP/family-paired-evidence"
          echo "EVIDENCE=$RUNNER_TEMP/family-paired-evidence" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import ast, hashlib, os, shutil, subprocess, tarfile
          HEAD='e1e44eb1d381d24ddb375240fdb5c2692745c18a'
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse','HEAD')==HEAD and not git('status','--porcelain')
          roots=list((Path(os.environ['RUNNER_TEMP'])/'retained').rglob('revisions.txt'))
          assert len(roots)==1
          bundle=roots[0].parent
          assert roots[0].read_text().splitlines()==['7d86b419f85f199c1433bc63446ccfdd0a1b254d','09fdd6a1fb0a2f9ab9ec77adde388b2cb3ac2bfc']
          test='web/python/test_noon_errors_wasm.py'
          with tarfile.open(bundle/'source.tar.gz') as archive:
              for member in archive:
                  if member.isfile():
                      data=archive.extractfile(member).read()
                      if member.name==test:Path(test).write_bytes(data)
                      else:assert Path(member.name).read_bytes()==data,member.name
          for line in (bundle/'package-hashes.txt').read_text().splitlines():
              expected,path=line.split()
              assert hashlib.sha256((bundle/'pkg'/Path(path).name).read_bytes()).hexdigest()==expected,path
          assert hashlib.sha256((bundle/'pkg/noon_web_bg.wasm').read_bytes()).hexdigest()=='1a90e03338ba898fde8be9963c6e8e525eb652f7e98fb1983a7439a953edd744'
          shutil.copytree(bundle/'pkg','web/pkg',dirs_exist_ok=True)
          p=Path('web/python/examples/ordinary_callback_sparse_reads.py');s=p.read_text()
          old='        assert circle.get_center() == (-1.0, 1.0)'
          assert s.count(old)==1
          s=s.replace(old,'        center = circle.get_center()\n        assert abs(center.x + 1.0) < 1e-5 and abs(center.y - 1.0) < 1e-5, center')
          old='        assert circle.get_center() == (2.0, 1.0)'
          assert s.count(old)==1
          p.write_text(s.replace(old,'        center = circle.get_center()\n        assert abs(center.x - 2.0) < 1e-5 and abs(center.y - 1.0) < 1e-5, center'))
          subprocess.run(['git','add',test,str(p)],check=True)
          assert git('write-tree')=='38502b5c1fb0d3907b35543794fc9793d57bdc75'
          assert set(git('diff','--cached','--name-only').splitlines())=={test,str(p)}
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','config','user.name','Noon development tooling'],check=True)
          subprocess.run(['git','config','user.email','development@noon.invalid'],check=True)
          subprocess.run(['git','-c','commit.gpgSign=false','-c','core.hooksPath=/dev/null','commit','-m','test: respect effective-bound precision in paired family callback proof'],check=True)
          evidence=Path(os.environ['RUNNER_TEMP'])/'family-paired-evidence'
          (evidence/'revisions.txt').write_text(git('rev-parse','HEAD','HEAD^{tree}')+'\n')
          (evidence/'test-example.patch').write_text(subprocess.check_output(['git','diff',HEAD,'HEAD'],text=True))
          subprocess.run(['git','archive','--format=tar.gz','--output='+str(evidence/'source.tar.gz'),'HEAD'],check=True)
          shutil.copytree(bundle/'pkg',evidence/'pkg')
          shutil.copyfile(bundle/'package-hashes.txt',evidence/'package-hashes.txt')
          PY
      - name: Install only the existing browser dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Complete the paired production-worker examples on the identical WASM
        working-directory: source
        run: |
          node scripts/build-python-worker.mjs
          node scripts/shared-authoring-smoke.mjs > "$EVIDENCE/shared.log" 2>&1 || { tail -120 "$EVIDENCE/shared.log"; exit 1; }
          node scripts/manim-compat-smoke.mjs > "$EVIDENCE/manim.log" 2>&1 || { tail -120 "$EVIDENCE/manim.log"; exit 1; }
          git diff --exit-code
          sha256sum web/pkg/* > "$EVIDENCE/package-hashes-after.txt"
          diff "$EVIDENCE/package-hashes.txt" "$EVIDENCE/package-hashes-after.txt"
          test "$(git ls-remote origin refs/heads/codex/1359-callback-family-translation | cut -f1)" = e1e44eb1d381d24ddb375240fdb5c2692745c18a
          git push origin HEAD:refs/heads/codex/1359-integrated-candidate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: family-translation-paired-qualification
          path: |
            ${{ runner.temp }}/family-paired-evidence
            source/browser-smoke-artifacts/
          retention-days: 3
          if-no-files-found: error
