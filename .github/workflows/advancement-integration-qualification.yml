name: Family callback translation qualification
on:
  push:
    branches: [codex/1349-full-landing]
permissions:
  contents: write
  actions: read
concurrency:
  group: family-callback-translation-qualification
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: 'true'
  SCCACHE_GHA_RW_MODE: READ_ONLY
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 032d1cab2c92eaf9182553770526b56561a7575d
          fetch-depth: 0
      - name: Integrate the existing bounds and typed-producer changes without replacing either
        run: |
          mkdir -p "$RUNNER_TEMP/family-final-evidence"
          echo "EVIDENCE=$RUNNER_TEMP/family-final-evidence" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import ast, os, subprocess
          HEAD='032d1cab2c92eaf9182553770526b56561a7575d'
          MASTER='10e9597611dad4dc4d1917f39dc685143fd37f3c'
          PRODUCERS='3575a9c9c6524ccb739d19642c820fa645542564'
          E=Path(os.environ['RUNNER_TEMP'])/'family-final-evidence'
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          def source(ref,path):return subprocess.check_output(['git','show',f'{ref}:{path}'],text=True)
          def methods(s):
              nodes=[n for n in ast.walk(ast.parse(s)) if isinstance(n,ast.FunctionDef) and n.name.startswith('test_')]
              assert len(nodes)==len({n.name for n in nodes})
              return {n.name:ast.dump(n,include_attributes=False) for n in nodes}
          assert git('rev-parse','HEAD')==HEAD and not git('status','--porcelain')
          assert git('rev-parse','HEAD^{tree}')=='157fac4faafb24a3c2c6f7551dbf7237f259f101'
          subprocess.run(['git','config','user.name','Noon development tooling'],check=True)
          subprocess.run(['git','config','user.email','development@noon.invalid'],check=True)
          # This prerequisite combines published #1354 with landed master. It is
          # explicitly recorded as a qualification base, not an already-landed PR.
          tree=git('merge-tree','--write-tree',MASTER,PRODUCERS)
          assert len(tree)==40 and all(c in '0123456789abcdef' for c in tree)
          base=subprocess.check_output(['git','commit-tree',tree,'-p',MASTER,'-p',PRODUCERS],input='Qualification prerequisite: existing typed producers plus landed master\n',text=True).strip()
          result=subprocess.run(['git','-c','core.hooksPath=/dev/null','merge','--no-ff','--no-commit',base],capture_output=True,text=True)
          (E/'merge.log').write_text(result.stdout+result.stderr)
          assert result.returncode in (0,1)
          runner='scripts/typed-authoring-errors-smoke.mjs'
          conflicts=set(git('diff','--name-only','--diff-filter=U').splitlines())
          assert conflicts <= {runner}, conflicts
          before_runner=source(base,runner)
          old='assert.equal(report.python.additionalTests, 12);'
          assert before_runner.count(old)==1
          Path(runner).write_text(before_runner.replace(old,'assert.equal(report.python.additionalTests, 13);'))
          subprocess.run(['git','add',runner],check=True)
          assert not git('diff','--name-only','--diff-filter=U')
          allowed={'crates/noon-web/src/canonical_authoring_scene.rs','crates/noon/src/example_scenes.rs','crates/noon/src/family_callback_translation.rs','crates/noon/src/host_callbacks.rs','crates/noon/src/lib.rs','crates/noon/tests/family_callback_translation.rs','scripts/typed-authoring-errors-smoke.mjs','web/python/_manim_compat.py','web/python/_manim_semantic_handles.py','web/python/_manim_updaters.py','web/python/examples/ordinary_callback_sparse_reads.py','web/python/test_manim_callback_family_translation.py','web/python/test_manim_group_animate_shared_target.py','web/python/test_noon_errors_wasm.py'}
          changed=set(git('diff','--cached','--name-only',base).splitlines())
          assert changed==allowed, changed ^ allowed
          for path in allowed-{'crates/noon-web/src/canonical_authoring_scene.rs','crates/noon/src/example_scenes.rs','crates/noon/src/host_callbacks.rs','crates/noon/src/lib.rs',runner}:
              assert Path(path).read_text()==source(HEAD,path),path
          for path in ('crates/noon-web/src/authoring_error.rs','web/python/test_noon_callback_errors_wasm.py','crates/noon/src/family_callback_paint.rs'):
              assert Path(path).read_text()==source(base,path),path
          main='web/python/test_noon_errors_wasm.py';cb='web/python/test_noon_callback_errors_wasm.py'
          before=methods(source(base,main));after=methods(Path(main).read_text())
          assert len(before)==12 and len(after)==13 and all(after[n]==v for n,v in before.items())
          assert len(methods(Path(cb).read_text()))==8
          assert 'assert.equal(report.python.callbackTests, 8);' in Path(runner).read_text()
          subprocess.run(['cargo','fmt','--all','--','--check'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','diff','--cached','--exit-code','--','.github/workflows'],check=True)
          subprocess.run(['git','-c','commit.gpgSign=false','-c','core.hooksPath=/dev/null','commit','-m','fix: integrate bounded family translation with typed producer causes'],check=True)
          (E/'revisions.txt').write_text(git('rev-parse','HEAD','HEAD^{tree}')+'\n'+base+'\n'+tree+'\n')
          (E/'inputs.txt').write_text('bounds='+HEAD+'\nmaster='+MASTER+'\nproducers='+PRODUCERS+'\n')
          (E/'product.patch').write_text(subprocess.check_output(['git','diff',base,'HEAD'],text=True))
          (E/'prerequisite.patch').write_text(subprocess.check_output(['git','diff',MASTER,base],text=True))
          (E/'test-inventory.txt').write_text('\n'.join(sorted(after))+'\nmain=13\ncallback=8\nmatrices=10+29+9+11 per language\n')
          subprocess.run(['git','archive','--format=tar.gz','--output='+str(E/'source.tar.gz'),'HEAD'],check=True)
          subprocess.run(['git','archive','--format=tar.gz','--output='+str(E/'base-source.tar.gz'),base],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as env:env.write('LANDING_BASE='+base+'\n')
          print('Final qualification source',git('rev-parse','HEAD','HEAD^{tree}'),'base',base,tree)
          PY
          test "$(git ls-remote origin refs/heads/codex/1359-callback-family-translation | cut -f1)" = 032d1cab2c92eaf9182553770526b56561a7575d
          git push origin HEAD:refs/heads/codex/1359-callback-family-translation
      - uses: actions/upload-artifact@v7
        with:
          name: family-translation-corrected-source
          path: ${{ runner.temp }}/family-final-evidence
          retention-days: 3
          if-no-files-found: error
      - uses: actions/download-artifact@v8
        with:
          name: family-translation-focused-qualification
          run-id: 34397811300
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/retained
      - name: Reuse the qualified dependency lock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,os
          locks=list((Path(os.environ['RUNNER_TEMP'])/'retained').rglob('Cargo.lock'))
          assert locks
          data=locks[0].read_bytes()
          assert hashlib.sha256(data).hexdigest()=='9fc77831ae25df351229c9902c073657062501a8e5faf8ea313dd9c8284062dd'
          Path('Cargo.lock').write_bytes(data)
          PY
          sha256sum Cargo.lock > "$EVIDENCE/lock-before.txt"
          { rustup show; node --version; python3 --version; } > "$EVIDENCE/toolchain.txt"
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: Linux-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            Linux-cargo-sources-
            provider-sources-Linux-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: wasm-pack@0.15.0
      - name: Qualify corrected numeric admission and typed integration through the full gate
        run: |
          bash scripts/check.sh full "$LANDING_BASE" > "$EVIDENCE/full.log" 2>&1 || { tail -180 "$EVIDENCE/full.log"; exit 1; }
          git diff --exit-code
          sha256sum Cargo.lock > "$EVIDENCE/lock-after.txt"
          diff "$EVIDENCE/lock-before.txt" "$EVIDENCE/lock-after.txt"
          cp -r web/pkg "$EVIDENCE/release-pkg"
          sha256sum web/pkg/* > "$EVIDENCE/release-package-hashes.txt"
          tail -25 "$EVIDENCE/full.log"
      - name: Build the diagnostic package for retained debug fixtures
        run: |
          NOON_SKIP_WEB_PREFLIGHT=1 NOON_WASM_PROFILE=dev NOON_WASM_SKIP_OPT=1 bash scripts/build-web-demo.sh > "$EVIDENCE/dev-build.log" 2>&1 || { tail -140 "$EVIDENCE/dev-build.log"; exit 1; }
          cp -r web/pkg "$EVIDENCE/pkg"
          cp Cargo.lock "$EVIDENCE/Cargo.lock"
          sha256sum web/pkg/* > "$EVIDENCE/package-hashes.txt"
      - name: Install existing browser dependencies without an APT retry
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Execute all independent tests and paired callback examples
        run: |
          NOON_TYPED_ERRORS_ARTIFACTS="$EVIDENCE/typed-errors" node scripts/typed-authoring-errors-smoke.mjs > "$EVIDENCE/typed-errors.log" 2>&1 || { tail -140 "$EVIDENCE/typed-errors.log"; exit 1; }
          node scripts/shared-authoring-smoke.mjs > "$EVIDENCE/shared.log" 2>&1 || { tail -120 "$EVIDENCE/shared.log"; exit 1; }
          node scripts/manim-compat-smoke.mjs > "$EVIDENCE/manim.log" 2>&1 || { tail -120 "$EVIDENCE/manim.log"; exit 1; }
          git diff --exit-code
          git archive --format=tar.gz --output="$EVIDENCE/source-after.tar.gz" HEAD
          sha256sum web/pkg/* > "$EVIDENCE/package-hashes-after.txt"
          diff "$EVIDENCE/package-hashes.txt" "$EVIDENCE/package-hashes-after.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: family-translation-corrected-full
          path: |
            ${{ runner.temp }}/family-final-evidence
            browser-smoke-artifacts/
          retention-days: 3
          if-no-files-found: error
