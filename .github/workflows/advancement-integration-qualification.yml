name: Family callback translation qualification
on:
  push:
    branches: [codex/1349-full-landing]
permissions:
  contents: read
  actions: write
  pull-requests: read
concurrency:
  group: family-callback-translation-run-approval
  cancel-in-progress: false
jobs:
  approve-existing-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Approve only the existing held checks for the user-authorized PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          root='https://api.github.com/repos/yongkyuns/noon'
          head='a158fc1e3e49ac17f8103309d1429ed1027eafac'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def request(path,method='GET'):
              req=urllib.request.Request(root+path,headers=headers,method=method,data=b'{}' if method=='POST' else None)
              with urllib.request.urlopen(req,timeout=30) as response:
                  raw=response.read()
                  return response.status,json.loads(raw) if raw else None
          _,pr=request('/pulls/1360')
          assert pr['state']=='open' and pr['head']['sha']==head
          runs=[34400433608,34400433639,34400433563,34400433671,34400433641,34400433485,34400433637,34400433400,34400433502,34400433462,34400433595]
          evidence=[]
          for run_id in runs:
              _,run=request(f'/actions/runs/{run_id}')
              assert run['head_sha']==head and run['event']=='pull_request'
              row={'run':run_id,'head':head,'before':run['conclusion'],'name':run['name']}
              if run['conclusion']=='action_required':
                  row['approval_status'],_=request(f'/actions/runs/{run_id}/approve','POST')
                  assert row['approval_status']==201
              else:row['approval_status']='not required'
              evidence.append(row)
              print(json.dumps(row),flush=True)
          Path('approval-evidence.json').write_text(json.dumps(evidence,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: family-translation-pr-run-approvals
          path: approval-evidence.json
          retention-days: 3
          if-no-files-found: error
