name: Apply #1366 diagnostic observation fixes

on:
  push:
    branches:
      - codex/1366-webgpu-device-loss
    paths:
      - ".github/workflows/codex-1366-observation-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/1366-webgpu-device-loss
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded observation corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/renderer-webgpu-validation-error-smoke.mjs')
          s = p.read_text()
          old = '''function collectBrowserErrors(page) {\n  const pageErrors = [];\n  const consoleErrors = [];\n  page.on("pageerror", (error) => pageErrors.push(String(error)));\n  page.on("console", (message) => {\n    if (message.type() === "error") consoleErrors.push(message.text());\n  });\n  return { pageErrors, consoleErrors };\n}\n'''
          new = '''function collectBrowserErrors(page) {\n  const pageErrors = [];\n  const consoleErrors = [];\n  const consoleWarnings = [];\n  page.on("pageerror", (error) => pageErrors.push(String(error)));\n  page.on("console", (message) => {\n    if (message.type() === "error") consoleErrors.push(message.text());\n    if (message.type() === "warning") consoleWarnings.push(message.text());\n  });\n  return { pageErrors, consoleErrors, consoleWarnings };\n}\n'''
          assert old in s
          s = s.replace(old, new, 1)

          start = s.index('async function waitForHostGpuError(page) {')
          end = s.index('\nfunction changedPixelCount', start)
          replacement = '''async function waitForHostGpuDiagnostic(page, browserErrors) {\n  let lastMetrics = null;\n  for (let attempt = 0; attempt < 40; attempt += 1) {\n    lastMetrics = await page.evaluate((time) => window.noonSmoke.renderAt(time), sampleTime);\n    const warning = browserErrors.consoleWarnings.find((message) =>\n      /WebGPU generation 1 validation:/i.test(message),\n    );\n    if (warning) return { warning, metrics: lastMetrics };\n    await new Promise((resolve) => setTimeout(resolve, 10));\n  }\n  throw new Error(\n    `recoverable WebGPU validation diagnostic never reached the host; last metrics=${JSON.stringify(lastMetrics)}`,\n  );\n}\n'''
          s = s[:start] + replacement + s[end:]

          old = '''  const hostError = await waitForHostGpuError(page);\n  assert.match(\n    hostError,\n    /WebGPU generation 1 validation error:/,\n    `host GPU error lacks backend/generation context: ${hostError}`,\n  );'''
          new = '''  const hostDiagnostic = await waitForHostGpuDiagnostic(page, browserErrors);\n  assert.match(\n    hostDiagnostic.warning,\n    /WebGPU generation 1 validation:/,\n    `host GPU diagnostic lacks backend/generation context: ${hostDiagnostic.warning}`,\n  );'''
          assert old in s
          s = s.replace(old, new, 1)
          assert '    hostError,\n    afterErrorMetrics,' in s
          s = s.replace('    hostError,\n    afterErrorMetrics,', '    hostDiagnostic,\n    afterErrorMetrics,', 1)
          p.write_text(s)

          p = Path('scripts/renderer-worker-webgpu-validation-error-smoke.mjs')
          s = p.read_text()
          marker = 'const diagnostics = {};\n'
          helper = '''const diagnostics = {};\nconst stringifyDiagnostics = (value) => JSON.stringify(\n  value,\n  (_key, item) => typeof item === "bigint" ? item.toString() : item,\n  2,\n);\n'''
          assert marker in s
          s = s.replace(marker, helper, 1)
          s = s.replace('JSON.stringify(diagnosticMetrics)', 'stringifyDiagnostics(diagnosticMetrics)')
          s = s.replace('JSON.stringify(diagnostics, null, 2)', 'stringifyDiagnostics(diagnostics)')
          p.write_text(s)
          PY

          node --check scripts/renderer-webgpu-validation-error-smoke.mjs
          node --check scripts/renderer-worker-webgpu-validation-error-smoke.mjs
          node --test web/render-gpu-diagnostics.test.mjs
          git diff --check

      - name: Commit corrections and remove helper
        run: |
          rm .github/workflows/codex-1366-observation-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: observe recoverable WebGPU diagnostics"
          git push origin HEAD:codex/1366-webgpu-device-loss
