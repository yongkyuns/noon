name: Generic Transform implementation gate

on:
  push:
    branches:
      - agent/generic-transform-implementation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generic-transform-implementation
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/generic-transform-implementation

      - name: Apply generic Transform implementation
        run: python3 scripts/apply_generic_transform.py

      - name: Use stable Rust
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown

      - name: Format generated Rust
        run: cargo fmt --all

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-noon-generic-transform-${{ hashFiles('crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-noon-generic-transform-
            ${{ runner.os }}-noon-arch-

      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test geometry correctness invariants
        run: cargo test -p noon-geometry --test tessellation_correctness

      - name: Test workspace
        run: cargo test --workspace --all-features

      - name: Compile WebGPU renderer for browser
        run: cargo check -p noon-render-wgpu --target wasm32-unknown-unknown --no-default-features --features web

      - name: Compile browser runtime
        run: cargo check -p noon-web --target wasm32-unknown-unknown

      - name: Build and validate browser package
        run: bash scripts/build-web-demo.sh

      - name: Publish validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            crates/noon-core/src/lib.rs \
            crates/noon-core/src/timeline.rs \
            crates/noon-compile/src/lib.rs \
            crates/noon-runtime/src/lib.rs \
            web/python/noon.py \
            web/python/test_examples.py
          if git diff --cached --quiet; then
            echo "No implementation changes to publish"
          else
            git commit -m "Implement atomic generic Transform tracks"
            git push origin HEAD:agent/generic-transform-implementation
          fi
