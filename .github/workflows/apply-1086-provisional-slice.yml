name: Build 1086 provisional semantic ref slice

on:
  push:
    branches:
      - a1-1086-provisional-staging

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build clean implementation commit
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/apply-1086-provisional.py /tmp/apply-1086.py
          cp scripts/1086-family_edges.rs /tmp/family_edges.rs
          cp scripts/1086-pending_node_tests.rs /tmp/pending_node_tests.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard b355ef6fb1cc67bd00e75bb458bbb5194f5fb24d
          python3 /tmp/apply-1086.py
          cp /tmp/family_edges.rs crates/noon-core/src/reactive/semantic_transaction/family_edges.rs
          cp /tmp/pending_node_tests.rs crates/noon-core/src/reactive/semantic_transaction/pending_node_tests.rs
          git add crates/noon-core/src/reactive/semantic_transaction.rs \
                  crates/noon-core/src/reactive/semantic_transaction/family_edges.rs \
                  crates/noon-core/src/reactive/semantic_transaction/pending_node_tests.rs
          git commit -m "A1: add transaction-local semantic node references"

      - name: Use pinned Rust toolchain
        run: rustup component add rustfmt clippy

      - name: Format
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git add -A
          git commit --amend --no-edit
          cargo fmt --all -- --check

      - name: Clippy noon-core
        run: cargo clippy -p noon-core --all-targets --all-features -- -D warnings

      - name: Test noon-core
        run: cargo test -p noon-core --all-features

      - name: Publish implementation branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list --count b355ef6fb1cc67bd00e75bb458bbb5194f5fb24d..HEAD)" -eq 1
          git push --force origin HEAD:a1-transaction-local-semantic-refs
