name: B2 sync current master

on:
  push:
    branches:
      - arch/b2-incremental-runtime

permissions:
  contents: write

concurrency:
  group: b2-sync-current-master
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/b2-incremental-runtime
          fetch-depth: 1
      - name: Merge current master
        run: |
          git config user.name "Yongkyun Shin"
          git config user.email "yongkyuns@gmail.com"
          git fetch --deepen=32 origin arch/b2-incremental-runtime master
          git merge --no-edit origin/master
      - name: Validate focused architecture
        run: |
          cargo fmt --all -- --check
          cargo clippy -p noon-compile -p noon-runtime -p noon-render-wgpu -p noon-web --all-targets --all-features -- -D warnings
          cargo test -p noon-compile --all-features
          cargo test -p noon-runtime --all-features
          cargo test -p noon-render-wgpu --all-features
          cargo test -p noon-web --all-features
      - name: Remove helper and push
        run: |
          rm .github/workflows/b2-sync-master.yml
          git add -A
          git commit -m "Sync B2 work with current master"
          git push origin HEAD:arch/b2-incremental-runtime
