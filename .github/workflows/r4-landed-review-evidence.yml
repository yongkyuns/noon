name: R4 landed-source review evidence
on:
  push:
    branches: [codex/1347-landed-review-evidence]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INTEGRATION_SHA: 1691d74309cb08321015a8ed3781b5551a0ec7c0
      BASE_SHA: 73af2196f06cc1df2a5d239a007d1c45ce5ebafb
      PRODUCT_SHA: 6ba1656ac0bbb0956c90ae3eba6e519b8ecaeca6
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1691d74309cb08321015a8ed3781b5551a0ec7c0
          fetch-depth: 2
          persist-credentials: false
      - name: Use repository Rust toolchain
        run: |
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Verify unchanged integration and all root-order tests
        run: |
          set -o pipefail
          mkdir -p /tmp/r4-integration-evidence
          git show -s --format='%H%n%P%n%T%n%s' HEAD | tee /tmp/r4-integration-evidence/revisions.txt
          test "$(git rev-parse HEAD)" = "$INTEGRATION_SHA"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$PRODUCT_SHA"
          test "$(git rev-parse HEAD^{tree})" = 5f693de5f0a6c4149eee92925f06859f78d64b30
          cargo test -p noon --no-default-features --test root_order_acceptance --test root_order_transaction_regressions --test root_order_alias_regressions --no-fail-fast -- --nocapture 2>&1 | tee /tmp/r4-integration-evidence/focused.log
          git diff --exit-code
      - name: Qualify integrated fast Rust and architecture gates
        run: |
          set -o pipefail
          bash scripts/check.sh fast "$BASE_SHA" 2>&1 | tee /tmp/r4-integration-evidence/fast.log
      - name: Qualify integrated direct WASM compilation
        run: |
          set -o pipefail
          cargo check -p noon-web --all-features --target wasm32-unknown-unknown 2>&1 | tee /tmp/r4-integration-evidence/wasm.log
          git diff --exit-code
      - name: Retain source and exact integration diagnostics
        if: always()
        run: |
          mkdir -p /tmp/r4-integration-evidence
          git show -s --format='%H%n%P%n%T%n%s' HEAD > /tmp/r4-integration-evidence/final-revisions.txt
          git diff --full-index --binary "$BASE_SHA" HEAD > /tmp/r4-integration-evidence/product.patch
          git ls-tree -r HEAD -- crates/noon/src/execution_session/publication.rs crates/noon/tests/root_order_transaction_regressions.rs > /tmp/r4-integration-evidence/source-blobs.txt
          git status --porcelain > /tmp/r4-integration-evidence/worktree-status.txt
          rustc --version > /tmp/r4-integration-evidence/toolchain.txt
          cargo --version >> /tmp/r4-integration-evidence/toolchain.txt
          cp crates/noon/src/execution_session/publication.rs /tmp/r4-integration-evidence/
          cp crates/noon/tests/root_order_transaction_regressions.rs /tmp/r4-integration-evidence/
          test ! -f Cargo.lock || cp Cargo.lock /tmp/r4-integration-evidence/
          sha256sum /tmp/r4-integration-evidence/*.rs > /tmp/r4-integration-evidence/source-sha256.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r4-root-domain-integration-qualification
          path: /tmp/r4-integration-evidence
          retention-days: 7
          if-no-files-found: error
