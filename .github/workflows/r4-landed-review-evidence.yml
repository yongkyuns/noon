name: R4 landed-source review evidence
on:
  push:
    branches: [codex/1347-landed-review-evidence]
permissions:
  contents: read
  actions: read
jobs:
  browser-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 65fa129a0370b4231623dcf4a74b3011a8d0d86f
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: renderer-recovery-web-runtime
          run-id: 34399817109
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: web
      - name: Verify exact retained package and source
        run: |
          set -o pipefail
          mkdir -p /tmp/a6-browser-evidence
          test "$(git rev-parse HEAD)" = 65fa129a0370b4231623dcf4a74b3011a8d0d86f
          test "$(git rev-parse HEAD^{tree})" = b9a32853e78b74ac20eee09a46c3ef47adfcaccd
          echo '1edca88dcd8a420e47174a79b4a9f92128c3e4ac481a6bca22632d2961a6ea9d  web/pkg/noon_web_bg.wasm' | sha256sum --check --strict
          echo 'e2b1df6bdcca43c06d6bdb709c6b3aa70366e2249fee0b9e08eafb516f443586  web/pkg/noon_web.js' | sha256sum --check --strict
          echo 'ef3d343471e41fbb89cedceca681de6e60a575593476e6da7ba1700216984cb9  web/python-worker.js' | sha256sum --check --strict
          echo '5f4b9d46a15518f2bfc3598e649d87ae3973f45eda9fa3e813efc236799cfc6d  web/python/compat-bundle.c05f66857ef750cf34965ecdd24c189192bf610d3584f77d1dbdbf25f39dc4bd.json' | sha256sum --check --strict
          cp web/python-worker.js /tmp/a6-browser-evidence/retained-worker.js
          node scripts/build-python-worker.mjs
          cmp web/python-worker.js /tmp/a6-browser-evidence/retained-worker.js
          echo '5f4b9d46a15518f2bfc3598e649d87ae3973f45eda9fa3e813efc236799cfc6d  web/python/compat-bundle.c05f66857ef750cf34965ecdd24c189192bf610d3584f77d1dbdbf25f39dc4bd.json' | sha256sum --check --strict
          git show -s --format='%H%n%P%n%T' HEAD > /tmp/a6-browser-evidence/source.txt
          sha256sum web/pkg/* > /tmp/a6-browser-evidence/package-sha256.txt
          node scripts/check-web-package.mjs
      - name: Apply candidate observation-only smoke corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('scripts/renderer-webgpu-device-loss-smoke.mjs')
          s=p.read_text()
          old='''      const candidate = await page.evaluate((time) => window.noonSmoke.renderAt(time), sampleTime);\n      if (candidate.presented && candidate.rendererBackend === "WebGPU") {\n        recovered = candidate;\n      }'''
          new='''      const candidate = await page.evaluate((time) => window.noonSmoke.renderAt(time), sampleTime);\n      const candidateCapture = await page.evaluate((lostIndex) => {\n        const capture = window.__noonWebGpuDeviceCapture;\n        const replacementIndex = capture.devices.length - 1;\n        return {\n          deviceCount: capture.devices.length,\n          replacementIndex,\n          replacedDevice:\n            replacementIndex > lostIndex && capture.devices[lostIndex] !== capture.devices[replacementIndex],\n          replacementHealthy: replacementIndex > lostIndex && capture.lost[replacementIndex] === null,\n        };\n      }, deviceIndex);\n      if (\n        candidate.presented &&\n        candidate.rendererBackend === "WebGPU" &&\n        candidateCapture.deviceCount >= minimumDeviceCount &&\n        candidateCapture.replacedDevice &&\n        candidateCapture.replacementHealthy\n      ) {\n        recovered = candidate;\n      }'''
          assert old in s
          p.write_text(s.replace(old,new))

          p=Path('scripts/playground-zero-size-smoke.mjs')
          s=p.read_text()
          start=s.index('async function waitForFrameAfter(page, previousFrames, label) {')
          end=s.index('\nasync function setCanvasContentSize', start)
          new='''async function waitForFrameAfter(page, previousFrames, label) {\n  return page.evaluate(\n    async ({ previous, label }) => {\n      const deadline = performance.now() + 10_000;\n      while (performance.now() < deadline) {\n        const report = await window.__noonExampleGallery.executionMetrics();\n        const metrics = report.metrics;\n        const canvas = document.querySelector("#scene");\n        const status = document.querySelector("#status");\n        const patchStatus = document.querySelector("#patch-status");\n        if (status?.dataset.state !== "error" && metrics.presentedFrames > previous) {\n          const rect = canvas.getBoundingClientRect();\n          return {\n            cssWidth: canvas.clientWidth, cssHeight: canvas.clientHeight,\n            rectWidth: rect.width, rectHeight: rect.height,\n            rendererBackend: status?.dataset.rendererBackend ?? "",\n            runtimeState: status?.dataset.state ?? "",\n            runtimeStartup: status?.dataset.runtimeStartup ?? "",\n            presentedFrames: metrics.presentedFrames, renderedTime: metrics.time ?? null,\n            needsPresent: metrics.needsPresent ?? null,\n            executionMode: status?.dataset.executionMode ?? "",\n            metricTime: document.querySelector("#metric-time")?.value ?? "",\n            patchState: patchStatus?.dataset.state ?? "",\n            patchText: patchStatus?.value ?? patchStatus?.textContent ?? "",\n          };\n        }\n        await new Promise((resolve) => setTimeout(resolve, 25));\n      }\n      throw new Error(`${label}: no new frame was presented`);\n    },\n    { previous: previousFrames, label },\n  );\n}\n'''
          p.write_text(s[:start]+new+s[end:])

          p=Path('scripts/renderer-webgpu-validation-error-smoke.mjs')
          s=p.read_text()
          s=s.replace('''  const consoleErrors = [];\n  page.on("pageerror", (error) => pageErrors.push(String(error)));\n  page.on("console", (message) => {\n    if (message.type() === "error") consoleErrors.push(message.text());\n  });\n  return { pageErrors, consoleErrors };''','''  const consoleErrors = [];\n  const consoleWarnings = [];\n  page.on("pageerror", (error) => pageErrors.push(String(error)));\n  page.on("console", (message) => {\n    if (message.type() === "error") consoleErrors.push(message.text());\n    if (message.type() === "warning") consoleWarnings.push(message.text());\n  });\n  return { pageErrors, consoleErrors, consoleWarnings };''')
          a=s.index('async function waitForHostGpuError(page) {')
          b=s.index('\nfunction changedPixelCount',a)
          replacement='''async function waitForHostGpuDiagnostic(page, browserErrors) {\n  let lastMetrics = null;\n  for (let attempt = 0; attempt < 40; attempt += 1) {\n    lastMetrics = await page.evaluate((time) => window.noonSmoke.renderAt(time), sampleTime);\n    const warning = browserErrors.consoleWarnings.find((message) =>\n      /WebGPU generation 1 validation error:/i.test(message),\n    );\n    if (warning) return { warning, metrics: lastMetrics };\n    await new Promise((resolve) => setTimeout(resolve, 10));\n  }\n  throw new Error(\n    `recoverable WebGPU validation diagnostic never reached the host; last metrics=${JSON.stringify(lastMetrics)}`,\n  );\n}\n'''
          s=s[:a]+replacement+s[b:]
          s=s.replace('''  const hostError = await waitForHostGpuError(page);\n  assert.match(\n    hostError,\n    /WebGPU generation 1 validation error:/,\n    `host GPU error lacks backend/generation context: ${hostError}`,\n  );''','''  const hostDiagnostic = await waitForHostGpuDiagnostic(page, browserErrors);\n  assert.match(\n    hostDiagnostic.warning,\n    /WebGPU generation 1 validation error:/,\n    `host GPU diagnostic lacks backend/generation context: ${hostDiagnostic.warning}`,\n  );''')
          s=s.replace('''    hostError,\n    afterErrorMetrics,''','''    hostDiagnostic,\n    afterErrorMetrics,''')
          p.write_text(s)

          p=Path('scripts/renderer-worker-webgpu-validation-error-smoke.mjs')
          s=p.read_text()
          marker='''const diagnostics = {};\n'''
          helper='''const diagnostics = {};\nconst stringifyDiagnostics = (value) => JSON.stringify(\n  value,\n  (_key, item) => typeof item === "bigint" ? item.toString() : item,\n  2,\n);\n'''
          assert marker in s
          s=s.replace(marker,helper,1)
          s=s.replace('JSON.stringify(diagnosticMetrics)', 'stringifyDiagnostics(diagnosticMetrics)')
          s=s.replace('JSON.stringify(diagnostics, null, 2)', 'stringifyDiagnostics(diagnostics)')
          p.write_text(s)
          PY
          node --check scripts/renderer-webgpu-device-loss-smoke.mjs
          node --check scripts/playground-zero-size-smoke.mjs
          node --check scripts/renderer-webgpu-validation-error-smoke.mjs
          node --check scripts/renderer-worker-webgpu-validation-error-smoke.mjs
          git diff --check
          git diff > /tmp/a6-browser-evidence/candidate-smoke.patch
      - name: Install browser dependencies only
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: WebGPU device-loss observation race candidate
        run: |
          set -o pipefail
          NOON_RENDERER_DEVICE_LOSS_ARTIFACTS=/tmp/a6-browser-evidence/device-loss node scripts/renderer-webgpu-device-loss-smoke.mjs 2>&1 | tee /tmp/a6-browser-evidence/device-loss.log
      - name: Corrected settled resize and restore
        if: always()
        run: |
          set -o pipefail
          NOON_PLAYGROUND_ZERO_SIZE_ARTIFACTS=/tmp/a6-browser-evidence/resize node scripts/playground-zero-size-smoke.mjs 2>&1 | tee /tmp/a6-browser-evidence/resize.log
      - name: Recoverable direct WebGPU validation diagnostic
        if: always()
        run: |
          set -o pipefail
          NOON_RENDERER_VALIDATION_ERROR_ARTIFACTS=/tmp/a6-browser-evidence/validation node scripts/renderer-webgpu-validation-error-smoke.mjs 2>&1 | tee /tmp/a6-browser-evidence/validation.log
      - name: Worker WebGPU validation diagnostics with safe evidence serialization
        if: always()
        run: |
          set -o pipefail
          NOON_RENDERER_VALIDATION_ARTIFACTS=/tmp/a6-browser-evidence/worker-validation node scripts/renderer-worker-webgpu-validation-error-smoke.mjs 2>&1 | tee /tmp/a6-browser-evidence/worker-validation.log
      - name: Final source and package identity
        if: always()
        run: |
          git checkout -- scripts/renderer-webgpu-device-loss-smoke.mjs scripts/playground-zero-size-smoke.mjs scripts/renderer-webgpu-validation-error-smoke.mjs scripts/renderer-worker-webgpu-validation-error-smoke.mjs
          git diff --exit-code
          sha256sum web/pkg/* > /tmp/a6-browser-evidence/final-package-sha256.txt
          cmp /tmp/a6-browser-evidence/package-sha256.txt /tmp/a6-browser-evidence/final-package-sha256.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: a6-1364-observation-candidates
          path: /tmp/a6-browser-evidence
          if-no-files-found: error
          retention-days: 7
