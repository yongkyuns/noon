name: Diagnose B2 merge conflicts

on:
  push:
    branches:
      - arch/b2-incremental-runtime

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/b2-incremental-runtime
          fetch-depth: 0
      - name: Merge current master and report conflicts
        shell: bash
        run: |
          set +e
          git fetch origin master
          git merge --no-commit --no-ff origin/master
          status=$?
          echo "merge_status=$status"
          conflicts="$(git diff --name-only --diff-filter=U)"
          echo "=== CONFLICT FILES ==="
          printf '%s\n' "$conflicts"
          for file in $conflicts; do
            echo "=== CONFLICT MARKERS: $file ==="
            grep -n -B 12 -A 24 -E '^(<<<<<<<|=======|>>>>>>>)' "$file" || true
          done
          exit $status
