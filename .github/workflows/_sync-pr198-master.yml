name: Sync PR198 with master

on:
  push:
    branches:
      - parity/manim-vectorpath-uncreate

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parity/manim-vectorpath-uncreate
          fetch-depth: 0

      - name: Merge current master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          if ! git merge --no-commit --no-ff origin/master; then
            echo 'Conflicting paths:'
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Validate merged source
        run: |
          cargo fmt --all -- --check
          cargo test -p noon-geometry
          PYTHONPATH=web/python python3 web/python/test_uncreate.py

      - name: Commit synchronized branch
        run: |
          rm .github/workflows/_sync-pr198-master.yml
          git add -A
          git commit -m 'merge: synchronize VectorPath parity with master'
          git push origin HEAD:parity/manim-vectorpath-uncreate
