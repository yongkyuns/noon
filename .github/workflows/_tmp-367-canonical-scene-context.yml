name: Temporary
on:
  push:
    branches:
      - tmp/367-canonical-scene-context
permissions:
  contents: write
jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/367-canonical-scene-context
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Apply architecture slice
        run: |
          python3 scripts/_tmp-367-fix-driver.py
          python3 scripts/_tmp-367-canonical-scene-context.py
      - name: Format and build generated authoring assets
        run: |
          cargo fmt --all
          node scripts/build-python-worker.mjs
      - name: Run focused checks
        run: |
          cargo test -p noon-web canonical_scene_authoring
          cargo clippy -p noon-web --all-targets -- -D warnings
          node --test web/canonical-scene-authoring-context.test.mjs
          node --test web/python-compat-bundle.test.mjs
          node --test web/authoring-scene-spec-result.test.mjs
          git diff --check
      - name: Commit source changes
        run: |
          git config user.name "Yongkyun Shin"
          git config user.email "yongkyuns@gmail.com"
          git add -A
          git reset .github/workflows/_tmp-367-canonical-scene-context.yml \
            scripts/_tmp-367-canonical-scene-context.py \
            scripts/_tmp-367-fix-driver.py
          git commit -m "Own mixed scene objects in one Rust authoring context"
          git push origin HEAD:tmp/367-canonical-scene-context
