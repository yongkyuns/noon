  assert.match(workerSource, /CanonicalSceneAuthoringContext/);
  assert.match(workerSource, /noonCreateCanonicalSceneAuthoringContext/);
  assert.doesNotMatch(workerSource, /noonCanonicalSceneSpecJson\s*=/);
});
''')
