name: Temporary
on:
  push:
    branches: [tmp/367-canonical-scene-context]
permissions:
  contents: write
jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/367-canonical-scene-context
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Apply architecture slice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}")
              p.write_text(text.replace(old, new))

          Path("crates/noon-web/src/canonical_scene_authoring.rs").write_text(r'''use std::collections::BTreeMap;

use noon_core::{FamilyAnimationRequest, ObjectId, ObjectSnapshot, TrackDefinition, Vec2};
use noon_ir::{ObjectSpec, ObjectSpecContent, SceneSpec, SceneSpecError};

use crate::{
    materialize_retained_tracks, retained_text_object_spec, retained_text_scale_factor,
    RetainedTextAuthoringSpec, RetainedTrackAuthoringSpec, RetainedTrackMaterializationError,
};

/// Per-scene canonical mixed-content authoring state.
///
/// Object registration order is the painter order. Frontends report individual
/// binding events with their already-final scene-global ObjectIds; they never build
/// a second cross-content ordering table or text-specific identity namespace.
#[derive(Clone, Debug, Default)]
pub struct CanonicalSceneAuthoringContext {
    objects: Vec<ObjectSpec>,
    positions: BTreeMap<ObjectId, usize>,
    retained_scale_factors: BTreeMap<ObjectId, Vec2>,
}

impl CanonicalSceneAuthoringContext {
    pub fn object_count(&self) -> usize {
        self.objects.len()
    }

    pub fn bind_geometry(
        &mut self,
        id: ObjectId,
        snapshot: ObjectSnapshot,
    ) -> Result<(), CanonicalSceneAuthoringError> {
        self.bind_object(
            ObjectSpec {
                id,
                content: ObjectSpecContent::Geometry(snapshot.geometry),
                transform: snapshot.transform,
                style: snapshot.style,
            },
            None,
        )
    }

    pub fn update_geometry(
        &mut self,
        id: ObjectId,
        snapshot: ObjectSnapshot,
    ) -> Result<(), CanonicalSceneAuthoringError> {
        self.update_object(
            ObjectSpec {
                id,
                content: ObjectSpecContent::Geometry(snapshot.geometry),
                transform: snapshot.transform,
                style: snapshot.style,
            },
            None,
        )
    }

    pub fn bind_retained_text(
        &mut self,
        id: ObjectId,
        text: RetainedTextAuthoringSpec,
    ) -> Result<(), CanonicalSceneAuthoringError> {
        let scale = retained_text_scale_factor(&text);
        self.bind_object(retained_text_object_spec(id, text), Some(scale))
    }

    pub fn update_retained_text(
        &mut self,
        id: ObjectId,
        text: RetainedTextAuthoringSpec,
    ) -> Result<(), CanonicalSceneAuthoringError> {
        let scale = retained_text_scale_factor(&text);
        self.update_object(retained_text_object_spec(id, text), Some(scale))
    }

    pub fn restore_object_count(
        &mut self,
        object_count: usize,
    ) -> Result<(), CanonicalSceneAuthoringError> {
        if object_count > self.objects.len() {
            return Err(CanonicalSceneAuthoringError::InvalidCheckpoint {
                requested: object_count,
                current: self.objects.len(),
            });
        }
        self.objects.truncate(object_count);
        self.positions.clear();
        for (index, object) in self.objects.iter().enumerate() {
            self.positions.insert(object.id, index);
        }
        self.retained_scale_factors
            .retain(|object, _| self.positions.contains_key(object));
        Ok(())
    }

    pub fn scene_spec(
        &self,
        legacy_tracks: Vec<TrackDefinition>,
        retained_tracks: Vec<RetainedTrackAuthoringSpec>,
        family_animations: Vec<FamilyAnimationRequest>,
        camera_object: Option<ObjectId>,
    ) -> Result<SceneSpec, CanonicalSceneAuthoringError> {
        let tracks = materialize_retained_tracks(
            &legacy_tracks,
            retained_tracks,
            &self.retained_scale_factors,
        )?;
        let mut spec = SceneSpec::new(self.objects.clone(), tracks)?;
        spec.family_animations = family_animations;
        spec.camera_object = camera_object;
        spec.validate()?;
        Ok(spec)
    }

    fn bind_object(
        &mut self,
        object: ObjectSpec,
        retained_scale_factor: Option<Vec2>,
    ) -> Result<(), CanonicalSceneAuthoringError> {
        if self.positions.contains_key(&object.id) {
            return Err(CanonicalSceneAuthoringError::DuplicateObject(object.id));
        }
        let id = object.id;
        self.positions.insert(id, self.objects.len());
        self.objects.push(object);
        if let Some(scale) = retained_scale_factor {
            self.retained_scale_factors.insert(id, scale);
        }
        Ok(())
    }

    fn update_object(
        &mut self,
        object: ObjectSpec,
        retained_scale_factor: Option<Vec2>,
    ) -> Result<(), CanonicalSceneAuthoringError> {
        let Some(&position) = self.positions.get(&object.id) else {
            return Err(CanonicalSceneAuthoringError::UnknownObject(object.id));
        };
        let existing = &self.objects[position];
        if std::mem::discriminant(&existing.content) != std::mem::discriminant(&object.content) {
            return Err(CanonicalSceneAuthoringError::ContentKindChanged(object.id));
        }
        let id = object.id;
        self.objects[position] = object;
        match retained_scale_factor {
            Some(scale) => {
                self.retained_scale_factors.insert(id, scale);
            }
            None => {
                self.retained_scale_factors.remove(&id);
            }
        }
        Ok(())
    }
}

#[derive(Debug)]
pub enum CanonicalSceneAuthoringError {
    DuplicateObject(ObjectId),
    UnknownObject(ObjectId),
    ContentKindChanged(ObjectId),
    InvalidCheckpoint { requested: usize, current: usize },
    TrackMaterialization(RetainedTrackMaterializationError),
    SceneSpec(SceneSpecError),
    Json(serde_json::Error),
}

impl std::fmt::Display for CanonicalSceneAuthoringError {
    fn fmt(&self, formatter: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        match self {
            Self::DuplicateObject(object) => {
                write!(formatter, "canonical scene object {} is already bound", object.get())
            }
            Self::UnknownObject(object) => {
                write!(formatter, "canonical scene object {} is not bound", object.get())
            }
            Self::ContentKindChanged(object) => write!(
                formatter,
                "canonical scene object {} cannot change content kind after binding",
                object.get()
            ),
            Self::InvalidCheckpoint { requested, current } => write!(
                formatter,
                "canonical scene checkpoint {requested} exceeds current object count {current}"
            ),
            Self::TrackMaterialization(error) => error.fmt(formatter),
            Self::SceneSpec(error) => error.fmt(formatter),
            Self::Json(error) => error.fmt(formatter),
        }
    }
}

impl std::error::Error for CanonicalSceneAuthoringError {}

impl From<RetainedTrackMaterializationError> for CanonicalSceneAuthoringError {
    fn from(value: RetainedTrackMaterializationError) -> Self {
        Self::TrackMaterialization(value)
    }
}

impl From<SceneSpecError> for CanonicalSceneAuthoringError {
    fn from(value: SceneSpecError) -> Self {
        Self::SceneSpec(value)
    }
}

impl From<serde_json::Error> for CanonicalSceneAuthoringError {
    fn from(value: serde_json::Error) -> Self {
        Self::Json(value)
    }
}

#[cfg(target_arch = "wasm32")]
mod wasm {
    use super::*;
    use wasm_bindgen::prelude::*;

    const MAX_JS_SAFE_INTEGER: f64 = 9_007_199_254_740_991.0;

    fn js_error(error: impl std::fmt::Display) -> JsValue {
        JsValue::from_str(&error.to_string())
    }

    fn object_id(value: f64, label: &str) -> Result<ObjectId, JsValue> {
        if !value.is_finite() || value < 0.0 || value > MAX_JS_SAFE_INTEGER || value.fract() != 0.0
        {
            return Err(JsValue::from_str(&format!(
                "{label} must be a non-negative JavaScript-safe integer"
            )));
        }
        Ok(ObjectId::new(value as u64))
    }

    #[wasm_bindgen(js_name = CanonicalSceneAuthoringContext)]
    pub struct WasmCanonicalSceneAuthoringContext {
        inner: CanonicalSceneAuthoringContext,
    }

    #[wasm_bindgen(js_class = CanonicalSceneAuthoringContext)]
    impl WasmCanonicalSceneAuthoringContext {
        #[wasm_bindgen(constructor)]
        pub fn new() -> Self {
            Self {
                inner: CanonicalSceneAuthoringContext::default(),
            }
        }

        #[wasm_bindgen(getter, js_name = objectCount)]
        pub fn object_count(&self) -> usize {
            self.inner.object_count()
        }

        #[wasm_bindgen(js_name = bindGeometrySnapshotJson)]
        pub fn bind_geometry_snapshot_json(
            &mut self,
            id: f64,
            snapshot_json: &str,
        ) -> Result<(), JsValue> {
            let snapshot: ObjectSnapshot = serde_json::from_str(snapshot_json).map_err(js_error)?;
            self.inner
                .bind_geometry(object_id(id, "geometry object ID")?, snapshot)
                .map_err(js_error)
        }

        #[wasm_bindgen(js_name = updateGeometrySnapshotJson)]
        pub fn update_geometry_snapshot_json(
            &mut self,
            id: f64,
            snapshot_json: &str,
        ) -> Result<(), JsValue> {
            let snapshot: ObjectSnapshot = serde_json::from_str(snapshot_json).map_err(js_error)?;
            self.inner
                .update_geometry(object_id(id, "geometry object ID")?, snapshot)
                .map_err(js_error)
        }

        #[wasm_bindgen(js_name = bindRetainedTextSpecJson)]
        pub fn bind_retained_text_spec_json(
            &mut self,
            id: f64,
            spec_json: &str,
        ) -> Result<(), JsValue> {
            let text: RetainedTextAuthoringSpec = serde_json::from_str(spec_json).map_err(js_error)?;
            text.validate().map_err(js_error)?;
            self.inner
                .bind_retained_text(object_id(id, "retained text object ID")?, text)
                .map_err(js_error)
        }

        #[wasm_bindgen(js_name = updateRetainedTextSpecJson)]
        pub fn update_retained_text_spec_json(
            &mut self,
            id: f64,
            spec_json: &str,
        ) -> Result<(), JsValue> {
            let text: RetainedTextAuthoringSpec = serde_json::from_str(spec_json).map_err(js_error)?;
            text.validate().map_err(js_error)?;
            self.inner
                .update_retained_text(object_id(id, "retained text object ID")?, text)
                .map_err(js_error)
        }

        #[wasm_bindgen(js_name = restoreObjectCount)]
        pub fn restore_object_count(&mut self, object_count: usize) -> Result<(), JsValue> {
            self.inner
                .restore_object_count(object_count)
                .map_err(js_error)
        }

        #[wasm_bindgen(js_name = sceneSpecJson)]
        pub fn scene_spec_json(
            &self,
            legacy_tracks_json: &str,
            retained_tracks_json: &str,
            family_animations_json: &str,
            camera_object: Option<f64>,
        ) -> Result<String, JsValue> {
            let legacy_tracks: Vec<TrackDefinition> =
                serde_json::from_str(legacy_tracks_json).map_err(js_error)?;
            let retained_tracks: Vec<RetainedTrackAuthoringSpec> =
                serde_json::from_str(retained_tracks_json).map_err(js_error)?;
            let family_animations: Vec<FamilyAnimationRequest> =
                serde_json::from_str(family_animations_json).map_err(js_error)?;
            let camera_object = camera_object
                .map(|value| object_id(value, "camera object ID"))
                .transpose()?;
            self.inner
                .scene_spec(
                    legacy_tracks,
                    retained_tracks,
                    family_animations,
                    camera_object,
                )
                .and_then(|spec| spec.to_json().map_err(CanonicalSceneAuthoringError::from))
                .map_err(js_error)
        }
    }
}

#[cfg(target_arch = "wasm32")]
pub use wasm::*;

#[cfg(test)]
mod tests {
    use noon_core::{
        FamilyAnimationLeafBinding, FamilyAnimationMode, FamilyAnimationSpec, GeometryRef,
        ObjectId, ObjectSnapshot, Property, RateFunction, SemanticNodeId, Style, TrackTiming,
        TrackValues, Transform2D, Vec2,
    };
    use noon_ir::{ObjectSpecContent, TextSpecKind};

    use super::*;

    fn snapshot(geometry: GeometryRef) -> ObjectSnapshot {
        ObjectSnapshot {
            geometry,
            transform: Transform2D::default(),
            style: Style::default(),
        }
    }

    fn text(source: &str) -> RetainedTextAuthoringSpec {
        RetainedTextAuthoringSpec::native(
            source,
            noon::DEFAULT_NATIVE_TEXT_FONT_FAMILY,
            48.0,
            -1.0,
        )
        .unwrap()
    }

    #[test]
    fn mixed_binding_order_is_the_canonical_painter_order() {
        let mut context = CanonicalSceneAuthoringContext::default();
        context
            .bind_geometry(ObjectId::new(0), snapshot(GeometryRef::circle(0.5)))
            .unwrap();
        context.bind_retained_text(ObjectId::new(1), text("A")).unwrap();
        context
            .bind_geometry(
                ObjectId::new(2),
                snapshot(GeometryRef::rectangle(1.0, 1.0)),
            )
            .unwrap();

        let spec = context.scene_spec(Vec::new(), Vec::new(), Vec::new(), None).unwrap();
        assert_eq!(
            spec.objects.iter().map(|object| object.id).collect::<Vec<_>>(),
            vec![ObjectId::new(0), ObjectId::new(1), ObjectId::new(2)]
        );
        assert!(matches!(
            spec.objects[0].content,
            ObjectSpecContent::Geometry(_)
        ));
        let ObjectSpecContent::Text(text) = &spec.objects[1].content else {
            panic!("middle object must be source-level text");
        };
        assert_eq!(text.kind, TextSpecKind::Plain);
        assert_eq!(text.source, "A");
        assert!(matches!(
            spec.objects[2].content,
            ObjectSpecContent::Geometry(_)
        ));
    }

    #[test]
    fn updates_preserve_order_and_content_kind() {
        let mut context = CanonicalSceneAuthoringContext::default();
        context
            .bind_geometry(ObjectId::new(0), snapshot(GeometryRef::circle(0.5)))
            .unwrap();
        context.bind_retained_text(ObjectId::new(1), text("A")).unwrap();
        let mut updated_text = text("A");
        updated_text.move_to(Vec2::new(2.0, -1.0)).unwrap();
        context
            .update_retained_text(ObjectId::new(1), updated_text)
            .unwrap();
        context
            .update_geometry(
                ObjectId::new(0),
                snapshot(GeometryRef::rectangle(2.0, 1.0)),
            )
            .unwrap();
        let spec = context.scene_spec(Vec::new(), Vec::new(), Vec::new(), None).unwrap();
        assert_eq!(spec.objects[0].id, ObjectId::new(0));
        assert_eq!(spec.objects[1].id, ObjectId::new(1));
        assert_eq!(spec.objects[1].transform.translation, Vec2::new(2.0, -1.0));
        assert!(context
            .update_retained_text(ObjectId::new(0), text("wrong kind"))
            .is_err());
    }

    #[test]
    fn duplicate_unknown_and_invalid_checkpoint_fail_closed() {
        let mut context = CanonicalSceneAuthoringContext::default();
        context
            .bind_geometry(ObjectId::new(0), snapshot(GeometryRef::circle(0.5)))
            .unwrap();
        assert!(context
            .bind_geometry(ObjectId::new(0), snapshot(GeometryRef::circle(1.0)))
            .is_err());
        assert!(context
            .update_geometry(ObjectId::new(9), snapshot(GeometryRef::circle(1.0)))
            .is_err());
        assert!(context.restore_object_count(2).is_err());
        context.restore_object_count(0).unwrap();
        assert_eq!(context.object_count(), 0);
    }

    #[test]
    fn retained_scale_tracks_reuse_existing_rust_normalization() {
        let mut context = CanonicalSceneAuthoringContext::default();
        let object = ObjectId::new(0);
        context.bind_retained_text(object, text("Scale")).unwrap();
        let retained_track = RetainedTrackAuthoringSpec::new(
            object,
            Property::Scale,
            TrackValues::Vec2 {
                from: Vec2::ONE,
                to: Vec2::ZERO,
            },
            TrackTiming::new(0.0, 1.0, RateFunction::Linear),
        );
        let spec = context
            .scene_spec(Vec::new(), vec![retained_track], Vec::new(), None)
            .unwrap();
        assert_eq!(
            spec.tracks[0].values,
            TrackValues::Vec2 {
                from: Vec2::new(
                    noon::NATIVE_POINT_TO_SCENE_SCALE,
                    noon::NATIVE_POINT_TO_SCENE_SCALE,
                ),
                to: Vec2::ZERO,
            }
        );
    }

    #[test]
    fn family_animation_and_camera_share_the_same_object_domain() {
        let mut context = CanonicalSceneAuthoringContext::default();
        let camera = ObjectId::new(0);
        let text_object = ObjectId::new(1);
        context
            .bind_geometry(camera, snapshot(GeometryRef::rectangle(14.0, 8.0)))
            .unwrap();
        context.bind_retained_text(text_object, text("AB")).unwrap();
        let target = SemanticNodeId::new(10, 0);
        let leaf = SemanticNodeId::new(11, 0);
        let animation = FamilyAnimationRequest::new(
            target,
            vec![FamilyAnimationLeafBinding::new(leaf, text_object)],
            FamilyAnimationSpec::new(
                FamilyAnimationMode::Reveal,
                0.0,
                1.0,
                1.0,
                RateFunction::Smooth,
                false,
                false,
            )
            .unwrap(),
        )
        .unwrap();
        let spec = context
            .scene_spec(Vec::new(), Vec::new(), vec![animation.clone()], Some(camera))
            .unwrap();
        assert_eq!(spec.camera_object, Some(camera));
        assert_eq!(spec.family_animations, vec![animation]);
    }
}
