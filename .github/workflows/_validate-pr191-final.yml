name: Final PR191 parity validation

on:
  push:
    branches:
      - parity/manim-create-partial

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      NOON_WASM_SKIP_OPT: "1"
      NOON_SKIP_PLAYGROUND_TEST: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parity/manim-create-partial
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate merged frontend contracts
        run: |
          python3 web/python/test_manim_geometry_defaults.py
          python3 web/python/test_manim_animation_constructor_options.py
      - name: Install Manim system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config
      - name: Install pinned ManimCE
        run: python -m pip install --disable-pip-version-check "manim==0.21.0"
      - name: Set up Rust and wasm
        run: |
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Build browser package
        run: bash scripts/build-web-demo.sh
      - name: Install raster harness dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Run lossless Manim raster oracle
        env:
          NOON_MANIM_RASTER_BACKENDS: webgpu,webgl
          NOON_MANIM_RASTER_ARTIFACTS: manim-raster-artifacts
        run: node scripts/manim-raster-differential.mjs
      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr191-final-raster
          path: manim-raster-artifacts
          if-no-files-found: error
          retention-days: 14
