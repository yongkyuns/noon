name: B2 transplant validation

on:
  push:
    branches:
      - arch/b2-incremental-runtime

permissions:
  contents: write

concurrency:
  group: b2-incremental-runtime-transplant
  cancel-in-progress: true

jobs:
  transplant:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/b2-incremental-runtime
          fetch-depth: 1

      - name: Fetch validated B2 commits
        run: |
          git fetch origin 318ef4bb1b62c89d1db3e52a6a6bbfb224c41924 86b7238bece2ab89b012a57813f83544b14cd75c

      - name: Transplant stable slots and local timeline relowering
        run: |
          git config user.name "Yongkyun Shin"
          git config user.email "yongkyuns@gmail.com"
          git cherry-pick 318ef4bb1b62c89d1db3e52a6a6bbfb224c41924
          if ! git cherry-pick 86b7238bece2ab89b012a57813f83544b14cd75c; then
            # The only intentional overlaps are the scheduler implementation and
            # its stress fixture. The validated B2 scheduler already contains the
            # allocation-free active-group request path from current master.
            git checkout 86b7238bece2ab89b012a57813f83544b14cd75c -- crates/noon-runtime/src/reactive/timeline_scheduler.rs
            git checkout 86b7238bece2ab89b012a57813f83544b14cd75c -- crates/noon-runtime/tests/local_timeline_patch.rs
            git add crates/noon-runtime/src/reactive/timeline_scheduler.rs crates/noon-runtime/tests/local_timeline_patch.rs
            git cherry-pick --continue
          fi

      - name: Validate transplanted architecture
        run: |
          cargo fmt --all -- --check
          cargo clippy -p noon-compile -p noon-runtime -p noon-render-wgpu -p noon-web --all-targets --all-features -- -D warnings
          cargo test -p noon-compile --all-features
          cargo test -p noon-runtime --all-features
          cargo test -p noon-render-wgpu --all-features
          cargo test -p noon-web --all-features

      - name: Commit clean transplant and remove helper
        run: |
          rm .github/workflows/b2-transplant.yml
          git add -A
          git commit -m "Transplant validated B2 incremental runtime work"
          git push origin HEAD:arch/b2-incremental-runtime
