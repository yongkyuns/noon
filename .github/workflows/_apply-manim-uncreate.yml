name: Apply Manim Uncreate lifecycle

on:
  push:
    branches:
      - parity/manim-vectorpath-uncreate

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parity/manim-vectorpath-uncreate
          fetch-depth: 1
      - name: Apply Uncreate patch
        run: python3 scripts/_apply_manim_uncreate.py
      - name: Validate base authoring
        env:
          PYTHONPATH: web/python
        run: python3 web/python/test_uncreate.py
      - name: Validate compatibility syntax
        run: |
          python3 -m py_compile web/python/noon.py
          python3 -m py_compile web/python/_manim_compat.py
          python3 -m py_compile web/python/_manim_animate.py
      - name: Remove temporary patch machinery
        run: |
          rm scripts/_apply_manim_uncreate.py
          rm .github/workflows/_apply-manim-uncreate.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: match Manim Uncreate lifecycle semantics"
          git push origin HEAD:parity/manim-vectorpath-uncreate
