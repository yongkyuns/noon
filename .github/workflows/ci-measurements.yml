name: C5 receipt integration source capture

on:
  push:
    branches: [validation/c5-receipts-master-20260923]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive original C5 baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p integration-inputs
          base=eb5b5c8ef3eb92e502a5ba06c73e6547377af26b
          head=3428ccf34c1bd040038032a637d510dfeedbc911
          git merge-base --is-ancestor "$base" "$head"
          git archive --format=tar.gz "$base" > integration-inputs/c5base.tar.gz
          git rev-parse "$base^{tree}" > integration-inputs/c5base.tree
          git cat-file commit "$base" > integration-inputs/c5base.commit
          sha256sum integration-inputs/c5base.tar.gz > integration-inputs/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: c5-pre-contract-integration-base
          path: integration-inputs
          if-no-files-found: error
          retention-days: 3
