name: Mobile demo diagnosis (temporary)
on:
  push:
    branches: [codex/mobile-demo-diagnosis]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps webkit
      - run: timeout --signal=TERM --kill-after=10s 480s node scripts/mobile-jspi-diagnosis.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-demo-diagnosis
          path: mobile-diagnosis
          retention-days: 3
