name: Diagram workspace
on:
  push:
    branches: [work/noon-d2-architecture-20260909]
permissions:
  contents: write
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORIGINAL_BASE: d6734d2a0626f5c9926e4043ad2017a94f5c8c5a
      REVIEW_BASE: a98c6837c960bd5620d6a03c79560cc44b0015b6
      OUTPUT_BRANCH: docs/noon-d2-architecture-20260909
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Recover original candidate and reconcile with reviewed master
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/master)" = "$REVIEW_BASE"
          mkdir -p "$RUNNER_TEMP/diagram-artifacts"
          git worktree add --detach "$RUNNER_TEMP/diagram-candidate" "$ORIGINAL_BASE"
          python3 - <<'PY'
          import gzip, hashlib, json, os
          from pathlib import Path
          source = Path.cwd()
          root = (Path(os.environ['RUNNER_TEMP']) / 'diagram-candidate').resolve()
          payload = b''.join((source / '.github/diagram-workspace-payload' / str(i)).read_bytes() for i in range(4))
          assert hashlib.sha256(payload).hexdigest() == 'b8d3fea6fb3ac6ebce7bd8219dd6b20113595bc9f8c280b7066fed0486e7ede9'
          changes = json.loads(gzip.decompress(payload))
          assert len(changes) == 14
          for change in changes:
              path = (root / change['path']).resolve()
              assert path.is_relative_to(root)
              if change['base'] is None:
                  assert not path.exists(), path
                  text = change['content']
              else:
                  original = path.read_bytes()
                  assert hashlib.sha256(original).hexdigest() == change['base'], path
                  lines = original.decode().splitlines(keepends=True)
                  for start, end, replacement in reversed(change['edits']):
                      lines[start:end] = replacement
                  text = ''.join(lines)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')
          PY
          cd "$RUNNER_TEMP/diagram-candidate"
          git add -- README.md docs/architecture.md docs/diagrams scripts/architecture_diagrams.py scripts/test_architecture_diagrams.py .github/workflows/architecture-diagrams.yml
          git diff --cached --binary > "$RUNNER_TEMP/diagram-artifacts/original-candidate.patch"
          git diff "$ORIGINAL_BASE" "$REVIEW_BASE" -- README.md docs/architecture.md crates/noon-core/src/lib.rs crates/noon-compile/src/lib.rs crates/noon/src/execution_session/publication.rs web/semantic-engine-endpoint.js > "$RUNNER_TEMP/diagram-artifacts/upstream-architecture-changes.diff"
          git reset --hard "$REVIEW_BASE"
          git apply --3way --index "$RUNNER_TEMP/diagram-artifacts/original-candidate.patch"
      - name: Install checksum-verified D2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/d2lang/d2/releases/download/v0.9.0/d2-v0.9.0-linux-amd64.tar.gz -o "$RUNNER_TEMP/d2.tar.gz"
          echo "5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9  $RUNNER_TEMP/d2.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/d2.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/d2-v0.9.0/bin" >> "$GITHUB_PATH"
      - name: Render and qualify documentation
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/diagram-candidate"
          python3 scripts/architecture_diagrams.py
          python3 scripts/test_architecture_diagrams.py
          python3 scripts/architecture_diagrams.py --check
          git diff --check
          git diff --cached --check
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          bash scripts/check.sh architecture "$REVIEW_BASE"
      - name: Package candidate before attempting any push
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/diagram-candidate"
          cp .github/workflows/architecture-diagrams.yml "$RUNNER_TEMP/diagram-artifacts/architecture-diagrams.yml"
          git restore --staged -- .github/workflows/architecture-diagrams.yml
          git add -- README.md docs/architecture.md docs/diagrams scripts/architecture_diagrams.py scripts/test_architecture_diagrams.py
          git diff --cached --name-only > "$RUNNER_TEMP/diagram-artifacts/changed-files.txt"
          test "$(wc -l < "$RUNNER_TEMP/diagram-artifacts/changed-files.txt")" -eq 21
          if grep -q '^.github/' "$RUNNER_TEMP/diagram-artifacts/changed-files.txt"; then
            echo 'CI must not push workflow-file changes' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree="$(git write-tree)"
          commit="$(git commit-tree "$tree" -p "$REVIEW_BASE" -m 'docs: render current Noon architecture with reproducible D2 diagrams')"
          printf 'BASE=%s\nHEAD=%s\nTREE=%s\n' "$REVIEW_BASE" "$commit" "$tree" | tee "$RUNNER_TEMP/diagram-artifacts/diagram-revisions.txt"
          echo "DIAGRAM_COMMIT=$commit" >> "$GITHUB_ENV"
          git archive --format=zip "$commit" README.md docs/architecture.md docs/diagrams scripts/architecture_diagrams.py scripts/test_architecture_diagrams.py > "$RUNNER_TEMP/diagram-artifacts/noon-architecture-diagrams.zip"
          git archive --format=tar.gz "$commit" > "$RUNNER_TEMP/diagram-artifacts/candidate-source.tar.gz"
      - name: Preserve recovered source and rendered artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noon-architecture-diagrams-recovered
          path: ${{ runner.temp }}/diagram-artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: Publish documentation-only branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/diagram-candidate"
          git push origin "$DIAGRAM_COMMIT:refs/heads/$OUTPUT_BRANCH"
