name: Qualify generic DashedVMobject

on:
  push:
    branches:
      - codex/b2-dashed-vmobject

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reconcile manifests and zero-dash behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # No positive dash count means no dash subcurve needs to inspect source
          # geometry. This mirrors pinned Manim's empty VGroup result while keeping
          # Noon's output as one fresh retained semantic object.
          path = Path("crates/noon/src/dashed_vmobject_authoring.rs")
          text = path.read_text()
          old = '''    let num_dashes = options.num_dashes.max(0) as usize;

              let world_path = crate::path_editing::world_path(store, state)?;
          '''
          new = '''    let num_dashes = options.num_dashes.max(0) as usize;
              if num_dashes == 0 {
                  return Ok((
                      crate::path_editing::path_replacement_state(state.clone())?,
                      VectorPath::new(),
                  ));
              }

              let world_path = crate::path_editing::world_path(store, state)?;
          '''
          if text.count(old) != 1:
              raise SystemExit("dashed_vmobject_authoring.rs: zero-dash insertion anchor drifted")
          path.write_text(text.replace(old, new, 1))

          manifest = Path("parity/manim-v0.21/manifest.json")
          text = manifest.read_text()
          anchor = '''    {
                "id": "canonical-curve-layout",
          '''
          entry = '''    {
                "id": "dashed-vmobject",
                "scene": "DashedVMobjectExample",
                "source": "parity/manim-v0.21/core-examples/dashed_vmobject.py",
                "expected_duration": 0.2,
                "raster_tolerance": {
                  "max_bounds_delta_px": 2,
                  "max_differing_ratio": 0.006,
                  "max_mean_absolute_channel_error": 0.5
                }
              },
          '''
          if '"id": "dashed-vmobject"' in text:
              raise SystemExit("manifest already contains dashed-vmobject")
          if text.count(anchor) != 1:
              raise SystemExit("manifest canonical-curve-layout anchor drifted")
          manifest.write_text(text.replace(anchor, entry + anchor, 1))

          compat = Path("compat/manim-v0.21.0.json")
          text = compat.read_text()
          vmobject_line = next(
              line for line in text.splitlines(keepends=True)
              if line.lstrip().startswith('"VMobject": {')
          )
          entry = (
              '    "DashedVMobject": {"status": "partial", "category": "vector-path", '
              '"dependency": "#77", '
              '"evidence": "parity/manim-v0.21/core-examples/dashed_vmobject.py; '
              'crates/noon/tests/manim_dashed_vmobject.rs; web/python/test_manim_dashed_vmobject.py", '
              '"reason": "Generic retained path dashing is Rust-owned for open/closed paths, '
              'dash_offset, Manim-sampled equal-length mapping, direct curve-parameter dashing, '
              'detached construction, and coherent live construction. Arrow/tip composite '
              'reattachment, Manim dash-submobject family identity, and arbitrary VMobject '
              'constructor kwargs remain pending."},\n'
          )
          if '"DashedVMobject": {' in text:
              raise SystemExit("compat manifest already contains DashedVMobject")
          compat.write_text(text.replace(vmobject_line, vmobject_line + entry, 1))
          PY

      - name: Validate Rust and Python regressions
        shell: bash
        run: |
          cargo fmt --all
          cargo test -p noon-geometry dashing
          cargo test -p noon dashed_vmobject --all-features
          cargo test -p noon dashed_line --all-features
          cargo test -p noon --test manim_dashed_vmobject --all-features
          cargo check -p noon-web --all-targets --all-features
          python3 -m unittest web/python/test_manim_dashed_vmobject.py web/python/test_manim_shared_dashed_line.py
          python3 -m py_compile parity/manim-v0.21/core-examples/dashed_vmobject.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('parity/manim-v0.21/manifest.json').read_text())
          fixtures = [item for item in manifest['fixtures'] if item['id'] == 'dashed-vmobject']
          assert len(fixtures) == 1
          compat = json.loads(Path('compat/manim-v0.21.0.json').read_text())
          assert compat['overrides']['DashedVMobject']['status'] == 'partial'
          PY

      - name: Install pinned ManimCE reference
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config
          python3 -m pip install --disable-pip-version-check "manim==0.21.0"

      - name: Validate API inventory and canonical source
        shell: bash
        run: |
          python3 scripts/manim-api-coverage.py --check --write-markdown /tmp/manim-api-coverage.md
          python3 -m manim \
            --renderer=cairo \
            --disable_caching \
            --format=png \
            --media_dir /tmp/manim-dashed-vmobject \
            -r 960,540 \
            --fps 30 \
            parity/manim-v0.21/core-examples/dashed_vmobject.py \
            DashedVMobjectExample

      - name: Commit qualified source
        shell: bash
        run: |
          rm .github/workflows/_qualify-dashed-vmobject.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: qualify generic DashedVMobject"
          git push origin HEAD:codex/b2-dashed-vmobject
