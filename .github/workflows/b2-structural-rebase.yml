name: B2 structural rebase validation

on:
  push:
    branches:
      - arch/b2-structural-render-deltas

permissions:
  contents: write

jobs:
  validate-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Replay overlapping web edits
        run: |
          python - <<'PY'
          from pathlib import Path

          canvas = Path('crates/noon-web/src/execution_canvas.rs')
          text = canvas.read_text()
          old = '            self.mirror.frame().map_or(0, |frame| frame.objects.len())'
          new = '            self.mirror.live_object_count()'
          if text.count(old) != 1:
              raise SystemExit('execution_canvas object-count anchor changed')
          canvas.write_text(text.replace(old, new, 1))

          legacy = Path('crates/noon-web/src/legacy.rs')
          text = legacy.read_text()
          old_import = '''use noon_runtime::{\n    EvaluationError, ExecutionDelta, ExecutionTransactionError, FrameChanges, FrameState,\n    SlottedSceneInstance,\n};'''
          new_import = '''use noon_runtime::{\n    EvaluationError, ExecutionDelta, ExecutionSlotId, ExecutionTransactionError, FrameChanges,\n    FrameState, SlottedSceneInstance,\n};'''
          if text.count(old_import) != 1:
              raise SystemExit('legacy runtime import anchor changed')
          text = text.replace(old_import, new_import, 1)
          anchor = '''    pub fn last_execution_delta(&self) -> &ExecutionDelta {\n        self.instance.last_execution_delta()\n    }\n\n'''
          addition = '''    pub(crate) fn take_execution_delta(&mut self) -> ExecutionDelta {\n        self.instance.take_execution_delta()\n    }\n\n    pub(crate) fn execution_slot_for_frame_index(\n        &self,\n        frame_index: usize,\n    ) -> Option<ExecutionSlotId> {\n        self.instance.slot_for_frame_index(frame_index)\n    }\n\n    pub(crate) fn frame_index_for_execution_slot(&self, slot: ExecutionSlotId) -> Option<usize> {\n        self.instance.frame_index_for_slot(slot)\n    }\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('legacy execution-delta anchor changed')
          legacy.write_text(text.replace(anchor, anchor + addition, 1))
          PY
      - name: Format
        run: cargo fmt --all --check
      - name: Focused tests
        run: cargo test -p noon-runtime -p noon-render-wgpu -p noon-web
      - name: Focused clippy
        run: cargo clippy -p noon-runtime -p noon-render-wgpu -p noon-web --all-targets -- -D warnings
      - name: WASM check
        run: cargo check -p noon-web --target wasm32-unknown-unknown
      - name: Commit clean rebased implementation
        run: |
          rm .github/workflows/b2-structural-rebase.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebase structural execution deltas onto current web runtime'
          git push
