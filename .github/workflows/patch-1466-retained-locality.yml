name: Patch 1466 retained locality

on:
  push:
    branches:
      - codex/1466-transient-retained-locality

permissions:
  contents: write

jobs:
  patch-and-qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout child branch
        uses: actions/checkout@v7
        with:
          ref: codex/1466-transient-retained-locality
          fetch-depth: 0

      - name: Apply retained-locality patch
        run: python3 .github/patch-1466-locality.py

      - name: Format and focused qualification
        run: |
          cargo fmt --all
          cargo test -p noon-runtime frame_changes_tests
          cargo test -p noon-runtime --test geometry_patch_locality transient_presentation_retirement_does_not_dirty_a_100k_stable_scene
          cargo test -p noon --lib execution_session::family_transform_tests
          cargo test -p noon-render-wgpu --lib presentation_only_redraw_reuses_mixed_retained_preparation
          bash scripts/transient-presentation-ratchet.test.sh
          bash scripts/transient-presentation-ratchet.sh
          bash scripts/check-architecture.sh 02e9ad8dec69a68b6a5794e141e9f73763b4ef2d
          git diff --check

      - name: Publish clean production commit
        run: |
          git config user.name "Noon CI"
          git config user.email "noon-ci@users.noreply.github.com"
          rm .github/workflows/patch-1466-retained-locality.yml .github/patch-1466-locality.py
          chmod +x scripts/transient-presentation-ratchet.sh scripts/transient-presentation-ratchet.test.sh
          git add -A
          git status --short
          git commit -m "Complete transient presentation locality"
          git push origin HEAD:codex/1466-transient-retained-locality
