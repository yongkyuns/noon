name: Sync Manim Create parity with master

on:
  push:
    branches:
      - parity/manim-create-partial

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parity/manim-create-partial
          fetch-depth: 100
      - name: Merge current master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master --depth=100
          git merge --no-edit origin/master
      - name: Format
        run: cargo fmt --all --check
      - name: Validate geometry and renderer
        run: |
          cargo test -p noon-geometry partial --lib
          cargo test -p noon-render-wgpu --lib
          cargo test -p noon --test manim_style_defaults
      - name: Validate Python compatibility syntax
        run: python3 -m py_compile web/python/_manim_compat.py web/python/noon.py
      - name: Remove temporary sync workflow
        run: rm .github/workflows/_sync-manim-create-master.yml
      - name: Commit synchronized branch
        run: |
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:parity/manim-create-partial
