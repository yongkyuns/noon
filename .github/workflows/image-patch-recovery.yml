name: Recover image qualification workspace (temporary)
on:
  push:
    branches: [codex/b2-image-workspace-bootstrap]
    paths: [.github/workflows/image-patch-recovery.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 07685b6f261e3e27db40a739c10f5f8d4690f732
          fetch-depth: 100
          persist-credentials: false
      - name: Export source history only
        run: |
          set -euo pipefail
          git branch image-head HEAD
          git fetch --no-tags --depth=150 origin master
          git branch image-base FETCH_HEAD
          mkdir -p /tmp/image-workspace
          git bundle create /tmp/image-workspace/source.bundle image-head image-base
          git rev-parse image-head image-base > /tmp/image-workspace/revisions.txt
          sha256sum /tmp/image-workspace/source.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: noon-image-current-workspace
          path: /tmp/image-workspace
          retention-days: 2
