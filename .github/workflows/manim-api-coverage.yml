name: Manim API coverage

on:
  push:
    branches:
      - master
    paths-ignore:
      - "crates/**/tests/**"
  pull_request:
    paths:
      - ".github/ci/manim-reference-constraints.txt"
      - '.github/workflows/manim-api-coverage.yml'
      - 'compat/manim-v0.21.0.json'
      - 'scripts/manim-api-coverage.py'
      - 'scripts/manim-class-queries.py'
      - 'web/python/_manim_compat.py'
      - 'web/python/test_manim_shared_family_paint.py'
      - 'scripts/manim-unit-scalars.py'
      - 'web/python/_manim_unit.py'
      - 'web/python/test_manim_unit.py'
      - 'scripts/manim-polynomial-easings.py'
      - 'scripts/manim-nonstandard-rate-data.py'
      - 'scripts/manim-user-rotation-matrices.py'
      - 'scripts/manim-user-vector-rotations.py'
      - 'web/python/test_manim_user_vector_rotations.py'
      - 'web/python/_manim_user_vectors.py'
      - 'web/python/test_manim_user_rotation_matrices.py'
      - 'scripts/manim-simple-functions.py'
      - 'scripts/pinned_python_helpers.py'
      - 'scripts/manim-user-array-normalization.py'
      - 'web/python/noon.py'
      - 'web/python/_manim_namespace.py'
      - 'web/python/_manim_rate_functions.py'
      - 'web/python/test_manim_polynomial_easings.py'
      - 'web/python/test_manim_rate_intervals.py'
      - 'web/python/test_manim_nonstandard_rate_data.py'
      - 'web/python/test_manim_api_coverage_policy.py'
      - 'web/python/test_manim_user_intersections.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manim-api-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: ManimCE 0.21.0 API inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Manim system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config

      - name: Install pinned ManimCE reference
        run: python -m pip install --disable-pip-version-check --constraint .github/ci/manim-reference-constraints.txt "manim==0.21.0"

      - name: Checkout pinned ManimCE source
        uses: actions/checkout@v7
        with:
          repository: ManimCommunity/manim
          ref: 861cd4849b17db1db3515b531ffe80b297848f93
          path: .pinned-manim-reference
          persist-credentials: false

      - name: Test public namespace policy and private helper boundaries
        run: |
          python -m unittest discover -s web/python -p test_manim_api_coverage_policy.py -v
          python -m unittest discover -s web/python -p test_manim_unit.py -v
          python -m unittest discover -s web/python -p test_manim_user_intersections.py -v
          python -m unittest discover -s web/python -p test_manim_polynomial_easings.py -v
          python -m unittest discover -s web/python -p test_manim_rate_intervals.py -v
          python -m unittest discover -s web/python -p test_manim_shared_family_paint.py -v
          python -m unittest discover -s web/python -p test_manim_nonstandard_rate_data.py -v
          python -m unittest discover -s web/python -p test_manim_user_rotation_matrices.py -v
          python -m unittest discover -s web/python -p test_manim_user_vector_rotations.py -v

      - name: Qualify module-only polynomial easing callables
        run: python scripts/manim-polynomial-easings.py .pinned-manim-reference --installed-manim

      - name: Qualify class queries and generic Group metadata
        run: python scripts/manim-class-queries.py .pinned-manim-reference --installed-manim

      - name: Qualify explicit nonstandard rate user data
        run: python scripts/manim-nonstandard-rate-data.py .pinned-manim-reference --installed-manim
      - name: Qualify explicit user-data rotation matrices
        run: python scripts/manim-user-rotation-matrices.py .pinned-manim-reference --installed-manim

      - name: Qualify module-only scalar units against complete Manim
        run: python scripts/manim-unit-scalars.py .pinned-manim-reference
      - name: Qualify explicit user vector rotation values
        run: python scripts/manim-user-vector-rotations.py .pinned-manim-reference --installed-manim

      - name: Validate and report public API coverage
        run: |
          python scripts/manim-api-coverage.py \
            --check \
            --write-markdown artifacts/manim-v0.21-api-coverage.md

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manim-v0.21-api-coverage
          path: artifacts/manim-v0.21-api-coverage.md
          if-no-files-found: error
          retention-days: 3
