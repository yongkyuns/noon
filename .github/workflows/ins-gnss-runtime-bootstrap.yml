name: INS GNSS runtime bootstrap

on:
  push:
    branches: [demo/ins-gnss-tutorial]
    paths: [.github/workflows/ins-gnss-runtime-bootstrap.yml]

permissions:
  contents: read

jobs:
  pinned-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Package pinned browser interpreter and authoring references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/pyodide runtime/source
          base=https://cdn.jsdelivr.net/pyodide/v314.0.5/full
          for file in pyodide.mjs pyodide.asm.js pyodide.asm.wasm python_stdlib.zip pyodide-lock.json; do
            curl --fail --location --retry 2 "$base/$file" -o "runtime/pyodide/$file"
          done
          sha256sum runtime/pyodide/* > runtime/pyodide-sha256.txt
          cp AGENTS.md README.md package.json runtime/source/
          cp -r skills compat scripts docs tools runtime/source/
          printf '%s\n' "$GITHUB_SHA" > runtime/source-revision.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ins-gnss-pinned-runtime
          path: runtime
          retention-days: 3
