name: INS GNSS runtime bootstrap

on:
  push:
    branches: [demo/ins-gnss-tutorial]
    paths: [.github/workflows/ins-gnss-runtime-bootstrap.yml]

permissions:
  contents: read

jobs:
  pinned-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Package pinned browser interpreter and authoring references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/reference
          curl --fail --location --retry 2 https://github.com/pyodide/pyodide/releases/download/314.0.5/pyodide-core-314.0.5.tar.bz2 -o runtime/pyodide-core.tar.bz2
          echo 'f528dccea95fa8ec54295fd65bf86dd61183d11f0e52563dc8eadda45e0f78d6  runtime/pyodide-core.tar.bz2' | sha256sum --check --strict
          git archive HEAD --format=tar.gz -o runtime/source.tar.gz
          curl --fail --location --retry 2 https://raw.githubusercontent.com/fedorbaklanov/open-aided-navigation/0d33f229a0abbefeee084cc4306bdc3a47d5862f/demo/insGnssLoose/Documentation_InsGnssFilterLoose.pdf -o runtime/reference/Documentation_InsGnssFilterLoose.pdf
          printf '%s\n' "$GITHUB_SHA" > runtime/source-revision.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ins-gnss-pinned-runtime
          path: runtime
          retention-days: 3
