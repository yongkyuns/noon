name: Tiger fix workspace
on:
  push:
    branches: [fix/ghostscript-tiger-filled-morph]
    paths: [.github/workflows/tiger-fix-workspace.yml]
permissions:
  contents: read
concurrency:
  group: tiger-fix-workspace
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  prepare:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate: ${{ steps.publish.outputs.candidate }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Use repository-pinned Rust
        run: rustup install
      - name: Apply shared SVG correction and publish formatted exact candidate
        id: publish
        run: |
          if test -f scripts/tiger-parity-finish.py; then
            python3 scripts/tiger-parity-finish.py
            rm scripts/tiger-parity-finish.py
          fi
          cargo fmt --all
          git diff --check
          git config user.name 'Noon fix validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'fix: match Manim SVG placement and remove validation blockers'
            git push origin HEAD:refs/heads/fix/ghostscript-tiger-filled-morph
          fi
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Export exact source
        run: |
          git archive --format=tar -o /tmp/noon-source.tar HEAD
          git diff 6d6cc95cc307379df700cf22a8b889e0cb60b442 HEAD > /tmp/noon-tiger.patch
          git rev-parse HEAD > /tmp/noon-tested-head.txt
      - uses: actions/upload-artifact@v7
        with:
          name: tiger-parity-source
          path: |
            /tmp/noon-source.tar
            /tmp/noon-tiger.patch
            /tmp/noon-tested-head.txt
          retention-days: 7
  rust:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          fetch-depth: 0
      - name: Use pinned Rust
        run: rustup install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - name: Focused SVG and family regressions
        run: |
          cargo test -p noon --lib svg_authoring
          cargo test -p noon --lib family_transform_renderer_publication_tests
          cargo test -p noon-compile --test family_transform_padding_paint
          cargo test -p noon-render-wgpu --all-features --test complex_filled_morph
      - name: Repository Rust gate including all integration tests
        if: ${{ !cancelled() }}
        run: |
          mkdir -p browser-smoke-artifacts/tiger-rust
          bash scripts/check.sh rust 6d6cc95cc307379df700cf22a8b889e0cb60b442 2>&1 | tee browser-smoke-artifacts/tiger-rust/check.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tiger-rust-proof
          path: browser-smoke-artifacts/tiger-rust
          retention-days: 7
  browser:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Use pinned Rust and WASM target
        run: |
          rustup install
          rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Build the exact committed browser engine
        env:
          NOON_SKIP_WEB_PREFLIGHT: '1'
          NOON_WASM_SKIP_OPT: '1'
          NOON_WASM_PROFILE: dev
        run: |
          git rev-parse HEAD
          bash scripts/check.sh web 6d6cc95cc307379df700cf22a8b889e0cb60b442
      - name: Install browser and reference renderer dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config
          python -m pip install --disable-pip-version-check 'manim==0.21.0'
      - name: Render real Manim reference on the same black background
        run: python scripts/tiger-manim-reference.py
      - name: Capture exact-time production browser frames
        if: ${{ !cancelled() }}
        run: node scripts/tiger-manim-differential.mjs
      - name: Compare all leaf paints and intermediate rasters
        if: ${{ !cancelled() }}
        run: python scripts/compare-tiger-manim.py
      - name: Exercise actual gallery run and family completion
        if: ${{ !cancelled() }}
        run: node scripts/playground-python-family-transform-smoke.mjs
      - name: Exercise actual gallery tiger playback
        if: ${{ !cancelled() }}
        run: node scripts/playground-tiger-morph-smoke.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tiger-parity-browser-proof
          path: browser-smoke-artifacts
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tiger-parity-runtime
          path: |
            web/pkg
            web/python-worker.js
            web/runtime-build-identity.json
            web/python/compat-bundle.*.json
          retention-days: 7
