name: Apply Manim transform correspondence patch

on:
  push:
    branches:
      - fix/manim-transform-world-points
    paths:
      - .github/workflows/agent-manim-transform-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manim-transform-world-points
          fetch-depth: 0
      - name: Apply scoped parity patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} match(es), found {found} for:\n{old[:300]}")
              p.write_text(text.replace(old, new, count))

          # Runtime: Manim Transform interpolates already-transformed VMobject points.
          replace(
              "crates/noon-runtime/src/lib.rs",
              """use noon_core::{\n    Color, GeometryRef, ObjectId, ObjectSnapshot, Property, ScenePatch, Style, TrackValues,\n    Transform2D, Vec2,\n};""",
              """use noon_core::{\n    Color, GeometryRef, ObjectId, ObjectSnapshot, PathCommand, Property, ScenePatch,\n    StrokeWidthMode, Style, TrackValues, Transform2D, Vec2, VectorPath,\n};""",
          )
          replace(
              "crates/noon-runtime/src/lib.rs",
              """    let next_render_geometry = match plan {\n        TransformGeometryPlan::PathPair(prepared) => Some(prepared),\n        _ => None,\n    };""",
              """    let owned_render_geometry = match plan {\n        TransformGeometryPlan::PathPair(prepared)\n            if from.style.stroke_width_mode == StrokeWidthMode::ScreenSpace\n                && to.style.stroke_width_mode == StrokeWidthMode::ScreenSpace =>\n        {\n            screen_space_path_pair_relative_to_current(prepared, from, to, next_transform)\n        }\n        _ => None,\n    };\n    let next_render_geometry = if let Some(geometry) = owned_render_geometry.as_ref() {\n        Some(geometry)\n    } else {\n        match plan {\n            TransformGeometryPlan::PathPair(prepared) => Some(prepared),\n            _ => None,\n        }\n    };""",
          )
          replace(
              "crates/noon-runtime/src/lib.rs",
              """fn apply_transform_geometry(\n    current: &mut GeometryRef,""",
              """fn screen_space_path_pair_relative_to_current(\n    prepared: &GeometryRef,\n    from: &ObjectSnapshot,\n    to: &ObjectSnapshot,\n    current: Transform2D,\n) -> Option<GeometryRef> {\n    let GeometryRef::VectorPath(source) = prepared else {\n        return None;\n    };\n    let target = source.morph_target()?;\n    let source = path_relative_to_current(source, from.transform, current)?;\n    let target = path_relative_to_current(target, to.transform, current)?;\n    Some(GeometryRef::path(source.with_morph_target(target)))\n}\n\nfn path_relative_to_current(\n    path: &VectorPath,\n    endpoint: Transform2D,\n    current: Transform2D,\n) -> Option<VectorPath> {\n    let mut transformed = VectorPath::new();\n    for command in path.commands() {\n        transformed = match *command {\n            PathCommand::MoveTo { to } => {\n                transformed.move_to(point_relative_to_current(to, endpoint, current)?)\n            }\n            PathCommand::LineTo { to } => {\n                transformed.line_to(point_relative_to_current(to, endpoint, current)?)\n            }\n            PathCommand::QuadraticTo { control, to } => transformed.quadratic_to(\n                point_relative_to_current(control, endpoint, current)?,\n                point_relative_to_current(to, endpoint, current)?,\n            ),\n            PathCommand::CubicTo {\n                control1,\n                control2,\n                to,\n            } => transformed.cubic_to(\n                point_relative_to_current(control1, endpoint, current)?,\n                point_relative_to_current(control2, endpoint, current)?,\n                point_relative_to_current(to, endpoint, current)?,\n            ),\n            PathCommand::Close => transformed.close(),\n        };\n    }\n    Some(transformed)\n}\n\nfn point_relative_to_current(\n    point: Vec2,\n    endpoint: Transform2D,\n    current: Transform2D,\n) -> Option<Vec2> {\n    const MIN_SCALE: f32 = 1.0e-7;\n    if !current.scale.x.is_finite()\n        || !current.scale.y.is_finite()\n        || current.scale.x.abs() <= MIN_SCALE\n        || current.scale.y.abs() <= MIN_SCALE\n    {\n        return None;\n    }\n    let world = endpoint.transform_point(point);\n    let relative = (world - current.translation).rotate(-current.rotation);\n    let result = Vec2::new(relative.x / current.scale.x, relative.y / current.scale.y);\n    (result.x.is_finite() && result.y.is_finite()).then_some(result)\n}\n\nfn apply_transform_geometry(\n    current: &mut GeometryRef,""",
          )

          # Geometry planning: preserve authored start point / winding for Manim paths.
          replace(
              "crates/noon-geometry/src/morph.rs",
              """pub fn plan_morph(\n    source: &VectorPath,\n    target: &VectorPath,\n    options: MorphOptions,\n) -> Result<MorphPlan, MorphError> {\n    validate_options(options)?;""",
              """pub fn plan_morph(\n    source: &VectorPath,\n    target: &VectorPath,\n    options: MorphOptions,\n) -> Result<MorphPlan, MorphError> {\n    plan_morph_impl(source, target, options, true)\n}\n\n/// Plan a morph while preserving the authored contour start point and winding.\n///\n/// ManimCE Transform aligns VMobject cubic arrays by index and does not cyclically\n/// rotate a closed contour to minimize geometric distance. This mode exists for\n/// the compatibility renderer; native Noon morph planning keeps geometric alignment.\npub fn plan_morph_preserving_order(\n    source: &VectorPath,\n    target: &VectorPath,\n    options: MorphOptions,\n) -> Result<MorphPlan, MorphError> {\n    plan_morph_impl(source, target, options, false)\n}\n\nfn plan_morph_impl(\n    source: &VectorPath,\n    target: &VectorPath,\n    options: MorphOptions,\n    align_closed_correspondence: bool,\n) -> Result<MorphPlan, MorphError> {\n    validate_options(options)?;""",
          )
          replace(
              "crates/noon-geometry/src/morph.rs",
              """        if source.closed {\n            target_points = align_closed_contour(&source_points, &target_points);\n        }""",
              """        if source.closed && align_closed_correspondence {\n            target_points = align_closed_contour(&source_points, &target_points);\n        }""",
          )
          replace(
              "crates/noon-geometry/src/morph.rs",
              """pub fn plan_filled_morph(\n    source: &VectorPath,\n    target: &VectorPath,\n    options: MorphOptions,\n) -> Result<FilledMorphPlan, FilledMorphError> {\n    let plan = plan_morph(source, target, options)?;""",
              """pub fn plan_filled_morph(\n    source: &VectorPath,\n    target: &VectorPath,\n    options: MorphOptions,\n) -> Result<FilledMorphPlan, FilledMorphError> {\n    plan_filled_morph_impl(source, target, options, true)\n}\n\n/// Filled-path counterpart of [`plan_morph_preserving_order`].\npub fn plan_filled_morph_preserving_order(\n    source: &VectorPath,\n    target: &VectorPath,\n    options: MorphOptions,\n) -> Result<FilledMorphPlan, FilledMorphError> {\n    plan_filled_morph_impl(source, target, options, false)\n}\n\nfn plan_filled_morph_impl(\n    source: &VectorPath,\n    target: &VectorPath,\n    options: MorphOptions,\n    align_closed_correspondence: bool,\n) -> Result<FilledMorphPlan, FilledMorphError> {\n    let plan = plan_morph_impl(source, target, options, align_closed_correspondence)?;""",
          )
          replace(
              "crates/noon-geometry/src/morph.rs",
              """    contour.target_points =\n        align_closed_contour_preserving_winding(&contour.source_points, &contour.target_points);""",
              """    if align_closed_correspondence {\n        contour.target_points =\n            align_closed_contour_preserving_winding(&contour.source_points, &contour.target_points);\n    }""",
          )

          # Tessellation: expose an ordered-morph entry point without changing native defaults.
          replace(
              "crates/noon-geometry/src/tessellation.rs",
              """pub fn tessellate_styled_with_fill(\n    path: &VectorPath,\n    stroke_width: f32,\n    stroke_join: StrokeJoin,\n    stroke_cap: StrokeCap,\n    fill_enabled: bool,\n) -> Result<TessellatedPath, GeometryError> {\n    if !stroke_width.is_finite() || stroke_width < 0.0 {""",
              """pub fn tessellate_styled_with_fill(\n    path: &VectorPath,\n    stroke_width: f32,\n    stroke_join: StrokeJoin,\n    stroke_cap: StrokeCap,\n    fill_enabled: bool,\n) -> Result<TessellatedPath, GeometryError> {\n    tessellate_styled_with_fill_impl(\n        path,\n        stroke_width,\n        stroke_join,\n        stroke_cap,\n        fill_enabled,\n        false,\n    )\n}\n\n/// Tessellate a morph while retaining source/target contour point order.\n///\n/// This is used by the Manim compatibility path, whose Transform contract is\n/// index-based rather than Noon's native minimum-distance closed-contour matching.\npub fn tessellate_styled_with_fill_preserving_morph_order(\n    path: &VectorPath,\n    stroke_width: f32,\n    stroke_join: StrokeJoin,\n    stroke_cap: StrokeCap,\n    fill_enabled: bool,\n) -> Result<TessellatedPath, GeometryError> {\n    tessellate_styled_with_fill_impl(\n        path,\n        stroke_width,\n        stroke_join,\n        stroke_cap,\n        fill_enabled,\n        true,\n    )\n}\n\nfn tessellate_styled_with_fill_impl(\n    path: &VectorPath,\n    stroke_width: f32,\n    stroke_join: StrokeJoin,\n    stroke_cap: StrokeCap,\n    fill_enabled: bool,\n    preserve_morph_order: bool,\n) -> Result<TessellatedPath, GeometryError> {\n    if !stroke_width.is_finite() || stroke_width < 0.0 {""",
          )
          replace(
              "crates/noon-geometry/src/tessellation.rs",
              """            stroke_cap,\n            fill_enabled,\n        );""",
              """            stroke_cap,\n            fill_enabled,\n            preserve_morph_order,\n        );""",
          )
          replace(
              "crates/noon-geometry/src/tessellation.rs",
              """fn tessellate_morph_path(\n    source: &VectorPath,\n    target: &VectorPath,\n    stroke_width: f32,\n    stroke_join: StrokeJoin,\n    stroke_cap: StrokeCap,\n    fill_enabled: bool,\n) -> Result<TessellatedPath, GeometryError> {""",
              """fn tessellate_morph_path(\n    source: &VectorPath,\n    target: &VectorPath,\n    stroke_width: f32,\n    stroke_join: StrokeJoin,\n    stroke_cap: StrokeCap,\n    fill_enabled: bool,\n    preserve_morph_order: bool,\n) -> Result<TessellatedPath, GeometryError> {""",
          )
          replace(
              "crates/noon-geometry/src/tessellation.rs",
              """        let fill = crate::plan_filled_morph(source, target, crate::MorphOptions::DEFAULT).map_err(\n            |error| GeometryError::Tessellation(format!(\"filled morph planning failed: {error}\")),\n        )?;""",
              """        let fill = if preserve_morph_order {\n            crate::plan_filled_morph_preserving_order(\n                source,\n                target,\n                crate::MorphOptions::DEFAULT,\n            )\n        } else {\n            crate::plan_filled_morph(source, target, crate::MorphOptions::DEFAULT)\n        }\n        .map_err(|error| {\n            GeometryError::Tessellation(format!(\"filled morph planning failed: {error}\"))\n        })?;""",
          )
          replace(
              "crates/noon-geometry/src/tessellation.rs",
              """    let plan = crate::plan_morph(source, target, crate::MorphOptions::DEFAULT)\n        .map_err(|error| GeometryError::Tessellation(format!(\"morph planning failed: {error}\")))?;""",
              """    let plan = if preserve_morph_order {\n        crate::plan_morph_preserving_order(source, target, crate::MorphOptions::DEFAULT)\n    } else {\n        crate::plan_morph(source, target, crate::MorphOptions::DEFAULT)\n    }\n    .map_err(|error| GeometryError::Tessellation(format!(\"morph planning failed: {error}\")))?;""",
          )

          # Renderer: ScreenSpace is the established Manim compatibility stroke mode.
          replace(
              "crates/noon-render-wgpu/src/lib.rs",
              """        let mesh = noon_geometry::tessellate_styled_with_fill(\n            tessellation_path,\n            style.stroke_width,\n            style.stroke_join,\n            style.stroke_cap,\n            fill_enabled,\n        )?;""",
              """        let mesh = if style.stroke_width_mode == StrokeWidthMode::ScreenSpace\n            && tessellation_path.morph_target().is_some()\n        {\n            noon_geometry::tessellate_styled_with_fill_preserving_morph_order(\n                tessellation_path,\n                style.stroke_width,\n                style.stroke_join,\n                style.stroke_cap,\n                fill_enabled,\n            )?\n        } else {\n            noon_geometry::tessellate_styled_with_fill(\n                tessellation_path,\n                style.stroke_width,\n                style.stroke_join,\n                style.stroke_cap,\n                fill_enabled,\n            )?\n        };""",
          )

          Path(".github/workflows/agent-manim-transform-patch.yml").unlink()
          PY
          cargo fmt --all
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Match Manim ordered Transform correspondence"
          git push origin HEAD:fix/manim-transform-world-points
