name: B6 decimal endpoint validation

on:
  push:
    branches: [validation/b6-decimal-endpoint-20260925]

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 62ed4e77ee3bd1541bfa07734f99da5cb755a543
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact candidate
        run: |
          mkdir -p ci-artifacts/decimal-native
          git rev-parse HEAD | tee ci-artifacts/decimal-native/source-sha.txt
          git rev-parse HEAD^{tree} | tee ci-artifacts/decimal-native/tree.txt
          test "$(git rev-parse HEAD^{tree})" = d5685dba484edd70259ab3eb6651934afd4538c3
          git diff 501b29ff48ad33a39f5fd956136b34db09ed7c47 HEAD --binary > ci-artifacts/decimal-native/candidate.patch
      - name: Install repository-pinned Rust
        run: rustup install
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: provider-sources-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: provider-sources-${{ runner.os }}-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Formatting and native endpoint reproduction
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee ci-artifacts/decimal-native/format.log
          cargo test -p noon --no-default-features --test segment_decimal_endpoints -- --nocapture 2>&1 | tee ci-artifacts/decimal-native/endpoint.log
          cargo test -p noon --no-default-features --lib 2>&1 | tee ci-artifacts/decimal-native/library.log
          cargo check -p noon --no-default-features --target wasm32-unknown-unknown --lib 2>&1 | tee ci-artifacts/decimal-native/wasm-check.log
      - name: Checker regressions and rounded-terminal negative control
        shell: bash
        run: |
          set -o pipefail
          node --test scripts/foreground-matching-*.test.mjs 2>&1 | tee ci-artifacts/decimal-native/node.log
          python3 scripts/foreground-matching-membership.test.py 2>&1 | tee ci-artifacts/decimal-native/python.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('parity/manim-v0.21/foreground-matching-manifest.json')
          obj = json.loads(p.read_text())
          for fixture in obj['fixtures']:
              fixture['expected_duration'] = 2.4
          p.write_text(json.dumps(obj, indent=2) + '\n')
          PY
          set +e
          node --test scripts/foreground-matching-checks.test.mjs > ci-artifacts/decimal-native/rounded-negative.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > ci-artifacts/decimal-native/rounded-negative-exit.txt
          git restore parity/manim-v0.21/foreground-matching-manifest.json
          test "$status" -ne 0
          grep -q 'not ok.*all three cases require complete' ci-artifacts/decimal-native/rounded-negative.log
          node --test scripts/foreground-matching-checks.test.mjs 2>&1 | tee ci-artifacts/decimal-native/restored.log
          git diff --exit-code
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: decimal-native-${{ github.run_id }}
          path: ci-artifacts/decimal-native
          if-no-files-found: error
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NOON_MANIM_RASTER_MANIFEST: parity/manim-v0.21/foreground-matching-manifest.json
      NOON_MANIM_RASTER_ARTIFACTS: foreground-matching-artifacts
      NOON_MANIM_RASTER_BACKENDS: webgpu,webgl
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 62ed4e77ee3bd1541bfa07734f99da5cb755a543
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact candidate
        run: |
          mkdir -p ci-artifacts/decimal-browser
          git rev-parse HEAD | tee ci-artifacts/decimal-browser/source-sha.txt
          git rev-parse HEAD^{tree} | tee ci-artifacts/decimal-browser/tree.txt
          test "$(git rev-parse HEAD^{tree})" = d5685dba484edd70259ab3eb6651934afd4538c3
          git diff 501b29ff48ad33a39f5fd956136b34db09ed7c47 HEAD --binary > ci-artifacts/decimal-browser/candidate.patch
      - uses: ./.github/actions/dev-wasm-build
        with:
          preflight: 'true'
          cache-ref: 3546b230d3e0b012b21444946b896d98d21e95c6
          publish-cache: 'false'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned reference and browser
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config
          python -m pip install --disable-pip-version-check 'manim==0.21.0'
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Capture actual Cairo and worker frames
        id: raster
        continue-on-error: true
        shell: bash
        run: node scripts/manim-raster-differential.mjs 2>&1 | tee ci-artifacts/decimal-browser/raster.log
      - name: Enforce unchanged whole-frame tolerances
        id: tolerances
        if: always() && steps.raster.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: node scripts/manim-raster-enforce.mjs 2>&1 | tee ci-artifacts/decimal-browser/tolerances.log
      - name: Enforce unchanged overlap and visibility witnesses
        id: witnesses
        if: always() && steps.raster.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: node scripts/foreground-matching-checks.mjs 2>&1 | tee ci-artifacts/decimal-browser/witnesses.log
      - name: Require exact sparse and dense playback
        id: cadence
        if: always() && steps.raster.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: node scripts/shared-playback-raster.mjs 2>&1 | tee ci-artifacts/decimal-browser/cadence.log
      - name: Record actual outcomes
        if: always()
        env:
          RASTER: ${{ steps.raster.outcome }}
          TOLERANCES: ${{ steps.tolerances.outcome }}
          WITNESSES: ${{ steps.witnesses.outcome }}
          CADENCE: ${{ steps.cadence.outcome }}
        run: |
          printf 'raster=%s\ntolerances=%s\nwitnesses=%s\ncadence=%s\n' "$RASTER" "$TOLERANCES" "$WITNESSES" "$CADENCE" > ci-artifacts/decimal-browser/outcomes.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: decimal-browser-${{ github.run_id }}
          path: |
            ci-artifacts/decimal-browser
            foreground-matching-artifacts
          if-no-files-found: error
          retention-days: 14
      - name: Require every qualification stage
        if: always()
        env:
          RASTER: ${{ steps.raster.outcome }}
          TOLERANCES: ${{ steps.tolerances.outcome }}
          WITNESSES: ${{ steps.witnesses.outcome }}
          CADENCE: ${{ steps.cadence.outcome }}
        run: |
          test "$RASTER" = success
          test "$TOLERANCES" = success
          test "$WITNESSES" = success
          test "$CADENCE" = success
