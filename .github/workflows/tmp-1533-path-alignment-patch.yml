name: Temporary 1533 path alignment migration

on:
  push:
    branches:
      - codex/1533-scene-path-alignment
    paths:
      - .github/workflows/tmp-1533-path-alignment-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/1533-scene-path-alignment
          fetch-depth: 0
      - name: Migrate path alignment to Scene and delete LiveSession module
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          ROOT = Path('.')

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement anchor, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1. Keep alignment preparation neutral; add only the Scene-owned running publication seam.
          path = ROOT / 'crates/noon/src/path_alignment.rs'
          replace_once(
              path,
              '''use crate::{
              path_editing::{world_path, PreparedPathEdits},
              AuthoringError, Mobject,
          };
          use noon_core::{SemanticNodeId, SemanticObjectState, SemanticStore};
          ''',
              '''use crate::{
              path_editing::{world_path, PreparedPathEdits},
              AuthoringError, ExecutionSession, Mobject,
          };
          use noon_core::{SemanticNodeId, SemanticObjectState, SemanticStore};
          use std::{cell::RefCell, rc::Rc};
          ''',
          )
          text = path.read_text(encoding='utf-8')
          anchor = 'impl Mobject {\n'
          if text.count(anchor) != 1:
              raise SystemExit('path_alignment.rs: impl Mobject anchor changed')
          helper = '''pub(crate) fn publish_alignment(
              store: &Rc<RefCell<SemanticStore>>,
              root: SemanticNodeId,
              execution: &mut ExecutionSession,
              left: &Mobject,
              right: &Mobject,
          ) -> Result<(), AuthoringError> {
              if !Rc::ptr_eq(store, left.integration_store())
                  || !Rc::ptr_eq(store, right.integration_store())
              {
                  return Err(AuthoringError::ForeignStore);
              }
              left.validate()?;
              right.validate()?;
              if left.node_id() == right.node_id() {
                  return Ok(());
              }
              execution
                  .require_resource_creation_at_root(&store.borrow(), root)
                  .map_err(AuthoringError::from)?;
              let left = (
                  left.node_id(),
                  crate::effective_capture::capture_mobject_state(store, execution, left)?,
              );
              let right = (
                  right.node_id(),
                  crate::effective_capture::capture_mobject_state(store, execution, right)?,
              );
              let mut store = store.borrow_mut();
              prepare_alignment(&store, left, right)?.publish(&mut store, |store, transaction| {
                  execution
                      .apply_semantic_transaction_at_root(store, root, transaction)
                      .map(|_| ())
                      .map_err(AuthoringError::from)
              })?;
              Ok(())
          }

          '''
          path.write_text(text.replace(anchor, helper + anchor, 1), encoding='utf-8')

          # 2. Route cold/running alignment through Scene. Cold keeps the existing authored operation.
          path = ROOT / 'crates/noon/src/scene.rs'
          text = path.read_text(encoding='utf-8')
          anchor = '''    /// Observe one family's effective Runtime layout without creating a borrowed
              /// LiveSession control facade. Cold Scenes fail explicitly rather than returning
          '''
          if text.count(anchor) != 1:
              raise SystemExit('scene.rs: family-layout insertion anchor changed')
          method = '''    /// Align two persistent paths using authored state while cold and one coherent
              /// effective Runtime publication while running. Resource admission and publication
              /// stay owned by this Scene; no borrowed LiveSession facade is created.
              pub fn align_points(
                  &mut self,
                  left: &Mobject,
                  right: &Mobject,
              ) -> Result<(), AuthoringError> {
                  let root = self.root;
                  let store = &self.store;
                  if let Some(execution) = self.execution.as_mut() {
                      return crate::path_alignment::publish_alignment(
                          store, root, execution, left, right,
                      );
                  }
                  self.require_object(left)?;
                  self.require_object(right)?;
                  left.align_points(right)
              }

          '''
          path.write_text(text.replace(anchor, method + anchor, 1), encoding='utf-8')

          # 3. Delete the LiveSession path-alignment module declaration and implementation file.
          path = ROOT / 'crates/noon/src/live_session.rs'
          replace_once(path, 'mod path_alignment;\n', '')
          live_alignment = ROOT / 'crates/noon/src/live_session/path_alignment.rs'
          if not live_alignment.exists():
              raise SystemExit('live_session/path_alignment.rs is already missing unexpectedly')
          live_alignment.unlink()

          # 4. Move live alignment acceptance to Scene-owned running execution.
          tests = ROOT / 'crates/noon/tests/path_alignment.rs'
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              'use noon::{AnimationOptions, ManimGeometryOptions, Scene, Vec2, VectorPath};',
              'use noon::{ManimGeometryOptions, Scene, Vec2, VectorPath};',
              1,
          )

          def remove_test(source, name):
              marker = f'#[test]\nfn {name}('
              start = source.find(marker)
              if start < 0:
                  raise SystemExit(f'path_alignment tests: missing {name}')
              brace = source.find('{', start)
              if brace < 0:
                  raise SystemExit(f'path_alignment tests: missing body for {name}')
              depth = 0
              end = None
              for index in range(brace, len(source)):
                  char = source[index]
                  if char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          break
              if end is None:
                  raise SystemExit(f'path_alignment tests: unterminated body for {name}')
              while end < len(source) and source[end] == '\n':
                  end += 1
              return source[:start] + source[end:]

          for name in (
              'live_alignment_publishes_both_operands_coherently',
              'live_self_alignment_is_noop_before_unsupported_current_capture',
              'live_foreign_alignment_fails_before_resource_or_frame_publication',
          ):
              text = remove_test(text, name)
          tests.write_text(text, encoding='utf-8')

          # 5. Add focused Scene-owned running regressions equivalent to the retired LiveSession tests.
          scene_tests = ROOT / 'crates/noon/src/scene/tests.rs'
          text = scene_tests.read_text(encoding='utf-8')
          if 'fn scene_path_alignment_publishes_effective_operands_coherently()' in text:
              raise SystemExit('scene path-alignment tests already exist')
          text += '''

          #[test]
          fn scene_path_alignment_publishes_effective_operands_coherently() {
              let mut scene = Scene::new();
              let left = scene.line((0.0, 0.0), (3.0, 0.0)).unwrap();
              let right = scene.square(2.0).unwrap();
              scene.add(&left).unwrap();
              scene.add(&right).unwrap();
              let execution = scene.execution_session().unwrap();
              scene.install_execution(execution);
              {
                  let mut live = scene.owned_live();
                  live.shift(&left, 1.0, 2.0).unwrap();
              }

              scene.align_points(&left, &right).unwrap();

              let left_query = scene.effective_path_query(&left).unwrap();
              let right_query = scene.effective_path_query(&right).unwrap();
              assert_eq!(left_query.curve_count(), 4);
              assert_eq!(right_query.curve_count(), 4);
              assert_eq!(left_query.start().unwrap(), (1.0, 2.0));
          }

          #[test]
          fn scene_path_alignment_self_alias_is_noop_before_unsupported_capture() {
              let mut scene = Scene::new();
              let object = scene.circle(1.0).unwrap();
              let execution = scene.execution_session().unwrap();
              scene.install_execution(execution);
              {
                  let mut live = scene.owned_live();
                  live.declare_and_activate_create(&object, AnimationOptions::new())
                      .unwrap();
              }
              scene.owned_execution_mut().take_frame_changes();
              let revision = scene.revision();
              let resources = scene
                  .integration_store()
                  .borrow()
                  .geometry_resources()
                  .len();

              scene.align_points(&object, &object).unwrap();

              assert_eq!(scene.revision(), revision);
              assert_eq!(
                  scene
                      .integration_store()
                      .borrow()
                      .geometry_resources()
                      .len(),
                  resources
              );
              assert!(scene.owned_execution_mut().take_frame_changes().is_empty());
          }

          #[test]
          fn scene_path_alignment_rejects_foreign_before_resource_or_frame_publication() {
              let mut scene = Scene::new();
              let object = scene.line((0.0, 0.0), (3.0, 0.0)).unwrap();
              scene.add(&object).unwrap();
              let foreign = Scene::new().square(2.0).unwrap();
              let execution = scene.execution_session().unwrap();
              scene.install_execution(execution);
              scene.owned_execution_mut().take_frame_changes();
              let before = object.state().unwrap();
              let revision = scene.revision();
              let resources = scene
                  .integration_store()
                  .borrow()
                  .geometry_resources()
                  .len();

              assert!(scene.align_points(&object, &foreign).is_err());

              assert_eq!(object.state().unwrap(), before);
              assert_eq!(scene.revision(), revision);
              assert_eq!(
                  scene
                      .integration_store()
                      .borrow()
                      .geometry_resources()
                      .len(),
                  resources
              );
              assert!(scene.owned_execution_mut().take_frame_changes().is_empty());
          }
          '''
          scene_tests.write_text(text, encoding='utf-8')
          '@ | Set-Content -Encoding utf8 patch1533.py
          python patch1533.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item patch1533.py

          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Remove-Item .github/workflows/tmp-1533-path-alignment-patch.yml
          $changed = @(git diff --name-only | Sort-Object)
          $expected = @(
            '.github/workflows/tmp-1533-path-alignment-patch.yml',
            'crates/noon/src/live_session.rs',
            'crates/noon/src/live_session/path_alignment.rs',
            'crates/noon/src/path_alignment.rs',
            'crates/noon/src/scene.rs',
            'crates/noon/src/scene/tests.rs',
            'crates/noon/tests/path_alignment.rs'
          ) | Sort-Object
          if (Compare-Object $changed $expected) {
            Write-Error "unexpected changed-file set: $($changed -join ', ')"
            exit 1
          }
          if (Test-Path crates/noon/src/live_session/path_alignment.rs) {
            Write-Error 'LiveSession path-alignment module still exists'
            exit 1
          }
          if (Select-String -Quiet -Path crates/noon/src/live_session.rs -Pattern '^mod path_alignment;$') {
            Write-Error 'LiveSession path-alignment module declaration still exists'
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move path alignment onto Scene-owned execution"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:codex/1533-scene-path-alignment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
