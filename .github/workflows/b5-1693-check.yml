name: Isolated B5 1693 final validation
on:
  push:
    branches: [codex/b5-1693-check-20260920]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE: e186555ef306f76acabfca91a3e6b7e75022479c
      BASE: 8b3286475869960e59928372cfb47662f0a28b11
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout exact uninstrumented candidate
        run: |
          git fetch --no-tags --depth=1 origin "$SOURCE" "$BASE"
          git checkout --detach "$SOURCE"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git rev-parse HEAD:crates/noon/src/coordinate_authoring/number_plane.rs)" = 65d80cb8ad4aef07f1042f74d1ecbddef261c8aa
          test "$(git rev-parse HEAD:crates/noon/src/example_scenes/number_plane.rs)" = d4e9b4ba272f5ef8ea4b7ea069ad0d4949bce385
          git diff --exit-code
      - name: Use repository-pinned Rust
        run: |
          rustup install
          rustc --version --verbose
          cargo fmt --all -- --check
      - name: Cache Cargo sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - name: Repeat geometry-only NumberPlane and implicit examples
        run: |
          for repeat in 1 2 3; do
            cargo test -p noon --no-default-features --lib example_scenes::number_plane
            cargo test -p noon --no-default-features --lib example_scenes::implicit_plotting
          done
      - name: Validate ordinary full fast gate
        run: bash scripts/check.sh fast "$BASE"
      - name: Repeat text-enabled NumberPlane and implicit examples
        if: ${{ !cancelled() }}
        run: |
          for repeat in 1 2 3; do
            cargo test -p noon --all-features --lib example_scenes::number_plane
            cargo test -p noon --all-features --lib example_scenes::implicit_plotting
          done
      - name: Compile actual WASM adapter
        if: ${{ !cancelled() }}
        run: cargo check -p noon-web --all-features --target wasm32-unknown-unknown
      - name: Validate Python facade tests
        if: ${{ !cancelled() }}
        run: |
          python3 -m unittest discover -s web/python -p test_manim_number_plane.py
          python3 -m unittest discover -s web/python -p test_manim_implicit.py
      - name: Verify exact source was unchanged
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git diff --exit-code
          echo "Validated source $SOURCE without code edits or assertion changes."
