name: Diagnostic prefix session
on:
  push:
    branches: [diagnostic/noon-prefix-session-20261022]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: true
      SCCACHE_GHA_RW_MODE: READ_ONLY
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Apply exact-baseline candidate
        run: python3 .github/diagnostics/prefix-session.py apply
      - name: Install pinned Rust and software Vulkan
        run: |
          rustup install
          rustc --version --verbose | tee /tmp/noon-prefix-session/rustc.txt
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      - name: Format and retain candidate
        run: |
          cargo fmt --all
          python3 .github/diagnostics/prefix-session.py save
      - name: Runtime prefix guard and transfer regressions
        shell: bash
        run: |
          set -o pipefail
          env -u DISPLAY -u WAYLAND_DISPLAY cargo test --locked -p noon-runtime --features prepared-prefix --test prefix_bindings --test prefix_interactions --test prefix_lifecycle --test prefix_reactive_admission --test prefix_transfer -- --include-ignored --nocapture --test-threads=1 2>&1 | tee /tmp/noon-prefix-session/runtime-tests.log
      - name: Shared pointer and actual Vulkan prefix qualification
        shell: bash
        run: |
          set -o pipefail
          env -u DISPLAY -u WAYLAND_DISPLAY cargo test --locked -p noon --no-default-features --features prepared-prefix --test prepared_prefix_identity --test prepared_prefix_lifecycle --test prepared_prefix_interactions --test prepared_prefix_incremental --test prepared_prefix_bindings --test prepared_prefix_raster -- --include-ignored --nocapture --test-threads=1 2>&1 | tee /tmp/noon-prefix-session/session-tests.log
      - name: Direct Rust WASM compilation
        shell: bash
        run: |
          set -o pipefail
          cargo check --locked -p noon --no-default-features --features prepared-prefix --target wasm32-unknown-unknown 2>&1 | tee /tmp/noon-prefix-session/wasm-check.log
      - name: Repository fast gate on the exact working tree
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check.sh fast HEAD 2>&1 | tee /tmp/noon-prefix-session/fast-gate.log
      - name: Store tested file blobs without moving refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo fmt --all -- --check
          python3 .github/diagnostics/prefix-session.py save
          python3 .github/diagnostics/prefix-session.py store
      - name: Retain exact candidate and execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prefix-session-qualification
          path: /tmp/noon-prefix-session
          retention-days: 3
