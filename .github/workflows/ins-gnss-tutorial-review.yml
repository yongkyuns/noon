name: INS GNSS tutorial review

on:
  push:
    branches: [master, demo/ins-gnss-tutorial]
    paths:
      - 'web/tutorials/ins-gnss/**'
      - '.github/workflows/ins-gnss-tutorial-review.yml'
      - 'scripts/build-web-demo.sh'
  pull_request:
    paths:
      - 'web/tutorials/ins-gnss/**'
      - '.github/workflows/ins-gnss-tutorial-review.yml'
      - 'scripts/build-web-demo.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ins-gnss-tutorial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build tested checkout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
      - name: Use repository-pinned Rust and WASM target
        run: |
          rustup install
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Build through repository entry point
        env:
          NOON_WASM_SKIP_OPT: '1'
        run: bash scripts/build-web-demo.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ins-gnss-built-runtime
          path: |
            web/pkg
            web/python-worker.js
            web/runtime-build-identity.json
            web/python/compat-bundle.*.json
          if-no-files-found: error
          retention-days: 3

  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [webgpu, webgl]
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ins-gnss-built-runtime
          path: web
      - name: Prepare tutorial and test dependencies
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.62.1 pngjs@7.0.0
          python3 web/tutorials/ins-gnss/tools/build.py
          python3 web/tutorials/ins-gnss/tests/test_model.py
      - name: Inspect all chapter boundaries and intermediate frames
        env:
          NOON_TUTORIAL_BACKEND: ${{ matrix.backend }}
        run: node web/tutorials/ins-gnss/tests/review.mjs
      - name: Verify playback, pause, fresh replay, dense motion, and responsive layout
        if: always()
        env:
          NOON_TUTORIAL_BACKEND: ${{ matrix.backend }}
        run: node web/tutorials/ins-gnss/tests/player.mjs
      - name: Archive exact tested source and numerical evidence
        if: always()
        run: |
          mkdir -p browser-smoke-artifacts/ins-gnss
          cp web/runtime-build-identity.json browser-smoke-artifacts/ins-gnss/
          python3 web/tutorials/ins-gnss/tools/export.py browser-smoke-artifacts/ins-gnss/data
          tar -czf browser-smoke-artifacts/ins-gnss/tested-source.tar.gz web/tutorials/ins-gnss
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ins-gnss-review-${{ matrix.backend }}
          path: browser-smoke-artifacts/ins-gnss
          retention-days: 3
