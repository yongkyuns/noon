name: Agent filled path Transform

on:
  push:
    branches:
      - agent/filled-path-transform-impl

permissions:
  contents: write

concurrency:
  group: filled-path-transform-impl
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/filled-path-transform-impl

      - name: Apply implementation
        run: |
          python3 scripts/apply_filled_path_transform.py
          python3 scripts/fix_filled_path_demo.py

      - name: Use stable Rust
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown

      - name: Format generated Rust
        run: cargo fmt --all

      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Compile workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Geometry correctness
        run: |
          cargo test -p noon-geometry --test tessellation_correctness
          cargo test -p noon-geometry --test stroke_style_parity
          cargo test -p noon-geometry --test filled_morph

      - name: Workspace tests
        run: cargo test --workspace --all-features

      - name: WebGPU wasm compile
        run: cargo check -p noon-render-wgpu --target wasm32-unknown-unknown --no-default-features --features web

      - name: Browser runtime wasm compile
        run: cargo check -p noon-web --target wasm32-unknown-unknown

      - name: Browser package validation
        run: bash scripts/build-web-demo.sh

      - name: Publish validated implementation source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            Cargo.lock \
            crates/noon-compile/Cargo.toml \
            crates/noon-compile/src/lib.rs \
            crates/noon-geometry/src/morph.rs \
            crates/noon-geometry/src/tessellation.rs \
            crates/noon-geometry/tests/filled_morph.rs \
            crates/noon-render-wgpu/src/lib.rs \
            web/main.js \
            web/python/examples/filled_path_transform.py \
            web/python/test_examples.py
          if git diff --cached --quiet; then
            echo "No implementation changes to publish"
          else
            git commit -m "Add bounded filled path Transform"
            git push origin HEAD:agent/filled-path-transform-impl
          fi
