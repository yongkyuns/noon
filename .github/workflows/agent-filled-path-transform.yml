name: Agent filled path Transform

on:
  push:
    branches:
      - agent/browser-realtime-architecture

permissions:
  contents: write

concurrency:
  group: filled-path-transform-impl
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout draft feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/browser-realtime-architecture

      - name: Use stable Rust
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown

      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Validate and publish implementation or diagnostics
        shell: bash
        run: |
          set +e
          : > filled_gate.log
          status=0

          run_gate() {
            if [ "$status" -ne 0 ]; then
              return
            fi
            echo "" >> filled_gate.log
            echo ">>> $*" >> filled_gate.log
            "$@" >> filled_gate.log 2>&1
            status=$?
          }

          if [ ! -f crates/noon-geometry/tests/filled_morph.rs ]; then
            run_gate python3 scripts/apply_filled_path_transform.py
            run_gate python3 scripts/fix_filled_path_demo.py
            run_gate python3 scripts/fix_filled_geometry_compile.py
            run_gate python3 scripts/fix_filled_compile_tests.py
            run_gate python3 scripts/fix_filled_clippy.py
            run_gate python3 scripts/fix_filled_renderer_test.py
          fi
          run_gate cargo fmt --all
          run_gate cargo fmt --all -- --check
          run_gate cargo check --workspace --all-targets --all-features
          run_gate cargo clippy --workspace --all-targets --all-features -- -D warnings
          run_gate cargo test -p noon-geometry --test tessellation_correctness
          run_gate cargo test -p noon-geometry --test stroke_style_parity
          run_gate cargo test -p noon-geometry --test filled_morph
          run_gate cargo test --workspace --all-features
          run_gate cargo check -p noon-render-wgpu --target wasm32-unknown-unknown --no-default-features --features web
          run_gate cargo check -p noon-web --target wasm32-unknown-unknown
          run_gate bash scripts/build-web-demo.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -eq 0 ]; then
            if git ls-files --error-unmatch filled_gate.log >/dev/null 2>&1; then
              git rm -- filled_gate.log
            else
              rm -f filled_gate.log
            fi
            git add -- \
              Cargo.lock \
              crates/noon-compile/Cargo.toml \
              crates/noon-compile/src/lib.rs \
              crates/noon-geometry/src/morph.rs \
              crates/noon-geometry/src/tessellation.rs \
              crates/noon-geometry/tests/filled_morph.rs \
              crates/noon-render-wgpu/src/lib.rs \
              web/main.js \
              web/python/examples/filled_path_transform.py \
              web/python/test_examples.py
            if ! git diff --cached --quiet; then
              git commit -m "Add bounded filled path Transform"
              git push origin HEAD:agent/browser-realtime-architecture
            fi
          else
            echo "" >> filled_gate.log
            echo "GATE_STATUS=$status" >> filled_gate.log
            cp filled_gate.log /tmp/filled_gate.log
            git reset --hard HEAD
            git clean -fd
            cp /tmp/filled_gate.log filled_gate.log
            git add -- filled_gate.log
            git commit -m "Record filled Transform gate failure"
            git push origin HEAD:agent/browser-realtime-architecture
          fi

          exit 0
