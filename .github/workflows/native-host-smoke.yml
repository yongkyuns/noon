name: Native Host Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/native-host-smoke.yml"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "crates/noon-native/**"
      - "crates/noon-export/**"
      - "crates/noon/**"
      - "crates/noon-core/**"
      - "crates/noon-compile/**"
      - "crates/noon-runtime/**"
      - "crates/noon-render-wgpu/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/native-host-smoke.yml"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "crates/noon-native/**"
      - "crates/noon-export/**"
      - "crates/noon/**"
      - "crates/noon-core/**"
      - "crates/noon-compile/**"
      - "crates/noon-runtime/**"
      - "crates/noon-render-wgpu/**"

permissions:
  contents: read

jobs:
  native-surface-presentation:
    name: Rust semantic scene presents natively
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      WGPU_BACKEND: vulkan
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use repository-pinned Rust
        run: |
          rustup install
          rustup show active-toolchain
          rustc --version --verbose

      - name: Install virtual display and software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0

      - name: Check transient viewport integration
        run: cargo test -p noon --all-features --test transient_viewport

      - name: Qualify transient before/after anchor pixels
        run: |
          cargo test -p noon-render-wgpu --test transient_anchor_order \
            -- --include-ignored --nocapture --test-threads=1

      - name: Qualify secondary viewport camera and composition isolation
        run: |
          cargo test -p noon-render-wgpu --test secondary_viewport \
            -- --include-ignored --nocapture --test-threads=1

      - name: Qualify resident path buffer retirement after submission
        run: |
          cargo test -p noon-render-wgpu --lib \
            software_vulkan_keeps_submitted_paths_alive_across_resident_compaction \
            -- --ignored --nocapture --test-threads=1

      - name: Qualify native agent temporal rendering
        run: |
          cargo test -p noon --all-features --test agent_temporal_qualification \
            -- --include-ignored --nocapture

      - name: Check native transient viewport preparation
        run: cargo test -p noon-native --all-features --lib execution_source::viewport_tests

      - name: Present typed Rust semantic scene through native host
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            cargo test -p noon-native native_surface_smoke_presents_typed_semantic_frame \
              -- --ignored --nocapture --test-threads=1

      - name: Present typed Rust continuation endpoint through native host
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            cargo test -p noon-native native_surface_smoke_presents_affine_continuation_endpoint \
              -- --ignored --nocapture --test-threads=1

      - name: Present retained spatial meshes through native host
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            cargo test -p noon-native native_surface_smoke_presents_spatial_mesh_frame \
              -- --ignored --nocapture --test-threads=1

      - name: Present ordered Rust callback continuation through native host
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            cargo test -p noon-native native_surface_smoke_presents_callback_continuation_endpoint \
              -- --ignored --nocapture --test-threads=1

      - name: Qualify paused selection pixels and export isolation
        env:
          NOON_SELECTION_PROOF_DIR: ${{ github.workspace }}/selection-proof
        run: |
          cargo test -p noon --all-features --test selection_overlay_raster \
            -- --include-ignored --nocapture

      - name: Present inspection zoom and view recovery without advancing native time
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            cargo test -p noon-native native_surface_smoke_presents_inspection_zoom_and_recovery \
              -- --ignored --nocapture --test-threads=1

      - name: Present click selection and clear without advancing native time
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            cargo test -p noon-native native_surface_smoke_presents_paused_click_selection_and_clear \
              -- --ignored --nocapture --test-threads=1

      - name: Present click Indicate, zoom, restore, and retrigger on native surface
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            cargo test -p noon-native native_surface_smoke_presents_click_indicate_zoom_and_retrigger \
              -- --ignored --nocapture --test-threads=1

      - name: Retain selection pixel evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-selection-pixels
          path: selection-proof/
          retention-days: 14

  headless-capture:
    name: Rust scene capture without a display server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      WGPU_BACKEND: vulkan
      NOON_CAPTURE_PROOF_DIR: ${{ github.workspace }}/capture-proof/pixels
      NOON_OUTPUT_PROOF_DIR: ${{ github.workspace }}/capture-proof/output
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use repository-pinned Rust
        run: |
          rustup install
          rustup show active-toolchain
          rustc --version --verbose
          mkdir -p capture-proof
          git rev-parse HEAD > capture-proof/tested-commit.txt

      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-capture-cargo-sources-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-capture-cargo-sources-

      - name: Install software Vulkan without a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 ffmpeg
          ffmpeg -hide_banner -encoders | grep -q libx264

      - name: Verify native capture does not depend on a window or language host
        run: |
          set -o pipefail
          cargo tree -p noon-export --edges normal --prefix none > capture-proof/dependencies.txt
          python3 - <<'PY'
          from pathlib import Path
          forbidden = {'noon-native', 'noon-web', 'winit', 'pyo3', 'wasm-bindgen', 'web-sys', 'js-sys'}
          packages = {line.split()[0] for line in Path('capture-proof/dependencies.txt').read_text().splitlines() if line.strip()}
          assert not packages.intersection(forbidden), packages.intersection(forbidden)
          PY

      - name: Qualify native offscreen capture and failure recovery
        run: |
          set -o pipefail
          env -u DISPLAY -u WAYLAND_DISPLAY cargo test -p noon-export --all-features \
            --lib --tests -- --include-ignored --nocapture --test-threads=1 \
            2>&1 | tee capture-proof/tests.log

      - name: Independently validate finalized PNG and MP4 outputs
        run: |
          set -o pipefail
          MP4="capture-proof/output/files/following.mp4"
          PNG="capture-proof/output/files/frames/frame_000000.png"
          test -s "$MP4"
          test -s "$PNG"
          ffmpeg -v error -i "$MP4" -f null -
          ffprobe -v error -select_streams v:0 -count_frames \
            -show_entries stream=codec_name,width,height,r_frame_rate,nb_read_frames,color_range,color_space,color_transfer,color_primaries \
            -of json "$MP4" > capture-proof/output/ffprobe-stream.json
          ffprobe -v error -select_streams v:0 -show_frames \
            -show_entries frame=best_effort_timestamp_time -of csv=p=0 "$MP4" \
            > capture-proof/output/ffprobe-times.txt
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height -of json "$PNG" \
            > capture-proof/output/ffprobe-png.json
          ffmpeg -v error -i "$PNG" -frames:v 1 -f rawvideo -pix_fmt rgb24 \
            capture-proof/output/png-first.rgb
          ffmpeg -v error -i "$MP4" -frames:v 1 -f rawvideo -pix_fmt rgb24 \
            capture-proof/output/mp4-first.rgb
          python3 - <<'PY'
          import json
          from fractions import Fraction
          from pathlib import Path
          root = Path("capture-proof/output")
          stream = json.loads((root / "ffprobe-stream.json").read_text())["streams"][0]
          assert stream["codec_name"] == "h264", stream
          assert int(stream["width"]) == 160 and int(stream["height"]) == 90, stream
          assert stream["r_frame_rate"] == "30000/1001", stream
          assert int(stream["nb_read_frames"]) == 90, stream
          assert stream["color_range"] == "tv", stream
          assert stream["color_space"] == "bt709", stream
          assert stream["color_transfer"] == "bt709", stream
          assert stream["color_primaries"] == "bt709", stream
          times = [float(x.strip().split(",")[0]) for x in (root / "ffprobe-times.txt").read_text().splitlines() if x.strip()]
          assert len(times) == 90, len(times)
          step = float(Fraction(1001, 30000))
          for i, actual in enumerate(times):
              assert abs(actual - i * step) < 2e-5, (i, actual, i * step)
          png = json.loads((root / "ffprobe-png.json").read_text())["streams"][0]
          assert png["codec_name"] == "png" and int(png["width"]) == 160 and int(png["height"]) == 90, png
          png_rgb = (root / "png-first.rgb").read_bytes()
          mp4_rgb = (root / "mp4-first.rgb").read_bytes()
          assert len(png_rgb) == len(mp4_rgb) == 160 * 90 * 3
          mae = sum(abs(a-b) for a,b in zip(png_rgb, mp4_rgb)) / len(png_rgb)
          assert mae < 8.0, mae
          (root / "png-first.rgb").unlink()
          (root / "mp4-first.rgb").unlink()
          PY

      - name: Check formatting and lint the native capture package
        run: |
          cargo fmt --all -- --check
          cargo clippy -p noon-export --all-features --all-targets -- -D warnings

      - name: Stream the normal Rust camera example without a viewer
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY cargo run --quiet -p noon-export \
            --example capture_frames > capture-proof/example.rgba 2> capture-proof/example.log
          python3 - <<'PY'
          from pathlib import Path
          output = Path('capture-proof/example.rgba')
          assert output.stat().st_size == 90 * 320 * 180 * 4, output.stat().st_size
          output.unlink()
          PY

      - name: Retain pinned formatter diagnostics without changing tested code
        if: always()
        run: |
          mkdir -p capture-proof
          cargo fmt --all
          git diff --binary > capture-proof/rustfmt.patch

      - name: Retain native capture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-export-capture
          path: capture-proof/
          retention-days: 14
