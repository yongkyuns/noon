name: Apply parity179 renderer slice

on:
  push:
    branches:
      - agent/parity-179-screen-space

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply exact local patch
        shell: bash
        run: |
          cat .github/agent-parity179/patch.00 .github/agent-parity179/patch.02 | base64 -d | gzip -d > /tmp/parity179.patch
          git apply --check /tmp/parity179.patch
          git apply /tmp/parity179.patch
          python - <<'PY'
          from pathlib import Path

          shader_path = Path('crates/noon-render-wgpu/src/analytic.wgsl')
          shader = shader_path.read_text()
          shader = shader.replace('u32(input.flags.y) & 1u != 0u', '(u32(input.flags.y) & 1u) != 0u')
          shader = shader.replace('u32(input.flags.y) & 2u != 0u', '(u32(input.flags.y) & 2u) != 0u')
          shader = shader.replace('stroke_flags & 2u != 0u', '(stroke_flags & 2u) != 0u')
          shader = shader.replace('stroke_flags & 1u != 0u', '(stroke_flags & 1u) != 0u')
          shader_path.write_text(shader)

          test_path = Path('crates/noon-render-wgpu/tests/analytic_stroke_parity.rs')
          test = test_path.read_text()
          old = '    assert!(shader.contains("let stroke_padding = stroke_half_width(input.metrics, input.flags);"));\n'
          new = (
              '    assert!(shader.contains("let stroke_padding = select("));\n'
              '    assert!(shader.contains("stroke_is_screen_space(input.flags)"));\n'
              '    assert!(shader.contains("let invariant_padding = vec2<f32>(half_width) / safe_abs_scale(input.scale);"));\n'
          )
          if old not in test:
              raise SystemExit('expected analytic stroke assertion not found')
          test_path.write_text(test.replace(old, new))
          PY

      - name: Format and validate
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          cargo fmt --all
          cargo test -p noon-core -p noon-runtime -p noon-render-wgpu
          python -m unittest discover -s web/python -p 'test_*.py'
          node --check scripts/manim-compat-smoke.mjs
          git diff --check

      - name: Commit clean source
        shell: bash
        run: |
          rm -rf .github/agent-parity179
          rm .github/workflows/agent-parity179-snapshot.yml
          find web/python -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep Manim strokes invariant under object transforms"
          git push origin HEAD:agent/parity-179-screen-space
