name: Project website

on:
  pull_request:
    paths:
      - 'README.md'
      - 'REFERENCE.md'
      - 'web/site/**'
      - 'docs/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'web/python/**'
      - 'web/index.html'
      - 'web/main.js'
      - 'web/python-editor*.js'
      - 'web/live-authoring-bootstrap.js'
      - 'web/playground-run-request-router.js'
      - 'web/playground-playback-controls.js'
      - 'web/showcase-presentation.js'
      - 'web/project-site*.mjs'
      - 'scripts/site/**'
      - 'scripts/build-project-docs.sh'
      - 'scripts/build-project-site.mjs'
      - 'scripts/capture-project-media.mjs'
      - 'scripts/project-site*'
      - '.github/workflows/playground-project-site.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Capture and validate project website
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Check site source contracts
        run: |
          node --test scripts/project-site.test.mjs web/project-site-editorial.test.mjs web/project-site-controls.test.mjs web/project-site-design.test.mjs scripts/noon-site-worker-stack.test.mjs scripts/project-site-native-observation.test.mjs
          node --check scripts/capture-project-media.mjs
          node --check scripts/project-site-smoke.mjs
          node --check scripts/project-site-embed-smoke.mjs
          node --check scripts/project-site-design-smoke.mjs
          node --check scripts/project-site-native-replay.mjs
      # The public Pages site ships release + wasm-opt, not the development
      # package. Four concurrent Python+render WASM contexts exceed Firefox's
      # executable-code memory budget when built at dev -O0 (~221 MiB).
      # Qualify the same optimized executable configuration users will receive.
      - name: Use repository-pinned Rust and WASM target
        run: |
          rustup install
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-site-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-site-cargo-
      - name: Use pinned sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Install pinned wasm-opt
        uses: ./.github/actions/install-wasm-opt
      - name: Build the exact-source production browser runtime
        env:
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          SCCACHE_GHA_RW_MODE: "READ_ONLY"
          NOON_SKIP_WEB_PREFLIGHT: "1"
          NOON_WASM_PROFILE: "release"
          NOON_WASM_SKIP_OPT: "0"
          NOON_RENDERER_SMOKE: "0"
        run: |
          bash scripts/build-web-demo.sh
          # Fail if the release binary inadvertently becomes a dev-sized
          # module again; otherwise Firefox cannot instantiate four embeds.
          node -e "const fs=require('fs'); const n=fs.statSync('web/pkg/noon_web_bg.wasm').size; console.log('Optimized website WASM:',n,'bytes'); if(!n || n >= 100*1024*1024) process.exit(1)"
          git diff --quiet HEAD --
      - name: Install pinned capture tools
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb
      - name: Capture actual scenes and stage the site
        run: |
          node scripts/capture-project-media.mjs
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > web/build-info.json
          node scripts/build-project-site.mjs
          node scripts/project-site-smoke.mjs
          node scripts/project-site-design-smoke.mjs
      - name: Qualify real embedded runtime in all browser engines
        id: live_runtime
        run: xvfb-run -a node scripts/project-site-embed-smoke.mjs
      - name: Diagnose failed native renderer transition separately
        if: failure() && steps.live_runtime.outcome == 'failure'
        timeout-minutes: 10
        run: xvfb-run -a node scripts/project-site-native-replay.mjs
      - name: Retain website and visual review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: project-site-preview
          path: |
            _site/
            browser-smoke-artifacts/project-site/
          if-no-files-found: warn
          retention-days: 3
