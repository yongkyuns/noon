name: Prepare agent discovery lock and SDK proof
on:
  push:
    branches: [codex/noon-discovery-mcp-staging]
    paths: ["tools/noon-mcp/**", ".github/workflows/authoring-agent-mcp-prepare.yml"]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Resolve pinned SDK dependencies and test a clean lock install
        working-directory: tools/noon-mcp
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package.json
          npm test
      - name: Produce source-only candidate with the verified lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rm .github/workflows/authoring-agent-mcp-prepare.yml
          git add tools/noon-mcp/package-lock.json
          git diff --cached --check
          git config user.name 'Noon agent tooling'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Lock and qualify the read-only Noon discovery MCP package' -m 'Refs #1198. Real SDK stdio client and source-discovery tests passed. Remove the temporary preparation workflow; keep the permanent read-only CI matrix.'
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/noon-mcp-result.txt"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/codex/noon-discovery-mcp
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: noon-mcp-package-review
          path: |
            tools/noon-mcp/package-lock.json
            ${{ runner.temp }}/noon-mcp-result.txt
          if-no-files-found: warn
          retention-days: 7
