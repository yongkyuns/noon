name: Preview pinned source review
on:
  push:
    branches: [codex/noon-raster-diagnosis]
    paths: [.github/workflows/authoring-ci-diagnostics.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 7c1d834ab0272761ee546ad379a6c24909c47253
          persist-credentials: false
      - name: Archive pinned repository sources only
        run: |
          git archive --format=tar.gz --output="$RUNNER_TEMP/noon-review-source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/noon-review-source-revision.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: noon-review-source
          path: |
            ${{ runner.temp }}/noon-review-source.tar.gz
            ${{ runner.temp }}/noon-review-source-revision.txt
          if-no-files-found: error
          retention-days: 1
