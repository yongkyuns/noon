name: C5 analytic fill picking validation
on:
  push:
    branches: [work/c5-analytic-fill-picking]
    paths:
      - .github/workflows/c5-analytic-fill-picking.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: true
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 5
      - name: Verify and apply exact source patch
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          raw = gzip.decompress(base64.b64decode(Path('.github/c5-picking.patch.b64').read_text()))
          assert hashlib.sha256(raw).hexdigest() == 'b32b8719d062f8f9bfda345fbbe3b7461fc579b1a2ead3d10457d96e7d5a1a92'
          Path('/tmp/c5-picking.patch').write_bytes(raw)
          PY
          git apply --index /tmp/c5-picking.patch
          git rm .github/c5-picking.patch.b64 .github/workflows/c5-analytic-fill-picking.yml
      - name: Use repository-pinned Rust
        run: rustup install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      - name: Format source
        run: cargo fmt --all
      - name: Execute typed Rust picking and input regressions
        run: |
          set -euo pipefail
          cargo test -p noon --no-default-features --lib execution_session::picking::tests -- --nocapture 2>&1 | tee /tmp/c5-picking-tests.log
          cargo test -p noon --no-default-features --lib execution_session::input::tests -- --nocapture 2>&1 | tee /tmp/c5-input-tests.log
          cargo test -p noon-compile --lib reverse_compatibility_lookup -- --nocapture 2>&1 | tee /tmp/c5-identity-tests.log
      - name: Repository fast validation
        run: |
          set -euo pipefail
          bash scripts/check.sh fast 953c8c17db072156cbaa3641b0acf76ed660eeb6 2>&1 | tee /tmp/c5-fast.log
      - name: Direct single-context WASM build
        run: |
          set -euo pipefail
          cargo check -p noon --no-default-features --target wasm32-unknown-unknown 2>&1 | tee /tmp/c5-wasm.log
      - name: Publish validated code-only tree
        run: |
          git add crates/noon-compile/src/semantic_lowering/projection.rs crates/noon/src/execution_session.rs crates/noon/src/execution_session/input.rs crates/noon/src/execution_session/picking.rs crates/noon/src/execution_session/picking/tests.rs crates/noon/src/integration.rs
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'C5: validate publication-qualified analytic fill picking'
          git rev-parse HEAD HEAD^{tree} > /tmp/c5-identity.txt
          git archive --format=tar.gz HEAD > /tmp/c5-source.tar.gz
          git push origin HEAD:refs/heads/work/c5-analytic-fill-picking
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: c5-analytic-fill-picking-proof
          retention-days: 7
          path: |
            /tmp/c5-*.log
            /tmp/c5-identity.txt
            /tmp/c5-source.tar.gz
