name: B5 integration baseline diagnosis
on:
  push:
    branches: [codex/b5-integration-baseline-check]
permissions:
  contents: read
jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: master
            ref: 6aad6282be4a6ef5dbc557087656b55ab3f1d7c7
          - name: integration
            ref: 47c3104c8ec0267bce4b3c2107466ff9ac4e9bdc
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Record unmodified tested source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/integration-probes
          git rev-parse HEAD > ci-artifacts/integration-probes/source-sha.txt
          git status --porcelain --untracked-files=all > ci-artifacts/integration-probes/worktree.txt
          git hash-object crates/noon/tests/live_creation_resource_atomicity.rs crates/noon-render-wgpu/tests/lifecycle_churn_locality.rs crates/noon-render-wgpu/src/lib.rs > ci-artifacts/integration-probes/source-blobs.txt
      - name: Install repository-pinned Rust
        run: rustup install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Execute both original integration targets
        shell: bash
        run: |
          set -uo pipefail
          cargo test -p noon --all-features --test live_creation_resource_atomicity -- --nocapture 2>&1 | tee ci-artifacts/integration-probes/root-tests.log
          root_status=${PIPESTATUS[0]}
          cargo test -p noon-render-wgpu --all-features --test lifecycle_churn_locality -- --nocapture 2>&1 | tee ci-artifacts/integration-probes/renderer-tests.log
          renderer_status=${PIPESTATUS[0]}
          printf 'root=%s\nrenderer=%s\n' "$root_status" "$renderer_status" | tee ci-artifacts/integration-probes/status.txt
          test "$root_status" -eq 0 && test "$renderer_status" -eq 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: b5-integration-probes-${{ matrix.name }}-${{ matrix.ref }}
          path: ci-artifacts/integration-probes/
          retention-days: 7
