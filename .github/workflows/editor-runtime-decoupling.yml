name: Editor runtime decoupling

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Decouple optional editor from runtime client
        run: |
          python3 - <<'PY'
          from pathlib import Path

          authoring = Path('web/authoring-client.js')
          text = authoring.read_text()
          prefix = 'import "./python-editor.js";\n\n'
          assert text.startswith(prefix), 'authoring client editor side-effect import changed unexpectedly'
          authoring.write_text(text[len(prefix):])

          main = Path('web/main.js')
          text = main.read_text()
          anchor = '} from "./example-gallery.js";\n\n'
          assert text.count(anchor) == 1, 'main import anchor changed unexpectedly'
          optional_editor = '''} from "./example-gallery.js";\n\nvoid import("./python-editor.js").catch((error) => {\n  console.warn("Optional Python editor unavailable; using textarea fallback", error);\n});\n\n'''
          main.write_text(text.replace(anchor, optional_editor, 1))

          build = Path('scripts/build-web-demo.sh')
          text = build.read_text()
          anchor = 'node --test web/python-editor.test.mjs\n'
          assert text.count(anchor) == 1, 'web test anchor changed unexpectedly'
          build.write_text(text.replace(anchor, anchor + 'node --test web/editor-runtime-boundary.test.mjs\n', 1))
          PY

          node --check web/main.js
          node --check web/authoring-client.js
          node --test web/editor-runtime-boundary.test.mjs

      - name: Commit ownership cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/authoring-client.js web/main.js scripts/build-web-demo.sh web/editor-runtime-boundary.test.mjs
          git commit -m "Decouple optional editor from runtime authoring"
          git push origin HEAD:${{ github.head_ref }}
