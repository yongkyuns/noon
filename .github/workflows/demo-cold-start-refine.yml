name: Demo cold-start refine

on:
  pull_request:

permissions:
  contents: write

jobs:
  refine:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Refine concurrent bootstrap failure handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main_path = Path("web/main.js")
          main = main_path.read_text()
          main_pattern = re.compile(
              r'\(\) => \{\s*if \(authoringClient === client && client\.terminated\) \{\s*authoringClient = null;\s*\}\s*status\.dataset\.authoringWarmup = "failed";\s*\},'
          )
          main_replacement = '''() => {
              if (authoringClient !== client) return;
              if (client.terminated) {
                authoringClient = null;
              }
              status.dataset.authoringWarmup = "failed";
            },'''
          main, count = main_pattern.subn(main_replacement, main, count=1)
          if count != 1:
              raise SystemExit(f"warmup failure handler matches: {count}")
          main_path.write_text(main)

          worker_path = Path("web/python-worker.js")
          worker = worker_path.read_text()
          barrier_pattern = re.compile(
              r'  await noonWebReady;\n  const authoringStore = new WasmAuthoringStore\(\);'
          )
          barrier_replacement = '''  const startupResourcesReady = Promise.all([
            noonWebReady,
            pyodideReady,
            compatibilitySourcesReady,
          ]);
          const [, pyodide, compatibilitySources] = await startupResourcesReady;
          const authoringStore = new WasmAuthoringStore();'''
          worker, count = barrier_pattern.subn(barrier_replacement, worker, count=1)
          if count != 1:
              raise SystemExit(f"worker startup barrier matches: {count}")

          worker, count = re.subn(
              r'  const pyodide = await pyodideReady;\n',
              '',
              worker,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"delayed Pyodide awaits: {count}")

          worker, count = re.subn(
              r'  \] = await compatibilitySourcesReady;\n',
              '  ] = compatibilitySources;\n',
              worker,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"delayed compatibility awaits: {count}")
          worker_path.write_text(worker)

          test_path = Path("web/playground-startup.test.mjs")
          test = test_path.read_text()
          old_recovery = r'/authoringClient === client && client\.terminated[\s\S]*authoringClient = null/'
          new_recovery = r'/authoringClient !== client\) return;[\s\S]*client\.terminated[\s\S]*authoringClient = null/'
          if old_recovery not in test:
              raise SystemExit("startup test recovery assertion anchor missing")
          test = test.replace(old_recovery, new_recovery, 1)

          old_barrier = '''const firstBarrier = worker.indexOf("await noonWebReady;", initializeStart);
          assert.ok(firstBarrier > initializeStart, "Noon WASM readiness must remain an explicit barrier");'''
          new_barrier = '''const firstBarrier = worker.indexOf("await startupResourcesReady;", initializeStart);
          assert.ok(firstBarrier > initializeStart, "startup resources must share one handled readiness barrier");'''
          if old_barrier not in test:
              raise SystemExit("startup test barrier anchor missing")
          test = test.replace(old_barrier, new_barrier, 1)

          kickoff_anchor = '  "const compatibilitySourcesReady = Promise.all([",\n'
          if kickoff_anchor not in test:
              raise SystemExit("startup test kickoff anchor missing")
          test = test.replace(
              kickoff_anchor,
              kickoff_anchor + '  "const startupResourcesReady = Promise.all([",\n',
              1,
          )

          old_assertions = '''assert.doesNotMatch(worker, /await initNoonWeb\\(\\)/, "Noon WASM must not serialize Pyodide startup");
          assert.doesNotMatch(worker, /await loadPyodide\\(\\)/, "Pyodide must be started before Noon WASM is awaited");'''
          new_assertions = '''assert.doesNotMatch(worker, /await initNoonWeb\\(\\)/, "Noon WASM must not serialize Pyodide startup");
          assert.doesNotMatch(worker, /await loadPyodide\\(\\)/, "Pyodide must not serialize Noon WASM startup");
          assert.doesNotMatch(
            worker,
            /await (?:noonWebReady|pyodideReady|compatibilitySourcesReady)/,
            "independent startup promises must be handled by the shared barrier",
          );'''
          if old_assertions not in test:
              raise SystemExit("startup test assertion anchor missing")
          test = test.replace(old_assertions, new_assertions, 1)
          test_path.write_text(test)
          PY

      - name: Validate refined startup overlap
        run: |
          node --check web/main.js
          node --check web/python-worker.js
          node --test web/playground-startup.test.mjs
          node --test web/authoring-client.test.mjs

      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/main.js web/python-worker.js web/playground-startup.test.mjs
          git commit -m "Handle concurrent startup failures atomically"
          git push origin HEAD:${{ github.head_ref }}
