name: Temporary shared family layout migration

on:
  push:
    branches:
      - agent/arch-shared-family-layout

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/arch-shared-family-layout
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply migration
        run: |
          sed -i 's/if text.count(old) != 1:/if text.count(old) < 1:/' scripts/tmp_shared_family_layout_migration.py
          python3 scripts/tmp_shared_family_layout_migration.py
      - name: Format
        run: cargo fmt --all
      - name: Check diff formatting
        run: cargo fmt --all -- --check
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Rust semantic tests
        run: cargo test -p noon-web authoring_mobject
      - name: WASM compile
        run: cargo check -p noon-web --target wasm32-unknown-unknown
      - name: Python family regressions
        env:
          PYTHONPATH: web/python
        run: python3 -m unittest web.python.test_manim_shared_family_identity web.python.test_manim_layout_alignment web.python.test_manim_shared_layout_queries web.python.test_manim_shared_placement_handles
      - name: Ownership audit
        run: python3 scripts/semantic_ownership_check.py
      - name: Commit migration
        run: |
          rm scripts/tmp_shared_family_layout_migration.py
          rm .github/workflows/tmp-shared-family-layout.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --cached --quiet; then
            echo 'No migration diff to commit'
            exit 1
          fi
          git commit -m 'Move deterministic family bounds into shared Rust layout session'
          git push origin HEAD:agent/arch-shared-family-layout
