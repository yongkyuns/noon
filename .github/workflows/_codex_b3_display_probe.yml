name: codex b3 derived display probe

on:
  push:
    branches: [codex/b3-derived-display-publication]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Derived display runtime tests
        id: tests
        shell: bash
        run: |
          set +e
          cargo test -p noon-runtime derived_display --lib 2>&1 | tee derived-display-test.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Formatting check
        id: fmt
        shell: bash
        run: |
          set +e
          cargo fmt --all -- --check 2>&1 | tee derived-display-fmt.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b3-derived-display-probe
          path: |
            derived-display-test.log
            derived-display-fmt.log
      - name: Fail on probe errors
        if: steps.tests.outputs.status != '0' || steps.fmt.outputs.status != '0'
        run: exit 1
