name: C5 receipts with foreground completion

on:
  push:
    branches: [validation/c5-receipts-sync-1711]

permissions:
  contents: read

concurrency:
  group: c5-receipts-sync-1711
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_RW_MODE: "READ_ONLY"

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Merge pinned product sources in an isolated worktree
        shell: bash
        run: |
          set -euo pipefail
          old=6ce7954738be263a99b0a0ed4ca0d071984b022b
          master=2d4cebe3aed2b3c12b6c734e982f5953daef9ada
          test "$(git merge-base "$old" "$master")" = 13cac98be05f15be8000b37a4f409073b01e80fb
          git config user.name "Noon integration validation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/c5-proof"
          git worktree add --detach "$RUNNER_TEMP/c5-candidate" "$old"
          cd "$RUNNER_TEMP/c5-candidate"
          git merge --no-commit --no-ff "$master" 2>&1 | tee "$RUNNER_TEMP/c5-proof/merge.log"
          python3 - <<'PY'
          import subprocess
          expected = {
              'crates/noon-core/src/semantic_store.rs',
              'crates/noon-core/src/semantic_store/semantic_scene_restructure.rs',
              'crates/noon-core/src/semantic_store/semantic_scene_restructure/foreground.rs',
              'crates/noon-core/src/semantic_store/semantic_scene_restructure/foreground_tests.rs',
              'crates/noon/src/execution_session.rs',
              'crates/noon/src/execution_session/completion.rs',
              'crates/noon/src/execution_session/family_transform.rs',
              'crates/noon/src/execution_session/family_transform_tests.rs',
          }
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          actual = set(git('diff', '--cached', '--name-only').splitlines())
          assert actual == expected, (actual, expected)
          master = '2d4cebe3aed2b3c12b6c734e982f5953daef9ada'
          for path in expected - {'crates/noon/src/execution_session.rs'}:
              assert git('rev-parse', ':' + path) == git('rev-parse', master + ':' + path), path
          assert not git('diff', '--name-only', '--diff-filter=U')
          PY
          git diff --cached --check
          test -z "$(git diff)"
          tree=$(git write-tree)
          test "$(git merge-tree --write-tree "$old" "$master")" = "$tree"
          printf '%s\n' "$tree" > "$RUNNER_TEMP/c5-proof/tree.txt"
          printf '%s\n%s\n' "$old" "$master" > "$RUNNER_TEMP/c5-proof/parents.txt"
          git diff --cached --binary > "$RUNNER_TEMP/c5-proof/master-sync.patch"
          git diff --cached --stat > "$RUNNER_TEMP/c5-proof/master-sync.stat"
          git diff --stat "$master" "$tree" > "$RUNNER_TEMP/c5-proof/pr.stat"
          git archive --format=tar.gz "$tree" > "$RUNNER_TEMP/c5-proof/source.tar.gz"
          sha256sum "$RUNNER_TEMP/c5-proof/source.tar.gz" > "$RUNNER_TEMP/c5-proof/source.sha256"
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - name: Use sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Validate the combined product tree
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/c5-candidate"
          rustup install
          rustc --version --verbose | tee "$RUNNER_TEMP/c5-proof/rust-version.txt"
          cargo fmt --all -- --check 2>&1 | tee "$RUNNER_TEMP/c5-proof/format.log"
          cargo test -p noon-core -p noon -p noon-web --lib 2>&1 | tee "$RUNNER_TEMP/c5-proof/rust-tests.log"
          node --test web/*.test.mjs scripts/*contract*.test.mjs .github/ci/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/c5-proof/js-tests.log"
      - name: Publish a qualified staging ref without moving the PR or master
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/c5-candidate"
          old=6ce7954738be263a99b0a0ed4ca0d071984b022b
          master=2d4cebe3aed2b3c12b6c734e982f5953daef9ada
          output=validation/c5-receipts-sync-1711-qualified
          test -z "$(git diff)"
          tree=$(cat "$RUNNER_TEMP/c5-proof/tree.txt")
          test "$(git write-tree)" = "$tree"
          test "$(git ls-remote origin refs/heads/feat/c5-receipts-master | cut -f1)" = "$old"
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$master"
          test -z "$(git ls-remote origin refs/heads/$output)"
          clean=$(printf 'Merge master foreground completion into C5 receipt integration\n\nPreserve #1711 and the qualified receipt source without validation-workflow ancestry.\n' | git commit-tree "$tree" -p "$old" -p "$master")
          test "$(git rev-list --parents -n1 "$clean")" = "$clean $old $master"
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$header" push origin "$clean:refs/heads/$output"
          printf '%s\n' "$clean" > "$RUNNER_TEMP/c5-proof/commit.txt"
          git cat-file commit "$clean" > "$RUNNER_TEMP/c5-proof/commit-object.txt"
      - name: Retain source and executed evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: c5-receipts-foreground-integration-proof
          path: ${{ runner.temp }}/c5-proof
          if-no-files-found: warn
          retention-days: 7
