name: Prepared prefix lifecycle qualification
on:
  push:
    branches: [experimental/prepared-prefix-lifecycle]
permissions:
  contents: write
concurrency:
  group: prepared-prefix-lifecycle
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      - name: Apply exact scoped candidate
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 7f794d43d07cff824d350db149fed04a3b9fac1d
          mkdir -p prefix-lifecycle-artifacts
          git rev-parse HEAD > prefix-lifecycle-artifacts/trigger-commit.txt
          if test -f scripts/apply-prefix-lifecycle.py; then python3 scripts/apply-prefix-lifecycle.py; fi
          rustup show active-toolchain
          rustc --version --verbose | tee prefix-lifecycle-artifacts/rustc.log
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: prefix-lifecycle-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            prefix-incremental-${{ runner.os }}-
      - name: Formatting and architecture
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          bash scripts/check.sh architecture 7f794d43d07cff824d350db149fed04a3b9fac1d 2>&1 | tee prefix-lifecycle-artifacts/architecture.log
      - name: Runtime lifecycle and prefix regressions
        run: |
          set -euo pipefail
          cargo test -p noon-runtime --features prepared-prefix --test prefix_lifecycle --test prefix_transfer --test prefix_reactive_admission --test finite_replay_locality --test reconciled_replay -- --nocapture 2>&1 | tee prefix-lifecycle-artifacts/runtime.log
      - name: Public source and resource version tests
        run: |
          set -euo pipefail
          cargo test -p noon --no-default-features --features prepared-prefix --test prepared_prefix_lifecycle --test prepared_prefix_incremental --test finite_replay_history --test scalar_timeline_replay --test segment_decimal_endpoints -- --nocapture 2>&1 | tee prefix-lifecycle-artifacts/session.log
          cargo test -p noon --no-default-features --features prepared-prefix --lib prefix_probe -- --nocapture 2>&1 | tee prefix-lifecycle-artifacts/isolation.log
      - name: Actual Vulkan historical pixels
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers >/dev/null
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-prefix"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          cargo test -p noon --no-default-features --features prepared-prefix --test prepared_prefix_lifecycle --test prepared_prefix_incremental -- --ignored --nocapture --test-threads=1 2>&1 | tee prefix-lifecycle-artifacts/raster.log
      - name: Default-off and direct WASM
        run: |
          set -euo pipefail
          cargo test -p noon --no-default-features --test finite_replay_history --test scalar_timeline_replay --test segment_decimal_endpoints 2>&1 | tee prefix-lifecycle-artifacts/default-off.log
          cargo check -p noon --no-default-features --features prepared-prefix --target wasm32-unknown-unknown 2>&1 | tee prefix-lifecycle-artifacts/wasm.log
      - name: Commit only tested source on the experimental branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experimental/prepared-prefix-lifecycle
          git fetch origin experimental/prepared-prefix-lifecycle
          test "$(git rev-parse origin/experimental/prepared-prefix-lifecycle)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/noon-compile/src/replay_revision/prefix.rs crates/noon-compile/src/replay_revision/prefix
          git add crates/noon-runtime/src/replay/prefix.rs crates/noon-runtime/src/replay/prefix crates/noon-runtime/tests/prefix_lifecycle.rs crates/noon-runtime/tests/prefix_transfer.rs
          git add crates/noon/tests/prepared_prefix_lifecycle.rs docs/architecture.md
          if test -f scripts/apply-prefix-lifecycle.py; then git rm scripts/apply-prefix-lifecycle.py; fi
          git diff --cached > prefix-lifecycle-artifacts/tested-source.patch
          if ! git diff --cached --quiet; then
            git commit -m 'Qualify sparse lifecycle and immutable-resource prefix delivery (#2211)'
            git push origin HEAD:experimental/prepared-prefix-lifecycle
          fi
          git diff --exit-code -- crates docs
          git rev-parse HEAD > prefix-lifecycle-artifacts/validated-commit.txt
      - name: Retain exact results even on failure
        if: always()
        run: |
          set -euo pipefail
          mkdir -p prefix-lifecycle-artifacts
          git rev-parse HEAD > prefix-lifecycle-artifacts/commit.txt
          git diff -- crates docs > prefix-lifecycle-artifacts/remaining-source.patch
          if test -f Cargo.lock; then cp Cargo.lock prefix-lifecycle-artifacts/selected-Cargo.lock; fi
          tar -czf prefix-lifecycle-artifacts/candidate-source.tar.gz crates/noon-compile/src/replay_revision crates/noon-runtime/src/replay/prefix.rs crates/noon-runtime/src/replay/prefix crates/noon-runtime/tests/prefix_lifecycle.rs crates/noon-runtime/tests/prefix_transfer.rs crates/noon/tests/prepared_prefix_lifecycle.rs docs/architecture.md
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: prepared-prefix-lifecycle
          path: prefix-lifecycle-artifacts
          retention-days: 7
          if-no-files-found: error
