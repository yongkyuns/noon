name: B3 family transform correspondence mode

on:
  push:
    branches: [b3-family-transform-correspondence-mode]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply correspondence-mode propagation
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              assert count == 1, f"{path}: expected one match, got {count}\n{old}"
              p.write_text(s.replace(old, new, 1))

          semantic = 'crates/noon-core/src/semantic_store/semantic_animations.rs'
          replace_once(semantic,
          '''pub enum SemanticTransformInterpolation {
              /// Interpolate the object's semantic affine and style properties.
              #[default]
              Affine,
              /// Interpolate corresponding analytic path points while retaining semantic affine channels.
              PointCorrespondence,
          }

          /// One authored animation operation before execution scheduling/lowering.
          ''',
          '''pub enum SemanticTransformInterpolation {
              /// Interpolate the object's semantic affine and style properties.
              #[default]
              Affine,
              /// Interpolate corresponding analytic path points while retaining semantic affine channels.
              PointCorrespondence,
          }

          /// Correspondence strategy used by one family Transform declaration.
          ///
          /// This selects compiler correspondence only. Both modes share the same semantic
          /// animation identity, scheduler, runtime execution, and completion lifecycle.
          #[derive(Clone, Copy, Debug, Default, PartialEq, Eq)]
          pub enum SemanticFamilyTransformCorrespondence {
              #[default]
              Structural,
              MatchingShapes,
          }

          /// One authored animation operation before execution scheduling/lowering.
          ''')
          replace_once(semantic,
          '''    FamilyTransformTo {
                  source: SemanticNodeId,
                  target_state: SemanticNodeId,
              },
          ''',
          '''    FamilyTransformTo {
                  source: SemanticNodeId,
                  target_state: SemanticNodeId,
                  correspondence: SemanticFamilyTransformCorrespondence,
              },
          ''')
          replace_once(semantic,
          '''            Self::FamilyTransformTo {
                          source,
                          target_state,
                      } => Some((*source, *target_state)),
          ''',
          '''            Self::FamilyTransformTo {
                          source,
                          target_state,
                          ..
                      } => Some((*source, *target_state)),
          ''')
          replace_once(semantic,
          '''    pub const fn composition_kind(&self) -> Option<SemanticAnimationCompositionKind> {
          ''',
          '''    pub const fn family_transform_correspondence(
                  &self,
              ) -> Option<SemanticFamilyTransformCorrespondence> {
                  match self {
                      Self::FamilyTransformTo { correspondence, .. } => Some(*correspondence),
                      _ => None,
                  }
              }

              pub const fn composition_kind(&self) -> Option<SemanticAnimationCompositionKind> {
          ''')
          replace_once(semantic,
          '''    pub fn insert_semantic_family_transform_animation(
                  &mut self,
                  source: SemanticNodeId,
                  target_state: SemanticNodeId,
                  options: AnimationOptions,
              ) -> Result<SemanticNodeId, SemanticAnimationError> {
                  self.set_last_mutation_writes(0);
                  self.semantic_family_members_checked(source)?;
                  self.semantic_family_members_checked(target_state)?;
                  if source == target_state {
                      return Err(SemanticAnimationError::SameTargetAndTargetState(source));
                  }
                  validate_authored_animation_options(options)?;
                  Ok(
                      self.insert_semantic_animation_state(SemanticAnimationState::new(
                          SemanticAnimationIntent::FamilyTransformTo {
                              source,
                              target_state,
                          },
                          options,
                      )),
                  )
              }
          ''',
          '''    pub fn insert_semantic_family_transform_animation(
                  &mut self,
                  source: SemanticNodeId,
                  target_state: SemanticNodeId,
                  options: AnimationOptions,
              ) -> Result<SemanticNodeId, SemanticAnimationError> {
                  self.insert_semantic_family_transform_animation_with_correspondence(
                      source,
                      target_state,
                      SemanticFamilyTransformCorrespondence::Structural,
                      options,
                  )
              }

              /// Insert one family Transform using deterministic matching-shape correspondence.
              pub fn insert_semantic_matching_family_transform_animation(
                  &mut self,
                  source: SemanticNodeId,
                  target_state: SemanticNodeId,
                  options: AnimationOptions,
              ) -> Result<SemanticNodeId, SemanticAnimationError> {
                  self.insert_semantic_family_transform_animation_with_correspondence(
                      source,
                      target_state,
                      SemanticFamilyTransformCorrespondence::MatchingShapes,
                      options,
                  )
              }

              /// Insert one family Transform declaration with an explicit correspondence strategy.
              pub fn insert_semantic_family_transform_animation_with_correspondence(
                  &mut self,
                  source: SemanticNodeId,
                  target_state: SemanticNodeId,
                  correspondence: SemanticFamilyTransformCorrespondence,
                  options: AnimationOptions,
              ) -> Result<SemanticNodeId, SemanticAnimationError> {
                  self.set_last_mutation_writes(0);
                  self.semantic_family_members_checked(source)?;
                  self.semantic_family_members_checked(target_state)?;
                  if source == target_state {
                      return Err(SemanticAnimationError::SameTargetAndTargetState(source));
                  }
                  validate_authored_animation_options(options)?;
                  Ok(
                      self.insert_semantic_animation_state(SemanticAnimationState::new(
                          SemanticAnimationIntent::FamilyTransformTo {
                              source,
                              target_state,
                              correspondence,
                          },
                          options,
                      )),
                  )
              }
          ''')

          transaction = 'crates/noon-core/src/semantic_store/semantic_transaction.rs'
          replace_once(transaction,
          '''    SemanticFadeDirection, SemanticFadeEndpoint, SemanticNodeId, SemanticNodeKind,
              SemanticObjectContent, SemanticObjectProperty, SemanticObjectState,
          ''',
          '''    SemanticFadeDirection, SemanticFadeEndpoint, SemanticFamilyTransformCorrespondence,
              SemanticNodeId, SemanticNodeKind, SemanticObjectContent, SemanticObjectProperty,
              SemanticObjectState,
          ''')
          replace_once(transaction,
          '''    pub fn create_family_transform_animation(
                  &mut self,
                  source: impl Into<SemanticTransactionNodeRef>,
                  target_state: impl Into<SemanticTransactionNodeRef>,
                  options: AnimationOptions,
              ) -> SemanticLocalNodeToken {
                  let token = self.allocate_local_node_token();
                  self.mutations.push(SemanticMutation::AddAnimation {
                      token,
                      animation: SemanticTransactionAnimation::new(
                          SemanticTransactionAnimationIntent::FamilyTransformTo {
                              source: source.into(),
                              target_state: target_state.into(),
                          },
                          options,
                      ),
                  });
                  token
              }
          ''',
          '''    pub fn create_family_transform_animation(
                  &mut self,
                  source: impl Into<SemanticTransactionNodeRef>,
                  target_state: impl Into<SemanticTransactionNodeRef>,
                  options: AnimationOptions,
              ) -> SemanticLocalNodeToken {
                  self.create_family_transform_animation_with_correspondence(
                      source,
                      target_state,
                      SemanticFamilyTransformCorrespondence::Structural,
                      options,
                  )
              }

              /// Stage a family Transform using deterministic matching-shape correspondence.
              pub fn create_matching_family_transform_animation(
                  &mut self,
                  source: impl Into<SemanticTransactionNodeRef>,
                  target_state: impl Into<SemanticTransactionNodeRef>,
                  options: AnimationOptions,
              ) -> SemanticLocalNodeToken {
                  self.create_family_transform_animation_with_correspondence(
                      source,
                      target_state,
                      SemanticFamilyTransformCorrespondence::MatchingShapes,
                      options,
                  )
              }

              /// Stage a family Transform with an explicit correspondence strategy.
              pub fn create_family_transform_animation_with_correspondence(
                  &mut self,
                  source: impl Into<SemanticTransactionNodeRef>,
                  target_state: impl Into<SemanticTransactionNodeRef>,
                  correspondence: SemanticFamilyTransformCorrespondence,
                  options: AnimationOptions,
              ) -> SemanticLocalNodeToken {
                  let token = self.allocate_local_node_token();
                  self.mutations.push(SemanticMutation::AddAnimation {
                      token,
                      animation: SemanticTransactionAnimation::new(
                          SemanticTransactionAnimationIntent::FamilyTransformTo {
                              source: source.into(),
                              target_state: target_state.into(),
                              correspondence,
                          },
                          options,
                      ),
                  });
                  token
              }
          ''')

          addition = 'crates/noon-core/src/semantic_store/semantic_transaction/animation_addition.rs'
          replace_once(addition,
          '''    SemanticAnimationCompositionKind, SemanticAnimationIntent, SemanticAnimationState,
              SemanticFadeDirection, SemanticFadeEndpoint, SemanticObjectState, SemanticObjectTrackProperty,
          ''',
          '''    SemanticAnimationCompositionKind, SemanticAnimationIntent, SemanticAnimationState,
              SemanticFadeDirection, SemanticFadeEndpoint, SemanticFamilyTransformCorrespondence,
              SemanticObjectState, SemanticObjectTrackProperty,
          ''')
          replace_once(addition,
          '''    FamilyTransformTo {
                  source: SemanticTransactionNodeRef,
                  target_state: SemanticTransactionNodeRef,
              },
          ''',
          '''    FamilyTransformTo {
                  source: SemanticTransactionNodeRef,
                  target_state: SemanticTransactionNodeRef,
                  correspondence: SemanticFamilyTransformCorrespondence,
              },
          ''')
          replace_once(addition,
          '''            Self::FamilyTransformTo {
                          source,
                          target_state,
                      } => Some([Some(*source), Some(*target_state), None]),
          ''',
          '''            Self::FamilyTransformTo {
                          source,
                          target_state,
                          ..
                      } => Some([Some(*source), Some(*target_state), None]),
          ''')
          replace_once(addition,
          '''            SemanticAnimationIntent::FamilyTransformTo {
                          source,
                          target_state,
                      } => SemanticTransactionAnimationIntent::FamilyTransformTo {
                          source: (*source).into(),
                          target_state: (*target_state).into(),
                      },
          ''',
          '''            SemanticAnimationIntent::FamilyTransformTo {
                          source,
                          target_state,
                          correspondence,
                      } => SemanticTransactionAnimationIntent::FamilyTransformTo {
                          source: (*source).into(),
                          target_state: (*target_state).into(),
                          correspondence: *correspondence,
                      },
          ''')
          replace_once(addition,
          '''            SemanticTransactionAnimationIntent::FamilyTransformTo {
                          source,
                          target_state,
                      } => SemanticAnimationIntent::FamilyTransformTo {
                          source: resolve_node_ref(*source, committed),
                          target_state: resolve_node_ref(*target_state, committed),
                      },
          ''',
          '''            SemanticTransactionAnimationIntent::FamilyTransformTo {
                          source,
                          target_state,
                          correspondence,
                      } => SemanticAnimationIntent::FamilyTransformTo {
                          source: resolve_node_ref(*source, committed),
                          target_state: resolve_node_ref(*target_state, committed),
                          correspondence: *correspondence,
                      },
          ''')
          replace_once(addition,
          '''        SemanticTransactionAnimationIntent::FamilyTransformTo {
                      source,
                      target_state,
                  } => {
          ''',
          '''        SemanticTransactionAnimationIntent::FamilyTransformTo {
                      source,
                      target_state,
                      ..
                  } => {
          ''')
          replace_once(addition,
          '''        SemanticAnimationIntent::FamilyTransformTo {
                      source,
                      target_state,
                  } => store
                      .insert_semantic_family_transform_animation(*source, *target_state, options)
                      .expect("preflighted semantic family Transform insertion must remain valid while transaction owns the store"),
          ''',
          '''        SemanticAnimationIntent::FamilyTransformTo {
                      source,
                      target_state,
                      correspondence,
                  } => store
                      .insert_semantic_family_transform_animation_with_correspondence(
                          *source,
                          *target_state,
                          *correspondence,
                          options,
                      )
                      .expect("preflighted semantic family Transform insertion must remain valid while transaction owns the store"),
          ''')

          schedule = 'crates/noon-compile/src/semantic_lowering/animation_schedule.rs'
          replace_once(schedule,
          '''    SemanticAnimationIntent, SemanticFadeDirection, SemanticNodeId, SemanticScalarSignalQueryError,
              SemanticScalarSignalTrack, SemanticStore, SemanticTransactionAnimationIntent,
          ''',
          '''    SemanticAnimationIntent, SemanticFadeDirection, SemanticFamilyTransformCorrespondence,
              SemanticNodeId, SemanticScalarSignalQueryError, SemanticScalarSignalTrack, SemanticStore,
              SemanticTransactionAnimationIntent,
          ''')
          # Public/prepared scheduled records.
          s = Path(schedule).read_text()
          old = '''    pub source: SemanticNodeId,\n    pub target_state: SemanticNodeId,\n    pub timing: TrackTiming,'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, '''    pub source: SemanticNodeId,\n    pub target_state: SemanticNodeId,\n    pub correspondence: SemanticFamilyTransformCorrespondence,\n    pub timing: TrackTiming,''', 1)
          old = '''    pub source: SemanticTransactionNodeRef,\n    pub target_state: SemanticTransactionNodeRef,\n    pub timing: TrackTiming,'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, '''    pub source: SemanticTransactionNodeRef,\n    pub target_state: SemanticTransactionNodeRef,\n    pub correspondence: SemanticFamilyTransformCorrespondence,\n    pub timing: TrackTiming,''', 1)
          Path(schedule).write_text(s)
          # Three internal family-transform enum shapes.
          s = Path(schedule).read_text()
          old = '''    FamilyTransformTo {\n        source: R,\n        target_state: R,\n    },'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, '''    FamilyTransformTo {\n        source: R,\n        target_state: R,\n        correspondence: SemanticFamilyTransformCorrespondence,\n    },''', 1)
          old = '''    FamilyTransform {\n        finish_time_map: CompositionTimeMap,\n        animation: R,\n        source: R,\n        target_state: R,\n        timing: TrackTiming,'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, '''    FamilyTransform {\n        finish_time_map: CompositionTimeMap,\n        animation: R,\n        source: R,\n        target_state: R,\n        correspondence: SemanticFamilyTransformCorrespondence,\n        timing: TrackTiming,''', 1)
          old = '''    FamilyTransform {\n        source: R,\n        target_state: R,\n        options: ResolvedAnimationOptions,\n    },'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, '''    FamilyTransform {\n        source: R,\n        target_state: R,\n        correspondence: SemanticFamilyTransformCorrespondence,\n        options: ResolvedAnimationOptions,\n    },''', 1)
          Path(schedule).write_text(s)
          # Published/prepared schedule projection copies.
          s = Path(schedule).read_text()
          old = '''                source,\n                target_state,\n                timing,\n                time_map,\n                options,\n            } => family_transforms.push(SemanticScheduledFamilyTransform {\n                finish_time_map,\n                animation,\n                source,\n                target_state,\n                timing,'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, '''                source,\n                target_state,\n                correspondence,\n                timing,\n                time_map,\n                options,\n            } => family_transforms.push(SemanticScheduledFamilyTransform {\n                finish_time_map,\n                animation,\n                source,\n                target_state,\n                correspondence,\n                timing,''', 1)
          old = '''                source,\n                target_state,\n                timing,\n                time_map,\n                options,\n            } => family_transforms.push(PreparedSemanticScheduledFamilyTransform {\n                finish_time_map,\n                animation,\n                source,\n                target_state,\n                timing,'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, '''                source,\n                target_state,\n                correspondence,\n                timing,\n                time_map,\n                options,\n            } => family_transforms.push(PreparedSemanticScheduledFamilyTransform {\n                finish_time_map,\n                animation,\n                source,\n                target_state,\n                correspondence,\n                timing,''', 1)
          Path(schedule).write_text(s)
          # Published lookup, prepared existing lookup, prepared pending lookup.
          s = Path(schedule).read_text()
          old = '''            SemanticAnimationIntent::FamilyTransformTo {\n                source,\n                target_state,\n            } => {'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, '''            SemanticAnimationIntent::FamilyTransformTo {\n                source,\n                target_state,\n                correspondence,\n            } => {''', 1)
          old = '''                AnimationDeclarationIntent::FamilyTransformTo {\n                    source: *source,\n                    target_state: *target_state,\n                }'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, '''                AnimationDeclarationIntent::FamilyTransformTo {\n                    source: *source,\n                    target_state: *target_state,\n                    correspondence: *correspondence,\n                }''', 1)
          old = '''                    SemanticAnimationIntent::FamilyTransformTo {\n                        source,\n                        target_state,\n                    } => AnimationDeclarationIntent::FamilyTransformTo {\n                        source: (*source).into(),\n                        target_state: (*target_state).into(),\n                    },'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, '''                    SemanticAnimationIntent::FamilyTransformTo {\n                        source,\n                        target_state,\n                        correspondence,\n                    } => AnimationDeclarationIntent::FamilyTransformTo {\n                        source: (*source).into(),\n                        target_state: (*target_state).into(),\n                        correspondence: *correspondence,\n                    },''', 1)
          old = '''                    SemanticTransactionAnimationIntent::FamilyTransformTo {\n                        source,\n                        target_state,\n                    } => AnimationDeclarationIntent::FamilyTransformTo {\n                        source: *source,\n                        target_state: *target_state,\n                    },'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, '''                    SemanticTransactionAnimationIntent::FamilyTransformTo {\n                        source,\n                        target_state,\n                        correspondence,\n                    } => AnimationDeclarationIntent::FamilyTransformTo {\n                        source: *source,\n                        target_state: *target_state,\n                        correspondence: *correspondence,\n                    },''', 1)
          Path(schedule).write_text(s)
          # Plan and collect propagation.
          s = Path(schedule).read_text()
          old = '''        AnimationDeclarationIntent::FamilyTransformTo {\n            source,\n            target_state,\n        } => {'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, '''        AnimationDeclarationIntent::FamilyTransformTo {\n            source,\n            target_state,\n            correspondence,\n        } => {''', 1)
          old = '''                kind: PlannedAnimationKind::FamilyTransform {\n                    source,\n                    target_state,\n                    options,\n                },'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, '''                kind: PlannedAnimationKind::FamilyTransform {\n                    source,\n                    target_state,\n                    correspondence,\n                    options,\n                },''', 1)
          old = '''        PlannedAnimationKind::FamilyTransform {\n            source,\n            target_state,\n            options,\n        } => leaves.push(ScheduledAnimationLeaf::FamilyTransform {\n            finish_time_map: finish_time_map.clone(),\n            animation: plan.animation,\n            source: *source,\n            target_state: *target_state,\n            timing:'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, '''        PlannedAnimationKind::FamilyTransform {\n            source,\n            target_state,\n            correspondence,\n            options,\n        } => leaves.push(ScheduledAnimationLeaf::FamilyTransform {\n            finish_time_map: finish_time_map.clone(),\n            animation: plan.animation,\n            source: *source,\n            target_state: *target_state,\n            correspondence: *correspondence,\n            timing:''', 1)
          Path(schedule).write_text(s)

          # Add one focused propagation regression as a standalone test module.
          p = Path(schedule)
          s = p.read_text()
          test = r'''

          #[cfg(test)]
          mod family_transform_correspondence_mode_tests {
              use noon_core::{
                  AnimationOptions, SemanticFamilyTransformCorrespondence, SemanticMutationTransaction,
                  SemanticObjectState, SemanticStore, StoredGeometry,
              };

              use super::*;

              fn family(store: &mut SemanticStore) -> SemanticNodeId {
                  let leaf = store.insert_semantic_object(SemanticObjectState::new(
                      StoredGeometry::Circle { radius: 1.0 },
                  ));
                  let family = store.insert_family();
                  store.add_member(family, leaf).unwrap();
                  family
              }

              #[test]
              fn published_and_prepared_family_schedules_preserve_correspondence_mode() {
                  let mut store = SemanticStore::new();
                  let source = family(&mut store);
                  let target = family(&mut store);
                  let index = SemanticExecutionIndex::new();

                  let structural = store
                      .insert_semantic_family_transform_animation(
                          source,
                          target,
                          AnimationOptions::new(),
                      )
                      .unwrap();
                  let matching = store
                      .insert_semantic_matching_family_transform_animation(
                          source,
                          target,
                          AnimationOptions::new(),
                      )
                      .unwrap();

                  let structural_schedule = lower_semantic_animation_schedule(
                      &store,
                      &index,
                      structural,
                      0.0,
                      AnimationOptions::new(),
                  )
                  .unwrap();
                  assert_eq!(
                      structural_schedule.family_transforms()[0].correspondence,
                      SemanticFamilyTransformCorrespondence::Structural
                  );
                  let matching_schedule = lower_semantic_animation_schedule(
                      &store,
                      &index,
                      matching,
                      0.0,
                      AnimationOptions::new(),
                  )
                  .unwrap();
                  assert_eq!(
                      matching_schedule.family_transforms()[0].correspondence,
                      SemanticFamilyTransformCorrespondence::MatchingShapes
                  );

                  let mut transaction = SemanticMutationTransaction::new();
                  let pending = transaction.create_matching_family_transform_animation(
                      source,
                      target,
                      AnimationOptions::new(),
                  );
                  let prepared = transaction.prepare(&mut store).unwrap();
                  let prepared_schedule = lower_prepared_semantic_animation_schedule(
                      &prepared,
                      &index,
                      pending,
                      0.0,
                      AnimationOptions::new(),
                  )
                  .unwrap();
                  assert_eq!(
                      prepared_schedule.family_transforms()[0].correspondence,
                      SemanticFamilyTransformCorrespondence::MatchingShapes
                  );
              }
          }
          '''
          assert 'mod family_transform_correspondence_mode_tests' not in s
          p.write_text(s + test)
          PY
          cargo fmt --all
          git diff --check
          cargo check -p noon-core -p noon-compile
          cargo test -p noon-compile published_and_prepared_family_schedules_preserve_correspondence_mode --lib
      - name: Commit source-only selector
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/b3-family-transform-correspondence-mode.yml
          git add crates/noon-core/src/semantic_store/semantic_animations.rs
          git add crates/noon-core/src/semantic_store/semantic_transaction.rs
          git add crates/noon-core/src/semantic_store/semantic_transaction/animation_addition.rs
          git add crates/noon-compile/src/semantic_lowering/animation_schedule.rs
          git commit -m 'Carry family transform correspondence mode through scheduling'
          git push origin HEAD:${GITHUB_REF_NAME}
