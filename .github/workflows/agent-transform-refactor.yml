name: Agent Transform API refactor gate

on:
  pull_request:
    paths:
      - .github/workflows/agent-transform-refactor.yml

permissions:
  contents: write

jobs:
  refactor-transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/browser-realtime-architecture
          fetch-depth: 0

      - name: Refactor Transform API and morph channel
