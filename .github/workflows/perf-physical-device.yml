name: Physical device performance baseline

on:
  workflow_dispatch:
    inputs:
      device_id:
        description: Stable physical device ID (for example yongkyun-mac)
        required: true
        default: yongkyun-mac
        type: string
      backends:
        description: Comma-separated renderer backends
        required: true
        default: webgpu
        type: string
      suites:
        description: Comma-separated suites (frame,corpus,authoring,dynamic-stress)
        required: true
        default: dynamic-stress
        type: string
      width:
        description: Canvas backing width
        required: true
        default: '1920'
        type: string
      height:
        description: Canvas backing height
        required: true
        default: '1080'
        type: string
      dpr:
        description: Browser device pixel ratio
        required: true
        default: '1'
        type: string
      target_hz:
        description: Target refresh rate used for frame-budget reporting
        required: true
        default: '60'
        type: string
      dynamic_stress_webgpu_min_fps:
        description: Minimum effective FPS required for Dynamic Load on physical WebGPU
        required: true
        default: '55'
        type: string
      notes:
        description: Power/thermal/browser/device notes
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  baseline:
    # Dedicated physical Mac runner. The custom label prevents this workload
    # from landing on an unrelated self-hosted machine.
    runs-on: [self-hosted, macOS, noon-physical]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Verify physical macOS runner
        shell: bash
        run: |
          test "$(uname -s)" = "Darwin"
          echo "Runner: ${RUNNER_NAME:-unknown}"
          system_profiler SPHardwareDataType SPDisplaysDataType || true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Install pinned browser tooling
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Build optimized production WASM
        run: bash scripts/build-web-demo.sh
      - name: Record named physical-device bundle
        env:
          NOON_PERF_DEVICE_ID: ${{ inputs.device_id }}
          NOON_PERF_BACKENDS: ${{ inputs.backends }}
          NOON_PERF_SUITES: ${{ inputs.suites }}
          NOON_PERF_GPU_MODE: hardware
          NOON_PERF_WIDTH: ${{ inputs.width }}
          NOON_PERF_HEIGHT: ${{ inputs.height }}
          NOON_PERF_DPR: ${{ inputs.dpr }}
          NOON_PERF_TARGET_HZ: ${{ inputs.target_hz }}
          NOON_PERF_DYNAMIC_STRESS_WEBGPU_MIN_FPS: ${{ inputs.dynamic_stress_webgpu_min_fps }}
          NOON_PERF_DEVICE_NOTES: ${{ inputs.notes }}
          NOON_PERF_RUN_DIR: perf-artifacts/physical-dispatch
        run: node scripts/perf-device-run.mjs
      - name: Upload performance bundle
        uses: actions/upload-artifact@v7
        with:
          name: noon-perf-${{ inputs.device_id }}-${{ github.run_id }}
          path: perf-artifacts/physical-dispatch
          if-no-files-found: error
          retention-days: 30
