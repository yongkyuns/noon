name: CI

on:
  push:
    branches:
      - master
  # Qualify authoring/replay boundaries and CI harnesses before they reach master.
  pull_request:
    paths:
      - ".github/actions/dev-wasm-build/**"
      - ".github/ci/**"
      # Unrelated CI policies are covered by the always-on PR Fast Gate.
      - "!.github/ci/README.md"
      - "!.github/ci/manim-raster-workflow-cadence.test.mjs"
      - "!.github/ci/run-report.mjs"
      - "!.github/ci/run-report.test.mjs"
      - "!.github/ci/physical-gpu-mode.test.mjs"
      - ".github/workflows/ci.yml"
      - ".github/workflows/compiler-cache-seed.yml"
      - ".github/workflows/pr-fast.yml"
      - "scripts/ci-qualification-scope.mjs"
      - "scripts/cuda-transpose*.mjs"
      - "tools/cuda-transpose/**"
      - "tests/cuda_visual_validation_test.py"
      - "scripts/python-editor-*.mjs"
      - "scripts/composition-authoring-smoke.mjs"
      - "scripts/shared-authoring-smoke.mjs"
      - "scripts/paired-authoring-qualification.mjs"
      - "scripts/table-*"
      - "scripts/manim-table-*"
      - "fixtures/manim-v0.21/table-*"
      - "scripts/manim-family-*"
      - "fixtures/manim-v0.21/family-*"
      - "scripts/painter-order-browser-smoke.mjs"
      - "scripts/background-audio-smoke.mjs"
      - "scripts/browser-audio-observation.mjs"
      - "scripts/python-background-audio-smoke.mjs"
      - "scripts/export-python-scene.mjs"
      - "web/background-audio*"
      - "web/worker-audio-device.js"
      - "scripts/manim-shape-matcher-current-bounds.mjs"
      - "crates/noon-web/src/manim_shape_matcher_handle_bridge.rs"
      - "web/python/**"
      - "web/semantic-engine-endpoint.js"
      - "crates/noon-web/src/canonical_authoring_scene*"
      - "crates/noon-web/src/canonical_authoring_scene/**"
      - "crates/noon-web/src/semantic_execution_player*"
      - "crates/noon-web/src/semantic_execution_player/**"
      - "crates/noon-web/src/direct_execution_smoke.rs"
      - "scripts/spatial-surface-light-qualification.mjs"
      - "scripts/special-camera-qualification.mjs"
      - "web/python/examples/noon_spatial_surface_lighting.py"
      - "crates/noon-render-wgpu/src/gpu/**"
      - "crates/noon-render-wgpu/src/polygon_coverage.wgsl"
      - "crates/noon-render-wgpu/tests/polygon_fill_coverage.rs"
      - "crates/noon-render-wgpu/tests/polygon_perimeter_coverage.rs"
      - "crates/noon-render-wgpu/tests/path_shader_uniformity.rs"
      - "crates/noon-render-wgpu/src/gpu/glow_filter*"
      - "crates/noon-render-wgpu/src/gpu/glow_filter/**"
      - "crates/noon-render-wgpu/src/gpu/analytic_glow*"
      - "crates/noon-render-wgpu/src/gpu/gaussian_blur*"
      - "crates/noon-render-wgpu/src/gpu/gaussian_blur/**"
      - "scripts/gaussian-blur-*.mjs"
      - "scripts/blur-qualification.mjs"
      - "scripts/shadow-qualification.mjs"
      - "crates/noon-render-wgpu/src/gpu/analytic_glow/**"
      - "crates/noon-render-wgpu/src/gpu/retained_text.rs"
      - "crates/noon-render-wgpu/src/gpu/source_capture.rs"
      - "crates/noon-render-wgpu/src/gpu/linear_gradient.rs"
      - "crates/noon-render-wgpu/src/linear_gradient.rs"
      - "crates/noon-render-wgpu/src/gpu/retained_text/glow_publication*"
      - "crates/noon-render-wgpu/src/gpu/retained_text/glow_publication/**"
      - "crates/noon-render-wgpu/src/gpu/mod.rs"
      - "crates/noon-render-wgpu/src/lib.rs"
      - "crates/noon-render-wgpu/src/render_order.rs"
      - "crates/noon-render-wgpu/src/path_residency.rs"
      - "crates/noon-native/src/lib.rs"
      - "crates/noon-export/src/gpu.rs"
      - "crates/noon-web/src/execution_canvas.rs"
      - "web/ci-workflow-topology.test.mjs"
      - "tests/visual-effects/**"
      - "scripts/glow-worker-*.mjs"
      - "scripts/linear-gradient-qualification.mjs"
      - "scripts/image-fill-qualification.mjs"
      - "crates/noon-web/src/glow_worker_smoke.rs"
      - "crates/noon-web/src/retained_execution_canvas.rs"
      - "crates/noon-web/src/retained_execution_transport.rs"
      - "crates/noon-web/src/retained_execution_resources.rs"
      - "crates/noon/tests/glow_scene_raster.rs"
      - "crates/noon/tests/linear_gradient_raster.rs"
      - "crates/noon/examples/glow_scene_playback.rs"
      - "crates/noon/src/effect_authoring*"
      - "crates/noon/src/effect_authoring/**"
      - "crates/noon/src/live_session.rs"
      - "crates/noon/src/effective_capture.rs"
      - "crates/noon/src/example_scenes/spatial_surface.rs"
      - "crates/noon/src/execution_session/**"
      - "crates/noon/src/example_scenes/**"
      - "crates/noon-runtime/src/replay.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: Classify full CI qualification
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      cuda_demo: ${{ steps.scope.outputs.cuda_demo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read complete push changes
        id: scope
        env:
          BEFORE_REVISION: ${{ github.event.before }}
        run: node scripts/ci-qualification-scope.mjs

  rust:
    name: Rust
    needs: qualification
    if: ${{ !cancelled() && (needs.qualification.result != 'success' || needs.qualification.outputs.full != 'false') }}
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/master' && 'READ_WRITE' || 'READ_ONLY' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use repository-pinned Rust
        run: |
          rustup install
          rustup show active-toolchain
          rustc --version --verbose

      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-

      - name: Use sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      # PR Fast Gate runs these same commands at the merge checkout.
      - name: Install native audio build dependencies
        run: bash scripts/ci-install-reference-deps.sh libasound2-dev pkg-config

      - name: Format workspace
        if: github.event_name != 'pull_request'
        run: cargo fmt --all -- --check

      - name: Clippy workspace
        if: github.event_name != 'pull_request'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-features

  glow-raster:
    needs: qualification
    if: ${{ !cancelled() && (needs.qualification.result != 'success' || needs.qualification.outputs.full != 'false') }}
    name: Native glow raster correctness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      NOON_GLOW_BACKEND: vulkan
      XDG_RUNTIME_DIR: /tmp/noon-glow-xdg
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use repository-pinned Rust
        run: |
          rustup install
          rustc --version --verbose
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - name: Prepare software Vulkan raster adapter
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
      - name: Test qualification admission
        run: python3 -m unittest discover -s tests/visual-effects -p test_gpu_qualification.py -v
      - name: Qualify shared polygon coverage against independent numerical oracles
        env:
          NOON_REQUIRE_GPU_TESTS: '1'
        run: cargo test -p noon-render-wgpu --test polygon_fill_coverage --test polygon_perimeter_coverage --test path_shader_uniformity
      - name: Test glow resource and kernel contracts
        run: |
          cargo test -p noon-render-wgpu --lib gpu::glow_filter::tests
          cargo test -p noon-render-wgpu --lib gpu::analytic_glow::tests
          cargo test -p noon-render-wgpu --lib gpu::retained_text::glow_publication::tests
      - name: Qualify RGBA Gaussian pixels and retained raster resources
        run: cargo test -p noon-render-wgpu --lib -- --ignored --exact gpu::gaussian_blur::tests::rgba_gaussian_pixels_match_independent_reference_and_retained_revisions --nocapture
      - name: Qualify native glow pixels and real-shader negative control
        run: python3 tests/visual-effects/qualify_gpu_operator.py --report-dir glow-raster-artifacts
      - name: Qualify public Rust Scene glow playback pixels and lifecycle
        run: |
          cargo run -p noon --example glow_scene_playback
          cargo test -p noon --test glow_scene_raster -- --ignored --exact public_scene_glow_pixels_and_lifecycle --nocapture
          cargo test -p noon --test glow_scene_raster -- --ignored --exact authored_glow_pulse_pixels_restore_and_replay --nocapture
          cargo test -p noon --test glow_scene_raster -- --ignored --exact click_glow_pulse_pixels_restore_and_retire --nocapture
          cargo test -p noon --test glow_scene_raster -- --ignored --exact generic_sources_follow_real_reveal_pixels_and_apply_scope_opacity_once --nocapture
          cargo test -p noon --test glow_scene_raster -- --ignored --exact image_glow_preserves_texture_alpha_sampling_replay_and_lifecycle --nocapture
          cargo test -p noon --test glow_scene_raster -- --ignored --exact image_glow_keeps_foreground_painter_order --nocapture
          cargo test -p noon --test glow_scene_raster -- --ignored --exact offscreen_image_glow_uses_global_pixel_crop --nocapture
          cargo test -p noon --test glow_scene_raster -- --ignored --exact public_scene_blur_rgba_pixels_seek_neutral_and_removal --nocapture
          cargo test -p noon --test glow_scene_raster -- --ignored --exact public_shadow_pixels_offset_animation_hard_shadow_and_retirement --nocapture
          cargo test -p noon --test glow_scene_raster -- --ignored --exact offscreen_shadow_support_and_foreground_painter_order_match_extended_field --nocapture
          cargo test -p noon --test glow_scene_raster -- --ignored --exact shadow_scene_and_output_units_reprepare_under_view_changes --nocapture
          cargo test -p noon --test glow_scene_raster -- --ignored --exact gradient_glow_preserves_paint_alpha_seek_and_local_capture --nocapture
      - name: Qualify public Rust image paint on native GPU
        run: |
          cargo test -p noon --test glow_scene_raster -- --ignored --exact public_image_fill_pixels_fit_uv_filter_alpha_and_texture_reuse --nocapture
          cargo test -p noon --test glow_scene_raster -- --ignored --exact public_image_fill_reuses_source_capture_for_blur_shadow_and_glow --nocapture
          cargo test -p noon --test glow_scene_raster -- --ignored --exact public_image_fill_preserves_ordinary_geometry_coverage_and_solid_strokes --nocapture
      - name: Qualify public Rust animated linear paint on native GPU
        # The linear-paint oracle uses the same public Scene and retained GPU path.
        # Absence of the requested native adapter is a failure.
        run: cargo test -p noon --test linear_gradient_raster -- --ignored --exact authored_gradient_animation_matches_independent_native_pixel_oracle --nocapture
      - name: Preserve native glow qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: glow-raster-correctness
          path: glow-raster-artifacts
          if-no-files-found: warn
          retention-days: 3

  web-build:
    needs: qualification
    outputs:
      cuda_demo: ${{ needs.qualification.outputs.cuda_demo }}
    if: ${{ !cancelled() && (needs.qualification.result != 'success' || needs.qualification.outputs.full != 'false') }}
    name: Web package
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_DIR: /home/runner/.cache/noon-sccache-wasm
      SCCACHE_CACHE_SIZE: "1G"
      SCCACHE_LOCAL_RW_MODE: "READ_ONLY"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test CI cache and artifact contracts
        run: node --test .github/ci/*.test.mjs

      - name: Build and validate browser package
        uses: ./.github/actions/dev-wasm-build
        with:
          preflight: "true"

      - name: Upload browser package
        uses: actions/upload-artifact@v7
        with:
          name: web-pkg
          path: |
            web/pkg
            web/python-worker.js
            web/runtime-build-identity.json
            web/python/compat-bundle.*.json
            web/ci-artifact.json
            web/ci-Cargo.lock
          if-no-files-found: error
          retention-days: 1

  browser-authoring:
    name: Browser authoring
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download browser package
        uses: actions/download-artifact@v8
        with:
          name: web-pkg
          path: web
      - name: Verify source and browser artifact provenance
        run: node .github/ci/wasm-build.mjs verify
      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.62.1
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Test Rust/Python semantic parity
        run: node scripts/cross-language-parity.mjs
      - name: Test deterministic seek/playback/rewind in WASM
        run: node scripts/deterministic-replay-smoke.mjs
      - name: Test Manim-style Python compatibility
        run: node scripts/manim-compat-smoke.mjs
      - name: Test current Rust and Python shape-matcher bounds
        run: node scripts/manim-shape-matcher-current-bounds.mjs
      - name: Test Manim composition authoring
        run: node scripts/composition-authoring-smoke.mjs
      - name: Test executable Manim tutorial corpus
        run: node scripts/manim-tutorial-smoke.mjs
      - name: Test CUDA demo CPU-backed visual fidelity
        id: cuda_fidelity
        if: ${{ needs.web-build.outputs.cuda_demo != 'false' }}
        timeout-minutes: 15
        run: |
          python3 tests/cuda_visual_validation_test.py
          node --test scripts/cuda-transpose-pixels.test.mjs scripts/cuda-transpose-report.test.mjs
          node scripts/cuda-transpose-qualification.mjs
      - name: Preserve CUDA demo fidelity evidence
        if: ${{ always() && steps.cuda_fidelity.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: cuda-transpose-fidelity
          path: cuda-transpose-qualification
          if-no-files-found: warn
          retention-days: 3

  browser-reactive:
    name: Browser reactive and editor
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download browser package
        uses: actions/download-artifact@v8
        with:
          name: web-pkg
          path: web
      - name: Verify source and browser artifact provenance
        run: node .github/ci/wasm-build.mjs verify
      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.62.1
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Test playground viewport layout
        run: node scripts/playground-layout-smoke.mjs
      - name: Test native reactive Python authoring
        run: node scripts/reactive-authoring-smoke.mjs
      - name: Test shared semantic authoring and runtime
        run: node scripts/shared-authoring-smoke.mjs
      - name: Test native browser input signals
        run: node scripts/native-input-smoke.mjs
      - name: Test direct background audio and scene controls
        run: timeout --signal=TERM 240s node scripts/background-audio-smoke.mjs
      - name: Retain direct background audio evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: background-audio-full-ci
          path: browser-smoke-artifacts/background-audio/
          if-no-files-found: ignore
          retention-days: 3
      - name: Test Python gallery background audio
        env:
          NOON_PYTHON_AUDIO_ARTIFACTS: ${{ runner.temp }}/python-background-audio
        run: timeout --signal=TERM 240s node scripts/python-background-audio-smoke.mjs
      - name: Retain Python background audio evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-background-audio-full-ci
          path: ${{ runner.temp }}/python-background-audio/
          if-no-files-found: ignore
          retention-days: 3
      - name: Test Python updater callback bridge
        run: node scripts/updater-callback-smoke.mjs
      - name: Test engine/render worker transports
        run: node scripts/execution-worker-smoke.mjs
      - name: Test shared authoring routing, recovery, and termination
        run: node scripts/authoring-execution-router-smoke.mjs
      - name: Test required slow callbacks preserve shared execution order
        run: node scripts/execution-worker-host-smoke.mjs
      - name: Test Python editor highlighting and linting
        run: |
          node scripts/python-editor-input-smoke.mjs
          node scripts/python-editor-smoke.mjs

  # All renderer assertions and the visual cross-backend comparison execute
  # on one runner. This avoids queueing a 17-second parity-only job after the
  # two renderer matrix jobs while retaining every assertion and artifact.
  browser-rendering-parity:
    name: Browser rendering parity
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download browser package
        uses: actions/download-artifact@v8
        with:
          name: web-pkg
          path: web
      - name: Verify source and browser artifact provenance
        run: node .github/ci/wasm-build.mjs verify
      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.62.1
      - name: Install browser smoke and visual comparison dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Test WebGL browser rendering
        env:
          NOON_BROWSER_SMOKE_BACKEND: webgl
          NOON_BROWSER_SMOKE_PORT: "4174"
          NOON_BROWSER_SMOKE_ARTIFACTS: browser-smoke-artifacts/webgl
        run: node scripts/browser-smoke.mjs
      - name: Qualify WebGL point-lit surface through direct WASM and Python worker
        env:
          NOON_SPATIAL_SURFACE_BACKEND: webgl
          NOON_SPATIAL_SURFACE_PORT: "4214"
          NOON_SPATIAL_SURFACE_ARTIFACTS: browser-smoke-artifacts/webgl/spatial-surface-light
        run: node scripts/spatial-surface-light-qualification.mjs
      - name: Test WebGL camera backing-density invariance
        env:
          NOON_BROWSER_SMOKE_BACKEND: webgl
          NOON_CAMERA_DENSITY_PORT: "4195"
          NOON_CAMERA_DENSITY_ARTIFACTS: browser-smoke-artifacts/webgl/camera-density
        run: node scripts/camera-density-smoke.mjs
      - name: Test WebGPU browser rendering
        env:
          NOON_BROWSER_SMOKE_BACKEND: webgpu
          NOON_BROWSER_SMOKE_ARTIFACTS: browser-smoke-artifacts/webgpu
        run: node scripts/browser-smoke.mjs
      - name: Qualify WebGPU point-lit surface through direct WASM and Python worker
        env:
          NOON_SPATIAL_SURFACE_BACKEND: webgpu
          NOON_SPATIAL_SURFACE_ARTIFACTS: browser-smoke-artifacts/webgpu/spatial-surface-light
        run: node scripts/spatial-surface-light-qualification.mjs
      - name: Qualify shared camera and surface-cell capability cases
        env:
          NOON_CAMERA_ARTIFACTS: browser-smoke-artifacts/webgpu/special-camera
        run: |
          node scripts/special-camera-qualification.mjs
          NOON_CAMERA_NO_JSPI=1 NOON_PAIRED_CASES=following_graph_camera-1.5,moving_zoomed_scene_around-9.5 node scripts/special-camera-qualification.mjs
      - name: Test WebGPU camera backing-density invariance
        env:
          NOON_BROWSER_SMOKE_BACKEND: webgpu
          NOON_CAMERA_DENSITY_ARTIFACTS: browser-smoke-artifacts/webgpu/camera-density
        run: node scripts/camera-density-smoke.mjs
      - name: Test retained worker glow report and independent reference
        run: node --test scripts/glow-worker-reference.test.mjs scripts/glow-worker-report.test.mjs scripts/glow-worker-transport.test.mjs
      - name: Qualify reusable RGBA Gaussian raster on WebGPU and WebGL2
        run: node scripts/gaussian-blur-qualification.mjs
      - name: Qualify paired Rust and Python Blur authoring on WebGPU and WebGL2
        run: node scripts/blur-qualification.mjs
      - name: Qualify paired Rust and Python Shadow authoring on WebGPU and WebGL2
        run: node scripts/shadow-qualification.mjs
      - name: Qualify paired Rust and Python image paints on WebGPU and WebGL2
        run: node scripts/image-fill-qualification.mjs
      - name: Qualify retained worker glow images and recovery
        env:
          NOON_GLOW_WORKER_ARTIFACTS: browser-smoke-artifacts/webgpu/glow-worker
        run: node scripts/glow-worker-qualification.mjs
      - name: Qualify Rust-WASM and Python animated linear paint on WebGPU and WebGL
        env:
          NOON_GRADIENT_ARTIFACTS: browser-smoke-artifacts/linear-gradient
        run: node scripts/linear-gradient-qualification.mjs
      - name: Test mixed painter order in WebGPU
        run: node scripts/painter-order-browser-smoke.mjs
      - name: Compare WebGPU and WebGL foreground coverage
        run: |
          node scripts/browser-backend-visual-parity.mjs \
            browser-smoke-artifacts/webgpu \
            browser-smoke-artifacts/webgl \
            browser-backend-parity-report
      - name: Upload WebGPU browser smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-screenshots-webgpu
          path: browser-smoke-artifacts/webgpu
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload WebGL browser smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-screenshots-webgl
          path: browser-smoke-artifacts/webgl
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload backend visual parity report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-backend-visual-parity
          path: browser-backend-parity-report
          if-no-files-found: error
          retention-days: 3
