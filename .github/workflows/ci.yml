name: M1 merge source snapshot (temporary)
on:
  push:
    branches: [codex/m1-merge-source-d556]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d556ad44b2469d6624449b2f4394d7c21ad46727
          persist-credentials: false
      - name: Preserve exact merge source
        run: |
          mkdir -p "$RUNNER_TEMP/m1-merge"
          git archive HEAD | gzip > "$RUNNER_TEMP/m1-merge/source.tar.gz"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/m1-merge/identity.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: m1-merge-source-d556
          path: ${{ runner.temp }}/m1-merge
          if-no-files-found: error
          retention-days: 1
