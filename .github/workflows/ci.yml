name: M1 exact merge-base snapshot (temporary)
on:
  push:
    branches: [codex/m1-browser-prerequisites-ca12]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: b13c09055fd1f837fd9ad10f1f04b5de3af91095
          persist-credentials: false
      - name: Archive verified merge-base for local three-way integration
        run: |
          mkdir -p "$RUNNER_TEMP/m1-base"
          test "$(git rev-parse HEAD^{tree})" = 6a2320edb3385903ed7ba410bc9fec141259358a
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/m1-base/base.tar.gz"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/m1-base/identity.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: m1-exact-base-b13
          path: ${{ runner.temp }}/m1-base/
          if-no-files-found: error
          retention-days: 1
