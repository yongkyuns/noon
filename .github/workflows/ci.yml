name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Fast architecture gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/browser-realtime-architecture

      - name: Apply stroke join/cap parity implementation
        run: |
          python3 scripts/apply_stroke_style_parity.py
          python3 scripts/fix_stroke_style_literal_migration.py
          python3 scripts/fix_stroke_style_compile.py

      - name: Use stable Rust
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown

      - name: Format generated Rust
        run: cargo fmt --all

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-noon-arch-${{ hashFiles('crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-noon-arch-

      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Format architecture workspace
        run: cargo fmt --all -- --check

      - name: Compile architecture workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Clippy architecture workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test geometry correctness invariants
        run: |
          cargo test -p noon-geometry --test tessellation_correctness
          cargo test -p noon-geometry --test stroke_style_parity

      - name: Test architecture workspace
        run: cargo test --workspace --all-features

      - name: Compile WebGPU renderer for browser
        run: cargo check -p noon-render-wgpu --target wasm32-unknown-unknown --no-default-features --features web

      - name: Compile browser runtime
        run: cargo check -p noon-web --target wasm32-unknown-unknown

      - name: Build and validate browser package
        run: bash scripts/build-web-demo.sh

      - name: Publish validated stroke join/cap parity implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates web/python/noon.py web/python/test_noon.py
          if git diff --cached --quiet; then
            echo "No stroke style changes to publish"
          else
            git commit -m "Unify path stroke join and cap semantics"
            git push origin HEAD:agent/browser-realtime-architecture
          fi

  legacy-compat:
    name: Full legacy compatibility
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use stable Rust
        run: |
          rustup default stable
          rustup component add rustfmt clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            noon/target
            examples/target
          key: ${{ runner.os }}-noon-legacy-${{ hashFiles('noon/Cargo.toml', 'examples/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-noon-legacy-

      - name: Format legacy crates
        run: |
          cargo fmt --manifest-path noon/Cargo.toml -- --check
          cargo fmt --manifest-path examples/Cargo.toml -- --check

      - name: Compile legacy crates
        run: |
          cargo check --manifest-path noon/Cargo.toml --all-targets --all-features
          cargo check --manifest-path examples/Cargo.toml --all-targets --all-features

      - name: Clippy legacy crates
        run: |
          cargo clippy --manifest-path noon/Cargo.toml --all-targets --all-features -- --cap-lints warn
          cargo clippy --manifest-path examples/Cargo.toml --all-targets --all-features -- --cap-lints warn

      - name: Test legacy crate
        run: cargo test --manifest-path noon/Cargo.toml --all-features -- --skip path::tests::partial_path