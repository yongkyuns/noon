name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  morph-feature-preservation:
    name: One-shot morph feature preservation fix
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/browser-realtime-architecture' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/browser-realtime-architecture
          fetch-depth: 0

      - name: Use stable Rust
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown

      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Apply and validate feature-preserving morph sampling
        shell: bash
        run: |
          if grep -q 'feature_indices: Vec<usize>' crates/noon-geometry/src/morph.rs; then
            echo 'Feature-preserving morph sampling already applied.'
            exit 0
          fi
          python scripts/agent_preserve_morph_features.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          cargo check -p noon-render-wgpu --target wasm32-unknown-unknown --no-default-features --features web
          cargo check -p noon-web --target wasm32-unknown-unknown
          bash scripts/build-web-demo.sh

      - name: Publish validated source only
        shell: bash
        run: |
          if git diff --quiet -- crates/noon-geometry/src/morph.rs; then
            echo 'No source changes to publish.'
            exit 0
          fi
          git config user.name "Yongkyun Shin"
          git config user.email "yongkyuns@gmail.com"
          git add -- crates/noon-geometry/src/morph.rs
          git commit -m "Preserve authored vertices in morph resampling"
          git push origin HEAD:agent/browser-realtime-architecture

  architecture:
    name: Fast architecture gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use stable Rust
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-noon-arch-${{ hashFiles('crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-noon-arch-

      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Format architecture workspace
        run: cargo fmt --all -- --check

      - name: Compile architecture workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Clippy architecture workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test architecture workspace
        run: cargo test --workspace --all-features

      - name: Compile WebGPU renderer for browser
        run: cargo check -p noon-render-wgpu --target wasm32-unknown-unknown --no-default-features --features web

      - name: Compile browser runtime
        run: cargo check -p noon-web --target wasm32-unknown-unknown

      - name: Build and validate browser package
        run: bash scripts/build-web-demo.sh

  legacy-compat:
    name: Full legacy compatibility
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use stable Rust
        run: |
          rustup default stable
          rustup component add rustfmt clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            noon/target
            examples/target
          key: ${{ runner.os }}-noon-legacy-${{ hashFiles('noon/Cargo.toml', 'examples/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-noon-legacy-

      - name: Format legacy crates
        run: |
          cargo fmt --manifest-path noon/Cargo.toml -- --check
          cargo fmt --manifest-path examples/Cargo.toml -- --check

      - name: Compile legacy crates
        run: |
          cargo check --manifest-path noon/Cargo.toml --all-targets --all-features
          cargo check --manifest-path examples/Cargo.toml --all-targets --all-features

      - name: Clippy legacy crates
        run: |
          cargo clippy --manifest-path noon/Cargo.toml --all-targets --all-features -- --cap-lints warn
          cargo clippy --manifest-path examples/Cargo.toml --all-targets --all-features -- --cap-lints warn

      - name: Test legacy crate
        run: cargo test --manifest-path noon/Cargo.toml --all-features -- --skip path::tests::partial_path
