name: CI

on:
  pull_request:
  push:
    branches:
      - agent/browser-realtime-architecture
      - agent/ci-base

permissions:
  contents: read

jobs:
  rust:
    name: Rust quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Compile workspace
        run: cargo check --workspace --all-targets --all-features

      # The original Noon crate predates the strict CI policy and currently
      # carries substantial lint debt. Keep compiling it under Clippy, but do
      # not make legacy warnings block the new architecture work.
      - name: Clippy legacy crates
        run: cargo clippy -p noon -p examples --all-targets --all-features -- -A warnings

      # New architecture crates are added here as they enter the workspace and
      # are warning-free from their first commit.
      - name: Clippy new architecture crates
        if: ${{ hashFiles('crates/noon-core/Cargo.toml') != '' }}
        run: cargo clippy -p noon-core --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features
