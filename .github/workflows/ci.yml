name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Fast architecture gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-noon-arch-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-noon-arch-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Compile architecture crates
        run: cargo check -p noon-core -p noon-compile -p noon-runtime --all-targets --all-features

      - name: Clippy architecture crates
        run: cargo clippy -p noon-core -p noon-compile -p noon-runtime --all-targets --all-features -- -D warnings

      - name: Test architecture crates
        run: cargo test -p noon-core -p noon-compile -p noon-runtime --all-features

  legacy-compat:
    name: Full workspace compatibility
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-noon-full-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-noon-full-

      - name: Compile workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Clippy legacy crates
        run: cargo clippy -p noon -p examples --all-targets --all-features -- --cap-lints warn

      - name: Tests
        # `path::tests::partial_path` is a known legacy test bug: it replays
        # already-closed text glyph path events and then calls `builder.close()`
        # again, which current Lyon correctly rejects. The legacy path subsystem
        # is being replaced; all other legacy and all new architecture tests run.
        run: cargo test --workspace --all-features -- --skip path::tests::partial_path
