name: Hosted Mesa llvmpipe WebGL2 feasibility (diagnostic only)

on:
  pull_request:
    types: [opened]
    paths:
      - ".github/workflows/perf-hosted-mesa-feas.yml"
      - "benchmarks/hosted-mesa-feas.json"
      - "scripts/perf-hosted-mesa-feas.mjs"
      - "scripts/perf-hosted-mesa-feas.test.mjs"

permissions:
  contents: read

concurrency:
  group: hosted-mesa-feas-1933-20261009-01
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Original Chromium WebGL2 backend feasibility, NOT acceptance
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/1933-hosted-mesa-feas-20261009-01' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NOON_MESA_STUDY: "1933-hosted-mesa-feas-20261009-01"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record preregistration, host identity and one-shot attempt
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p evidence/inputs
          cp benchmarks/hosted-mesa-feas.json evidence/inputs/frozen-plan.json
          sha256sum evidence/inputs/frozen-plan.json > evidence/inputs/plan.sha256
          git rev-parse HEAD > evidence/inputs/study-commit.txt
          git archive HEAD | gzip > evidence/inputs/study-source.tar.gz
          uname -a > evidence/inputs/kernel.txt
          lscpu > evidence/inputs/lscpu.txt
          cat /etc/os-release > evidence/inputs/os-release.txt
          printf '%s/%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > evidence/inputs/attempt.txt
          printf '%s\n' "ImageOS=${ImageOS:-unknown}" "ImageVersion=${ImageVersion:-unknown}" > evidence/inputs/runner-image.txt
          echo "No candidate benchmark or product acceptance is performed" > evidence/README.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.3"
      - name: Validate frozen protocol before browser use
        run: |
          set -euo pipefail
          node --check scripts/perf-hosted-mesa-feas.mjs
          node --check scripts/perf-hosted-mesa-feas.test.mjs
          node --test scripts/perf-hosted-mesa-feas.test.mjs | tee evidence/inputs/protocol-tests.log
      - name: Install Mesa software GL, Xvfb and pinned Chromium
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-utils
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install chromium
          node --version > evidence/inputs/node-version.txt
          npm ls playwright > evidence/inputs/browser-packages.txt
          dpkg-query -W libgl1-mesa-dri libglx-mesa0 libegl-mesa0 > evidence/inputs/mesa-packages.txt
      - name: Run all three fixed WebGL2 backend feasibility cases ONCE
        run: |
          set -euo pipefail
          xvfb-run -a --server-args='-screen 0 1280x800x24' \
            node scripts/perf-hosted-mesa-feas.mjs \
              benchmarks/hosted-mesa-feas.json evidence/mesa-backend-observations.json \
            | tee evidence/probe-stdout.jsonl
      - name: Preserve all original evidence (including failure or fallback)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-mesa-feas-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
