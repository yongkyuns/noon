name: Diagnostic prepared canvas
on:
  push:
    branches: [diagnostic/noon-prefix-canvas-20261023]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: "READ_ONLY"
      NOON_PREPARED_CANVAS_ARTIFACTS: /tmp/noon-canvas/browser
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Apply exact-source candidate
        run: python3 .github/diagnostics/prepared-canvas.py apply
      - name: Install pinned Rust
        run: |
          rustup install
          rustc --version --verbose | tee /tmp/noon-canvas/rustc.txt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Format and retain exact candidate
        run: |
          cargo fmt --all
          python3 .github/diagnostics/prepared-canvas.py save
      - name: Shared canvas and browser Rust tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p noon-web --all-features --lib 2>&1 | tee /tmp/noon-canvas/web-tests.log
          cargo test --locked -p noon --no-default-features --features prepared-prefix --test prepared_prefix_identity 2>&1 | tee /tmp/noon-canvas/identity-tests.log
          cargo check --locked -p noon-web --features prepared-prefix --target wasm32-unknown-unknown 2>&1 | tee /tmp/noon-canvas/wasm-check.log
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Build actual prepared canvas WASM
        shell: bash
        run: |
          set -o pipefail
          wasm-pack build crates/noon-web --target web --out-dir ../../web/pkg --dev --no-opt --features prepared-prefix,renderer-smoke --locked 2>&1 | tee /tmp/noon-canvas/wasm-build.log
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.62.1
      - name: Install actual Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Qualify actual WebGPU and WebGL canvas pixels and DOM input
        shell: bash
        run: |
          set -o pipefail
          node scripts/prepared-canvas-qualification.mjs 2>&1 | tee /tmp/noon-canvas/browser-tests.log
      - name: Repository fast gate and existing CI topology
        shell: bash
        run: |
          set -o pipefail
          node --test .github/ci/*.test.mjs 2>&1 | tee /tmp/noon-canvas/ci-topology.log
          bash scripts/check.sh fast HEAD 2>&1 | tee /tmp/noon-canvas/fast-gate.log
      - name: Store tested blobs without changing product refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo fmt --all -- --check
          python3 .github/diagnostics/prepared-canvas.py save
          python3 .github/diagnostics/prepared-canvas.py store
      - name: Retain exact source and all results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prepared-canvas-qualification
          path: /tmp/noon-canvas
          if-no-files-found: error
          retention-days: 3
