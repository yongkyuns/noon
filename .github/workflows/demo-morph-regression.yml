name: Demo morph regression diagnostic
on:
  push:
    branches: [prep/demo-editor-source-snapshot]
    paths: [.github/workflows/demo-morph-regression.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 83ac18f7b0974356bbb47e6cadcd4d1aceb5a1eb
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: a8a0ce78bf3886ea0203e4f1e95e5c043c32111d
          path: test-source
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: playground-cross-browser-web-runtime
          run-id: 35349143222
          github-token: ${{ github.token }}
          path: web
      - name: Verify pinned runtime and exact regression test
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.equal(JSON.parse(fs.readFileSync('web/runtime-build-identity.json')).sourceRevision,'83ac18f7b0974356bbb47e6cadcd4d1aceb5a1eb');"
          cp test-source/scripts/playground-playback-morph-regression.mjs scripts/playground-playback-morph-regression.mjs
          test "$(git hash-object scripts/playground-playback-morph-regression.mjs)" = 6844e9c0803b1e27cbeaddd6cb2b53bdcb8bfb0c
          rm -rf test-source
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Require old runtime to fail only the intermediate-hold pixel regression
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/playground-playback-morph-regression.mjs > morph-baseline.log 2>&1
          code=$?
          set -e
          cat morph-baseline.log
          test "$code" -ne 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('browser-smoke-artifacts/playground-playback-morph/morph-regression.json').read_text())
          assert r['outcome'] == 'fail', r
          assert r['errors'] == [], r['errors']
          assert len(r['comparisons']) == 34, r
          bad = [s for s in r['comparisons'] if s['mismatch'] >= .002]
          expected = {(mode,t) for mode in ['seek','forward'] for t in [2.3,2.301,2.7,3.049]}
          assert {(s['mode'],s['time']) for s in bad} == expected, bad
          assert all(s['mismatch'] > .02 for s in bad), bad
          assert 'completed replay must preserve the first-pass frame' in r['failure'], r['failure']
          print('Confirmed: final regression test detects every wrong rocket hold on old runtime, with no other phase mismatches.')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: morph-regression-red-proof
          path: |
            browser-smoke-artifacts/playground-playback-morph
            morph-baseline.log
            web/runtime-build-identity.json
          if-no-files-found: error
          retention-days: 3
