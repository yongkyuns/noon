name: Demo morph regression diagnostic
on:
  push:
    branches: [prep/demo-editor-source-snapshot]
    paths: [.github/workflows/demo-morph-regression.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 83ac18f7b0974356bbb47e6cadcd4d1aceb5a1eb
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: staging
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: playground-cross-browser-web-runtime
          run-id: 35349143222
          github-token: ${{ github.token }}
          path: web
      - name: Verify pinned runtime and install browser
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.equal(JSON.parse(fs.readFileSync('web/runtime-build-identity.json')).sourceRevision,'83ac18f7b0974356bbb47e6cadcd4d1aceb5a1eb');"
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Record source and replay transitions
        shell: bash
        run: |
          set -euo pipefail
          cp staging/.demo-regression/morph-diagnostic.mjs scripts/morph-diagnostic.mjs
          node scripts/morph-diagnostic.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: morph-regression-baseline
          path: |
            morph-diagnostics
            web/runtime-build-identity.json
          if-no-files-found: error
          retention-days: 3
