name: Diagnostic source unwind
on:
  push:
    branches: [diagnostic/noon-source-unwind-20261023]
permissions:
  contents: write
concurrency:
  group: diagnostic-source-unwind
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: 'true'
  SCCACHE_GHA_RW_MODE: READ_ONLY
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: |
          mkdir -p /tmp/noon-source-unwind
          rustup install
          rustc --version --verbose | tee /tmp/noon-source-unwind/rustc.txt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Reproduce all four unwind failures on unchanged production source
        run: |
          python3 .github/diagnostics/source-unwind.py tests
          cargo fmt --all
          set +e
          cargo test --locked -p noon --no-default-features --features prepared-prefix --lib cooperative_source_unwind > /tmp/noon-source-unwind/baseline.log 2>&1
          status=$?
          set -e
          cat /tmp/noon-source-unwind/baseline.log
          test "$status" -eq 101
          grep -F 'test result: FAILED. 0 passed; 4 failed; 0 ignored' /tmp/noon-source-unwind/baseline.log
      - name: Apply fix and retain exact formatted source
        run: |
          python3 .github/diagnostics/source-unwind.py fix
          cargo fmt --all
          python3 .github/diagnostics/source-unwind.py save
      - name: Qualify source cleanup and retained history
        run: |
          set -o pipefail
          cargo test --locked -p noon --no-default-features --features prepared-prefix --lib cooperative_source 2>&1 | tee /tmp/noon-source-unwind/source-tests.log
          cargo test --locked -p noon --no-default-features --features prepared-prefix --test prepared_prefix_identity 2>&1 | tee /tmp/noon-source-unwind/identity-tests.log
          cargo check --locked -p noon-web --features prepared-prefix --target wasm32-unknown-unknown 2>&1 | tee /tmp/noon-source-unwind/wasm-check.log
      - name: Required repository fast gate
        run: |
          set -o pipefail
          bash scripts/check.sh fast HEAD 2>&1 | tee /tmp/noon-source-unwind/fast-gate.log
      - name: Store tested blobs without moving any refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/diagnostics/source-unwind.py upload
      - name: Preserve source and evidence including baseline failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-unwind-qualification
          path: /tmp/noon-source-unwind
          retention-days: 3
          if-no-files-found: error
