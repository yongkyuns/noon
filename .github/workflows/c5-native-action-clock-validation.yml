name: C5 native action clock qualification

on:
  push:
    branches: [validation/c5-native-action-clock-20260924]
    paths:
      - crates/**
      - scripts/validation/c5-native-action-clock*.py
      - .github/workflows/c5-native-action-clock-validation.yml
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: c5-native-action-clock
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      BASE_SHA: 1245e6841af2f5ddab02481a4a1e833566a29baa
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Reconstruct exact clean source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/c5-native-action-proof
          python3 scripts/validation/c5-native-action-clock.py
          if test -f scripts/validation/c5-native-action-clock-fix.py; then
            python3 scripts/validation/c5-native-action-clock-fix.py
          fi
          rustup install
          rustc --version --verbose > /tmp/c5-native-action-proof/rust-version.txt
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          git read-tree "$BASE_SHA"
          while IFS= read -r file; do git add "$file"; done < /tmp/c5-native-action-proof/paths.txt
          git diff --cached --name-only "$BASE_SHA" | diff -u /tmp/c5-native-action-proof/paths.txt -
          git write-tree > /tmp/c5-native-action-proof/tree.txt
          git diff --cached --binary "$BASE_SHA" > /tmp/c5-native-action-proof/source.patch
          git diff --cached --stat "$BASE_SHA" > /tmp/c5-native-action-proof/source.stat
          git archive "$(cat /tmp/c5-native-action-proof/tree.txt)" | gzip > /tmp/c5-native-action-proof/source.tar.gz
          cp .github/workflows/native-host-smoke.yml /tmp/c5-native-action-proof/native-host-smoke.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          candidate=$(git commit-tree "$(cat /tmp/c5-native-action-proof/tree.txt)" -p "$BASE_SHA" -m 'C5: native bound actions and independent property animation time')
          git read-tree "$GITHUB_SHA"
          git checkout --detach --force "$candidate"
          test ! -e .github/workflows/c5-native-action-clock-validation.yml
          test "$(git rev-parse HEAD^{tree})" = "$(cat /tmp/c5-native-action-proof/tree.txt)"
          git diff --exit-code
      - name: Shared ordering and native action clock regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p noon --no-default-features --lib live_session::pointer_actions::tests -- --nocapture 2>&1 | tee /tmp/c5-native-action-proof/shared.log
          cargo test -p noon --no-default-features --lib live_program::property_animation::tests -- --nocapture 2>&1 | tee /tmp/c5-native-action-proof/program.log
          cargo test -p noon-native --lib property_animation::tests -- --nocapture 2>&1 | tee /tmp/c5-native-action-proof/native.log
      - name: Omitted host dispatcher negative control
        shell: bash
        run: |
          set -euo pipefail
          file=crates/noon-native/src/execution_source.rs
          cp "$file" /tmp/c5-native-dispatch-good.rs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/noon-native/src/execution_source.rs')
          s = p.read_text()
          old = '.submit_pointer_input_with_actions(token, input, effect_delta)\n            .map(Some)'
          assert s.count(old) == 1
          p.write_text(s.replace(old, '.submit_native_pointer_input(token, input)\n            .map(|_| None)'))
          PY
          set +e
          cargo test -p noon-native --lib property_animation::tests::native_finished_source_click_uses_effect_clock_and_restores_without_source_resume -- --exact --nocapture > /tmp/c5-native-action-proof/negative-dispatch.log 2>&1
          result=$?
          set -e
          cp /tmp/c5-native-dispatch-good.rs "$file"
          test "$result" -ne 0
          grep -F 'test result: FAILED. 0 passed; 1 failed' /tmp/c5-native-action-proof/negative-dispatch.log
      - name: Omitted elapsed delivery negative control
        shell: bash
        run: |
          set -euo pipefail
          file=crates/noon-native/src/property_animation.rs
          cp "$file" /tmp/c5-native-clock-good.rs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/noon-native/src/property_animation.rs')
          s = p.read_text()
          old = 'self.execution.advance_property_animations_by(delta)?;'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'self.execution.advance_property_animations_by(0.0)?;'))
          PY
          set +e
          cargo test -p noon-native --lib property_animation::tests::native_finished_source_click_uses_effect_clock_and_restores_without_source_resume -- --exact --nocapture > /tmp/c5-native-action-proof/negative-clock.log 2>&1
          result=$?
          set -e
          cp /tmp/c5-native-clock-good.rs "$file"
          test "$result" -ne 0
          grep -F 'test result: FAILED. 0 passed; 1 failed' /tmp/c5-native-action-proof/negative-clock.log
          cargo test -p noon-native --lib property_animation::tests -- --nocapture 2>&1 | tee /tmp/c5-native-action-proof/restored.log
          git diff --exit-code
      - name: Existing native, shared, WASM and repository fast gates
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p noon-native --lib 2>&1 | tee /tmp/c5-native-action-proof/native-all.log
          cargo test -p noon --no-default-features --lib 2>&1 | tee /tmp/c5-native-action-proof/noon.log
          cargo check -p noon-web --no-default-features --target wasm32-unknown-unknown 2>&1 | tee /tmp/c5-native-action-proof/wasm.log
          node --test web/*.test.mjs scripts/*contract*.test.mjs .github/ci/*.test.mjs 2>&1 | tee /tmp/c5-native-action-proof/node.log
          bash scripts/check.sh fast "$BASE_SHA" 2>&1 | tee /tmp/c5-native-action-proof/fast.log
      - name: Install real surface qualification prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0
      - name: Actual X11 native click effect, zoom, retrigger and restoration
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" cargo test -p noon-native native_surface_smoke_presents_click_effect_zoom_and_restoration -- --ignored --nocapture --test-threads=1 2>&1 | tee /tmp/c5-native-action-proof/surface.log
          xvfb-run -a -s "-screen 0 1280x720x24" cargo test -p noon-native native_surface_smoke_presents_inspection_zoom_and_recovery -- --ignored --nocapture --test-threads=1 2>&1 | tee /tmp/c5-native-action-proof/inspection-surface.log
          xvfb-run -a -s "-screen 0 1280x720x24" cargo test -p noon-native native_surface_smoke_presents_callback_continuation_endpoint -- --ignored --nocapture --test-threads=1 2>&1 | tee /tmp/c5-native-action-proof/callback-surface.log
      - name: Publish tested code-only source for authorized workflow restoration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git rev-parse HEAD^{tree})" = "$(cat /tmp/c5-native-action-proof/tree.txt)"
          git checkout "$BASE_SHA" -- .github/workflows/native-host-smoke.yml
          tree=$(git write-tree)
          candidate=$(git commit-tree "$tree" -p "$BASE_SHA" -m 'C5: native bound actions and independent property animation time')
          git checkout --detach --force "$candidate"
          branch="staging/c5-native-action-clock-tested-${GITHUB_RUN_ID}"
          test -z "$(git ls-remote --heads origin "refs/heads/$branch")"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > /tmp/c5-native-action-proof/code-commit.txt
          git rev-parse HEAD^{tree} > /tmp/c5-native-action-proof/code-tree.txt
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: c5-native-action-clock-proof
          path: /tmp/c5-native-action-proof
          retention-days: 7
          if-no-files-found: error
