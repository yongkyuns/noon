name: Qualify Glow logical viewport repair (temporary)
on:
  push:
    branches: [codex/qualify-glow-logical-viewport-e042]
    paths: [.github/workflows/qualify-glow-logical-viewport.yml]
permissions:
  contents: read
concurrency:
  group: qualify-glow-logical-viewport-e042
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      NOON_GLOW_BACKEND: vulkan
      XDG_RUNTIME_DIR: /tmp/noon-glow-xdg
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 4e1b07e524379cd13b2d6838f7870bc3c6c61c6e
          fetch-depth: 0
      - name: Apply exact reviewed source edits to clean product baseline
        run: |
          set -euo pipefail
          cp .github/glow-logical-viewport.py "$RUNNER_TEMP/glow-logical-viewport.py"
          cp .github/showcase-glow-viewport.mjs "$RUNNER_TEMP/showcase-glow-viewport.mjs"
          git checkout --detach e042b56060274a1bcf18045ac610a8586509c636
          test "$(git rev-parse HEAD)" = e042b56060274a1bcf18045ac610a8586509c636
          python3 "$RUNNER_TEMP/glow-logical-viewport.py"
          cp "$RUNNER_TEMP/showcase-glow-viewport.mjs" scripts/showcase-glow-viewport.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/showcase-live-review.mjs')
          s=p.read_text()
          anchor='import { NONREPLAYABLE_SHOWCASE_CAPABILITIES } from "../web/showcase-gallery.js";'
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+'\nimport { qualifyGlowViewport } from "./showcase-glow-viewport.mjs";')
          anchor='    report.servedBuildIdentity = await identity.json();\n'
          addition=(
              '    if (manifest.entries.some(entry => entry.id === "showcase-gpu-glow")) {\n'
              '      try {\n'
              '        report.glowViewportQualification = { outcome: "pass", ...await qualifyGlowViewport(\n'
              '          browser, base, path.join(output, "production-viewport"), backend, cache,\n'
              '        ) };\n'
              '      } catch (error) {\n'
              '        report.glowViewportQualification = { outcome: "fail", error: String(error.stack ?? error) };\n'
              '      }\n'
              '    }\n\n'
          )
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+addition)
          anchor='    report.runtimeResources = cache.stats();'
          assert s.count(anchor)==1
          s=s.replace(anchor,'    assert.notEqual(report.glowViewportQualification?.outcome, "fail", "production-layout glow projection failed");\n'+anchor)
          p.write_text(s)
          # Exact binary ratio, not a changed geometry or relaxed tolerance.
          for name, count in (
              ('crates/noon-render-wgpu/src/gpu/glow_filter/tests.rs', 2),
              ('crates/noon/tests/glow_scene_raster.rs', 1),
          ):
              p=Path(name); s=p.read_text()
              assert s.count('288.703125')==count
              p.write_text(s.replace('288.703125','18477.0 / 64.0'))
          p=Path('crates/noon-render-wgpu/src/gpu/mod.rs'); s=p.read_text()
          old='restores the default one-logical-unit-per-backing-pixel mapping.'
          assert s.count(old)==1
          p.write_text(s.replace(old,'restores the default mapping of one logical unit per backing pixel.'))
          PY
          git add -N scripts/showcase-glow-viewport.mjs
          mkdir -p projection-fix-evidence
          git diff --binary --full-index > projection-fix-evidence/reviewed.patch
          echo '0b1a1a42b8dc6c7ad331a0fcc6b1a8678cb1fd9eccdaff1087b39ec12de08459  projection-fix-evidence/reviewed.patch' | sha256sum -c -
          git diff --check
          node --check scripts/showcase-glow-viewport.mjs
          node --test scripts/showcase-live-review.test.mjs
      - name: Pin Rust and freeze formatted product source
        run: |
          set -euo pipefail
          rustup install
          rustc --version --verbose | tee projection-fix-evidence/rustc.txt
          cargo fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/noon-render-wgpu/src/gpu/analytic_glow.rs crates/noon-render-wgpu/src/gpu/analytic_glow/tests.rs crates/noon-render-wgpu/src/gpu/glow_filter.rs crates/noon-render-wgpu/src/gpu/glow_filter/tests.rs crates/noon-render-wgpu/src/gpu/mod.rs crates/noon-web/src/execution_canvas.rs crates/noon-web/src/retained_execution_canvas.rs crates/noon/tests/glow_scene_raster.rs scripts/showcase-glow-viewport.mjs scripts/showcase-live-review.mjs
          git commit -m 'fix(glow): separate logical camera projection from physical backing pixels'
          git rev-parse HEAD > projection-fix-evidence/candidate-sha.txt
          git rev-parse HEAD^{tree} > projection-fix-evidence/candidate-tree.txt
          git diff --binary --full-index HEAD^ HEAD > projection-fix-evidence/qualified-source.patch
          git diff --exit-code
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - name: Require existing and new renderer contracts and strict Clippy
        run: |
          set -euo pipefail
          cargo test -p noon-render-wgpu --lib gpu::glow_filter::tests 2>&1 | tee projection-fix-evidence/filter-tests.log
          cargo test -p noon-render-wgpu --lib gpu::analytic_glow::tests 2>&1 | tee projection-fix-evidence/analytic-tests.log
          cargo clippy -p noon-render-wgpu -p noon-web --all-features --all-targets -- -D warnings 2>&1 | tee projection-fix-evidence/clippy.log
      - name: Prepare real software Vulkan raster adapter
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
      - name: Require Gaussian pixels and exact neutral/removal at mismatched viewport sizes
        run: |
          set -euo pipefail
          cargo test -p noon --test glow_scene_raster -- --ignored --exact public_scene_glow_pixels_and_lifecycle --nocapture 2>&1 | tee projection-fix-evidence/public-raster.log
          grep -F 'test result: ok. 1 passed; 0 failed;' projection-fix-evidence/public-raster.log
          test "$(grep -c '^LOGICAL_VIEWPORT_GLOW_PASS' projection-fix-evidence/public-raster.log)" = 2
      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Build existing browser runtime from frozen product source
        env:
          NOON_SKIP_WEB_PREFLIGHT: '1'
          NOON_WASM_PROFILE: dev
          NOON_WASM_SKIP_OPT: '1'
        run: |
          set -euo pipefail
          env -u GITHUB_SHA bash scripts/build-web-demo.sh 2>&1 | tee projection-fix-evidence/wasm-build.log
          git diff --exit-code
          python3 - <<'PY'
          from pathlib import Path
          import json
          identity=json.loads(Path('web/runtime-build-identity.json').read_text())
          assert identity['sourceRevision']==Path('projection-fix-evidence/candidate-sha.txt').read_text().strip()
          Path('projection-fix-evidence/runtime-build-identity.json').write_text(json.dumps(identity,indent=2)+'\n')
          PY
      - name: Install pinned browser tooling
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Require production DOM completion in WebGPU and WebGL
        run: |
          set -euo pipefail
          NOON_SHOWCASE_BACKEND=webgpu node scripts/showcase-glow-viewport.mjs 2>&1 | tee projection-fix-evidence/webgpu.log
          NOON_SHOWCASE_BACKEND=webgl node scripts/showcase-glow-viewport.mjs 2>&1 | tee projection-fix-evidence/webgl.log
          test "$(grep -c '^PASS glow viewport' projection-fix-evidence/webgpu.log)" = 3
          test "$(grep -c '^PASS glow viewport' projection-fix-evidence/webgl.log)" = 3
          git diff --exit-code
      - name: Publish only qualified repair source without overwriting concurrent work
        run: |
          set -euo pipefail
          branch=refs/heads/codex/fix-glow-logical-viewport-e042
          actual=$(git ls-remote origin "$branch" | cut -f1)
          test "$actual" = e042b56060274a1bcf18045ac610a8586509c636
          test "$(git rev-parse HEAD)" = "$(cat projection-fix-evidence/candidate-sha.txt)"
          git merge-base --is-ancestor "$actual" HEAD
          git push origin "HEAD:$branch"
          echo 'Focused Rust, strict Clippy, native pixels and six production DOM cases passed; full PR CI still required' > projection-fix-evidence/result.txt
      - name: Dispatch ordinary exact-source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data '{"ref":"codex/fix-glow-logical-viewport-e042"}' \
            https://api.github.com/repos/yongkyuns/noon/actions/workflows/ci.yml/dispatches
      - name: Preserve all evidence, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: glow-logical-viewport-fix-qualification
          path: |
            projection-fix-evidence/
            browser-smoke-artifacts/showcase/*/production-viewport/
          if-no-files-found: warn
          retention-days: 7
