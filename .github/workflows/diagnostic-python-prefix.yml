name: Diagnostic Python prefix
on:
  push:
    branches: [diagnostic/noon-python-prefix-20261023]
    paths: ['.github/diagnostics/python-prefix*', '.github/workflows/diagnostic-python-prefix.yml']
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Apply exact-base candidate
        run: python3 .github/diagnostics/python-prefix.py apply
      - name: Install pinned Rust
        run: |
          rustup install
          rustc --version --verbose | tee /tmp/python-prefix/rustc.txt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Format and retain candidate
        run: |
          cargo fmt --all
          python3 .github/diagnostics/python-prefix.py save
      - name: Canonical source, Python facade and Rust regression tests
        run: |
          set -o pipefail
          cargo test --locked -p noon-web --all-features --lib interpreter_prefix 2>&1 | tee /tmp/python-prefix/interpreter-tests.log
          cargo test --locked -p noon-web --all-features --lib 2>&1 | tee /tmp/python-prefix/web-tests.log
          cargo test --locked -p noon-web --no-default-features --features prepared-prefix --lib interpreter_prefix 2>&1 | tee /tmp/python-prefix/no-renderer-tests.log
          cargo test --locked -p noon --no-default-features --features prepared-prefix --lib cooperative_source 2>&1 | tee /tmp/python-prefix/source-tests.log
          python3 -m unittest discover -s web/python -p test_prepared_execution.py -v 2>&1 | tee /tmp/python-prefix/python-tests.log
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Build same-context prepared WASM canvas
        run: |
          set -o pipefail
          wasm-pack build crates/noon-web --target web --out-dir ../../web/pkg --dev --no-opt --features prepared-prefix,renderer-smoke --locked 2>&1 | tee /tmp/python-prefix/wasm-build.log
          cargo check --locked -p noon-web --no-default-features --target wasm32-unknown-unknown 2>&1 | tee /tmp/python-prefix/default-disabled.log
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.62.1
      - name: Install pinned Chromium and pixel decoder
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Real Python authoring to historical canvas on both GPU backends
        run: |
          set -o pipefail
          NOON_PREPARED_PYTHON_ARTIFACTS=/tmp/python-prefix/python-browser node scripts/prepared-python-qualification.mjs 2>&1 | tee /tmp/python-prefix/python-browser.log
          NOON_PREPARED_CANVAS_ARTIFACTS=/tmp/python-prefix/canvas node scripts/prepared-canvas-qualification.mjs 2>&1 | tee /tmp/python-prefix/canvas.log
          NOON_PREPARED_SOURCE_ARTIFACTS=/tmp/python-prefix/source-browser node scripts/prepared-source-qualification.mjs 2>&1 | tee /tmp/python-prefix/source-browser.log
      - name: Repository fast gate and workflow topology
        run: |
          set -o pipefail
          node --test .github/ci/*.test.mjs 2>&1 | tee /tmp/python-prefix/topology.log
          bash scripts/check.sh fast HEAD 2>&1 | tee /tmp/python-prefix/fast-gate.log
      - name: Store exact tested blobs without moving product refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/diagnostics/python-prefix.py upload
      - name: Retain source and evidence including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-prefix-qualification
          path: /tmp/python-prefix
          retention-days: 3
          if-no-files-found: warn
