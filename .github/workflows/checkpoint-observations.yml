name: Isolated checkpoint observations
on:
  push:
    branches: [work/1718-checkpoint-observations]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      NOON_SHOWCASE_BACKEND: webgpu
      NOON_WASM_PROFILE: dev
      NOON_WASM_SKIP_OPT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preserve disposable observation and repair recipes
        run: |
          cp .github/proposals/checkpoint-observations.patch .github/proposals/renderer-preparation.patch .github/proposals/glyph-packing-*.patch "$RUNNER_TEMP/"
      - name: Checkout exact PR source without diagnostic workflow files
        uses: actions/checkout@v7
        with:
          ref: a239ea5e25dc6a5f12ca971fd16f8d9afcbd2ef9
          persist-credentials: false
      - name: Apply candidate and retain its exact formatted source
        run: |
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/checkpoint-trigger.txt"
          git apply --check "$RUNNER_TEMP/glyph-packing-callers.patch"
          git apply "$RUNNER_TEMP/glyph-packing-callers.patch"
          git apply --check "$RUNNER_TEMP/glyph-packing-parent.patch" "$RUNNER_TEMP/glyph-packing-child.patch"
          git apply "$RUNNER_TEMP/glyph-packing-parent.patch" "$RUNNER_TEMP/glyph-packing-child.patch"
          rustup install
          rustup target add wasm32-unknown-unknown
          rustfmt --edition 2021 --config skip_children=true crates/noon-render-wgpu/src/text/preparation.rs crates/noon-render-wgpu/src/text/gpu.rs crates/noon-render-wgpu/src/gpu/retained_text.rs crates/noon-render-wgpu/tests/text_live_atlas_pages.rs
          git diff --check
          git diff --binary > "$RUNNER_TEMP/tested-renderer-repair.patch"
          git add crates/noon-render-wgpu
          git -c user.name=Noon-Diagnostic -c user.email=diagnostic@localhost commit -m 'candidate: repack glyph topology without stale masks'
          git rev-parse HEAD > "$RUNNER_TEMP/candidate-checkout.txt"
      - name: Native renderer correctness and locality
        run: |
          set -o pipefail
          cargo test -p noon-render-wgpu --lib 2>&1 | tee "$RUNNER_TEMP/renderer-unit.log"
          cargo test -p noon-render-wgpu --test text_retained_object_update_locality --test retained_scratch_reuse --test text_live_atlas_pages --test glyph_atlas_residency_churn 2>&1 | tee "$RUNNER_TEMP/renderer-locality.log"
          cargo clippy -p noon-render-wgpu --lib -- -D warnings 2>&1 | tee "$RUNNER_TEMP/renderer-clippy.log"
      - name: Add read-only renderer observations to local diagnostic commit
        run: |
          git apply --check "$RUNNER_TEMP/renderer-preparation.patch"
          git apply "$RUNNER_TEMP/renderer-preparation.patch"
          git add crates/noon-web/src/retained_execution_canvas.rs
          git -c user.name=Noon-Diagnostic -c user.email=diagnostic@localhost commit -m 'diagnostic: inspect prepared renderer state'
          git rev-parse HEAD > "$RUNNER_TEMP/checkpoint-checkout.txt"
      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: wasm-pack@0.15.0
      - name: Build exact candidate with the normal entrypoint
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          bash scripts/build-web-demo.sh
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; import {execFileSync} from "node:child_process"; const identity=JSON.parse(fs.readFileSync("web/runtime-build-identity.json")); assert.equal(identity.sourceRevision,execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim());'
      - name: Install repository-pinned capture tools
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Add read-only JS observations in this disposable checkout
        run: |
          git apply --check "$RUNNER_TEMP/checkpoint-observations.patch"
          git apply "$RUNNER_TEMP/checkpoint-observations.patch"
          node --check web/main.js
          node --check scripts/showcase-capture.mjs
          node --check scripts/showcase-live-review.mjs
      - name: Record forward source execution and effective state
        id: capture
        run: node scripts/showcase-capture.mjs
      - name: Record actual retained replay and effective state
        if: ${{ !cancelled() && (steps.capture.outcome == 'success' || steps.capture.outcome == 'failure') }}
        run: node scripts/showcase-live-review.mjs
      - name: Retain failed comparisons and exact tested source
        if: always()
        run: |
          out=browser-smoke-artifacts/showcase/webgpu/diagnostic-source
          mkdir -p "$out"
          git diff a239ea5e25dc6a5f12ca971fd16f8d9afcbd2ef9 --binary > "$out/instrumentation.patch"
          for file in "$RUNNER_TEMP/"*.patch "$RUNNER_TEMP/"*checkout.txt "$RUNNER_TEMP/checkpoint-trigger.txt" "$RUNNER_TEMP/"renderer-*.log; do
            if test -f "$file"; then cp "$file" "$out/"; fi
          done
          for file in web/main.js scripts/showcase-capture.mjs scripts/showcase-live-review.mjs crates/noon-web/src/retained_execution_canvas.rs crates/noon-render-wgpu/src/text/preparation.rs crates/noon-render-wgpu/src/text/gpu.rs crates/noon-render-wgpu/src/gpu/retained_text.rs crates/noon-render-wgpu/tests/text_live_atlas_pages.rs; do
            mkdir -p "$out/$(dirname "$file")"
            cp "$file" "$out/$file"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: checkpoint-observations
          path: browser-smoke-artifacts/showcase/webgpu
          retention-days: 7
