name: M1 Python glow worker qualification (temporary)
on:
  push:
    branches: [codex/m1-python-worker-qual-168a]
    paths: [.github/workflows/m1-python-glow-qualification.yml]
permissions:
  contents: read
concurrency:
  group: m1-python-worker-qual-168a
  cancel-in-progress: true
jobs:
  python-glow:
    name: Public Python Scene worker and halo pixels
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_DIR: /home/runner/.cache/noon-sccache-wasm
      SCCACHE_CACHE_SIZE: "1G"
      SCCACHE_LOCAL_RW_MODE: "READ_ONLY"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prove unchanged product source
        run: |
          test "$(git rev-parse HEAD^)" = 168a6c81da3505063a7bfe13b442b6fc492111d3
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/m1-python-glow-qualification.yml
          node --check scripts/shared-authoring-smoke.mjs
          python3 - <<'PY'
          from pathlib import Path
          compile(Path("web/python/examples/glow_scene_worker_pixels.py").read_bytes(), "glow_scene_worker_pixels.py", "exec")
          PY
      - name: Build exact Rust/WASM and Pyodide execution package
        uses: ./.github/actions/dev-wasm-build
        with:
          preflight: "true"
      - name: Cache Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.62.1
      - name: Install pinned browser qualification dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Execute public Python and independent worker halo pixel test
        run: node scripts/shared-authoring-smoke.mjs
