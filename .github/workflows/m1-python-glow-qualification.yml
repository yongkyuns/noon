name: M1 exact-head glow CI dispatch (temporary)
on:
  push:
    branches: [codex/m1-python-worker-qual-168a]
    paths: [.github/workflows/m1-python-glow-qualification.yml]
permissions:
  contents: read
  actions: write
concurrency:
  group: m1-python-worker-qual-168a
  cancel-in-progress: true
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact published PR head and launch canonical CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected=28ef95accb372ec4176e584511e712bbcb6c09bb
          actual=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            https://api.github.com/repos/yongkyuns/noon/git/refs/heads/codex/m1-glow-raster-operator | jq -r '.object.sha')
          test "$actual" = "$expected"
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"codex/m1-glow-raster-operator"}' \
            https://api.github.com/repos/yongkyuns/noon/actions/workflows/ci.yml/dispatches
          echo "Dispatched canonical CI for $expected"
