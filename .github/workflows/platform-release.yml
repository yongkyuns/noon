name: Platform and release validation

on:
  push:
    branches:
      - master
    paths:
      - Cargo.toml
      - Cargo.lock
      - 'crates/**'
      - '!crates/**/tests/**'
      - 'scripts/build-web-demo.sh'
      - 'scripts/build-python-worker.mjs'
      - 'scripts/build-runtime-identity.mjs'
      - 'scripts/check-web-package.mjs'
      - 'scripts/deterministic-replay-smoke.mjs'
      - 'web/**'
      - '.github/ci/wasm-build.mjs'
      - '.github/ci/optimized-replay-artifact.mjs'
      - '.github/workflows/platform-release.yml'
  pull_request:
    paths:
      - 'crates/noon-web/Cargo.toml'
      - 'crates/noon-web/src/determinism.rs'
      - 'scripts/build-web-demo.sh'
      - 'scripts/build-python-worker.mjs'
      - 'scripts/build-runtime-identity.mjs'
      - 'scripts/check-web-package.mjs'
      - 'scripts/deterministic-replay-smoke.mjs'
      - '.github/ci/wasm-build.mjs'
      - '.github/ci/optimized-replay-artifact.mjs'
      - 'web/optimized-replay-contract.test.mjs'
      - 'web/runtime-build-verifier.js'
      - '.github/workflows/platform-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-platform:
    if: github.event_name != 'pull_request'
    name: Native ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use repository-pinned Rust
        run: |
          rustup install
          rustup show active-toolchain
          rustc --version --verbose
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-platform-cargo-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-platform-cargo-
      - name: Compile and test native workspace
        run: cargo test --workspace --all-features --lib --tests

  release-native:
    if: github.event_name != 'pull_request'
    name: Native release-mode core
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use repository-pinned Rust
        run: |
          rustup install
          rustup show active-toolchain
          rustc --version --verbose
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-cargo-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml') }}
          restore-keys: |
            release-cargo-
      - name: Test core execution crates in release mode
        run: cargo test --release -p noon-core -p noon-geometry -p noon-runtime --all-features

  optimized-wasm:
    name: Optimized production and replay packages
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: '0'
      NOON_WASM_PROFILE: 'release'
      NOON_WASM_SKIP_OPT: '0'
      NOON_RENDERER_SMOKE: '0'
      NOON_REPLAY_SMOKE: '0'
      BINARYEN_VERSION: '132'
      BINARYEN_LINUX_SHA256: '195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use repository-pinned Rust and WASM target
        run: |
          rustup install
          rustup show active-toolchain
          rustc --version --verbose
          rustup target add wasm32-unknown-unknown
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: optimized-wasm-cargo-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml') }}
          restore-keys: |
            optimized-wasm-cargo-
      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Install pinned wasm-opt
        shell: bash
        run: |
          archive="binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          url="https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/${archive}"
          curl --fail --location --retry 3 --retry-all-errors --output "$RUNNER_TEMP/$archive" "$url"
          echo "${BINARYEN_LINUX_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          binaryen_dir="$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}"
          echo "$binaryen_dir/bin" >> "$GITHUB_PATH"
          "$binaryen_dir/bin/wasm-opt" --version
      - name: Test optimized replay build contract
        run: node --test web/optimized-replay-contract.test.mjs .github/ci/wasm-build.test.mjs
      - name: Resolve one dependency lock for both packages
        run: cargo generate-lockfile
      - name: Build and validate optimized browser package
        run: |
          node .github/ci/optimized-replay-artifact.mjs prepare production .
          bash scripts/build-web-demo.sh
          node .github/ci/optimized-replay-artifact.mjs stamp production .
      - name: Record optimized WASM size
        shell: bash
        run: |
          test -s web/pkg/noon_web_bg.wasm
          bytes="$(wc -c < web/pkg/noon_web_bg.wasm | tr -d ' ')"
          echo "Optimized WASM bytes: ${bytes}"
          {
            echo '### Optimized browser artifact'
            echo
            echo "- noon_web_bg.wasm: ${bytes} bytes"
            echo '- wasm-pack: 0.15.0'
            echo "- Binaryen/wasm-opt: version ${BINARYEN_VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"
      # Retain production before replacing web/pkg with the diagnostic build.
      - name: Upload optimized production package
        uses: actions/upload-artifact@v7
        with:
          name: optimized-web-pkg
          path: |
            web/pkg
            web/python-worker.js
            web/runtime-build-identity.json
            web/python/compat-bundle.*.json
            web/ci-artifact.json
            web/ci-Cargo.lock
          if-no-files-found: error
          retention-days: 3
      - name: Build optimized replay qualification package
        env:
          NOON_SKIP_WEB_PREFLIGHT: '1'
          NOON_REPLAY_SMOKE: '1'
        run: |
          node .github/ci/optimized-replay-artifact.mjs prepare replay .
          bash scripts/build-web-demo.sh
          node .github/ci/optimized-replay-artifact.mjs stamp replay .
      - name: Upload optimized replay qualification package
        uses: actions/upload-artifact@v7
        with:
          name: optimized-replay-pkg
          path: |
            web/pkg
            web/python-worker.js
            web/runtime-build-identity.json
            web/python/compat-bundle.*.json
            web/ci-artifact.json
            web/ci-Cargo.lock
          if-no-files-found: error
          retention-days: 3

  optimized-replay:
    name: Optimized typed replay in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: optimized-wasm
    steps:
      - name: Checkout exact workflow source
        uses: actions/checkout@v7
      - name: Download optimized replay qualification package
        uses: actions/download-artifact@v8
        with:
          name: optimized-replay-pkg
          path: web
      - name: Verify source and replay artifact provenance
        run: node .github/ci/optimized-replay-artifact.mjs verify replay .
      - name: Install Chromium smoke dependency
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install chromium
      - name: Exercise optimized typed replay in Chromium
        run: node scripts/deterministic-replay-smoke.mjs
