name: M1 workspace snapshot (temporary)
on:
  push:
    branches: [codex/m1-source-snapshot]
    paths: [.github/workflows/m1-workspace-snapshot.yml]
permissions:
  contents: read
concurrency:
  group: m1-workspace-snapshot
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: abdd85832696ae3ad2b4283c01444aed67415c21
          persist-credentials: false
      - name: Prepare exact source snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/m1-snapshot"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/m1-snapshot/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/m1-snapshot/source-head.txt"
      - name: Install pinned Rust and fetch dependencies
        run: |
          rustup install --profile minimal
          rustup component add rustfmt clippy
          if test -f Cargo.lock; then cargo fetch --locked; else cargo fetch; fi
          cp Cargo.lock "$RUNNER_TEMP/m1-snapshot/Cargo.lock"
          rustc --version --verbose > "$RUNNER_TEMP/m1-snapshot/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/m1-snapshot/cargo-version.txt"
          tc=$(rustup show active-toolchain | cut -d ' ' -f 1)
          tar -C "$HOME/.rustup/toolchains" -czf "$RUNNER_TEMP/m1-snapshot/toolchain.tar.gz" "$tc"
          tar -C "$HOME/.cargo" -czf "$RUNNER_TEMP/m1-snapshot/cargo-sources.tar.gz" registry
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m1-workspace-snapshot
          path: ${{ runner.temp }}/m1-snapshot/
          if-no-files-found: error
          retention-days: 1
