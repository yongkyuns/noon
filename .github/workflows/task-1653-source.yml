name: Task 1653 implementation validation (do not merge)
on:
  push:
    branches: [task/1653-renderer-source-audit]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
      TASK_ASSETS: /tmp/task-1653-assets
      BASE_SHA: 886ede3e2243d621cda5823b30a7911f4e382417
      CANDIDATE_SHA: 1eeba8dc549ba373b1b12e5274b1c015d3e8e2a8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Apply submission-only revision on the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          cp -R .github/task-1653-assets "$TASK_ASSETS"
          cp .github/task-1653-apply-v2.py /tmp/task-1653-apply-v2.py
          git fetch --no-tags --depth=3 origin "$CANDIDATE_SHA"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git checkout --detach "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python /tmp/task-1653-apply-v2.py
      - name: Use repository-pinned Rust
        run: rustup install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Format and stage clean revision for connector publication
        id: publish
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {'crates/noon-render-wgpu/src/lib.rs', 'crates/noon-render-wgpu/src/render_order.rs', 'crates/noon-render-wgpu/src/path_residency.rs', 'crates/noon-render-wgpu/src/mega_mesh.rs', 'crates/noon-render-wgpu/src/gpu/mod.rs', 'crates/noon-render-wgpu/src/gpu/retained_text.rs', 'crates/noon-render-wgpu/src/gpu/derived_display.rs', 'docs/architecture.md'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == expected, changed
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/noon-render-wgpu/src docs/architecture.md
          git commit -m 'Preserve invisible painter anchors and suppress only GPU submission with dirty-row indexes'
          git push origin HEAD:refs/heads/task/1653-submission-candidate
          git rev-parse HEAD | tee /tmp/task-1653-head.txt
          git diff "$BASE_SHA" HEAD > /tmp/task-1653-candidate.patch
      - name: Focused zero-contribution regressions
        id: focused
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: cargo test -p noon-render-wgpu --all-features --lib zero_contribution -- --nocapture 2>&1 | tee /tmp/task-1653-focused.log
      - name: Verify prior candidate fails new transient-anchor regression
        id: anchor_control
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'git restore --source=HEAD -- crates/noon-render-wgpu/src' EXIT
          git restore --source="$CANDIDATE_SHA" -- crates/noon-render-wgpu/src
          python - <<'PY'
          from pathlib import Path
          import os
          test = (Path(os.environ['TASK_ASSETS']) / 'transient-test.rs').read_text()
          p = Path('crates/noon-render-wgpu/src/gpu/derived_display.rs')
          s = p.read_text()
          marker = '#[cfg(test)]\nmod tests {\n'
          assert s.count(marker) == 1
          p.write_text(s.replace(marker, marker + test + '\n', 1))
          PY
          set +e
          cargo test -p noon-render-wgpu --all-features --lib zero_contribution_hidden_transient_anchor -- --nocapture > /tmp/task-1653-anchor-control.log 2>&1
          status=$?
          set -e
          cat /tmp/task-1653-anchor-control.log
          test "$status" = 101
          grep -F 'test result: FAILED. 0 passed; 1 failed;' /tmp/task-1653-anchor-control.log
          grep -F 'transient presentation anchor could not be located in retained painter batches' /tmp/task-1653-anchor-control.log
      - name: Renderer unit and integration suite
        id: renderer
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: cargo test -p noon-render-wgpu --all-features --no-fail-fast 2>&1 | tee /tmp/task-1653-renderer.log
      - name: Install software Vulkan
        id: vulkan
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Real software Vulkan pixel equality and restoration
        id: raster
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: cargo test -p noon-render-wgpu --all-features --test secondary_viewport zero_contribution -- --include-ignored --nocapture --test-threads=1 2>&1 | tee /tmp/task-1653-raster.log
      - name: Verify original renderer submits the invisible camera
        id: baseline_control
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'git restore --source=HEAD -- crates/noon-render-wgpu/src' EXIT
          git restore --source="$BASE_SHA" -- crates/noon-render-wgpu/src
          set +e
          cargo test -p noon-render-wgpu --all-features --test secondary_viewport zero_contribution -- --include-ignored --nocapture --test-threads=1 > /tmp/task-1653-baseline-control.log 2>&1
          status=$?
          set -e
          cat /tmp/task-1653-baseline-control.log
          test "$status" = 101
          grep -F 'test result: FAILED. 0 passed; 1 failed;' /tmp/task-1653-baseline-control.log
          grep -F 'left: 2' /tmp/task-1653-baseline-control.log
          grep -F 'right: 1' /tmp/task-1653-baseline-control.log
      - name: Renderer lint
        id: lint
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: cargo clippy -p noon-render-wgpu --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/task-1653-lint.log
      - name: Record qualification outcomes
        if: always()
        env:
          OUTCOMES: ${{ toJSON(steps) }}
        run: |
          printf '%s\n' "$OUTCOMES" > /tmp/task-1653-outcomes.json
          git status --porcelain > /tmp/task-1653-final-status.txt
      - name: Archive implementation and regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task-1653-submission-evidence
          path: |
            /tmp/task-1653-head.txt
            /tmp/task-1653-candidate.patch
            /tmp/task-1653-*.log
            /tmp/task-1653-outcomes.json
            /tmp/task-1653-final-status.txt
          retention-days: 7
          if-no-files-found: warn
