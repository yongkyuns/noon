name: Demo editor candidate
on:
  push:
    branches: [prep/demo-editor-publish]
    paths:
      - .github/workflows/demo-editor-candidate.yml
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: staging
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 1f0501b3c12f6c252125bdf1f00ff746280ed8a9
          path: candidate
      - name: Verify exact correction and web tests
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          git apply --check ../staging/.demo-editor-staging/freshness.patch
          git apply ../staging/.demo-editor-staging/freshness.patch
          git add web
          test "$(git write-tree)" = 11d1ffe7d0aaa8ab52964250efbaa75bcbfcc745
          git diff --cached --check
          node --check web/main.js
          node --check web/playground-source-restart.js
          node --check web/playground-run-request-router.js
          node --test web/*.test.mjs > "$RUNNER_TEMP/demo-editor-unit-tests.log" 2>&1
          tail -12 "$RUNNER_TEMP/demo-editor-unit-tests.log"
      - name: Publish clean correction
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Guard queued source restarts against newer edits and disposal'
          branch="prep/demo-editor-candidate-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$branch"
          printf '%s\n' "$(git rev-parse HEAD)" "$branch" > "$RUNNER_TEMP/demo-editor-candidate.txt"
          git show --stat --oneline HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-editor-candidate-evidence
          path: |
            ${{ runner.temp }}/demo-editor-candidate.txt
            ${{ runner.temp }}/demo-editor-unit-tests.log
          retention-days: 3
