name: Playground Product Gate

on:
  pull_request:
    paths:
      - ".github/workflows/playground-product-gate.yml"
      - "skills/noon-authoring/**"
      - "scripts/noon-capabilities.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/noon/**"
      - "crates/noon-core/**"
      - "crates/noon-compile/**"
      - "crates/noon-runtime/**"
      - "crates/noon-web/**"
      - "crates/noon-render-wgpu/**"
      - "crates/noon-text/**"
      - "scripts/build-web-demo.sh"
      - "scripts/build-python-worker.mjs"
      - "scripts/manim-tutorial-smoke.mjs"
      - "scripts/playground-layout-smoke.mjs"
      - "scripts/playground-product-e2e.mjs"
      - "scripts/playground-product-compare.mjs"
      - "scripts/renderer-init-failure-smoke.mjs"
      - "scripts/retained-text-animation-smoke.mjs"
      - "web/**"

permissions:
  contents: read

concurrency:
  group: playground-product-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    name: Runtime, visual, latency, and FPS regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      # Reuse dependency compilations between two fresh builds at one stable path.
      # The cache lives only in this job; no executable or cross-PR seed is restored.
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_DIR: ${{ github.workspace }}/.product-sccache
      SCCACHE_CACHE_SIZE: "1G"
      SCCACHE_LOCAL_RW_MODE: "READ_WRITE"
      NOON_SKIP_WEB_PREFLIGHT: "1"
      NOON_WASM_PROFILE: "release"
      NOON_WASM_SKIP_OPT: "1"
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          path: candidate

      - name: Checkout PR base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Use each checkout's pinned Rust and WASM target
        run: |
          for noon_checkout in baseline candidate; do
            (
              cd "$noon_checkout"
              rustup show active-toolchain
              rustup target add wasm32-unknown-unknown
            )
          done

      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('candidate/Cargo.toml', 'candidate/crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-

      - name: Use pinned sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Build baseline production package
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.product-target
        run: |
          # Rust cache keys include cwd and CARGO_TARGET_DIR. Keep both stable,
          # but discard all Cargo fingerprints/artifacts before each source build.
          mv baseline .product-source
          trap 'mv .product-source baseline' EXIT
          rm -rf .product-target
          sccache --zero-stats
          noon_build_started=$SECONDS
          (cd .product-source && bash scripts/build-web-demo.sh)
          printf 'Baseline release build: %s seconds.\n' "$((SECONDS - noon_build_started))" >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats

      - name: Build candidate production package
        env:
          # Compiler results are content-keyed; Cargo outputs are never reused.
          CARGO_TARGET_DIR: ${{ github.workspace }}/.product-target
          # Exercise release code with only the typed recovery fixture exported.
          NOON_RENDERER_SMOKE: "1"
        run: |
          mv candidate .product-source
          trap 'mv .product-source candidate' EXIT
          rm -rf .product-target
          sccache --zero-stats
          noon_build_started=$SECONDS
          (cd .product-source && bash scripts/build-web-demo.sh)
          printf 'Candidate release build: %s seconds.\n' "$((SECONDS - noon_build_started))" >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats

      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.62.1

      - name: Install browser measurement dependencies
        working-directory: candidate
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium

      - name: Recheck executable tutorial corpus
        working-directory: candidate
        run: node scripts/manim-tutorial-smoke.mjs

      - name: Recheck retained Text animation
        working-directory: candidate
        run: node scripts/retained-text-animation-smoke.mjs

      - name: Recheck playground layout and Reset
        working-directory: candidate
        run: node scripts/playground-layout-smoke.mjs

      - name: Recheck release renderer initialization
        working-directory: candidate
        env:
          NOON_RENDERER_FAILURE_ARTIFACTS: browser-smoke-artifacts/product-gate/renderer-init
        run: node scripts/renderer-init-failure-smoke.mjs

      - name: Measure baseline playground
        id: baseline-product
        continue-on-error: true
        working-directory: candidate
        env:
          NOON_PRODUCT_SITE_ROOT: ${{ github.workspace }}/baseline
          NOON_PRODUCT_PORT: "4205"
          NOON_PRODUCT_LABEL: baseline
          NOON_PRODUCT_ARTIFACT_DIR: ${{ github.workspace }}/candidate/browser-smoke-artifacts/product-gate/baseline
        run: node scripts/playground-product-e2e.mjs

      - name: Measure candidate playground
        working-directory: candidate
        env:
          NOON_PRODUCT_SITE_ROOT: ${{ github.workspace }}/candidate
          NOON_PRODUCT_PORT: "4206"
          NOON_PRODUCT_LABEL: candidate
          NOON_PRODUCT_ARTIFACT_DIR: ${{ github.workspace }}/candidate/browser-smoke-artifacts/product-gate/candidate
        run: node scripts/playground-product-e2e.mjs

      - name: Compare product behavior
        if: steps.baseline-product.outcome == 'success'
        working-directory: candidate
        env:
          NOON_PRODUCT_MAX_LATENCY_RATIO: "1.25"
          NOON_PRODUCT_LATENCY_SLACK_MS: "350"
          NOON_PRODUCT_MIN_FPS_RATIO: "0.80"
          NOON_PRODUCT_MAX_VISUAL_DIFF_RATIO: "0.015"
        run: |
          node scripts/playground-product-compare.mjs \
            browser-smoke-artifacts/product-gate/baseline \
            browser-smoke-artifacts/product-gate/candidate

      - name: Explain unavailable baseline comparison
        if: steps.baseline-product.outcome != 'success'
        run: |
          echo "::notice title=Product baseline unavailable::The current PR base does not complete the product E2E flow. Candidate functionality is still required; relative visual/latency/FPS comparison will begin once this repair reaches master."

      - name: Upload product regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playground-product-${{ github.event.pull_request.number }}
          path: candidate/browser-smoke-artifacts/product-gate
          if-no-files-found: error
          retention-days: 14
