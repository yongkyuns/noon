name: Playground Product Gate

on:
  pull_request:
    paths:
      - ".github/workflows/playground-product-gate.yml"
      - ".github/ci/**"
      - ".github/actions/install-wasm-opt/action.yml"
      - "skills/noon-authoring/**"
      - "scripts/noon-capabilities.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/noon/**"
      - "crates/noon-core/**"
      - "crates/noon-compile/**"
      - "crates/noon-runtime/**"
      - "crates/noon-web/**"
      - "crates/noon-render-wgpu/**"
      - "crates/noon-text/**"
      - "scripts/build-web-demo.sh"
      - "scripts/build-python-worker.mjs"
      - "scripts/build-runtime-identity.mjs"
      - "scripts/manim-tutorial-smoke.mjs"
      - "scripts/playground-layout-smoke.mjs"
      - "scripts/playground-product-e2e.mjs"
      - "scripts/playground-product-fps.mjs"
      - "scripts/playground-product-fps.test.mjs"
      - "scripts/python-host-perf*.mjs"
      - "scripts/paired-product-metrics*.mjs"
      - "scripts/playground-product-compare.mjs"
      - "scripts/renderer-init-failure-smoke.mjs"
      - "scripts/retained-text-animation-smoke.mjs"
      - "web/**"

permissions:
  contents: read

concurrency:
  group: playground-product-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build product comparison packages
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      baseline-sha: ${{ steps.comparison-base.outputs.base-sha }}
      baseline-artifact: ${{ steps.baseline-artifact.outputs.artifact-id }}
      candidate-artifact: ${{ steps.candidate-artifact.outputs.artifact-id }}
      candidate-fixture-artifact: ${{ steps.candidate-fixture-artifact.outputs.artifact-id }}
    env:
      NOON_PRODUCT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      # Reuse dependency compilations between three fresh builds at one stable path.
      # The cache lives only in this job; no executable or cross-PR seed is restored.
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_DIR: ${{ github.workspace }}/.product-sccache
      SCCACHE_CACHE_SIZE: "1G"
      SCCACHE_LOCAL_RW_MODE: "READ_WRITE"
      NOON_SKIP_WEB_PREFLIGHT: "1"
      NOON_WASM_PROFILE: "release"
      NOON_WASM_SKIP_OPT: "0"
      NOON_RENDERER_SMOKE: "0"
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          path: candidate
          fetch-depth: 2

      - name: Resolve the baseline actually included in the tested merge
        id: comparison-base
        env:
          NOON_CANDIDATE_SHA: ${{ github.sha }}
        run: |
          node candidate/.github/ci/product-baseline.mjs candidate "$NOON_CANDIDATE_SHA" "$NOON_PRODUCT_HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Export the immutable comparison baseline
        env:
          NOON_MATCHED_BASE_SHA: ${{ steps.comparison-base.outputs.base-sha }}
        run: echo "NOON_PRODUCT_BASE_SHA=$NOON_MATCHED_BASE_SHA" >> "$GITHUB_ENV"

      - name: Checkout PR base
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.comparison-base.outputs.base-sha }}
          path: baseline

      - name: Test CI artifact contracts
        working-directory: candidate
        run: node --test .github/ci/*.test.mjs

      - name: Use each checkout's pinned Rust and WASM target
        run: |
          for noon_checkout in baseline candidate; do
            (
              cd "$noon_checkout"
              rustup install
              rustup show active-toolchain
              rustup target add wasm32-unknown-unknown
            )
          done

      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('candidate/Cargo.toml', 'candidate/crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-

      - name: Use pinned sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Install pinned wasm-opt
        uses: ./candidate/.github/actions/install-wasm-opt

      - name: Build baseline production package
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.product-target
        run: |
          # Rust cache keys include cwd and CARGO_TARGET_DIR. Keep both stable,
          # but discard all Cargo fingerprints/artifacts before each source build.
          (cd baseline && cargo generate-lockfile)
          node candidate/.github/ci/product-artifact.mjs prepare baseline baseline
          mv baseline .product-source
          trap 'mv .product-source baseline' EXIT
          rm -rf .product-target
          sccache --zero-stats
          noon_build_started=$SECONDS
          (cd .product-source && bash scripts/build-web-demo.sh)
          printf 'Baseline release build: %s seconds.\n' "$((SECONDS - noon_build_started))" >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats
          node candidate/.github/ci/product-artifact.mjs stamp baseline .product-source

      - name: Build candidate renderer-smoke fixture package
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.product-target
          NOON_RENDERER_SMOKE: "1"
        run: |
          (cd candidate && cargo generate-lockfile)
          node candidate/.github/ci/product-artifact.mjs prepare candidate-fixture candidate
          mv candidate .product-source
          trap 'mv .product-source candidate' EXIT
          rm -rf .product-target
          sccache --zero-stats
          noon_build_started=$SECONDS
          (cd .product-source && bash scripts/build-web-demo.sh)
          printf 'Candidate renderer-smoke release build: %s seconds.\n' "$((SECONDS - noon_build_started))" >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats
          node .product-source/.github/ci/product-artifact.mjs stamp candidate-fixture .product-source

      - name: Upload candidate renderer-smoke package
        id: candidate-fixture-artifact
        uses: actions/upload-artifact@v7
        with:
          name: product-candidate-fixture-${{ github.run_attempt }}
          path: |
            candidate/web/pkg
            candidate/web/python-worker.js
            candidate/web/runtime-build-identity.json
            candidate/web/python/compat-bundle.*.json
            candidate/web/ci-artifact.json
            candidate/web/ci-Cargo.lock
          if-no-files-found: error
          retention-days: 14

      - name: Build candidate production package
        env:
          # Compiler results are content-keyed; Cargo outputs are never reused.
          CARGO_TARGET_DIR: ${{ github.workspace }}/.product-target
        run: |
          node candidate/.github/ci/product-artifact.mjs prepare candidate candidate
          mv candidate .product-source
          trap 'mv .product-source candidate' EXIT
          rm -rf .product-target
          sccache --zero-stats
          noon_build_started=$SECONDS
          (cd .product-source && bash scripts/build-web-demo.sh)
          printf 'Candidate release build: %s seconds.\n' "$((SECONDS - noon_build_started))" >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats
          node .product-source/.github/ci/product-artifact.mjs stamp candidate .product-source

      - name: Upload candidate production package
        id: candidate-artifact
        uses: actions/upload-artifact@v7
        with:
          name: product-candidate-${{ github.run_attempt }}
          path: |
            candidate/web/pkg
            candidate/web/python-worker.js
            candidate/web/runtime-build-identity.json
            candidate/web/python/compat-bundle.*.json
            candidate/web/ci-artifact.json
            candidate/web/ci-Cargo.lock
          if-no-files-found: error
          retention-days: 14

      - name: Upload baseline production package
        id: baseline-artifact
        uses: actions/upload-artifact@v7
        with:
          name: product-baseline-${{ github.run_attempt }}
          path: |
            baseline/web/pkg
            baseline/web/python-worker.js
            baseline/web/runtime-build-identity.json
            baseline/web/python/compat-bundle.*.json
            baseline/web/ci-artifact.json
            baseline/web/ci-Cargo.lock
          if-no-files-found: error
          retention-days: 14

  compare:
    # Preserve the required check name. Retrying this job reuses the successful
    # producer's exact artifact IDs, including when its run attempt is older.
    name: Runtime, visual, latency, and FPS regression
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOON_PRODUCT_BASE_SHA: ${{ needs.build.outputs.baseline-sha }}
      NOON_WASM_PROFILE: "release"
      NOON_WASM_SKIP_OPT: "0"
      NOON_RENDERER_SMOKE: "0"
    steps:
      - name: Require successful production builds
        env:
          NOON_PRODUCT_BUILD_RESULT: ${{ needs.build.result }}
        run: test "$NOON_PRODUCT_BUILD_RESULT" = success

      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          path: candidate

      - name: Checkout PR base
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.baseline-sha }}
          path: baseline

      - name: Download baseline production package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.baseline-artifact }}
          path: baseline/web

      - name: Download candidate production package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.candidate-artifact }}
          path: candidate/web

      - name: Download candidate renderer-smoke fixture package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.candidate-fixture-artifact }}
          path: candidate-fixture

      - name: Verify source, configuration and package contents
        run: |
          node candidate/.github/ci/product-artifact.mjs verify baseline baseline
          node candidate/.github/ci/product-artifact.mjs verify candidate candidate

      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.62.1

      - name: Install browser measurement dependencies
        working-directory: candidate
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium

      - name: Test fixed-work performance controls
        working-directory: candidate
        run: node --test scripts/python-host-perf*.test.mjs

      - name: Test product comparison with PNG controls
        working-directory: candidate
        env:
          NOON_PRODUCT_IMAGE_TESTS: "1"
        run: node --test scripts/paired-product-metrics.test.mjs web/playground-product-compare-validation.test.mjs

      - name: Recheck executable tutorial corpus
        working-directory: candidate
        run: node scripts/manim-tutorial-smoke.mjs

      - name: Recheck retained Text animation
        working-directory: candidate
        run: node scripts/retained-text-animation-smoke.mjs

      - name: Recheck playground layout and Reset
        working-directory: candidate
        run: node scripts/playground-layout-smoke.mjs

      - name: Recheck release renderer initialization
        working-directory: candidate
        env:
          NOON_RENDERER_SMOKE: "1"
          NOON_RENDERER_FAILURE_ARTIFACTS: browser-smoke-artifacts/product-gate/renderer-init
        run: |
          rm -rf web/pkg
          rm -f web/python-worker.js web/runtime-build-identity.json web/ci-artifact.json web/ci-Cargo.lock
          rm -f web/python/compat-bundle.*.json
          cp -a ../candidate-fixture/. web/
          node .github/ci/product-artifact.mjs verify candidate-fixture .
          node scripts/renderer-init-failure-smoke.mjs

      - name: Clear renderer-smoke package before restoring production
        working-directory: candidate
        run: |
          rm -rf web/pkg
          rm -f web/python-worker.js web/runtime-build-identity.json web/ci-artifact.json web/ci-Cargo.lock
          rm -f web/python/compat-bundle.*.json

      - name: Restore candidate production package for benchmark
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.candidate-artifact }}
          path: candidate/web

      - name: Reverify candidate production package
        id: production-verified
        working-directory: candidate
        run: node .github/ci/product-artifact.mjs verify candidate .

      - name: Measure three alternating product pairs
        working-directory: candidate
        env:
          NOON_PRODUCT_WORKSPACE: ${{ github.workspace }}
        run: |
          # Fixed before measurement: B/C, C/B, B/C. Every run is retained;
          # a failed run fails the cohort rather than selecting another sample.
          # Reuse the exact same two packages for both existing gallery lessons.
          for noon_example in parity-square-and-circle showcase-camera-follows-path; do
            noon_evidence="browser-smoke-artifacts/product-gate"
            if [[ "$noon_example" == showcase-camera-follows-path ]]; then noon_evidence="$noon_evidence/camera"; fi
            for noon_pair in 1 2 3 4 5 6 7; do
              noon_order="baseline candidate"
              if (( noon_pair % 2 == 0 )); then noon_order="candidate baseline"; fi
              noon_position=0
              for noon_side in $noon_order; do
                noon_position=$((noon_position + 1))
                NOON_PRODUCT_SITE_ROOT="$NOON_PRODUCT_WORKSPACE/$noon_side" \
                NOON_PRODUCT_PORT=4205 \
                NOON_PRODUCT_EXAMPLE="$noon_example" \
                NOON_PRODUCT_LABEL="$noon_side" \
                NOON_PRODUCT_PAIR_INDEX="$noon_pair" \
                NOON_PRODUCT_PAIR_POSITION="$noon_position" \
                NOON_PRODUCT_ARTIFACT_DIR="$noon_evidence/$noon_side/trial-$noon_pair" \
                  node scripts/playground-product-e2e.mjs
              done
            done
          done

      - name: Compare product behavior
        working-directory: candidate
        env:
          NOON_PRODUCT_MAX_LATENCY_RATIO: "1.25"
          NOON_PRODUCT_LATENCY_SLACK_MS: "350"
          NOON_PRODUCT_MIN_FPS_RATIO: "0.80"
          NOON_PRODUCT_STRICT_MIN_FPS_RATIO: "0.97"
          NOON_PRODUCT_MAX_VISUAL_DIFF_RATIO: "0.015"
        run: |
          node scripts/playground-product-compare.mjs \
            browser-smoke-artifacts/product-gate/baseline \
            browser-smoke-artifacts/product-gate/candidate --pairs 7
          node scripts/playground-product-compare.mjs \
            browser-smoke-artifacts/product-gate/camera/baseline \
            browser-smoke-artifacts/product-gate/camera/candidate --pairs 7

      - name: Measure fixed-work Python host overhead on matched packages
        if: ${{ !cancelled() && steps.production-verified.outcome == 'success' }}
        working-directory: candidate
        env:
          NOON_PERF_BASELINE_ROOT: ${{ github.workspace }}/baseline
          NOON_PERF_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
        run: node scripts/python-host-perf.mjs

      - name: Upload product regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playground-product-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: candidate/browser-smoke-artifacts/product-gate
          if-no-files-found: error
          retention-days: 14
