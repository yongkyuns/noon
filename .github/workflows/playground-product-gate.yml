name: PR 1882 original-package performance control
# Diagnostic only, owned by #1653. Do not merge into the qualified #1882 branch.
# Original ZIPs and source checkouts are immutable; no compiler or rebuild runs.

on:
  pull_request:
    paths:
      - '.github/workflows/playground-product-gate.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: pr1882-original-packages-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  original-packages:
    name: Diagnostic original-binary AB and AA controls
    if: github.repository == 'yongkyuns/noon' && github.event.pull_request.number == 1888 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NOON_WASM_PROFILE: 'release'
      NOON_WASM_SKIP_OPT: '0'
      NOON_RENDERER_SMOKE: '0'
      NOON_PRODUCT_BASE_SHA: dd99c9bca78880f63cb40d45ea2d20be50c3a30b
    steps:
      - name: Checkout diagnostic coordinator
        uses: actions/checkout@v7
        with:
          path: coordinator
      - name: Checkout original baseline source
        uses: actions/checkout@v7
        with:
          ref: dd99c9bca78880f63cb40d45ea2d20be50c3a30b
          path: baseline
      - name: Checkout original tested candidate source
        uses: actions/checkout@v7
        with:
          ref: c9e3a30453a11a8e43d9c0c778870c709d27554f
          path: candidate
      - name: Restore exact original production ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original-zips evidence/provenance
          gh api repos/yongkyuns/noon/actions/artifacts/11383925910 > evidence/provenance/baseline-artifact.json
          gh api repos/yongkyuns/noon/actions/artifacts/11384225814 > evidence/provenance/candidate-artifact.json
          gh api repos/yongkyuns/noon/actions/artifacts/11383925910/zip > original-zips/baseline.zip
          gh api repos/yongkyuns/noon/actions/artifacts/11384225814/zip > original-zips/candidate.zip
          printf '%s  %s\n' \
            cb35639f009c877fa2b47959ebc977c665e8b91de77e18e814e2c6e011003376 original-zips/baseline.zip \
            416dfa22b5f2f534524d9fc86c93006b4559c34b52e9c9712ba2c42f72fed228 original-zips/candidate.zip \
            | tee evidence/provenance/zip-sha256.txt | sha256sum --check --strict
          unzip -q original-zips/baseline.zip -d baseline/web
          unzip -q original-zips/candidate.zip -d candidate/web
      - name: Verify historical sources and immutable package inventories
        shell: bash
        run: |
          set -euo pipefail
          node coordinator/.github/ci/product-artifact.mjs verify baseline baseline | tee evidence/provenance/baseline-verification.txt
          GITHUB_SHA=c9e3a30453a11a8e43d9c0c778870c709d27554f \
            node coordinator/.github/ci/product-artifact.mjs verify candidate candidate | tee evidence/provenance/candidate-verification.txt
          cmp baseline/web/ci-Cargo.lock candidate/web/ci-Cargo.lock
          for file in scripts/playground-product-e2e.mjs scripts/playground-product-fps.mjs scripts/playground-product-compare.mjs web/frame-metrics.js; do
            cmp "coordinator/$file" "baseline/$file"
            cmp "coordinator/$file" "candidate/$file"
          done
          for side in baseline candidate; do
            cp "$side/web/ci-artifact.json" "evidence/provenance/$side-build.json"
            cp "$side/web/runtime-build-identity.json" "evidence/provenance/$side-runtime.json"
            sha256sum "$side/web/pkg/noon_web_bg.wasm" "$side/web/pkg/noon_web.js" "$side/web/python-worker.js"
          done | tee evidence/provenance/runtime-sha256.txt
      - name: Install pinned browser measurement dependencies
        working-directory: coordinator
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Test unchanged comparison and seeded regression controls
        working-directory: coordinator
        env:
          NOON_PRODUCT_IMAGE_TESTS: '1'
        run: node --test web/playground-product-compare-validation.test.mjs
      - name: Measure predeclared interleaved original-binary cohorts
        shell: bash
        run: |
          set -euo pipefail
          # Each cohort uses B/C, C/B, B/C. Rotate cohort order to expose drift.
          # AB compares original baseline/candidate; BB and CC reuse exactly one
          # checkout/package in both arms. All 18 runs are mandatory, serial and
          # use the original cold-pass, warm-up, 2D window and endpoint protocol.
          for pair in 1 2 3; do
            case "$pair" in
              1) cohorts='ab bb cc' ;;
              2) cohorts='cc ab bb' ;;
              3) cohorts='bb cc ab' ;;
            esac
            order='baseline candidate'
            if [[ "$pair" == 2 ]]; then order='candidate baseline'; fi
            for cohort in $cohorts; do
              position=0
              for role in $order; do
                position=$((position + 1))
                case "$cohort" in
                  ab) site="$role" ;;
                  bb) site=baseline ;;
                  cc) site=candidate ;;
                esac
                printf '%s pair=%s position=%s role=%s source=%s\n' "$cohort" "$pair" "$position" "$role" "$site" | tee -a evidence/order.txt
                NOON_PRODUCT_SITE_ROOT="$GITHUB_WORKSPACE/$site" \
                NOON_PRODUCT_PORT=4205 \
                NOON_PRODUCT_EXAMPLE=parity-square-and-circle \
                NOON_PRODUCT_LABEL="$role" \
                NOON_PRODUCT_PAIR_INDEX="$pair" \
                NOON_PRODUCT_PAIR_POSITION="$position" \
                NOON_PRODUCT_ARTIFACT_DIR="$GITHUB_WORKSPACE/evidence/$cohort/$role/trial-$pair" \
                  node coordinator/scripts/playground-product-e2e.mjs
              done
            done
          done
      - name: Compare every cohort under unchanged policy
        if: ${{ !cancelled() }}
        env:
          NOON_PRODUCT_MAX_LATENCY_RATIO: '1.25'
          NOON_PRODUCT_LATENCY_SLACK_MS: '350'
          NOON_PRODUCT_MIN_FPS_RATIO: '0.80'
          NOON_PRODUCT_MAX_VISUAL_DIFF_RATIO: '0.015'
        shell: bash
        run: |
          status=0
          for cohort in ab bb cc; do
            node coordinator/scripts/playground-product-compare.mjs "evidence/$cohort/baseline" "evidence/$cohort/candidate" --pairs 3 || status=1
          done
          exit "$status"
      - name: Retain all original-binary control evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr1882-original-binary-controls-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
