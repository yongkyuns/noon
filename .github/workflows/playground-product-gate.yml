name: Playground Product Gate

on:
  pull_request:
    paths:
      - ".github/workflows/playground-product-gate.yml"
      - ".github/ci/**"
      - ".github/actions/install-wasm-opt/action.yml"
      - "skills/noon-authoring/**"
      - "scripts/noon-capabilities.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/noon/**"
      - "crates/noon-core/**"
      - "crates/noon-compile/**"
      - "crates/noon-runtime/**"
      - "crates/noon-web/**"
      - "crates/noon-render-wgpu/**"
      - "crates/noon-text/**"
      - "scripts/build-web-demo.sh"
      - "scripts/build-python-worker.mjs"
      - "scripts/build-runtime-identity.mjs"
      - "scripts/manim-tutorial-smoke.mjs"
      - "scripts/playground-layout-smoke.mjs"
      - "scripts/playground-browser-support.mjs"
      - "scripts/playground-product-e2e.mjs"
      - "scripts/playground-product-fps.mjs"
      - "scripts/playground-product-fps.test.mjs"
      - "scripts/playground-product-compare.mjs"
      - "scripts/renderer-init-failure-smoke.mjs"
      - "scripts/retained-text-animation-smoke.mjs"
      - "scripts/square-to-circle-start-regression.mjs"
      - "web/**"

permissions:
  contents: read

concurrency:
  group: playground-product-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build product comparison packages
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      baseline-artifact: ${{ steps.baseline-artifact.outputs.artifact-id }}
      anchor-artifact: ${{ steps.anchor-artifact.outputs.artifact-id }}
      candidate-artifact: ${{ steps.candidate-artifact.outputs.artifact-id }}
      candidate-fixture-artifact: ${{ steps.candidate-fixture-artifact.outputs.artifact-id }}
      baseline-sha: ${{ steps.sources.outputs.baseline-sha }}
      candidate-sha: ${{ steps.sources.outputs.candidate-sha }}
      head-sha: ${{ steps.sources.outputs.head-sha }}
      event-base-sha: ${{ steps.sources.outputs.event-base-sha }}
      anchor-sha: ${{ steps.anchor.outputs.anchor-sha }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      # Reuse dependency compilations between four fresh builds at one stable path.
      # The cache lives only in this job; no executable or cross-PR seed is restored.
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_DIR: ${{ github.workspace }}/.product-sccache
      SCCACHE_CACHE_SIZE: "1G"
      SCCACHE_LOCAL_RW_MODE: "READ_WRITE"
      NOON_SKIP_WEB_PREFLIGHT: "1"
      NOON_WASM_PROFILE: "release"
      NOON_WASM_SKIP_OPT: "0"
      NOON_RENDERER_SMOKE: "0"
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          path: candidate

      - name: Pin tested merge and actual baseline
        id: sources
        env:
          NOON_PRODUCT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NOON_PRODUCT_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node candidate/.github/ci/product-artifact.mjs sources candidate

      - name: Pin cumulative performance anchor
        id: anchor
        run: node candidate/.github/ci/product-performance-anchor.mjs pin

      - name: Checkout tested merge first parent
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.sources.outputs.baseline-sha }}
          path: baseline

      - name: Checkout cumulative performance anchor
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.anchor.outputs.anchor-sha }}
          path: anchor

      - name: Test CI artifact contracts
        working-directory: candidate
        run: node --test .github/ci/*.test.mjs

      - name: Use each checkout's pinned Rust and WASM target
        run: |
          for noon_checkout in baseline anchor candidate; do
            (
              cd "$noon_checkout"
              rustup install
              rustup show active-toolchain
              rustup target add wasm32-unknown-unknown
            )
          done

      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('candidate/Cargo.toml', 'candidate/crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-

      - name: Use pinned sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Install pinned wasm-opt
        uses: ./candidate/.github/actions/install-wasm-opt

      - name: Resolve product dependency locks before builds
        run: node candidate/.github/ci/product-artifact.mjs dependencies baseline anchor candidate

      - name: Build baseline production package
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.product-target
        run: |
          # Rust cache keys include cwd and CARGO_TARGET_DIR. Keep both stable,
          # but discard all Cargo fingerprints/artifacts before each source build.
          node candidate/.github/ci/product-artifact.mjs prepare baseline baseline
          mv baseline .product-source
          trap 'mv .product-source baseline' EXIT
          rm -rf .product-target
          sccache --zero-stats
          noon_build_started=$SECONDS
          (cd .product-source && bash scripts/build-web-demo.sh)
          printf 'Baseline release build: %s seconds.\n' "$((SECONDS - noon_build_started))" >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats
          node candidate/.github/ci/product-artifact.mjs stamp baseline .product-source

      - name: Build cumulative anchor production package
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.product-target
          NOON_PRODUCT_BASE_SHA: ${{ steps.anchor.outputs.anchor-sha }}
        run: |
          node candidate/.github/ci/product-artifact.mjs prepare baseline anchor
          mv anchor .product-source
          trap 'mv .product-source anchor' EXIT
          rm -rf .product-target
          sccache --zero-stats
          noon_build_started=$SECONDS
          (cd .product-source && bash scripts/build-web-demo.sh)
          printf 'Cumulative anchor release build: %s seconds.\n' "$((SECONDS - noon_build_started))" >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats
          node candidate/.github/ci/product-artifact.mjs stamp baseline .product-source

      - name: Upload cumulative anchor production package
        id: anchor-artifact
        uses: actions/upload-artifact@v7
        with:
          name: product-anchor-${{ github.run_attempt }}
          path: |
            anchor/web/pkg
            anchor/web/python-worker.js
            anchor/web/runtime-build-identity.json
            anchor/web/python/compat-bundle.*.json
            anchor/web/ci-artifact.json
            anchor/web/ci-Cargo.lock
          if-no-files-found: error
          retention-days: 14

      - name: Build candidate renderer-smoke fixture package
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.product-target
          NOON_RENDERER_SMOKE: "1"
        run: |
          node candidate/.github/ci/product-artifact.mjs prepare candidate-fixture candidate
          mv candidate .product-source
          trap 'mv .product-source candidate' EXIT
          rm -rf .product-target
          sccache --zero-stats
          noon_build_started=$SECONDS
          (cd .product-source && bash scripts/build-web-demo.sh)
          printf 'Candidate renderer-smoke release build: %s seconds.\n' "$((SECONDS - noon_build_started))" >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats
          node .product-source/.github/ci/product-artifact.mjs stamp candidate-fixture .product-source

      - name: Upload candidate renderer-smoke package
        id: candidate-fixture-artifact
        uses: actions/upload-artifact@v7
        with:
          name: product-candidate-fixture-${{ github.run_attempt }}
          path: |
            candidate/web/pkg
            candidate/web/python-worker.js
            candidate/web/runtime-build-identity.json
            candidate/web/python/compat-bundle.*.json
            candidate/web/ci-artifact.json
            candidate/web/ci-Cargo.lock
          if-no-files-found: error
          retention-days: 14

      - name: Build candidate production package
        env:
          # Compiler results are content-keyed; Cargo outputs are never reused.
          CARGO_TARGET_DIR: ${{ github.workspace }}/.product-target
        run: |
          node candidate/.github/ci/product-artifact.mjs prepare candidate candidate
          mv candidate .product-source
          trap 'mv .product-source candidate' EXIT
          rm -rf .product-target
          sccache --zero-stats
          noon_build_started=$SECONDS
          (cd .product-source && bash scripts/build-web-demo.sh)
          printf 'Candidate release build: %s seconds.\n' "$((SECONDS - noon_build_started))" >> "$GITHUB_STEP_SUMMARY"
          sccache --show-stats
          node .product-source/.github/ci/product-artifact.mjs stamp candidate .product-source

      - name: Upload candidate production package
        id: candidate-artifact
        uses: actions/upload-artifact@v7
        with:
          name: product-candidate-${{ github.run_attempt }}
          path: |
            candidate/web/pkg
            candidate/web/python-worker.js
            candidate/web/runtime-build-identity.json
            candidate/web/python/compat-bundle.*.json
            candidate/web/ci-artifact.json
            candidate/web/ci-Cargo.lock
          if-no-files-found: error
          retention-days: 14

      - name: Upload baseline production package
        id: baseline-artifact
        uses: actions/upload-artifact@v7
        with:
          name: product-baseline-${{ github.run_attempt }}
          path: |
            baseline/web/pkg
            baseline/web/python-worker.js
            baseline/web/runtime-build-identity.json
            baseline/web/python/compat-bundle.*.json
            baseline/web/ci-artifact.json
            baseline/web/ci-Cargo.lock
          if-no-files-found: error
          retention-days: 14

  measure-adjacent:
    name: Adjacent product measurements
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      evidence-artifact: ${{ steps.adjacent-evidence.outputs.artifact-id }}
    env:
      NOON_PRODUCT_BASE_SHA: ${{ needs.build.outputs.baseline-sha }}
      NOON_PRODUCT_CANDIDATE_SHA: ${{ needs.build.outputs.candidate-sha }}
      NOON_PRODUCT_HEAD_SHA: ${{ needs.build.outputs.head-sha }}
      NOON_PRODUCT_EVENT_BASE_SHA: ${{ needs.build.outputs.event-base-sha }}
      NOON_PRODUCT_ANCHOR_SHA: ${{ needs.build.outputs.anchor-sha }}
      NOON_WASM_PROFILE: "release"
      NOON_WASM_SKIP_OPT: "0"
      NOON_RENDERER_SMOKE: "0"
    steps:
      - name: Require successful production builds
        env:
          NOON_PRODUCT_BUILD_RESULT: ${{ needs.build.result }}
        run: test "$NOON_PRODUCT_BUILD_RESULT" = success

      - name: Checkout producer candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.candidate-sha }}
          fetch-depth: 2
          path: candidate

      - name: Checkout producer baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.baseline-sha }}
          path: baseline

      - name: Checkout cumulative performance anchor
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.anchor-sha }}
          path: anchor

      - name: Download baseline production package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.baseline-artifact }}
          path: baseline/web

      - name: Download cumulative anchor production package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.anchor-artifact }}
          path: anchor/web

      - name: Download candidate production package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.candidate-artifact }}
          path: candidate/web

      - name: Download candidate renderer-smoke fixture package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.candidate-fixture-artifact }}
          path: candidate-fixture

      - name: Verify source, configuration and package contents
        run: |
          node candidate/.github/ci/product-artifact.mjs verify baseline baseline
          node candidate/.github/ci/product-artifact.mjs verify candidate candidate

      - name: Verify cumulative anchor source, configuration and package contents
        env:
          NOON_PRODUCT_BASE_SHA: ${{ needs.build.outputs.anchor-sha }}
        run: node candidate/.github/ci/product-artifact.mjs verify baseline anchor

      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.62.1

      - name: Install browser measurement dependencies
        working-directory: candidate
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium

      - name: Test product comparison with PNG controls
        working-directory: candidate
        env:
          NOON_PRODUCT_IMAGE_TESTS: "1"
        run: node --test web/playground-product-compare-validation.test.mjs

      - name: Recheck executable tutorial corpus
        working-directory: candidate
        run: node scripts/manim-tutorial-smoke.mjs

      - name: Check SquareToCircle starts from square
        working-directory: candidate
        run: node scripts/square-to-circle-start-regression.mjs

      - name: Recheck retained Text animation
        working-directory: candidate
        run: node scripts/retained-text-animation-smoke.mjs

      - name: Recheck playground layout and Reset
        working-directory: candidate
        run: node scripts/playground-layout-smoke.mjs

      - name: Recheck release renderer initialization
        working-directory: candidate
        env:
          NOON_RENDERER_SMOKE: "1"
          NOON_RENDERER_FAILURE_ARTIFACTS: browser-smoke-artifacts/product-gate/renderer-init
        run: |
          rm -rf web/pkg
          rm -f web/python-worker.js web/runtime-build-identity.json web/ci-artifact.json web/ci-Cargo.lock
          rm -f web/python/compat-bundle.*.json
          cp -a ../candidate-fixture/. web/
          node .github/ci/product-artifact.mjs verify candidate-fixture .
          node scripts/renderer-init-failure-smoke.mjs

      - name: Clear renderer-smoke package before restoring production
        working-directory: candidate
        run: |
          rm -rf web/pkg
          rm -f web/python-worker.js web/runtime-build-identity.json web/ci-artifact.json web/ci-Cargo.lock
          rm -f web/python/compat-bundle.*.json

      - name: Restore candidate production package for benchmark
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.candidate-artifact }}
          path: candidate/web

      - name: Reverify candidate production package
        working-directory: candidate
        run: node .github/ci/product-artifact.mjs verify candidate .

      - name: Measure three alternating product pairs
        working-directory: candidate
        env:
          NOON_PRODUCT_WORKSPACE: ${{ github.workspace }}
        run: |
          # Fixed before measurement: B/C, C/B, B/C. Every run is retained;
          # a failed run fails the cohort rather than selecting another sample.
          # Reuse the same immutable packages for every declared workload.
          noon_workloads="$(node .github/ci/product-performance-anchor.mjs cohorts)"
          while IFS=$'\t' read -r noon_example noon_directory; do
            noon_evidence="browser-smoke-artifacts/product-gate/$noon_directory"
            for noon_pair in 1 2 3; do
              noon_order="baseline candidate"
              if [[ "$noon_pair" == 2 ]]; then noon_order="candidate baseline"; fi
              noon_position=0
              for noon_side in $noon_order; do
                noon_position=$((noon_position + 1))
                NOON_PRODUCT_SITE_ROOT="$NOON_PRODUCT_WORKSPACE/$noon_side" \
                NOON_PRODUCT_PORT=4205 \
                NOON_PRODUCT_EXAMPLE="$noon_example" \
                NOON_PRODUCT_LABEL="$noon_side" \
                NOON_PRODUCT_PAIR_INDEX="$noon_pair" \
                NOON_PRODUCT_PAIR_POSITION="$noon_position" \
                NOON_PRODUCT_ARTIFACT_DIR="$noon_evidence/$noon_side/trial-$noon_pair" \
                  node scripts/playground-product-e2e.mjs
              done
            done
          done <<< "$noon_workloads"

      - name: Upload adjacent measurement evidence
        id: adjacent-evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: product-adjacent-evidence-${{ github.run_attempt }}
          path: candidate/browser-smoke-artifacts/product-gate
          if-no-files-found: error
          retention-days: 14

  measure-cumulative:
    name: Pinned-anchor product measurements
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      evidence-artifact: ${{ steps.cumulative-evidence.outputs.artifact-id }}
    env:
      NOON_PRODUCT_BASE_SHA: ${{ needs.build.outputs.baseline-sha }}
      NOON_PRODUCT_CANDIDATE_SHA: ${{ needs.build.outputs.candidate-sha }}
      NOON_PRODUCT_HEAD_SHA: ${{ needs.build.outputs.head-sha }}
      NOON_PRODUCT_EVENT_BASE_SHA: ${{ needs.build.outputs.event-base-sha }}
      NOON_PRODUCT_ANCHOR_SHA: ${{ needs.build.outputs.anchor-sha }}
      NOON_WASM_PROFILE: "release"
      NOON_WASM_SKIP_OPT: "0"
      NOON_RENDERER_SMOKE: "0"
    steps:
      - name: Require successful production builds
        env:
          NOON_PRODUCT_BUILD_RESULT: ${{ needs.build.result }}
        run: test "$NOON_PRODUCT_BUILD_RESULT" = success

      - name: Checkout producer candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.candidate-sha }}
          fetch-depth: 2
          path: candidate

      - name: Checkout cumulative performance anchor
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.anchor-sha }}
          path: anchor

      - name: Download cumulative anchor production package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.anchor-artifact }}
          path: anchor/web

      - name: Download candidate production package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.candidate-artifact }}
          path: candidate/web

      - name: Verify candidate production package for pinned-anchor measurement
        run: node candidate/.github/ci/product-artifact.mjs verify candidate candidate

      - name: Verify cumulative anchor source, configuration and package contents
        env:
          NOON_PRODUCT_BASE_SHA: ${{ needs.build.outputs.anchor-sha }}
        run: node candidate/.github/ci/product-artifact.mjs verify baseline anchor

      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.62.1

      - name: Install browser measurement dependencies
        working-directory: candidate
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium

      - name: Measure three alternating cumulative-anchor pairs
        working-directory: candidate
        env:
          NOON_PRODUCT_WORKSPACE: ${{ github.workspace }}
        run: |
          # Use the identical prescribed cohort against the pinned accepted source.
          # The anchor report deliberately uses the comparator's baseline role so
          # the exact same fail-closed comparison code and thresholds are reused.
          noon_workloads="$(node .github/ci/product-performance-anchor.mjs cohorts)"
          while IFS=$'\t' read -r noon_example noon_directory; do
            noon_evidence="browser-smoke-artifacts/product-gate/cumulative/$noon_directory"
            for noon_pair in 1 2 3; do
              noon_order="anchor candidate"
              if [[ "$noon_pair" == 2 ]]; then noon_order="candidate anchor"; fi
              noon_position=0
              for noon_side in $noon_order; do
                noon_position=$((noon_position + 1))
                noon_label="$noon_side"
                if [[ "$noon_side" == anchor ]]; then noon_label="baseline"; fi
                NOON_PRODUCT_SITE_ROOT="$NOON_PRODUCT_WORKSPACE/$noon_side" \
                NOON_PRODUCT_PORT=4205 \
                NOON_PRODUCT_EXAMPLE="$noon_example" \
                NOON_PRODUCT_LABEL="$noon_label" \
                NOON_PRODUCT_PAIR_INDEX="$noon_pair" \
                NOON_PRODUCT_PAIR_POSITION="$noon_position" \
                NOON_PRODUCT_ARTIFACT_DIR="$noon_evidence/$noon_side/trial-$noon_pair" \
                  node scripts/playground-product-e2e.mjs
              done
            done
          done <<< "$noon_workloads"

      - name: Upload cumulative-anchor measurement evidence
        id: cumulative-evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: product-cumulative-evidence-${{ github.run_attempt }}
          path: candidate/browser-smoke-artifacts/product-gate/cumulative
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Runtime, visual, latency, and FPS regression
    needs: [build, measure-adjacent, measure-cumulative]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOON_PRODUCT_BASE_SHA: ${{ needs.build.outputs.baseline-sha }}
      NOON_PRODUCT_CANDIDATE_SHA: ${{ needs.build.outputs.candidate-sha }}
      NOON_PRODUCT_HEAD_SHA: ${{ needs.build.outputs.head-sha }}
      NOON_PRODUCT_EVENT_BASE_SHA: ${{ needs.build.outputs.event-base-sha }}
      NOON_PRODUCT_ANCHOR_SHA: ${{ needs.build.outputs.anchor-sha }}
      NOON_WASM_PROFILE: "release"
      NOON_WASM_SKIP_OPT: "0"
      NOON_RENDERER_SMOKE: "0"
    steps:
      - name: Require successful production builds and both complete measurement cohorts
        env:
          NOON_PRODUCT_BUILD_RESULT: ${{ needs.build.result }}
          NOON_PRODUCT_ADJACENT_RESULT: ${{ needs.measure-adjacent.result }}
          NOON_PRODUCT_CUMULATIVE_RESULT: ${{ needs.measure-cumulative.result }}
        run: |
          test "$NOON_PRODUCT_BUILD_RESULT" = success
          test "$NOON_PRODUCT_ADJACENT_RESULT" = success
          test "$NOON_PRODUCT_CUMULATIVE_RESULT" = success

      - name: Checkout producer candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.candidate-sha }}
          fetch-depth: 2
          path: candidate

      - name: Checkout producer baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.baseline-sha }}
          path: baseline

      - name: Checkout cumulative performance anchor
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.anchor-sha }}
          path: anchor

      - name: Download baseline production package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.baseline-artifact }}
          path: baseline/web

      - name: Download cumulative anchor production package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.anchor-artifact }}
          path: anchor/web

      - name: Download candidate production package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.candidate-artifact }}
          path: candidate/web

      - name: Verify source, configuration and package contents
        run: |
          node candidate/.github/ci/product-artifact.mjs verify baseline baseline
          node candidate/.github/ci/product-artifact.mjs verify candidate candidate

      - name: Verify cumulative anchor source, configuration and package contents
        env:
          NOON_PRODUCT_BASE_SHA: ${{ needs.build.outputs.anchor-sha }}
        run: node candidate/.github/ci/product-artifact.mjs verify baseline anchor

      - name: Download exact adjacent measurement evidence
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.measure-adjacent.outputs.evidence-artifact }}
          path: candidate/browser-smoke-artifacts/product-gate

      - name: Download exact cumulative measurement evidence
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.measure-cumulative.outputs.evidence-artifact }}
          path: candidate/browser-smoke-artifacts/product-gate/cumulative

      - name: Install pinned comparison image dependency
        working-directory: candidate
        run: npm install --no-save --ignore-scripts pngjs@7.0.0

      - name: Compare product behavior
        working-directory: candidate
        env:
          NOON_PRODUCT_MAX_LATENCY_RATIO: "1.25"
          NOON_PRODUCT_LATENCY_SLACK_MS: "350"
          NOON_PRODUCT_MIN_FPS_RATIO: "0.80"
          NOON_PRODUCT_MAX_VISUAL_DIFF_RATIO: "0.015"
        run: |
          # Evaluate every complete cohort even if an earlier comparison failed.
          # Failure remains blocking; no sample is retried, omitted, or replaced.
          noon_workloads="$(node .github/ci/product-performance-anchor.mjs cohorts)"
          noon_failed=0
          for noon_scope in adjacent cumulative; do
            noon_root="browser-smoke-artifacts/product-gate"
            noon_baseline=baseline
            if [[ "$noon_scope" == cumulative ]]; then
              noon_root="$noon_root/cumulative"
              noon_baseline=anchor
              printf '\nCumulative pinned-anchor comparisons (%s):\n' "$NOON_PRODUCT_ANCHOR_SHA"
            fi
            while IFS=$'\t' read -r noon_example noon_directory; do
              printf '\n%s / %s\n' "$noon_scope" "$noon_example"
              if ! node scripts/playground-product-compare.mjs \
                "$noon_root/$noon_directory/$noon_baseline" \
                "$noon_root/$noon_directory/candidate" --pairs 3; then
                noon_failed=1
              fi
            done <<< "$noon_workloads"
          done
          exit "$noon_failed"

      - name: Upload product regression evidence
        if: ${{ always() && needs.measure-adjacent.result == 'success' && needs.measure-cumulative.result == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: playground-product-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: candidate/browser-smoke-artifacts/product-gate
          if-no-files-found: error
          retention-days: 14
