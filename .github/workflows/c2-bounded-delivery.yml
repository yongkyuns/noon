name: C2 bounded input delivery validation
on:
  push:
    branches: [work/c2-bounded-delivery]
    paths:
      - .github/workflows/c2-bounded-delivery.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Apply locally tested source and remove temporary tooling
        run: |
          gzip -dc .github/c2-bounded-delivery.patch.gz | git apply --index
          git rm .github/c2-bounded-delivery.patch.gz .github/workflows/c2-bounded-delivery.yml
          git diff --cached --check
          test "$(git write-tree)" = 4e007f0a0c3eef713d5cb24d27cac01e8cd70ee1
      - name: Focused bounded delivery and lifecycle regressions
        run: node --test web/execution-worker-client.test.mjs web/semantic-execution-routing.test.mjs web/semantic-engine-endpoint.test.mjs | tee /tmp/c2-delivery-focused.log
      - name: Full web preflight
        run: NOON_WEB_PREFLIGHT_ONLY=1 bash scripts/build-web-demo.sh > /tmp/c2-delivery-preflight.log 2>&1 || { tail -150 /tmp/c2-delivery-preflight.log; exit 1; }
      - name: Publish validated code-only staging tree
        run: |
          test "$(git write-tree)" = 4e007f0a0c3eef713d5cb24d27cac01e8cd70ee1
          git diff --exit-code
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Bound native input delivery and prevent replay across endpoint replacement'
          git push origin HEAD:refs/heads/work/c2-bounded-delivery
          git rev-parse HEAD HEAD^{tree} > /tmp/c2-delivery-source.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: c2-bounded-delivery-validation
          path: |
            /tmp/c2-delivery-focused.log
            /tmp/c2-delivery-preflight.log
            /tmp/c2-delivery-source.txt
          retention-days: 7
