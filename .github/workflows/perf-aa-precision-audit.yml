name: A/A precision audit protocol (not performance qualification)

on:
  pull_request:
    paths:
      - '.github/workflows/perf-aa-precision-audit.yml'
      - 'scripts/perf-aa-precision-audit.mjs'
      - 'scripts/perf-aa-precision-audit.test.mjs'
      - 'docs/perf-aa-metrology.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    name: Verify diagnostic A/A integrity (not a product performance verdict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
      - name: Validate audit source syntax
        run: node --check scripts/perf-aa-precision-audit.mjs
      - name: Validate full fixed A/A and fail-closed regressions
        run: node --test scripts/perf-aa-precision-audit.test.mjs
