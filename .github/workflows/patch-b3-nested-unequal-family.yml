name: Patch B3 nested unequal family Transform

on:
  push:
    branches:
      - codex/b3-nested-unequal-family-transform

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/b3-nested-unequal-family-transform
          fetch-depth: 0
      - name: Apply nested-family integration
        shell: bash
        run: |
          set -euo pipefail
          START_HEAD="$(git rev-parse HEAD)"
          python3 .github/patch-b3-nested-unequal-family.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p noon --lib nested_unequal_family_transform
          cargo test -p noon-web --lib canonical_family_composition_rejects_crosswrites_and_captures_between_segments
          rm .github/patch-b3-nested-unequal-family.py
          rm .github/workflows/patch-b3-nested-unequal-family.yml
          git config user.name "Yongkyun Shin"
          git config user.email "yongkyuns@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Enable recursive unequal-family Transform staging"
          git fetch origin codex/b3-nested-unequal-family-transform
          REMOTE_HEAD="$(git rev-parse FETCH_HEAD)"
          if [[ "$REMOTE_HEAD" != "$START_HEAD" ]]; then
            echo "Branch advanced from $START_HEAD to $REMOTE_HEAD; refusing stale publication." >&2
            exit 1
          fi
          git push origin HEAD:codex/b3-nested-unequal-family-transform
