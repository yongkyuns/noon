name: Patch 1478 transient locality

on:
  push:
    branches:
      - codex/b3-transient-presentation-locality

permissions:
  contents: write

jobs:
  patch-and-qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: codex/b3-transient-presentation-locality
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/patch-1478-current.py

      - name: Format and focused qualification
        run: |
          cargo fmt --all
          cargo test -p noon-runtime frame_changes_tests
          cargo test -p noon --lib execution_session::family_transform_tests
          cargo test -p noon-render-wgpu --lib presentation_only_redraw_reuses_mixed_retained_preparation
          bash scripts/transient-presentation-ratchet.test.sh
          bash scripts/transient-presentation-ratchet.sh
          bash scripts/check-architecture.sh c4e65f816aec9bcd68f7ef5253426c4208f526dd
          git diff --check

      - name: Publish clean production commit
        run: |
          git config user.name "Noon CI"
          git config user.email "noon-ci@users.noreply.github.com"
          rm .github/workflows/patch-1478-transient-locality.yml .github/patch-1478.py .github/patch-1478-current.py
          chmod +x scripts/transient-presentation-ratchet.sh scripts/transient-presentation-ratchet.test.sh
          git add -A
          git status --short
          git commit -m "Complete transient presentation locality"
          git push origin HEAD:codex/b3-transient-presentation-locality
