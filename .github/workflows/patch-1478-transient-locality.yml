          large_test = '''#[test]
fn transient_retirement_is_local_with_many_stable_rows() {
    let mut store = SemanticStore::new();
    let source_members = (0..64)
        .map(|index| object(&mut store, index as f64 * 2.0))
        .collect::<Vec<_>>();
    let target_members = (0..65)
        .map(|index| object(&mut store, 100.0 + index as f64 * 2.0))
        .collect::<Vec<_>>();
    let source = family(&mut store, &source_members);
    let target = family(&mut store, &target_members);

    let mut session = ExecutionSession::from_semantic_root(&store, source).unwrap();
    let request = SemanticCompositionRequest::FamilyTransformTo {
        source,
        target_state: target,
        options: AnimationOptions::new()
            .run_time(1.0)
            .rate_func(RateFunction::Linear),
    };
    let segment = session
        .declare_and_activate_composition(&mut store, source, &request, AnimationOptions::new())
        .unwrap();
    session.advance_segment_to(segment, 1.0).unwrap();
    session.complete_segment(&mut store, segment).unwrap();

    {
        let endpoint = session.take_renderer_publication();
        assert_eq!(endpoint.transient_presentations().len(), 1);
        assert_eq!(endpoint.transient_presentations()[0].state().appearance, 1.0);
    }
    let _ = session.runtime.take_spatial_changes();
    let stable_endpoint = session.frame().clone();
    assert_eq!(stable_endpoint.objects.len(), 64);
    assert!(session.wake_state().frame_pending());

    {
        let removal = session.take_renderer_publication();
        assert!(removal.changes().is_presentation_only());
        assert!(!removal.changes().is_all());
        assert!(removal.changes().object_indices().is_empty());
        assert!(removal.transient_presentations().is_empty());
        assert_eq!(removal.frame(), &stable_endpoint);
    }
    assert!(session.runtime.take_spatial_changes().is_empty());
    assert_eq!(session.frame(), &stable_endpoint);
}

