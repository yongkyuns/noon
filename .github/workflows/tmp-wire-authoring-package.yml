name: Temporary wire authoring package

on:
  push:
    branches:
      - perf/wire-authoring-wasm-package

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/wire-authoring-wasm-package
      - name: Wire specialized authoring package
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected block in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              'web/python-worker.source.js',
              '} from "./pkg/noon_web.js";',
              '} from "./pkg-authoring/noon_web.js";',
          )

          replace(
              'scripts/build-web-demo.sh',
              '''if (( worker_status != 0 )); then\n  exit "$worker_status"\nfi\n\nnode scripts/check-web-package.mjs''',
              '''if (( worker_status != 0 )); then\n  exit "$worker_status"\nfi\n\n# Python authoring has no renderer ownership. Build the measured renderer-free\n# package separately and keep the full package for engine/render workers.\nbash scripts/build-web-authoring-package.sh\n\nif ! grep -q 'pkg-authoring/noon_web.js' web/python-worker.js; then\n  echo "generated Python worker is not wired to the authoring-only Noon package" >&2\n  exit 1\nfi\n\nnode scripts/check-web-package.mjs''',
          )

          p = Path('scripts/build-web-authoring-package.sh')
          text = p.read_text()
          old = 'for symbol in WasmAuthoringStore RetainedNativeTextAuthoringHandle RetainedTypstAuthoringHandle; do'
          new = '''for symbol in \\\n  WasmAuthoringStore \\\n  RetainedNativeTextAuthoringHandle \\\n  RetainedTypstAuthoringHandle \\\n  canonicalRetainedSceneSpecJson \\\n  manimAnnularSectorSnapshotJson \\\n  manimAnnulusSnapshotJson \\\n  manimDashedLineSnapshotJson \\\n  manimDotSnapshotJson \\\n  manimElbowSnapshotJson \\\n  manimRoundedRectangleSnapshotJson \\\n  manimSectorSnapshotJson \\\n  manimTriangleSnapshotJson \\\n  manimUnderlineSnapshotJson \\\n  resolveAnimationOptions \\\n  resolveCompositionSchedule \\\n  resolveLifecyclePlan \\\n  resolveUniformCompositionSchedule \\\n  validatePresenceTransition; do'''
          if old not in text:
              raise SystemExit('authoring export assertion block changed')
          p.write_text(text.replace(old, new, 1))

          for path in ['.github/workflows/ci.yml', '.github/workflows/playground-cross-browser.yml']:
              p = Path(path)
              text = p.read_text()
              needle = '            web/pkg\n            web/python-worker.js'
              if needle not in text:
                  raise SystemExit(f'package artifact block missing in {path}')
              p.write_text(text.replace(
                  needle,
                  '            web/pkg\n            web/pkg-authoring\n            web/python-worker.js',
                  1,
              ))

          p = Path('.github/workflows/playground-cross-browser.yml')
          text = p.read_text()
          needle = '      - "scripts/build-web-demo.sh"\n'
          if '      - "scripts/build-web-authoring-package.sh"\n' not in text:
              if needle not in text:
                  raise SystemExit('cross-browser build script path trigger missing')
              text = text.replace(needle, needle + '      - "scripts/build-web-authoring-package.sh"\n', 1)
          p.write_text(text)

          p = Path('.github/workflows/playground-product-gate.yml')
          text = p.read_text()
          needle = '      - "scripts/build-web-demo.sh"\n'
          if '      - "scripts/build-web-authoring-package.sh"\n' not in text:
              if needle not in text:
                  raise SystemExit('product gate build script path trigger missing')
              text = text.replace(needle, needle + '      - "scripts/build-web-authoring-package.sh"\n', 1)
          p.write_text(text)

          p = Path('.gitignore')
          text = p.read_text()
          if '/web/pkg-authoring\n' not in text:
              text = text.replace('/web/pkg\n', '/web/pkg\n/web/pkg-authoring\n', 1)
          p.write_text(text)
          PY
          git diff --check
          git status --short
      - name: Commit wiring
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "noreply@openai.com"
          git add \
            .gitignore \
            .github/workflows/ci.yml \
            .github/workflows/playground-cross-browser.yml \
            .github/workflows/playground-product-gate.yml \
            scripts/build-web-authoring-package.sh \
            scripts/build-web-demo.sh \
            web/python-worker.source.js
          git commit -m "perf: wire renderer-free WASM into Python authoring"
          git push origin HEAD:perf/wire-authoring-wasm-package
