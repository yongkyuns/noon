name: R3 R2a projection qualification (development only)
on:
  push:
    branches: [codex/1292-r3-r2a-projection-prep]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE: ee1de6a0418c6da8559f891f98820aa8dc57809d
      ORIGINAL_MAPPER_BASE: 10e9597611dad4dc4d1917f39dc685143fd37f3c
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Assemble exact current-master projection candidate
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/r3-r2a"
          mkdir -p "$E/oldtree/crates/noon-web/src"
          cat scripts/r3-r2a-projection-prep.part1.b64 scripts/r3-r2a-projection-prep.part2.b64 | base64 -d | gzip -d > "$E/projection.patch"
          test "$(sha256sum "$E/projection.patch" | cut -d' ' -f1)" = "aaf30d3d01faa4b81c781af07fc3033ac460d78af18fa7588822013abb39e6a4"
          python3 - "$E" <<'PY'
          from pathlib import Path
          import re, sys
          root = Path(sys.argv[1])
          text = (root / "projection.patch").read_text()
          chunks = [c for c in re.split(r"(?=^--- a/)", text, flags=re.M) if c]
          author = [c for c in chunks if c.startswith("--- a/crates/noon-web/src/authoring_error.rs\n")]
          assert len(author) == 1
          rest = [c for c in chunks if c not in author]
          assert len(rest) == 5
          (root / "authoring.patch").write_text(author[0])
          (root / "rest.patch").write_text("".join(rest))
          PY
          git config user.name 'Noon qualification bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --detach "$BASE"
          git show "$ORIGINAL_MAPPER_BASE:crates/noon-web/src/authoring_error.rs" > "$E/oldtree/crates/noon-web/src/authoring_error.rs"
          patch -s -d "$E/oldtree" -p1 < "$E/authoring.patch"
          git apply "$E/rest.patch"
          python3 - "$E" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          path = Path("crates/noon-web/src/authoring_error.rs")
          current = path.read_text()
          desired = (root / "oldtree/crates/noon-web/src/authoring_error.rs").read_text()
          family_start = current.index("impl From<noon::FamilyCallbackPaintError>")
          family_end = current.index("impl From<String>", family_start)
          family_before = current[family_start:family_end]
          old_import = "    ExecutionSessionPublicationError, LiveSessionError,\n"
          new_import = "    ExecutionSessionPublicationError, LiveSessionError, UnsupportedAuthoringOperation,\n"
          assert current.count(old_import) == 1
          current = current.replace(old_import, new_import, 1)
          d0 = desired.index("impl From<UnsupportedAuthoringOperation>")
          d1 = desired.index("\nimpl From<SemanticSceneOperationError>", d0)
          block = desired[d0:d1]
          c0 = current.index("impl From<AuthoringError>")
          c1 = current.index("\nimpl From<SemanticSceneOperationError>", c0)
          current = current[:c0] + block + current[c1:]
          f0 = current.index("impl From<noon::FamilyCallbackPaintError>")
          f1 = current.index("impl From<String>", f0)
          assert current[f0:f1] == family_before
          assert "InvalidPaint(cause) => Self::caused_by(" in family_before
          assert 'other => Self::unclassified("authoring.unclassified", &other)' in current
          assert '_ => return Self::unclassified("unsupported.unclassified", &error)' in current
          path.write_text(current)
          PY
          cargo fmt --all
          git add crates/noon-web/src/authoring_error.rs crates/noon-web/src/authoring_mobject.rs crates/noon-web/src/canonical_authoring_scene.rs web/python/_manim_geometry.py web/python/_manim_semantic_handles.py web/python/test_noon_errors_wasm.py
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          test -z "$(find . -name '*.rej' -print -quit)"
          git diff --cached --check
          git commit -m 'fix: project typed R2a authoring failures through WASM and Python'
          git rev-parse HEAD HEAD^{tree} HEAD^ > "$E/revisions.txt"
          git diff "$BASE" HEAD > "$E/product.patch"
          git archive --format=tar.gz HEAD > "$E/source.tar.gz"
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Focused native projection and R2a consumer tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p noon-web --all-features --lib authoring_error::tests -- --nocapture 2>&1 | tee "$RUNNER_TEMP/r3-r2a/native-mapper.log"
          cargo test --manifest-path fixtures/provider-consumer/Cargo.toml --no-default-features --tests 2>&1 | tee "$RUNNER_TEMP/r3-r2a/consumers.log"
      - name: Fast architecture and compile gate
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check.sh fast "$BASE" 2>&1 | tee "$RUNNER_TEMP/r3-r2a/fast.log"
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: wasm-pack@0.15.0
      - name: Build actual WASM and preflight Python
        shell: bash
        run: |
          set -euo pipefail
          NOON_WASM_PROFILE=dev NOON_WASM_SKIP_OPT=1 bash scripts/build-web-demo.sh 2>&1 | tee "$RUNNER_TEMP/r3-r2a/build.log"
      - name: Install existing browser dependencies
        shell: bash
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Existing real WASM/Pyodide boundary runner
        shell: bash
        run: |
          set -euo pipefail
          node scripts/typed-authoring-errors-smoke.mjs 2>&1 | tee "$RUNNER_TEMP/r3-r2a/boundary.log"
      - name: Paired Python/Manim recovery paths
        shell: bash
        run: |
          set -euo pipefail
          node scripts/shared-authoring-smoke.mjs 2>&1 | tee "$RUNNER_TEMP/r3-r2a/shared.log"
          node scripts/manim-compat-smoke.mjs 2>&1 | tee "$RUNNER_TEMP/r3-r2a/manim.log"
      - name: Retain exact evidence
        if: always()
        shell: bash
        run: |
          git status --short > "$RUNNER_TEMP/r3-r2a/status.txt"
          rustc --version > "$RUNNER_TEMP/r3-r2a/toolchain.txt"
          node --version >> "$RUNNER_TEMP/r3-r2a/toolchain.txt"
          test ! -f web/pkg/noon_web_bg.wasm || sha256sum web/pkg/noon_web_bg.wasm > "$RUNNER_TEMP/r3-r2a/wasm.sha256"
          test ! -d browser-smoke-artifacts/typed-authoring-errors || cp -r browser-smoke-artifacts/typed-authoring-errors "$RUNNER_TEMP/r3-r2a/results"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r3-r2a-current-master-qualification
          path: ${{ runner.temp }}/r3-r2a
          if-no-files-found: error
          retention-days: 3
