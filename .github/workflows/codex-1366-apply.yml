name: Apply scoped 1366 host patch

on:
  push:
    branches:
      - codex/1366-webgpu-device-loss
    paths:
      - ".github/workflows/codex-1366-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: codex/1366-webgpu-device-loss
          fetch-depth: 0

      - name: Use stable Rust
        run: |
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Apply scoped recovery patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one patch anchor, found {count}")
              p.write_text(text.replace(old, new, 1))

          path = "crates/noon-web/src/execution_canvas.rs"
          old = '''            self.webgl_recovery_pending.set(false);\n            Ok(true)\n        }\n\n        pub fn render(&mut self) -> Result<bool, JsValue> {\n'''
          new = '''            self.webgl_recovery_pending.set(false);\n            Ok(true)\n        }\n\n        /// Replace only WebGPU-owned platform state after the browser loses the\n        /// current device. Semantic execution/session state remains authoritative.\n        #[wasm_bindgen(js_name = recoverWebGpuDevice)]\n        pub async fn recover_webgpu_device(&mut self) -> Result<bool, JsValue> {\n            if self.backend != wgpu::Backend::BrowserWebGpu\n                || !self\n                    .gpu_diagnostics\n                    .device_loss_pending(self.gpu_generation)\n            {\n                return Ok(false);\n            }\n\n            let lost_generation = self.gpu_generation;\n            let next_generation = lost_generation\n                .checked_add(1)\n                .ok_or_else(|| js_message("GPU recovery generation exhausted"))?;\n            let profiling_enabled = self.timestamp_profiler.is_some();\n            let InitializedGpu {\n                instance,\n                surface,\n                device,\n                queue,\n                backend,\n                config,\n                timestamp_query_supported,\n            } = initialize_webgpu(&self.canvas, self.config.width, self.config.height)\n                .await\n                .map_err(|error| js_message(&format!("WebGPU device recovery failed: {error}")))?;\n            if backend != wgpu::Backend::BrowserWebGpu {\n                return Err(js_message(\n                    "WebGPU device recovery unexpectedly selected a different GPU backend",\n                ));\n            }\n\n            install_wgpu_error_handler(\n                &device,\n                next_generation,\n                backend,\n                self.gpu_diagnostics.clone(),\n            );\n            let renderer = GpuRenderer::new(&device, config.format);\n            let direct_text_gpu = renderer.create_retained_text_state(&device, &queue);\n\n            self.instance = instance;\n            self.surface = surface;\n            self.device = device;\n            self.queue = queue;\n            self.backend = backend;\n            self.config = config;\n            self.timestamp_query_supported = timestamp_query_supported;\n            self.renderer = renderer;\n            self.direct_text_gpu = direct_text_gpu;\n            self.direct_preparer = RetainedFramePreparer::new();\n            self.timestamp_profiler =\n                profiling_enabled.then(|| GpuTimestampProfiler::new(&self.device, &self.queue));\n            self.gpu_generation = next_generation;\n            self.surface_frame_pending = true;\n            self.last_draw_calls = 0;\n            self.last_text_draw_calls = 0;\n            self.last_instances_drawn = 0;\n            self.last_bytes_uploaded = 0;\n            self.last_geometry_cache_misses = 0;\n            self.update_camera()?;\n            self.gpu_diagnostics.clear_device_loss(lost_generation);\n            Ok(true)\n        }\n\n        pub fn render(&mut self) -> Result<bool, JsValue> {\n'''
          replace_once(path, old, new)

          old = '''            if self.webgl_recovery_pending.get() {\n                return Ok(false);\n            }\n            let changes_pending =\n'''
          new = '''            if self.webgl_recovery_pending.get() {\n                return Ok(false);\n            }\n            if self.backend == wgpu::Backend::BrowserWebGpu\n                && self\n                    .gpu_diagnostics\n                    .device_loss_pending(self.gpu_generation)\n            {\n                return Ok(false);\n            }\n            let changes_pending =\n'''
          replace_once(path, old, new)

          path = "web/browser-smoke.js"
          old = '''function flushPending() {\n  presentPending();\n}\n\nasync function presentAt(timeSeconds) {\n  const time = validateRenderTime(timeSeconds);\n  flushPending();\n'''
          new = '''function flushPending() {\n  presentPending();\n}\n\nasync function recoverWebGpuIfNeeded() {\n  const recovered = await renderer.recoverWebGpuDevice();\n  if (recovered) {\n    drainGpuDiagnostics();\n  }\n  return recovered;\n}\n\nasync function presentAt(timeSeconds) {\n  const time = validateRenderTime(timeSeconds);\n  await recoverWebGpuIfNeeded();\n  flushPending();\n'''
          replace_once(path, old, new)

          old = '''async function resizeBacking(width, height) {\n  backingWidth = validateBackingDimension("backing width", width);\n  backingHeight = validateBackingDimension("backing height", height);\n  renderer.resize(backingWidth, backingHeight);\n'''
          new = '''async function resizeBacking(width, height) {\n  backingWidth = validateBackingDimension("backing width", width);\n  backingHeight = validateBackingDimension("backing height", height);\n  await recoverWebGpuIfNeeded();\n  renderer.resize(backingWidth, backingHeight);\n'''
          replace_once(path, old, new)
          PY

      - name: Format and verify scoped build
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          node --check web/browser-smoke.js
          cargo check -p noon-web --target wasm32-unknown-unknown --features renderer-smoke
          cargo test -p noon-web --lib gpu_diagnostics
          git diff --check

      - name: Commit verified patch and remove one-shot workflow
        run: |
          rm .github/workflows/codex-1366-apply.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "web: recover direct WebGPU device loss in place"
          git push origin HEAD:codex/1366-webgpu-device-loss
