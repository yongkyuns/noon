name: Temporary canonical SceneSpec migration

on:
  push:
    branches:
      - tmp/367-canonical-scenespec-all-scenes

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/367-canonical-scenespec-all-scenes
      - name: Apply canonical SceneSpec patch
        run: python scripts/_tmp_367_canonical_scenespec_all.py
      - name: Validate focused web contracts
        run: |
          node --test web/authoring-client.test.mjs web/authoring-scene-spec-result.test.mjs
          node scripts/build-python-worker.mjs
          git diff --check
      - name: Remove temporary machinery
        run: rm scripts/_tmp_367_canonical_scenespec_all.py .github/workflows/_tmp-367-canonical-scenespec-all.yml
      - name: Commit validated tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make canonical SceneSpec mandatory for authored scenes"
          git push origin HEAD:tmp/367-canonical-scenespec-all-scenes
