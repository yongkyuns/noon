name: Finalize O1 differential coverage

on:
  push:
    branches:
      - agent/parity-o1-differential-expansion
    paths:
      - .github/workflows/finalize-parity-o1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/parity-o1-differential-expansion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply public-surface harness fix
        run: python scripts/finalize-parity-o1.py
      - name: Install Manim reference
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config
          python -m pip install --disable-pip-version-check 'manim==0.21.0'
      - name: Validate differential suite
        run: python scripts/manim-differential.py
      - name: Commit final fixture expansion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand public Manim differential coverage"
          git push origin HEAD:agent/parity-o1-differential-expansion
