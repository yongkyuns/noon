name: R2a producer development
on:
  push:
    branches: [codex/1292-r2a-producers-prep]
permissions:
  contents: write
  actions: read
concurrency:
  group: r2a-final-landing
  cancel-in-progress: false
env:
  INPUT_HEAD: a86f3e2b40bc2878836b8bda259a7555584a0970
  CURRENT_BASE: 54a3167f7e977e856e4e519ef8c717a20f715a01
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: 'true'
  SCCACHE_GHA_RW_MODE: READ_ONLY
jobs:
  final-full:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: a86f3e2b40bc2878836b8bda259a7555584a0970
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: r2a-frame-integration
          run-id: 34392155628
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r2a-frame-input
      - name: Preserve both typed sources at the existing unmapped opacity boundary
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2a-final
          test "$(git rev-parse HEAD)" = "$INPUT_HEAD"
          test "$(git rev-parse HEAD^{tree})" = 7db0070ec98e646c88ab4eb66cfbdf55607018d5
          git diff --exit-code
          git config user.name 'Noon development tooling'
          git config user.email 'development@noon.invalid'
          git archive "$CURRENT_BASE" | gzip > /tmp/r2a-final/base.tar.gz
          set +e
          git merge --no-commit --no-ff "$CURRENT_BASE" > /tmp/r2a-final/merge.log 2>&1
          result=$?
          set -e
          test "$result" -le 1
          python3 - <<'PY'
          import hashlib,os,re,subprocess
          from pathlib import Path
          path=Path('crates/noon-web/src/canonical_authoring_scene.rs')
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          assert conflicts==[str(path)],conflicts
          text=path.read_text()
          pattern=re.compile(r'<<<<<<< HEAD\n(.*?)=======\n(.*?)>>>>>>> [^\n]+\n',re.S)
          matches=list(pattern.finditer(text)); assert len(matches)==2
          for match,kind in reversed(list(zip(matches,['fill','stroke']))):
              ours,theirs=match.groups()
              call=f'handle.{kind}_opacity()'
              assert call+'.map_err(|error| error.to_string())?;' in ours
              assert call+'?;' in theirs
              assert '.live_effective(handle)\n                .map_err(|error| error.to_string())?' in theirs
              combined=theirs.replace(call+'?;',call+'.map_err(|error| error.to_string())?;')
              text=text[:match.start()]+combined+text[match.end():]
          assert '<<<<<<<' not in text
          path.write_text(text)
          subprocess.run(['git','add',str(path)],check=True)
          assert not subprocess.check_output(['git','ls-files','-u'],text=True)
          path=Path('scripts/manim-compat-smoke.mjs')
          text=path.read_text()
          a=text.index('    const rejectsForeign = (operation) => {')
          b=text.index('    const sameNumericId',a)
          text=text[:a]+'''    // These three forwarding sites are still diagnostic-only R3 inventory.
              // This fixture proves rejection/atomicity/lifetime; typed categories are
              // checked by the independent Rust consumer and the typed-boundary runner.
              // Do not classify human wording or accept an unrelated JS TypeError.
              const rejectsUnmappedAuthoring = (operation) => {
                try { operation(); } catch (error) {
                  if (typeof error !== "string" || error.length === 0) throw error;
                  return true;
                }
                return false;
              };
          '''.replace('\n          ','\n')+text[b:]
          text=text.replace('rejectsForeign(() =>','rejectsUnmappedAuthoring(() =>')
          needle='    const foreignObjectPlacementRejected = rejectsUnmappedAuthoring'
          assert text.count(needle)==1
          insertion='''    const layoutBefore = [circle.centerX, copy.centerX, target.centerX, family.memberCount];
              const requireUnchangedLayout = () => {
                const after = [circle.centerX, copy.centerX, target.centerX, family.memberCount];
                if (!after.every((value, index) => Object.is(value, layoutBefore[index]))) {
                  throw new Error("rejected foreign placement changed local state");
                }
              };
              const foreignObjectPlacementRejected = rejectsUnmappedAuthoring'''.replace('\n          ','\n')
          text=text.replace(needle,insertion)
          text=text.replace('    const foreignFamilyPlacementRejected =','    requireUnchangedLayout();\n    const foreignFamilyPlacementRejected =',1)
          needle='    store.free();\n    otherStore.free();\n    // Observations retain their semantic store;'
          assert text.count(needle)==1
          replacement='''    requireUnchangedLayout();
              // Retry both exact placement entrypoints with valid local targets. The
              // copies start at the same center, so these controls preserve the layout.
              layout.moveToMobject(copy, 0, 0, 1, 1);
              layout.moveToFamily(layout, 0, 0, 1, 1);
              requireUnchangedLayout();
              store.free();
              otherStore.free();
              // Observations retain their semantic store;'''.replace('\n          ','\n')
          text=text.replace(needle,replacement)
          data=text.encode()
          assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()=='93cace7f8074e2994706e272638f0a5201d98ec9'
          path.write_text(text)
          lock=(Path(os.environ['RUNNER_TEMP'])/'r2a-frame-input/Cargo.lock').read_bytes()
          assert hashlib.sha256(lock).hexdigest()=='9fc77831ae25df351229c9902c073657062501a8e5faf8ea313dd9c8284062dd'
          Path('Cargo.lock').write_bytes(lock)
          PY
          cargo fmt --all
          git add -u
          git diff --cached --check
          git diff --exit-code "$CURRENT_BASE" -- crates/noon-web/src/authoring_error.rs crates/noon-web/src/semantic_execution_player.rs crates/noon-compile/src/semantic_lowering/root_order.rs crates/noon/src/execution_session/callback.rs scripts/typed-authoring-errors-smoke.mjs web/python compat
          git -c commit.gpgSign=false commit -m 'fix: retain content-query forwarding and remove wording-dependent smoke checks (#1354)'
          cp Cargo.lock /tmp/r2a-final/Cargo.lock
          sha256sum Cargo.lock > /tmp/r2a-final/lock-before.sha256
          git show -s --format='%H %T %P' HEAD > /tmp/r2a-final/source-identity.txt
          git archive HEAD | gzip > /tmp/r2a-final/source.tar.gz
          git diff "$CURRENT_BASE" HEAD > /tmp/r2a-final/source.patch
          printf '%s\n' "$GITHUB_SHA" > /tmp/r2a-final/helper-event-sha.txt
          rustc --version > /tmp/r2a-final/toolchain.txt
          cargo --version >> /tmp/r2a-final/toolchain.txt
          node --version >> /tmp/r2a-final/toolchain.txt
          python3 --version >> /tmp/r2a-final/toolchain.txt
      - name: Complete existing web preflight before compiling
        run: |
          NOON_WEB_PREFLIGHT_ONLY=1 bash scripts/build-web-demo.sh > /tmp/r2a-final/preflight.log 2>&1 || { tail -200 /tmp/r2a-final/preflight.log; exit 1; }
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: r2-sources-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            Linux-cargo-sources-
            provider-sources-Linux-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Run independent typed consumers and check native/WASM forwarding
        run: |
          cargo test --manifest-path fixtures/provider-consumer/Cargo.toml --no-default-features --tests > /tmp/r2a-final/consumers.log 2>&1 || { tail -160 /tmp/r2a-final/consumers.log; exit 1; }
          cargo check --workspace --all-targets --all-features > /tmp/r2a-final/native.log 2>&1 || { tail -200 /tmp/r2a-final/native.log; exit 1; }
          cargo check -p noon-web --all-features --target wasm32-unknown-unknown > /tmp/r2a-final/wasm-check.log 2>&1 || { tail -200 /tmp/r2a-final/wasm-check.log; exit 1; }
          git diff --exit-code
          git push origin HEAD:refs/heads/codex/1354-final-integrated
          git show -s --format='%H %T %P' HEAD > /tmp/r2a-final/published.txt
      - uses: actions/upload-artifact@v7
        with:
          name: r2a-final-source
          path: /tmp/r2a-final
          retention-days: 3
          if-no-files-found: error
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Run exact full gate on the combined source
        run: |
          set -euo pipefail
          bash scripts/check.sh full "$CURRENT_BASE" > /tmp/r2a-final/full.log 2>&1 || { tail -240 /tmp/r2a-final/full.log; exit 1; }
          tail -50 /tmp/r2a-final/full.log
          sha256sum Cargo.lock > /tmp/r2a-final/lock-after.sha256
          cmp /tmp/r2a-final/lock-before.sha256 /tmp/r2a-final/lock-after.sha256
          git diff --exit-code
          sha256sum web/pkg/noon_web_bg.wasm > /tmp/r2a-final/release-wasm.sha256
      - name: Install existing paired-browser prerequisites
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1 pngjs@7
          npx playwright install --with-deps chromium
      - name: Exercise paired behavior without another Rust build
        run: |
          set -euo pipefail
          node scripts/shared-authoring-smoke.mjs > /tmp/r2a-final/shared-authoring.log 2>&1 || { tail -200 /tmp/r2a-final/shared-authoring.log; exit 1; }
          node scripts/manim-compat-smoke.mjs > /tmp/r2a-final/manim-compat.log 2>&1 || { tail -200 /tmp/r2a-final/manim-compat.log; exit 1; }
          tail -40 /tmp/r2a-final/shared-authoring.log
          tail -30 /tmp/r2a-final/manim-compat.log
          sha256sum web/pkg/noon_web_bg.wasm > /tmp/r2a-final/release-wasm-after-browser.sha256
          cmp /tmp/r2a-final/release-wasm.sha256 /tmp/r2a-final/release-wasm-after-browser.sha256
          git diff --exit-code
      - name: Retain exact source and qualification even on failure
        if: always()
        run: |
          mkdir -p /tmp/r2a-final
          git status --short > /tmp/r2a-final/status.txt
          git ls-files -u > /tmp/r2a-final/conflicts.txt
          git diff > /tmp/r2a-final/final-tracked.diff
          git show -s --format='%H %T %P' HEAD > /tmp/r2a-final/final-identity.txt
          if test -d web/pkg; then
            find web/pkg -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/r2a-final/package.sha256
            tar -czf /tmp/r2a-final/release-package.tar.gz web/pkg
          fi
          test ! -f Cargo.lock || sha256sum Cargo.lock > /tmp/r2a-final/final-lock.sha256
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r2a-final-full
          path: /tmp/r2a-final
          retention-days: 3
          if-no-files-found: error
