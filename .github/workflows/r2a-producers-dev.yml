name: R2a producer development
on:
  push:
    branches: [codex/1292-r2a-producers-prep]
permissions:
  contents: write
  actions: read
concurrency:
  group: r2a-paint-cause-publication
  cancel-in-progress: false
jobs:
  publish-qualified-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cf7d000b773d47fd62bd5b56f636e689d5585f28
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: r2a-paint-cause-review
          run-id: 34399777023
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/paint-cause-qualified
      - name: Publish only the exact previously qualified three-file candidate
        run: |
          set -euo pipefail
          mkdir -p /tmp/paint-source
          test "$(git rev-parse HEAD)" = cf7d000b773d47fd62bd5b56f636e689d5585f28
          git diff --exit-code
          patch="$RUNNER_TEMP/paint-cause-qualified/final.patch"
          test "$(sha256sum "$patch" | cut -d' ' -f1)" = 809ae6a4a14b0f998b81bb0e4d2ed9350aff0e7ea76412a63bb9714be21a2bc1
          git apply --index "$patch"
          git diff --cached --check
          test "$(git write-tree)" = 4b34f7f7063aa83d2acc74304c3002483b93f6f9
          git diff --cached --name-only | tee /tmp/paint-source/paths.txt
          test "$(wc -l < /tmp/paint-source/paths.txt)" = 3
          git config user.name 'Noon development tooling'
          git config user.email 'development@noon.invalid'
          git -c commit.gpgSign=false commit -m 'fix: preserve nested family paint causes across WASM (#1354)'
          git diff --exit-code
          git push origin HEAD:refs/heads/codex/1354-paint-causes-qualified
          git show -s --format='%H %T %P' HEAD | tee /tmp/paint-source/published.txt
          git diff HEAD^ HEAD > /tmp/paint-source/patch.diff
          git archive HEAD | gzip > /tmp/paint-source/source.tar.gz
          printf '%s\n' "$GITHUB_SHA" > /tmp/paint-source/helper-event.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r2a-paint-cause-source
          path: /tmp/paint-source
          retention-days: 3
          if-no-files-found: error
