name: R2a producer development
on:
  push:
    branches: [codex/1292-r2a-producers-prep]
permissions:
  contents: write
concurrency:
  group: r2a-producers-development
  cancel-in-progress: true
env:
  PRODUCT_HEAD: a6155ac6f96788d257102b956cbbd4d7fd469e66
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: 'true'
  SCCACHE_GHA_RW_MODE: READ_ONLY
jobs:
  typed-example-assertion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: a6155ac6f96788d257102b956cbbd4d7fd469e66
          fetch-depth: 0
      - name: Use the published typed failure in the existing paired example
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2a-assertion
          test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
          git diff --exit-code
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/noon/src/example_scenes.rs')
          text = path.read_text()
          old = 'assert!(error.to_string().contains("active effective affine driver"));'
          assert text.count(old) == 1
          new = '''assert!(matches!(
              error,
              crate::LiveSessionError::Authoring(crate::AuthoringError::Unsupported(
                  crate::UnsupportedAuthoringOperation::PlacementEffectiveAffineDriver
              ))
          ));'''
          path.write_text(text.replace(old, new))
          PY
          cargo fmt --all
          git diff --check
          test "$(git diff --name-only)" = crates/noon/src/example_scenes.rs
          git diff > /tmp/r2a-assertion/candidate.patch
          git config user.name 'Noon development tooling'
          git config user.email 'development@noon.invalid'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: r2-sources-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            Linux-cargo-sources-
            provider-sources-Linux-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Execute the actual example continuation and its typed recovery regression
        run: |
          set -o pipefail
          cargo test -p noon --no-default-features --lib ordinary_callback_continuation_uses_ordered_shared_barriers -- --exact 2>&1 | tee /tmp/r2a-assertion/example.log
          # Use the module-qualified exact test and assert it executed, not a zero-match filter.
          cargo test -p noon --no-default-features --lib example_scenes::tests::ordinary_callback_continuation_uses_ordered_shared_barriers -- --exact 2>&1 | tee /tmp/r2a-assertion/exact-example.log
          grep -q '1 passed; 0 failed; 0 ignored' /tmp/r2a-assertion/exact-example.log
          cargo test --manifest-path fixtures/provider-consumer/Cargo.toml --no-default-features --test object_authoring_errors 2>&1 | tee /tmp/r2a-assertion/object-errors.log
          cargo fmt --all -- --check
          bash scripts/check.sh architecture "$PRODUCT_HEAD" > /tmp/r2a-assertion/architecture.log 2>&1
      - name: Compile existing native and direct-WASM callers
        run: |
          cargo clippy -p noon --no-default-features --all-targets -- -D warnings > /tmp/r2a-assertion/native.log 2>&1 || { tail -180 /tmp/r2a-assertion/native.log; exit 1; }
          cargo check -p noon-web --all-features --target wasm32-unknown-unknown > /tmp/r2a-assertion/wasm.log 2>&1 || { tail -180 /tmp/r2a-assertion/wasm.log; exit 1; }
      - name: Publish the single assertion change after focused qualification
        run: |
          set -euo pipefail
          git add crates/noon/src/example_scenes.rs
          git diff --cached --check
          test "$(git diff --cached --name-only)" = crates/noon/src/example_scenes.rs
          git -c commit.gpgSign=false commit -m 'test: match typed placement rejection in the paired callback example (#1354)'
          test "$(git rev-parse HEAD^)" = "$PRODUCT_HEAD"
          git diff --exit-code
          git push origin HEAD:refs/heads/codex/1292-r2a-typed-producers
          git show -s --format='%H %T %P' HEAD > /tmp/r2a-assertion/published.txt
          cat /tmp/r2a-assertion/published.txt
      - name: Preserve source and qualification evidence
        if: always()
        run: |
          mkdir -p /tmp/r2a-assertion
          git add crates/noon/src/example_scenes.rs
          git write-tree > /tmp/r2a-assertion/tree.txt
          git archive "$(git write-tree)" | gzip > /tmp/r2a-assertion/source.tar.gz
          git diff --cached "$PRODUCT_HEAD" > /tmp/r2a-assertion/final.patch
          rustc --version > /tmp/r2a-assertion/toolchain.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r2a-typed-example-qualification
          path: /tmp/r2a-assertion
          retention-days: 3
          if-no-files-found: error
