name: R2a producer development
on:
  push:
    branches: [codex/1292-r2a-producers-prep]
permissions:
  contents: write
  actions: read
concurrency:
  group: r2a-callback-integration
  cancel-in-progress: false
env:
  INPUT_HEAD: d607b7c3d4fae515d08c3b432dd49ce2e7b40c01
  CALLBACK_HEAD: 9b647bf1455035f1d2d7b28db9fbe6c7a4cfdcbd
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: 'true'
  SCCACHE_GHA_RW_MODE: READ_ONLY
jobs:
  callback-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d607b7c3d4fae515d08c3b432dd49ce2e7b40c01
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: r2a-final-source
          run-id: 34393940697
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r2a-source-input
      - name: Integrate the callback owner's exact source without changing its implementation
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2a-callback
          test "$(git rev-parse HEAD)" = "$INPUT_HEAD"
          git diff --exit-code
          git config user.name 'Noon development tooling'
          git config user.email 'development@noon.invalid'
          git archive "$CALLBACK_HEAD" | gzip > /tmp/r2a-callback/base.tar.gz
          git merge --no-commit --no-ff "$CALLBACK_HEAD" > /tmp/r2a-callback/merge.log 2>&1 || { cat /tmp/r2a-callback/merge.log; exit 1; }
          git diff --cached --check
          git diff --exit-code "$CALLBACK_HEAD" -- crates/noon-web/src/authoring_error.rs crates/noon-web/src/semantic_execution_player.rs crates/noon/src/execution_session/callback.rs crates/noon-compile/src/semantic_lowering/root_order.rs scripts/typed-authoring-errors-smoke.mjs web/python
          cp "$RUNNER_TEMP/r2a-source-input/Cargo.lock" Cargo.lock
          echo '9fc77831ae25df351229c9902c073657062501a8e5faf8ea313dd9c8284062dd  Cargo.lock' | sha256sum --check
          git -c commit.gpgSign=false commit -m 'refactor: integrate reviewed callback forwarding with typed R2a producers (#1354)'
          git diff --exit-code
          git show -s --format='%H %T %P' HEAD | tee /tmp/r2a-callback/source-identity.txt
          git archive HEAD | gzip > /tmp/r2a-callback/source.tar.gz
          git diff "$CALLBACK_HEAD" HEAD > /tmp/r2a-callback/source.patch
          git diff "$INPUT_HEAD" HEAD > /tmp/r2a-callback/callback-integration.patch
          cp Cargo.lock /tmp/r2a-callback/Cargo.lock
          printf '%s\n' "$GITHUB_SHA" > /tmp/r2a-callback/helper-event-sha.txt
          rustc --version > /tmp/r2a-callback/toolchain.txt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: r2-sources-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            Linux-cargo-sources-
            provider-sources-Linux-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Qualify the meaningful Rust producer and callback overlap
        run: |
          set -o pipefail
          cargo test --manifest-path fixtures/provider-consumer/Cargo.toml --no-default-features --tests > /tmp/r2a-callback/consumers.log 2>&1 || { tail -160 /tmp/r2a-callback/consumers.log; exit 1; }
          bash scripts/check.sh rust "$CALLBACK_HEAD" > /tmp/r2a-callback/rust.log 2>&1 || { tail -180 /tmp/r2a-callback/rust.log; exit 1; }
          cargo check -p noon-web --all-features --target wasm32-unknown-unknown > /tmp/r2a-callback/wasm.log 2>&1 || { tail -180 /tmp/r2a-callback/wasm.log; exit 1; }
          git diff --exit-code
          echo '9fc77831ae25df351229c9902c073657062501a8e5faf8ea313dd9c8284062dd  Cargo.lock' | sha256sum --check
      - name: Retain only the integration candidate, not the product PR ref
        run: |
          git push origin HEAD:refs/heads/codex/1354-callback-integrated
          git show -s --format='%H %T %P' HEAD | tee /tmp/r2a-callback/published.txt
      - name: Retain exact source and diagnostics
        if: always()
        run: |
          mkdir -p /tmp/r2a-callback
          git status --short > /tmp/r2a-callback/status.txt
          git diff --name-only --diff-filter=U > /tmp/r2a-callback/conflicts.txt
          git diff HEAD > /tmp/r2a-callback/final-tracked.diff
          git show -s --format='%H %T %P' HEAD > /tmp/r2a-callback/final-identity.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r2a-callback-integration
          path: /tmp/r2a-callback
          retention-days: 3
          if-no-files-found: error
