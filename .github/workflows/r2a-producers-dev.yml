name: R2a producer development
on:
  push:
    branches: [codex/1292-r2a-producers-prep]
permissions:
  contents: read
  actions: read
concurrency:
  group: r2a-producers-development
  cancel-in-progress: true
env:
  PRODUCT_HEAD: 4af209f29cf8df43f8249ec1830f410b8b9871b1
  CURRENT_BASE: 5b56124312657c0959e1ca3936930cad0fe7e240
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: 'true'
  SCCACHE_GHA_RW_MODE: READ_ONLY
jobs:
  full-landing:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 4af209f29cf8df43f8249ec1830f410b8b9871b1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Read the retained focused dependency lock
        uses: actions/download-artifact@v8
        with:
          name: r2a-landing-focused
          run-id: 34388702779
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r2a-focused-input
      - name: Verify actual source and dependency identity
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2a-full
          test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
          test "$(git rev-parse HEAD^{tree})" = 25fb3d40be9535a58bd689cca68d3394cb35e070
          test "$(git rev-parse HEAD^2)" = "$CURRENT_BASE"
          git diff --exit-code
          printf '%s\n' "$GITHUB_SHA" > /tmp/r2a-full/helper-event-sha.txt
          git show -s --format='%H %T %P' HEAD > /tmp/r2a-full/source-identity.txt
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          lock=Path(os.environ['RUNNER_TEMP'])/'r2a-focused-input/Cargo.lock'
          data=lock.read_bytes()
          assert hashlib.sha256(data).hexdigest()=='9fc77831ae25df351229c9902c073657062501a8e5faf8ea313dd9c8284062dd'
          Path('Cargo.lock').write_bytes(data)
          PY
          sha256sum Cargo.lock > /tmp/r2a-full/lock-before.sha256
          cp Cargo.lock /tmp/r2a-full/Cargo.lock
          git archive HEAD | gzip > /tmp/r2a-full/source.tar.gz
          git diff "$CURRENT_BASE" HEAD > /tmp/r2a-full/source.patch
          rustc --version > /tmp/r2a-full/toolchain.txt
          cargo --version >> /tmp/r2a-full/toolchain.txt
          node --version >> /tmp/r2a-full/toolchain.txt
          python3 --version >> /tmp/r2a-full/toolchain.txt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: r2-sources-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            Linux-cargo-sources-
            provider-sources-Linux-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Run the exact full gate with default optimized release WASM
        run: |
          set -euo pipefail
          bash scripts/check.sh full "$CURRENT_BASE" > /tmp/r2a-full/full.log 2>&1 || { tail -240 /tmp/r2a-full/full.log; exit 1; }
          tail -60 /tmp/r2a-full/full.log
          sha256sum Cargo.lock > /tmp/r2a-full/lock-after.sha256
          cmp /tmp/r2a-full/lock-before.sha256 /tmp/r2a-full/lock-after.sha256
          git diff --exit-code
          sha256sum web/pkg/noon_web_bg.wasm > /tmp/r2a-full/release-wasm.sha256
      - name: Install the existing paired-browser prerequisites
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1 pngjs@7
          npx playwright install --with-deps chromium
      - name: Run paired product behavior on the same release package without another Rust build
        run: |
          set -euo pipefail
          node scripts/shared-authoring-smoke.mjs > /tmp/r2a-full/shared-authoring.log 2>&1 || { tail -200 /tmp/r2a-full/shared-authoring.log; exit 1; }
          node scripts/manim-compat-smoke.mjs > /tmp/r2a-full/manim-compat.log 2>&1 || { tail -200 /tmp/r2a-full/manim-compat.log; exit 1; }
          tail -40 /tmp/r2a-full/shared-authoring.log
          tail -30 /tmp/r2a-full/manim-compat.log
          git diff --exit-code
          sha256sum web/pkg/noon_web_bg.wasm > /tmp/r2a-full/release-wasm-after-browser.sha256
          cmp /tmp/r2a-full/release-wasm.sha256 /tmp/r2a-full/release-wasm-after-browser.sha256
      - name: Preserve exact qualification and package evidence
        if: always()
        run: |
          mkdir -p /tmp/r2a-full
          git status --short > /tmp/r2a-full/final-status.txt
          git diff > /tmp/r2a-full/final-tracked.diff
          git show -s --format='%H %T %P' HEAD > /tmp/r2a-full/final-identity.txt
          if test -d web/pkg; then
            find web/pkg -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/r2a-full/package.sha256
            tar -czf /tmp/r2a-full/release-package.tar.gz web/pkg
          fi
          test ! -f Cargo.lock || sha256sum Cargo.lock > /tmp/r2a-full/final-lock.sha256
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r2a-full-landing
          path: /tmp/r2a-full
          retention-days: 3
          if-no-files-found: error
