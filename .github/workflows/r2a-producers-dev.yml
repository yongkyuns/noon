name: R2a producer development
on:
  push:
    branches: [codex/1292-r2a-producers-prep]
permissions:
  contents: read
concurrency:
  group: r2a-producers-development
  cancel-in-progress: true
env:
  CURRENT_BASE: 406944f8a58218629c14ff247894b3fd2e8c471a
  PRODUCT_HEAD: 461fb1743fe9ee4037089ccd65d5573195d62b61
jobs:
  inspect-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 461fb1743fe9ee4037089ccd65d5573195d62b61
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve both exact inputs and inspect merge without publishing
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2a-integration
          test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
          git diff --exit-code
          git archive "$CURRENT_BASE" | gzip > /tmp/r2a-integration/master.tar.gz
          git archive "$PRODUCT_HEAD" | gzip > /tmp/r2a-integration/product.tar.gz
          git show -s --format='%H %T %P' "$CURRENT_BASE" "$PRODUCT_HEAD" > /tmp/r2a-integration/inputs.txt
          git config user.name 'Noon development tooling'
          git config user.email 'development@noon.invalid'
          set +e
          git merge --no-commit --no-ff "$CURRENT_BASE" > /tmp/r2a-integration/merge.log 2>&1
          result=$?
          set -e
          git status --short > /tmp/r2a-integration/status.txt
          git diff --name-only --diff-filter=U > /tmp/r2a-integration/conflicts.txt
          git diff > /tmp/r2a-integration/unstaged.patch
          git diff --cached "$CURRENT_BASE" > /tmp/r2a-integration/staged.patch
          git ls-files -z | sort -zu | tar --null -T - -czf /tmp/r2a-integration/merged-worktree.tar.gz
          cat /tmp/r2a-integration/inputs.txt /tmp/r2a-integration/merge.log /tmp/r2a-integration/conflicts.txt
          printf '%s\n' "$result" > /tmp/r2a-integration/merge-exit.txt
          test "$result" = 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r2a-current-integration
          path: /tmp/r2a-integration
          retention-days: 3
          if-no-files-found: error
