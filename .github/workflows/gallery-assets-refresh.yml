name: Gallery assets refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout asset branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Merge current master and preserve asset intent
        run: |
          cp web/python/examples/manim_tutorial_manifest.json /tmp/asset-manifest.json
          git fetch origin master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff origin/master || true

          conflicts="$(git diff --name-only --diff-filter=U)"
          unexpected="$(printf '%s\n' "$conflicts" | grep -v -E '^(web/python/examples/manim_tutorial_manifest.json|web/example-gallery.test.mjs)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected merge conflicts:"
            echo "$unexpected"
            exit 1
          fi

          if git ls-files -u -- web/python/examples/manim_tutorial_manifest.json | grep -q .; then
            git checkout --theirs web/python/examples/manim_tutorial_manifest.json
          fi
          if git ls-files -u -- web/example-gallery.test.mjs | grep -q .; then
            git checkout --theirs web/example-gallery.test.mjs
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          asset_manifest = json.loads(Path('/tmp/asset-manifest.json').read_text())
          manifest_path = Path('web/python/examples/manim_tutorial_manifest.json')
          manifest = json.loads(manifest_path.read_text())
          generated = {
              entry['id']: entry['thumbnail']
              for entry in asset_manifest['entries']
              if str(entry.get('thumbnail', '')).startswith('thumbnails/manim/generated/')
          }
          remapped = 0
          for entry in manifest['entries']:
              thumbnail = generated.get(entry.get('id'))
              if thumbnail is not None:
                  entry['thumbnail'] = thumbnail
                  remapped += 1
          assert remapped == len(generated), (remapped, len(generated))
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          test_path = Path('web/example-gallery.test.mjs')
          test = test_path.read_text()
          test = test.replace(
              'import { readFile } from "node:fs/promises";',
              'import { access, readFile } from "node:fs/promises";',
              1,
          )
          before = '''      (entry.thumbnail.endsWith(".webp") || entry.thumbnail.endsWith(".svg")),'''
          after = '''      (entry.thumbnail.endsWith(".webp") ||\n        entry.thumbnail.endsWith(".svg") ||\n        entry.thumbnail.endsWith(".png")),'''
          assert test.count(before) == 1
          test = test.replace(before, after, 1)
          anchor = '''  "ready gallery entries must use a checked-in Manim thumbnail/poster",\n);\n'''
          addition = '''  "ready gallery entries must use a checked-in Manim thumbnail/poster",\n);\nassert.equal(\n  readyEntries.some((entry) => entry.thumbnail === "thumbnails/manim/exact-source.svg"),\n  false,\n  "ready gallery entries must use real scene-specific posters rather than the generic placeholder",\n);\nfor (const entry of readyEntries) {\n  await access(new URL(`./${entry.thumbnail}`, import.meta.url));\n}\n'''
          assert test.count(anchor) == 1
          test = test.replace(anchor, addition, 1)
          test = test.replace(
              'console.log("✓ Manim gallery manifest contract + thumbnail fallback");',
              'console.log("✓ Manim gallery manifest contract + real posters + thumbnail fallback");',
              1,
          )
          test_path.write_text(test)
          PY

          git add web/python/examples/manim_tutorial_manifest.json web/example-gallery.test.mjs scripts/generate-gallery-thumbnails.mjs web/thumbnails/manim/generated .github/workflows/gallery-assets-refresh.yml
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git commit -m "Merge current master into gallery assets"
          git push origin HEAD:${{ github.head_ref }}

      - name: Validate merged gallery contract
        run: |
          node --check scripts/generate-gallery-thumbnails.mjs
          node --test web/example-gallery.test.mjs
