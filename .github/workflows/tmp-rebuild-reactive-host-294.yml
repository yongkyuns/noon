name: Rebuild reactive host PR tree

on:
  push:
    branches:
      - tmp/rebuild-reactive-host-294

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/rebuild-reactive-host-294
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy validated source slice
        run: |
          git fetch --depth=1 origin 8b8ee72f70bb9f448f0deb68de7442ebddcaef5a
          git checkout FETCH_HEAD -- \
            crates/noon-compile/src/lib.rs \
            crates/noon-core/src/patch.rs \
            crates/noon-core/src/patch/transaction_preflight.rs \
            crates/noon-runtime/src/execution_slots.rs \
            crates/noon-runtime/src/lib.rs \
            crates/noon-runtime/src/reactive/host_callbacks.rs \
            crates/noon-runtime/src/reactive/signal_timeline.rs \
            crates/noon-web/src/host_player.rs \
            web/python/_manim_compat.py \
            web/python/_manim_geometry.py \
            web/python/_manim_reactive.py \
            web/python/_manim_updaters.py \
            web/python/_noon_ir.py \
            web/python/test_moving_dots_primitives.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/python/_noon_ir.py')
          text = p.read_text()
          old = '"geometry": copy.deepcopy(geometry),'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one geometry patch copy, found {count}')
          p.write_text(text.replace(old, '"geometry": geometry,', 1))
          PY
      - name: Format and validate
        run: |
          rustup default stable
          rustup component add rustfmt
          cargo fmt --all
          python3 scripts/semantic_ownership_check.py
          PYTHONPATH=web/python python3 -m unittest web.python.test_updater_snapshot web.python.test_moving_dots_primitives
          cargo test -p noon-core
          cargo test -p noon-compile
          cargo test -p noon-runtime
          cargo test -p noon-ir
          cargo test -p noon-web
      - name: Commit source tree
        run: |
          rm .github/workflows/tmp-rebuild-reactive-host-294.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            crates/noon-compile/src/lib.rs \
            crates/noon-core/src/patch.rs \
            crates/noon-core/src/patch/transaction_preflight.rs \
            crates/noon-runtime/src/execution_slots.rs \
            crates/noon-runtime/src/lib.rs \
            crates/noon-runtime/src/reactive/host_callbacks.rs \
            crates/noon-runtime/src/reactive/signal_timeline.rs \
            crates/noon-web/src/host_player.rs \
            web/python/_manim_compat.py \
            web/python/_manim_geometry.py \
            web/python/_manim_reactive.py \
            web/python/_manim_updaters.py \
            web/python/_noon_ir.py \
            web/python/test_moving_dots_primitives.py
          git add -u .github/workflows/tmp-rebuild-reactive-host-294.yml
          git commit -m "Support reactive values and geometry in host updaters"
          git push origin HEAD:tmp/rebuild-reactive-host-294
