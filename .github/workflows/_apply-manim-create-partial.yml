name: Apply Manim Create partial geometry

on:
  push:
    branches:
      - parity/manim-create-partial

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parity/manim-create-partial
          fetch-depth: 0
      - name: Apply renderer integration
        run: python3 scripts/_apply_manim_create_partial.py
      - name: Correct cubic endpoint fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/noon-geometry/src/partial.rs")
          text = path.read_text()
          old = 'assert_vec2(*to, Vec2::new(0.5, 0.75))'
          new = 'assert_vec2(*to, Vec2::new(0.5, 0.875))'
          if text.count(old) != 1:
              raise SystemExit("cubic endpoint fixture anchor mismatch")
          path.write_text(text.replace(old, new))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Test partial geometry
        run: cargo test -p noon-geometry partial --lib
      - name: Test renderer preparation
        run: cargo test -p noon-render-wgpu --lib
      - name: Remove temporary patch machinery
        run: |
          rm scripts/_apply_manim_create_partial.py
          rm .github/workflows/_apply-manim-create-partial.yml
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: render Manim Create as partial closed-shape geometry"
          git push origin HEAD:parity/manim-create-partial
