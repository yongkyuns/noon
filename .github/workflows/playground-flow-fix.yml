name: Continuous stroke focused qualification

on:
  pull_request:
    paths:
      - '.github/workflows/playground-flow-fix.yml'

permissions:
  contents: read

jobs:
  qualify:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'work/2188-shared-rust-continuous-flow' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      NOON_CAPTURE_PROOF_DIR: ${{ github.workspace }}/flow-check/pixels
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply two reviewed representation corrections and remove this helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/noon-render-wgpu/src/gpu/retained_text.rs')
          s = p.read_text()
          old = 'stroke_pattern: vector.style.stroke_pattern,'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'stroke_pattern: None,'))
          p = Path('crates/noon-render-wgpu/src/gpu/source_capture.rs')
          s = p.read_text()
          old = '        style.fill = [1.0; 4];'
          assert s.count(old) == 1
          s = s.replace(old, '''        // A patterned Line uses disabled fill lanes as geometric parameters.
                  // Silhouette capture may recolor ink, never rewrite its spacing.
                  if style.fill_enabled & 4 == 0 {
                      style.fill = [1.0; 4];
                  }''')
          p.write_text(s)
          Path('.github/workflows/playground-flow-fix.yml').unlink()
          PY
          cargo fmt --all
          git diff --check
          git add crates .github/workflows/playground-flow-fix.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Fix text-style admission and preserve periodic source-capture coverage'
          expected='${{ github.event.pull_request.head.sha }}'
          actual=$(git ls-remote origin refs/heads/work/2188-shared-rust-continuous-flow | cut -f1)
          test "$expected" = "$actual"
          git push origin HEAD:refs/heads/work/2188-shared-rust-continuous-flow
      - name: Qualify shared authoring, moving attachment, and locality
        run: |
          set -o pipefail
          mkdir -p flow-check
          cargo test -p noon --no-default-features stroke_pattern 2>&1 | tee flow-check/authoring.log
          cargo test -p noon-render-wgpu --test continuous_stroke_pattern 2>&1 | tee flow-check/locality.log
          cargo check -p noon-native --example continuous_flow 2>&1 | tee flow-check/native.log
      - name: Render and compare actual phase and seek pixels
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          cargo test -p noon-export --no-default-features --test capture native_capture_continuous_stroke_pattern -- --ignored --nocapture 2>&1 | tee flow-check/capture.log
      - name: Preserve tested revision and exact text sources
        if: always()
        run: |
          mkdir -p flow-check
          git rev-parse HEAD > flow-check/tested-commit.txt
          python3 - <<'PY'
          import pathlib, subprocess, tarfile
          names = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with tarfile.open('flow-check/source.tar.gz','w:gz') as archive:
              for name in names:
                  p = pathlib.Path(name)
                  if p.is_file() and p.suffix in {'.rs','.wgsl','.toml','.sh','.py','.mjs','.yml'}:
                      archive.add(p, arcname=name, recursive=False)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: continuous-stroke-qualification
          path: flow-check
          retention-days: 1
