name: C5 callback input qualification

on:
  push:
    branches:
      - validation/c5-callback-input-20260921

permissions:
  contents: read

concurrency:
  group: c5-callback-input-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assemble exact callback input candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/proof"
          cat candidate/c5-callback-input/part*.b64 | base64 -d | xz -d > "$GITHUB_WORKSPACE/proof/input.patch"
          echo '3f2396b4881c0f84508ff6f9c555da56fda1281dea3afe0f57a55bb06a2752d5  proof/input.patch' | sha256sum -c -
          git worktree add --detach "$RUNNER_TEMP/candidate" bb7c12c75f2389fc696d25b0e2b657ad410daac2
          git -C "$RUNNER_TEMP/candidate" apply --check "$GITHUB_WORKSPACE/proof/input.patch"
          git -C "$RUNNER_TEMP/candidate" apply "$GITHUB_WORKSPACE/proof/input.patch"
          for patch in "$GITHUB_WORKSPACE"/candidate/c5-callback-input/fix*.patch; do
            if [ -f "$patch" ]; then
              git -C "$RUNNER_TEMP/candidate" apply "$patch"
              cp "$patch" "$GITHUB_WORKSPACE/proof/"
            fi
          done
          echo "CANDIDATE=$RUNNER_TEMP/candidate" >> "$GITHUB_ENV"
          echo "PROOF=$GITHUB_WORKSPACE/proof" >> "$GITHUB_ENV"

      - name: Use repository-pinned Rust
        run: |
          cd "$CANDIDATE"
          rustup install
          rustup target add wasm32-unknown-unknown
          rustc --version --verbose | tee "$PROOF/rust.txt"

      - name: Use sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0

      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: c5-callback-input-cargo-${{ runner.os }}-${{ hashFiles('crates/**/Cargo.toml') }}
          restore-keys: |
            c5-worker-presented-cargo-${{ runner.os }}-
            c5-direct-presented-cargo-${{ runner.os }}-
            ${{ runner.os }}-cargo-sources-

      - name: Format and retain exact source
        run: |
          cd "$CANDIDATE"
          cargo fmt --all
          git add -A
          git diff --cached --check
          git write-tree | tee "$PROOF/tree.txt"
          git diff --cached --binary --full-index > "$PROOF/formatted.patch"
          git diff --cached --stat > "$PROOF/stat.txt"
          git archive --format=tar --prefix=source/ "$(cat "$PROOF/tree.txt")" | gzip > "$PROOF/source.tar.gz"

      - name: Execute callback-aware pointer regressions
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          cargo test -p noon --all-features --lib execution_session::input::callback_tests -- --nocapture 2>&1 | tee "$PROOF/callback-input.log"
          cargo test -p noon --all-features --lib live_program::pointer_input_tests -- --nocapture 2>&1 | tee "$PROOF/live-pointer.log"

      - name: Execute repository fast gate
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          bash scripts/check.sh fast bb7c12c75f2389fc696d25b0e2b657ad410daac2 2>&1 | tee "$PROOF/fast.log"

      - name: Compile reduced WASM paths
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          cargo check -p noon --no-default-features --target wasm32-unknown-unknown 2>&1 | tee "$PROOF/wasm-noon.log"
          cargo check -p noon-web --no-default-features --target wasm32-unknown-unknown 2>&1 | tee "$PROOF/wasm-web.log"
          cargo check -p noon-web --features renderer-smoke --target wasm32-unknown-unknown 2>&1 | tee "$PROOF/wasm-renderer.log"
          echo passed > "$PROOF/qualification.txt"

      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: c5-callback-input-proof
          path: proof/
          if-no-files-found: error
          retention-days: 7
