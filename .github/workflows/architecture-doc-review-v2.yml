name: Architecture documentation review v2
on:
  push:
    branches: [work/architecture-doc-review-v2-20260909]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply reviewed documentation changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/architecture_doc_refresh.py')
          text = path.read_text()
          old = '    return text[:i] + replacement + text[j:]\n'
          new = '    if replacement.endswith(end):\n        return text[:i] + replacement + text[j + len(end):]\n    return text[:i] + replacement + text[j:]\n'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          PY
          python3 scripts/architecture_doc_refresh.py
          rm scripts/architecture_doc_refresh.py
          rm .github/workflows/architecture-doc-review-workspace.yml
          rm .github/workflows/architecture-doc-review-v2.yml
      - name: Install D2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/d2lang/d2/releases/download/v0.9.0/d2-v0.9.0-linux-amd64.tar.gz -o "$RUNNER_TEMP/d2.tar.gz"
          echo '5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9  '"$RUNNER_TEMP/d2.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/d2.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/d2-v0.9.0/bin" >> "$GITHUB_PATH"
      - name: Render and qualify
        shell: bash
        run: |
          set -euo pipefail
          d2 fmt docs/diagrams/*.d2
          D2=d2 python3 scripts/architecture_diagrams.py
          D2=d2 python3 scripts/test_architecture_diagrams.py
          D2=d2 python3 scripts/architecture_diagrams.py --check
          node --test web/ci-workflow-topology.test.mjs
          bash scripts/check.sh architecture 8cadad70a9fdbdaf51de49369fb5c98c2d4750e0
          git diff --check
          test "$(find docs/diagrams -maxdepth 1 -name '*.d2' ! -name '_style.d2' | wc -l)" -eq 10
          test "$(find docs/diagrams -maxdepth 1 -name '*.svg' | wc -l)" -eq 10
          test "$(grep -c '^## Browser playground$' README.md)" -eq 1
          test "$(grep -c '^## Phase B — complete common 2D semantics$' docs/architecture.md)" -eq 1
          test "$(grep -c '^## 14. Correctness invariants$' docs/architecture.md)" -eq 1
          ! grep -R -E 'native-execution|wasm-execution|session-control|d6734d2a0626f5c9926e4043ad2017a94f5c8c5a' README.md docs/architecture.md docs/diagrams/*.d2
          grep -q 'revision-publication-lifetime.svg' docs/architecture.md
          grep -q 'locality-propagation.svg' docs/architecture.md
          grep -q 'callback-transaction.svg' docs/architecture.md
          grep -q 'direct-execution-hosts.svg' docs/architecture.md
      - name: Preserve candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noon-architecture-doc-review-final
          path: |
            README.md
            docs/architecture.md
            docs/diagrams/
          retention-days: 7
      - name: Publish clean candidate
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- README.md docs/architecture.md docs/diagrams scripts/architecture_doc_refresh.py .github/workflows/architecture-doc-review-workspace.yml .github/workflows/architecture-doc-review-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree="$(git write-tree)"
          commit="$(git commit-tree "$tree" -p 8cadad70a9fdbdaf51de49369fb5c98c2d4750e0 -m 'docs: clarify architecture contracts and focused views')"
          git push origin "$commit:refs/heads/docs/architecture-clarity-final-20260909"
