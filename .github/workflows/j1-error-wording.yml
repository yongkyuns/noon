name: J1 error wording

on:
  push:
    branches:
      - arch/j1-native-input-signals

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/j1-native-input-signals
      - name: Restore stable timeline error wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/noon-core/src/reactive/signal_timeline.rs')
          text = path.read_text()
          old = 'signal {} cannot be driven by both a signal timeline and an external/native input'
          new = 'signal {} is timeline-driven and cannot also be driven by an external/native input'
          if old not in text:
              raise SystemExit('expected timeline error wording not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/j1-error-wording.yml
      - name: Commit compatibility wording
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/noon-core/src/reactive/signal_timeline.rs .github/workflows/j1-error-wording.yml
          git commit -m 'Preserve timeline-driven error compatibility'
          git push origin HEAD:arch/j1-native-input-signals
