name: Apply G2 shared detached style

on:
  push:
    branches:
      - agent/g2-shared-style-state

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/g2-shared-style-state
      - name: Use stable Rust
        run: |
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt clippy
      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Apply shared style migration
        run: python3 .github/apply-g2-shared-style.py
      - name: Validate shared style integration
        run: |
          cargo fmt --all
          cargo clippy -p noon-web --all-targets -- -D warnings
          cargo test -p noon-web
          cargo check -p noon-web --target wasm32-unknown-unknown
          python3 -m compileall -q web/python
          find web/python -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Build browser package
        env:
          NOON_SKIP_PLAYGROUND_TEST: "1"
          NOON_WASM_SKIP_OPT: "1"
        run: bash scripts/build-web-demo.sh
      - name: Commit integrated change and remove helpers
        run: |
          find web/python -type d -name __pycache__ -prune -exec rm -rf {} +
          rm .github/workflows/apply-g2-shared-style.yml .github/apply-g2-shared-style.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/noon-web/src/authoring_mobject.rs web/python/_manim_semantic_handles.py .github/workflows/apply-g2-shared-style.yml .github/apply-g2-shared-style.py
          git commit -m "Move detached style channels onto shared semantic handles"
          git push origin HEAD:agent/g2-shared-style-state
