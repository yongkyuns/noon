name: Diagnostic Python construct
on:
  push:
    branches: [diagnostic/noon-python-construct-20261023]
permissions:
  contents: write
concurrency:
  group: diagnostic-python-construct
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: "READ_ONLY"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Apply checksum-verified candidate on exact product base
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          data = pathlib.Path('.github/diagnostics/construct-candidate.gz').read_bytes()
          # Normalize two known copy errors in the connector transfer, then
          # require the complete original digest before interpreting any bytes.
          text = base64.b64encode(data).decode().replace('M/kdkbtcJbtcJnj7','M/kdkbtcJnj7').replace('psPlS0l6u','psPlS2l6u')
          data = base64.b64decode(text)
          assert hashlib.sha256(data).hexdigest() == '1c9630cf6926c11504e3ba9bd12b01423c27f79d3955e3e686558bf7a4416a6c'
          patch = gzip.decompress(data)
          subprocess.run(['git','reset','--hard','b70551ab6703e35d4a5a701a18983c0344045ad6'],check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          pathlib.Path('evidence').mkdir()
          pathlib.Path('evidence/product-base.txt').write_text('b70551ab6703e35d4a5a701a18983c0344045ad6\n')
          PY
      - name: Install pinned Rust
        run: rustup install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Format and retain exact candidate
        run: |
          cargo fmt --all
          git diff --check HEAD
          rustc --version --verbose > evidence/rustc.txt
          python3 - <<'PY'
          import subprocess, pathlib, json, hashlib, tarfile
          paths = subprocess.check_output(['git','diff','--name-only','HEAD']).decode().splitlines()
          assert len(paths) == 9, paths
          pathlib.Path('evidence/paths.json').write_text(json.dumps(paths))
          pathlib.Path('evidence/candidate.patch').write_bytes(subprocess.check_output(['git','diff','--binary','HEAD']))
          hashes = {}
          with tarfile.open('evidence/candidate-files.tar.gz','w:gz') as archive:
              for name in paths:
                  data = pathlib.Path(name).read_bytes()
                  hashes[name] = hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
                  archive.add(name,arcname=name)
          pathlib.Path('evidence/file-hashes.json').write_text(json.dumps(hashes,indent=2))
          PY
      - name: Shared demand and interpreter lifecycle regressions
        run: |
          set -o pipefail
          node --test web/prepared-interpreter-driver.test.mjs web/cooperative-preparation-driver.test.mjs web/direct-execution-wake-driver.test.mjs 2>&1 | tee evidence/task-tests.log
          python3 -m unittest discover -s web/python -p test_manim_source_execution.py 2>&1 | tee evidence/source-compiler-tests.log
          cargo test --locked -p noon-web --all-features --lib 2>&1 | tee evidence/web-tests.log
          cargo test --locked -p noon-web --no-default-features --features prepared-prefix --lib prepared_canvas_playback 2>&1 | tee evidence/no-renderer-tests.log
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Build actual prepared canvas
        run: |
          set -o pipefail
          wasm-pack build crates/noon-web --target web --out-dir ../../web/pkg --dev --no-opt --features prepared-prefix,renderer-smoke --locked 2>&1 | tee evidence/wasm-build.log
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.62.1
      - name: Install pinned browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Ordinary Python construct under bounded historical playback
        env:
          NOON_PREPARED_CONSTRUCT_ARTIFACTS: evidence/construct
          NOON_PREPARED_PYTHON_ARTIFACTS: evidence/python
        run: |
          set -o pipefail
          node scripts/prepared-construct-qualification.mjs 2>&1 | tee evidence/construct.log
          node scripts/prepared-python-qualification.mjs 2>&1 | tee evidence/python.log
          node scripts/prepared-canvas-qualification.mjs 2>&1 | tee evidence/canvas.log
          node scripts/prepared-source-qualification.mjs 2>&1 | tee evidence/cooperative.log
      - name: Required repository gate and workflow topology
        run: |
          set -o pipefail
          bash scripts/check.sh fast HEAD 2>&1 | tee evidence/fast-gate.log
          node --test .github/ci/*.test.mjs 2>&1 | tee evidence/ci-topology.log
      - name: Store tested blobs without changing product refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, pathlib, hashlib, urllib.request
          hashes = json.loads(pathlib.Path('evidence/file-hashes.json').read_text())
          blobs = []
          for name, expected in hashes.items():
              data = pathlib.Path(name).read_bytes()
              assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest() == expected
              req = urllib.request.Request('https://api.github.com/repos/yongkyuns/noon/git/blobs',data=json.dumps({'content':data.decode(),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req) as response: result = json.load(response)
              assert result['sha'] == expected
              blobs.append({'path':name,'mode':'100644','type':'blob','sha':expected})
          pathlib.Path('evidence/blobs.json').write_text(json.dumps(blobs,indent=2))
          PY
      - name: Preserve source and evidence including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-construct-qualification
          path: evidence
          if-no-files-found: error
          retention-days: 3
