name: F2 fix OffscreenCanvas resize
on:
  push:
    branches:
      - arch/f2-engine-worker-transport
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Fix F2 OffscreenCanvas resize ownership'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/f2-engine-worker-transport
      - name: Keep canvas bitmap sizing in render worker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('web/execution-worker-client.js')
          text = path.read_text()
          old = '''    const physicalWidth = Math.max(1, Math.round(width * devicePixelRatio));\n    const physicalHeight = Math.max(1, Math.round(height * devicePixelRatio));\n    this.#canvas.width = physicalWidth;\n    this.#canvas.height = physicalHeight;\n    this.#renderWorker.postMessage(\n'''
          new = '''    const physicalWidth = Math.max(1, Math.round(width * devicePixelRatio));\n    const physicalHeight = Math.max(1, Math.round(height * devicePixelRatio));\n    // Once control has moved to OffscreenCanvas, HTMLCanvasElement bitmap sizing\n    // belongs to the render worker. Writing width/height here throws InvalidStateError.\n    this.#renderWorker.postMessage(\n'''
          if old not in text:
              raise SystemExit('resize ownership block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check web/execution-worker-client.js
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/execution-worker-client.js
          git commit -m 'Keep OffscreenCanvas resize in render worker'
          git push origin HEAD:arch/f2-engine-worker-transport
