name: B3 Completed Binding Qualification
on:
  push:
    branches: [b3-matching-bindings-qualification]
permissions:
  contents: write
concurrency:
  group: b3-matching-bindings-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused product changes
        run: python3 .github/b3-binding-qualification.py
      - name: Execute Python completion and adapter regressions
        run: |
          PYTHONPATH=web/python python3 -m unittest discover -s web/python -p 'test_manim_matching_completion_bindings.py' -v
          PYTHONPATH=web/python python3 -m unittest discover -s web/python -p 'test_manim_transform_matching_shapes.py' -v
      - name: Format and publish clean qualification product tree
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          git rm .github/b3-binding-qualification.py .github/workflows/b3-binding-qualification.yml
          git add crates/noon-web/src/canonical_authoring_scene.rs crates/noon-web/src/canonical_authoring_scene/completed_binding_tests.rs web/python/_manim_scene.py web/python/test_manim_matching_completion_bindings.py
          git -c user.name='Yongkyun Shin' -c user.email='4311628+yongkyuns@users.noreply.github.com' commit -m 'fix: reconcile wrappers with completed matching membership'
          git push origin HEAD:refs/heads/b3-matching-bindings-qualification
          echo "Qualified product commit: $(git rev-parse HEAD)"
          echo "Qualified product tree: $(git rev-parse HEAD^{tree})"
      - name: Native completed-binding regressions
        run: cargo test -p noon-web --lib completed_binding -- --nocapture
      - name: Browser WASM boundary compilation
        run: cargo check -p noon-web --target wasm32-unknown-unknown
      - name: Strict web-crate clippy
        run: cargo clippy -p noon-web --all-targets -- -D warnings
      - name: Repository fast gate
        run: bash scripts/check.sh fast
