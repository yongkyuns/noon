name: B3 Completed Binding Qualification
on:
  push:
    branches: [b3-matching-bindings-qualification]
permissions:
  contents: write
concurrency:
  group: b3-matching-bindings-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply compiler-owned matching completion policy and regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          payload = Path('crates/noon-compile/src/semantic_lowering/animation_payload/matching_family_transform_payload.rs')
          tests = Path('crates/noon/src/execution_session/family_transform_tests.rs')
          for path, expected in [(payload, 'b605643bcc4dfc41dea0e460dff325112f5ea9bd'), (tests, '167d07a2bdc7bca1572cdb0f8e852a19ccdb0a0b')]:
              actual = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
              assert actual == expected, (str(path), actual)
          old = '    let mut stable_tracks = matched.stable_tracks().to_vec();\n'
          new = old + '''    // Matching cleanup restores its source; only the original detached target
              // enters the scene. Do not commit ordinary Transform destinations or
              // retain padding opacity on the removed source. Earlier Succession
              // children still publish their own endpoints, preserving the source
              // state captured when this matching child activated.
              for stable in &mut stable_tracks {
                  stable.track.completion = SemanticAnimationCompletion::Release;
                  stable.retain_effective = false;
              }
          '''
          text = payload.read_text()
          assert text.count(old) == 1
          payload.write_text(text.replace(old, new))
          text = tests.read_text()
          start = text.index('fn matching_family_succession_uses_completed_prior_morph_for_activation_key()')
          end = text.index('\n#[test]\nfn matching_family_completion_appends_target_in_same_z_painter_order()', start)
          section = text[start:end]
          insert_at = section.rfind('\n}')
          section = section[:insert_at] + '''
              // Cleanup restores the matching child's activation-effective source,
              // not the authored triangle from before the earlier Morph child.
              let restored = store.semantic_object_state_checked(source_leaf).unwrap();
              let prior_endpoint = store.semantic_object_state_checked(morph_target).unwrap();
              assert_eq!(restored.content, prior_endpoint.content);
              assert_eq!(restored.transform, prior_endpoint.transform);
              assert_eq!(restored.style, prior_endpoint.style);
              let mut readd = SemanticMutationTransaction::new();
              readd.add_member(root, source);
              session.apply_semantic_transaction(&mut store, readd).unwrap();
              session.advance_to(segment.end_time() + 0.25).unwrap();
              let source_index = session.runtime.frame_index_for_object(source_object).unwrap();
              assert_eq!(session.frame().objects[source_index].transform.translation.x, 0.0);
              assert_eq!(session.frame().objects[source_index].appearance, 1.0);
          ''' + section[insert_at:]
          text = text[:start] + section + text[end:]
          text += '''
          #[test]
          fn matching_family_cleanup_restores_matched_padded_and_unmatched_sources() {
              let mut store = SemanticStore::new();
              let sources = [
                  matching_path_object(&mut store, matching_triangle(), -3.0),
                  matching_path_object(&mut store, matching_triangle(), 0.0),
                  matching_path_object(&mut store, matching_kite(), 3.0),
              ];
              let source = family(&mut store, &sources);
              let geometry = store.insert_geometry_path(matching_triangle()).unwrap();
              let mut target_state = SemanticObjectState::new(StoredGeometry::Resource(geometry));
              target_state.transform.translation = SemanticVec3::new(6.0, 0.0, 0.0);
              target_state.style.fill = Some(noon_core::SemanticPaint::Solid(noon_core::Color::RED));
              target_state.style.fill_opacity = 0.5;
              let target_leaf = store.insert_semantic_object(target_state);
              let target = family(&mut store, &[target_leaf]);
              let root = family(&mut store, &[source]);
              let before = sources.map(|node| store.semantic_object_state_checked(node).unwrap().clone());
              let mut session = ExecutionSession::from_semantic_root(&store, root).unwrap();
              let execution_ids = sources.map(|node| session.execution_index.execution_object_id(node).unwrap());
              let initial_rows = execution_ids.map(|id| {
                  let index = session.runtime.frame_index_for_object(id).unwrap();
                  session.frame().objects[index].clone()
              });
              let request = SemanticCompositionRequest::MatchingFamilyTransformTo {
                  source,
                  target_state: target,
                  options: AnimationOptions::new().run_time(1.0).rate_func(RateFunction::Linear),
              };
              let segment = session.declare_and_activate_composition(
                  &mut store, root, &request, AnimationOptions::new(),
              ).unwrap();
              session.advance_segment_to(segment, 0.5).unwrap();
              let padded_index = session.runtime.frame_index_for_object(execution_ids[1]).unwrap();
              let leftover_index = session.runtime.frame_index_for_object(execution_ids[2]).unwrap();
              assert!(session.frame().objects[padded_index].appearance < 1.0);
              assert!(session.frame().objects[leftover_index].appearance < 1.0);
              session.advance_segment_to(segment, segment.end_time()).unwrap();
              session.complete_segment(&mut store, segment).unwrap();
              for (node, expected) in sources.iter().zip(&before) {
                  assert_eq!(store.semantic_object_state_checked(*node).unwrap(), expected);
              }
              assert_eq!(store.semantic_family_members_checked(root).unwrap(), &[target]);
              let mut readd = SemanticMutationTransaction::new();
              readd.add_member(root, source);
              session.apply_semantic_transaction(&mut store, readd).unwrap();
              session.advance_to(segment.end_time() + 0.25).unwrap();
              for (id, expected) in execution_ids.iter().zip(initial_rows) {
                  let index = session.runtime.frame_index_for_object(*id).unwrap();
                  let restored = &session.frame().objects[index];
                  assert!(session.frame().is_present(index));
                  assert_eq!(restored.transform, expected.transform);
                  assert_eq!(restored.style, expected.style);
                  assert_eq!(restored.appearance, expected.appearance);
              }
          }
          '''
          tests.write_text(text)
          PY
      - name: Execute Python completion and adapter regressions
        run: |
          PYTHONPATH=web/python python3 -m unittest discover -s web/python -p 'test_manim_matching_completion_bindings.py' -v
          PYTHONPATH=web/python python3 -m unittest discover -s web/python -p 'test_manim_transform_matching_shapes.py' -v
      - name: Format and publish clean candidate product tree
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          git rm .github/workflows/b3-binding-qualification.yml
          git add crates/noon-compile/src/semantic_lowering/animation_payload/matching_family_transform_payload.rs crates/noon/src/execution_session/family_transform_tests.rs
          git -c user.name='Yongkyun Shin' -c user.email='4311628+yongkyuns@users.noreply.github.com' commit -m 'fix: restore matching sources through release-only completion'
          git push origin HEAD:refs/heads/b3-matching-bindings-qualification
          echo "Candidate product commit: $(git rev-parse HEAD)"
          echo "Candidate product tree: $(git rev-parse HEAD^{tree})"
      - name: Native completed-binding regressions
        run: cargo test -p noon-web --lib completed_binding -- --nocapture
      - name: Native matching lifecycle regressions
        run: cargo test -p noon --lib matching_family -- --nocapture
      - name: Browser WASM boundary compilation
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p noon-web --target wasm32-unknown-unknown
      - name: Strict web-crate clippy
        run: cargo clippy -p noon-web --all-targets -- -D warnings
      - name: Repository fast gate
        run: bash scripts/check.sh fast
