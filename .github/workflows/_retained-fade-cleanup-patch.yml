name: Ephemeral retained FadeOut cleanup patch

on:
  push:
    branches:
      - bot/retained-fade-cleanup

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      NOON_SKIP_PLAYGROUND_TEST: "1"
      NOON_WASM_SKIP_OPT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact retained FadeOut cleanup patch
        run: |
          python3 scripts/_retained_fade_cleanup_patch.py
          rm .github/workflows/_retained-fade-cleanup-patch.yml
          rm scripts/_retained_fade_cleanup_patch.py

      - name: Use stable Rust
        run: |
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Build browser package
        run: bash scripts/build-web-demo.sh

      - name: Install browser smoke dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium

      - name: Validate retained FadeOut cleanup
        run: node scripts/retained-text-animation-smoke.mjs

      - name: Commit validated consumer
        run: |
          git config user.name "Noon CI patch"
          git config user.email "actions@users.noreply.github.com"
          git add web/python/_manim_retained_animate.py scripts/retained-text-animation-smoke.mjs
          git diff --cached --check
          git commit -m "Restore retained FadeOut canonical state"
          git push origin HEAD:bot/retained-fade-cleanup
