name: C2 pointer context finalization
on:
  push:
    branches: [work/c2-native-pointer-adapter-20260918]
    paths: [.github/workflows/c2-pointer-context-final.yml]
permissions:
  contents: write
jobs:
  finish-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pin conversion to the configured publication
        shell: python
        run: |
          from pathlib import Path
          def rep(text, old, new):
              assert text.count(old) == 1, (old, text.count(old))
              return text.replace(old, new, 1)
          p = Path('crates/noon-native/src/pointer_input.rs')
          s = p.read_text()
          old = '        let position = pointer_position(surface, logical_size, self.execution.camera()?)?;\n        self.dispatch_pointer_kind(NativePointerInputKind::Move(position))?;'
          new = '''        if !surface.x.is_finite() || !surface.y.is_finite() {
                      return Err(NativeHostError::Platform("native pointer coordinates must be finite".to_owned()));
                  }
                  if self.next_input_sequence == u64::MAX {
                      return Err(NativeHostError::Platform("native input event sequence exhausted".to_owned()));
                  }
                  // Binding setup can reset a button-driven camera. Read the
                  // camera only afterwards, so conversion and token describe
                  // the same effective publication. Invalid raw data never binds.
                  if !self.ensure_pointer_input()? {
                      return Ok(());
                  }
                  let position = pointer_position(surface, logical_size, self.execution.camera()?)?;
                  self.dispatch_pointer_kind(NativePointerInputKind::Move(position))?;'''
          s = rep(s, old, new)
          s = rep(s, 'if !logical.x.is_finite() || !logical.y.is_finite() {', 'if !logical.x.is_finite() || !logical.y.is_finite()\n        || (size.width > 0 && logical.x <= 0.0)\n        || (size.height > 0 && logical.y <= 0.0) {')
          p.write_text(s)
          p = Path('crates/noon-native/src/pointer_input/tests.rs')
          s = p.read_text()
          s = rep(s, 'for scale in [0.0, -1.0, f64::NAN, f64::INFINITY, f64::MIN_POSITIVE] {', 'for scale in [0.0, -1.0, f64::NAN, f64::INFINITY, f64::MIN_POSITIVE, f64::MAX] {')
          old = 'fn nonfinite_or_unrepresentable_input_leaves_publication_sequence_and_cache_unchanged() {\n    let mut f = Fixture::new();'
          new = old + '\n    assert!(f.app.dispatch_pointer_position(PhysicalPosition::new(f64::NAN, 0.0), SIZE, 1.0).is_err());\n    assert!(!f.app.pointer.configured);'
          s = rep(s, old, new)
          p.write_text(s)
      - name: Format and publish code-only snapshot
        run: |
          cargo fmt --all
          git rm .github/workflows/c2-pointer-context-final.yml
          git add crates/noon-native/src/pointer_input.rs crates/noon-native/src/pointer_input/tests.rs
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'C2: bind before camera conversion and reject logical-size underflow'
          git push origin HEAD:refs/heads/work/c2-native-pointer-adapter-20260918
