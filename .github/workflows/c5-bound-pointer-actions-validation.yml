name: C5 bound pointer action qualification

on:
  push:
    branches: [validation/c5-bound-pointer-actions-20260924]
    paths:
      - crates/**
      - scripts/validation/c5-bound-pointer-actions.py
      - .github/workflows/c5-bound-pointer-actions-validation.yml
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: c5-bound-pointer-actions
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      BASE_SHA: 2ccf83664b51f4bc973e01736acf1fae138d33ae
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Reconstruct exact clean source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/c5-click-proof
          python3 scripts/validation/c5-bound-pointer-actions.py
          rustup install
          rustc --version --verbose > /tmp/c5-click-proof/rust-version.txt
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          git read-tree "$BASE_SHA"
          while IFS= read -r file; do git add "$file"; done < /tmp/c5-click-proof/paths.txt
          git diff --cached --name-only "$BASE_SHA" | diff -u /tmp/c5-click-proof/paths.txt -
          git write-tree > /tmp/c5-click-proof/tree.txt
          git diff --cached --binary "$BASE_SHA" > /tmp/c5-click-proof/source.patch
          git diff --cached --stat "$BASE_SHA" > /tmp/c5-click-proof/source.stat
          git archive "$(cat /tmp/c5-click-proof/tree.txt)" | gzip > /tmp/c5-click-proof/source.tar.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          candidate=$(git commit-tree "$(cat /tmp/c5-click-proof/tree.txt)" -p "$BASE_SHA" -m 'C5: authored click actions through shared input and runtime ownership')
          git read-tree "$GITHUB_SHA"
          git checkout --detach --force "$candidate"
          test ! -e .github/workflows/c5-bound-pointer-actions-validation.yml
          test "$(git rev-parse HEAD^{tree})" = "$(cat /tmp/c5-click-proof/tree.txt)"
          git diff --exit-code
      - name: Authored bindings and real click action regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p noon-core --lib pointer_action_tests -- --nocapture 2>&1 | tee /tmp/c5-click-proof/semantic.log
          cargo test -p noon --no-default-features --lib live_session::pointer_actions::tests -- --nocapture 2>&1 | tee /tmp/c5-click-proof/actions.log
          cargo test -p noon --no-default-features --lib execution_session::selection::tests -- --nocapture 2>&1 | tee /tmp/c5-click-proof/selection.log
      - name: Omitted dispatch negative control
        shell: bash
        run: |
          set -euo pipefail
          file=crates/noon/src/live_session/pointer_actions.rs
          cp "$file" /tmp/c5-click-good.rs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/noon/src/live_session/pointer_actions.rs')
          s = p.read_text()
          old = 'let action = self.dispatch_pointer_click(&receipt);'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'let action = Ok(PointerClickActionOutcome::None);'))
          PY
          set +e
          cargo test -p noon --no-default-features --lib live_session::pointer_actions::tests::accepted_click_activates_real_indicate_without_selection_or_authored_time -- --exact --nocapture > /tmp/c5-click-proof/negative.log 2>&1
          result=$?
          set -e
          cp /tmp/c5-click-good.rs "$file"
          test "$result" -ne 0
          grep -F 'test result: FAILED. 0 passed; 1 failed' /tmp/c5-click-proof/negative.log
          cargo test -p noon --no-default-features --lib live_session::pointer_actions::tests -- --nocapture 2>&1 | tee /tmp/c5-click-proof/restored.log
      - name: Existing Rust, WASM and repository fast gates
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p noon-core -p noon-compile --lib 2>&1 | tee /tmp/c5-click-proof/core-compile.log
          cargo test -p noon --no-default-features --lib 2>&1 | tee /tmp/c5-click-proof/noon.log
          cargo test -p noon-runtime --lib property_animation::tests 2>&1 | tee /tmp/c5-click-proof/runtime.log
          cargo check -p noon-web --no-default-features --target wasm32-unknown-unknown 2>&1 | tee /tmp/c5-click-proof/wasm.log
          node --test web/*.test.mjs scripts/*contract*.test.mjs .github/ci/*.test.mjs 2>&1 | tee /tmp/c5-click-proof/node.log
          bash scripts/check.sh fast "$BASE_SHA" 2>&1 | tee /tmp/c5-click-proof/fast.log
      - name: Publish exact tested product source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git rev-parse HEAD^{tree})" = "$(cat /tmp/c5-click-proof/tree.txt)"
          branch="staging/c5-bound-pointer-actions-tested-${GITHUB_RUN_ID}"
          test -z "$(git ls-remote --heads origin "refs/heads/$branch")"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > /tmp/c5-click-proof/commit.txt
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: c5-bound-pointer-actions-proof
          path: /tmp/c5-click-proof
          retention-days: 7
          if-no-files-found: error
