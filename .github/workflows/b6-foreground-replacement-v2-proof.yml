name: B6 foreground replacement v2 proof
on:
  push:
    branches: [codex/validate-b6-foreground-replacement-v2]
permissions:
  contents: write
concurrency:
  group: b6-foreground-replacement-v2-proof
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_RW_MODE: "READ_ONLY"
  BASE: 99a01edcec3f479fc35fdd07ffe7d743a45371d2
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Use repository-pinned Rust
        run: |
          rustup install
          rustup show active-toolchain
          rustc --version --verbose
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Format candidate and verify exact repair scope
        run: |
          set -euo pipefail
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add               crates/noon-core/src/semantic_store/semantic_scene_restructure.rs               crates/noon-core/src/semantic_store/semantic_scene_restructure/foreground.rs               crates/noon-core/src/semantic_store/semantic_scene_restructure/foreground_tests.rs               crates/noon/tests/foreground_membership.rs
            git commit -m 'Format foreground replacement repair'
            git push origin HEAD:refs/heads/codex/validate-b6-foreground-replacement-v2
          fi
          git diff --check "$BASE" HEAD
          python3 - <<'PY'
          import os, subprocess
          allowed = {
              'crates/noon-core/src/semantic_store/semantic_scene_restructure.rs',
              'crates/noon-core/src/semantic_store/semantic_scene_restructure/foreground.rs',
              'crates/noon-core/src/semantic_store/semantic_scene_restructure/foreground_tests.rs',
              'crates/noon/tests/foreground_membership.rs',
              '.github/workflows/b6-foreground-replacement-v2-proof.yml',
          }
          actual=set(subprocess.check_output(['git','diff','--name-only',os.environ['BASE'],'HEAD'],text=True).splitlines())
          assert actual == allowed, actual ^ allowed
          PY
      - name: Prove the old planner fails the new regressions
        run: |
          set -euo pipefail
          git checkout "$BASE" --             crates/noon-core/src/semantic_store/semantic_scene_restructure.rs             crates/noon-core/src/semantic_store/semantic_scene_restructure/foreground.rs
          set +e
          cargo test -p noon-core --lib semantic_scene_restructure::foreground_tests -- --nocapture 2>&1 | tee /tmp/before.log
          status=${PIPESTATUS[0]}
          set -e
          git checkout HEAD --             crates/noon-core/src/semantic_store/semantic_scene_restructure.rs             crates/noon-core/src/semantic_store/semantic_scene_restructure/foreground.rs
          test "$status" -ne 0
          grep -F 'replacing_partially_demoted_family_retires_descendant_declarations' /tmp/before.log
          grep -F 'replacing_nested_family_keeps_only_unaffected_foreground_branches' /tmp/before.log
          grep -F 'replacing_declared_family_prunes_independent_descendants_at_source_slot' /tmp/before.log
          grep -F 'replacing_nonforeground_source_preserves_existing_foreground_target' /tmp/before.log
      - name: Run repaired foreground and root planner suites
        run: |
          cargo test -p noon-core --lib semantic_scene_restructure -- --nocapture
          cargo test -p noon-core --lib semantic_transaction::foreground_tests -- --nocapture
          cargo test -p noon --no-default-features --test foreground_membership --test foreground_declarations --test root_order_acceptance --test root_order_transaction_regressions -- --nocapture
      - name: Check direct Rust WASM compilation
        run: cargo check -p noon --no-default-features --target wasm32-unknown-unknown
      - name: Run complete repository Rust gate
        run: bash scripts/check.sh rust "$BASE"
