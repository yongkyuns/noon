name: B6 scene-order wrapper bootstrap

on:
  push:
    branches:
      - codex/b6-scene-order-wrappers

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/b6-scene-order-wrappers
          fetch-depth: 0
      - name: Apply exact wrapper patch
        run: python scripts/b6_scene_order_wrapper_bootstrap.py
      - name: Format and test
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p noon-web canonical_membership_bring_to_back_routes_through_shared_authority
          PYTHONPATH=web/python python -m unittest web/python/test_scene_painter_order.py
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/noon-web/src/canonical_authoring_scene.rs web/python/noon.py
          git commit -m "Project scene painter order through Python wrappers"
          git push origin HEAD:codex/b6-scene-order-wrappers
