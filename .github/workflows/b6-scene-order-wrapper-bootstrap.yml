name: B6 scene-order wrapper bootstrap

on:
  push:
    branches:
      - codex/b6-scene-order-wrappers

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/b6-scene-order-wrappers
          fetch-depth: 0
      - name: Merge current master
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin master
          git merge --no-edit origin/master
      - name: Validate synchronized branch
        run: |
          cargo fmt --all -- --check
          cargo check -p noon-web
          PYTHONPATH=web/python python -m unittest web/python/test_scene_painter_order.py
          python -m py_compile parity/manim-v0.21/core-examples/scene_painter_order.py web/python/examples/manim_compatible_scene_painter_order.py
          python -m json.tool parity/manim-v0.21/manifest.json >/dev/null
          git diff --check
      - name: Push synchronized branch
        run: git push origin HEAD:codex/b6-scene-order-wrappers
