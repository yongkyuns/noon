name: Apply O1 semantic family integration

on:
  push:
    branches:
      - agent/o1-semantic-family-handles

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/o1-semantic-family-handles
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use stable Rust and wasm target
        run: |
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Apply semantic family patch
        run: |
          python .github/apply-o1-semantic-family.py
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/manim-compat-smoke.mjs")
          text = path.read_text()
          text = text.replace(
              'assert len(family) == 2 and int(rust.memberCount) == 2',
              'assert len(family) == 3 and int(rust.memberCount) == 3',
          )
          text = text.replace(
              'assert.equal(semanticFamily.document.objects.length, 2);',
              'assert.equal(semanticFamily.document.objects.length, 3);',
          )
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Validate Rust and Python facade
        run: |
          cargo fmt --all -- --check
          cargo clippy -p noon-core -p noon-web --all-targets -- -D warnings
          cargo test -p noon-core -p noon-web
          cargo check -p noon-web --target wasm32-unknown-unknown
          python -m compileall -q web/python scripts/manim-differential.py
      - name: Install ManimCE reference
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config
          python -m pip install --disable-pip-version-check "manim==0.21.0"
      - name: Run 39-case differential suite
        run: python scripts/manim-differential.py
      - name: Build browser package
        env:
          NOON_SKIP_PLAYGROUND_TEST: "1"
          NOON_WASM_SKIP_OPT: "1"
        run: bash scripts/build-web-demo.sh
      - name: Run browser compatibility smoke
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
          node scripts/manim-compat-smoke.mjs
      - name: Commit validated family migration and remove helpers
        run: |
          find web scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/noon-core/src/semantic_store.rs crates/noon-web/src/authoring_mobject.rs web/python-worker.js web/python/_manim_compat.py web/python/_manim_semantic_handles.py scripts/manim-differential.py scripts/manim-compat-smoke.mjs
          git rm .github/apply-o1-semantic-family.py .github/workflows/apply-o1-semantic-family.yml
          git commit -m "Move Manim family identity into shared semantic store"
          git push origin HEAD:agent/o1-semantic-family-handles
