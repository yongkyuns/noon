name: Agent morph implementation gate v4

on:
  pull_request:
    paths:
      - .github/workflows/agent-morph-pr-v4.yml

permissions:
  contents: write

jobs:
  implement-morph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/browser-realtime-architecture
          fetch-depth: 0

      - name: Apply reviewed morph transform
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/agent-morph-once.yml').read_text().splitlines()
          start = lines.index("          python - <<'PY'") + 1
          end = lines.index("          PY", start)
          body = [line[10:] if line.startswith('          ') else line for line in lines[start:end]]
          Path('/tmp/apply_morph.py').write_text('\n'.join(body) + '\n')
          PY
          python /tmp/apply_morph.py

          python - <<'PY'
          from pathlib import Path

          p = Path('web/python/noon.py')
          text = p.read_text()
          old = '''    ) -> Scene:\n        self._add_scalar_track(\n            obj,\n            "reveal",\n            _unit_interval("from", from_),\n'''
          new = '''    ) -> Scene:\n        if isinstance(obj, Object) and obj._owner is self._owner:\n            geometry = self._objects[obj.id]["geometry"]\n            vector_path = geometry.get("vector_path")\n            if vector_path is not None and "morph_target" in vector_path:\n                raise ValueError(\n                    "morph and reveal currently share one normalized path channel"\n                )\n        self._add_scalar_track(\n            obj,\n            "reveal",\n            _unit_interval("from", from_),\n'''
          if old not in text:
              raise SystemExit('animate_reveal insertion point missing')
          p.write_text(text.replace(old, new, 1))

          p = Path('crates/noon-render-wgpu/src/gpu.rs')
          text = p.read_text()
          old = '''        let path_vertex_layout = path_vertex_layout();\n        assert_eq!(path_vertex_layout.array_stride, 12);\n        assert_eq!(path_vertex_layout.step_mode, wgpu::VertexStepMode::Vertex);\n        assert_eq!(path_vertex_layout.attributes.len(), 2);\n        assert_eq!(\n            path_vertex_layout.attributes[1].format,\n            wgpu::VertexFormat::Uint32\n        );\n\n        let path_instance_layout = path_instance_layout();\n        assert_eq!(path_instance_layout.array_stride, 72);\n        assert_eq!(\n            path_instance_layout.step_mode,\n            wgpu::VertexStepMode::Instance\n        );\n        assert_eq!(path_instance_layout.attributes.len(), 7);\n        assert_eq!(path_instance_layout.attributes[0].shader_location, 2);\n        assert_eq!(path_instance_layout.attributes[6].shader_location, 8);\n'''
          new = '''        let path_vertex_layout = path_vertex_layout();\n        assert_eq!(path_vertex_layout.array_stride, 20);\n        assert_eq!(path_vertex_layout.step_mode, wgpu::VertexStepMode::Vertex);\n        assert_eq!(path_vertex_layout.attributes.len(), 3);\n        assert_eq!(\n            path_vertex_layout.attributes[1].format,\n            wgpu::VertexFormat::Float32x2\n        );\n        assert_eq!(\n            path_vertex_layout.attributes[2].format,\n            wgpu::VertexFormat::Uint32\n        );\n\n        let path_instance_layout = path_instance_layout();\n        assert_eq!(path_instance_layout.array_stride, 72);\n        assert_eq!(\n            path_instance_layout.step_mode,\n            wgpu::VertexStepMode::Instance\n        );\n        assert_eq!(path_instance_layout.attributes.len(), 7);\n        assert_eq!(path_instance_layout.attributes[0].shader_location, 3);\n        assert_eq!(path_instance_layout.attributes[6].shader_location, 9);\n'''
          if old not in text:
              raise SystemExit('path layout assertion block missing')
          p.write_text(text.replace(old, new, 1))
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          PYTHONPATH=web/python python -m unittest web/python/test_noon.py

      - name: Publish tested implementation
        shell: bash
        run: |
          rm .github/workflows/agent-morph-once.yml \
             .github/workflows/agent-morph-once-v2.yml \
             .github/workflows/agent-morph-pr.yml \
             .github/workflows/agent-morph-pr-v4.yml
          git config user.name "Yongkyun Shin"
          git config user.email "yongkyuns@gmail.com"
          git add -- \
            crates/noon-core/src/lib.rs \
            crates/noon-geometry/src/tessellation.rs \
            crates/noon-render-wgpu/src/lib.rs \
            crates/noon-render-wgpu/src/gpu.rs \
            crates/noon-render-wgpu/src/path.wgsl \
            web/python/noon.py \
            web/python/test_noon.py \
            web/python/demo_scene.py \
            web/main.js \
            docs/path-morphing.md \
            .github/workflows/agent-morph-once.yml \
            .github/workflows/agent-morph-once-v2.yml \
            .github/workflows/agent-morph-pr.yml \
            .github/workflows/agent-morph-pr-v4.yml
          git commit -m "Implement playable fixed-topology path morphing"
          git push origin HEAD:agent/browser-realtime-architecture
