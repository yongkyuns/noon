name: Glow raster operator
on:
  pull_request:
    paths:
      - 'crates/noon-render-wgpu/src/gpu/glow_filter*'
      - 'crates/noon-render-wgpu/src/gpu/glow_filter/**'
      - 'crates/noon-render-wgpu/tests/glow_filter.rs'
      - 'tests/visual-effects/check_mask_precision.py'
      - '.github/workflows/glow-raster-operator.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: glow-raster-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      NOON_GLOW_BACKEND: vulkan
      XDG_RUNTIME_DIR: /tmp/noon-glow-xdg
    steps:
      - uses: actions/checkout@v7
      - name: Use repository-pinned Rust
        run: |
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --component clippy --component rustfmt
          rustc --version --verbose
      - name: Prepare software Vulkan raster adapter
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
      - name: Validate resource and kernel contracts
        run: cargo test -p noon-render-wgpu --test glow_filter
      - name: Compare real raster output with independent Gaussian oracle
        run: cargo test -p noon-render-wgpu --test glow_filter native_gaussian_pixels_and_retained_updates -- --ignored --nocapture
      - name: Check renderer warnings
        run: cargo clippy -p noon-render-wgpu --test glow_filter --all-features -- -D warnings
