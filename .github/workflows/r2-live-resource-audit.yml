name: R2 live resource admission audit
on:
  push:
    branches: [codex/1292-r2-live-resource-audit]
permissions:
  contents: read
concurrency:
  group: r2-live-resource-admission-audit
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: 'true'
  SCCACHE_GHA_RW_MODE: READ_ONLY
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: source
          ref: a6155ac6f96788d257102b956cbbd4d7fd469e66
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: r2-audit-sources-${{ runner.os }}-${{ hashFiles('source/Cargo.toml', 'source/crates/**/Cargo.toml') }}
          restore-keys: |
            r2-sources-${{ runner.os }}-
            Linux-cargo-sources-
            provider-sources-Linux-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Test contract on candidate and existing master without production edits
        working-directory: source
        shell: bash
        run: |
          mkdir -p ../evidence
          rustc --version > ../evidence/toolchain.txt
          cargo --version >> ../evidence/toolchain.txt
          cp ../tooling/.github/r2-live-resource-audit.rs ../evidence/live_creation_resource_atomicity.rs
          sha256sum ../evidence/live_creation_resource_atomicity.rs > ../evidence/test-sha256.txt
          result=0
          for spec in candidate:a6155ac6f96788d257102b956cbbd4d7fd469e66 master:5b56124312657c0959e1ca3936930cad0fe7e240; do
            label=${spec%%:*}
            revision=${spec#*:}
            rm -f crates/noon/tests/live_creation_resource_atomicity.rs
            git checkout --detach "$revision"
            test "$(git rev-parse HEAD)" = "$revision"
            test -z "$(git status --porcelain --untracked-files=no)"
            git rev-parse HEAD HEAD^{tree} > "../evidence/$label-revision.txt"
            sha256sum crates/noon/src/live_session.rs crates/noon/src/semantic_mobject.rs crates/noon/src/execution_session/publication.rs > "../evidence/$label-source-sha256.txt"
            cp ../tooling/.github/r2-live-resource-audit.rs crates/noon/tests/live_creation_resource_atomicity.rs
            set +e
            cargo test -p noon --no-default-features --test live_creation_resource_atomicity -- --nocapture > "../evidence/$label-tests.log" 2>&1
            status=$?
            set -e
            if ! grep -q '^running 2 tests$' "../evidence/$label-tests.log"; then
              echo "ERROR: both runtime probes were not executed on $label" | tee -a "../evidence/$label-tests.log"
              status=99
            fi
            printf '%s %s exit=%s\n' "$label" "$revision" "$status" | tee -a ../evidence/status.txt
            tail -90 "../evidence/$label-tests.log"
            if test "$status" -ne 0; then result=1; fi
            git diff --exit-code
          done
          exit "$result"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r2-live-resource-admission-audit
          path: evidence/
          retention-days: 7
          if-no-files-found: error
