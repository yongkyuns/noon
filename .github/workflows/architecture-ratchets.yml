name: Architecture Ratchets

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      base:
        description: Existing comparison commit or ref (no automatic fallback)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: architecture-ratchets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-growth:
    name: Architecture constraints do not regress
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Report guardrail prerequisites
        run: |
          python3 --version
          cargo --version

      - name: Validate guardrail scripts
        run: |
          for script in \
            scripts/check.sh \
            scripts/check-architecture.sh \
            scripts/check-architecture.test.sh \
            scripts/layer-dependency-ratchet.sh \
            scripts/layer-dependency-ratchet.test.sh \
            scripts/architecture-ratchet.sh \
            scripts/architecture-ratchet.test.sh \
            scripts/noon-core-module-ownership-ratchet.sh \
            scripts/noon-core-module-ownership-ratchet.test.sh \
            scripts/renderer-host-boundary-ratchet.sh \
            scripts/transient-presentation-ratchet.sh \
            scripts/transient-presentation-ratchet.test.sh \
            scripts/active-perf-frontend-ratchet.sh \
            scripts/active-perf-frontend-ratchet.test.sh; do
            bash -n "$script"
          done

      - name: Exercise architecture guardrails
        run: |
          bash scripts/architecture-ratchet.test.sh
          bash scripts/noon-core-module-ownership-ratchet.test.sh
          bash scripts/transient-presentation-ratchet.test.sh
          bash scripts/active-perf-frontend-ratchet.test.sh
          bash scripts/layer-dependency-ratchet.test.sh
          python3 scripts/test_check_entrypoint.py
          bash scripts/check-architecture.test.sh

      - name: Reject architecture regressions through the local entrypoint
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          REQUESTED_BASE: ${{ inputs.base }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            workflow_dispatch) base="$REQUESTED_BASE" ;;
            *) echo "Unsupported architecture comparison event" >&2; exit 2 ;;
          esac
          bash scripts/check.sh architecture "$base"
