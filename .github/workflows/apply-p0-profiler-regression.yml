name: Add sustained GPU profiler regression

on:
  push:
    branches: [perf/p0-gpu-profiler-range]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/p0-gpu-profiler-range
          fetch-depth: 0
      - name: Add sustained profiler CI gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          old = '''      - name: Test mixed painter order in WebGPU\n        if: matrix.backend == 'webgpu'\n        run: node scripts/painter-order-browser-smoke.mjs\n\n      - name: Upload browser smoke screenshots\n'''
          new = '''      - name: Test mixed painter order in WebGPU\n        if: matrix.backend == 'webgpu'\n        run: node scripts/painter-order-browser-smoke.mjs\n\n      - name: Test sustained WebGPU timestamp profiling\n        if: matrix.backend == 'webgpu'\n        env:\n          NOON_PERF_BACKEND: webgpu\n          NOON_PERF_COUNTS: '10000'\n          NOON_PERF_LAYOUTS: fixed\n          NOON_PERF_WARMUP: '8'\n          NOON_PERF_FRAMES: '64'\n          NOON_PERF_PORT: '4188'\n        run: node scripts/perf-profile.mjs\n\n      - name: Upload browser smoke screenshots\n'''
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit permanent regression gate
        shell: bash
        run: |
          rm .github/workflows/apply-p0-profiler-regression.yml
          git config user.name "Yongkyun Shin"
          git config user.email "yongkyuns@gmail.com"
          git add -A
          git commit -m "Gate sustained WebGPU timestamp profiling"
          git push origin HEAD:perf/p0-gpu-profiler-range
