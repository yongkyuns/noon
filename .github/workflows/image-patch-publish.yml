name: Prepare image workflow merge resolution (temporary)
on:
  push:
    branches: [codex/b2-image-workspace-bootstrap]
    paths: [.github/workflows/image-patch-publish.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prepare the checked inventory blob without moving any product ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api 'repos/yongkyuns/noon/contents/web/ci-workflow-topology.test.mjs?ref=6aad6282be4a6ef5dbc557087656b55ab3f1d7c7' --jq .content | base64 --decode > /tmp/inventory.mjs
          python3 - <<'PY'
          import hashlib, json, pathlib
          path = pathlib.Path('/tmp/inventory.mjs')
          text = path.read_text()
          anchor = '  ["noon-agent-foundation.yml", "agent-authoring"],\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + '  ["image-raster-qualification.yml", "renderer"],\n')
          data = text.encode()
          digest = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert digest == 'd8eb2e5b6bdcdccffb5a7cf0b6ecd02312dabd10', digest
          pathlib.Path('/tmp/blob.json').write_text(json.dumps({'content': text, 'encoding': 'utf-8'}))
          PY
          gh api --method POST repos/yongkyuns/noon/git/blobs --input /tmp/blob.json > /tmp/inventory-result.json
          test "$(jq -r .sha /tmp/inventory-result.json)" = d8eb2e5b6bdcdccffb5a7cf0b6ecd02312dabd10
          cat /tmp/inventory-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: noon-image-merge-inventory
          path: /tmp/inventory-result.json
          retention-days: 2
