name: Final sync PR191 with master

on:
  push:
    branches:
      - parity/manim-create-partial

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parity/manim-create-partial
          fetch-depth: 32
      - name: Fetch current master
        run: git fetch --depth=32 origin master
      - name: Merge current master
        run: git merge --no-edit origin/master
      - name: Format
        run: cargo fmt --all -- --check
      - name: Validate overlapping geometry/Create slices
        run: |
          cargo test -p noon-geometry
          cargo test -p noon-render-wgpu
          cargo test -p noon --test manim_style_defaults
          python3 web/python/test_manim_geometry_defaults.py
      - name: Remove temporary sync workflow
        run: rm .github/workflows/_sync-pr191-final-master.yml
      - name: Commit synchronized branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "merge: sync Create parity with current master"
          fi
          git push origin HEAD:parity/manim-create-partial
