name: Temporary current-master unified binding replay

on:
  push:
    branches:
      - tmp/367-unified-scene-binding-current

permissions:
  contents: write

jobs:
  validate-and-regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/367-unified-scene-binding-current
      - name: Validate Python authoring
        run: |
          python -m pip install -q pytest
          python -m compileall -q web/python
          PYTHONPATH=web/python python -m pytest -q web/python/test_*.py
      - name: Regenerate Python worker
        run: node scripts/build-python-worker.mjs
      - name: Validate generated tree
        run: git diff --check
      - name: Remove temporary workflow
        run: rm .github/workflows/_tmp-367-current-replay.yml
      - name: Commit regenerated tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Regenerate unified scene binding on current master"
          git push origin HEAD:tmp/367-unified-scene-binding-current
