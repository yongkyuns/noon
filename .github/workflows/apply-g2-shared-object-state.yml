name: Apply G2 shared object state

on:
  push:
    branches:
      - agent/g2-shared-object-state

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/g2-shared-object-state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use stable Rust and wasm target
        run: |
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt clippy
      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Apply shared state migration
        run: python .github/apply-g2-shared-object-state.py
      - name: Validate Rust Python and wasm integration
        run: |
          cargo fmt --all
          cargo clippy -p noon-web --all-targets -- -D warnings
          cargo test -p noon-web
          cargo check -p noon-web --target wasm32-unknown-unknown
          python -m compileall -q web/python scripts/manim-differential.py
      - name: Install ManimCE reference
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config
          python -m pip install --disable-pip-version-check "manim==0.21.0"
      - name: Run state differential probes
        run: python scripts/manim-differential.py
      - name: Build browser package
        env:
          NOON_SKIP_PLAYGROUND_TEST: "1"
          NOON_WASM_SKIP_OPT: "1"
        run: bash scripts/build-web-demo.sh
      - name: Commit integrated change and remove helpers
        run: |
          find web scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/noon-web/src/authoring_mobject.rs web/python/_manim_compat.py web/python/_manim_semantic_handles.py scripts/manim-differential.py
          git rm .github/apply-g2-shared-object-state.py .github/workflows/apply-g2-shared-object-state.yml
          git commit -m "Add shared Manim object state semantics"
          git push origin HEAD:agent/g2-shared-object-state
