name: Demo cold-start format

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Normalize cold-start blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path("web/main.js")
          main = main_path.read_text()
          # Handle the exact currently committed block independent of indentation drift.
          start = main.index('    () => {\n    if (authoringClient !== client) return;')
          end = main.index('  );', start) + len('  );')
          new_main = '''    () => {
              if (authoringClient !== client) return;
              if (client.terminated) {
                authoringClient = null;
              }
              status.dataset.authoringWarmup = "failed";
            },
          );'''
          main = main[:start] + new_main + main[end:]
          main_path.write_text(main)

          worker_path = Path("web/python-worker.js")
          worker = worker_path.read_text()
          start = worker.index('  const startupResourcesReady = Promise.all([')
          end = worker.index('  self.noonCreateAuthoringMobjectHandle', start)
          new_worker = '''  const startupResourcesReady = Promise.all([
            noonWebReady,
            pyodideReady,
            compatibilitySourcesReady,
          ]);
          const [, pyodide, compatibilitySources] = await startupResourcesReady;
          const authoringStore = new WasmAuthoringStore();
'''
          worker = worker[:start] + new_worker + worker[end:]
          worker_path.write_text(worker)
          PY

      - name: Validate formatting-only cleanup
        run: |
          node --check web/main.js
          node --check web/python-worker.js
          node --test web/playground-startup.test.mjs
          node --test web/authoring-client.test.mjs

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/main.js web/python-worker.js
          git commit -m "Clean up cold-start concurrency blocks"
          git push origin HEAD:${{ github.head_ref }}
