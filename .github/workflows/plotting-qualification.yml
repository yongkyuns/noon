name: Plotting qualification

on:
  pull_request:
    paths:
      - '.github/workflows/plotting-qualification.yml'
      - '**/*plot*'
      - '**/*coordinate*'

permissions:
  contents: read

concurrency:
  group: plotting-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preparation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Capture text sources for qualification
        run: |
          mkdir -p plotting-evidence
          git ls-files | grep -E '\.(rs|py|js|mjs|toml|md|sh|yml|yaml|json|html|css)$' > /tmp/noon-text-files
          tar -czf plotting-evidence/sources.tar.gz -T /tmp/noon-text-files
          git rev-parse HEAD > plotting-evidence/source-sha.txt
      - uses: actions/upload-artifact@v7
        with:
          name: plotting-source-${{ github.event.pull_request.head.sha }}
          path: plotting-evidence/
          retention-days: 1
