name: Measure P1 and P2 before-after percentiles

on:
  push:
    branches: [perf/evidence-p1-p2]

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: P1 scheduler before and after
        shell: bash
        run: |
          git show ac41c928230144d3d31ef96d85dd770f706536e6:crates/noon-runtime/examples/timeline_scheduler_perf.rs > /tmp/timeline_scheduler_perf.rs
          git checkout -f d8b72023a88aaa75d187c7d23ed0d3a5d5332c5a
          cp /tmp/timeline_scheduler_perf.rs crates/noon-runtime/examples/timeline_scheduler_perf.rs
          cargo run --release -p noon-runtime --example timeline_scheduler_perf -- --samples 1000 --warmups 100 --groups 100000 --active 10000 | tee /tmp/p1-before.txt
          git checkout -f ac41c928230144d3d31ef96d85dd770f706536e6
          cargo run --release -p noon-runtime --example timeline_scheduler_perf -- --samples 1000 --warmups 100 --groups 100000 --active 10000 | tee /tmp/p1-after.txt
      - name: P2 frame preparation before and after
        shell: bash
        run: |
          git show 95cedd76e1f918d83af8dad0a8dae323a5b18b82:crates/noon-render-wgpu/examples/frame_preparation_perf.rs > /tmp/frame_preparation_perf.rs
          git checkout -f 7c63c7beace9263d9597a1a7a048cb8c56995dff
          cp /tmp/frame_preparation_perf.rs crates/noon-render-wgpu/examples/frame_preparation_perf.rs
          cargo run --release -p noon-render-wgpu --example frame_preparation_perf -- --warmups 20 --samples 200 100000 | tee /tmp/p2-before.txt
          git checkout -f 95cedd76e1f918d83af8dad0a8dae323a5b18b82
          cargo run --release -p noon-render-wgpu --example frame_preparation_perf -- --warmups 20 --samples 200 100000 | tee /tmp/p2-after.txt
      - name: Publish evidence
        shell: bash
        run: |
          {
            echo '## P1 same-runner before'
            echo '```'
            cat /tmp/p1-before.txt
            echo '```'
            echo '## P1 same-runner after'
            echo '```'
            cat /tmp/p1-after.txt
            echo '```'
            echo '## P2 same-runner before'
            echo '```'
            cat /tmp/p2-before.txt
            echo '```'
            echo '## P2 same-runner after'
            echo '```'
            cat /tmp/p2-after.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
