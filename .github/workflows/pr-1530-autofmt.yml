name: PR 1530 autofmt

on:
  push:
    branches:
      - codex/restore-morph-preload-residency

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/restore-morph-preload-residency
      - run: rustup install
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "Format dynamic resource residency changes"
          git push origin HEAD:codex/restore-morph-preload-residency
