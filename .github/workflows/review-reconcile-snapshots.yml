name: Review reconciliation sources
on:
  push:
    branches: [review/reconcile-1684-1693-20260921]
    paths: [.github/workflows/review-reconcile-snapshots.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture source snapshots and exact deltas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          MASTER=c77f7c0dbdd24cad736ceffec8260578746821aa
          C5=eb5b5c8ef3eb92e502a5ba06c73e6547377af26b
          B5=ab5d9fb2ee42b06922600e0e03d764ab76ed60f8
          for sha in "$MASTER" "$C5" "$B5"; do
            git cat-file -e "$sha^{commit}" || git fetch origin "$sha"
          done
          git archive "$MASTER" | gzip > evidence/master.tar.gz
          git archive "$C5" | gzip > evidence/c5-head.tar.gz
          git archive "$B5" | gzip > evidence/b5-head.tar.gz
          for lane in c5 b5; do
            if [ "$lane" = c5 ]; then HEAD=$C5; else HEAD=$B5; fi
            BASE=$(git merge-base "$MASTER" "$HEAD")
            git archive "$BASE" | gzip > "evidence/$lane-base.tar.gz"
            git diff --binary "$BASE" "$HEAD" > "evidence/$lane-feature.patch"
            git diff --binary "$BASE" "$MASTER" > "evidence/$lane-master.patch"
            git ls-tree -r "$HEAD" > "evidence/$lane-tree.txt"
            printf '%s\n' "master=$MASTER" "head=$HEAD" "base=$BASE" > "evidence/$lane-identity.txt"
            git log --format='%h %s' "$BASE..$MASTER" > "evidence/$lane-master-history.txt"
          done
          git ls-tree -r "$MASTER" > evidence/master-tree.txt
          sha256sum evidence/*.tar.gz > evidence/archive-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: review-reconcile-pinned-sources
          path: evidence/
          retention-days: 7
          if-no-files-found: error
