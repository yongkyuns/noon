name: C5 inspection view qualification

on:
  push:
    branches: [validation/c5-inspection-view-20260923]
    paths:
      - crates/noon/src/inspection_view.rs
      - .github/workflows/c5-inspection-view-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c5-inspection-view-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      BASE_SHA: 4bf851b4643b8b4b96dfdc31fc47300b802bac28
      FEATURE_BRANCH: feat/c5-inspection-view-foundation
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Prepare exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/c5-inspection-proof
          test "$(git hash-object crates/noon/src/lib.rs)" = bbe2bbb88cf52d4ce94616687aefa2ba1f78d70f
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/noon/src/lib.rs')
          s = p.read_text()
          old = 'mod image_authoring;'
          assert s.count(old) == 1
          s = s.replace(old, old + '\nmod inspection_view;')
          old = 'pub use image_authoring::{ImageMobjectOptions, DEFAULT_IMAGE_SCALE_TO_RESOLUTION};'
          assert s.count(old) == 1
          s = s.replace(old, old + '\npub use inspection_view::{InspectionView2D, InspectionViewError};')
          p.write_text(s)
          PY
          rustup install
          rustc --version --verbose | tee /tmp/c5-inspection-proof/rust-version.txt
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          cp crates/noon/src/inspection_view.rs /tmp/c5-inspection-view.good.rs
      - name: Focused shared Rust qualification
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p noon --no-default-features --lib inspection_view -- --nocapture 2>&1 | tee /tmp/c5-inspection-proof/focused.log
          cargo check -p noon --no-default-features --target wasm32-unknown-unknown 2>&1 | tee /tmp/c5-inspection-proof/wasm.log
      - name: Anchor negative control
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/noon/src/inspection_view.rs')
          s = p.read_text()
          old = 'height * self.scale,'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'height,'))
          PY
          set +e
          cargo test -p noon --no-default-features --lib inspection_view::tests::both_zoom_directions_keep_the_anchor_at_its_screen_position -- --exact --nocapture > /tmp/c5-inspection-proof/negative-control.log 2>&1
          result=$?
          set -e
          cp /tmp/c5-inspection-view.good.rs crates/noon/src/inspection_view.rs
          test "$result" -ne 0
          grep -F 'test result: FAILED. 0 passed; 1 failed' /tmp/c5-inspection-proof/negative-control.log
      - name: Repository fast gate
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check.sh fast "$BASE_SHA" 2>&1 | tee /tmp/c5-inspection-proof/fast.log
      - name: Publish clean tested source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cmp /tmp/c5-inspection-view.good.rs crates/noon/src/inspection_view.rs
          git read-tree "$BASE_SHA"
          git add crates/noon/src/lib.rs crates/noon/src/inspection_view.rs
          git diff --cached --name-only "$BASE_SHA" > /tmp/c5-inspection-proof/paths.txt
          printf '%s\n' crates/noon/src/inspection_view.rs crates/noon/src/lib.rs | diff -u - /tmp/c5-inspection-proof/paths.txt
          tree=$(git write-tree)
          printf '%s\n' "$tree" > /tmp/c5-inspection-proof/tree.txt
          git diff --cached --binary "$BASE_SHA" > /tmp/c5-inspection-proof/source.patch
          git diff --cached --stat "$BASE_SHA" > /tmp/c5-inspection-proof/source.stat
          git archive "$tree" | gzip > /tmp/c5-inspection-proof/source.tar.gz
          sha256sum /tmp/c5-inspection-proof/source.tar.gz > /tmp/c5-inspection-proof/source.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(git commit-tree "$tree" -p "$BASE_SHA" -m 'C5: prepare camera-relative inspection view composition (#1714)')
          test -z "$(git ls-remote --heads origin "refs/heads/$FEATURE_BRANCH")"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "$commit:refs/heads/$FEATURE_BRANCH"
          printf '%s\n' "$commit" > /tmp/c5-inspection-proof/commit.txt
          git cat-file -p "$commit" > /tmp/c5-inspection-proof/commit-object.txt
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: c5-inspection-view-proof
          path: /tmp/c5-inspection-proof
          retention-days: 7
