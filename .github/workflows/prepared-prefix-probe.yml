name: Prepared prefix isolation probe

on:
  push:
    branches: [experimental/prepared-prefix-isolation]
    paths:
      - crates/noon/src/execution_session/replay.rs
      - crates/noon/src/execution_session/replay/**
      - crates/noon/tests/prepared_prefix_raster.rs
      - .github/workflows/prepared-prefix-probe.yml

permissions:
  contents: read

concurrency:
  group: prepared-prefix-isolation-probe
  cancel-in-progress: true

jobs:
  rust-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      XDG_RUNTIME_DIR: /tmp/noon-prefix-raster
    steps:
      - uses: actions/checkout@v7
      - name: Pin integration base
        run: git fetch --no-tags --depth=1 origin 8a1c4f1834160a524635a3f6f5c4adf6a91ccae3
      - name: Install repository-pinned Rust
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Cache Cargo sources and focused build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: prefix-probe-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
      - name: Architecture gate
        run: bash scripts/check.sh architecture 8a1c4f1834160a524635a3f6f5c4adf6a91ccae3
      - name: Format check
        id: format
        run: |
          mkdir -p prefix-probe-artifacts
          cargo fmt --all -- --check 2>&1 | tee prefix-probe-artifacts/format.log
      - name: Probe real producer and historical reader
        if: ${{ !cancelled() }}
        run: |
          mkdir -p prefix-probe-artifacts
          cargo test -p noon --no-default-features --lib prefix_probe -- --nocapture --test-threads=1 2>&1 | tee prefix-probe-artifacts/probe.log
      - name: Existing history and segment regressions
        if: ${{ !cancelled() }}
        run: |
          cargo test -p noon --no-default-features --test finite_replay_history --test scalar_timeline_replay --test segment_decimal_endpoints 2>&1 | tee prefix-probe-artifacts/regressions.log
      - name: Install actual Vulkan fallback renderer
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
      - name: Actual pixels and renderer recreation
        if: ${{ !cancelled() }}
        run: |
          cargo test -p noon --no-default-features --test prepared_prefix_raster -- --ignored --nocapture --test-threads=1 2>&1 | tee prefix-probe-artifacts/raster.log
      - name: Direct WASM compilation
        if: ${{ !cancelled() }}
        run: |
          cargo check -p noon --no-default-features --target wasm32-unknown-unknown 2>&1 | tee prefix-probe-artifacts/wasm.log
      - name: Preserve formatting corrections without altering tested code
        if: ${{ always() && steps.format.outcome == 'failure' }}
        run: |
          cargo fmt --all
          git diff -- crates/noon/src/execution_session/replay.rs crates/noon/src/execution_session/replay/prefix_probe.rs crates/noon/tests/prepared_prefix_raster.rs > prefix-probe-artifacts/rustfmt.patch
          cp crates/noon/src/execution_session/replay/prefix_probe.rs prefix-probe-artifacts/prefix_probe.formatted.rs
          cp crates/noon/tests/prepared_prefix_raster.rs prefix-probe-artifacts/prepared_prefix_raster.formatted.rs
      - name: Retain exact results, including failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: prepared-prefix-probe
          path: prefix-probe-artifacts
          retention-days: 7
          if-no-files-found: warn
