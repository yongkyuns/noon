name: Apply shared layout bounds migration

on:
  push:
    branches:
      - agent/arch-shared-layout-bounds
    paths:
      - scripts/apply_shared_layout_bounds_migration.py
      - .github/workflows/zz-apply-shared-layout-bounds.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/arch-shared-layout-bounds
          fetch-depth: 0
      - name: Apply migration
        run: python3 scripts/apply_shared_layout_bounds_migration.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Validate focused Rust bounds
        run: cargo test -p noon-web authoring_mobject
      - name: Validate Python handle bounds
        run: PYTHONPATH=web/python python3 -m unittest web.python.test_manim_semantic_handle_layout_bounds
      - name: Validate semantic ownership inventory
        run: python3 scripts/semantic_ownership_check.py
      - name: Validate diff
        run: git diff --check
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/noon-web/src/authoring_mobject.rs web/python/_manim_semantic_handles.py web/python/test_manim_semantic_handle_layout_bounds.py compat/semantic-ownership-v1.json
          git commit -m "Apply shared layout bounds migration"
          git push origin HEAD:agent/arch-shared-layout-bounds
