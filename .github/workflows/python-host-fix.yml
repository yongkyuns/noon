# Temporary immutable-blob staging only; never writes a branch or PR.
name: Stage Python host integration fix
on:
  push:
    branches: [agent/1874-bindings-transfer]
    paths: [.github/workflows/python-host-fix.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: f29c8c9dfb9356075993afe42b8bceec04de55a5
          persist-credentials: false
      - run: rustup install
      - name: Verify source edits and create immutable blobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          p = pathlib.Path('crates/noon-web/src/authoring_svg.rs')
          s = p.read_text(); start = s.index('impl From<noon::SvgAuthoringError>'); end = s.index('#[wasm_bindgen]', start)
          conversion = s[start:end].replace('noon::SvgAuthoringError', 'crate::SvgAuthoringError')
          p.write_text((s[:start] + s[end:]).replace('authoring_error::{js_error, AuthoringFailure},', 'authoring_error::js_error,'))
          p = pathlib.Path('crates/noon/src/binding_error.rs')
          s = p.read_text() + '\n' + conversion
          s = s.replace('            Numeric(error) => error.into(),', '            #[cfg(feature = "latex")]\n            Numeric(error) => error.into(),', 1)
          for name in ('TextSourceStyle', 'InvalidTextColorSelector', 'TextColorUnsupportedSourceKind'):
              s = s.replace(f'            E::{name}(', f'            #[cfg(feature = "native-text")]\n            E::{name}(')
          p.write_text(s)
          p = pathlib.Path('crates/noon-web/src/authoring_error.rs')
          s = p.read_text().replace('    use noon::{\n        AuthoringError, ExecutionSegmentCompletionError, ExecutionSegmentError,\n        ExecutionSessionCallbackError, ExecutionSessionCallbackReadError,\n        ExecutionSessionPublicationError, LiveSessionError,\n    };', '    use noon::{AuthoringError, ExecutionSessionPublicationError, LiveSessionError};').replace('    use noon_core::{\n        SemanticMutationTransactionError, SemanticSceneOperationError, SemanticStoreError,\n    };', '    use noon_core::SemanticSceneOperationError;')
          p.write_text(s)
          subprocess.run(['cargo', 'fmt', '--all'], check=True)
          expected_blobs = {'crates/noon-web/src/authoring_error.rs': '0d72a567788d8ca224f3b7ba40accec2ca8ba4d2', 'crates/noon-web/src/authoring_svg.rs': 'c08242198550584903ef70623554bcddec2df2b8', 'crates/noon/src/binding_error.rs': '2d6eabbb8063761b0fa7b7a2600b050d621d1c8d'}
          paths = subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines()
          assert set(paths) == set(expected_blobs)
          for name in paths:
              content = pathlib.Path(name).read_bytes()
              expected = hashlib.sha1(f'blob {len(content)}\0'.encode() + content).hexdigest()
              assert expected == expected_blobs[name], (name, expected)
              payload = json.dumps(dict(content=base64.b64encode(content).decode(), encoding='base64')).encode()
              request = urllib.request.Request('https://api.github.com/repos/' + os.environ['REPOSITORY'] + '/git/blobs', data=payload, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  actual = json.load(response)['sha']
              assert actual == expected, name
              print(name, actual)
          PY
