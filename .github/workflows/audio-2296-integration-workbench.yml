name: Audio 2296 integration workbench

# Temporary, branch-local workbench for #2296. Never merge this workflow.
# It reads three public source trees and uploads only their Git objects.
on:
  push:
    branches: [codex/audio-2296-integration-workbench]
    paths: [.github/workflows/audio-2296-integration-workbench.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout workbench
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Snapshot exact integration inputs without repository credentials
        shell: bash
        env:
          BASE: d6afd19037d8eb421fcbd3ddc222fa20f150922b
          HEAD: 5cc7e16e2df651e62fe66e71b1b607e4e418f90e
          MASTER: f102a74b9bf28440f4862e799604a57c7882fa68
        run: |
          set -euo pipefail
          mkdir -p snapshot
          git fetch --no-tags --depth=1 https://github.com/yongkyuns/noon.git "$BASE" "$HEAD" "$MASTER"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          refs = {name.lower(): os.environ[name] for name in ('BASE', 'HEAD', 'MASTER')}
          objects = set(refs.values())
          identities = {}
          for name, sha in refs.items():
              tree = git('rev-parse', sha + '^{tree}')
              objects.add(tree)
              entries = subprocess.check_output(['git', 'ls-tree', '-r', '-t', '-z', sha]).split(b'\0')
              for entry in entries:
                  if entry:
                      metadata, _ = entry.split(b'\t', 1)
                      _, kind, oid = metadata.split()
                      if kind in (b'tree', b'blob'):
                          objects.add(oid.decode())
              identities[name] = {'commit': sha, 'tree': tree}
          pathlib.Path('snapshot/identities.json').write_text(json.dumps(identities, indent=2) + '\n')
          pathlib.Path('snapshot/object-ids.txt').write_text('\n'.join(sorted(objects)) + '\n')
          for name in ('head', 'master'):
              diff = subprocess.check_output(['git', 'diff', '--name-status', refs['base'], refs[name]])
              pathlib.Path(f'snapshot/{name}-changes.txt').write_bytes(diff)
          print(json.dumps(identities, indent=2))
          print(f'Snapshotting {len(objects)} source objects; no Git config, credentials or working-directory files.')
          PY
          git pack-objects --stdout < snapshot/object-ids.txt > snapshot/source-objects.pack
          sha256sum snapshot/* > snapshot/SHA256SUMS
          ls -lh snapshot/source-objects.pack
      - name: Retain exact source snapshot
        uses: actions/upload-artifact@v7
        with:
          name: audio-2296-integration-inputs
          path: snapshot/
          if-no-files-found: error
          retention-days: 3
