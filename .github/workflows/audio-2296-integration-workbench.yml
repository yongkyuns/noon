name: Audio 2296 integration workbench

# Temporary branch-local qualification for #2296. Never merge this workflow.
# It may update ONLY the named scratch branch, never master or the PR branch.
on:
  push:
    branches: [codex/audio-2296-integration-workbench]
    paths:
      - .github/workflows/audio-2296-integration-workbench.yml
      - integration/**

permissions:
  contents: read

concurrency:
  group: audio-2296-integration-workbench
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: "READ_ONLY"
      MASTER: f71a4c121bc29921133f790ae9783e89e962e7d9
      CANDIDATE_PARENT: f138cb378a58ae94fad4fb762b625667120a20e0
      CANDIDATE_BRANCH: codex/audio-2296-integrated-5cc-f71
    defaults:
      run:
        working-directory: candidate
        shell: bash
    steps:
      - name: Checkout workbench recipe
        uses: actions/checkout@v7
        with:
          path: workbench
          persist-credentials: false
      - name: Checkout exact integrated candidate
        uses: actions/checkout@v7
        with:
          ref: f138cb378a58ae94fad4fb762b625667120a20e0
          fetch-depth: 0
          path: candidate
      - name: Apply exact bounded nonspatial pointer damage correction
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          git config user.name 'Noon integration workbench'
          git config user.email 'noreply@example.invalid'
          test "$(git rev-parse HEAD^{tree})" = abf2cf2adff928feffd09e0b054ff7d4510ef87e
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import gzip,hashlib,pathlib
          payload = pathlib.Path('../workbench/integration/nonspatial-correction.patch.gz').read_bytes()
          assert hashlib.sha256(payload).hexdigest() == '13f62009c8928a0e5311c53d199cecc54e6a76c34f64913e69bd9571b7923177'
          patch = gzip.decompress(payload)
          assert hashlib.sha256(patch).hexdigest() == '39dfa3f2d4a77baf8203a04fd4faaf9cc30a9992aafbfa08704f8d093b6a38d1'
          pathlib.Path('../evidence/nonspatial-correction.patch').write_bytes(patch)
          PY
          git apply --check ../evidence/nonspatial-correction.patch
          git apply ../evidence/nonspatial-correction.patch
          test "$(git hash-object ../workbench/integration/nonspatial-api-visibility.patch)" = 377c3926ce1c4e820c93cbb549343423ecfb2419
          git apply --check ../workbench/integration/nonspatial-api-visibility.patch
          git apply ../workbench/integration/nonspatial-api-visibility.patch
          git diff --check
          git add -u
          actual_tree=$(git write-tree)
          actual_count=$(git diff --cached --name-only | wc -l | tr -d ' ')
          actual_fixture=$(sha256sum scripts/python-background-audio-smoke.mjs | cut -d' ' -f1)
          printf 'PIN_DIAGNOSTIC tree=%s expected_tree=%s\n' "$actual_tree" ee172be89722581c1331645423fc7f510da48e9e
          printf 'PIN_DIAGNOSTIC changed_files=%s expected_changed_files=5\n' "$actual_count"
          git diff --cached --name-only
          printf 'PIN_DIAGNOSTIC audio_fixture=%s expected_audio_fixture=%s\n' "$actual_fixture" 7c55278f83df2ecb1494a449729afa637f615f63f8b3d341e455011b00d7f61a
          test "$actual_tree" = ee172be89722581c1331645423fc7f510da48e9e
          test "$actual_count" = 5
          test "$actual_fixture" = 7c55278f83df2ecb1494a449729afa637f615f63f8b3d341e455011b00d7f61a
      - name: Use repository-pinned Rust and WASM target
        run: |
          rustup install
          rustup show active-toolchain
          rustc --version --verbose | tee ../evidence/rustc.txt
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('candidate/Cargo.toml', 'candidate/crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - name: Use sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Publish damage fix only to isolated candidate
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git add -u
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 5
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -p "$CANDIDATE_PARENT" -m 'fix(input): journal nonspatial picking changes without spatial reindex')
          git checkout --detach "$commit"
          export tree commit
          python3 - <<'PY'
          import json, os, pathlib
          receipt = dict(candidate_commit=os.environ['commit'], candidate_tree=os.environ['tree'],
                         parent=os.environ['CANDIDATE_PARENT'], master=os.environ['MASTER'],
                         branch=os.environ['CANDIDATE_BRANCH'], rust_validation='pending')
          pathlib.Path('../evidence/candidate.json').write_text(json.dumps(receipt, indent=2)+'\n')
          PY
          test "$(git ls-remote --heads origin "refs/heads/$CANDIDATE_BRANCH" | cut -f1)" = "$CANDIDATE_PARENT"
          git push origin "$commit:refs/heads/$CANDIDATE_BRANCH"
      - name: Validate worker lifecycle regression suite
        run: |
          set -euo pipefail
          node --test web/execution-worker-client.test.mjs web/semantic-engine-endpoint.test.mjs scripts/playground-preload.test.mjs | tee ../evidence/worker-tests.log
      - name: Install native audio build dependencies
        run: bash scripts/ci-install-reference-deps.sh libasound2-dev pkg-config
      - name: Validate point-local pointer compatibility
        run: |
          set -euo pipefail
          cargo test -p noon --lib execution_session::input::presentation::compatibility_tests --locked -- --nocapture 2>&1 | tee ../evidence/pointer-compatibility.log
      - name: Run full repository gate on exact candidate
        run: |
          set -euo pipefail
          bash scripts/check.sh full "$MASTER" 2>&1 | tee ../evidence/full-gate.log
          printf 'passed\n' > ../evidence/full-gate.result
      - name: Retain source identities and validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audio-2296-integration-qualification
          path: evidence/
          if-no-files-found: error
          retention-days: 7
