name: Audio 2296 integration workbench

# Temporary branch-local qualification for #2296. Never merge this workflow.
# It may update ONLY the named scratch branch, never master or the PR branch.
on:
  push:
    branches: [codex/audio-2296-integration-workbench]
    paths:
      - .github/workflows/audio-2296-integration-workbench.yml
      - integration/**

permissions:
  contents: read

concurrency:
  group: audio-2296-integration-workbench
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: "READ_ONLY"
      MASTER: f71a4c121bc29921133f790ae9783e89e962e7d9
      CANDIDATE_PARENT: 33dfeb0acac81ae295322373d03bfeaca3d91932
      CANDIDATE_BRANCH: codex/audio-2296-integrated-5cc-f71
    defaults:
      run:
        working-directory: candidate
        shell: bash
    steps:
      - name: Checkout workbench recipe
        uses: actions/checkout@v7
        with:
          path: workbench
          persist-credentials: false
      - name: Checkout exact integrated candidate
        uses: actions/checkout@v7
        with:
          ref: 33dfeb0acac81ae295322373d03bfeaca3d91932
          fetch-depth: 0
          path: candidate
      - name: Apply exact inspection-fixture initialization correction
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          git config user.name 'Noon integration workbench'
          git config user.email 'noreply@example.invalid'
          test "$(git rev-parse HEAD^{tree})" = aeedb2aa752ea8aae1b26429362275c47f2554b2
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import hashlib, pathlib
          path = pathlib.Path('../workbench/integration/inspection-initializer-fix.patch')
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '1cf427f228187988a452244d8ec52aff2e760eb186f23e5d976ece889c5f6474'
          PY
          git apply --check ../workbench/integration/inspection-initializer-fix.patch
          git apply ../workbench/integration/inspection-initializer-fix.patch
          git diff --check
          git diff > ../evidence/fixture-fix.patch
          git add -u
          test "$(git write-tree)" = abf2cf2adff928feffd09e0b054ff7d4510ef87e
      - name: Use repository-pinned Rust and WASM target
        run: |
          rustup install
          rustup show active-toolchain
          rustc --version --verbose | tee ../evidence/rustc.txt
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('candidate/Cargo.toml', 'candidate/crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - name: Use sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Publish fixture fix only to isolated candidate
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -p "$CANDIDATE_PARENT" -m 'fix(tests): initialize control publication in paired inspection fixture')
          git checkout --detach "$commit"
          export tree commit
          python3 - <<'PY'
          import json, os, pathlib
          receipt = dict(candidate_commit=os.environ['commit'], candidate_tree=os.environ['tree'],
                         parent=os.environ['CANDIDATE_PARENT'], master=os.environ['MASTER'],
                         branch=os.environ['CANDIDATE_BRANCH'], rust_validation='pending')
          pathlib.Path('../evidence/candidate.json').write_text(json.dumps(receipt, indent=2)+'\n')
          PY
          test "$(git ls-remote --heads origin "refs/heads/$CANDIDATE_BRANCH" | cut -f1)" = "$CANDIDATE_PARENT"
          git push origin "$commit:refs/heads/$CANDIDATE_BRANCH"
      - name: Validate worker lifecycle regression suite
        run: |
          set -euo pipefail
          node --test web/execution-worker-client.test.mjs web/semantic-engine-endpoint.test.mjs scripts/playground-preload.test.mjs | tee ../evidence/worker-tests.log
      - name: Install native audio build dependencies
        run: bash scripts/ci-install-reference-deps.sh libasound2-dev pkg-config
      - name: Run full repository gate on exact candidate
        run: |
          set -euo pipefail
          bash scripts/check.sh full "$MASTER" 2>&1 | tee ../evidence/full-gate.log
          printf 'passed\n' > ../evidence/full-gate.result
      - name: Retain source identities and validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audio-2296-integration-qualification
          path: evidence/
          if-no-files-found: error
          retention-days: 7
