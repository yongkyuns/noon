name: WebKit WASM allocator investigation

on:
  pull_request:
    paths:
      - ".github/workflows/webkit-wasm-memory-probe.yml"
      - "scripts/webkit-wasm-allocation-probe*"
      - "scripts/playground-gallery-runtime-smoke.mjs"
      - "scripts/build-web-demo.sh"
      - "crates/noon-web/src/allocator_probe.rs"
      - "crates/noon-web/src/lib.rs"
      - "crates/noon-web/Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webkit-wasm-allocation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build opt-in allocation-instrumented runtime
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: "READ_ONLY"
    steps:
      - uses: actions/checkout@v7
      - name: Check counterbalanced trial design
        run: |
          node --test scripts/webkit-wasm-allocation-probe.test.mjs
          node --check scripts/playground-gallery-runtime-smoke.mjs
      - name: Use repository-pinned Rust and WASM target
        run: |
          rustup install
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Build gallery profile with diagnostic allocator enabled
        env:
          NOON_SKIP_WEB_PREFLIGHT: "1"
          NOON_WASM_SKIP_OPT: "1"
          NOON_RENDERER_SMOKE: "1"
          NOON_WASM_ALLOC_PROBE: "1"
        run: bash scripts/build-web-demo.sh
      - name: Retain exact diagnostic WASM and worker
        uses: actions/upload-artifact@v7
        with:
          name: webkit-allocation-probe-runtime
          path: |
            web/pkg
            web/python-worker.js
            web/runtime-build-identity.json
            web/python/compat-bundle.*.json
          if-no-files-found: error
          retention-days: 7

  webkit:
    name: WebKit counterbalanced JSPI / no-JSPI memory trial
    needs: build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: webkit-allocation-probe-runtime
          path: web
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-1.62.1
      - name: Install pinned browser runner
        run: npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
      - name: Install pinned WebKit engine
        run: bash scripts/ci-install-playwright-browser.sh webkit
      - name: Run exact-source cold-start memory comparisons
        timeout-minutes: 32
        env:
          NOON_PLAYGROUND_BROWSER: webkit
          NOON_PLAYGROUND_PROFILE: mobile-dpr2
          NOON_GALLERY_CASES: showcase-text-math
          NOON_SHOWCASE_PROFILE_GATE: baseline
          NOON_WEBKIT_ALLOC_REPEATS: "8"
          NOON_PLAYGROUND_MATRIX_ARTIFACTS: browser-smoke-artifacts/webkit-memory-experiment
          DEBUG: pw:browser
        run: node scripts/playground-gallery-runtime-smoke.mjs
      - name: Retain each trial, memory samples, native diagnostics and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webkit-memory-comparison
          path: browser-smoke-artifacts/webkit-memory-experiment/
          if-no-files-found: warn
          retention-days: 7
