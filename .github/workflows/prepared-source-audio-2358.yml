name: Prepared source audio qualification 2358
on:
  push:
    branches: [codex/scratch-prepared-audio-source-2358]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      BASE: 8e785d28cb94f74c983e91c1703a81b39a5b500b
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TARGET_DIR: /tmp/noon-prepared-audio-target
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Recover candidate and make fixture precision explicit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yongkyuns/noon
          test "$GITHUB_REF" = refs/heads/codex/scratch-prepared-audio-source-2358
          mkdir -p /tmp/noon-prepared-audio-evidence
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, gzip
          data = bytearray(Path('.github/task/prepared-source-2358.payload').read_bytes())
          # Restore the two pinned transport substitutions, not source edits.
          assert hashlib.sha256(data).hexdigest() == 'a8f1677d39163af413f29080dd64828848d4cce66544a990bf35f788e9b22b8b'
          assert data[109:111] == bytes([176, 90])
          data[109:111] = bytes([182, 218])
          assert hashlib.sha256(data).hexdigest() == '11c3d32ee25fc900d78b8f2ebf10cbb4305851bfe6bcb50294391813587dba79'
          patch = gzip.decompress(data)
          assert hashlib.sha256(patch).hexdigest() == '4d7ae7a15dca1f10d132ae7b125acd66848de384e8f17024a4c25db6784d295d'
          Path('/tmp/noon-prepared-audio-evidence/input.patch').write_bytes(patch)
          PY
          git fetch --no-tags --depth=1 origin "$BASE"
          git checkout --detach "$BASE"
          git apply --check /tmp/noon-prepared-audio-evidence/input.patch
          git apply /tmp/noon-prepared-audio-evidence/input.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/noon/Cargo.toml')
          text = p.read_text()
          old = '[dev-dependencies]\nserde_json = "1"'
          assert text.count(old) == 1
          p.write_text(text.replace(old, '[dev-dependencies]\n# Exact Manim float fixtures must not depend on workspace feature unification.\nserde_json = { version = "1", features = ["float_roundtrip"] }'))
          PY
          git add -N crates/noon/tests/prepared_audio_source.rs
          git diff --check
          git diff --name-only > /tmp/noon-prepared-audio-evidence/paths.txt
          test "$(wc -l < /tmp/noon-prepared-audio-evidence/paths.txt)" = 17
          ! grep -vE '^(crates/noon(-web)?/|docs/architecture.md$)' /tmp/noon-prepared-audio-evidence/paths.txt
      - name: Install pinned toolchain and format
        shell: bash
        run: |
          set -euo pipefail
          rustup install
          rustup target add wasm32-unknown-unknown
          rustc --version --verbose | tee /tmp/noon-prepared-audio-evidence/rustc.txt
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          bash scripts/check.sh architecture "$BASE" 2>&1 | tee /tmp/noon-prepared-audio-evidence/architecture.log
          git diff --binary > /tmp/noon-prepared-audio-evidence/formatted.patch
      - name: Prove unchanged oracle failure and roundtrip correction
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/noon-prepared-audio-baseline "$BASE"
          set +e
          (cd /tmp/noon-prepared-audio-baseline && CARGO_TARGET_DIR=/tmp/noon-prepared-audio-baseline-target cargo test -p noon --no-default-features --features prepared-prefix --lib path_editing::scalar::xyz_tests::scalar_planar_line_preserves_xyz_prefix_from_actual_ce -- --exact) > /tmp/noon-prepared-audio-evidence/baseline-xyz.log 2>&1
          baseline=$?
          set -e
          cat /tmp/noon-prepared-audio-evidence/baseline-xyz.log
          test "$baseline" -eq 101
          grep -F 'test result: FAILED. 0 passed; 1 failed;' /tmp/noon-prepared-audio-evidence/baseline-xyz.log
          grep -F 'assertion `left == right` failed' /tmp/noon-prepared-audio-evidence/baseline-xyz.log
          (cd /tmp/noon-prepared-audio-baseline && CARGO_TARGET_DIR=/tmp/noon-prepared-audio-baseline-target cargo test -p noon --no-default-features --features prepared-prefix,serde_json/float_roundtrip --lib path_editing::scalar::xyz_tests::scalar_planar_line_preserves_xyz_prefix_from_actual_ce -- --exact) 2>&1 | tee /tmp/noon-prepared-audio-evidence/baseline-roundtrip.log
          grep -F 'test result: ok. 1 passed; 0 failed;' /tmp/noon-prepared-audio-evidence/baseline-roundtrip.log
      - name: Qualify complete isolated source library and history
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p noon --no-default-features --features prepared-prefix --test prepared_audio_source --test immutable_root_audio_history --test prepared_prefix_incremental --test prepared_prefix_lifecycle --test finite_replay_history --test scalar_timeline_replay 2>&1 | tee /tmp/noon-prepared-audio-evidence/source-history.log
          cargo test -p noon --no-default-features --features prepared-prefix --lib 2>&1 | tee /tmp/noon-prepared-audio-evidence/noon-lib.log
      - name: Qualify worker and preserved output admission
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p noon-web --no-default-features --features prepared-prefix --lib 2>&1 | tee /tmp/noon-prepared-audio-evidence/web-lib.log
      - name: Prove fixed-source admission regression detects old gate
        shell: bash
        run: |
          set -euo pipefail
          path=crates/noon/src/execution_session/replay/prefix.rs
          cp "$path" /tmp/noon-prepared-audio-evidence/prefix.rs.saved
          trap 'cp /tmp/noon-prepared-audio-evidence/prefix.rs.saved "$path"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/noon/src/execution_session/replay/prefix.rs')
          text = p.read_text()
          needle = '(self.has_audio() && self.immutable_audio_root.is_none())'
          assert text.count(needle) == 1
          p.write_text(text.replace(needle, 'self.has_audio()'))
          PY
          set +e
          cargo test -p noon --no-default-features --features prepared-prefix --test prepared_audio_source soundtrack_prepares_once_and_only_delivery_extends_reader_audio -- --exact > /tmp/noon-prepared-audio-evidence/negative-source.log 2>&1
          result=$?
          set -e
          cat /tmp/noon-prepared-audio-evidence/negative-source.log
          test "$result" -ne 0
          grep -F 'test result: FAILED. 0 passed; 1 failed;' /tmp/noon-prepared-audio-evidence/negative-source.log
          grep -F 'UnsupportedDomain' /tmp/noon-prepared-audio-evidence/negative-source.log
      - name: Qualify restored source and strict supported lint profile
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p noon --no-default-features --features prepared-prefix --test prepared_audio_source 2>&1 | tee /tmp/noon-prepared-audio-evidence/restored-source.log
          # Native no-renderer/no-effect lib-test cfg leaves existing shader helpers
          # unused (preserved run 2). Keep strict warnings in the supported product
          # lint profile; this is not a pass of that unsupported no-feature lint.
          cargo clippy -p noon -p noon-web --features prepared-prefix --all-targets -- -D warnings 2>&1 | tee /tmp/noon-prepared-audio-evidence/clippy-product.log
          cargo check -p noon --no-default-features 2>&1 | tee /tmp/noon-prepared-audio-evidence/no-feature.log
          cargo check -p noon-web --no-default-features --features prepared-prefix --target wasm32-unknown-unknown 2>&1 | tee /tmp/noon-prepared-audio-evidence/wasm-core.log
          cargo check -p noon-web --features prepared-prefix --target wasm32-unknown-unknown 2>&1 | tee /tmp/noon-prepared-audio-evidence/wasm-renderer.log
      - name: Publish tested code only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          cargo fmt --all -- --check
          git diff --check
          git diff --name-only > /tmp/noon-prepared-audio-evidence/final-paths.txt
          cmp /tmp/noon-prepared-audio-evidence/paths.txt /tmp/noon-prepared-audio-evidence/final-paths.txt
          git diff --binary > /tmp/noon-prepared-audio-evidence/tested.patch
          while IFS= read -r file; do sha256sum "$file"; done < /tmp/noon-prepared-audio-evidence/final-paths.txt > /tmp/noon-prepared-audio-evidence/tested-source-sha256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS= read -r file; do git add -- "$file"; done < /tmp/noon-prepared-audio-evidence/final-paths.txt
          git commit -m 'feat: prepare fixed soundtracks through public source history (#2358)'
          git show -s --format='%H %T %P' HEAD > /tmp/noon-prepared-audio-evidence/commit.txt
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/codex/prepared-audio-source-2358
      - name: Retain evidence including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: prepared-audio-source-2358-${{ github.run_number }}
          path: /tmp/noon-prepared-audio-evidence/
          if-no-files-found: error
          retention-days: 7
