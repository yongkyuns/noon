name: D2 apply bounded replacement
on:
  push:
    branches:
      - arch/d2-packed-mega-mesh
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Apply D2 bounded replacement patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/d2-packed-mega-mesh
      - name: Apply bounded path replacement
        run: |
          python3 scripts/_d2_bounded_patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/noon-render-wgpu/src/lib.rs')
          text = path.read_text()
          text = text.replace(
              '        push_dirty_range(&mut self.path_vertex_dirty_ranges, vertex_range_usize);\n',
              '        self.path_vertex_dirty_ranges.push(vertex_range_usize);\n',
              1,
          )
          text = text.replace(
              '        push_dirty_range(&mut self.path_index_dirty_ranges, index_range_usize);\n',
              '        self.path_index_dirty_ranges.push(index_range_usize);\n',
              1,
          )
          old = '''        normalize_dirty_ranges(&mut self.path_dirty_ranges);\n\n        self.prepared_frame(\n'''
          new = '''        normalize_dirty_ranges(&mut self.path_dirty_ranges);\n        normalize_dirty_ranges(&mut self.path_vertex_dirty_ranges);\n        normalize_dirty_ranges(&mut self.path_index_dirty_ranges);\n\n        self.prepared_frame(\n'''
          if old not in text:
              raise SystemExit('missing incremental dirty normalization anchor')
          text = text.replace(old, new, 1)

          function_start = text.index('    fn unique_path_replacement_dirties_only_its_geometry_chunks() {')
          next_test = text.index('    #[test]\n    fn path_arena_reuses_released_chunks', function_start)
          section = text[function_start:next_test]
          block_start = section.index('        assert_eq!(preparer.path_batch_vertex_ranges[0], first_vertex_range);')
          prepared_start = section.index('        assert_eq!(prepared.path_vertex_dirty_ranges.len(), 1);', block_start)
          preparer_block = section[block_start:prepared_start]
          section = section[:block_start] + section[prepared_start:]
          insertion = '        assert_eq!(prepared.stats.mega_path_count, OBJECT_COUNT);\n'
          insertion_at = section.index(insertion) + len(insertion)
          section = section[:insertion_at] + preparer_block + section[insertion_at:]
          text = text[:function_start] + section + text[next_test:]
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Validate renderer
        run: |
          cargo test -p noon-render-wgpu
          cargo clippy -p noon-render-wgpu --all-targets -- -D warnings
      - name: Commit implementation
        run: |
          rm scripts/_d2_bounded_patch.py .github/workflows/d2-apply-bounded.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/noon-render-wgpu scripts/_d2_bounded_patch.py .github/workflows/d2-apply-bounded.yml
          git commit -m 'Bound live path replacement to stable mesh chunks'
          git push origin HEAD:arch/d2-packed-mega-mesh
