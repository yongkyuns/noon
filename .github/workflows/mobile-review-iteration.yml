name: Mobile capture trace (temporary)
on:
  push:
    branches: [codex/mobile-review-iteration]
permissions:
  contents: read
  actions: read
concurrency:
  group: mobile-review-iteration
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Preserve diagnostic instrumentation
        run: cp mobile-capture-trace.py "$RUNNER_TEMP/mobile-capture-trace.py"
      - uses: actions/checkout@v7
        with:
          ref: d857c51dcd79f12f221daa3daeca7608165154a4
      - name: Use immutable integrated runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34175323387 --repo yongkyuns/noon --name playground-cross-browser-web-runtime --dir "$RUNNER_TEMP/runtime"
          mkdir -p web/pkg
          cp -a "$RUNNER_TEMP/runtime/pkg/." web/pkg/
          node scripts/build-python-worker.mjs
          python3 "$RUNNER_TEMP/mobile-capture-trace.py"
      - name: Install pinned WebKit
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install --with-deps webkit
      - name: Preserve exact intermediate and final captures before assertions
        env:
          NOON_PLAYGROUND_MATRIX_ARTIFACTS: mobile-review-evidence
        run: node scripts/playground-main-thread-mobile-smoke.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-capture-trace
          path: mobile-review-evidence
          retention-days: 7
