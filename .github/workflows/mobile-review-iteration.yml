name: Mobile pixel qualification (temporary)
on:
  push:
    branches: [codex/mobile-review-iteration]
permissions:
  contents: write
  actions: read
concurrency:
  group: mobile-review-iteration
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Save reviewed capture correction
        run: cp mobile-capture.patch "$RUNNER_TEMP/mobile-capture.patch"
      - uses: actions/checkout@v7
        with:
          ref: d857c51dcd79f12f221daa3daeca7608165154a4
      - name: Commit source-only capture correction
        run: |
          set -euo pipefail
          git apply --index "$RUNNER_TEMP/mobile-capture.patch"
          git diff --cached --check
          git config user.name 'Yongkyun Shin'
          git config user.email 'yongkyuns@gmail.com'
          git commit -m 'Compare mobile rendered pixels with the complete empty canvas capture'
          git push origin HEAD:refs/heads/codex/mobile-capture-candidate
          mkdir -p mobile-review-evidence
          git rev-parse HEAD > mobile-review-evidence/source-sha.txt
          git archive HEAD | gzip > mobile-review-evidence/source.tar.gz
      - name: Use immutable integrated runtime and regenerate Python assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34175323387 --repo yongkyuns/noon --name playground-cross-browser-web-runtime --dir "$RUNNER_TEMP/runtime"
          mkdir -p web/pkg
          cp -a "$RUNNER_TEMP/runtime/pkg/." web/pkg/
          node scripts/build-python-worker.mjs
      - name: Install pinned WebKit
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install webkit
      - name: Require intermediate and final pixels plus public source contracts
        env:
          NOON_PLAYGROUND_MATRIX_ARTIFACTS: mobile-review-evidence/first
        run: node scripts/playground-main-thread-mobile-smoke.mjs
      - name: Repeat with fresh browser contexts
        env:
          NOON_PLAYGROUND_MATRIX_ARTIFACTS: mobile-review-evidence/repeat
        run: node scripts/playground-main-thread-mobile-smoke.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-capture-qualified
          path: mobile-review-evidence
          retention-days: 7
