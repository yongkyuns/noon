name: Phase B PR 1372 restack

on:
  push:
    branches:
      - codex/74-scale-pivot-prep
    paths:
      - .github/phase-b-scale-pr1372-complete.py
      - .github/phase-b-scale-pr1372-fix.py
      - .github/workflows/phase-b-pr1372-restack.yml

permissions:
  contents: write

jobs:
  restack:
    runs-on: ubuntu-24.04
    env:
      BASE: 47d031e650eaad5ba4ab5de0f584b515f6a079b8
      OLD_BASE: 7edd6b41feee02355943868d48754bf0e23a706b
      OLD_HEAD: cba1cefb7020a453c0532e68e2c9de053ecd4459
      PRODUCT_BRANCH: codex/phase-b-scale-center-parity
      PREP_BRANCH: codex/74-scale-pivot-prep
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 47d031e650eaad5ba4ab5de0f584b515f6a079b8
          fetch-depth: 0

      - name: Verify ownership and current base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            "+refs/heads/master:refs/remotes/origin/master" \
            "+refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/${PRODUCT_BRANCH}" \
            "+refs/heads/${PREP_BRANCH}:refs/remotes/origin/${PREP_BRANCH}"
          test "$(git rev-parse origin/master)" = "$BASE"
          test "$(git rev-parse origin/${PRODUCT_BRANCH})" = "$OLD_HEAD"

      - name: Restack existing PR 1372 product delta
        shell: bash
        run: |
          set -euo pipefail
          git diff "$OLD_BASE" "$OLD_HEAD" -- \
            crates/noon-web/src/authoring_mobject.rs \
            crates/noon-web/src/semantic_execution_player.rs \
            crates/noon/src/family_affine.rs \
            crates/noon/src/live_session/family_layout.rs \
            crates/noon/tests/manim_scale.rs \
            crates/noon/tests/manim_scale_pivots.rs \
            > /tmp/pr1372-product.patch
          test -s /tmp/pr1372-product.patch
          git apply --3way /tmp/pr1372-product.patch
          git show "origin/${PREP_BRANCH}:.github/phase-b-scale-pr1372-complete.py" > /tmp/complete.py
          git show "origin/${PREP_BRANCH}:.github/phase-b-scale-pr1372-fix.py" > /tmp/fix.py
          python /tmp/complete.py
          python /tmp/fix.py

      - name: Format and focused qualification
        shell: bash
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p noon --no-default-features --test manim_scale --test manim_scale_pivots
          cargo check -p noon-native --example manim_scale_pivots
          cargo check -p noon-web --target wasm32-unknown-unknown
          python -m py_compile \
            web/python/_manim_semantic_handles.py \
            scripts/manim-differential.py \
            parity/manim-v0.21/core-examples/scale_pivots.py \
            web/python/examples/manim_parity_scale_pivots.py
          python - <<'PY'
          import json
          from pathlib import Path
          reference = Path("parity/manim-v0.21/core-examples/scale_pivots.py").read_text()
          noon = Path("web/python/examples/manim_parity_scale_pivots.py").read_text()
          assert noon == reference.replace("from manim import *", "from noon import *", 1)
          manifest = json.loads(Path("parity/manim-v0.21/manifest.json").read_text())
          fixture = next(item for item in manifest["fixtures"] if item["id"] == "scale-pivots")
          assert fixture["scene"] == "ScalePivots"
          assert fixture["expected_duration"] == 0.4
          PY
          node --check scripts/shared-authoring-smoke.mjs
          node --check scripts/browser-smoke.mjs
          node scripts/manim-raster-policy.test.mjs
          bash scripts/check.sh architecture
          git diff --check

      - name: Verify final product diff and base have not moved
        shell: bash
        run: |
          set -euo pipefail
          test ! -e crates/noon-web/src/manim_scale_pivot_bridge.rs
          git fetch origin "+refs/heads/master:refs/remotes/origin/master"
          test "$(git rev-parse origin/master)" = "$BASE"
          changed="$(git diff --name-only "$BASE" | sort)"
          printf '%s\n' "$changed"
          test -n "$changed"
          ! printf '%s\n' "$changed" | grep -E '^\.github/'

      - name: Publish qualified PR 1372 head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "noon phase-b worker"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "$PRODUCT_BRANCH"
          git add \
            crates/noon-web/src/authoring_mobject.rs \
            crates/noon-web/src/canonical_authoring_scene.rs \
            crates/noon-web/src/direct_execution_smoke.rs \
            crates/noon-web/src/semantic_execution_player.rs \
            crates/noon-native/examples/manim_scale_pivots.rs \
            crates/noon/src/example_scenes.rs \
            crates/noon/src/example_scenes/manim_scale_pivots.rs \
            crates/noon/src/family_affine.rs \
            crates/noon/src/live_session/family_layout.rs \
            crates/noon/tests/manim_scale.rs \
            crates/noon/tests/manim_scale_pivots.rs \
            parity/manim-v0.21/core-examples/scale_pivots.py \
            parity/manim-v0.21/manifest.json \
            scripts/browser-smoke.mjs \
            scripts/manim-differential.py \
            scripts/shared-authoring-smoke.mjs \
            web/python/_manim_semantic_handles.py \
            web/python/examples/manim_parity_scale_pivots.py
          git commit -m "fix: complete Manim scale pivot parity (#74)"
          git push --force-with-lease="refs/heads/${PRODUCT_BRANCH}:${OLD_HEAD}" \
            origin HEAD:"refs/heads/${PRODUCT_BRANCH}"
