name: Apply O1 differential coverage expansion

on:
  push:
    branches:
      - agent/parity-o1-differential-expansion
    paths:
      - .github/workflows/apply-parity-o1-diff.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/parity-o1-differential-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply fixture patch
        run: python scripts/apply-parity-o1-diff.py

      - name: Install Manim system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev ffmpeg pkg-config

      - name: Install pinned ManimCE
        run: python -m pip install 'manim==0.21.0'

      - name: Capture expanded differential results
        run: python scripts/manim-differential.py --json > parity-diagnostics.json || true

      - name: Commit patch and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand core Manim differential coverage"
          git push origin HEAD:agent/parity-o1-differential-expansion
