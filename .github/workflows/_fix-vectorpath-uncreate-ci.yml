name: Fix VectorPath Uncreate CI

on:
  push:
    branches:
      - parity/manim-vectorpath-uncreate

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parity/manim-vectorpath-uncreate
          fetch-depth: 1

      - name: Apply CI fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/noon-geometry/src/tessellation.rs')
          text = path.read_text()
          marker = '''#[derive(Clone, Copy, Debug, PartialEq)]
          struct RevealPoint {
              progress: f32,
              position: Vec2,
          }
          '''
          replacement = marker + '''
          #[derive(Clone, Copy, Debug, PartialEq)]
          struct CubicRevealCurve {
              start: Vec2,
              control1: Vec2,
              control2: Vec2,
              end: Vec2,
          }
          '''
          if marker not in text:
              raise SystemExit('RevealPoint marker not found')
          text = text.replace(marker, replacement, 1)

          old_call = '''                flatten_cubic_reveal(
                      &mut points,
                      progress(curve_index),
                      progress(curve_index + 1),
                      from,
                      control1,
                      control2,
                      to,
                      0,
                  );'''
          new_call = '''                flatten_cubic_reveal(
                      &mut points,
                      progress(curve_index),
                      progress(curve_index + 1),
                      CubicRevealCurve {
                          start: from,
                          control1,
                          control2,
                          end: to,
                      },
                      0,
                  );'''
          if old_call not in text:
              raise SystemExit('cubic call marker not found')
          text = text.replace(old_call, new_call, 1)

          old_fn = '''fn flatten_cubic_reveal(
              points: &mut Vec<RevealPoint>,
              start_progress: f32,
              end_progress: f32,
              start: Vec2,
              control1: Vec2,
              control2: Vec2,
              end: Vec2,
              depth: u8,
          ) {
              let flatness =
                  point_line_distance(control1, start, end).max(point_line_distance(control2, start, end));
              if depth >= 16 || flatness <= PATH_TESSELLATION_TOLERANCE {
                  append_reveal_segment(points, start_progress, end_progress, start, end);
                  return;
              }
              let a = midpoint(start, control1);
              let b = midpoint(control1, control2);
              let c = midpoint(control2, end);
              let d = midpoint(a, b);
              let e = midpoint(b, c);
              let center = midpoint(d, e);
              let mid_progress = (start_progress + end_progress) * 0.5;
              flatten_cubic_reveal(
                  points,
                  start_progress,
                  mid_progress,
                  start,
                  a,
                  d,
                  center,
                  depth + 1,
              );
              flatten_cubic_reveal(
                  points,
                  mid_progress,
                  end_progress,
                  center,
                  e,
                  c,
                  end,
                  depth + 1,
              );
          }
          '''
          new_fn = '''fn flatten_cubic_reveal(
              points: &mut Vec<RevealPoint>,
              start_progress: f32,
              end_progress: f32,
              curve: CubicRevealCurve,
              depth: u8,
          ) {
              let CubicRevealCurve {
                  start,
                  control1,
                  control2,
                  end,
              } = curve;
              let flatness =
                  point_line_distance(control1, start, end).max(point_line_distance(control2, start, end));
              if depth >= 16 || flatness <= PATH_TESSELLATION_TOLERANCE {
                  append_reveal_segment(points, start_progress, end_progress, start, end);
                  return;
              }
              let a = midpoint(start, control1);
              let b = midpoint(control1, control2);
              let c = midpoint(control2, end);
              let d = midpoint(a, b);
              let e = midpoint(b, c);
              let center = midpoint(d, e);
              let mid_progress = (start_progress + end_progress) * 0.5;
              flatten_cubic_reveal(
                  points,
                  start_progress,
                  mid_progress,
                  CubicRevealCurve {
                      start,
                      control1: a,
                      control2: d,
                      end: center,
                  },
                  depth + 1,
              );
              flatten_cubic_reveal(
                  points,
                  mid_progress,
                  end_progress,
                  CubicRevealCurve {
                      start: center,
                      control1: e,
                      control2: c,
                      end,
                  },
                  depth + 1,
              );
          }
          '''
          if old_fn not in text:
              raise SystemExit('cubic function marker not found')
          path.write_text(text.replace(old_fn, new_fn, 1))

          path = Path('scripts/manim-compat-smoke.mjs')
          text = path.read_text()
          old = '''        first = Square(side_length=0.6, color=BLUE)
                  self.add(first)
                  self.play(Uncreate(first), run_time=2.0, rate_func=rush_into)
                  assert first not in self.mobjects
          
                  kept = Circle(radius=0.25, color=PINK)
                  self.add(kept)
                  self.play(Uncreate(kept, remover=False), run_time=1.0)
                  assert kept in self.mobjects
          
                  forward = Square(side_length=0.4, color=GREEN)
                  self.add(forward)
                  self.play(Uncreate(forward, reverse_rate_function=False), run_time=1.0)
                  assert forward not in self.mobjects'''
          new = '''        first = Square(side_length=0.6, color=BLUE)
                  kept = Circle(radius=0.25, color=PINK)
                  forward = Square(side_length=0.4, color=GREEN)
                  self.add(first, kept, forward)
          
                  self.play(Uncreate(first), run_time=2.0, rate_func=rush_into)
                  assert first not in self.mobjects
          
                  self.play(Uncreate(kept, remover=False), run_time=1.0)
                  assert kept in self.mobjects
          
                  self.play(Uncreate(forward, reverse_rate_function=False), run_time=1.0)
                  assert forward not in self.mobjects'''
          if old not in text:
              raise SystemExit('Uncreate smoke marker not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format and lint geometry
        run: |
          cargo fmt --all -- --check
          cargo clippy -p noon-geometry --all-targets --all-features -- -D warnings
          cargo test -p noon-geometry

      - name: Commit source-only fixes
        run: |
          rm .github/workflows/_fix-vectorpath-uncreate-ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/noon-geometry/src/tessellation.rs scripts/manim-compat-smoke.mjs .github/workflows/_fix-vectorpath-uncreate-ci.yml
          git commit -m 'fix: satisfy VectorPath parity integration gates'
          git push origin HEAD:parity/manim-vectorpath-uncreate
