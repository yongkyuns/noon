name: Image workspace bootstrap (temporary)

on:
  push:
    branches: [codex/b2-image-workspace-bootstrap]
    paths: [.github/workflows/image-workspace-bootstrap.yml]

permissions:
  contents: read

concurrency:
  group: image-workspace-bootstrap
  cancel-in-progress: true

jobs:
  browser-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3397f0ff49dc44559e5e0323eedb3d3893f2e62f
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0,wasm-bindgen-cli@0.2.128
      - name: Export only public browser tools and packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/noon-tools/bin /tmp/noon-tools/browser
          cp "$(command -v wasm-pack)" "$(command -v wasm-bindgen)" /tmp/noon-tools/bin/
          cd /tmp/noon-tools/browser
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0 pyodide@314.0.5
          cd /tmp/noon-tools
          tar -czf /tmp/noon-browser-tools.tar.gz bin browser
      - uses: actions/upload-artifact@v4
        with:
          name: noon-image-browser-tools
          path: /tmp/noon-browser-tools.tar.gz
          retention-days: 1
          compression-level: 0
