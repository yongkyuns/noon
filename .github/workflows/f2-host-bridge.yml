name: F2 host bridge integration

on:
  push:
    branches:
      - arch/f2-engine-worker-transport

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Run F2 host bridge integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/f2-engine-worker-transport
      - name: Apply host bridge endpoints
        run: |
          python3 - <<'PY'
          from pathlib import Path

          legacy = Path('crates/noon-web/src/legacy.rs')
          text = legacy.read_text()
          anchor = '''    pub fn apply_patch_batch_json(&mut self, json: &str) -> Result<&FrameState, PlayerError> {\n'''
          method = '''    /// Apply a host-callback mutation batch without consuming the user-facing patch sequence.\n    ///\n    /// Host callback sequencing is owned by the engine worker. Keeping it separate\n    /// prevents a slow callback from racing an interactive authoring PatchBatch.\n    pub(crate) fn apply_host_patch_batch_json(\n        &mut self,\n        json: &str,\n    ) -> Result<&FrameState, PlayerError> {\n        let batch = decode_patch_batch(json)?;\n        self.apply_patches_transactionally(&batch.patches)?;\n        Ok(self.instance.frame())\n    }\n\n'''
          if 'apply_host_patch_batch_json' not in text:
              if anchor not in text:
                  raise SystemExit('legacy patch anchor not found')
              text = text.replace(anchor, method + anchor, 1)
          legacy.write_text(text)

          transport = Path('crates/noon-web/src/execution_transport.rs')
          text = transport.read_text()
          anchor = '''    pub fn apply_patch_batch_delta_json(\n        &mut self,\n        json: &str,\n    ) -> Result<Option<String>, ExecutionTransportError> {\n        self.player.apply_patch_batch_json(json)?;\n        self.take_delta_json()\n    }\n'''
          replacement = anchor + '''\n    pub fn apply_host_patch_batch_delta_json(\n        &mut self,\n        json: &str,\n    ) -> Result<Option<String>, ExecutionTransportError> {\n        self.player.apply_host_patch_batch_json(json)?;\n        self.take_delta_json()\n    }\n\n    pub fn snapshot_delta_json(&mut self) -> Result<String, ExecutionTransportError> {\n        self.force_snapshot_json()\n    }\n'''
          if 'pub fn apply_host_patch_batch_delta_json' not in text:
              if anchor not in text:
                  raise SystemExit('engine host patch anchor not found')
              text = text.replace(anchor, replacement, 1)

          wasm_anchor = '''        #[wasm_bindgen(js_name = replaceSceneDeltaJson)]\n        pub fn replace_scene_delta_json(&mut self, json: &str) -> Result<String, JsValue> {\n'''
          wasm_methods = '''        #[wasm_bindgen(js_name = applyHostPatchBatchDeltaJson)]\n        pub fn apply_host_patch_batch_delta_json(\n            &mut self,\n            json: &str,\n        ) -> Result<Option<String>, JsValue> {\n            self.inner\n                .apply_host_patch_batch_delta_json(json)\n                .map_err(js_error)\n        }\n\n        #[wasm_bindgen(js_name = snapshotDeltaJson)]\n        pub fn snapshot_delta_json(&mut self) -> Result<String, JsValue> {\n            self.inner.snapshot_delta_json().map_err(js_error)\n        }\n\n'''
          if '#[wasm_bindgen(js_name = applyHostPatchBatchDeltaJson)]' not in text:
              if wasm_anchor not in text:
                  raise SystemExit('wasm host patch anchor not found')
              text = text.replace(wasm_anchor, wasm_methods + wasm_anchor, 1)
          transport.write_text(text)

          client = Path('web/authoring-client.js')
          text = client.read_text()
          terminate_anchor = '''  terminate() {\n'''
          attach_method = '''  async attachEnginePort(port) {\n    if (!(port instanceof MessagePort)) {\n      throw new TypeError("engine host attachment requires a MessagePort");\n    }\n    await this.ready();\n    const requestId = this.#beginRequest();\n    const result = this.#resultFor(requestId);\n    this.#worker.postMessage(\n      envelope("attach_engine_port", { requestId, port }),\n      [port],\n    );\n    return result;\n  }\n\n'''
          if 'async attachEnginePort(port)' not in text:
              if terminate_anchor not in text:
                  raise SystemExit('authoring attach anchor not found')
              text = text.replace(terminate_anchor, attach_method + terminate_anchor, 1)
          result_anchor = '''      if (message.type === "callback_result") {\n        const batch = parsePatchBatchJson(message.patchBatchJson);\n        this.#settle(message.requestId, ({ resolve }) => resolve(batch));\n        return;\n      }\n'''
          attached_case = result_anchor + '''\n      if (message.type === "host_port_attached") {\n        this.#settle(message.requestId, ({ resolve }) => resolve(message));\n        return;\n      }\n'''
          if 'message.type === "host_port_attached"' not in text:
              if result_anchor not in text:
                  raise SystemExit('authoring response anchor not found')
              text = text.replace(result_anchor, attached_case, 1)
          client.write_text(text)

          worker = Path('web/python-worker.js')
          text = worker.read_text()
          const_anchor = '''const AUTHORING_PROTOCOL_VERSION = 5;\n'''
          consts = const_anchor + '''const HOST_CHANNEL = "noon.host-callback";\nconst HOST_PROTOCOL_VERSION = 1;\n'''
          if 'const HOST_CHANNEL = "noon.host-callback";' not in text:
              if const_anchor not in text:
                  raise SystemExit('python host constant anchor not found')
              text = text.replace(const_anchor, consts, 1)
          queue_anchor = '''let requestQueue = Promise.resolve();\n'''
          if 'let engineHostPort = null;' not in text:
              text = text.replace(queue_anchor, queue_anchor + 'let engineHostPort = null;\n', 1)

          callback_case = '''    if (request.type === "callback_phase") {\n      const patchBatchJson = await runCallbackPhase(\n        pyodide,\n        request.sessionId,\n        request.frame,\n        request.sequence,\n      );\n      post("callback_result", { requestId, patchBatchJson });\n      return;\n    }\n'''
          attach_case = '''    if (request.type === "attach_engine_port") {\n      engineHostPort?.close?.();\n      engineHostPort = request.port;\n      engineHostPort.addEventListener("message", (event) => {\n        requestQueue = requestQueue.then(() => handleHostRequest(event.data));\n      });\n      engineHostPort.start();\n      post("host_port_attached", { requestId });\n      return;\n    }\n'''
          if 'request.type === "attach_engine_port"' not in text:
              if callback_case not in text:
                  raise SystemExit('python attach case anchor not found')
              text = text.replace(callback_case, callback_case + attach_case, 1)

          authoring_fn_anchor = '''async function runAuthoringSource(pyodide, source, context) {\n'''
          host_fn = '''async function handleHostRequest(request) {\n  let requestId = null;\n  let generation = null;\n  try {\n    validateHostRequest(request);\n    requestId = request.requestId;\n    generation = request.generation;\n    const pyodide = await pyodidePromise;\n    const patchBatchJson = await runCallbackPhase(\n      pyodide,\n      request.sessionId,\n      request.frame,\n      request.sequence,\n    );\n    postHost("callback_result", { requestId, generation, patchBatchJson });\n  } catch (error) {\n    postHost("error", {\n      requestId,\n      generation,\n      message: error instanceof Error ? error.message : String(error),\n    });\n  }\n}\n\n'''
          if 'async function handleHostRequest(request)' not in text:
              if authoring_fn_anchor not in text:
                  raise SystemExit('python host handler anchor not found')
              text = text.replace(authoring_fn_anchor, host_fn + authoring_fn_anchor, 1)

          callback_validate = '''  if (request.type === "callback_phase") {\n    if (!Number.isSafeInteger(request.sessionId) || request.sessionId < 0) {\n      throw new Error("Python callback request has an invalid session ID");\n    }\n    if (!Number.isSafeInteger(request.sequence) || request.sequence < 0) {\n      throw new Error("Python callback request has an invalid patch sequence");\n    }\n    if (!isRecord(request.frame)) {\n      throw new Error("Python callback request must contain a frame object");\n    }\n    return;\n  }\n'''
          attach_validate = '''  if (request.type === "attach_engine_port") {\n    if (!(request.port instanceof MessagePort)) {\n      throw new Error("Python host attachment requires a MessagePort");\n    }\n    return;\n  }\n'''
          if 'Python host attachment requires a MessagePort' not in text:
              if callback_validate not in text:
                  raise SystemExit('python attach validation anchor not found')
              text = text.replace(callback_validate, callback_validate + attach_validate, 1)

          post_anchor = '''function post(type, payload = {}) {\n'''
          host_validation = '''function validateHostRequest(request) {\n  if (\n    !isRecord(request) ||\n    request.channel !== HOST_CHANNEL ||\n    request.protocolVersion !== HOST_PROTOCOL_VERSION ||\n    request.type !== "callback_phase" ||\n    !Number.isSafeInteger(request.requestId) ||\n    request.requestId < 0 ||\n    !Number.isSafeInteger(request.generation) ||\n    request.generation < 0 ||\n    !Number.isSafeInteger(request.sessionId) ||\n    request.sessionId < 0 ||\n    !Number.isSafeInteger(request.sequence) ||\n    request.sequence < 0 ||\n    !isRecord(request.frame)\n  ) {\n    throw new Error("invalid engine host callback request");\n  }\n}\n\nfunction postHost(type, payload = {}) {\n  if (engineHostPort === null) {\n    return;\n  }\n  engineHostPort.postMessage({\n    channel: HOST_CHANNEL,\n    protocolVersion: HOST_PROTOCOL_VERSION,\n    type,\n    ...payload,\n  });\n}\n\n'''
          if 'function validateHostRequest(request)' not in text:
              if post_anchor not in text:
                  raise SystemExit('python host post anchor not found')
              text = text.replace(post_anchor, host_validation + post_anchor, 1)
          worker.write_text(text)
          PY
          cargo fmt --all
      - name: Validate bridge endpoints
        run: |
          cargo fmt --all -- --check
          cargo test -p noon-web execution_transport
          node --check web/execution-engine-worker.js
          node --check web/execution-worker-client.js
          node --check web/authoring-client.js
          node --check web/python-worker.js
          cargo check -p noon-web --target wasm32-unknown-unknown
      - name: Commit bridge endpoints
        run: |
          rm .github/workflows/f2-host-bridge.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/noon-web/src/legacy.rs crates/noon-web/src/execution_transport.rs web/authoring-client.js web/python-worker.js .github/workflows/f2-host-bridge.yml
          git commit -m 'Connect Python host callbacks directly to engine worker'
          git push origin HEAD:arch/f2-engine-worker-transport
