name: Apply #1366 worker diagnostic delivery

on:
  push:
    branches:
      - codex/1366-webgpu-device-loss
    paths:
      - ".github/workflows/codex-1366-worker-diagnostic-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/1366-webgpu-device-loss
          fetch-depth: 0
          persist-credentials: true

      - name: Use repository Rust toolchain
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown

      - name: Apply bounded worker diagnostic fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/noon-web/src/retained_execution_canvas.rs')
          s = p.read_text()

          old = '''        gpu_generation: u32,\n        gpu_diagnostics: GpuDiagnosticMailbox,\n        pending_renderer_observation: Option<RendererObservationRequest>,\n'''
          new = '''        gpu_generation: u32,\n        gpu_diagnostics: GpuDiagnosticMailbox,\n        gpu_validation_scope: Option<wgpu::ErrorScopeGuard>,\n        pending_renderer_observation: Option<RendererObservationRequest>,\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''            let gpu_generation = 1;\n            let gpu_diagnostics = GpuDiagnosticMailbox::default();\n            install_wgpu_error_handler(&device, gpu_generation, backend, gpu_diagnostics.clone());\n\n            let width = canvas.width().max(1);\n'''
          new = '''            let gpu_generation = 1;\n            let gpu_diagnostics = GpuDiagnosticMailbox::default();\n            install_wgpu_error_handler(&device, gpu_generation, backend, gpu_diagnostics.clone());\n            let gpu_validation_scope = (backend == wgpu::Backend::BrowserWebGpu)\n                .then(|| device.push_error_scope(wgpu::ErrorFilter::Validation));\n\n            let width = canvas.width().max(1);\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''                gpu_generation,\n                gpu_diagnostics,\n                pending_renderer_observation: None,\n'''
          new = '''                gpu_generation,\n                gpu_diagnostics,\n                gpu_validation_scope,\n                pending_renderer_observation: None,\n'''
          assert old in s
          s = s.replace(old, new, 1)

          marker = '''        #[wasm_bindgen(js_name = takeGpuDiagnosticJson)]\n        pub fn take_gpu_diagnostic_json(&self) -> Result<Option<String>, JsValue> {\n'''
          method = '''        /// Flush one WebGPU validation error scope into the shared diagnostic mailbox.\n        ///\n        /// Browser worker uncaptured-error delivery is not a reliable scheduling\n        /// boundary. Keep validation recoverable by explicitly closing the current\n        /// device scope at an async host-control boundary, re-arming it immediately,\n        /// and publishing any captured error through the same generation-aware mailbox\n        /// used by direct hosts. OOM/internal errors remain on the uncaptured fatal path.\n        #[wasm_bindgen(js_name = flushGpuDiagnostics)]\n        pub async fn flush_gpu_diagnostics(&mut self) -> Result<bool, JsValue> {\n            let Some(scope) = self.gpu_validation_scope.take() else {\n                return Ok(false);\n            };\n            let pending = scope.pop();\n            self.gpu_validation_scope =\n                Some(self.device.push_error_scope(wgpu::ErrorFilter::Validation));\n            let Some(error) = pending.await else {\n                return Ok(false);\n            };\n            self.gpu_diagnostics\n                .record_wgpu(self.gpu_generation, self.backend, error);\n            Ok(true)\n        }\n\n'''
          assert marker in s
          s = s.replace(marker, method + marker, 1)
          p.write_text(s)

          p = Path('web/authoring-render-controller.js')
          s = p.read_text()
          old = '''      validateMainMessage(message);\n      if (webglRecoveryPromise !== null) await webglRecoveryPromise;\n      switch (message.type) {\n'''
          new = '''      validateMainMessage(message);\n      if (webglRecoveryPromise !== null) await webglRecoveryPromise;\n      if (!(await flushGpuDiagnostics())) return;\n      switch (message.type) {\n'''
          assert old in s
          s = s.replace(old, new, 1)

          marker = '''  function drainGpuDiagnostics() {\n    if (renderer === null) return true;\n'''
          helper = '''  async function flushGpuDiagnostics() {\n    if (renderer === null) return true;\n    try {\n      await renderer.flushGpuDiagnostics?.();\n      return drainGpuDiagnostics();\n    } catch (error) {\n      fail(error, null);\n      return false;\n    }\n  }\n\n'''
          assert marker in s
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          cargo check -p noon-web --target wasm32-unknown-unknown --features renderer-smoke
          cargo test -p noon-web --lib gpu_diagnostics
          node --check web/authoring-render-controller.js
          node --test web/authoring-render-transition-runtime.test.mjs
          node --test web/authoring-render-transition.test.mjs
          git diff --check

      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/codex-1366-worker-diagnostic-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: surface worker WebGPU validation diagnostics"
          git push origin HEAD:codex/1366-webgpu-device-loss
