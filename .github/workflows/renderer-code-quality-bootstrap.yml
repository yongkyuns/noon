# Temporary developer bootstrap for this repair branch; remove before review/merge.
# Only public pinned test dependencies; no repository credentials are archived.
name: Code quality repair bootstrap
on:
  push:
    branches: [fix/code-border-manim-parity]
    paths: [.github/workflows/renderer-code-quality-bootstrap.yml]
permissions:
  contents: read
jobs:
  bootstrap:
    if: github.repository == 'yongkyuns/noon' && github.ref == 'refs/heads/fix/code-border-manim-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download pinned reference lexer
        run: |
          mkdir -p /tmp/noon-code-oracle
          python3 -m pip download --no-deps --dest /tmp/noon-code-oracle 'Pygments==2.19.2'
          sha256sum /tmp/noon-code-oracle/*.whl > /tmp/noon-code-oracle/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: code-repair-pygments-oracle
          path: /tmp/noon-code-oracle
          retention-days: 1
