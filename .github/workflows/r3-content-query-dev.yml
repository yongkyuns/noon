name: R3 content and query qualification
on:
  push:
    branches: [codex/1292-r3-content-query-prep]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reconcile scoped native-qualified patch with newly landed master
        run: |
          mkdir -p /tmp/r3-content-integration
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          patch = gzip.decompress(base64.b64decode(pathlib.Path('.github/r3-content.patch.b64').read_text(), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'df20d16e51f9bb181b76b32822456e43d4610b55967f5b7903f48f072f0793c3'
          old = b'-  assert.equal(report.python.additionalTests, 9);'
          new = b'+  assert.equal(report.python.additionalTests, 10);'
          assert patch.count(old) == patch.count(new) == 1
          patch = patch.replace(old, b'-  assert.equal(report.python.additionalTests, 10);').replace(new, b'+  assert.equal(report.python.additionalTests, 11);')
          pathlib.Path('/tmp/r3-content-integration/input.patch').write_bytes(patch)
          PY
          base=b9d6c4cbd82a6333551663358946294538cc3842
          parent=74afb348d23c378f9ee827f5015b9095d6c573dd
          test "$(git rev-parse refs/remotes/origin/codex/1292-r3-content-query)" = "$parent"
          git checkout --detach "$base"
          git archive --format=tar.gz HEAD > /tmp/r3-content-integration/base-source.tar.gz
          git apply --index /tmp/r3-content-integration/input.patch
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          node --check scripts/typed-authoring-errors-smoke.mjs
          git config user.name 'Yongkyun Shin'
          git config user.email '4311628+yongkyuns@users.noreply.github.com'
          tree=$(git write-tree)
          candidate=$(git commit-tree "$tree" -p "$parent" -p "$base" -m 'fix: reconcile content/query boundary tests with current master')
          git reset --hard "$candidate"
          git rev-parse HEAD HEAD^{tree} > /tmp/r3-content-integration/revisions.txt
          echo "$base" > /tmp/r3-content-integration/base.txt
          git diff "$base" HEAD > /tmp/r3-content-integration/product.patch
          git archive --format=tar.gz HEAD > /tmp/r3-content-integration/source.tar.gz
      - name: Complete Python suite on the actual combined source
        run: |
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s web/python -p 'test_*.py' 2>&1 | tee /tmp/r3-content-integration/python.log
      - name: Publish integrated draft for normal exact-event native and WASM checks
        run: |
          set -o pipefail
          if git push origin HEAD:refs/heads/codex/1292-r3-content-query 2>&1 | tee /tmp/r3-content-integration/publication.log; then
            echo pushed > /tmp/r3-content-integration/publication-status.txt
          else
            echo 'Not published; connector publication of the recorded commit is required.' > /tmp/r3-content-integration/publication-status.txt
          fi
      - name: Retain final source state
        if: always()
        run: |
          git status --short > /tmp/r3-content-integration/status.txt
          git rev-parse HEAD > /tmp/r3-content-integration/final-head.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r3-content-current-master
          path: /tmp/r3-content-integration
          retention-days: 7
