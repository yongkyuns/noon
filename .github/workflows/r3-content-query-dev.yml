name: R3 content and query qualification
on:
  push:
    branches: [codex/1292-r3-content-query-prep]
permissions:
  contents: read
  actions: write
  pull-requests: read
jobs:
  approve-and-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Approve only the explicitly authorized current-head held runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/r3-resume
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, urllib.error
          root = 'https://api.github.com/repos/yongkyuns/noon'
          expected = 'e4c2b7ee44416eb328bb42a70e462e1da85eceaf'
          ids = [34378530142,34378530219,34378530226,34378530283,34378530144,34378530159,34378530177,34378530157,34378530269,34378530244]
          def api(path, method='GET'):
              request = urllib.request.Request(root + path, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = response.read()
                  return response.status, json.loads(data) if data else None
          _, pr = api('/pulls/1355')
          assert pr['state'] == 'open' and pr['head']['sha'] == expected, 'PR moved; refuse stale approval'
          results = []
          try:
              for run_id in ids:
                  _, run = api('/actions/runs/' + str(run_id))
                  assert run['head_sha'] == expected and run['event'] == 'pull_request'
                  assert any(p['number'] == 1355 for p in run['pull_requests'])
                  row = {'id': run_id, 'name': run['name'], 'head': run['head_sha'], 'before': run['conclusion']}
                  results.append(row)
                  if run['conclusion'] == 'action_required':
                      try:
                          status, body = api('/actions/runs/' + str(run_id) + '/approve', 'POST')
                          row.update(approval_status=status, response=body)
                          assert status == 201
                      except urllib.error.HTTPError as error:
                          row.update(approval_status=error.code, response=error.read().decode())
                          raise
                  else:
                      row['action'] = 'already resolved; not rerun'
                  print(json.dumps(row), flush=True)
          finally:
              pathlib.Path('/tmp/r3-resume/approvals.json').write_text(json.dumps(results, indent=2))
          PY
      - uses: actions/checkout@v7
        if: always()
        with:
          ref: 5b56124312657c0959e1ca3936930cad0fe7e240
          fetch-depth: 0
      - name: Retain exact master and ownership handoffs without building
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rev-parse HEAD HEAD^{tree} > /tmp/r3-resume/master-revisions.txt
          git archive --format=tar.gz HEAD > /tmp/r3-resume/master-source.tar.gz
          git diff --stat e4c2b7ee44416eb328bb42a70e462e1da85eceaf...HEAD > /tmp/r3-resume/master-delta-stat.txt
          git diff e4c2b7ee44416eb328bb42a70e462e1da85eceaf...HEAD -- crates/noon-web web/python scripts/typed-authoring-errors-smoke.mjs > /tmp/r3-resume/master-relevant.patch
          for pr in 1350 1354 1355; do
            gh api repos/yongkyuns/noon/pulls/$pr > /tmp/r3-resume/pr-$pr.json
            gh api --paginate repos/yongkyuns/noon/issues/$pr/comments > /tmp/r3-resume/comments-$pr.json
          done
          gh api --paginate repos/yongkyuns/noon/issues/1292/comments > /tmp/r3-resume/comments-1292.json
          git status --short > /tmp/r3-resume/status.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r3-1355-approval-and-source
          path: /tmp/r3-resume
          retention-days: 7
