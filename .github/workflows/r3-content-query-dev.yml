name: R3 content and query qualification
on:
  push:
    branches: [codex/1292-r3-content-query-prep]
permissions:
  contents: read
jobs:
  inspect-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 35658f4a9468ca44cc5dcfb97e7aae8b62e38e08
          fetch-depth: 0
      - name: Prove clean composition and unchanged content-query test bodies
        run: |
          mkdir -p /tmp/r3-composition
          base=35658f4a9468ca44cc5dcfb97e7aae8b62e38e08
          head=2ebf43857584e6fafdde8bd9955191400d642e1b
          git config user.name 'Yongkyun Shin'
          git config user.email '4311628+yongkyuns@users.noreply.github.com'
          git merge --no-commit --no-ff "$head"
          git diff --cached --check
          git rev-parse HEAD > /tmp/r3-composition/base.txt
          git write-tree > /tmp/r3-composition/combined-tree.txt
          git diff --cached --stat > /tmp/r3-composition/combined-stat.txt
          git diff --cached > /tmp/r3-composition/content-query.patch
          git diff 5b56124312657c0959e1ca3936930cad0fe7e240 "$base" > /tmp/r3-composition/landed-family.patch
          python3 - <<'PY'
          import ast, json, pathlib, subprocess
          head='2ebf43857584e6fafdde8bd9955191400d642e1b'
          paths=['scripts/typed-authoring-errors-smoke.mjs','web/python/test_noon_errors_wasm.py','web/python/_manim_scene.py']
          for path in paths:
              assert pathlib.Path(path).read_bytes()==subprocess.check_output(['git','show',head+':'+path]),path
          def methods(text):
              return {n.name:ast.dump(n,include_attributes=False) for n in ast.walk(ast.parse(text)) if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)) and n.name.startswith('test_')}
          main=methods(pathlib.Path(paths[1]).read_text())
          assert len(main)==12
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(changed)==5,changed
          pathlib.Path('/tmp/r3-composition/preservation.json').write_text(json.dumps({'head':head,'unchanged_files_from_tested_head':paths,'general_wasm_count':12,'content_query_diff_files':changed,'scope':'source/Python composition only; no new Rust or WASM execution'},indent=2))
          PY
          node --check scripts/typed-authoring-errors-smoke.mjs
          git archive --format=tar.gz "$(git write-tree)" > /tmp/r3-composition/source.tar.gz
      - name: Complete Python discovery on the composition
        run: |
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s web/python -p 'test_*.py' 2>&1 | tee /tmp/r3-composition/python.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r3-1355-family-source-composition
          path: /tmp/r3-composition
          retention-days: 7
