name: R3 content and query qualification
on:
  push:
    branches: [codex/1292-r3-content-query-prep]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read completed qualification evidence without building or rerunning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/r3-final-evidence
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, urllib.request
          root='https://api.github.com/repos/yongkyuns/noon'
          out=pathlib.Path('/tmp/r3-final-evidence')
          head='2ebf43857584e6fafdde8bd9955191400d642e1b'
          def read(path):
              request=urllib.request.Request(root+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=45) as response: return response.read()
          def clean(data):
              text=re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]','',data.decode('utf-8-sig'))
              return ''.join(c for c in text if c in '\n\r\t' or ord(c)>=32)
          for path,name in [('/pulls/1355','pr.json'),('/issues/1355/comments?per_page=100','comments.json'),('/pulls/1355/reviews?per_page=100','reviews.json'),('/git/ref/heads/master','master.json'),('/git/commits/003a8fbc4a1503e2e59b7cce831582c14fbeb2f3','tested-merge.json'),('/actions/runs?event=pull_request&head_sha='+head+'&per_page=100','runs.json'),('/actions/runs/34390159552','full-run.json')]:
              out.joinpath(name).write_bytes(read(path))
          manifest=[]
          for job_id,name in [(102594426796,'current-browser.log'),(102594426866,'current-native-unit.log'),(102594426765,'current-web-preflight.log'),(102596995590,'current-product.log')]:
              job=json.loads(read('/actions/jobs/'+str(job_id)))
              assert job['status']=='completed' and job['conclusion']=='success', (name,job['status'],job['conclusion'])
              data=read('/actions/jobs/'+str(job_id)+'/logs')
              out.joinpath(name).write_text(clean(data))
              manifest.append({'job_id':job_id,'file':name,'run_id':job['run_id'],'conclusion':job['conclusion'],'raw_sha256':hashlib.sha256(data).hexdigest(),'sanitized_sha256':hashlib.sha256(out.joinpath(name).read_bytes()).hexdigest()})
          out.joinpath('log-manifest.json').write_text(json.dumps(manifest,indent=2))
          browser=out.joinpath('current-browser.log').read_text()
          assert '003a8fbc4a1503e2e59b7cce831582c14fbeb2f3' in browser
          print('Archived four completed, successful exact-head jobs; no compilation or test rerun.')
          for row in manifest: print(row['file'],row['job_id'],row['conclusion'])
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r3-1355-completed-ci-evidence
          path: /tmp/r3-final-evidence
          retention-days: 7
