name: R3 content and query qualification
on:
  push:
    branches: [codex/1292-r3-content-query-prep]
permissions:
  contents: read
  actions: read
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 2ebf43857584e6fafdde8bd9955191400d642e1b
          fetch-depth: 0
      - name: Record exact product source
        run: |
          mkdir -p /tmp/r3-full
          test "$(git rev-parse HEAD^{tree})" = cfb1475e6317804f4ccb3a52a4e853035cc516bf
          git rev-parse HEAD HEAD^{tree} > /tmp/r3-full/revisions.txt
          echo 5b56124312657c0959e1ca3936930cad0fe7e240 > /tmp/r3-full/base.txt
          git archive --format=tar.gz HEAD > /tmp/r3-full/source.tar.gz
          git diff 5b56124312657c0959e1ca3936930cad0fe7e240 HEAD > /tmp/r3-full/product.patch
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Required full architecture, Rust, Python and optimized release-WASM gate
        run: |
          set -o pipefail
          bash scripts/check.sh full 5b56124312657c0959e1ca3936930cad0fe7e240 2>&1 | tee /tmp/r3-full/full.log
      - name: Preserve exact lockfile, compiled release package and source state
        if: always()
        run: |
          if test -f Cargo.lock; then cp Cargo.lock /tmp/r3-full/Cargo.lock; fi
          if test -f web/pkg/noon_web_bg.wasm; then
            tar -czf /tmp/r3-full/release-package.tar.gz web/pkg web/python-worker.js web/python/compat-bundle.*.json
            sha256sum web/pkg/noon_web_bg.wasm > /tmp/r3-full/wasm-sha256.txt
          fi
          git status --short > /tmp/r3-full/status.txt
          git diff --exit-code
      - name: Archive already-completed predecessor evidence without terminal control bytes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, urllib.request
          base='https://api.github.com/repos/yongkyuns/noon'
          for path,name in [('/actions/jobs/102591146255/logs','approved-predecessor-browser.log'),('/actions/runs?event=pull_request&head_sha=e4c2b7ee44416eb328bb42a70e462e1da85eceaf&per_page=100','approved-predecessor-runs.json')]:
              request=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response: text=response.read().decode('utf-8-sig')
              text=re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]','',text)
              text=''.join(c for c in text if c in '\n\r\t' or ord(c)>=32)
              pathlib.Path('/tmp/r3-full',name).write_text(text)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r3-1355-full-qualification
          path: /tmp/r3-full
          retention-days: 7
