name: Audio 2296 + 2331 recovery candidate gate

# Temporary branch-only integration qualification. Never merge this workflow.
on:
  push:
    branches: [codex/audio-2296-2331-recovery-qualification]
    paths:
      - .github/workflows/audio-2296-2331-qualification.yml

permissions:
  contents: read

concurrency:
  group: audio-2296-2331-recovery-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: "READ_ONLY"
      MASTER: f71a4c121bc29921133f790ae9783e89e962e7d9
      CANDIDATE: 6d9ee7783537b250ed06255d03b82eb5f8280b5f
    steps:
      - name: Checkout exact combined source
        uses: actions/checkout@v7
        with:
          ref: 6d9ee7783537b250ed06255d03b82eb5f8280b5f
          fetch-depth: 0
          persist-credentials: false
      - name: Assert immutable qualification inputs
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^{tree})" = 61c4dd39490c578f94a2845cd7851bba90992941
          test -z "$(git status --porcelain)"
          test "$(git hash-object web/worker-audio-device.js)" = 27effe9441745f3c2f82157306e95d212edc4cb3
          test "$(git hash-object web/worker-audio-device.test.mjs)" = a52baf962a15d4111fc40c465dddf060ca156cf1
          test "$(sha256sum scripts/python-background-audio-smoke.mjs | cut -d' ' -f1)" = 7c55278f83df2ecb1494a449729afa637f615f63f8b3d341e455011b00d7f61a
          git rev-parse HEAD HEAD^{tree} > evidence/source.txt
          git diff --check
      - name: Check JavaScript syntax and WASM initialization recovery
        run: |
          set -euo pipefail
          node --check web/worker-audio-device.js
          node --check web/worker-audio-device.test.mjs
          node --test web/worker-audio-device.test.mjs 2>&1 | tee evidence/recovery-tests.log
          printf 'passed\n' > evidence/recovery-tests.result
      - name: Use repository-pinned Rust and WASM target
        run: |
          rustup install
          rustup show active-toolchain
          rustc --version --verbose | tee evidence/rustc.txt
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - name: Use sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Install native audio build dependencies
        run: bash scripts/ci-install-reference-deps.sh libasound2-dev pkg-config
      - name: Run original pointer and locality regressions
        run: |
          set -euo pipefail
          cargo test -p noon --lib execution_session::input::presentation::compatibility_tests --locked 2>&1 | tee evidence/pointer-regressions.log
          cargo test -p noon-runtime --lib linear_gradient_tests --locked 2>&1 | tee evidence/paint-locality.log
      - name: Run complete repository gate
        run: |
          set -euo pipefail
          bash scripts/check.sh full "$MASTER" 2>&1 | tee evidence/full-gate.log
          printf 'passed\n' > evidence/full-gate.result
      - name: Retain exact-source qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audio-2296-2331-recovery-qualification
          path: evidence/
          if-no-files-found: error
          retention-days: 7
