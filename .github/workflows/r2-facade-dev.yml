name: R2 facade development
on:
  push:
    branches: [codex/1272-r2-public-facade-prep]
permissions:
  contents: write
concurrency:
  group: r2-facade-development
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  transaction-causes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: d6734d2a0626f5c9926e4043ad2017a94f5c8c5a
          path: source
          fetch-depth: 0
      - name: Apply the disjoint transaction cause fix
        working-directory: source
        run: |
          python3 ../tooling/.github/r2-transaction-causes.py
          cargo fmt --all
          git diff --check
          cargo test -p noon-core --test transaction_error_causes > ../causes.log 2>&1 || { tail -120 ../causes.log; exit 1; }
          cargo test -p noon-core --lib semantic_transaction >> ../causes.log 2>&1 || { tail -120 ../causes.log; exit 1; }
          cargo clippy -p noon-core --all-targets -- -D warnings >> ../causes.log 2>&1 || { tail -120 ../causes.log; exit 1; }
          bash scripts/check.sh architecture d6734d2a0626f5c9926e4043ad2017a94f5c8c5a >> ../causes.log 2>&1
          cargo test -p noon-core --test transaction_error_causes --target wasm32-unknown-unknown --no-run >> ../causes.log 2>&1 || { tail -120 ../causes.log; exit 1; }
          tail -30 ../causes.log
      - name: Publish source-only candidate and provenance
        working-directory: source
        run: |
          git config user.name 'Noon development tooling'
          git config user.email 'development@noon.invalid'
          git add crates/noon-core/src/semantic_store/semantic_transaction.rs crates/noon-core/src/semantic_store/semantic_transaction/prepared.rs crates/noon-core/tests/transaction_error_causes.rs
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" = 3
          git -c commit.gpgSign=false -c core.hooksPath=/dev/null commit -m 'fix: expose existing semantic transaction error causes (#1272 R2)'
          git diff --exit-code
          git push origin HEAD:refs/heads/codex/1272-r2-transaction-causes
          git rev-parse HEAD > ../candidate-sha.txt
          git archive HEAD | gzip > ../candidate.tar.gz
          git diff HEAD^ HEAD > ../candidate.patch
          cat ../candidate-sha.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r2-transaction-causes
          path: |
            causes.log
            candidate-sha.txt
            candidate.tar.gz
            candidate.patch
          retention-days: 3
          if-no-files-found: error
