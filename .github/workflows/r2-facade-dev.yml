name: R2 facade development
on:
  push:
    branches: [codex/1272-r2-public-facade-prep]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r2-facade-development
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Retain pinned tracked source for facade editing
        run: |
          git archive --format=tar 1641398818b6817678ae178faf2887e4ac1e730f | gzip > source.tar.gz
          sha256sum source.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: r2-facade-pinned-source
          path: source.tar.gz
          if-no-files-found: error
          retention-days: 1
