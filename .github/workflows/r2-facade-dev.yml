name: R2 facade development
on:
  push:
    branches: [codex/1272-r2-public-facade-prep]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r2-facade-development
  cancel-in-progress: true
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 7e3ee4feab9aa281efd7f256e292cffcc18265fa
          fetch-depth: 0
          persist-credentials: false
      - name: Capture only the pinned source and original R2 delta
        run: |
          mkdir -p evidence/preimages
          git archive --format=tar HEAD | gzip > evidence/master.tar.gz
          base=$(git merge-base HEAD 6e97a36ac3834f1f0aac280e788b18055ec87d67)
          printf 'master=%s\ntyped=%s\nmerge_base=%s\n' "$(git rev-parse HEAD)" 6e97a36ac3834f1f0aac280e788b18055ec87d67 "$base" > evidence/refs.txt
          git diff --binary --full-index "$base" 6e97a36ac3834f1f0aac280e788b18055ec87d67 > evidence/typed.patch
          git diff --name-status "$base" 6e97a36ac3834f1f0aac280e788b18055ec87d67 > evidence/changed.txt
          git diff --raw --no-abbrev "$base" 6e97a36ac3834f1f0aac280e788b18055ec87d67 | awk '{print $3}' | sort -u | while read -r blob; do
            if [ "$blob" != 0000000000000000000000000000000000000000 ]; then
              git cat-file blob "$blob" > "evidence/preimages/$blob"
            fi
          done
          cat evidence/refs.txt
          cat evidence/changed.txt
          sha256sum evidence/master.tar.gz evidence/typed.patch
      - uses: actions/upload-artifact@v7
        with:
          name: r2-typed-reconciliation-input
          path: evidence/
          if-no-files-found: error
          retention-days: 1
