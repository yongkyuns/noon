name: R2 facade development
on:
  push:
    branches: [codex/1272-r2-public-facade-prep]
permissions:
  contents: write
concurrency:
  group: r2-facade-development
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  lowering-causes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: d6734d2a0626f5c9926e4043ad2017a94f5c8c5a
          path: source
          fetch-depth: 0
      - name: Apply only compiler/runtime source forwarding
        working-directory: source
        run: |
          python3 ../tooling/.github/r2-lowering-causes.py
          cargo fmt --all
          git diff --check
          cargo test -p noon-compile -p noon-runtime --test error_causes > ../causes.log 2>&1 || { tail -160 ../causes.log; exit 1; }
          cargo test -p noon-compile -p noon-runtime --all-features >> ../causes.log 2>&1 || { tail -160 ../causes.log; exit 1; }
          cargo clippy -p noon-compile -p noon-runtime --all-targets --all-features -- -D warnings >> ../causes.log 2>&1 || { tail -160 ../causes.log; exit 1; }
          bash scripts/check.sh architecture d6734d2a0626f5c9926e4043ad2017a94f5c8c5a >> ../causes.log 2>&1
          cargo test -p noon-compile -p noon-runtime --test error_causes --target wasm32-unknown-unknown --no-run >> ../causes.log 2>&1 || { tail -160 ../causes.log; exit 1; }
          tail -40 ../causes.log
      - name: Publish exact source-only candidate
        working-directory: source
        run: |
          git config user.name 'Noon development tooling'
          git config user.email 'development@noon.invalid'
          git add crates/noon-compile crates/noon-runtime
          git diff --cached --check
          git -c commit.gpgSign=false -c core.hooksPath=/dev/null commit -m 'fix: preserve compiler and runtime error cause chains (#1272 R2)'
          git diff --exit-code
          git push origin HEAD:refs/heads/codex/1272-r2-lowering-causes
          git rev-parse HEAD > ../candidate-sha.txt
          git archive HEAD | gzip > ../candidate.tar.gz
          git diff HEAD^ HEAD > ../candidate.patch
          cat ../candidate-sha.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r2-lowering-causes
          path: |
            causes.log
            candidate-sha.txt
            candidate.tar.gz
            candidate.patch
          retention-days: 3
          if-no-files-found: error
