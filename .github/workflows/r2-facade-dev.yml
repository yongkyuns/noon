name: R2 facade development
on:
  push:
    branches: [codex/1272-r2-public-facade-prep]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: r2-facade-development
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: 'true'
  SCCACHE_GHA_RW_MODE: READ_ONLY
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: codex/1272-r2-public-facade
          path: source
          fetch-depth: 0
      - name: Correct the pinned candidate and preserve independent consumers
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = 62a6d78b6382e902ff3bef77956e98f2f67f650b
          python3 ../tooling/.github/r2-facade-correct.py
          cargo fmt --all
          cargo fmt --manifest-path fixtures/provider-consumer/Cargo.toml
          git diff --check
          git diff --stat
      - name: Publish the corrected candidate without development helpers
        working-directory: source
        run: |
          git config user.name 'Noon development tooling'
          git config user.email 'development@noon.invalid'
          git add crates README.md fixtures/provider-consumer .github/workflows/provider-features.yml
          git -c commit.gpgSign=false -c core.hooksPath=/dev/null commit -m 'fix: preserve prepared transaction access and qualify the minimal facade'
          git push origin HEAD:refs/heads/codex/1272-r2-public-facade
          git rev-parse HEAD
          git archive --format=tar HEAD | gzip > ../candidate.tar.gz
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: r2-facade-sources-${{ runner.os }}-${{ hashFiles('source/Cargo.toml', 'source/crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
            provider-sources-${{ runner.os }}-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Check all workspace callers and features
        working-directory: source
        run: cargo check --workspace --all-targets --all-features
      - name: Exercise the independent public consumer
        working-directory: source
        run: cargo test --manifest-path fixtures/provider-consumer/Cargo.toml --test public_facade
      - name: Exercise public API documentation and paired Rust example
        working-directory: source
        run: |
          cargo test -p noon --no-default-features --doc
          cargo run -p noon --no-default-features --example shared_authoring
      - name: Enforce the common architecture gate
        working-directory: source
        run: bash scripts/check.sh architecture 1641398818b6817678ae178faf2887e4ac1e730f
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r2-facade-candidate-source
          path: candidate.tar.gz
          if-no-files-found: error
          retention-days: 1
