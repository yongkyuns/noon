name: Stage generic DashedVMobject

on:
  push:
    branches:
      - codex/b2-dashed-vmobject

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Wire shared surfaces
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              print(f"PATCH {path}: {old.splitlines()[0]!r} -> {count}")
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "crates/noon/src/lib.rs",
              "mod dashed_line_authoring;\n",
              "mod dashed_line_authoring;\nmod dashed_vmobject_authoring;\n",
          )
          replace_once(
              "crates/noon/src/lib.rs",
              "pub use dashed_line_authoring::DashedLineAuthoringError;\n",
              "pub use dashed_line_authoring::DashedLineAuthoringError;\npub use dashed_vmobject_authoring::DashedVMobjectOptions;\n",
          )
          replace_once(
              "crates/noon/src/live_session.rs",
              "mod boolean_geometry;\n",
              "mod boolean_geometry;\nmod dashed_vmobject;\n",
          )

          replace_once(
              "crates/noon-web/src/authoring_mobject.rs",
              '''        pub fn subcurve(&self, a: f64, b: f64) -> Result<WasmAuthoringMobjectHandle, JsValue> {
                      self.handle
                          .subcurve(a, b)
                          .map(Self::from_semantic_mobject)
                          .map_err(js_error)
                  }
          ''',
              '''        pub fn subcurve(&self, a: f64, b: f64) -> Result<WasmAuthoringMobjectHandle, JsValue> {
                      self.handle
                          .subcurve(a, b)
                          .map(Self::from_semantic_mobject)
                          .map_err(js_error)
                  }

                  #[wasm_bindgen(js_name = dashedVmobject)]
                  pub fn dashed_vmobject(
                      &self,
                      num_dashes: i32,
                      dashed_ratio: f64,
                      dash_offset: f64,
                      equal_lengths: bool,
                  ) -> Result<WasmAuthoringMobjectHandle, JsValue> {
                      self.handle
                          .dashed_vmobject(noon::DashedVMobjectOptions {
                              num_dashes,
                              dashed_ratio,
                              dash_offset,
                              equal_lengths,
                          })
                          .map(Self::from_semantic_mobject)
                          .map_err(js_error)
                  }
          ''',
          )

          replace_once(
              "crates/noon-web/src/semantic_execution_player.rs",
              '''    #[cfg(any(target_arch = "wasm32", test))]
              fn with_live_session<T>(
          ''',
              '''    #[cfg(any(target_arch = "wasm32", test))]
              pub(crate) fn live_dashed_vmobject(
                  &mut self,
                  source: &noon::Mobject,
                  options: noon::DashedVMobjectOptions,
              ) -> Result<noon::Mobject, AuthoringFailure> {
                  self.with_live_session(|live| live.dashed_vmobject(source, options))
              }

              #[cfg(any(target_arch = "wasm32", test))]
              fn with_live_session<T>(
          ''',
          )

          replace_once(
              "crates/noon-web/src/canonical_authoring_scene.rs",
              '''        #[wasm_bindgen(js_name = liveReplaceContent)]
              pub fn live_replace_content(
          ''',
              '''        #[wasm_bindgen(js_name = liveDashedVMobject)]
              pub fn live_dashed_vmobject(
                  &mut self,
                  source: &crate::WasmAuthoringMobjectHandle,
                  num_dashes: i32,
                  dashed_ratio: f64,
                  dash_offset: f64,
                  equal_lengths: bool,
              ) -> Result<crate::WasmAuthoringMobjectHandle, JsValue> {
                  source.id_in_store(
                      self.inner.scene.integration_store(),
                      "live execution context",
                  )?;
                  self.inner
                      .active_live_player()
                      .map_err(typed_js_error)?
                      .live_dashed_vmobject(
                          source.semantic_mobject(),
                          noon::DashedVMobjectOptions {
                              num_dashes,
                              dashed_ratio,
                              dash_offset,
                              equal_lengths,
                          },
                      )
                      .map(crate::WasmAuthoringMobjectHandle::from_semantic_mobject)
                      .map_err(typed_js_error)
              }

              #[wasm_bindgen(js_name = liveReplaceContent)]
              pub fn live_replace_content(
          ''',
          )

          replace_once(
              "web/python-compat-modules.js",
              '  { sourcePath: "python/_manim_dashed_line.py", runtimePath: "/tmp/_manim_dashed_line.py", label: "Noon shared DashedLine adapter" },\n',
              '  { sourcePath: "python/_manim_dashed_line.py", runtimePath: "/tmp/_manim_dashed_line.py", label: "Noon shared DashedLine adapter" },\n  { sourcePath: "python/_manim_dashed_vmobject.py", runtimePath: "/tmp/_manim_dashed_vmobject.py", label: "Noon shared DashedVMobject adapter" },\n',
          )
          replace_once(
              "web/python/noon.py",
              '    "DashedLine": "_manim_dashed_line",\n',
              '    "DashedLine": "_manim_dashed_line",\n    "DashedVMobject": "_manim_dashed_vmobject",\n',
          )

          replace_once(
              "crates/noon/src/dashed_vmobject_authoring.rs",
              '''        assert_eq!(dashed.path_query().unwrap().curve_count(), 0);
          ''',
              '''        assert!(matches!(
                      dashed.state().unwrap().content,
                      noon_core::SemanticObjectContent::Geometry(StoredGeometry::Resource(_))
                  ));
          ''',
          )
          PY

      - name: Format and focused validation
        shell: bash
        run: |
          cargo fmt --all
          cargo test -p noon-geometry dashing
          cargo test -p noon dashed_vmobject --all-features
          cargo check -p noon-web --all-targets --all-features
          python3 -m py_compile web/python/_manim_dashed_vmobject.py web/python/noon.py
          python3 -m unittest web/python/test_manim_dashed_vmobject.py

      - name: Commit integrated source
        shell: bash
        run: |
          rm .github/workflows/_apply-dashed-vmobject.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add generic retained DashedVMobject"
          git push origin HEAD:codex/b2-dashed-vmobject
