name: Fourier audio task 2358
on:
  push:
    branches: [codex/scratch-fourier-audio-2358]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      BASE: cf0062032a253b24fe511d85b41c2333027e398e
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: /tmp/noon-audio-target
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Apply exact candidate on its pinned base
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yongkyuns/noon
          test "$GITHUB_REF" = refs/heads/codex/scratch-fourier-audio-2358
          mkdir -p /tmp/noon-audio-evidence
          cp .github/task/immutable-root-audio.patch.gz /tmp/noon-audio-evidence/input.patch.gz
          cp .github/task/immutable-root-audio-fix.patch.gz /tmp/noon-audio-evidence/fix.patch.gz
          echo 'ece587b1ce75176c875b49176b9337d17110772ab0fe4b35c06469d230af9438  /tmp/noon-audio-evidence/input.patch.gz' | sha256sum -c -
          echo '0296f994af95326e70a5d212cce861c86b77b1724010cd894733b77ed04a2fc0  /tmp/noon-audio-evidence/fix.patch.gz' | sha256sum -c -
          gzip -dc /tmp/noon-audio-evidence/input.patch.gz > /tmp/noon-audio-evidence/input.patch
          gzip -dc /tmp/noon-audio-evidence/fix.patch.gz > /tmp/noon-audio-evidence/fix.patch
          echo 'b94f313381353b81df30156af61911096ab983b3625249a123575a679f54a0b5  /tmp/noon-audio-evidence/input.patch' | sha256sum -c -
          echo '5ff3d5346c67752cd0908adfdce5282c08a301bae4d0c370393af67b83ccf736  /tmp/noon-audio-evidence/fix.patch' | sha256sum -c -
          git fetch --no-tags --depth=1 origin "$BASE"
          git checkout --detach "$BASE"
          git apply --check /tmp/noon-audio-evidence/input.patch
          git apply /tmp/noon-audio-evidence/input.patch
          git apply --check /tmp/noon-audio-evidence/fix.patch
          git apply /tmp/noon-audio-evidence/fix.patch
          git add -N crates/noon/tests/immutable_root_audio_history.rs
          git diff --check
          git diff --name-only > /tmp/noon-audio-evidence/changed-paths.txt
          test "$(wc -l < /tmp/noon-audio-evidence/changed-paths.txt)" = 15
          ! grep -vE '^(crates/noon-native/src/(audio_output.rs|audio_output/tests.rs)|crates/noon-runtime/src/(audio.rs|audio/tests.rs|replay.rs|replay/prefix.rs)|crates/noon-web/src/(execution_canvas.rs|semantic_execution_player.rs|semantic_execution_player/tests.rs)|crates/noon/src/(execution_session.rs|execution_session/(publication.rs|publication/audio_tests.rs|replay.rs))|crates/noon/tests/immutable_root_audio_history.rs|docs/architecture.md)$' /tmp/noon-audio-evidence/changed-paths.txt
      - name: Install repository-pinned toolchain and native headers
        run: |
          rustup install
          rustup target add wasm32-unknown-unknown
          rustc --version --verbose | tee /tmp/noon-audio-evidence/rustc.txt
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev
      - name: Format and architecture gate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          bash scripts/check.sh architecture "$BASE" 2>&1 | tee /tmp/noon-audio-evidence/architecture.log
          while IFS= read -r file; do sha256sum "$file"; done < /tmp/noon-audio-evidence/changed-paths.txt > /tmp/noon-audio-evidence/tested-source-sha256.txt
      - name: Require a behavioral failure on the unchanged base
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/noon-audio-negative "$BASE"
          cp crates/noon/tests/immutable_root_audio_history.rs /tmp/noon-audio-negative/crates/noon/tests/
          set +e
          (cd /tmp/noon-audio-negative && CARGO_TARGET_DIR=/tmp/noon-audio-negative-target cargo test -p noon --no-default-features --features prepared-prefix --test immutable_root_audio_history) > /tmp/noon-audio-evidence/negative-control.log 2>&1
          result=$?
          set -e
          cat /tmp/noon-audio-evidence/negative-control.log
          test "$result" -ne 0
          grep -F 'test result: FAILED' /tmp/noon-audio-evidence/negative-control.log
          grep -F 'UnsupportedDomain' /tmp/noon-audio-evidence/negative-control.log
          printf '%s\n' "$result" > /tmp/noon-audio-evidence/negative-control-exit.txt
      - name: Qualify shared runtime and native history
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p noon-runtime --features prepared-prefix --lib audio::tests 2>&1 | tee /tmp/noon-audio-evidence/runtime-audio.log
          cargo test -p noon --no-default-features --features prepared-prefix --lib execution_session::publication::audio_tests 2>&1 | tee /tmp/noon-audio-evidence/session-audio.log
          cargo test -p noon --no-default-features --features prepared-prefix --test immutable_root_audio_history --test finite_replay_history --test scalar_timeline_replay 2>&1 | tee /tmp/noon-audio-evidence/history.log
          cargo test -p noon-runtime --features prepared-prefix --test finite_replay_locality 2>&1 | tee /tmp/noon-audio-evidence/locality.log
      - name: Qualify explicit host admission without device playback
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p noon-native --features audio --lib audio_output::tests 2>&1 | tee /tmp/noon-audio-evidence/native-admission.log
          cargo test -p noon-web --no-default-features --features prepared-prefix --lib semantic_execution_player::tests 2>&1 | tee /tmp/noon-audio-evidence/worker-admission.log
      - name: Check worker and direct-renderer WASM
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p noon-web --no-default-features --features prepared-prefix --target wasm32-unknown-unknown 2>&1 | tee /tmp/noon-audio-evidence/wasm-check.log
          cargo check -p noon-web --features prepared-prefix --target wasm32-unknown-unknown 2>&1 | tee /tmp/noon-audio-evidence/wasm-renderer-check.log
      - name: Publish only the tested code to a new task branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          sha256sum -c /tmp/noon-audio-evidence/tested-source-sha256.txt
          git diff --name-only > /tmp/noon-audio-evidence/final-paths.txt
          cmp /tmp/noon-audio-evidence/changed-paths.txt /tmp/noon-audio-evidence/final-paths.txt
          git diff --binary > /tmp/noon-audio-evidence/tested.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS= read -r file; do git add -- "$file"; done < /tmp/noon-audio-evidence/final-paths.txt
          git commit -m 'feat: retain immutable root soundtracks with visual history (#2358)'
          git show -s --format='%H %T %P' HEAD > /tmp/noon-audio-evidence/commit.txt
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/codex/immutable-root-audio-history-2358
      - name: Retain all candidate evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: immutable-root-audio-2358-${{ github.run_number }}
          path: /tmp/noon-audio-evidence/
          if-no-files-found: error
          retention-days: 7
