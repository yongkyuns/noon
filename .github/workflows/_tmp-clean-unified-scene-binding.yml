name: Temporary unified binding cleanup

on:
  push:
    branches:
      - tmp/367-unified-scene-binding

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/367-unified-scene-binding
      - name: Apply cleanup
        run: python scripts/_tmp_clean_unified_scene_binding.py
      - name: Validate Python suite
        run: |
          python -m pip install -q pytest
          python -m compileall -q web/python
          python -m pytest -q web/python
      - name: Regenerate Python worker artifacts
        run: node scripts/build-python-worker.mjs
      - name: Check generated bundle
        run: git diff --check
      - name: Remove temporary cleanup machinery
        run: rm scripts/_tmp_clean_unified_scene_binding.py .github/workflows/_tmp-clean-unified-scene-binding.yml
      - name: Commit cleaned tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Clean unified scene binding architecture"
          git push origin HEAD:tmp/367-unified-scene-binding
