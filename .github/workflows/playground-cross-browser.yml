name: TEMP macOS trigonometry WebKit diagnostic

on:
  push:
    branches:
      - codex/2421-trigonometry-webkit-diagnostic

permissions:
  actions: read
  contents: read

jobs:
  trigonometry:
    name: WebKit mobile-DPR2 trigonometry diagnostic
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the exact tested source
        uses: actions/checkout@v7
        with:
          ref: ffb8e9a6ab87c8f8ae6206f05344501d53e2608c
          fetch-depth: 0
      - name: Record the temporary event overlay without applying it
        shell: bash
        run: |
          set -euo pipefail
          overlay_branch=codex/2421-trigonometry-webkit-diagnostic
          git fetch --no-tags origin "refs/heads/$overlay_branch:refs/remotes/origin/$overlay_branch"
          test "$(git rev-parse "refs/remotes/origin/$overlay_branch")" = "$GITHUB_SHA"
          git merge-base --is-ancestor ffb8e9a6ab87c8f8ae6206f05344501d53e2608c "$GITHUB_SHA"
          actual="$(git diff --name-only ffb8e9a6ab87c8f8ae6206f05344501d53e2608c "$GITHUB_SHA" | sort)"
          expected="$(printf '%s\n' .github/workflows/playground-cross-browser.yml scripts/playground-gallery-runtime-smoke.mjs | sort)"
          test "$actual" = "$expected"
          mkdir -p /tmp/noon-trigonometry-webkit-diagnostic
          git diff --binary ffb8e9a6ab87c8f8ae6206f05344501d53e2608c "$GITHUB_SHA" > /tmp/noon-trigonometry-webkit-diagnostic/event-overlay.patch
          git show "${GITHUB_SHA}:scripts/playground-gallery-runtime-smoke.mjs" > /tmp/noon-trigonometry-webkit-diagnostic/gallery-runtime-smoke.overlay.mjs
          git show "${GITHUB_SHA}:.github/workflows/playground-cross-browser.yml" > /tmp/noon-trigonometry-webkit-diagnostic/temporary-workflow.yml
          shasum -a 256 /tmp/noon-trigonometry-webkit-diagnostic/event-overlay.patch /tmp/noon-trigonometry-webkit-diagnostic/gallery-runtime-smoke.overlay.mjs > /tmp/noon-trigonometry-webkit-diagnostic/source-hashes.txt
          git status --short > /tmp/noon-trigonometry-webkit-diagnostic/pinned-checkout-status-before.txt
      - name: Download and verify the exact published browser runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/noon-runtime-13379760636.zip
          gh api repos/yongkyuns/noon/actions/artifacts/13379760636/zip > "$archive"
          echo "0844458280e2305f829ccc42b1c912b836d5561877faaab6595736940feb1842  $archive" | shasum -a 256 -c -
          python3 - "$archive" <<'PY'
          import hashlib, json, pathlib, sys, zipfile
          archive = pathlib.Path(sys.argv[1])
          root = pathlib.Path("web")
          with zipfile.ZipFile(archive) as source:
              names = [name for name in source.namelist() if not name.endswith("/")]
              assert names and all(not pathlib.PurePosixPath(name).is_absolute() and
                                   ".." not in pathlib.PurePosixPath(name).parts for name in names)
              identities = [name for name in names if name.endswith("runtime-build-identity.json")]
              assert len(identities) == 1, identities
              prefix = identities[0][:-len("runtime-build-identity.json")]
              inventory = {}
              for name in names:
                  assert name.startswith(prefix), name
                  relative = name[len(prefix):]
                  target = root / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  data = source.read(name)
                  target.write_bytes(data)
                  inventory[relative] = hashlib.sha256(data).hexdigest()
              identity = json.loads((root / "runtime-build-identity.json").read_text())
              assert identity.get("sourceRevision") == "ffb8e9a6ab87c8f8ae6206f05344501d53e2608c", identity
              assert identity.get("buildId") == "28f03b378f7bca186cf7483909d42b63045c1c945cd30723a438c2a2d829288e", identity
              pathlib.Path("/tmp/noon-trigonometry-webkit-diagnostic/runtime-inventory.json").write_text(
                  json.dumps({"archiveSha256": "0844458280e2305f829ccc42b1c912b836d5561877faaab6595736940feb1842",
                              "identity": identity, "files": inventory}, sort_keys=True, indent=2) + "\n")
          PY
          GITHUB_SHA=ffb8e9a6ab87c8f8ae6206f05344501d53e2608c node .github/ci/wasm-build.mjs verify
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFile } from "node:fs/promises";
            import { createRuntimeBuildIdentity } from "./scripts/build-runtime-identity.mjs";
            const expected = JSON.parse(await readFile("web/runtime-build-identity.json", "utf8"));
            assert.deepEqual(await createRuntimeBuildIdentity(process.cwd()), expected);
          '
      - name: Install pinned browser dependencies
        timeout-minutes: 10
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1 pngjs@7.0.0
      - name: Install pinned Playwright WebKit
        timeout-minutes: 15
        run: bash scripts/ci-install-playwright-browser.sh webkit
      - name: Apply only the reviewed diagnostic script
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/playground-gallery-runtime-smoke.mjs /tmp/noon-trigonometry-webkit-diagnostic/gallery-runtime-smoke.source.mjs
          cp /tmp/noon-trigonometry-webkit-diagnostic/gallery-runtime-smoke.overlay.mjs scripts/playground-gallery-runtime-smoke.mjs
          node --check scripts/playground-gallery-runtime-smoke.mjs
          git diff --binary HEAD -- scripts/playground-gallery-runtime-smoke.mjs > /tmp/noon-trigonometry-webkit-diagnostic/applied-script.patch
          shasum -a 256 scripts/playground-gallery-runtime-smoke.mjs /tmp/noon-trigonometry-webkit-diagnostic/applied-script.patch > /tmp/noon-trigonometry-webkit-diagnostic/applied-hashes.txt
          changed="$(git diff --name-only HEAD | sort)"
          test "$changed" = "scripts/playground-gallery-runtime-smoke.mjs"
      - name: Run one unchanged trigonometry gallery case
        id: gallery
        continue-on-error: true
        timeout-minutes: 20
        env:
          NOON_PLAYGROUND_BROWSER: webkit
          NOON_PLAYGROUND_PROFILE: mobile-dpr2
          NOON_GALLERY_CASES: noon-trigonometry-tutorial
          NOON_SHOWCASE_PROFILE_GATE: strict
          NOON_PLAYGROUND_MATRIX_ARTIFACTS: /tmp/noon-trigonometry-webkit-diagnostic/browser
        run: node scripts/playground-gallery-runtime-smoke.mjs
      - name: Restore only the diagnostic script and verify the pinned source again
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- scripts/playground-gallery-runtime-smoke.mjs
          GITHUB_SHA=ffb8e9a6ab87c8f8ae6206f05344501d53e2608c node .github/ci/wasm-build.mjs verify
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFile } from "node:fs/promises";
            import { createRuntimeBuildIdentity } from "./scripts/build-runtime-identity.mjs";
            const expected = JSON.parse(await readFile("web/runtime-build-identity.json", "utf8"));
            assert.deepEqual(await createRuntimeBuildIdentity(process.cwd()), expected);
          '
          test -z "$(git status --porcelain --untracked-files=all)"
          git status --short > /tmp/noon-trigonometry-webkit-diagnostic/pinned-checkout-status-after.txt
      - name: Preserve failure status
        if: always()
        shell: bash
        env:
          GALLERY_OUTCOME: ${{ steps.gallery.outcome }}
        run: test "$GALLERY_OUTCOME" = success
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trigonometry-webkit-passive-diagnostic
          path: /tmp/noon-trigonometry-webkit-diagnostic
          if-no-files-found: warn
          retention-days: 3
