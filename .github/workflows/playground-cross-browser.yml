name: Playground cross-browser matrix

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/playground-cross-browser.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "!crates/**/tests/**"
      - "scripts/build-web-demo.sh"
      - "scripts/build-python-worker.mjs"
      - "scripts/build-runtime-identity.mjs"
      - "scripts/playground-browser-matrix-smoke.mjs"
      - "scripts/playground-example-browser-smoke.mjs"
      - "scripts/playground-main-thread-mobile-smoke.mjs"
      - "scripts/playground-gallery-runtime-smoke.mjs"
      - "scripts/gallery-shards.mjs"
      - "scripts/gallery-shards.test.mjs"
      - "scripts/playground-gallery-selection-smoke.mjs"
      - "scripts/showcase-viewport.mjs"
      - "scripts/playground-python-family-transform-smoke.mjs"
      - "scripts/playground-browser-support.mjs"
      - "scripts/paired-authoring-qualification.mjs"
      - "scripts/special-camera-qualification.mjs"
      - "web/**"
      - "!web/**/*.test.mjs"
  pull_request:
    paths:
      - ".github/workflows/playground-cross-browser.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "!crates/**/tests/**"
      - "scripts/build-web-demo.sh"
      - "scripts/build-python-worker.mjs"
      - "scripts/build-runtime-identity.mjs"
      - "scripts/playground-browser-matrix-smoke.mjs"
      - "scripts/playground-example-browser-smoke.mjs"
      - "scripts/playground-main-thread-mobile-smoke.mjs"
      - "scripts/playground-gallery-runtime-smoke.mjs"
      - "scripts/gallery-shards.mjs"
      - "scripts/gallery-shards.test.mjs"
      - "scripts/playground-gallery-selection-smoke.mjs"
      - "scripts/showcase-viewport.mjs"
      - "scripts/playground-python-family-transform-smoke.mjs"
      - "scripts/playground-browser-support.mjs"
      - "scripts/paired-authoring-qualification.mjs"
      - "scripts/special-camera-qualification.mjs"
      - "web/**"
      - "!web/**/*.test.mjs"
  workflow_dispatch:
    inputs:
      webkit_crash_diagnostic:
        description: 'Diagnose the retained #2038 WebKit failure with its exact CI package; does not qualify the PR'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: playground-cross-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !inputs.webkit_crash_diagnostic }}
    name: Build browser package
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: "READ_ONLY"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use repository-pinned Rust and WASM target
        run: |
          rustup install
          rustup show active-toolchain
          rustc --version --verbose
          rustup target add wasm32-unknown-unknown
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - name: Use sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Verify the complete gallery sharding inventory
        run: node --test scripts/gallery-shards.test.mjs
      - name: Build browser package
        env:
          NOON_WASM_SKIP_OPT: "1"
          NOON_RENDERER_SMOKE: "1"
        run: bash scripts/build-web-demo.sh
      - name: Upload browser runtime assets
        uses: actions/upload-artifact@v7
        with:
          name: playground-cross-browser-web-runtime
          path: |
            web/pkg
            web/python-worker.js
            web/runtime-build-identity.json
            web/python/compat-bundle.*.json
          if-no-files-found: error
          retention-days: 1

  browser:
    if: ${{ !inputs.webkit_crash_diagnostic }}
    name: ${{ matrix.browser }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            profile: desktop-dpr1
            os: ubuntu-latest
            display: "xvfb-run -a"
          - browser: firefox
            profile: desktop-dpr2
            os: ubuntu-latest
            display: "xvfb-run -a"
          - browser: webkit
            profile: mobile-dpr2
            os: macos-latest
            display: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download browser runtime assets
        uses: actions/download-artifact@v8
        with:
          name: playground-cross-browser-web-runtime
          path: web
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-1.62.1
      - name: Install pinned browser npm dependencies
        timeout-minutes: 10
        run: npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
      - name: Install Playwright browser and system dependencies
        timeout-minutes: 15
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test examples browser presentation
        env:
          NOON_PLAYGROUND_BROWSER: ${{ matrix.browser }}
          NOON_PLAYGROUND_PROFILE: ${{ matrix.profile }}
          NOON_PLAYGROUND_MATRIX_ARTIFACTS: browser-smoke-artifacts/playground-matrix/${{ matrix.browser }}-${{ matrix.profile }}
        run: node scripts/playground-example-browser-smoke.mjs
      - name: Test public playground workflow
        env:
          NOON_PLAYGROUND_REQUIRE_RUNTIME: ${{ matrix.browser == 'webkit' && '1' || '0' }}
          NOON_PLAYGROUND_BROWSER: ${{ matrix.browser }}
          NOON_PLAYGROUND_PROFILE: ${{ matrix.profile }}
          NOON_PLAYGROUND_MATRIX_ARTIFACTS: browser-smoke-artifacts/playground-matrix/${{ matrix.browser }}-${{ matrix.profile }}
        run: ${{ matrix.display }} node scripts/playground-browser-matrix-smoke.mjs
      - name: Test Python unequal-family return capture
        env:
          NOON_PLAYGROUND_BROWSER: ${{ matrix.browser }}
          NOON_PLAYGROUND_PROFILE: ${{ matrix.profile }}
          NOON_PLAYGROUND_MATRIX_ARTIFACTS: browser-smoke-artifacts/playground-matrix/${{ matrix.browser }}-${{ matrix.profile }}/python-family-transform
        run: ${{ matrix.display }} node scripts/playground-python-family-transform-smoke.mjs
      - name: Test gallery click animation and idle restoration
        timeout-minutes: 5
        env:
          NOON_PLAYGROUND_BROWSER: ${{ matrix.browser }}
          NOON_PLAYGROUND_PROFILE: ${{ matrix.profile }}
          NOON_GALLERY_SELECTION_ARTIFACTS: browser-smoke-artifacts/playground-matrix/${{ matrix.browser }}-${{ matrix.profile }}/selection
        run: ${{ matrix.display }} node scripts/playground-gallery-selection-smoke.mjs
      - name: Test dense gallery scene with the default shared mailbox
        if: matrix.browser == 'chromium'
        timeout-minutes: 5
        env:
          NOON_PLAYGROUND_BROWSER: chromium
          NOON_PLAYGROUND_PROFILE: desktop-dpr1
          NOON_GALLERY_COI: "1"
          NOON_GALLERY_CASES: showcase-dynamic-scene
          NOON_PLAYGROUND_MATRIX_ARTIFACTS: browser-smoke-artifacts/playground-matrix/chromium-desktop-dpr1/shared-dense-gallery
        run: ${{ matrix.display }} node scripts/playground-gallery-runtime-smoke.mjs
      - name: Repeat WebKit optional-compiler cold starts
        if: matrix.browser == 'webkit'
        timeout-minutes: 10
        env:
          NOON_PLAYGROUND_BROWSER: webkit
          NOON_PLAYGROUND_PROFILE: ${{ matrix.profile }}
          NOON_GALLERY_CASES: noon-ordinary-matrix,noon-ordinary-table,noon-ordinary-variable
        # Every cold start must pass. This is repeated admission, not a retry of
        # failures; each invocation retains its own diagnostics and native stacks.
        run: |
          for iteration in 1 2 3; do
            NOON_PLAYGROUND_MATRIX_ARTIFACTS="browser-smoke-artifacts/playground-matrix/webkit-${{ matrix.profile }}/cold-start-${iteration}" \
              node scripts/playground-gallery-runtime-smoke.mjs
          done
      - name: Test main-thread mobile render fallback
        if: matrix.browser == 'webkit' && matrix.profile == 'mobile-dpr2'
        env:
          NOON_PLAYGROUND_MATRIX_ARTIFACTS: browser-smoke-artifacts/playground-matrix/${{ matrix.browser }}-${{ matrix.profile }}
        run: node scripts/playground-main-thread-mobile-smoke.mjs
      - name: Qualify mobile camera callbacks without JSPI
        if: matrix.browser == 'webkit'
        timeout-minutes: 5
        env:
          NOON_CAMERA_BROWSER: webkit
          NOON_CAMERA_NO_JSPI: "1"
          NOON_PAIRED_CASES: following_graph_camera-1.5,moving_zoomed_scene_around-9.5
          NOON_CAMERA_ARTIFACTS: browser-smoke-artifacts/playground-matrix/webkit-mobile-dpr2/special-camera
        run: node scripts/special-camera-qualification.mjs
      - name: Upload playground diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playground-matrix-${{ matrix.browser }}-${{ matrix.profile }}
          path: browser-smoke-artifacts/playground-matrix/${{ matrix.browser }}-${{ matrix.profile }}
          if-no-files-found: error
          retention-days: 7

  # Run every gallery case on every browser. Within each WebKit shard the
  # harness still launches fresh browser processes and executes cases
  # sequentially; independent shards run on separate hosted macOS runners.
  gallery:
    if: ${{ !inputs.webkit_crash_diagnostic }}
    name: Gallery ${{ matrix.browser }} / shard ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [0, 1, 2]
        include:
          - browser: chromium
            profile: desktop-dpr1
            os: ubuntu-latest
            display: "xvfb-run -a"
          - browser: firefox
            profile: desktop-dpr2
            os: ubuntu-latest
            display: "xvfb-run -a"
          - browser: webkit
            profile: mobile-dpr2
            os: macos-latest
            display: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download the exact browser runtime
        uses: actions/download-artifact@v8
        with:
          name: playground-cross-browser-web-runtime
          path: web
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-1.62.1
      - name: Install pinned browser npm dependencies
        timeout-minutes: 10
        run: npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
      - name: Install Playwright browser and system dependencies
        timeout-minutes: 15
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Qualify the full gallery shard, including portable no-JSPI controls
        timeout-minutes: 20
        env:
          NOON_PLAYGROUND_BROWSER: ${{ matrix.browser }}
          NOON_PLAYGROUND_PROFILE: ${{ matrix.profile }}
          NOON_GALLERY_SHARD_INDEX: "${{ matrix.shard }}"
          NOON_GALLERY_SHARD_COUNT: "3"
          NOON_PLAYGROUND_MATRIX_ARTIFACTS: browser-smoke-artifacts/playground-gallery/${{ matrix.browser }}/shard-${{ matrix.shard }}
        run: ${{ matrix.display }} node scripts/playground-gallery-runtime-smoke.mjs
      - name: Upload exact shard inventory and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playground-gallery-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: browser-smoke-artifacts/playground-gallery/${{ matrix.browser }}/shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 7

  webkit-crash-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.webkit_crash_diagnostic }}
    name: Diagnose retained WebKit showcase crash
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout the exact retained source
        uses: actions/checkout@v7
        with:
          ref: 87e2717218752bf314f31f6b47b67663e2a84053
          persist-credentials: false
      - name: Download the original immutable runtime
        uses: actions/download-artifact@v8
        with:
          name: playground-cross-browser-web-runtime
          repository: ${{ github.repository }}
          run-id: 38341803115
          github-token: ${{ github.token }}
          path: web
      - name: Verify all runtime bytes and retained identity
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const identity = JSON.parse(await readFile('web/runtime-build-identity.json', 'utf8'));
          if (identity.sourceRevision !== '87e2717218752bf314f31f6b47b67663e2a84053' ||
              identity.buildId !== '450435da9b427949658f76d13de332f9c674aaa411203f1964c399855ab2f7ac') {
            throw new Error('original runtime identity changed');
          }
          for (const file of Object.values(identity.files)) {
            const bytes = await readFile('web/' + file.path);
            if (createHash('sha256').update(bytes).digest('hex') !== file.sha256) {
              throw new Error('original runtime bytes changed: ' + file.path);
            }
          }
          console.log(identity.sourceRevision, identity.buildId);
          NODE
      - name: Install the original browser dependencies
        run: npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
      - name: Install WebKit and system dependencies
        run: npx playwright install --with-deps webkit
      - name: Execute the original assertions with browser process diagnostics
        env:
          DEBUG: pw:browser
          NOON_PLAYGROUND_REQUIRE_RUNTIME: '1'
          NOON_PLAYGROUND_BROWSER: webkit
          NOON_PLAYGROUND_PROFILE: mobile-dpr2
          NOON_PLAYGROUND_MATRIX_ARTIFACTS: output/playwright/retained-webkit-crash
        run: |
          set -euo pipefail
          mkdir -p output/playwright/retained-webkit-crash
          python3 -c 'import time; from pathlib import Path; Path("output/playwright/retained-webkit-crash/started.txt").write_text(str(time.time()))'
          node scripts/playground-example-browser-smoke.mjs 2>&1 | tee output/playwright/retained-webkit-crash/examples-process.log
          node scripts/playground-browser-matrix-smoke.mjs 2>&1 | tee output/playwright/retained-webkit-crash/matrix-process.log
      - name: Retain native crash reports from this execution
        if: always()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import shutil
          root = Path('output/playwright/retained-webkit-crash')
          marker = root / 'started.txt'
          if marker.exists():
              started = float(marker.read_text())
              reports = Path.home() / 'Library/Logs/DiagnosticReports'
              for source in reports.glob('*'):
                  if source.is_file() and source.suffix in {'.ips', '.crash'} and source.stat().st_mtime >= started:
                      if any(name in source.name for name in ('WebKit', 'MiniBrowser')):
                          shutil.copy2(source, root / source.name)
          PYTHON
      - name: Upload retained diagnostics without replacing the failed verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retained-webkit-showcase-crash-diagnostic
          path: output/playwright/retained-webkit-crash
          if-no-files-found: warn
          retention-days: 7
