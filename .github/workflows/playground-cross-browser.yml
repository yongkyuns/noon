name: Playground cross-browser matrix

on:
  push:
    branches: [codex/2421-firefox-diagnostic]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  firefox-diagnostic:
    name: Firefox audio and worker retirement diagnosis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Apply only diagnostic harness changes to the tested source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 50d0dbe79306764da6cdbc6ab173756bf7bea8a3
          git diff --binary 50d0dbe79306764da6cdbc6ab173756bf7bea8a3 -- scripts > "$RUNNER_TEMP/noon-2421-firefox.patch"
          git checkout --detach 50d0dbe79306764da6cdbc6ab173756bf7bea8a3
          git apply "$RUNNER_TEMP/noon-2421-firefox.patch"
          mkdir -p browser-smoke-artifacts/firefox-diagnostic
          cp "$RUNNER_TEMP/noon-2421-firefox.patch" browser-smoke-artifacts/firefox-diagnostic/harness.patch
          sha256sum "$RUNNER_TEMP/noon-2421-firefox.patch" > browser-smoke-artifacts/firefox-diagnostic/harness.sha256
          git rev-parse HEAD > browser-smoke-artifacts/firefox-diagnostic/source.txt
          node --version > browser-smoke-artifacts/firefox-diagnostic/node-version.txt
      - name: Reuse the exact hosted browser package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: 13301655134
          run-id: 41784702322
          github-token: ${{ github.token }}
          path: web
      - name: Install existing pinned browser tools
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install --with-deps firefox
          node scripts/check-web-package.mjs
          git diff --exit-code -- web
      - name: Diagnose immutable audio through the unchanged gallery gate
        id: gallery
        env:
          NOON_PLAYGROUND_BROWSER: firefox
          NOON_PLAYGROUND_PROFILE: desktop-dpr2
          NOON_SHOWCASE_PROFILE_GATE: baseline
          NOON_GALLERY_CASES: showcase-background-music
          NOON_PLAYGROUND_MATRIX_ARTIFACTS: browser-smoke-artifacts/firefox-diagnostic/gallery
        run: xvfb-run -a node scripts/playground-gallery-runtime-smoke.mjs
      - name: Diagnose public edit and replacement through the unchanged workflow
        if: ${{ !cancelled() }}
        id: matrix
        env:
          NOON_PLAYGROUND_BROWSER: firefox
          NOON_PLAYGROUND_PROFILE: desktop-dpr2
          NOON_PLAYGROUND_REQUIRE_RUNTIME: '0'
          NOON_PLAYGROUND_MATRIX_ARTIFACTS: browser-smoke-artifacts/firefox-diagnostic/matrix
        run: xvfb-run -a node scripts/playground-browser-matrix-smoke.mjs
      - name: Preserve complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: noon-2421-firefox-diagnostic
          path: browser-smoke-artifacts/firefox-diagnostic
          if-no-files-found: error
          retention-days: 3
