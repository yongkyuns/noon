name: Playground cross-browser matrix

on:
  push:
    branches:
      - codex/2421-pause-diagnostic

permissions:
  contents: read
  actions: read

concurrency:
  group: pause-diagnostic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pause-diagnostic:
    name: WebKit pause command diagnostic
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify diagnostic is based on the failed 411a source
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 411a984f54fd9cfff17e4794c1c52382e8dbd19d)" = "411a984f54fd9cfff17e4794c1c52382e8dbd19d"
          test "$(git rev-parse 411a984f54fd9cfff17e4794c1c52382e8dbd19d^{tree})" = "d482ace94931c24795195a3bad26bdce5310cd3f"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Download and verify the exact failed-run runtime artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/noon-411a-web-runtime.zip"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            https://api.github.com/repos/yongkyuns/noon/actions/artifacts/13364176044/zip \
            --output "$archive"
          printf '%s  %s\n' 'ca79115eba18a58cf5d9106f7e6f8951437213ae70bc548189979fc5098c0254' "$archive" | shasum -a 256 -c
          mkdir -p web
          unzip -q "$archive" -d web
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          import path from "node:path";
          const identity = JSON.parse(readFileSync("web/runtime-build-identity.json", "utf8"));
          assert.equal(identity.sourceRevision, "becce6a1b03e2b60e79f0bc17ac8e9c391c7a3f7");
          assert.equal(identity.buildId, "1c9148aaad13f08576c983b84f039ac82b4ba320c826962cf42dce518e6ab8ef");
          const expected = {
            worker: "6a9fcde391a56b62ee78ee9cd68504cb3b063707bad4bc8d9c5179781df2d8f6",
            wasm: "f35f8f05304803d52d93c3a1101199ff100f383251737b0d873ebd76362a9ffb",
            glue: "37ded3a32b4d1f6847203a271e9fa979dca90e20ee64803509e395837a5b51fe",
            verifier: "62efb51bf977fb02f019851429c271f161400ffdb5f19064183847419f146869",
          };
          for (const [name, sha256] of Object.entries(expected)) {
            assert.equal(identity.files[name].sha256, sha256, name + " manifest digest");
            const file = path.join("web", identity.files[name].path.slice(2));
            assert.equal(createHash("sha256").update(readFileSync(file)).digest("hex"), sha256, name + " bytes");
          }
          console.log("Verified exact 411a runtime artifact, including its full ZIP digest and four identity files.");
          NODE

      - name: Install pinned browser npm dependencies
        timeout-minutes: 10
        run: npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0

      - name: Install Playwright WebKit and system dependencies
        timeout-minutes: 15
        run: bash scripts/ci-install-playwright-browser.sh webkit

      - name: Run the unchanged one-case WebKit gallery check
        timeout-minutes: 5
        env:
          NOON_PLAYGROUND_BROWSER: webkit
          NOON_PLAYGROUND_PROFILE: mobile-dpr2
          NOON_GALLERY_CASES: parity-square-to-circle
          NOON_SHOWCASE_PROFILE_GATE: disabled
          NOON_GALLERY_PORT: "4197"
          NOON_PLAYGROUND_MATRIX_ARTIFACTS: browser-smoke-artifacts/pause-diagnostic/webkit-mobile-dpr2
        run: node scripts/playground-gallery-runtime-smoke.mjs

      - name: Upload pause diagnostics and case report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pause-diagnostic-webkit-parity-square-to-circle
          path: browser-smoke-artifacts/pause-diagnostic/webkit-mobile-dpr2
          if-no-files-found: warn
          retention-days: 3
