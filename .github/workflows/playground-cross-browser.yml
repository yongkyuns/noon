name: Playground cross-browser matrix

on:
  push:
    branches: [codex/2421-firefox-diagnostic]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  webkit-gallery-diagnostic:
    name: WebKit gallery shard 1 phase diagnosis
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      DEBUG: pw:browser
    steps:
      - uses: actions/checkout@v7
      - name: Apply only the diagnostic helper change to the tested source
        shell: bash
        env:
          SOURCE_REV: 32a7d3d19b97e5ca4e885920886e55680fe170d8
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SOURCE_REV"
          git diff --binary "$SOURCE_REV" -- scripts/showcase-playback.mjs > "$RUNNER_TEMP/noon-2421-webkit.patch"
          git checkout --detach "$SOURCE_REV"
          git apply "$RUNNER_TEMP/noon-2421-webkit.patch"
          mkdir -p browser-smoke-artifacts/playground-gallery-webkit-diagnostic
          cp "$RUNNER_TEMP/noon-2421-webkit.patch" browser-smoke-artifacts/playground-gallery-webkit-diagnostic/harness.patch
          shasum -a 256 "$RUNNER_TEMP/noon-2421-webkit.patch" > browser-smoke-artifacts/playground-gallery-webkit-diagnostic/harness.sha256
          git rev-parse HEAD > browser-smoke-artifacts/playground-gallery-webkit-diagnostic/source.txt
          node --version > browser-smoke-artifacts/playground-gallery-webkit-diagnostic/node-version.txt
      - name: Download the exact tested browser runtime
        uses: actions/download-artifact@v8
        with:
          artifact-ids: 13318854607
          run-id: 41825281588
          github-token: ${{ github.token }}
          path: web
      - name: Install pinned WebKit browser tools
        timeout-minutes: 15
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          bash scripts/ci-install-playwright-browser.sh webkit
          node scripts/check-web-package.mjs
          git diff --exit-code -- web
      - name: Rerun the full strict WebKit gallery shard with phase diagnostics
        timeout-minutes: 20
        env:
          NOON_PLAYGROUND_BROWSER: webkit
          NOON_PLAYGROUND_PROFILE: mobile-dpr2
          NOON_SHOWCASE_PROFILE_GATE: strict
          NOON_GALLERY_SHARD_INDEX: "1"
          NOON_GALLERY_SHARD_COUNT: "3"
          NOON_PLAYGROUND_MATRIX_ARTIFACTS: browser-smoke-artifacts/playground-gallery-webkit-diagnostic
        run: node scripts/playground-gallery-runtime-smoke.mjs
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: noon-2421-webkit-gallery-phase-diagnostic
          path: browser-smoke-artifacts/playground-gallery-webkit-diagnostic
          if-no-files-found: error
          retention-days: 3
