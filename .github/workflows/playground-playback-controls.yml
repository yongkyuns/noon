name: Playground playback controls

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/playground-playback-controls.yml"
      - "crates/noon/**"
      - "crates/noon-compile/**"
      - "crates/noon-runtime/**"
      - "crates/noon-render-wgpu/**"
      - "crates/noon-web/**"
      - "scripts/build-web-demo.sh"
      - "scripts/playground-playback-controls-smoke.mjs"
      - "scripts/playground-playback-rerun-stress.mjs"
      - "scripts/playground-playback-morph-regression.mjs"
      - "scripts/playground-wait-clock-regression.mjs"
      - "scripts/manim-raster-support.mjs"
      - "scripts/browser-pointer-input-smoke.mjs"
      - "scripts/pointer-selection-*.mjs"
      - "scripts/direct-pointer-presentation-qualification.mjs"
      - "scripts/check-web-package.mjs"
      - "web/**"
  pull_request:
    paths:
      - "crates/noon/**"
      - "crates/noon-compile/**"
      - "crates/noon-runtime/**"
      - "crates/noon-web/**"
      - "web/playground-playback-controls*"
      - "web/semantic-engine-endpoint*"
      - "web/main.js"
      - "web/browser-pointer-input*"
      - "web/native-inputs*"
      - "web/direct-execution-wake-driver*"
      - "web/authoring-execution-client*"
      - "web/execution-worker-client*"
      - "crates/noon-render-wgpu/**"
      - "scripts/manim-raster-support.mjs"
      - "scripts/browser-pointer-input-smoke.mjs"
      - "scripts/pointer-selection-*.mjs"
      - "scripts/direct-pointer-presentation-qualification.mjs"
      - "scripts/check-web-package.mjs"
      - ".github/workflows/playground-playback-controls.yml"
      - "scripts/playground-playback-*.mjs"
      - "scripts/playground-wait-clock-regression.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground-playback-controls-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playback-controls:
    name: Public transport controls
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: "READ_ONLY"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use repository-pinned Rust and WASM target
        run: |
          rustup install
          rustup show active-toolchain
          rustc --version --verbose
          rustup target add wasm32-unknown-unknown
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - name: Use sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Test native replay history and locality
        run: |
          cargo test -p noon --no-default-features --test finite_replay_history
          cargo test -p noon-runtime --test finite_replay_locality
      - name: Test shared pointer selection and renderer-less WASM build
        run: |
          cargo test -p noon-web --all-features --lib direct_pointer_presentation::tests -- --nocapture
          cargo test -p noon-web --all-features --lib selection_overlay_transport::tests -- --nocapture
          cargo test -p noon-web --all-features --lib semantic_execution_player::pointer_input::selection_tests -- --nocapture
          cargo check -p noon-web --no-default-features --target wasm32-unknown-unknown
      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Build browser package
        env:
          NOON_WASM_SKIP_OPT: "1"
          NOON_RENDERER_SMOKE: "1"
        run: bash scripts/build-web-demo.sh
      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.62.1
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Qualify actual DOM samples and paused click-selection pixels
        run: |
          node --test scripts/pointer-selection-raster-contract.test.mjs
          node scripts/browser-pointer-input-smoke.mjs
          node scripts/pointer-selection-qualification.mjs
          node scripts/pointer-selection-direct-qualification.mjs
          node scripts/direct-pointer-presentation-qualification.mjs
      - name: Test public playback controls
        env:
          NOON_PLAYGROUND_PLAYBACK_ARTIFACTS: browser-smoke-artifacts/playground-playback-controls
        run: node scripts/playground-playback-controls-smoke.mjs
      - name: Stress reruns across playback states
        env:
          NOON_PLAYGROUND_RERUN_STRESS_ARTIFACTS: browser-smoke-artifacts/playground-playback-rerun-stress
        run: node scripts/playground-playback-rerun-stress.mjs
      - name: Verify wait clock against real time
        run: |
          node scripts/playground-wait-clock-regression.mjs
          NOON_WAIT_BACKEND=webgpu NOON_WAIT_ARTIFACTS=browser-smoke-artifacts/playground-wait-clock-webgpu node scripts/playground-wait-clock-regression.mjs
      - name: Verify morph endpoints and holds against source playback
        run: |
          node scripts/playground-playback-morph-regression.mjs
          NOON_MORPH_BACKEND=webgpu NOON_MORPH_REGRESSION_ARTIFACTS=browser-smoke-artifacts/playground-playback-morph-webgpu node scripts/playground-playback-morph-regression.mjs
      - name: Verify dynamic load membership and content history
        run: |
          NOON_REPLAY_CASE=dynamic node scripts/playground-playback-morph-regression.mjs
          NOON_REPLAY_CASE=dynamic NOON_MORPH_BACKEND=webgpu NOON_MORPH_REGRESSION_ARTIFACTS=browser-smoke-artifacts/playground-playback-dynamic-webgpu node scripts/playground-playback-morph-regression.mjs
      - name: Upload playback diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playground-playback-controls
          path: |
            browser-smoke-artifacts/pointer-dom
            browser-smoke-artifacts/pointer-selection
            browser-smoke-artifacts/pointer-selection-direct
            browser-smoke-artifacts/direct-pointer-presentation
            browser-smoke-artifacts/playground-playback-controls
            browser-smoke-artifacts/playground-playback-rerun-stress
            browser-smoke-artifacts/playground-playback-morph
            browser-smoke-artifacts/playground-playback-morph-webgpu
            browser-smoke-artifacts/playground-wait-clock
            browser-smoke-artifacts/playground-wait-clock-webgpu
            browser-smoke-artifacts/playground-playback-dynamic
            browser-smoke-artifacts/playground-playback-dynamic-webgpu
          if-no-files-found: error
          retention-days: 7
