name: Showcase qualification

on:
  push:
    branches: [codex/2421-showcase-diagnostic]

permissions:
  contents: read
  actions: read

jobs:
  capture-diagnostic:
    name: Diagnose first-pass capture on the tested WebGL package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Apply only diagnostic harness changes to the tested source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 50d0dbe79306764da6cdbc6ab173756bf7bea8a3
          git diff --binary 50d0dbe79306764da6cdbc6ab173756bf7bea8a3 -- scripts > "$RUNNER_TEMP/noon-2421-showcase.patch"
          git checkout --detach 50d0dbe79306764da6cdbc6ab173756bf7bea8a3
          git apply "$RUNNER_TEMP/noon-2421-showcase.patch"
          mkdir -p browser-smoke-artifacts/showcase-diagnostic
          cp "$RUNNER_TEMP/noon-2421-showcase.patch" browser-smoke-artifacts/showcase-diagnostic/harness.patch
          sha256sum "$RUNNER_TEMP/noon-2421-showcase.patch" > browser-smoke-artifacts/showcase-diagnostic/harness.sha256
          git rev-parse HEAD > browser-smoke-artifacts/showcase-diagnostic/source.txt
          node --version > browser-smoke-artifacts/showcase-diagnostic/node-version.txt
      - name: Reuse the exact hosted showcase package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: 13300981317
          run-id: 41784702227
          github-token: ${{ github.token }}
          path: web
      - name: Reuse the original independent source captures
        uses: actions/download-artifact@v8
        with:
          artifact-ids: 13302960477
          run-id: 41784702227
          github-token: ${{ github.token }}
          path: browser-smoke-artifacts/showcase/webgl
      - name: Preserve original reports and install existing pinned tools
        run: |
          set -eu
          mv browser-smoke-artifacts/showcase/webgl/live "$RUNNER_TEMP/noon-2421-original-live"
          sha256sum browser-smoke-artifacts/showcase/webgl/report.json > browser-smoke-artifacts/showcase-diagnostic/oracle.sha256
          cp web/runtime-build-identity.json browser-smoke-artifacts/showcase-diagnostic/runtime-build-identity.json
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
          node scripts/check-web-package.mjs
          git diff --exit-code -- web
      - name: Observe unchanged ordinary first-pass and replay checks
        env:
          NOON_SHOWCASE_BACKEND: webgl
          NOON_SHOWCASE_CASES: showcase-gpu-glow,showcase-pointer-selection,showcase-shader-material,showcase-wave-interference
        run: node scripts/showcase-live-review.mjs
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: noon-2421-showcase-diagnostic
          path: |
            browser-smoke-artifacts/showcase-diagnostic
            browser-smoke-artifacts/showcase/webgl/live
          if-no-files-found: error
          retention-days: 3
