name: Showcase capture artifact analysis

on:
  push:
    branches: [codex/2421-showcase-diagnostic]

permissions:
  contents: read
  actions: read

jobs:
  analyze-capture:
    name: Analyze preserved capture (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [webgpu, webgl]
    steps:
      - uses: actions/checkout@v7
      - name: Read the preserved diagnostic artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ matrix.backend == 'webgpu' && '13329899810' || '13330158391' }}
          run-id: 41844658328
          github-token: ${{ github.token }}
          path: evidence/${{ matrix.backend }}
      - name: Summarize identity, proof snapshots, and advisory candidate pixels
        env:
          BACKEND: ${{ matrix.backend }}
          EVIDENCE_ROOT: evidence/${{ matrix.backend }}
          EXPECTED_SOURCE: 32a7d3d19b97e5ca4e885920886e55680fe170d8
          EXPECTED_PATCH_SHA256: e25f6830603cfdaaff4c72916f0f427a88aa4f2ad1c470d56f2d02818b2c9285
        run: node scripts/analyze-showcase-capture-diagnostic.mjs
