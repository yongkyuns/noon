name: Showcase capture timing diagnostic
run-name: Verify bloom endpoint capture fix

on:
  push:
    branches: [codex/2421-showcase-diagnostic]
    paths: [.github/workflows/playground-showcase-qualification.yml]

permissions:
  contents: read
  actions: read

jobs:
  capture-diagnostic:
    name: Diagnose first-pass capture (WebGL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Preserve diagnostic patch and check out exact CI source
        shell: bash
        env:
          SOURCE_REVISION: d28af55345aa07b3cf9ce03bd7ce9a5993f74014
          TEMP_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cp scripts/showcase-live-review-diagnostic.patch "$RUNNER_TEMP/showcase-capture-diagnostic.patch"
          sha256sum "$RUNNER_TEMP/showcase-capture-diagnostic.patch" > "$RUNNER_TEMP/showcase-capture-diagnostic.patch.sha256"
          mkdir -p browser-smoke-artifacts/showcase-diagnostic/webgl
          echo "$TEMP_EVENT_SHA" > browser-smoke-artifacts/showcase-diagnostic/webgl/temp-event-sha.txt
          git fetch --no-tags --depth=1 origin "$SOURCE_REVISION"
          git checkout --detach "$SOURCE_REVISION"
          git rev-parse HEAD > browser-smoke-artifacts/showcase-diagnostic/webgl/source.txt
          cp "$RUNNER_TEMP/showcase-capture-diagnostic.patch.sha256" browser-smoke-artifacts/showcase-diagnostic/webgl/harness.sha256
          node --version > browser-smoke-artifacts/showcase-diagnostic/webgl/node-version.txt
      - name: Download exact CI runtime
        uses: actions/download-artifact@v8
        with:
          artifact-ids: 13353893838
          run-id: 41890852960
          github-token: ${{ github.token }}
          path: web
      - name: Download original capture report and oracle
        uses: actions/download-artifact@v8
        with:
          artifact-ids: 13356829442
          run-id: 41890852960
          github-token: ${{ github.token }}
          path: browser-smoke-artifacts/showcase/webgl
      - name: Verify exact pinned-source runtime and original capture report
        env:
          EXPECTED_SOURCE: d28af55345aa07b3cf9ce03bd7ce9a5993f74014
        run: |
          set -euo pipefail
          test "$(cat browser-smoke-artifacts/showcase-diagnostic/webgl/source.txt)" = "$EXPECTED_SOURCE"
          node --input-type=module -e '
            import fs from "node:fs";
            import { execFileSync } from "node:child_process";
            import { verify } from "./.github/ci/wasm-build.mjs";
            const source = process.env.EXPECTED_SOURCE;
            if (execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim() !== source)
              throw new Error("detached source revision mismatch");
            const manifest = JSON.parse(fs.readFileSync("web/ci-artifact.json", "utf8"));
            await verify(process.cwd(), { ...process.env, GITHUB_SHA: source }, manifest.build);
            const identity = JSON.parse(fs.readFileSync("web/runtime-build-identity.json", "utf8"));
            const report = JSON.parse(fs.readFileSync("browser-smoke-artifacts/showcase/webgl/report.json", "utf8"));
            if (report.checkoutRevision !== source ||
                JSON.stringify(report.servedBuildIdentity) !== JSON.stringify(identity) ||
                report.backendRequested !== "webgl" || typeof report.browserVersion !== "string" || !report.browserVersion ||
                !report.results.some(result => result.id === "showcase-bloom-emission" && result.outcome === "pass")) {
              throw new Error("original bloom capture/oracle identity mismatch");
            }
          '
          cp web/runtime-build-identity.json browser-smoke-artifacts/showcase-diagnostic/webgl/runtime-build-identity.json
          cp browser-smoke-artifacts/showcase/webgl/report.json browser-smoke-artifacts/showcase-diagnostic/webgl/original-capture-report.json
          cp browser-smoke-artifacts/showcase/webgl/report.json browser-smoke-artifacts/showcase-diagnostic/webgl/report.json
          sha256sum browser-smoke-artifacts/showcase-diagnostic/webgl/original-capture-report.json > browser-smoke-artifacts/showcase-diagnostic/webgl/original-capture-report.sha256
      - name: Apply diagnostic-only observer instrumentation
        shell: bash
        run: |
          set -euo pipefail
          git apply --check "$RUNNER_TEMP/showcase-capture-diagnostic.patch"
          git apply "$RUNNER_TEMP/showcase-capture-diagnostic.patch"
          sha256sum scripts/showcase-live-review.mjs scripts/showcase-renderer-readback.mjs > browser-smoke-artifacts/showcase-diagnostic/webgl/script.sha256
          echo "full artifact verification passed for pinned source $(cat browser-smoke-artifacts/showcase-diagnostic/webgl/source.txt)" > browser-smoke-artifacts/showcase-diagnostic/webgl/runtime-verification.txt
      - name: Install pinned browser tools
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Observe unchanged bloom first-pass and replay checks
        id: diagnostic
        env:
          NOON_SHOWCASE_BACKEND: webgl
          NOON_SHOWCASE_CASES: showcase-bloom-emission
          NOON_SHOWCASE_DIAGNOSTIC_OUTPUT: browser-smoke-artifacts/showcase-diagnostic/webgl/live
        run: node scripts/showcase-live-review.mjs
      - name: Preserve diagnostic outcome and runtime hashes
        if: always()
        env:
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic.outcome }}
        run: |
          mkdir -p browser-smoke-artifacts/showcase-diagnostic/webgl
          echo "$DIAGNOSTIC_OUTCOME" > browser-smoke-artifacts/showcase-diagnostic/webgl/diagnostic-outcome.txt
          if [[ -f web/python-worker.js && -f web/pkg/noon_web.js && -f web/pkg/noon_web_bg.wasm && -f web/runtime-build-identity.json ]]; then
            sha256sum web/python-worker.js web/pkg/noon_web.js web/pkg/noon_web_bg.wasm web/runtime-build-identity.json > browser-smoke-artifacts/showcase-diagnostic/webgl/runtime-files.sha256
          fi
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: noon-2421-showcase-capture-diagnostic-webgl
          path: browser-smoke-artifacts/showcase-diagnostic/webgl
          if-no-files-found: error
          retention-days: 3
