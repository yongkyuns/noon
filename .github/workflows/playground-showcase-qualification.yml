name: Showcase capture timing diagnostic

on:
  push:
    branches: [codex/2421-showcase-diagnostic]

permissions:
  contents: read
  actions: read

jobs:
  capture-diagnostic:
    name: Diagnose first-pass capture (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        backend: [webgpu, webgl]
    steps:
      - uses: actions/checkout@v7
      - name: Apply early-observer diagnostic patch to the exact tested source
        shell: bash
        env:
          SOURCE_REVISION: 32a7d3d19b97e5ca4e885920886e55680fe170d8
        run: |
          set -euo pipefail
          cp scripts/showcase-live-review-diagnostic.patch "$RUNNER_TEMP/showcase-capture-diagnostic.patch"
          git fetch --no-tags --depth=1 origin "$SOURCE_REVISION"
          git checkout --detach "$SOURCE_REVISION"
          git apply --check "$RUNNER_TEMP/showcase-capture-diagnostic.patch"
          git apply "$RUNNER_TEMP/showcase-capture-diagnostic.patch"
          mkdir -p "browser-smoke-artifacts/showcase-diagnostic/${{ matrix.backend }}"
          cp "$RUNNER_TEMP/showcase-capture-diagnostic.patch" "browser-smoke-artifacts/showcase-diagnostic/${{ matrix.backend }}/harness.patch"
          sha256sum "$RUNNER_TEMP/showcase-capture-diagnostic.patch" > "browser-smoke-artifacts/showcase-diagnostic/${{ matrix.backend }}/harness.sha256"
          git rev-parse HEAD > "browser-smoke-artifacts/showcase-diagnostic/${{ matrix.backend }}/source.txt"
          node --version > "browser-smoke-artifacts/showcase-diagnostic/${{ matrix.backend }}/node-version.txt"
      - name: Reuse exact runtime and original capture evidence
        uses: actions/download-artifact@v8
        with:
          artifact-ids: 13318414975
          run-id: 41825281871
          github-token: ${{ github.token }}
          path: web
      - name: Reuse original backend capture oracle and preserve prior live results
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ matrix.backend == 'webgpu' && '13324680634' || '13324560375' }}
          run-id: 41825281871
          github-token: ${{ github.token }}
          path: browser-smoke-artifacts/showcase/${{ matrix.backend }}
      - name: Verify source, runtime, oracle identity, and pinned browser tools
        env:
          EXPECTED_SOURCE: 32a7d3d19b97e5ca4e885920886e55680fe170d8
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          test "$(cat browser-smoke-artifacts/showcase-diagnostic/$BACKEND/source.txt)" = "$EXPECTED_SOURCE"
          node -e 'const i=require("./web/runtime-build-identity.json"); if(i.sourceRevision!==process.env.EXPECTED_SOURCE) throw Error(`runtime source mismatch: ${i.sourceRevision}`)'
          mkdir -p "browser-smoke-artifacts/showcase-diagnostic/$BACKEND/original"
          mv "browser-smoke-artifacts/showcase/$BACKEND/live" "browser-smoke-artifacts/showcase-diagnostic/$BACKEND/original/live"
          cp "browser-smoke-artifacts/showcase/$BACKEND/report.json" "browser-smoke-artifacts/showcase-diagnostic/$BACKEND/original/capture-report.json"
          sha256sum "browser-smoke-artifacts/showcase-diagnostic/$BACKEND/original/capture-report.json" > "browser-smoke-artifacts/showcase-diagnostic/$BACKEND/original/capture-report.sha256"
          cp web/runtime-build-identity.json "browser-smoke-artifacts/showcase-diagnostic/$BACKEND/runtime-build-identity.json"
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
          node scripts/check-web-package.mjs
          git diff --exit-code -- web
      - name: Observe unchanged first-pass and replay checks for the two failures
        id: diagnostic
        env:
          NOON_SHOWCASE_BACKEND: ${{ matrix.backend }}
          NOON_SHOWCASE_CASES: showcase-bloom-emission,showcase-glass-lens
        run: node scripts/showcase-live-review.mjs
      - name: Retain diagnostic result and report
        if: always()
        env:
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic.outcome }}
          BACKEND: ${{ matrix.backend }}
        run: |
          echo "$DIAGNOSTIC_OUTCOME" > "browser-smoke-artifacts/showcase-diagnostic/$BACKEND/diagnostic-outcome.txt"
          if [[ -d "browser-smoke-artifacts/showcase/$BACKEND/live" ]]; then
            mv "browser-smoke-artifacts/showcase/$BACKEND/live" \
              "browser-smoke-artifacts/showcase-diagnostic/$BACKEND/live"
          fi
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: noon-2421-showcase-capture-diagnostic-${{ matrix.backend }}
          path: browser-smoke-artifacts/showcase-diagnostic/${{ matrix.backend }}
          if-no-files-found: error
          retention-days: 3
