name: Showcase qualification
on:
  push:
    branches: [work/1718-callback-lifecycle-validation]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    name: Isolated callback lifecycle validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          path: proposal
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: b8883aeabe30a241e069f39cde28f7936e828775
          path: source
          persist-credentials: false
      - name: Prepare a pinned candidate without changing any branch
        run: |
          mkdir -p evidence
          python3 ../proposal/scripts/ci-callback-lifecycle-candidate.py
          cat ../proposal/scripts/ci-callback-lifecycle-extra.rs >> crates/noon/tests/callback_lifecycle_admission.rs
          python3 ../proposal/scripts/ci-display-channel-candidate.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/noon/tests/callback_lifecycle_admission.rs')
          s = p.read_text()
          s = s.replace('for route in 0..3 {', 'for route in [ActivationRoute::Direct, ActivationRoute::Leaf, ActivationRoute::Nested] {')
          s = s.replace('let nested = route == 2;', 'let nested = matches!(route, ActivationRoute::Nested);')
          s = s.replace('if route == 0 {', 'if matches!(route, ActivationRoute::Direct) {')
          s = s.replace('route={route}', 'route={route:?}')
          s = s.replace('fn qualify_unrelated_callback(lifecycle: Lifecycle) {', '#[derive(Clone, Copy, Debug)]\nenum ActivationRoute { Direct, Leaf, Nested }\n\nfn qualify_unrelated_callback(lifecycle: Lifecycle) {')
          s = s.replace('// Both a leaf request and a nested request must preserve the same semantics.', '// Direct, leaf-composition and nested requests must preserve the same semantics.')
          p.write_text(s)
          p = Path('crates/noon-runtime/src/lib.rs')
          s = p.read_text()
          old = '        if relevant().any(|channel| matches!(channel.property, Property::Transform | Property::Morph)) {'
          new = '''        let coupled = [Property::Transform, Property::Morph].into_iter().any(|property| {
                      !self.compiled.channel_tracks(CompiledChannelKey::new(object_index as u32, property)).is_empty()
                  });
                  if coupled || relevant().any(|channel| matches!(channel.property, Property::Transform | Property::Morph)) {'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          p = Path('.github/workflows/playground-showcase-qualification.yml')
          s = p.read_text()
          old = "      - 'crates/noon-runtime/src/replay.rs'"
          assert s.count(old) == 1
          s = s.replace(old, "      - 'crates/noon-runtime/src/lib.rs'\n      - 'crates/noon-runtime/tests/display_channel_mutation.rs'\n" + old)
          old = '        run: cargo test -p noon --no-default-features --test callback_lifecycle_admission'
          assert s.count(old) == 1
          s = s.replace(old, '        run: |\n          cargo test -p noon --no-default-features --test callback_lifecycle_admission\n          cargo test -p noon-runtime --test display_channel_mutation')
          p.write_text(s)
          PY
      - name: Format and check candidate files with their crate edition
        run: |
          paths=(crates/noon/src/execution_session.rs crates/noon/tests/callback_lifecycle_admission.rs crates/noon-runtime/src/lib.rs crates/noon-runtime/tests/display_channel_mutation.rs)
          rustfmt --edition 2021 --config skip_children=true "${paths[@]}"
          rustfmt --edition 2021 --check --config skip_children=true "${paths[@]}"
          git add -N crates/noon-runtime/tests/display_channel_mutation.rs
          git diff --check
          git diff > evidence/candidate.patch
          paths+=(.github/workflows/playground-showcase-qualification.yml)
          for path in "${paths[@]}"; do mkdir -p "evidence/$(dirname "$path")"; cp "$path" "evidence/$path"; done
      - name: Run native acceptance and display-channel tests
        run: |
          cargo test -p noon --no-default-features --test callback_lifecycle_admission 2>&1 | tee evidence/acceptance.log
          cargo test -p noon-runtime --test display_channel_mutation 2>&1 | tee evidence/display-channels.log
      - name: Run existing library and integration regressions
        run: |
          cargo test -p noon --no-default-features --lib --tests 2>&1 | tee evidence/regressions.log
          cargo test -p noon-runtime --lib --tests 2>&1 | tee evidence/runtime-regressions.log
      - name: Lint candidate integration tests
        run: |
          cargo clippy -p noon --no-default-features --test callback_lifecycle_admission -- -D warnings 2>&1 | tee evidence/clippy.log
          cargo clippy -p noon-runtime --test display_channel_mutation -- -D warnings 2>&1 | tee evidence/runtime-clippy.log
      - name: Store validated source blobs only, never move a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          paths = ['crates/noon/src/execution_session.rs', 'crates/noon/tests/callback_lifecycle_admission.rs', 'crates/noon-runtime/src/lib.rs', 'crates/noon-runtime/tests/display_channel_mutation.rs', '.github/workflows/playground-showcase-qualification.yml']
          blobs = []
          for path in paths:
              payload = json.dumps({'content': Path(path).read_text(), 'encoding': 'utf-8'}).encode()
              request = urllib.request.Request('https://api.github.com/repos/yongkyuns/noon/git/blobs', data=payload, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request) as response:
                  sha = json.load(response)['sha']
              blobs.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha})
          Path('evidence/blobs.json').write_text(json.dumps(blobs, indent=2))
          print(json.dumps(blobs, indent=2))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: callback-lifecycle-candidate
          path: source/evidence
          retention-days: 7
          if-no-files-found: error
