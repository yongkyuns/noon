name: Showcase qualification

on:
  pull_request:
    paths:
      - 'web/*gallery*'
      - 'web/showcase-*'
      - 'web/thumbnails/showcase/**'
      - 'web/playground-playback-controls*'
      - 'web/authoring-execution-client.js'
      - 'web/python/examples/showcase_*.py'
      - 'web/python/examples/noon_showcase_manifest.json'
      - 'web/python/test_showcase*.py'
      - 'scripts/showcase-*'
      - 'crates/noon/src/execution_session.rs'
      - 'crates/noon/src/execution_session/**'
      - 'crates/noon/src/live_session.rs'
      - 'crates/noon/src/live_session/**'
      - 'crates/noon/src/host_callbacks.rs'
      - 'crates/noon/tests/callback_lifecycle_admission.rs'
      - 'crates/noon/tests/scalar_timeline_replay.rs'
      - 'crates/noon-runtime/src/signal_timeline.rs'
      - 'crates/noon-runtime/src/prepared_frame.rs'
      - 'crates/noon-runtime/src/execution_slots/runtime_transaction.rs'
      - 'crates/noon-compile/src/replay_revision.rs'
      - 'crates/noon-runtime/src/lib.rs'
      - 'crates/noon-runtime/tests/display_channel_mutation.rs'
      - 'crates/noon-runtime/src/replay.rs'
      - 'crates/noon-runtime/src/replay/**'
      - 'crates/noon-render-wgpu/**'
      - '.github/workflows/playground-showcase-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showcase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  callback-lifecycle:
    name: Native callback lifecycle admission
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
      - name: Qualify lifecycle and updater coexistence in shared Rust
        run: |
          cargo test -p noon --no-default-features --test callback_lifecycle_admission
          cargo test -p noon-runtime --test display_channel_mutation
          cargo test -p noon --no-default-features --test scalar_timeline_replay
      - name: Qualify current glyph packing and retained renderer locality
        run: |
          cargo test -p noon-render-wgpu --lib
          cargo test -p noon-render-wgpu --test text_retained_object_update_locality --test retained_scratch_reuse --test text_live_atlas_pages --test glyph_atlas_residency_churn
          cargo clippy -p noon-render-wgpu --lib -- -D warnings

  capture:
    name: Actual showcase frames (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [webgpu, webgl]
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      NOON_SHOWCASE_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v7
      - name: Source and editorial contracts
        run: |
          node --test web/showcase-gallery.test.mjs web/playground-playback-controls.test.mjs scripts/showcase-*.test.mjs
          python3 -m unittest discover -s web/python -p 'test_showcase*.py'
          node --check scripts/showcase-capture.mjs
          node --check scripts/showcase-live-review.mjs
      - name: Build the existing browser runtime
        uses: ./.github/actions/dev-wasm-build
        with:
          preflight: 'true'
      - name: Qualify retained family replay in the shared runtime
        run: cargo test -p noon-runtime replay::family_tests
      - name: Install the repository-pinned browser tools
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Capture exact Noon sources, validate temporal samples, and exercise real selection
        id: capture
        run: node scripts/showcase-capture.mjs
      - name: Record ordinary playback and qualify replay endpoints
        if: ${{ !cancelled() && (steps.capture.outcome == 'success' || steps.capture.outcome == 'failure') }}
        run: node scripts/showcase-live-review.mjs
      - name: Check visible motion inside the first triangle-light flight
        if: ${{ !cancelled() && (steps.capture.outcome == 'success' || steps.capture.outcome == 'failure') }}
        run: node scripts/showcase-triangle-light-motion.mjs browser-smoke-artifacts/showcase/${{ matrix.backend }}
      - name: Retain the review evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: showcase-review-${{ matrix.backend }}
          path: browser-smoke-artifacts/showcase/${{ matrix.backend }}
          if-no-files-found: warn
          retention-days: 3

  # Temporary PR #2203-only import of genuine, source-bound WebGL
  # captures from the qualifying run. Delete this job before marking PR ready.
  code-pygments-poster-publication:
    name: Pygments source-bound WebGL poster publication
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'yongkyuns/noon' && github.event.pull_request.head.ref == 'fix/code-pygments-2193' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      # The source-aligned WebGL renderer job of PR run 39170405872 passed
      # all 25 genuine captures. Use its original frames and true build SHA,
      # never generate PNGs or pretend they belong to a different build.
      - uses: actions/download-artifact@v8
        with:
          name: showcase-review-webgl
          repository: yongkyuns/noon
          run-id: 39170405872
          github-token: ${{ github.token }}
          path: browser-smoke-artifacts/showcase/webgl
      - name: Validate original WebGL frame provenance and stage 24 posters
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          root = Path("browser-smoke-artifacts/showcase/webgl")
          manifest = json.loads(Path("web/python/examples/noon_showcase_manifest.json").read_text())
          report = json.loads((root / "report.json").read_text())
          evidence = json.loads((root / "capture-evidence.json").read_text())
          revision = "ce5dbe43f3642c2266682d81bbe1fb9c004424b7"
          assert report["checkoutRevision"] == revision
          assert report["backendRequested"] == evidence["backend"] == "webgl"
          assert report["servedBuildIdentity"] == evidence["runtimeBuildIdentity"]
          assert evidence["captureRevision"] == evidence["runtimeBuildIdentity"]["sourceRevision"] == revision
          assert len(manifest["entries"]) == len(report["results"]) == len(evidence["posters"]) == 25
          assert manifest["entries"][-1]["id"] == "showcase-cuda-transpose"
          assert [x["id"] for x in report["results"]] == [x["id"] for x in manifest["entries"]]
          assert all(x["outcome"] == "pass" and not x["pageErrors"] for x in report["results"])
          hashes = lambda data: hashlib.sha256(data).hexdigest()
          dst = Path("web/thumbnails/showcase")
          for entry, rec in zip(manifest["entries"][:-1], evidence["posters"][:-1]):
              assert rec["id"] == entry["id"]
              assert rec["captureBuildId"] == evidence["runtimeBuildIdentity"]["buildId"]
              assert rec["thumbnailTime"] == entry["thumbnail_time"]
              assert hashes((Path("web") / entry["path"]).read_bytes()) == rec["sourceSha256"]
              image = (root / f"{entry['id']}.png").read_bytes()
              assert image.startswith(b"\x89PNG\r\n\x1a\n")
              assert hashes(image) == rec["image"]["pngSha256"]
              assert int.from_bytes(image[16:20], "big") == rec["image"]["width"]
              assert int.from_bytes(image[20:24], "big") == rec["image"]["height"]
              shutil.copyfile(root / f"{entry['id']}.png", dst / f"{entry['id']}.png")
          evidence["posters"] = evidence["posters"][:-1]
          (dst / "capture-evidence.json").write_text(json.dumps(evidence, indent=2, ensure_ascii=False) + "\n")
          print("Verified and staged 24 actual WebGL renderer posters at", revision)
          PY
      - name: Validate imported PNGs and independently captured CUDA poster
        run: |
          node --test scripts/showcase-posters.test.mjs
          git diff --check
          test -z "$(git status --porcelain -- web/thumbnails/showcase/showcase-cuda-transpose.png web/thumbnails/showcase/showcase-cuda-transpose-evidence.json)"
      - name: Commit genuine source-verified poster assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/thumbnails/showcase
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source-bound gallery changes were produced" >&2
            exit 1
          fi
          git commit -m "Publish authentic Code Pygments WebGL gallery captures"
          git push origin HEAD:fix/code-pygments-2193

