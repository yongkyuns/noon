name: Temporary 1510 Live apply patch

on:
  push:
    branches:
      - codex/1510-live-apply-delegation

permissions:
  contents: write

jobs:
  patch-live-apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, macOS, noon-physical]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/1510-live-apply-delegation
          fetch-depth: 0
      - name: Delegate LiveSession apply to Scene route
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('crates/noon/src/live_session.rs')
          text = source.read_text()
          old = '''    /// Apply one supported semantic transaction and publish it into the same
              /// runtime. Unsupported content and structural work fails before
              /// either layer commits.
              pub fn apply(
                  &mut self,
                  transaction: SemanticMutationTransaction,
              ) -> Result<SemanticMutationTransactionResult, LiveSessionError> {
                  let mut store = self.store.borrow_mut();
                  self.session
                      .apply_semantic_transaction_at_root(&mut store, self.root, transaction)
                      .map_err(Into::into)
              }
          '''
          new = '''    /// Apply one supported semantic transaction through the Scene-owned running
              /// publication route. Unsupported content and structural work fails before
              /// either layer commits.
              pub fn apply(
                  &mut self,
                  transaction: SemanticMutationTransaction,
              ) -> Result<SemanticMutationTransactionResult, LiveSessionError> {
                  crate::Scene::publish_running_transaction(
                      self.store,
                      self.root,
                      self.session,
                      transaction,
                  )
                  .map_err(Into::into)
              }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one LiveSession::apply block, found {text.count(old)}')
          source.write_text(text.replace(old, new, 1))
          Path('.github/workflows/temp-1510-live-apply.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/noon/src/live_session.rs .github/workflows/temp-1510-live-apply.yml
          git commit -m 'Delegate LiveSession publication to Scene route'
          git push origin HEAD:codex/1510-live-apply-delegation
