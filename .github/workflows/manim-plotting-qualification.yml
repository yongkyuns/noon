name: Plotting qualification

on:
  pull_request:
    paths:
      - 'crates/noon*/**'
      - 'web/python/**'
      - 'web/python-worker.source.js'
      - 'web/python-compat-modules.js'
      - 'web/plotting-smoke.js'
      - 'web/manim-compat-smoke.html'
      - 'scripts/plotting-qualification.mjs'
      - 'scripts/time-series-plotting-qualification.mjs'
      - 'scripts/gapped-plotting-checks.mjs'
      - '.github/workflows/manim-plotting-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plotting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plotting:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build exact-source browser package
        uses: ./.github/actions/dev-wasm-build
        with:
          preflight: 'true'
          cache-ref: ${{ github.event.pull_request.base.sha }}
      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.62.1
      - name: Install pinned browser dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Qualify paired plotting and resumed Python authoring
        run: node scripts/plotting-qualification.mjs
      - name: Qualify numeric labels and timestamp-synchronized playback
        run: node scripts/time-series-plotting-qualification.mjs
      - name: Qualify synchronized multi-series playback
        run: node scripts/time-series-plotting-qualification.mjs synchronized
      - name: Qualify explicit outages and marker recovery
        run: node scripts/time-series-plotting-qualification.mjs gapped
      - name: Record tested checkout and isolated gap diagnostics
        if: always()
        run: |
          mkdir -p plotting-artifacts
          git rev-parse HEAD > plotting-artifacts/source-sha.txt
          git ls-files | grep -E '\.(rs|py|js|mjs|toml|md|sh|yml|yaml|json|html|css)$' > /tmp/noon-text-files
          tar -czf plotting-artifacts/sources.tar.gz -T /tmp/noon-text-files
          git worktree add --detach /tmp/noon-gap-format HEAD
          (cd /tmp/noon-gap-format && cargo fmt --all && git diff --binary) > plotting-artifacts/format.patch
          git worktree remove --force /tmp/noon-gap-format
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plotting-${{ github.event.pull_request.head.sha || github.sha }}
          path: plotting-artifacts/
          retention-days: 7
