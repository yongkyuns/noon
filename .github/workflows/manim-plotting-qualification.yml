name: Plotting qualification

on:
  pull_request:
    paths:
      - 'crates/noon*/**'
      - 'web/python/**'
      - 'web/python-worker.source.js'
      - 'web/python-compat-modules.js'
      - 'web/plotting-smoke.js'
      - 'web/number-label-smoke.js'
      - 'web/manim-compat-smoke.html'
      - 'scripts/plotting-qualification.mjs'
      - 'scripts/polygon-qualification.mjs'
      - 'scripts/paired-authoring-qualification.mjs'
      - 'scripts/paint-fade-qualification.mjs'
      - 'scripts/match-color-qualification.mjs'
      - 'scripts/time-series-plotting-qualification.mjs'
      - 'scripts/live-coordinate-checks.mjs'
      - 'scripts/animated-plotting-checks.mjs'
      - 'scripts/animated-plotting-samples.mjs'
      - 'scripts/gapped-plotting-checks.mjs'
      - '.github/workflows/manim-plotting-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plotting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Exact-source plotting package and full validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      package_artifact_id: ${{ steps.package.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare validation evidence before package preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/plotting-integration
          git rev-parse HEAD > ci-artifacts/plotting-integration/source-sha.txt
          git status --porcelain --untracked-files=all > ci-artifacts/plotting-integration/worktree-before-build.txt
      - name: Build exact-source browser package
        uses: ./.github/actions/dev-wasm-build
        with:
          preflight: 'true'
          cache-ref: ${{ github.event.pull_request.base.sha }}
      - name: Retain package-build outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f web/ci-artifact.json ]]; then
            cp web/ci-artifact.json ci-artifacts/plotting-integration/package-build.json
          fi
      - name: Verify animated plotting factories in the built package
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import * as wasm from './web/pkg/noon_web.js';
          import { animatedPlottingCases } from './scripts/animated-plotting-samples.mjs';
          // Inspect the generated module, not Rust source text. Keep the expected
          // names with the real qualification cases instead of a duplicate list.
          const cases = Object.entries(animatedPlottingCases);
          assert.ok(cases.length > 0, 'animated plotting qualification cases are empty');
          for (const [mode, { factory }] of cases) {
            assert.equal(typeof wasm[factory], 'function', `${mode}: missing WASM factory ${factory}`);
          }
          console.log(`Verified built animated plotting factories: ${cases.map(([mode]) => mode).join(', ')}`);
          JS
      # Run before npm and screenshot output create untracked files. The shared
      # architecture gate must inspect source, not generated browser dependencies.
      - name: Validate full integrated repository
        shell: bash
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          NOON_WASM_PROFILE: dev
          NOON_WASM_SKIP_OPT: '1'
          NOON_SKIP_WEB_PREFLIGHT: '0'
          NOON_WEB_PREFLIGHT_ONLY: '0'
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/plotting-integration
          git status --porcelain --untracked-files=all > ci-artifacts/plotting-integration/worktree-before.txt
          bash scripts/check.sh full "$VALIDATION_BASE" 2>&1 | tee ci-artifacts/plotting-integration/full-check.log
      - name: Authenticate the final validated package
        run: |
          node .github/ci/wasm-build.mjs stamp
          node .github/ci/wasm-build.mjs verify
      - name: Publish the exact-source package
        id: package
        uses: actions/upload-artifact@v7
        with:
          name: plotting-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/pkg/
            web/python-worker.js
            web/python/compat-bundle.*.json
            web/runtime-build-identity.json
            web/ci-artifact.json
            web/ci-Cargo.lock
          if-no-files-found: error
          retention-days: 3
      - name: Retain integrated validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plotting-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/plotting-integration/
          if-no-files-found: error
          retention-days: 3

  qualify:
    name: Plotting / ${{ matrix.case }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: plotting
            script: scripts/plotting-qualification.mjs
            mode: ''
          - case: polygons
            script: scripts/polygon-qualification.mjs
            mode: ''
          - case: constructor-defaults
            script: scripts/constructor-defaults-qualification.mjs
            mode: ''
          - case: paint-fade
            script: scripts/paint-fade-qualification.mjs
            mode: ''
          - case: match-color
            script: scripts/match-color-qualification.mjs
            mode: ''
          - case: coordinates
            script: scripts/time-series-plotting-qualification.mjs
            mode: 'coordinates'
          - case: number-line
            script: scripts/time-series-plotting-qualification.mjs
            mode: 'number-line'
          - case: single
            script: scripts/time-series-plotting-qualification.mjs
            mode: ''
          - case: synchronized
            script: scripts/time-series-plotting-qualification.mjs
            mode: 'synchronized'
          - case: gapped
            script: scripts/time-series-plotting-qualification.mjs
            mode: 'gapped'
          - case: live
            script: scripts/time-series-plotting-qualification.mjs
            mode: 'live'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the producing build's artifact identity
        env:
          PACKAGE_ARTIFACT_ID: ${{ needs.build.outputs.package_artifact_id }}
        run: '[[ "$PACKAGE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - name: Download the same validated package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.package_artifact_id }}
          merge-multiple: true
          path: web
      - name: Verify exact checkout and every package byte
        run: node .github/ci/wasm-build.mjs verify
      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.62.1
      - name: Install pinned browser dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Qualify the unchanged paired case
        env:
          NOON_CASE_SCRIPT: ${{ matrix.script }}
          NOON_CASE_MODE: ${{ matrix.mode }}
          NOON_POLYGON_ARTIFACTS: plotting-artifacts/polygons
          NOON_CONSTRUCTOR_DEFAULTS_ARTIFACTS: plotting-artifacts/constructor-defaults
          NOON_PAINT_FADE_ARTIFACTS: plotting-artifacts/paint-fade
          NOON_MATCH_COLOR_ARTIFACTS: plotting-artifacts/match-color
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$NOON_CASE_MODE" ]]; then
            node "$NOON_CASE_SCRIPT" "$NOON_CASE_MODE"
          else
            node "$NOON_CASE_SCRIPT"
          fi
      - name: Record tested checkout and case
        if: always()
        shell: bash
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          NOON_CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          mkdir -p plotting-artifacts
          git rev-parse HEAD > plotting-artifacts/source-sha.txt
          printf '%s\n' "$VALIDATION_BASE" > plotting-artifacts/base-sha.txt
          printf '%s\n' "$NOON_CASE" > plotting-artifacts/case.txt
          git diff --binary "$VALIDATION_BASE"...HEAD > plotting-artifacts/integration.diff
      - name: Retain every executed case, including cancellation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plotting-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: plotting-artifacts/
          if-no-files-found: error
          retention-days: 3
