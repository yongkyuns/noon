name: A3 bootstrap animation graph
on:
  push:
    branches:
      - arch/a3-animation-graph
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.event.head_commit.message == 'Validate A3 retained animation graph'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/a3-animation-graph
      - name: Wire graph and correct lowering helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lib = Path('crates/noon-core/src/lib.rs')
          text = lib.read_text()
          text = text.replace('mod patch;\nmod reactive;\nmod timeline;\n', 'mod animation_graph;\nmod patch;\nmod reactive;\nmod timeline;\n', 1)
          text = text.replace('pub use patch::*;\npub use reactive::*;\npub use timeline::*;\n', 'pub use animation_graph::*;\npub use patch::*;\npub use reactive::*;\npub use timeline::*;\n', 1)
          lib.write_text(text)

          graph = Path('crates/noon-core/src/animation_graph.rs')
          text = graph.read_text()
          old = '''                let leaf_run_time = node_effective_run_time(intrinsic, node.options.run_time)?;\n                let local_start = template.timing.start_time / intrinsic.max(f64::EPSILON);\n                let local_duration = template.timing.duration / intrinsic.max(f64::EPSILON);\n                let scale = if leaf_run_time > 0.0 {\n                    intrinsic / leaf_run_time\n                } else {\n                    1.0\n                };\n                steps.push(CompositionTimeMapStep::new(\n                    (local_start * scale).clamp(0.0, 1.0),\n                    (local_duration * scale).clamp(f64::EPSILON, 1.0),\n                    rate_func,\n                ));\n'''
          new = '''                let local_start = template.timing.start_time / intrinsic.max(f64::EPSILON);\n                let local_duration = template.timing.duration / intrinsic.max(f64::EPSILON);\n                steps.push(CompositionTimeMapStep::new(\n                    local_start.clamp(0.0, 1.0),\n                    local_duration.clamp(f64::EPSILON, 1.0),\n                    rate_func,\n                ));\n'''
          if old not in text:
              raise SystemExit('leaf timing anchor missing')
          text = text.replace(old, new, 1)
          old = '            let rate_func = node.options.rate_func.unwrap_or(RateFunction::Linear);\n'
          new = '''            let rate_func = if node_id == root {\n                context\n                    .play_options\n                    .rate_func\n                    .or(node.options.rate_func)\n                    .unwrap_or(RateFunction::Linear)\n            } else {\n                node.options.rate_func.unwrap_or(RateFunction::Linear)\n            };\n'''
          if old not in text:
              raise SystemExit('leaf rate anchor missing')
          text = text.replace(old, new, 1)

          old = '''        lower_node(\n            graph,\n            root,\n            root,\n            context,\n            root_duration,\n            &[],\n            &mut candidates,\n            &mut stats,\n        )?;\n'''
          new = '''        lower_node(\n            graph,\n            root,\n            LowerRootContext {\n                root,\n                context,\n                root_duration,\n            },\n            &[],\n            &mut candidates,\n            &mut stats,\n        )?;\n'''
          if old not in text:
              raise SystemExit('initial lowering call anchor missing')
          text = text.replace(old, new, 1)

          old = '''#[derive(Clone, Debug)]\nstruct CandidateTrack {\n    origin: AnimationTrackOrigin,\n    track: TrackDefinition,\n}\n\nfn lower_node(\n    graph: &AnimationGraph,\n    node_id: AnimationNodeId,\n    root: AnimationNodeId,\n    context: AnimationLoweringContext,\n    root_duration: f64,\n    inherited_steps: &[CompositionTimeMapStep],\n    output: &mut Vec<CandidateTrack>,\n    stats: &mut AnimationRelowerStats,\n) -> Result<(), AnimationGraphError> {\n'''
          new = '''#[derive(Clone, Debug)]\nstruct CandidateTrack {\n    origin: AnimationTrackOrigin,\n    track: TrackDefinition,\n}\n\n#[derive(Clone, Copy)]\nstruct LowerRootContext {\n    root: AnimationNodeId,\n    context: AnimationLoweringContext,\n    root_duration: f64,\n}\n\nfn lower_node(\n    graph: &AnimationGraph,\n    node_id: AnimationNodeId,\n    lowering: LowerRootContext,\n    inherited_steps: &[CompositionTimeMapStep],\n    output: &mut Vec<CandidateTrack>,\n    stats: &mut AnimationRelowerStats,\n) -> Result<(), AnimationGraphError> {\n    let root = lowering.root;\n    let context = lowering.context;\n    let root_duration = lowering.root_duration;\n'''
          if old not in text:
              raise SystemExit('lower_node signature anchor missing')
          text = text.replace(old, new, 1)

          old = '''                lower_node(\n                    graph,\n                    child,\n                    root,\n                    context,\n                    root_duration,\n                    &steps,\n                    output,\n                    stats,\n                )?;\n'''
          new = '''                lower_node(\n                    graph,\n                    child,\n                    lowering,\n                    &steps,\n                    output,\n                    stats,\n                )?;\n'''
          if old not in text:
              raise SystemExit('recursive lowering call anchor missing')
          graph.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
      - name: Validate noon-core
        run: |
          cargo test -p noon-core
          cargo clippy -p noon-core --all-targets -- -D warnings
      - name: Commit implementation
        run: |
          rm .github/workflows/a3-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/noon-core .github/workflows/a3-bootstrap.yml
          git commit -m 'Retain semantic animation graph and lower locally'
          git push origin HEAD:arch/a3-animation-graph
