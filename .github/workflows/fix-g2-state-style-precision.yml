name: Fix G2 state semantic precision

on:
  push:
    branches:
      - agent/g2-shared-object-state

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/g2-shared-object-state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use stable Rust and wasm target
        run: |
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt clippy
      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Apply semantic precision fix
        run: python .github/fix-g2-state-style-precision.py
      - name: Validate state semantics
        run: |
          cargo fmt --all
          cargo clippy -p noon-web --all-targets -- -D warnings
          cargo test -p noon-web
          cargo check -p noon-web --target wasm32-unknown-unknown
          python -m compileall -q web/python scripts/manim-differential.py
      - name: Install ManimCE reference
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config
          python -m pip install --disable-pip-version-check "manim==0.21.0"
      - name: Run 25-case differential suite
        run: python scripts/manim-differential.py
      - name: Build browser package
        env:
          NOON_SKIP_PLAYGROUND_TEST: "1"
          NOON_WASM_SKIP_OPT: "1"
        run: bash scripts/build-web-demo.sh
      - name: Run Manim browser compatibility smoke
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
          node scripts/manim-compat-smoke.mjs
      - name: Commit precision fix and remove helpers
        run: |
          find web scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/noon-web/src/authoring_mobject.rs
          git rm .github/fix-g2-state-style-precision.py .github/workflows/fix-g2-state-style-precision.yml
          git commit -m "Preserve semantic style precision across object state"
          git push origin HEAD:agent/g2-shared-object-state
