name: Diagnostic preparation window
on:
  push:
    branches: [diagnostic/noon-preparation-window-20261023]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: true
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Apply exact-source candidate
        run: python3 .github/diagnostics/preparation-window.py apply
      - name: Install pinned Rust
        run: |
          rustup install
          rustc --version --verbose | tee /tmp/preparation-window/rustc.txt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Format and retain exact candidate
        run: |
          cargo fmt --all
          python3 .github/diagnostics/preparation-window.py save
      - name: Shared demand and platform task regressions
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p noon --no-default-features --features prepared-prefix --lib cooperative_source 2>&1 | tee /tmp/preparation-window/source-tests.log
          cargo test --locked -p noon-web --all-features --lib 2>&1 | tee /tmp/preparation-window/web-tests.log
          cargo test --locked -p noon --no-default-features --features prepared-prefix --test prepared_prefix_identity 2>&1 | tee /tmp/preparation-window/identity-tests.log
          node --test web/cooperative-preparation-driver.test.mjs web/direct-execution-wake-driver.test.mjs 2>&1 | tee /tmp/preparation-window/task-tests.log
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Build direct prepared WASM canvas
        shell: bash
        run: |
          set -o pipefail
          wasm-pack build crates/noon-web --target web --out-dir ../../web/pkg --dev --no-opt --features prepared-prefix,renderer-smoke --locked 2>&1 | tee /tmp/preparation-window/wasm-build.log
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.62.1
      - name: Install pinned Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Qualify real bounded preparation and continuous playback
        shell: bash
        env:
          NOON_PREPARED_CANVAS_ARTIFACTS: /tmp/preparation-window/browser/canvas
          NOON_PREPARED_SOURCE_ARTIFACTS: /tmp/preparation-window/browser/source
        run: |
          set -o pipefail
          node scripts/prepared-canvas-qualification.mjs 2>&1 | tee /tmp/preparation-window/canvas-browser.log
          node scripts/prepared-source-qualification.mjs 2>&1 | tee /tmp/preparation-window/source-browser.log
      - name: Repository fast gate and CI topology
        shell: bash
        run: |
          set -o pipefail
          node --test .github/ci/*.test.mjs 2>&1 | tee /tmp/preparation-window/ci-topology.log
          bash scripts/check.sh fast HEAD 2>&1 | tee /tmp/preparation-window/fast-gate.log
      - name: Store exact tested blobs without moving refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo fmt --all -- --check
          python3 .github/diagnostics/preparation-window.py save
          python3 .github/diagnostics/preparation-window.py store
      - name: Retain exact source and evidence including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preparation-window-qualification
          path: /tmp/preparation-window
          retention-days: 3
