name: D2 detach live-edited mega paths
on:
  push:
    branches:
      - arch/d2-packed-mega-mesh
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Apply D2 static mega-stream detachment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/d2-packed-mega-mesh
      - name: Apply detachment and fragmentation instrumentation
        run: |
          python3 scripts/_d2_detach_patch.py
          cargo fmt --all
      - name: Validate renderer
        run: |
          cargo test -p noon-render-wgpu
          cargo clippy -p noon-render-wgpu --all-targets -- -D warnings
      - name: Commit implementation
        run: |
          rm scripts/_d2_detach_patch.py .github/workflows/d2-detach-mega.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/noon-render-wgpu scripts/_d2_detach_patch.py .github/workflows/d2-detach-mega.yml
          git commit -m 'Keep live mega-mesh edits bounded'
          git push origin HEAD:arch/d2-packed-mega-mesh
