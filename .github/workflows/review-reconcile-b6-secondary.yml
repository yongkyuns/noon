name: Reconcile B6 secondary viewport stack
on:
  push:
    branches: [review/reconcile-b6-secondary-20260921]
    paths: [.github/workflows/review-reconcile-b6-secondary.yml]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2196bc15aca8abc50578bf4ccafce9bcfa20cc1a
          persist-credentials: false
      - name: Install repository-pinned Rust and software Vulkan
        run: |
          rustup install
          rustup show active-toolchain
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - name: Check renderer source and all targets
        run: |
          cargo fmt --all -- --check
          cargo check -p noon-render-wgpu --all-targets
      - name: Exercise secondary composition on software Vulkan
        run: |
          cargo test -p noon-render-wgpu --test secondary_viewport \
            -- --include-ignored --nocapture --test-threads=1
