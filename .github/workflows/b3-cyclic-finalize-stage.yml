name: B3 CyclicReplace boundary verification

on:
  push:
    branches:
      - b3-cyclic-replace-adapter

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b3-cyclic-replace-adapter
      - name: Python contract
        run: |
          python3 web/python/test_manim_cyclic_replace.py
          python3 -m py_compile web/python/_manim_cyclic_replace.py web/python/_manim_scene.py
      - name: WASM check
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p noon-web --target wasm32-unknown-unknown
