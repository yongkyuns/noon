name: C5 worker collection-time presentation qualification
on:
  push:
    branches: [validation/c5-worker-presented-input-20260921]
permissions:
  contents: read
concurrency:
  group: c5-worker-presented-input-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Assemble exact worker receipt candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/proof"
          cat candidate/c5-worker-presented-input/part*.b64 | base64 -d | xz -d > "$GITHUB_WORKSPACE/proof/input.patch"
          echo 'c1eb8cd58e151095eff73bd2bfa0be318bc7e3e60b4b20ff980833038704ed45  proof/input.patch' | sha256sum -c -
          git worktree add --detach "$RUNNER_TEMP/candidate" 9b0365630e83ab5bfbe9f858946bf613c775a287
          git -C "$RUNNER_TEMP/candidate" apply --check "$GITHUB_WORKSPACE/proof/input.patch"
          git -C "$RUNNER_TEMP/candidate" apply "$GITHUB_WORKSPACE/proof/input.patch"
          for patch in "$GITHUB_WORKSPACE"/candidate/c5-worker-presented-input/fix*.patch; do
            if [ -f "$patch" ]; then
              git -C "$RUNNER_TEMP/candidate" apply "$patch"
              cp "$patch" "$GITHUB_WORKSPACE/proof/"
            fi
          done
          echo "CANDIDATE=$RUNNER_TEMP/candidate" >> "$GITHUB_ENV"
          echo "PROOF=$GITHUB_WORKSPACE/proof" >> "$GITHUB_ENV"
      - name: Use repository-pinned Rust
        run: |
          cd "$CANDIDATE"
          rustup install
          rustup target add wasm32-unknown-unknown
          rustc --version --verbose | tee "$PROOF/rust.txt"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with: {version: v0.16.0}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: c5-worker-presented-cargo-${{ runner.os }}-${{ hashFiles('crates/**/Cargo.toml') }}
          restore-keys: |
            c5-worker-presented-cargo-${{ runner.os }}-
            c5-direct-presented-cargo-${{ runner.os }}-
            ${{ runner.os }}-cargo-sources-
      - name: Format and retain exact full source
        run: |
          cd "$CANDIDATE"
          cargo fmt --all
          git add -A
          git diff --cached --check
          git write-tree | tee "$PROOF/tree.txt"
          git diff --cached --binary --full-index > "$PROOF/formatted.patch"
          git diff --cached --stat > "$PROOF/stat.txt"
          git archive --format=tar --prefix=source/ "$(cat "$PROOF/tree.txt")" | gzip > "$PROOF/source.tar.gz"
      - name: Execute worker receipt and shared pointer regressions
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          cargo test -p noon-web --all-features --lib semantic_execution_player::pointer_input -- --nocapture 2>&1 | tee "$PROOF/worker-receipts.log"
          cargo test -p noon --no-default-features --lib execution_session::input::presentation::tests -- --nocapture 2>&1 | tee "$PROOF/shared.log"
      - name: Execute repository fast gate and JavaScript regressions
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          bash scripts/check.sh fast 9b0365630e83ab5bfbe9f858946bf613c775a287 2>&1 | tee "$PROOF/fast.log"
          node --test web/*.test.mjs .github/ci/*.test.mjs scripts/pointer-selection-raster-contract.test.mjs 2>&1 | tee "$PROOF/js.log"
      - name: Compile reduced direct Rust and browser WASM
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          cargo check -p noon --no-default-features --target wasm32-unknown-unknown 2>&1 | tee "$PROOF/wasm-direct.log"
          cargo check -p noon-web --no-default-features --target wasm32-unknown-unknown 2>&1 | tee "$PROOF/wasm-browser.log"
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with: {tool: 'wasm-pack@0.15.0', fallback: none}
      - name: Build actual renderer browser package with preflight
        env:
          NOON_WASM_SKIP_OPT: '1'
          NOON_RENDERER_SMOKE: '1'
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          bash scripts/build-web-demo.sh 2>&1 | tee "$PROOF/browser-build.log"
          sha256sum web/pkg/noon_web_bg.wasm > "$PROOF/wasm.sha256"
      - name: Install browser dependencies
        run: |
          cd "$CANDIDATE"
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Qualify collection-time worker receipts and delayed click pixels
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          node scripts/pointer-selection-qualification.mjs 2>&1 | tee "$PROOF/worker-pixels.log"
      - name: Qualify direct Rust browser and DOM regressions
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          node scripts/pointer-selection-direct-qualification.mjs 2>&1 | tee "$PROOF/direct-parity.log"
          node scripts/direct-pointer-presentation-qualification.mjs 2>&1 | tee "$PROOF/direct-receipts.log"
          node scripts/browser-pointer-input-smoke.mjs 2>&1 | tee "$PROOF/dom.log"
          node scripts/native-input-smoke.mjs 2>&1 | tee "$PROOF/reactive-input.log"
      - name: Prove delayed receipt regression rejects retagged input
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          file=crates/noon-web/src/worker_pointer_presentation.rs
          cp "$file" "$RUNNER_TEMP/worker-original.rs"
          trap 'cp "$RUNNER_TEMP/worker-original.rs" "$file"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('crates/noon-web/src/worker_pointer_presentation.rs')
          s=p.read_text()
          s,n=re.subn(r'if self\.presented == Some\(receipt\)\s*&& receipt\.session == issued\.session\s*&& receipt\.sequence == issued\.sequence', 'if true', s)
          assert n==1
          p.write_text(s)
          PY
          if cargo test -p noon-web --all-features --lib old_collected_receipt_is_not_retagged_after_newer_presentation -- --nocapture > "$PROOF/retag-mutation.log" 2>&1; then
            echo 'retagged input unexpectedly passed' >&2
            exit 1
          fi
          grep -q 'old_collected_receipt_is_not_retagged_after_newer_presentation ... FAILED' "$PROOF/retag-mutation.log"
          cp "$RUNNER_TEMP/worker-original.rs" "$file"
          trap - EXIT
          git diff --exit-code -- "$file"
      - name: Prove collection test detects receipt capture after yielding
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          file=web/execution-worker-client.js
          cp "$file" "$RUNNER_TEMP/client-original.js"
          trap 'cp "$RUNNER_TEMP/client-original.js" "$file"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/execution-worker-client.js')
          s=p.read_text()
          before='async submitBrowserPointerInput(input) {\n    this.#requireStarted();'
          assert s.count(before)==1
          p.write_text(s.replace(before,before+'\n    await Promise.resolve();'))
          PY
          if node --test --test-name-pattern='pointer input pins receipt before readiness' web/execution-worker-client.test.mjs > "$PROOF/collection-mutation.log" 2>&1; then
            echo 'late receipt capture unexpectedly passed' >&2
            exit 1
          fi
          grep -q 'already collected input must keep frame A' "$PROOF/collection-mutation.log"
          cp "$RUNNER_TEMP/client-original.js" "$file"
          trap - EXIT
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$PROOF/tree.txt")"
          echo passed > "$PROOF/qualification.txt"
      - name: Retain browser diagnostics including failures
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/candidate/browser-smoke-artifacts" ]; then
            cp -r "$RUNNER_TEMP/candidate/browser-smoke-artifacts" proof/
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: c5-worker-presented-input-proof
          path: proof/
          if-no-files-found: error
          retention-days: 7
  publish-tested-source:
    needs: qualify
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 9b0365630e83ab5bfbe9f858946bf613c775a287
          fetch-depth: 1
      - uses: actions/download-artifact@v8
        with:
          name: c5-worker-presented-input-proof
          path: ${{ runner.temp }}/proof
      - name: Publish clean qualified source without validation ancestry
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/proof"
          test "$(cat "$proof/qualification.txt")" = passed
          git apply "$proof/formatted.patch"
          git add -A
          test "$(git write-tree)" = "$(cat "$proof/tree.txt")"
          git -c user.name='Yongkyun Shin' -c user.email='4311628+yongkyuns@users.noreply.github.com' commit -m 'C5: bind worker pointer input to its collected presentation receipt'
          git push origin HEAD:refs/heads/staging/c5-worker-presented-input-${{ github.run_id }}
          git rev-parse HEAD > "$RUNNER_TEMP/published.txt"
          git rev-parse HEAD^{tree} >> "$RUNNER_TEMP/published.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: c5-worker-presented-input-publication
          path: ${{ runner.temp }}/published.txt
          retention-days: 7
