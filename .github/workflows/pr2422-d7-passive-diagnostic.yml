name: PR 2422 d7 passive browser diagnostics (TEMP — do not merge)

on:
  push:
    branches:
      - codex/2422-d7-passive-repro
    paths:
      - ".github/workflows/pr2422-d7-passive-diagnostic.yml"
      - "scripts/playground-browser-matrix-smoke.mjs"
      - "scripts/playground-gallery-runtime-smoke.mjs"
      - "scripts/showcase-playback.mjs"

permissions:
  actions: read
  contents: read

concurrency:
  group: pr2422-d7-passive-diagnostic-${{ github.ref }}
  cancel-in-progress: true

env:
  D7_SOURCE_SHA: d7ca32fc984202efb63f92e2a356c80c28dd6314
  RUNTIME_SOURCE_SHA: f3def9bc39afe95f5ba2207d906714bae15d60f7
  RUNTIME_ARTIFACT_RUN: "41971877539"
  RUNTIME_ARTIFACT_ID: "13390743114"
  RUNTIME_ARTIFACT_ZIP_SHA256: 58af4a21546f883481f50650cf3fa631618dca9e2111e8f8a1f3d991623faa64
  RUNTIME_BUILD_ID: 2b61051ad2d9b93c169615c8861093e48e0d8001c59de6a2ca4a04d2bd771446
  RUNTIME_FILE_HASHES: >-
    {"pkg/noon_web.d.ts":"5c8769180c2ed30d2939a96b7730eb0bd0b8f9c4b2fc31369efda2081cad2f04","pkg/noon_web.js":"090b646be5af451dfb887cc46f9e6c9b0a34badbfa82162359c4532537139bbd","pkg/noon_web_bg.wasm":"cc815a7c81d1e4420af91a01a75e70cd3e75f54c0c4334334660e466be9b090a","pkg/noon_web_bg.wasm.d.ts":"a56bab0cfb22e6f94473bec0ac25f9bf4f8705eeb7c6d6e5f43673a23c1e58f1","pkg/package.json":"d6638bab30595f734a886d311ab70778ee9b80008b0270ead761a89b4bd98968","pkg/python-editor-bundle.js":"b838be1042593a85c655398e1f9b00f2e38cd3742b517f01a5691805dc9962f9","pkg/python-editor-licenses.txt":"c8c22a791214343484985cb731b39a602a17397bc71901df9222a74a0720bb55","python-worker.js":"0af62914dafeab242f4b7353eb76e5c00ceab91bfc2bfb126fc94bd8cff92a5d","python/compat-bundle.b1f9cf1e8ed590497fb66102489681a5473ddc4d9f8532c3d9fa5fac29f8b1d8.json":"3f515f9a7eefa47626756846611fbbe33ce22ea5054675278df5b94c7785caf1","runtime-build-identity.json":"80ae48f98b173ba5b179817b635767753df1b146972a978a252d509f3916677d"}

jobs:
  firefox-public-matrix:
    name: Firefox desktop-DPR2 public matrix, three fresh attempts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Download pinned cross-browser runtime
        uses: actions/download-artifact@v8
        with:
          name: playground-cross-browser-web-runtime
          path: runtime-artifact
          repository: yongkyuns/noon
          run-id: ${{ env.RUNTIME_ARTIFACT_RUN }}
          github-token: ${{ github.token }}
      - name: Verify source and exact ten-file runtime inventory
        id: runtime_verify
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path

          d7 = os.environ["D7_SOURCE_SHA"]
          runtime_source = os.environ["RUNTIME_SOURCE_SHA"]
          expected = json.loads(os.environ["RUNTIME_FILE_HASHES"])
          runtime = Path("runtime-artifact")
          files = {p.relative_to(runtime).as_posix() for p in runtime.rglob("*") if p.is_file()}
          assert files == set(expected), (sorted(files), sorted(expected))
          for name, digest in expected.items():
            actual = hashlib.sha256((runtime / name).read_bytes()).hexdigest()
            assert actual == digest, (name, actual)
          identity = json.loads((runtime / "runtime-build-identity.json").read_text())
          assert identity["sourceRevision"] == runtime_source
          assert identity["buildId"] == os.environ["RUNTIME_BUILD_ID"]

          subprocess.check_call(["git", "fetch", "--no-tags", "--depth=1", "origin", d7])
          assert subprocess.check_output(["git", "rev-parse", "FETCH_HEAD"], text=True).strip() == d7
          subprocess.check_call(["git", "fetch", "--no-tags", "--depth=1", "origin", runtime_source])
          assert subprocess.check_output(["git", "rev-parse", "FETCH_HEAD"], text=True).strip() == runtime_source
          d7_tree = subprocess.check_output(["git", "rev-parse", f"{d7}^{{tree}}"], text=True).strip()
          runtime_tree = subprocess.check_output(["git", "rev-parse", f"{runtime_source}^{{tree}}"], text=True).strip()
          assert d7_tree == runtime_tree, (d7_tree, runtime_tree)

          allowed = {
            ".github/workflows/pr2422-d7-passive-diagnostic.yml",
            "scripts/playground-browser-matrix-smoke.mjs",
            "scripts/playground-gallery-runtime-smoke.mjs",
            "scripts/showcase-playback.mjs",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only", d7, "HEAD"], text=True).splitlines())
          assert changed == allowed, (sorted(changed), sorted(allowed))
          overlay_hashes = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in changed}
          snapshot = {"runtime": expected, "identity": identity,
            "sourceTree": d7_tree, "changed": sorted(changed), "overlay": overlay_hashes}
          Path(os.environ["RUNNER_TEMP"], "noon-2422-d7-verified.json").write_text(json.dumps(snapshot, sort_keys=True))
          print("verified runtime artifact", os.environ["RUNTIME_ARTIFACT_ID"],
            "zip digest", os.environ["RUNTIME_ARTIFACT_ZIP_SHA256"], "build", identity["buildId"],
            "source tree", d7_tree, "overlay paths", sorted(changed))
          PY
          cp -R runtime-artifact/. web/
      - name: Install pinned Firefox dependencies
        timeout-minutes: 10
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1 pngjs@7.0.0
      - name: Install Firefox and system dependencies
        timeout-minutes: 15
        run: bash scripts/ci-install-playwright-browser.sh firefox
      - name: Run unchanged full Firefox public scenario three times
        env:
          NOON_PLAYGROUND_BROWSER: firefox
          NOON_PLAYGROUND_PROFILE: desktop-dpr2
          NOON_PLAYGROUND_REQUIRE_RUNTIME: "1"
        run: |
          failed=0
          for attempt in 1 2 3; do
            out="$GITHUB_WORKSPACE/browser-smoke-artifacts/pr2422-d7/firefox-desktop-dpr2/attempt-$attempt"
            mkdir -p "$out"
            cp web/runtime-build-identity.json "$out/runtime-build-identity-before.json"
            rc=0
            xvfb-run -a env NOON_PLAYGROUND_MATRIX_ARTIFACTS="$out" node scripts/playground-browser-matrix-smoke.mjs || rc=$?
            cp web/runtime-build-identity.json "$out/runtime-build-identity-after.json"
            cmp "$out/runtime-build-identity-before.json" "$out/runtime-build-identity-after.json"
            printf '{"attempt":%s,"exitCode":%s}\n' "$attempt" "$rc" > "$out/attempt-status.json"
            if [ "$rc" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Recheck all pinned inputs and runtime bytes
        if: always() && steps.runtime_verify.outcome == 'success'
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          snapshot = json.loads(Path(os.environ["RUNNER_TEMP"], "noon-2422-d7-verified.json").read_text())
          for root in (Path("runtime-artifact"), Path("web")):
            for name, digest in snapshot["runtime"].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, (str(root), name)
          assert json.loads(Path("web/runtime-build-identity.json").read_text()) == snapshot["identity"]
          for name, digest in snapshot["overlay"].items():
            assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          changed = set(subprocess.check_output(["git", "diff", "--name-only", os.environ["D7_SOURCE_SHA"], "HEAD"], text=True).splitlines())
          assert changed == set(snapshot["changed"])
          print("post-run source fixtures, diagnostic overlay, and complete runtime inventory unchanged")
          PY
      - name: Retain all Firefox attempts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr2422-d7-firefox-desktop-dpr2-attempts
          path: browser-smoke-artifacts/pr2422-d7/firefox-desktop-dpr2
          if-no-files-found: warn
          retention-days: 5

  webkit-mobile-gallery:
    name: WebKit mobile-DPR2 selected gallery, three fresh attempts
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Download pinned cross-browser runtime
        uses: actions/download-artifact@v8
        with:
          name: playground-cross-browser-web-runtime
          path: runtime-artifact
          repository: yongkyuns/noon
          run-id: ${{ env.RUNTIME_ARTIFACT_RUN }}
          github-token: ${{ github.token }}
      - name: Verify source and exact ten-file runtime inventory
        id: runtime_verify
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          d7 = os.environ["D7_SOURCE_SHA"]
          runtime_source = os.environ["RUNTIME_SOURCE_SHA"]
          expected = json.loads(os.environ["RUNTIME_FILE_HASHES"])
          runtime = Path("runtime-artifact")
          files = {p.relative_to(runtime).as_posix() for p in runtime.rglob("*") if p.is_file()}
          assert files == set(expected), (sorted(files), sorted(expected))
          for name, digest in expected.items():
            actual = hashlib.sha256((runtime / name).read_bytes()).hexdigest()
            assert actual == digest, (name, actual)
          identity = json.loads((runtime / "runtime-build-identity.json").read_text())
          assert identity["sourceRevision"] == runtime_source
          assert identity["buildId"] == os.environ["RUNTIME_BUILD_ID"]
          subprocess.check_call(["git", "fetch", "--no-tags", "--depth=1", "origin", d7])
          assert subprocess.check_output(["git", "rev-parse", "FETCH_HEAD"], text=True).strip() == d7
          subprocess.check_call(["git", "fetch", "--no-tags", "--depth=1", "origin", runtime_source])
          assert subprocess.check_output(["git", "rev-parse", "FETCH_HEAD"], text=True).strip() == runtime_source
          d7_tree = subprocess.check_output(["git", "rev-parse", f"{d7}^{{tree}}"], text=True).strip()
          runtime_tree = subprocess.check_output(["git", "rev-parse", f"{runtime_source}^{{tree}}"], text=True).strip()
          assert d7_tree == runtime_tree, (d7_tree, runtime_tree)
          allowed = {
            ".github/workflows/pr2422-d7-passive-diagnostic.yml",
            "scripts/playground-browser-matrix-smoke.mjs",
            "scripts/playground-gallery-runtime-smoke.mjs",
            "scripts/showcase-playback.mjs",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only", d7, "HEAD"], text=True).splitlines())
          assert changed == allowed, (sorted(changed), sorted(allowed))
          overlay_hashes = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in changed}
          snapshot = {"runtime": expected, "identity": identity,
            "sourceTree": d7_tree, "changed": sorted(changed), "overlay": overlay_hashes}
          Path(os.environ["RUNNER_TEMP"], "noon-2422-d7-verified.json").write_text(json.dumps(snapshot, sort_keys=True))
          print("verified runtime artifact", os.environ["RUNTIME_ARTIFACT_ID"],
