            "source tree", d7_tree, "overlay paths", sorted(changed))
          PY
          cp -R runtime-artifact/. web/
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: macOS-playwright-webkit-1.62.1
      - name: Install pinned WebKit dependencies
        timeout-minutes: 10
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1 pngjs@7.0.0
      - name: Install WebKit and system dependencies
        timeout-minutes: 15
        run: bash scripts/ci-install-playwright-browser.sh webkit
      - name: Run unchanged selected WebKit mobile baseline three times
        env:
          NOON_PLAYGROUND_BROWSER: webkit
          NOON_PLAYGROUND_PROFILE: mobile-dpr2
          NOON_SHOWCASE_PROFILE_GATE: baseline
          NOON_GALLERY_CASES: parity-moving-around
          NOON_GALLERY_CONTROL_DIAGNOSTIC: "1"
