name: Temporary 1555 web z-index caller patch

on:
  push:
    branches:
      - codex/migrate-z-index-scene

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/migrate-z-index-scene
          fetch-depth: 0
      - name: Migrate semantic execution player z-index publication
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          path = Path("crates/noon-web/src/semantic_execution_player.rs")
          text = path.read_text()
          pattern = re.compile(
              r'''(?ms)^    pub\(crate\) fn live_set_z_index\(\n.*?^    \}\n(?=\n    #\[cfg\(target_arch = "wasm32"\)\]\n    pub\(crate\) fn live_flip_layout)'''
          )
          replacement = '''    pub(crate) fn live_set_z_index(
              &mut self,
              anchor: &noon::LayoutAnchor,
              value: f64,
              family: bool,
          ) -> Result<(), AuthoringFailure> {
              let semantics = self
                  .semantics
                  .clone()
                  .ok_or("execution player has no live semantic store")?;
              noon::integration::publish_z_index(
                  &semantics,
                  self.semantic_root
                      .expect("live semantic store has one scene root"),
                  &mut self.session,
                  anchor,
                  value,
                  family,
              )
              .map_err(AuthoringFailure::from)
          }
          '''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"expected one live_set_z_index function, replaced {count}")
          if "live.set_z_index(anchor, value, family)" in text:
              raise SystemExit("LiveSession z-index setter caller remains")
          path.write_text(text)
          '@ | Set-Content -Encoding utf8 patch1555.py
          python patch1555.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item patch1555.py
          Remove-Item .github/workflows/tmp-1555-web-z-index.yml
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $names = git diff --name-only | Sort-Object
          $expected = @('.github/workflows/tmp-1555-web-z-index.yml','crates/noon-web/src/semantic_execution_player.rs') | Sort-Object
          if (Compare-Object $names $expected) { throw "unexpected changed-file surface: $names" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate web z-index publication off LiveSession"
          git push origin HEAD:codex/migrate-z-index-scene
