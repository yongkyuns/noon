name: One-off 2308 reconciled source qualification

on:
  push:
    branches: [agent/2308-reconcile-qualification-20261026]
    paths:
      - .github/ci/one-off-2308-reconcile.py
      - .github/ci/one-off-2308-gradient.patch
      - .github/ci/one-off-2308-pointer.patch
      - .github/ci/one-off-2308-fixture.patch
      - .github/ci/one-off-2308-interactions.patch
      - .github/workflows/one-off-2308-reconcile.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PIN_BASE: d6afd19037d8eb421fcbd3ddc222fa20f150922b
      PIN_PR: b3a4b7f484e607a4b14bc57e70f4947f8520ca42
      PIN_MASTER: f102a74b9bf28440f4862e799604a57c7882fa68
      EXPECTED_TREE: 5c5ac2f6a5eed63d62ca926a5585de3a7bc2a80e
      CORRECTED_TREE: 698155b1065bd9bcaf6ae0e7f08d618d70aba735
      GRADIENT_PATCH_SHA256: 1b5cb7e5bfd8538b524338747313f0c9307fbfeb550d083ded1d63e78cb4295e
      POINTER_BASE_TREE: 7e013a89ae337057da48271673c290d2409859dc
      POINTER_TREE: 8fa147e38714f16776330dde85abfb29b6feec0f
      POINTER_PATCH_SHA256: 3c8e958b916c136bae146d2382fcf26e67569574d35c1804042374011c526226
      FIXTURE_BASE_TREE: 4723c3d47c287c67498d5077d5e4b5d01012a5f5
      FIXTURE_TREE: d210c81f736d69b0660b08894502447d44d9ba01
      FIXTURE_PATCH_SHA256: 78a943fd0de8c6cd6a610ce5741e09fc2823ddfb87da7540737b7121dc7fd6aa
      INTERACTIONS_BASE_TREE: d210c81f736d69b0660b08894502447d44d9ba01
      INTERACTIONS_TREE: a9fcbdd982e1c617fea7f20ae0856d6841a2457d
      INTERACTIONS_PATCH_SHA256: 823f8e9e9082279747608ff9a1e91dbc0b9a8f4917c2e29f40b58f0d8a8d45f1
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - name: Checkout isolated helper without retained credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Reconstruct and authenticate the exact candidate
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          export RECONCILE_ROOT="$RUNNER_TEMP/noon-2308-reconcile"
          export EVIDENCE="$RUNNER_TEMP/noon-2308-reconcile-evidence"
          mkdir -p "$RECONCILE_ROOT" "$EVIDENCE"
          printf 'RECONCILE_ROOT=%s\nEVIDENCE=%s\n' "$RECONCILE_ROOT" "$EVIDENCE" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import hashlib, json, os, subprocess, sys, tarfile
          from pathlib import Path
          root = Path(os.environ['RECONCILE_ROOT'])
          out = Path(os.environ['EVIDENCE'])
          repo = Path.cwd()
          work = root / 'work'
          def git(*args, cwd=repo, check=True):
              return subprocess.run(['git', *args], cwd=cwd, check=check, capture_output=True)
          refs = {name: os.environ['PIN_' + key] for name, key in
                  [('base', 'BASE'), ('pr2308', 'PR'), ('master', 'MASTER')]}
          expected_trees = {'base':'6b284e87208f3c1b7484922bb22e24acc0c9e2fc',
                            'pr2308':'ef783beee4154f1e8270698907042859b2263614',
                            'master':'c2782f09648a4e4cc39b87daa3460bf82b6c6688'}
          fetched = git('fetch', '--no-tags', '--depth=128', 'origin', *refs.values())
          (out / 'fetch.log').write_bytes(fetched.stdout + fetched.stderr)
          manifest = {'scope':'Isolated reconciliation qualification; no remote refs written',
                      'diagnostic_commit':git('rev-parse', 'HEAD').stdout.decode().strip(), 'inputs':{}}
          for name, sha in refs.items():
              assert git('rev-parse', sha + '^{commit}').stdout.decode().strip() == sha
              tree = git('rev-parse', sha + '^{tree}').stdout.decode().strip()
              assert tree == expected_trees[name], (name, tree)
              manifest['inputs'][name] = {'commit':sha, 'tree':tree}
          assert git('merge-base', refs['pr2308'], refs['master']).stdout.decode().strip() == refs['base']
          git('worktree', 'add', '--detach', str(work), refs['pr2308'])
          git('config', 'user.name', 'Noon reconciliation qualification', cwd=work)
          git('config', 'user.email', 'qualification@example.invalid', cwd=work)
          merged = git('merge', '--no-commit', '--no-ff', refs['master'], cwd=work, check=False)
          (out / 'merge.log').write_bytes(merged.stdout + merged.stderr)
          assert merged.returncode == 1, merged.returncode
          conflicts = git('diff', '--name-only', '--diff-filter=U', cwd=work).stdout.decode().splitlines()
          expected_conflicts = ['crates/noon-compile/src/lib.rs',
            'crates/noon-compile/src/semantic_lowering/publication.rs',
            'crates/noon-compile/src/transaction_preflight.rs',
            'crates/noon-runtime/src/transient_animation.rs',
            'crates/noon-web/src/browser_pointer_input.rs',
            'crates/noon-web/src/execution_canvas.rs',
            'crates/noon/src/execution_session/interactions.rs',
            'web/execution-worker-client.js', 'web/main.js',
            'web/playground-preview-rerun.test.mjs', 'web/semantic-engine-endpoint.js']
          assert sorted(conflicts) == sorted(expected_conflicts), conflicts
          manifest['confirmed_conflicts'] = conflicts
          (out / 'original-conflicts.diff').write_bytes(git('diff', '--cc', cwd=work).stdout)
          for name in ('master', 'pr2308'):
              directory = root / name
              directory.mkdir()
              archive = root / (name + '.tar')
              git('archive', '--format=tar', '--output=' + str(archive), refs[name])
              with tarfile.open(archive) as source:
                  source.extractall(directory, filter='data')
          helper = repo / '.github/ci/one-off-2308-reconcile.py'
          manifest['helper_sha256'] = hashlib.sha256(helper.read_bytes()).hexdigest()
          transformed = subprocess.run([sys.executable, str(helper)], capture_output=True)
          (out / 'reconstruct.log').write_bytes(transformed.stdout + transformed.stderr)
          if transformed.returncode:
              print(transformed.stdout.decode(), transformed.stderr.decode())
              raise SystemExit(transformed.returncode)
          git('add', '--all', cwd=work)
          assert not git('ls-files', '-u', cwd=work).stdout
          tree = git('write-tree', cwd=work).stdout.decode().strip()
          manifest['unformatted_candidate_tree'] = tree
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          assert tree == os.environ['EXPECTED_TREE'], ('candidate differs from reviewed source', tree)
          git('diff', '--cached', '--check', refs['master'], cwd=work)
          (out / 'unformatted-vs-master.patch').write_bytes(git('diff', '--cached', '--binary', refs['master'], cwd=work).stdout)
          print(json.dumps(manifest, indent=2))
          PY
      - name: Apply authenticated gradient storage repair and regressions
        working-directory: ${{ runner.temp }}/noon-2308-reconcile/work
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          out = Path(os.environ['EVIDENCE'])
          patch = Path(os.environ['GITHUB_WORKSPACE']) / '.github/ci/one-off-2308-gradient.patch'
          payload = patch.read_bytes()
          digest = hashlib.sha256(payload).hexdigest()
          assert digest == os.environ['GRADIENT_PATCH_SHA256'], digest
          subprocess.run(['git', 'apply', '--check', '--index', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check', os.environ['PIN_MASTER']], check=True)
          tree = subprocess.check_output(['git', 'write-tree']).decode().strip()
          assert tree == os.environ['CORRECTED_TREE'], tree
          manifest = json.loads((out / 'manifest.json').read_text())
          manifest['corrected_unformatted_tree'] = tree
          manifest['gradient_patch_sha256'] = digest
          manifest['gradient_repair_scope'] = 'One FrameObjectState initializer and two new storage regressions; no existing assertions removed'
          (out / 'gradient-repair.patch').write_bytes(payload)
          (out / 'corrected-unformatted-vs-master.patch').write_bytes(subprocess.check_output(
              ['git', 'diff', '--cached', '--binary', os.environ['PIN_MASTER']]))
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print('Authenticated corrected unformatted tree:', tree)
          PY
      - name: Install repository-pinned Rust and WASM target
        working-directory: ${{ runner.temp }}/noon-2308-reconcile/work
        run: |
          set -euo pipefail
          rustup install
          rustup show active-toolchain
          rustc --version --verbose | tee "$EVIDENCE/rust-version.log"
      - name: Restore Cargo sources
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-reconcile-2308
          restore-keys: ${{ runner.os }}-cargo-sources-
      - name: Use read-only compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Install native audio dependencies
        working-directory: ${{ runner.temp }}/noon-2308-reconcile/work
        run: bash scripts/ci-install-reference-deps.sh libasound2-dev pkg-config
      - name: Authenticate failed source tree and apply pointer-owner repair
        working-directory: ${{ runner.temp }}/noon-2308-reconcile/work
        run: |
          set -euo pipefail
          cargo fmt --all 2>&1 | tee "$EVIDENCE/pointer-baseline-format.log"
          git add --all
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          out = Path(os.environ['EVIDENCE'])
          baseline = subprocess.check_output(['git', 'write-tree']).decode().strip()
          assert baseline == os.environ['POINTER_BASE_TREE'], baseline
          patch = Path(os.environ['GITHUB_WORKSPACE']) / '.github/ci/one-off-2308-pointer.patch'
          payload = patch.read_bytes()
          digest = hashlib.sha256(payload).hexdigest()
          assert digest == os.environ['POINTER_PATCH_SHA256'], digest
          subprocess.run(['git', 'apply', '--check', '--index', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check', os.environ['PIN_MASTER']], check=True)
          tree = subprocess.check_output(['git', 'write-tree']).decode().strip()
          assert tree == os.environ['POINTER_TREE'], tree
          manifest = json.loads((out / 'manifest.json').read_text())
          manifest['pointer_baseline_tree'] = baseline
          manifest['pointer_corrected_unformatted_tree'] = tree
          manifest['pointer_patch_sha256'] = digest
          manifest['pointer_repair_scope'] = 'Reuse existing owner adapters and source-free presentation seam; preserve 78 existing tests and add missing-owner receipt regression'
          (out / 'pointer-repair.patch').write_bytes(payload)
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print('Authenticated pointer-owner candidate tree:', tree)
          PY
      - name: Authenticate previous tested tree and repair the stale test fixture
        working-directory: ${{ runner.temp }}/noon-2308-reconcile/work
        run: |
          set -euo pipefail
          cargo fmt --all 2>&1 | tee "$EVIDENCE/fixture-baseline-format.log"
          git add --all
          git diff --cached --binary "$POINTER_TREE" > "$EVIDENCE/fixture-baseline-formatter.patch"
          python3 - <<'PYFIX'
          import hashlib, json, os, subprocess
          from pathlib import Path
          out = Path(os.environ['EVIDENCE'])
          baseline = subprocess.check_output(['git', 'write-tree']).decode().strip()
          assert baseline == os.environ['FIXTURE_BASE_TREE'], baseline
          patch = Path(os.environ['GITHUB_WORKSPACE']) / '.github/ci/one-off-2308-fixture.patch'
          payload = patch.read_bytes()
          digest = hashlib.sha256(payload).hexdigest()
          assert digest == os.environ['FIXTURE_PATCH_SHA256'], digest
          subprocess.run(['git', 'apply', '--check', '--index', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check', os.environ['PIN_MASTER']], check=True)
          tree = subprocess.check_output(['git', 'write-tree']).decode().strip()
          assert tree == os.environ['FIXTURE_TREE'], tree
          manifest = json.loads((out / 'manifest.json').read_text())
          manifest['fixture_baseline_tree'] = baseline
          manifest['fixture_corrected_unformatted_tree'] = tree
          manifest['fixture_patch_sha256'] = digest
          manifest['fixture_repair_scope'] = 'Initialize fill_gradient: None in the rejected-binding-edit test and remove one unused cfg(test) import; all five existing fixture tests and assertions retained'
          (out / 'fixture-repair.patch').write_bytes(payload)
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print('Authenticated fixture-repair candidate tree:', tree)
          PYFIX
      - name: Authenticate and repair historical prefix-interaction fixtures
        working-directory: ${{ runner.temp }}/noon-2308-reconcile/work
        run: |
          set -euo pipefail
          python3 - <<'PYINTERACTIONS'
          import hashlib, json, os, subprocess
          from pathlib import Path
          out = Path(os.environ['EVIDENCE'])
          baseline = subprocess.check_output(['git', 'write-tree']).decode().strip()
          assert baseline == os.environ['INTERACTIONS_BASE_TREE'], baseline
          patch = Path(os.environ['GITHUB_WORKSPACE']) / '.github/ci/one-off-2308-interactions.patch'
          payload = patch.read_bytes()
          digest = hashlib.sha256(payload).hexdigest()
          assert digest == os.environ['INTERACTIONS_PATCH_SHA256'], digest
          subprocess.run(['git', 'apply', '--check', '--index', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check', os.environ['PIN_MASTER']], check=True)
          tree = subprocess.check_output(['git', 'write-tree']).decode().strip()
          assert tree == os.environ['INTERACTIONS_TREE'], tree
          manifest = json.loads((out / 'manifest.json').read_text())
          manifest['interactions_baseline_tree'] = baseline
          manifest['interactions_corrected_unformatted_tree'] = tree
          manifest['interactions_patch_sha256'] = digest
          manifest['interactions_repair_scope'] = 'Add missing fill_gradient and convert TextResource test Rect into DRect; preserve all 9 interaction regressions'
          (out / 'interactions-repair.patch').write_bytes(payload)
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print('Authenticated prefix-interactions fixture candidate:', tree)
          PYINTERACTIONS
      - name: Format isolated candidate and freeze its actual tested source
        id: formatted
        working-directory: ${{ runner.temp }}/noon-2308-reconcile/work
        run: |
          set -euo pipefail
          cargo fmt --all 2>&1 | tee "$EVIDENCE/format.log"
          git add --all
          git diff --cached --binary "$INTERACTIONS_TREE" > "$EVIDENCE/formatter.patch"
          git diff --cached --check "$PIN_MASTER"
          git commit -m 'Reconcile prepared playback and repair prefix interaction fixtures for isolated qualification'
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          out = Path(os.environ['EVIDENCE'])
          def git(*args): return subprocess.check_output(['git', *args])
          manifest = json.loads((out / 'manifest.json').read_text())
          sha = git('rev-parse', 'HEAD').decode().strip()
          parents = git('show', '-s', '--format=%P', 'HEAD').decode().split()
          assert parents == [os.environ['PIN_PR'], os.environ['PIN_MASTER']], parents
          manifest['tested_candidate'] = {'commit':sha, 'tree':git('rev-parse', 'HEAD^{tree}').decode().strip(),
                                         'parents':parents, 'published':False}
          for label, base in [('master', os.environ['PIN_MASTER']), ('pr2308', os.environ['PIN_PR'])]:
              (out / ('candidate-vs-' + label + '.patch')).write_bytes(git('diff', '--binary', base, 'HEAD'))
          source = out / 'candidate-source.tar.gz'
          git('archive', '--format=tar.gz', '--output=' + str(source), 'HEAD')
          manifest['candidate_archive_sha256'] = hashlib.sha256(source.read_bytes()).hexdigest()
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest['tested_candidate'], indent=2))
          PY
      - name: Qualify gradient history and reject a cleared-gradient negative control
        id: gradient
        if: ${{ !cancelled() && steps.formatted.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/noon-2308-reconcile/work
        env:
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          trap 'code=$?; echo "$code" > "$EVIDENCE/gradient.exit"; exit "$code"' EXIT
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          out = Path(os.environ['EVIDENCE'])
          path = Path('crates/noon-runtime/src/replay/prefix/storage.rs')
          original = path.read_bytes()
          command = ['cargo', 'test', '--locked', '-p', 'noon-runtime', '--features', 'prepared-prefix', '--lib']
          group = 'replay::prefix::storage::tests::'
          case = group + 'prefix_storage_materializes_gradient_and_solid_rows_without_publishing_the_future'
          outcomes = {}
          def run(label, selector, exact=False):
              args = command + [selector, '--', '--test-threads=1'] + (['--exact'] if exact else [])
              result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              (out / (label + '.log')).write_bytes(result.stdout)
              outcomes[label] = result.returncode
              text = result.stdout.decode(errors='replace')
              print(text, flush=True)
              return result.returncode, text
          try:
              code, text = run('gradient-positive', group)
              assert code == 0 and 'test result: ok. 2 passed; 0 failed' in text, 'gradient positive tests did not both pass'
              needle = b'fill_gradient: object.fill_gradient.clone(),'
              assert original.count(needle) == 1
              path.write_bytes(original.replace(needle, b'fill_gradient: None,', 1))
              try:
                  code, text = run('gradient-cleared-negative-control', case, True)
                  assert code != 0 and 'error[E' not in text, 'negative control must fail by assertion, not compilation'
                  assert re.search(r'test ' + re.escape(case) + r' \.\.\. FAILED', text), 'expected exact regression did not fail'
                  assert 'test result: FAILED. 0 passed; 1 failed' in text
              finally:
                  path.write_bytes(original)
              code, text = run('gradient-restored', group)
              assert code == 0 and 'test result: ok. 2 passed; 0 failed' in text, 'restored gradient tests failed'
          finally:
              path.write_bytes(original)
              (out / 'gradient-outcomes.json').write_text(json.dumps(outcomes, indent=2) + '\n')
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          PY
      - name: Qualify source-free history and paired pointer presentation
        if: ${{ !cancelled() && steps.formatted.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/noon-2308-reconcile/work
        env:
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          trap 'code=$?; echo "$code" > "$EVIDENCE/pointer-tests.exit"; exit "$code"' EXIT
          cargo test --locked -p noon --lib historical_pointer_identity_ 2>&1 | tee "$EVIDENCE/pointer-history-default.log"
          cargo test --locked -p noon --features prepared-prefix --lib historical_pointer_identity_ 2>&1 | tee "$EVIDENCE/pointer-history-prepared.log"
          cargo test --locked -p noon-web --all-features --lib direct_pointer_presentation::tests 2>&1 | tee "$EVIDENCE/pointer-direct.log"
          cargo test --locked -p noon-web --all-features --lib semantic_execution_player::pointer_input::presentation_tests 2>&1 | tee "$EVIDENCE/pointer-worker.log"
          grep -F 'pointer_receipt_lifecycle_requires_the_existing_semantic_owner ... ok' "$EVIDENCE/pointer-worker.log"
      - name: Execute all prefix binding regressions including rejected-edit rollback
        if: ${{ !cancelled() && steps.formatted.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/noon-2308-reconcile/work
        env:
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          trap 'code=$?; echo "$code" > "$EVIDENCE/prefix-bindings.exit"; exit "$code"' EXIT
          cargo test --locked -p noon-runtime --features prepared-prefix --test prefix_bindings 2>&1 | tee "$EVIDENCE/prefix-bindings.log"
          grep -F 'rejected_binding_edits_preserve_history_and_an_active_effect ... ok' "$EVIDENCE/prefix-bindings.log"
          grep -F 'test result: ok. 5 passed; 0 failed; 0 ignored' "$EVIDENCE/prefix-bindings.log"
      - name: Execute all nine prepared prefix interaction regressions
        if: ${{ !cancelled() && steps.formatted.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/noon-2308-reconcile/work
        env:
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          trap 'code=$?; echo "$code" > "$EVIDENCE/interactions-tests.exit"; exit "$code"' EXIT
          cargo test --locked -p noon-runtime --features prepared-prefix --test prefix_interactions -- --test-threads=1 2>&1 | tee "$EVIDENCE/interactions-tests.log"
          grep -F 'test result: ok. 9 passed; 0 failed; 0 ignored' "$EVIDENCE/interactions-tests.log"
      - name: Run canonical fast gate without changing assertions
        if: ${{ !cancelled() && steps.formatted.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/noon-2308-reconcile/work
        env:
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          trap 'code=$?; echo "$code" > "$EVIDENCE/fast.exit"; exit "$code"' EXIT
          bash scripts/check.sh fast "$PIN_MASTER" 2>&1 | tee "$EVIDENCE/fast.log"
      - name: Run prepared input and historical binding regressions
        if: ${{ !cancelled() && steps.formatted.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/noon-2308-reconcile/work
        env:
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          trap 'code=$?; echo "$code" > "$EVIDENCE/prepared-input.exit"; exit "$code"' EXIT
          cargo test --locked -p noon --features prepared-prefix --test prepared_prefix_bindings --test prepared_prefix_identity --test prepared_prefix_interactions --test prepared_prefix_lifecycle 2>&1 | tee "$EVIDENCE/prepared-input.log"
      - name: Check prepared WASM with and without renderer
        if: ${{ !cancelled() && steps.formatted.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/noon-2308-reconcile/work
        env:
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          trap 'code=$?; echo "$code" > "$EVIDENCE/wasm.exit"; exit "$code"' EXIT
          cargo check --locked -p noon-web --features prepared-prefix --target wasm32-unknown-unknown 2>&1 | tee "$EVIDENCE/wasm-renderer.log"
          cargo check --locked -p noon-web --no-default-features --features prepared-prefix --target wasm32-unknown-unknown 2>&1 | tee "$EVIDENCE/wasm-rendererless.log"
      - name: Run complete web preflight without claiming browser execution
        if: ${{ !cancelled() && steps.formatted.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/noon-2308-reconcile/work
        env:
          NOON_WEB_PREFLIGHT_ONLY: "1"
        run: |
          set -euo pipefail
          trap 'code=$?; echo "$code" > "$EVIDENCE/web-preflight.exit"; exit "$code"' EXIT
          node --version | tee "$EVIDENCE/node-version.log"
          bash scripts/build-web-demo.sh 2>&1 | tee "$EVIDENCE/web-preflight.log"
      - name: Verify final tracked source and preserve exact outcomes
        if: ${{ always() && steps.formatted.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/noon-2308-reconcile/work
        run: |
          set -euo pipefail
          git status --porcelain=v1 > "$EVIDENCE/final-status.txt"
          git diff --exit-code
          git diff --cached --exit-code
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          out = Path(os.environ['EVIDENCE'])
          manifest = json.loads((out / 'manifest.json').read_text())
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}']).decode().strip() == manifest['tested_candidate']['tree']
          manifest['command_exit_codes'] = {name: int(path.read_text()) if path.exists() else None
              for name in ('gradient', 'pointer-tests', 'prefix-bindings', 'interactions-tests', 'fast', 'prepared-input', 'wasm', 'web-preflight')
              for path in [out / (name + '.exit')]}
          manifest['tracked_source_unchanged'] = True
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest['command_exit_codes'], indent=2))
          PY
      - name: Preserve source-bound candidate and all diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: noon-2308-reconciled-source-qualification
          path: ${{ runner.temp }}/noon-2308-reconcile-evidence
          if-no-files-found: error
          retention-days: 3
