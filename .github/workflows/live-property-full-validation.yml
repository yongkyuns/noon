name: Live property exact-head full validation
on:
  push:
    branches: [codex/1345-full-validation]
permissions:
  contents: read
  actions: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: 'true'
  SCCACHE_GHA_RW_MODE: READ_ONLY
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 166b166f25e27a13d2d940f8ac802d0e59fc2f8f
          fetch-depth: 0
          persist-credentials: false
      - name: Retain exact source identity
        run: |
          test "$(git rev-parse HEAD)" = 166b166f25e27a13d2d940f8ac802d0e59fc2f8f
          test "$(git rev-parse HEAD^{tree})" = b22961399f3f61cc0fe6e9f142ea5c9cef361198
          mkdir -p "$RUNNER_TEMP/evidence"
          { git rev-parse HEAD HEAD^{tree}; rustup show; python3 --version; node --version; } > "$RUNNER_TEMP/evidence/environment.txt"
      - uses: actions/download-artifact@v8
        with:
          name: r3-live-property-qualification
          run-id: 34361452592
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/input
      - name: Reuse qualified dependency resolution
        run: |
          test "$(cat "$RUNNER_TEMP/input/final-head.txt")" = 166b166f25e27a13d2d940f8ac802d0e59fc2f8f
          cp "$RUNNER_TEMP/input/Cargo.lock" Cargo.lock
          sha256sum Cargo.lock > "$RUNNER_TEMP/evidence/lock-before.txt"
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            Linux-cargo-sources-
            provider-sources-Linux-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Run the repository full gate and default optimized release build
        run: |
          bash scripts/check.sh full ef2e4a894a7795471795e62351c8241db59af4ce > "$RUNNER_TEMP/evidence/full.log" 2>&1 || { tail -150 "$RUNNER_TEMP/evidence/full.log"; exit 1; }
          git diff --exit-code
          sha256sum Cargo.lock > "$RUNNER_TEMP/evidence/lock-after.txt"
          diff "$RUNNER_TEMP/evidence/lock-before.txt" "$RUNNER_TEMP/evidence/lock-after.txt"
          sha256sum web/pkg/noon_web_bg.wasm web/pkg/noon_web.js > "$RUNNER_TEMP/evidence/release-package.txt"
          tail -25 "$RUNNER_TEMP/evidence/full.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-properties-full-release
          path: |
            ${{ runner.temp }}/evidence
            Cargo.lock
          retention-days: 3
          if-no-files-found: error
