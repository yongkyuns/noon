/// One identity-free derived analytic occurrence at the genuine execution-worker
/// to render-worker boundary. `anchor` is an existing stable source object used
/// only to recover renderer-local painter placement; it is not the identity of
/// this transient occurrence.
#[derive(Clone, Debug, PartialEq, Serialize, Deserialize)]
pub struct RetainedDerivedDisplayObject {
    pub anchor: ObjectId,
    pub occurrence_index: u32,
    pub z_index: f32,
    pub geometry: GeometryRef,
    pub transform: Transform2D,
    pub style: Style,
    pub appearance: f32,
    pub presence: bool,
    pub reveal: f32,
    pub morph: f32,
    #[serde(default, skip_serializing_if = "Option::is_none")]
    pub render_geometry: Option<GeometryRef>,
    #[serde(default, skip_serializing_if = "Option::is_none")]
    pub render_transform: Option<Transform2D>,
}

impl RetainedDerivedDisplayObject {
    fn from_runtime(
        frame: &FrameState,
        object: &DerivedDisplayObject,
    ) -> Result<Self, RetainedFamilyExecutionTransportError> {
        let anchor_index = object.anchor_object_index() as usize;
        let anchor = frame.objects.get(anchor_index).ok_or(
            RetainedFamilyExecutionTransportError::InvalidDerivedAnchorIndex(anchor_index),
        )?;
        let state = object.state();
        let geometry = match &state.content {
            ObjectContentRef::Geometry(geometry) => geometry.clone(),
            ObjectContentRef::Text(_) => {
                return Err(RetainedFamilyExecutionTransportError::UnsupportedDerivedContent(
                    object.occurrence_index(),
                ));
            }
        };
        if !matches!(
            geometry,
            GeometryRef::Circle { .. } | GeometryRef::Rectangle { .. } | GeometryRef::Line { .. }
        ) || state.render_geometry.as_deref().is_some_and(|geometry| {
            !matches!(
                geometry,
                GeometryRef::Circle { .. }
                    | GeometryRef::Rectangle { .. }
                    | GeometryRef::Line { .. }
            )
        }) {
            return Err(RetainedFamilyExecutionTransportError::UnsupportedDerivedGeometry(
                object.occurrence_index(),
            ));
        }
        Ok(Self {
            anchor: anchor.id,
            occurrence_index: object.occurrence_index(),
            z_index: state.z_index,
            geometry,
            transform: state.transform,
            style: state.style,
            appearance: state.appearance,
            presence: state.presence,
            reveal: state.reveal,
            morph: state.morph,
            render_geometry: state.render_geometry.as_deref().cloned(),
            render_transform: state.render_transform,
        })
    }

    fn install(&self, anchor_object_index: u32) -> DerivedDisplayObject {
        DerivedDisplayObject::new(
            anchor_object_index,
            self.occurrence_index,
            DerivedDisplayObjectState {
                z_index: self.z_index,
                content: ObjectContentRef::Geometry(self.geometry.clone()),
                text_bounds: None,
                transform: self.transform,
                style: self.style,
                appearance: self.appearance,
                presence: self.presence,
                reveal: self.reveal,
                morph: self.morph,
                render_geometry: self.render_geometry.clone().map(Arc::new),
                render_transform: self.render_transform,
            },
        )
    }
}
