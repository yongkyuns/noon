name: B3 derived worker transport patch

on:
  push:
    branches:
      - codex/b3-derived-display-worker-transport

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch retained worker derived-display transport
        shell: bash
        run: |
          python3 - <<'PY'
