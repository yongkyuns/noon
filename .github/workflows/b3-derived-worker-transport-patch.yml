#[cfg(test)]
mod derived_display_transport_regression {
    use noon_core::{GeometryRef, ObjectContentRef, ObjectId, Style, Transform2D};
    use noon_runtime::{DerivedDisplayObject, DerivedDisplayObjectState, FrameObjectState, FrameState};

    use super::*;

    #[test]
    fn transient_analytic_occurrence_round_trips_with_only_real_anchor_identity() {
        let frame = FrameState {
            time: 0.5,
            objects: vec![FrameObjectState {
                id: ObjectId::new(41),
                z_index: 0.0,
                content: ObjectContentRef::Geometry(GeometryRef::circle(1.0)),
                text_bounds: None,
                transform: Transform2D::IDENTITY,
                style: Style::default(),
                appearance: 1.0,
            }],
            presences: vec![true],
            reveals: vec![1.0],
            morphs: vec![0.0],
            render_geometries: vec![None],
            render_transforms: vec![None],
            family_animations: vec![None],
            family_animation_plan_indices: vec![None],
        };
        let derived = DerivedDisplayObject::new(
            0,
            7,
            DerivedDisplayObjectState {
                z_index: 0.0,
                content: ObjectContentRef::Geometry(GeometryRef::circle(0.5)),
                text_bounds: None,
                transform: Transform2D::IDENTITY,
                style: Style::default(),
                appearance: 0.5,
                presence: true,
                reveal: 1.0,
                morph: 0.0,
                render_geometry: None,
                render_transform: None,
            },
        );
        let wire = RetainedDerivedDisplayObject::from_runtime(&frame, &derived).unwrap();
        assert_eq!(wire.anchor, ObjectId::new(41));
        assert_eq!(wire.occurrence_index, 7);
        let installed = wire.install(0);
        assert_eq!(installed.anchor_object_index(), 0);
        assert_eq!(installed.occurrence_index(), 7);
        assert_eq!(installed.state().appearance, 0.5);
    }
}
'''
