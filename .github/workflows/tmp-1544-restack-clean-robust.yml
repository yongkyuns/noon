name: Temporary 1544 robust restack cleanup

on:
  push:
    branches:
      - codex/1533-scene-family-layout-restacked

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/1533-scene-family-layout-restacked
          fetch-depth: 0
      - name: Remove dead delegate and all temporary cleanup workflows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          path = Path("crates/noon/src/live_session/family_layout.rs")
          lines = path.read_text().splitlines(keepends=True)
          expected = [
              "fn family_layout_members(",
              "&self,",
              "family: &MobjectFamily,",
              ") -> Result<(Vec<noon_core::SemanticNodeId>, Option<Bounds2D64>), LiveSessionError> {",
              "self.family_layout_measure(family, false)",
              "}",
          ]
          matches = []
          for i in range(len(lines) - len(expected) + 1):
              if [line.strip() for line in lines[i:i + len(expected)]] == expected:
                  matches.append(i)
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one dead delegate, found {len(matches)}")
          i = matches[0]
          end = i + len(expected)
          if end < len(lines) and lines[end].strip() == "":
              end += 1
          del lines[i:end]
          text = "".join(lines)
          if "fn family_layout_members(" in text:
              raise SystemExit("dead delegate still present after cleanup")
          path.write_text(text)
          '@ | Set-Content -Encoding utf8 patch1544.py
          python patch1544.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item patch1544.py
          Remove-Item .github/workflows/tmp-1544-restack-clean.yml -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/tmp-1544-restack-clean-windows.yml -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/tmp-1544-restack-clean-robust.yml -ErrorAction SilentlyContinue
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $names = @(git diff --name-only)
          if ($names -notcontains 'crates/noon/src/live_session/family_layout.rs') { throw 'live family layout file was not changed' }
          if ($names | Where-Object { $_ -like '.github/workflows/tmp-1544-restack-clean*' } | Measure-Object | Select-Object -ExpandProperty Count) {
              # Temporary workflows must appear only as deletions in the diff; verify none remain on disk.
          }
          if (Test-Path .github/workflows/tmp-1544-restack-clean.yml) { throw 'ubuntu temp workflow still exists' }
          if (Test-Path .github/workflows/tmp-1544-restack-clean-windows.yml) { throw 'windows temp workflow still exists' }
          if (Test-Path .github/workflows/tmp-1544-restack-clean-robust.yml) { throw 'robust temp workflow still exists' }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove dead family layout delegate"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:codex/1533-scene-family-layout-restacked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
