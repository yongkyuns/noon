# Temporary, branch-scoped source capture. Remove this workflow before merge.
# Temporarily registered as capture-staging; leave strict workflow inventory enabled.
# No synthetic thumbnails: stage only completed renderer frames and their
# source/build provenance from the existing curated showcase capture harness.
name: Code Blocks showcase poster staging
on:
  push:
    branches:
      - feat/code-block-showcase
    paths:
      - 'web/python/examples/showcase_code_blocks.py'
      - 'web/python/examples/noon_showcase_manifest.json'
      - '.github/workflows/code-block-showcase-capture.yml'
permissions:
  contents: write

jobs:
  capture:
    if: github.repository == 'yongkyuns/noon' && github.ref == 'refs/heads/feat/code-block-showcase'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      NOON_SHOWCASE_BACKEND: webgl
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Validate source and catalog
        run: |
          node --test web/showcase-gallery.test.mjs scripts/showcase-capture.test.mjs
          python3 -m compileall -q web/python/examples/showcase_code_blocks.py
      - name: Build exact browser runtime
        uses: ./.github/actions/dev-wasm-build
        with:
          preflight: 'true'
      - name: Install the pinned browser renderer
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Capture every exact showcase and prepare evidence
        run: node scripts/showcase-capture.mjs
      - name: Stage only generated PNGs and evidence on this feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/thumbnails/showcase
          if git diff --cached --quiet; then
            echo 'No changed capture assets'
            exit 0
          fi
          git commit -m 'Capture Code Blocks gallery preview with Noon renderer'
          git push origin HEAD:feat/code-block-showcase
      - name: Keep rendered capture evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-blocks-gallery-capture
          path: browser-smoke-artifacts/showcase/webgl
          if-no-files-found: warn
          retention-days: 3
