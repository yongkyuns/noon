name: One-off seek storage repair qualification
on:
  push:
    branches: [agent/qualify-seek-storage-20261026]
permissions:
  contents: write
concurrency:
  group: one-off-seek-storage-20261026
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: bd041cdb4632ae3d8fdbbf684e931e69ba3cbed3
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify pinned source and install repository Rust
        run: |
          test "$(git rev-parse HEAD^)" = "$BASE"
          mkdir -p seek-storage-evidence
          git rev-parse HEAD > seek-storage-evidence/qualification-sha.txt
          rustup install
          rustc --version --verbose | tee seek-storage-evidence/rust-version.txt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - name: Reproduce the two existing capacity failures
        shell: bash
        run: |
          set +e
          cargo test --locked -p noon-runtime --features prepared-prefix --lib replay::prefix::object_budget_tests > seek-storage-evidence/baseline.log 2>&1
          result=$?
          set -e
          cat seek-storage-evidence/baseline.log
          test "$result" = 101
          grep -F '9 passed; 2 failed;' seek-storage-evidence/baseline.log
          grep -F 'object_vector_bootstrap_reserves_inactive_rows_for_historical_order ... FAILED' seek-storage-evidence/baseline.log
          grep -F 'object_vector_receiver_rejects_before_requesting_growth_and_preserves_pending_batch ... FAILED' seek-storage-evidence/baseline.log
      - name: Apply the guarded shared repair and format with pinned Rust
        run: |
          python3 .github/ci/one-off-seek-storage.py
          cargo fmt --all
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert changed == ['crates/noon-runtime/src/lib.rs'], changed
          PY
      - name: Qualify ordinary and prepared runtime plus compiler accounting
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p noon-runtime --lib 2>&1 | tee seek-storage-evidence/runtime-default.log
          cargo test --locked -p noon-runtime --features prepared-prefix --lib 2>&1 | tee seek-storage-evidence/runtime-prepared.log
          cargo test --locked -p noon-compile --features prepared-prefix --lib replay_revision::prefix::storage 2>&1 | tee seek-storage-evidence/compiler-accounting.log
          cargo clippy --locked -p noon-runtime --all-targets --features prepared-prefix -- -D warnings 2>&1 | tee seek-storage-evidence/clippy.log
          cargo fmt --all -- --check
      - name: Prove the regressions reject buffer replacement and stale membership
        run: |
          python3 - <<'PYM'
          import json, subprocess
          from pathlib import Path
          path = Path('crates/noon-runtime/src/lib.rs')
          fixed = path.read_text()
          mutations = [
              ('replace-frame', '        reset_base_frame(&self.compiled, &mut self.frame, time);', '        self.frame = base_frame(&self.compiled, time);'),
              ('replace-order', '        self.painter_order.clear();\n        self.painter_order\n            .extend_from_slice(self.compiled.painter_order());', '        self.painter_order = self.compiled.painter_order().to_vec();'),
              ('inactive-membership', 'object.live && initial_channel_bool(compiled, index, Property::Presence, true)', 'initial_channel_bool(compiled, index, Property::Presence, true)'),
          ]
          results = []
          try:
              for name, old, new in mutations:
                  if name == 'replace-order' and fixed.count(old) == 0:
                      old = '        self.painter_order.clear();\n        self.painter_order.extend_from_slice(self.compiled.painter_order());'
                  assert fixed.count(old) == 1, (name, fixed.count(old))
                  path.write_text(fixed.replace(old, new, 1))
                  run = subprocess.run(['cargo', 'test', '--locked', '-p', 'noon-runtime', '--features', 'prepared-prefix', '--lib', 'seek_storage_tests'], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  Path(f'seek-storage-evidence/mutation-{name}.log').write_text(run.stdout)
                  assert run.returncode == 101 and 'test result: FAILED.' in run.stdout and 'assertion' in run.stdout, (name, run.returncode, run.stdout[-4000:])
                  results.append({'mutation': name, 'detected_by_assertion': True})
          finally:
              path.write_text(fixed)
          Path('seek-storage-evidence/mutations.json').write_text(json.dumps(results, indent=2))
          PYM
          cargo test --locked -p noon-runtime --features prepared-prefix --lib seek_storage_tests
      - name: Check the shared runtime on WASM
        shell: bash
        run: |
          set -o pipefail
          rustup target add wasm32-unknown-unknown
          cargo check --locked -p noon-runtime --features prepared-prefix --target wasm32-unknown-unknown 2>&1 | tee seek-storage-evidence/wasm-check.log
      - name: Publish only the two repaired Rust files to an isolated result branch
        shell: bash
        run: |
          set -euo pipefail
          export GIT_INDEX_FILE="$RUNNER_TEMP/seek-storage-clean-index"
          git read-tree "$BASE"
          git add crates/noon-runtime/src/lib.rs crates/noon-runtime/src/seek_storage_tests.rs
          git diff --cached --check "$BASE"
          git diff --cached --stat "$BASE" | tee seek-storage-evidence/candidate-stat.txt
          git diff --cached "$BASE" > seek-storage-evidence/candidate.patch
          test "$(git diff --cached --name-only "$BASE" | wc -l)" = 2
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME='Noon CI'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          candidate=$(git commit-tree "$tree" -p "$BASE" <<'MSG'
          fix(runtime): preserve reserved frame storage through shared seek (#2211)

          Reinitialize the existing frame vectors and painter-order buffer instead
          of replacing their backing stores. Construction and all seek entrypoints
          share the same initialization path and retain the normal evaluator.
          Keep all existing capacity assertions and add independent old-initializer,
          ordinary seek, and prepared suffix-after-rewind storage regressions.

          Qualified with repository-pinned Rust on the isolated qualification branch:
          default/prepared runtime library tests, compiler accounting, Clippy,
          rustfmt and a wasm32 shared-runtime check. Full PR/browser CI is separate.
          No playback-default changes or new memory-budget category.
          MSG
          )
          printf '%s\n' "$candidate" | tee seek-storage-evidence/candidate-sha.txt
          git push origin "$candidate:refs/heads/experimental/playback-seek-storage-repair-20261026"
          mkdir -p seek-storage-evidence/source
          cp crates/noon-runtime/src/lib.rs crates/noon-runtime/src/seek_storage_tests.rs seek-storage-evidence/source/
      - name: Retain failure or success evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: one-off-seek-storage-${{ github.run_id }}
          path: seek-storage-evidence
          retention-days: 3
