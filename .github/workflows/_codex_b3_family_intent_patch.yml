name: codex b3 family transform intent patch

on:
  push:
    branches: [codex/b3-family-transform-intent]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/b3-family-transform-intent
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply bounded family-transform intent patch
