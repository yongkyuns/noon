name: codex b3 family transform intent patch

on:
  push:
    branches: [codex/b3-family-transform-intent]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/b3-family-transform-intent
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply core family-transform intent patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def r1(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected one match, found {n}: {old[:100]!r}")
              p.write_text(s.replace(old, new, 1))

          sem = "crates/noon-core/src/semantic_store/semantic_animations.rs"
          r1(sem,
          '''        complete_priority: bool,
              },
              /// Temporarily scale and recolor one object around a shared activation center.
          ''',
          '''        complete_priority: bool,
              },
              /// Transform one semantic family toward another family through compiler-derived
              /// visual correspondence. Family identity/topology remain authored scene state;
              /// padding occurrences never receive semantic identities.
              FamilyTransformTo {
                  source: SemanticNodeId,
                  target_state: SemanticNodeId,
              },
              /// Temporarily scale and recolor one object around a shared activation center.
          ''')
          r1(sem,
          '''        match self {
                  Self::ObjectPropertyTrack { target, .. }
          ''',
          '''        match self {
                  Self::FamilyTransformTo { source, .. } => Some(*source),
                  Self::ObjectPropertyTrack { target, .. }
          ''')
          r1(sem,
          '''        match self {
                  Self::TransformTo { target_state, .. } => Some(*target_state),
                  Self::ObjectPropertyTrack { .. }
          ''',
          '''        match self {
                  Self::TransformTo { target_state, .. }
                  | Self::FamilyTransformTo { target_state, .. } => Some(*target_state),
                  Self::ObjectPropertyTrack { .. }
          ''')
          p = Path(sem)
          s = p.read_text()
          old = '''            Self::ObjectPropertyTrack { .. }
                  | Self::TransformTo { .. }
          '''
          n = s.count(old)
          if n != 2:
              raise SystemExit(f"{sem}: expected two leaf-list matches, found {n}")
          s = s.replace(old, '''            Self::ObjectPropertyTrack { .. }
                  | Self::TransformTo { .. }
                  | Self::FamilyTransformTo { .. }
          ''')
          p.write_text(s)
          r1(sem,
          '''    pub const fn composition_kind(&self) -> Option<SemanticAnimationCompositionKind> {
          ''',
          '''    /// Family endpoints for a semantic family Transform, when this declaration owns one.
              pub const fn family_transform(&self) -> Option<(SemanticNodeId, SemanticNodeId)> {
                  match self {
                      Self::FamilyTransformTo {
                          source,
                          target_state,
                      } => Some((*source, *target_state)),
                      _ => None,
                  }
              }

              pub const fn composition_kind(&self) -> Option<SemanticAnimationCompositionKind> {
          ''')
          r1(sem,
          '''    /// Insert one activation-relative two-phase vector outline/fill declaration.
          ''',
          '''    /// Insert one family Transform declaration without expanding semantic children.
              ///
              /// Both endpoints are real semantic families. Unequal correspondence remains a
              /// compiler/runtime derived visual concern and never allocates padding nodes here.
              pub fn insert_semantic_family_transform_animation(
                  &mut self,
                  source: SemanticNodeId,
                  target_state: SemanticNodeId,
                  options: AnimationOptions,
              ) -> Result<SemanticNodeId, SemanticAnimationError> {
                  self.set_last_mutation_writes(0);
                  self.semantic_family_members_checked(source)?;
                  self.semantic_family_members_checked(target_state)?;
                  if source == target_state {
                      return Err(SemanticAnimationError::SameTargetAndTargetState(source));
                  }
                  validate_authored_animation_options(options)?;
                  Ok(self.insert_semantic_animation_state(SemanticAnimationState::new(
                      SemanticAnimationIntent::FamilyTransformTo {
                          source,
                          target_state,
                      },
                      options,
                  )))
              }

              /// Insert one activation-relative two-phase vector outline/fill declaration.
          ''')

          txn = "crates/noon-core/src/semantic_store/semantic_transaction.rs"
          r1(txn,
          '''    /// Stage a centered 2D angular-path rotation declaration.
          ''',
          '''    /// Stage a family Transform declaration without creating semantic padding members.
              pub fn create_family_transform_animation(
                  &mut self,
                  source: impl Into<SemanticTransactionNodeRef>,
                  target_state: impl Into<SemanticTransactionNodeRef>,
                  options: AnimationOptions,
              ) -> SemanticLocalNodeToken {
                  let token = self.allocate_local_node_token();
                  self.mutations.push(SemanticMutation::AddAnimation {
                      token,
                      animation: SemanticTransactionAnimation::new(
                          SemanticTransactionAnimationIntent::FamilyTransformTo {
                              source: source.into(),
                              target_state: target_state.into(),
                          },
                          options,
                      ),
                  });
                  token
              }

              /// Stage a centered 2D angular-path rotation declaration.
          ''')

          add = "crates/noon-core/src/semantic_store/semantic_transaction/animation_addition.rs"
          r1(add,
          '''        complete_priority: bool,
              },
              Indicate {
          ''',
          '''        complete_priority: bool,
              },
              FamilyTransformTo {
                  source: SemanticTransactionNodeRef,
                  target_state: SemanticTransactionNodeRef,
              },
              Indicate {
          ''')
          r1(add,
          '''            } => Some([Some(*target), Some(*target_state), None]),
                  Self::Rotate { target, .. }
          ''',
          '''            } => Some([Some(*target), Some(*target_state), None]),
                  Self::FamilyTransformTo {
                      source,
                      target_state,
                  } => Some([Some(*source), Some(*target_state), None]),
                  Self::Rotate { target, .. }
          ''')
          r1(add,
          '''            Self::ObjectPropertyTrack { .. }
                  | Self::TransformTo { .. }
                  | Self::Indicate { .. }
          ''',
          '''            Self::ObjectPropertyTrack { .. }
                  | Self::TransformTo { .. }
                  | Self::FamilyTransformTo { .. }
                  | Self::Indicate { .. }
          ''')
          r1(add,
          '''            SemanticAnimationIntent::Rotate {
                  target,
                  angle,
                  hold_origin,
              } => SemanticTransactionAnimationIntent::Rotate {
          ''',
          '''            SemanticAnimationIntent::FamilyTransformTo {
                  source,
                  target_state,
              } => SemanticTransactionAnimationIntent::FamilyTransformTo {
                  source: (*source).into(),
                  target_state: (*target_state).into(),
              },
                  SemanticAnimationIntent::Rotate {
                  target,
                  angle,
                  hold_origin,
              } => SemanticTransactionAnimationIntent::Rotate {
          ''')
          r1(add,
          '''            SemanticTransactionAnimationIntent::Rotate {
                  target,
                  angle,
                  hold_origin,
              } => SemanticAnimationIntent::Rotate {
          ''',
          '''            SemanticTransactionAnimationIntent::FamilyTransformTo {
                  source,
                  target_state,
              } => SemanticAnimationIntent::FamilyTransformTo {
                  source: resolve_node_ref(*source, committed),
                  target_state: resolve_node_ref(*target_state, committed),
              },
                  SemanticTransactionAnimationIntent::Rotate {
                  target,
                  angle,
                  hold_origin,
              } => SemanticAnimationIntent::Rotate {
          ''')
          r1(add,
          '''        SemanticTransactionAnimationIntent::Rotate { target, angle, .. } => {
          ''',
          '''        SemanticTransactionAnimationIntent::FamilyTransformTo {
              source,
              target_state,
          } => {
              catalog.ensure_family(*source, index)?;
              catalog.ensure_family(*target_state, index)?;
              if source == target_state {
                  return Err(match source {
                      SemanticTransactionNodeRef::Existing(node) => {
                          SemanticMutationTransactionError::SameAnimationTargetAndTargetState {
                              index,
                              node: *node,
                          }
                      }
                      SemanticTransactionNodeRef::Pending(_) => {
                          SemanticMutationTransactionError::SamePendingAnimationTargetAndTargetState {
                              index,
                              node: *source,
                          }
                      }
                  });
              }
          }
              SemanticTransactionAnimationIntent::Rotate { target, angle, .. } => {
          ''')
          r1(add,
          '''        SemanticAnimationIntent::Rotate { target, angle, hold_origin } => store
          ''',
          '''        SemanticAnimationIntent::FamilyTransformTo {
              source,
              target_state,
          } => store
              .insert_semantic_family_transform_animation(*source, *target_state, options)
              .expect("preflighted semantic family Transform insertion must remain valid while transaction owns the store"),
              SemanticAnimationIntent::Rotate { target, angle, hold_origin } => store
          ''')

          Path("crates/noon-core/tests/family_transform_intent.rs").write_text(r'''use noon_core::{
              AnimationOptions, SemanticAnimationIntent, SemanticMutationImpact,
              SemanticMutationTransaction, SemanticObjectState, SemanticStore, StoredGeometry,
          };

          fn object(store: &mut SemanticStore) -> noon_core::SemanticNodeId {
              store.insert_semantic_object(SemanticObjectState::new(StoredGeometry::Circle {
                  radius: 1.0,
              }))
          }

          fn family(
              store: &mut SemanticStore,
              members: &[noon_core::SemanticNodeId],
          ) -> noon_core::SemanticNodeId {
              let family = store.insert_family();
              for &member in members {
                  store.add_member(family, member).unwrap();
              }
              family
          }

          #[test]
          fn family_transform_is_authored_intent_without_padding_nodes_or_topology_change() {
              let mut store = SemanticStore::new();
              let s0 = object(&mut store);
              let s1 = object(&mut store);
              let t0 = object(&mut store);
              let t1 = object(&mut store);
              let t2 = object(&mut store);
              let source = family(&mut store, &[s0, s1]);
              let target = family(&mut store, &[t0, t1, t2]);
              let source_before = store.semantic_family_members_checked(source).unwrap().to_vec();
              let target_before = store.semantic_family_members_checked(target).unwrap().to_vec();
              let before_len = store.len();

              let animation = store
                  .insert_semantic_family_transform_animation(
                      source,
                      target,
                      AnimationOptions::new().run_time(2.0),
                  )
                  .unwrap();

              assert_eq!(store.len(), before_len + 1);
              let state = store.semantic_animation_state(animation).unwrap();
              assert_eq!(state.intent().target(), Some(source));
              assert_eq!(state.intent().target_state(), Some(target));
              assert_eq!(state.intent().family_transform(), Some((source, target)));
              assert!(matches!(
                  state.intent(),
                  SemanticAnimationIntent::FamilyTransformTo {
                      source: actual_source,
                      target_state: actual_target,
                  } if *actual_source == source && *actual_target == target
              ));
              assert_eq!(store.semantic_family_members_checked(source).unwrap(), source_before);
              assert_eq!(store.semantic_family_members_checked(target).unwrap(), target_before);
          }

          #[test]
          fn family_transform_transaction_resolves_existing_families_without_allocating_padding() {
              let mut store = SemanticStore::new();
              let s = object(&mut store);
              let t0 = object(&mut store);
              let t1 = object(&mut store);
              let source = family(&mut store, &[s]);
              let target = family(&mut store, &[t0, t1]);
              let before_len = store.len();
              let source_before = store.semantic_family_members_checked(source).unwrap().to_vec();

              let mut transaction = SemanticMutationTransaction::new();
              transaction.create_family_transform_animation(
                  source,
                  target,
                  AnimationOptions::new().run_time(1.5),
              );
              let result = transaction.apply(&mut store).unwrap();

              assert_eq!(store.len(), before_len + 1);
              assert!(matches!(
                  result.impacts(),
                  [SemanticMutationImpact::AnimationAdded { .. }]
              ));
              assert_eq!(store.semantic_family_members_checked(source).unwrap(), source_before);
          }

          #[test]
          fn family_transform_rejects_object_endpoint_atomically() {
              let mut store = SemanticStore::new();
              let source_object = object(&mut store);
              let target_leaf = object(&mut store);
              let target = family(&mut store, &[target_leaf]);
              let revision = store.scene_revision();
              let len = store.len();

              assert!(store
                  .insert_semantic_family_transform_animation(
                      source_object,
                      target,
                      AnimationOptions::new(),
                  )
                  .is_err());
              assert_eq!(store.scene_revision(), revision);
              assert_eq!(store.len(), len);

              let mut transaction = SemanticMutationTransaction::new();
              transaction.create_family_transform_animation(
                  source_object,
                  target,
                  AnimationOptions::new(),
              );
              assert!(transaction.apply(&mut store).is_err());
              assert_eq!(store.scene_revision(), revision);
              assert_eq!(store.len(), len);
          }
          ''')

          Path(".github/workflows/_codex_b3_family_intent_patch.yml").unlink()
          PY
          cargo fmt --all
          cargo test -p noon-core --test family_transform_intent
          cargo test -p noon-core semantic_animation --lib
          git config user.name "Yongkyun Shin"
          git config user.email "yongkyuns@gmail.com"
          git add -A
          git commit -m "Add authored semantic family Transform intent"
          git push origin HEAD:codex/b3-family-transform-intent
