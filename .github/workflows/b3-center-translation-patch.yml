name: B3 CenterTranslation patch
on:
  push:
    branches: [b3-cyclic-replace-adapter]
    paths:
      - scripts/_b3_center_translation_patch.py
      - .github/workflows/b3-center-translation-patch.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b3-cyclic-replace-adapter
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/_b3_center_translation_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Check
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          cargo check -p noon-core -p noon-compile -p noon 2>&1 | tee .b3-center-status.txt
      - name: Commit patch and diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/noon-core crates/noon-compile crates/noon .b3-center-status.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'B3: stage activation-time center translation [b3-center]'
            git push origin HEAD:b3-cyclic-replace-adapter
          fi
      - name: Require compile
        if: steps.check.outcome != 'success'
        run: exit 1
