name: C5 selection overlay isolated validation
on:
  push:
    branches: [validation/c5-selection-overlay-20260919]
    paths: [.github/workflows/c5-overlay-validation.yml]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: true
      SCCACHE_GHA_RW_MODE: READ_ONLY
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6dd34bde8698fca44af95b1d9b0e6ba1a34d7758
          fetch-depth: 0
      - name: Use repository-pinned Rust
        run: |
          rustup install
          rustup show active-toolchain
          rustc --version --verbose
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - name: Use sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Install virtual display and software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0
      - name: Retain exact source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          test "$(git rev-parse HEAD)" = 6dd34bde8698fca44af95b1d9b0e6ba1a34d7758
          git diff --exit-code
          git rev-parse HEAD 'HEAD^{tree}' | tee proof/identity.txt
          git archive HEAD | gzip > proof/source.tar.gz
          git diff 321f6b661c467a92b47ae9c4b34e5e020fa92efb > proof/formatted.patch
      - name: Guardrail self-tests and minimal all-target consumer
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/transient-presentation-ratchet.test.sh 2>&1 | tee proof/guard-self-tests.log
          cargo check -p noon --no-default-features --all-targets 2>&1 | tee proof/minimal-all-targets.log
      - name: Real selection pixels and export isolation
        shell: bash
        env:
          NOON_SELECTION_PROOF_DIR: ${{ github.workspace }}/proof/pixels
        run: |
          set -euo pipefail
          cargo test -p noon --all-features --test selection_overlay_raster -- --include-ignored --nocapture 2>&1 | tee proof/raster.log
      - name: Native surface click selection and clear
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' cargo test -p noon-native --all-features --lib native_surface_smoke_presents_paused_click_selection_and_clear -- --ignored --nocapture --test-threads=1 2>&1 | tee proof/native-surface.log
      - name: Focused overlay and selection tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p noon-render-wgpu --all-features --lib gpu::overlay::tests -- --nocapture 2>&1 | tee proof/renderer-overlay.log
          cargo test -p noon-native --all-features --lib selection_overlay::tests -- --nocapture 2>&1 | tee proof/native-overlay.log
          cargo test -p noon --all-features --lib execution_session::selection::tests -- --nocapture 2>&1 | tee proof/selection.log
          cargo test -p noon --all-features --lib execution_session::input::tests -- --nocapture 2>&1 | tee proof/input.log
          cargo test -p noon --all-features --lib execution_session::picking::tests -- --nocapture 2>&1 | tee proof/picking.log
      - name: Architecture and complete fast gate
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check.sh fast 321f6b661c467a92b47ae9c4b34e5e020fa92efb 2>&1 | tee proof/fast.log
      - name: Direct Rust WASM compile
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p noon --no-default-features --target wasm32-unknown-unknown 2>&1 | tee proof/wasm.log
      - name: JavaScript regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test web/*.test.mjs 2>&1 | tee proof/js.log
      - name: Retain source and executable evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: c5-selection-overlay-proof
          path: proof/
          retention-days: 14
