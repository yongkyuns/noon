name: Rustfmt diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  rustfmt-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use stable Rust
        run: |
          rustup default stable
          rustup component add rustfmt
      - name: Capture rustfmt diff
        run: |
          cargo fmt --all
          git diff --exit-code || true
          git diff > rustfmt.diff
      - name: Upload rustfmt diff
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-diff
          path: rustfmt.diff
          if-no-files-found: error
          retention-days: 1
