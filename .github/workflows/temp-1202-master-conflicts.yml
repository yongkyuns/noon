name: Temporary 1202 master conflict inspection

on:
  push:
    branches: [codex/noon-preview-session]
    paths: [.github/workflows/temp-1202-master-conflicts.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/noon-preview-session
          fetch-depth: 0
      - name: Inspect merge conflicts
        shell: bash
        run: |
          set -uo pipefail
          git fetch origin master
          git config merge.conflictStyle diff3
          git merge --no-commit --no-ff origin/master || true
          echo '=== UNMERGED FILES ==='
          git diff --name-only --diff-filter=U
          echo '=== CONFLICT HUNKS ==='
          git diff --cc --no-ext-diff
          echo '=== STATUS ==='
          git status --short
