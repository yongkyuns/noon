name: PR 1530 render suffix cfg once

on:
  push:
    branches:
      - codex/restore-morph-preload-residency

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/restore-morph-preload-residency
          fetch-depth: 0
      - name: Scope render suffix bookkeeping
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/noon-web/src/retained_resource_transport/incremental_render.rs')
          text = p.read_text()

          old = '    render_geometries: Option<Arc<[Arc<GeometryRef>]>>,\n    render_geometry_suffix_start: usize,\n    render_geometry_preparations: Vec<RenderGeometryPreparation>,'
          new = '    render_geometries: Option<Arc<[Arc<GeometryRef>]>>,\n    #[cfg(any(target_arch = "wasm32", test))]\n    render_geometry_suffix_start: usize,\n    render_geometry_preparations: Vec<RenderGeometryPreparation>,'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected struct field context count: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '                render_geometries: None,\n                render_geometry_suffix_start,\n                render_geometry_preparations: Vec::new(),'
          new = '                render_geometries: None,\n                #[cfg(any(target_arch = "wasm32", test))]\n                render_geometry_suffix_start,\n                render_geometry_preparations: Vec::new(),'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected empty addition literal count: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '            render_geometries: Some(next),\n            render_geometry_suffix_start,\n            render_geometry_preparations: preparations,'
          new = '            render_geometries: Some(next),\n            #[cfg(any(target_arch = "wasm32", test))]\n            render_geometry_suffix_start,\n            render_geometry_preparations: preparations,'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected addition literal count: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '            render_geometries,\n            render_geometry_suffix_start: _,\n            render_geometry_preparations,'
          new = '            render_geometries,\n            #[cfg(any(target_arch = "wasm32", test))]\n            render_geometry_suffix_start: _,\n            render_geometry_preparations,'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected destructure count: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '    pub(crate) fn render_geometry_suffix(&self) -> &[Arc<GeometryRef>] {'
          new = '    #[cfg(any(target_arch = "wasm32", test))]\n    pub(crate) fn render_geometry_suffix(&self) -> &[Arc<GeometryRef>] {'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected suffix accessor count: {text.count(old)}')
          text = text.replace(old, new, 1)

          p.write_text(text)
          PY
          cargo fmt --all
          rm .github/workflows/pr-1530-render-suffix-cfg-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/noon-web/src/retained_resource_transport/incremental_render.rs \
                  .github/workflows/pr-1530-render-suffix-cfg-once.yml
          git commit -m 'Scope render suffix bookkeeping to consumers'
          git push origin HEAD:codex/restore-morph-preload-residency
