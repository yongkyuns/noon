name: Image metrics candidate (temporary)
on:
  push:
    branches: [codex/b2-image-workspace-bootstrap]
    paths: [.github/workflows/image-metrics-publish.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1219cf3c6167d7458ae43a6cd8079540e3faa1bb
          path: patch-input
          persist-credentials: false
      - name: Decode checksum-pinned reviewed patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          encoded = pathlib.Path('patch-input/.image-patch/metrics-0ed7d2dc.b64').read_text().strip()
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == '0ed7d2dc4cce803efbe7668c47b19fd6285d17229a15809570e89861ca03f27e', digest
          pathlib.Path('/tmp/image-metrics.patch').write_bytes(patch)
          PY
      - uses: actions/checkout@v4
        with:
          ref: cf4f2a9e82c8f128d8d2c34eb7760d39ab4b409f
          path: product
      - name: Apply product-only correction
        working-directory: product
        run: |
          set -euo pipefail
          git apply --check /tmp/image-metrics.patch
          git apply /tmp/image-metrics.patch
          git diff --check
          git diff --name-only | while IFS= read -r file; do
            case "$file" in crates/*.rs|scripts/image-*.mjs|web/image-raster-contract.test.mjs) ;; *) echo "Unexpected patch path: $file"; exit 1;; esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: count retained images in browser upload and draw metrics'
          git push origin HEAD:refs/heads/codex/b2-image-metrics-20260916
          git rev-parse HEAD > /tmp/image-metrics-head.txt
          git rev-parse HEAD^{tree} >> /tmp/image-metrics-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-metrics-candidate-head
          path: /tmp/image-metrics-head.txt
          retention-days: 2
