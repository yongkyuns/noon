name: PR 2422 8ca browser diagnostics (TEMP — do not merge)

on:
  push:
    branches:
      - codex/2422-8ca-browser-diagnostic
    paths:
      - ".github/workflows/pr-2422-8ca-browser-diagnostic.yml"
      - "scripts/playground-gallery-runtime-smoke.mjs"
      - "scripts/showcase-playback.mjs"
      - "scripts/showcase-live-review.mjs"
      - "scripts/showcase-renderer-readback.mjs"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: pr-2422-8ca-browser-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  webkit-gallery-shard-zero:
    name: WebKit strict gallery shard 0, three retained attempts
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: be814def71f9d34d9d28d106631544ca5a8eb3f8
      - name: Pin source and diagnostic overlay
        id: source
        env:
          DIAGNOSTIC_SHA: ${{ github.sha }}
          GITHUB_SHA: be814def71f9d34d9d28d106631544ca5a8eb3f8
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^{tree})" = "0ac6518799955a9a39b39820f0a2857f62144385"
          test -z "$(git status --porcelain)"
          git fetch --no-tags --depth=1 origin "$DIAGNOSTIC_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$DIAGNOSTIC_SHA"
          mkdir -p "$RUNNER_TEMP/diagnostic-overlay/scripts"
          for file in scripts/playground-gallery-runtime-smoke.mjs scripts/showcase-playback.mjs; do
            git show "$DIAGNOSTIC_SHA:$file" > "$RUNNER_TEMP/diagnostic-overlay/$file"
          done
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "diagnostic-overlay"
          files = ["scripts/playground-gallery-runtime-smoke.mjs", "scripts/showcase-playback.mjs"]
          snapshot = {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in files}
          (Path(os.environ["RUNNER_TEMP"]) / "overlay-snapshot.json").write_text(json.dumps(snapshot, sort_keys=True))
          PY
          printf 'Pinned source %s; diagnostic commit %s\n' "$GITHUB_SHA" "$DIAGNOSTIC_SHA"
      - name: Download and verify the exact WebKit runtime artifact
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/yongkyuns/noon/actions/artifacts/13394492580/zip \
            -o "$RUNNER_TEMP/webkit-runtime.zip"
          python3 - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path, PurePosixPath
          archive = Path(os.environ["RUNNER_TEMP"]) / "webkit-runtime.zip"
          expected = "e0802f0c52218aa0339a34720c83abc8e4204f3a4ed25baf9acd8495b1cc5994"
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert actual == expected, (actual, expected)
          root = Path(os.environ["RUNNER_TEMP"]) / "webkit-runtime"
          root.mkdir()
          with zipfile.ZipFile(archive) as z:
              members = z.infolist()
              names = [m.filename.rstrip("/") for m in members if not m.is_dir()]
              assert len(names) == 10 and len(set(names)) == 10, names
              for m in members:
                  p = PurePosixPath(m.filename)
                  assert not p.is_absolute() and ".." not in p.parts, m.filename
                  assert not stat.S_ISLNK(m.external_attr >> 16), m.filename
              z.extractall(root)
          identity = json.loads((root / "runtime-build-identity.json").read_text())
          assert identity["sourceRevision"] == "be814def71f9d34d9d28d106631544ca5a8eb3f8", identity
          inventory = {p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                       for p in sorted(root.rglob("*")) if p.is_file()}
          assert len(inventory) == 10
          snapshot = {"zipSha256": actual, "inventory": inventory, "identity": identity}
          snap = Path(os.environ["RUNNER_TEMP"]) / "webkit-runtime-snapshot.json"
          snap.write_text(json.dumps(snapshot, sort_keys=True))
          print(json.dumps({"artifact": 13394492580, "zipSha256": actual,
                            "buildId": identity["buildId"], "files": len(inventory)}))
          PY
          cp -R "$RUNNER_TEMP/webkit-runtime/." web/
          git diff --quiet -- Cargo.toml Cargo.lock rust-toolchain.toml .cargo crates scripts/build-web-demo.sh .github/actions/dev-wasm-build
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: macOS-playwright-webkit-1.62.1
      - name: Install pinned browser npm dependencies
        timeout-minutes: 10
        run: npm install --no-save --ignore-scripts --no-package-lock playwright@1.62.1 pngjs@7.0.0
      - name: Install WebKit and system dependencies
        timeout-minutes: 15
        run: bash scripts/ci-install-playwright-browser.sh webkit
      - name: Install passive gallery observer overlay
        env:
          DIAGNOSTIC_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/diagnostic-overlay/scripts/playground-gallery-runtime-smoke.mjs" scripts/
          cp "$RUNNER_TEMP/diagnostic-overlay/scripts/showcase-playback.mjs" scripts/
          git diff --check
      - name: Run unchanged strict full shard 0 in three fresh browser processes
        id: attempts
        timeout-minutes: 60
        env:
          NOON_PLAYGROUND_BROWSER: webkit
          NOON_PLAYGROUND_PROFILE: mobile-dpr2
          NOON_GALLERY_SHARD_INDEX: "0"
          NOON_GALLERY_SHARD_COUNT: "3"
          NOON_SHOWCASE_PROFILE_GATE: strict
          NOON_GALLERY_CONTROL_DIAGNOSTIC: "1"
        shell: bash
        run: |
          set -uo pipefail
          cat > "$RUNNER_TEMP/verify-attempt.py" <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          runtime_snapshot, runtime_archive, deployed, overlay_snapshot = map(Path, sys.argv[1:5])
          expected_source = "be814def71f9d34d9d28d106631544ca5a8eb3f8"
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == expected_source
          overlays = json.loads(overlay_snapshot.read_text())
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "HEAD", "--"], text=True).splitlines())
          assert changed == set(overlays), (sorted(changed), sorted(overlays))
          for name, expected in overlays.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == expected, (name, actual, expected)
          snapshot = json.loads(runtime_snapshot.read_text())
          for root in (runtime_archive, deployed):
              for name, expected in snapshot["inventory"].items():
                  actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
                  assert actual == expected, (str(root), name, actual)
          assert json.loads((deployed / "runtime-build-identity.json").read_text()) == snapshot["identity"]
          print("attempt integrity: pinned source, allowed overlays, exact runtime inventory PASS")
          PY
          mkdir -p browser-smoke-artifacts/pr2422-8ca/webkit
          failures=0
          for attempt in 1 2 3; do
            if ! python3 "$RUNNER_TEMP/verify-attempt.py" "$RUNNER_TEMP/webkit-runtime-snapshot.json" \
                "$RUNNER_TEMP/webkit-runtime" web "$RUNNER_TEMP/overlay-snapshot.json" \
                > "browser-smoke-artifacts/pr2422-8ca/webkit/attempt-$attempt-precheck.log" 2>&1; then
              failures=1
              printf '{"attempt":%s,"integrity":"precheck-failed","exitCode":null}\n' "$attempt" >> browser-smoke-artifacts/pr2422-8ca/webkit/attempt-status.jsonl
              break
            fi
            export NOON_PLAYGROUND_MATRIX_ARTIFACTS="browser-smoke-artifacts/pr2422-8ca/webkit/attempt-$attempt"
            set +e
            node scripts/playground-gallery-runtime-smoke.mjs 2>&1 | tee "browser-smoke-artifacts/pr2422-8ca/webkit/attempt-$attempt.log"
            status=${PIPESTATUS[0]}
            set -e
            integrity=pass
            if ! python3 "$RUNNER_TEMP/verify-attempt.py" "$RUNNER_TEMP/webkit-runtime-snapshot.json" \
                "$RUNNER_TEMP/webkit-runtime" web "$RUNNER_TEMP/overlay-snapshot.json" \
                > "browser-smoke-artifacts/pr2422-8ca/webkit/attempt-$attempt-postcheck.log" 2>&1; then
              integrity=fail
              failures=1
            fi
            printf '{"attempt":%s,"exitCode":%s,"integrity":"%s"}\n' "$attempt" "$status" "$integrity" >> browser-smoke-artifacts/pr2422-8ca/webkit/attempt-status.jsonl
            if [ "$status" -ne 0 ]; then failures=1; fi
            if [ "$integrity" = fail ]; then break; fi
          done
          exit "$failures"
      - name: Restore harness scripts and verify runtime and source are unchanged
        if: always() && steps.runtime.outcome == 'success'
        env:
          GITHUB_SHA: be814def71f9d34d9d28d106631544ca5a8eb3f8
        run: |
          set -euo pipefail
          overlay_status=0
          if [ -f "$RUNNER_TEMP/overlay-snapshot.json" ]; then
            python3 - <<'PY' || overlay_status=$?
          import hashlib, json, os
          from pathlib import Path
          expected = json.loads((Path(os.environ["RUNNER_TEMP"]) / "overlay-snapshot.json").read_text())
          changed = set(__import__("subprocess").check_output(["git", "diff", "--name-only", "HEAD", "--"], text=True).splitlines())
          assert changed == set(expected), (sorted(changed), sorted(expected))
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          print("final harness overlay hashes match before restore")
          PY
          fi
          git checkout -- scripts/playground-gallery-runtime-smoke.mjs scripts/showcase-playback.mjs
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          snap = json.loads((Path(os.environ["RUNNER_TEMP"]) / "webkit-runtime-snapshot.json").read_text())
          for root in (Path(os.environ["RUNNER_TEMP"]) / "webkit-runtime", Path("web")):
              for name, digest in snap["inventory"].items():
                  actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
                  assert actual == digest, (root.as_posix(), name, actual)
          assert json.loads(Path("web/runtime-build-identity.json").read_text()) == snap["identity"]
          assert not __import__("subprocess").check_output(["git", "diff", "--name-only", "HEAD", "--"], text=True).strip()
          __import__("subprocess").check_call(["git", "diff", "--quiet", "HEAD", "--"])
          print("post-run runtime inventory and pinned source tree unchanged")
          PY
          exit "$overlay_status"
      - name: Retain all WebKit attempts and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr2422-8ca-webkit-gallery-diagnostic
          path: browser-smoke-artifacts/pr2422-8ca/webkit
          if-no-files-found: warn
          retention-days: 3

  showcase-webgl-live-review:
    name: WebGL showcase live review, three retained attempts
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: be814def71f9d34d9d28d106631544ca5a8eb3f8
      - name: Pin source and diagnostic overlay
        id: source
        env:
          DIAGNOSTIC_SHA: ${{ github.sha }}
          GITHUB_SHA: be814def71f9d34d9d28d106631544ca5a8eb3f8
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^{tree})" = "0ac6518799955a9a39b39820f0a2857f62144385"
          test -z "$(git status --porcelain)"
          git fetch --no-tags --depth=1 origin "$DIAGNOSTIC_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$DIAGNOSTIC_SHA"
          mkdir -p "$RUNNER_TEMP/diagnostic-overlay/scripts"
          for file in scripts/showcase-live-review.mjs scripts/showcase-renderer-readback.mjs; do
            git show "$DIAGNOSTIC_SHA:$file" > "$RUNNER_TEMP/diagnostic-overlay/$file"
          done
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "diagnostic-overlay"
          files = ["scripts/showcase-live-review.mjs", "scripts/showcase-renderer-readback.mjs"]
          snapshot = {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in files}
          (Path(os.environ["RUNNER_TEMP"]) / "overlay-snapshot.json").write_text(json.dumps(snapshot, sort_keys=True))
          PY
          printf 'Pinned source %s; diagnostic commit %s\n' "$GITHUB_SHA" "$DIAGNOSTIC_SHA"
      - name: Download, verify and install exact runtime package
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: be814def71f9d34d9d28d106631544ca5a8eb3f8
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/yongkyuns/noon/actions/artifacts/13393584618/zip \
            -o "$RUNNER_TEMP/showcase-runtime.zip"
          python3 - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path, PurePosixPath
          archive = Path(os.environ["RUNNER_TEMP"]) / "showcase-runtime.zip"
          expected = "1b442bb219c6a3361475669ff96543aff680b550475266da273c43043205b540"
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert actual == expected, (actual, expected)
          root = Path(os.environ["RUNNER_TEMP"]) / "showcase-runtime"
          root.mkdir()
          with zipfile.ZipFile(archive) as z:
              for m in z.infolist():
                  p = PurePosixPath(m.filename)
                  assert not p.is_absolute() and ".." not in p.parts, m.filename
                  assert not stat.S_ISLNK(m.external_attr >> 16), m.filename
              z.extractall(root)
          identity = json.loads((root / "runtime-build-identity.json").read_text())
          ci_artifact = json.loads((root / "ci-artifact.json").read_text())
          assert identity["sourceRevision"] == "be814def71f9d34d9d28d106631544ca5a8eb3f8", identity
          inventory = {p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                       for p in sorted(root.rglob("*")) if p.is_file()}
          expected_inventory = {name.removeprefix("web/") for name in ci_artifact["files"]} | {
            "runtime-build-identity.json", "ci-artifact.json"}
          assert set(inventory) == expected_inventory, (sorted(inventory), sorted(expected_inventory))
          snapshot = {"zipSha256": actual, "inventory": inventory, "identity": identity}
          (Path(os.environ["RUNNER_TEMP"]) / "showcase-runtime-snapshot.json").write_text(json.dumps(snapshot, sort_keys=True))
          print(json.dumps({"artifact": 13393584618, "zipSha256": actual,
                            "buildId": identity["buildId"], "files": len(inventory)}))
          PY
          cp -R "$RUNNER_TEMP/showcase-runtime/." web/
          node .github/ci/wasm-build.mjs verify
      - name: Download exact original WebGL direct-capture and oracle archive
        id: capture_archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/yongkyuns/noon/actions/artifacts/13396570931/zip \
            -o "$RUNNER_TEMP/showcase-capture.zip"
          python3 - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path, PurePosixPath
          archive = Path(os.environ["RUNNER_TEMP"]) / "showcase-capture.zip"
          expected = "c1617860dbda9cecb07e9ec1001f5b3c5d67a705e0311ea701628280c2a635ee5"
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert actual == expected, (actual, expected)
          root = Path("browser-smoke-artifacts/pr2422-8ca/webgl-original")
          root.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              for m in z.infolist():
                  p = PurePosixPath(m.filename)
                  assert not p.is_absolute() and ".." not in p.parts, m.filename
                  assert not stat.S_ISLNK(m.external_attr >> 16), m.filename
              z.extractall(root)
          files = {p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in sorted(root.rglob("*")) if p.is_file()}
          assert files and any(PurePosixPath(name).name == "report.json" for name in files), files
          snap = {"zipSha256": actual, "inventory": files}
          (Path(os.environ["RUNNER_TEMP"]) / "showcase-capture-snapshot.json").write_text(json.dumps(snap, sort_keys=True))
          print(json.dumps({"artifact": 13396570931, "zipSha256": actual, "files": len(files)}))
          PY
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: Linux-playwright-chromium-1.62.1
      - name: Install pinned browser npm dependencies
        timeout-minutes: 10
        run: npm install --no-save --ignore-scripts --no-package-lock playwright@1.62.1 pngjs@7.0.0
      - name: Install Chromium and system dependencies
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium
      - name: Prepare exact direct-capture inputs and diagnostic harness
        env:
          DIAGNOSTIC_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          entries = json.loads(Path("web/python/examples/noon_showcase_manifest.json").read_text())["entries"]
          assert len(entries) == 33, f"expected full 33-case showcase, found {len(entries)}"
          print("Running all", len(entries), "showcase entries; no case filter is set")
          PY
          mkdir -p browser-smoke-artifacts/showcase/webgl
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          source = Path("browser-smoke-artifacts/pr2422-8ca/webgl-original")
          destination = Path("browser-smoke-artifacts/showcase/webgl")
          reports = [p for p in source.rglob("report.json") if "live" not in p.relative_to(source).parts]
          assert len(reports) == 1, [str(p) for p in reports]
          capture_root = reports[0].parent
          for path in capture_root.iterdir():
              if path.name == "live":
                  continue
              target = destination / path.name
              if path.is_dir(): shutil.copytree(path, target, dirs_exist_ok=True)
              elif path.is_file(): shutil.copy2(path, target)
          assert (destination / "report.json").is_file()
          import hashlib, json, os
          inputs = {p.relative_to(destination).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in sorted(destination.rglob("*")) if p.is_file()}
          (Path(os.environ["RUNNER_TEMP"]) / "showcase-capture-inputs.json").write_text(json.dumps(inputs, sort_keys=True))
          PY
          mkdir -p "$RUNNER_TEMP/diagnostic-overlay/scripts"
          cp "$RUNNER_TEMP/diagnostic-overlay/scripts/showcase-live-review.mjs" scripts/
          cp "$RUNNER_TEMP/diagnostic-overlay/scripts/showcase-renderer-readback.mjs" scripts/
          node --check scripts/showcase-live-review.mjs
          node --check scripts/showcase-renderer-readback.mjs
      - name: Run unchanged full 33-case WebGL live review three times
        id: attempts
        timeout-minutes: 150
        env:
          NOON_SHOWCASE_BACKEND: webgl
          NOON_BLOOM_WRAP_DIAGNOSTIC: "1"
        shell: bash
        run: |
          set -uo pipefail
          cat > "$RUNNER_TEMP/verify-attempt.py" <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          runtime_snapshot, runtime_archive, deployed, overlay_snapshot, capture_snapshot, capture_archive, capture_inputs, input_root = map(Path, sys.argv[1:9])
          expected_source = "be814def71f9d34d9d28d106631544ca5a8eb3f8"
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == expected_source
          overlays = json.loads(overlay_snapshot.read_text())
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "HEAD", "--"], text=True).splitlines())
          assert changed == set(overlays), (sorted(changed), sorted(overlays))
          for name, expected in overlays.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == expected, (name, actual, expected)
          runtime = json.loads(runtime_snapshot.read_text())
          for root in (runtime_archive, deployed):
              for name, expected in runtime["inventory"].items():
                  actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
                  assert actual == expected, (str(root), name, actual)
          assert json.loads((deployed / "runtime-build-identity.json").read_text()) == runtime["identity"]
          for snapshot_path, root in ((capture_snapshot, capture_archive), (capture_inputs, input_root)):
              expected = json.loads(snapshot_path.read_text())["inventory"] if snapshot_path == capture_snapshot else json.loads(snapshot_path.read_text())
              for name, digest in expected.items():
                  actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
                  assert actual == digest, (str(root), name, actual)
          print("attempt integrity: pinned source, allowed overlays, exact runtime and capture inputs PASS")
          PY
          mkdir -p browser-smoke-artifacts/pr2422-8ca/webgl-attempts
          failures=0
          mv browser-smoke-artifacts/showcase/webgl/live browser-smoke-artifacts/showcase/webgl/live-original-failure 2>/dev/null || true
          for attempt in 1 2 3; do
            if ! python3 "$RUNNER_TEMP/verify-attempt.py" "$RUNNER_TEMP/showcase-runtime-snapshot.json" \
                "$RUNNER_TEMP/showcase-runtime" web "$RUNNER_TEMP/overlay-snapshot.json" \
                "$RUNNER_TEMP/showcase-capture-snapshot.json" browser-smoke-artifacts/pr2422-8ca/webgl-original \
                "$RUNNER_TEMP/showcase-capture-inputs.json" browser-smoke-artifacts/showcase/webgl \
                > "browser-smoke-artifacts/pr2422-8ca/webgl-attempts/attempt-$attempt-precheck.log" 2>&1; then
              failures=1
              printf '{"attempt":%s,"integrity":"precheck-failed","exitCode":null}\n' "$attempt" >> browser-smoke-artifacts/pr2422-8ca/webgl-attempts/attempt-status.jsonl
              break
            fi
            set +e
            node scripts/showcase-live-review.mjs 2>&1 | tee "browser-smoke-artifacts/pr2422-8ca/webgl-attempts/attempt-$attempt.log"
            status=${PIPESTATUS[0]}
            set -e
            live="browser-smoke-artifacts/showcase/webgl/live"
            if [ -d "$live" ]; then mv "$live" "browser-smoke-artifacts/pr2422-8ca/webgl-attempts/live-attempt-$attempt"; fi
            integrity=pass
            if ! python3 "$RUNNER_TEMP/verify-attempt.py" "$RUNNER_TEMP/showcase-runtime-snapshot.json" \
                "$RUNNER_TEMP/showcase-runtime" web "$RUNNER_TEMP/overlay-snapshot.json" \
                "$RUNNER_TEMP/showcase-capture-snapshot.json" browser-smoke-artifacts/pr2422-8ca/webgl-original \
                "$RUNNER_TEMP/showcase-capture-inputs.json" browser-smoke-artifacts/showcase/webgl \
                > "browser-smoke-artifacts/pr2422-8ca/webgl-attempts/attempt-$attempt-postcheck.log" 2>&1; then
              integrity=fail
              failures=1
            fi
            printf '{"attempt":%s,"exitCode":%s,"integrity":"%s"}\n' "$attempt" "$status" "$integrity" >> browser-smoke-artifacts/pr2422-8ca/webgl-attempts/attempt-status.jsonl
            if [ "$status" -ne 0 ]; then failures=1; fi
            if [ "$integrity" = fail ]; then break; fi
          done
          exit "$failures"
      - name: Restore harness scripts and verify packages and original capture inputs
        if: always() && steps.runtime.outcome == 'success'
        env:
          GITHUB_SHA: be814def71f9d34d9d28d106631544ca5a8eb3f8
        run: |
          set -euo pipefail
          overlay_status=0
          if [ -f "$RUNNER_TEMP/overlay-snapshot.json" ]; then
            python3 - <<'PY' || overlay_status=$?
          import hashlib, json, os
          from pathlib import Path
          expected = json.loads((Path(os.environ["RUNNER_TEMP"]) / "overlay-snapshot.json").read_text())
          changed = set(__import__("subprocess").check_output(["git", "diff", "--name-only", "HEAD", "--"], text=True).splitlines())
          assert changed == set(expected), (sorted(changed), sorted(expected))
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          print("final harness overlay hashes match before restore")
          PY
          fi
          git checkout -- scripts/showcase-live-review.mjs scripts/showcase-renderer-readback.mjs
          node .github/ci/wasm-build.mjs verify
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          snap = json.loads((temp / "showcase-runtime-snapshot.json").read_text())
          for root in (temp / "showcase-runtime", Path("web")):
              for name, digest in snap["inventory"].items():
                  actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
                  assert actual == digest, (str(root), name, actual)
          if (temp / "showcase-capture-snapshot.json").exists():
              snap = json.loads((temp / "showcase-capture-snapshot.json").read_text())
              root = Path("browser-smoke-artifacts/pr2422-8ca/webgl-original")
              for name, digest in snap["inventory"].items():
                  actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
                  assert actual == digest, ("capture archive", name, actual)
          if (temp / "showcase-capture-inputs.json").exists():
              inputs = json.loads((temp / "showcase-capture-inputs.json").read_text())
              root = Path("browser-smoke-artifacts/showcase/webgl")
              for name, digest in inputs.items():
                  actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
                  assert actual == digest, ("consumed capture input", name, actual)
          subprocess.check_call(["git", "diff", "--quiet", "HEAD", "--"])
          print("post-run runtime and pinned source unchanged; capture-input checks ran when prepared")
          PY
          exit "$overlay_status"
      - name: Retain all WebGL attempts and original capture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr2422-8ca-webgl-live-diagnostic
          path: browser-smoke-artifacts/pr2422-8ca
          if-no-files-found: warn
          retention-days: 3

  product-evidence-summary:
    name: Summarize current and D7 cumulative product evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: be814def71f9d34d9d28d106631544ca5a8eb3f8
      - name: Download and authenticate pinned evidence and normal candidate packages
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p browser-smoke-artifacts/pr2422-8ca/product/{current-evidence,current-package,d7-evidence,d7-package}
          fetch_artifact() {
            local id="$1" digest="$2" output="$3"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/yongkyuns/noon/actions/artifacts/$id/zip" -o "$output.zip"
            python3 - "$output.zip" "$digest" "$output" <<'PY'
          import hashlib, os, stat, sys, zipfile
          from pathlib import Path, PurePosixPath
          archive, expected, destination = Path(sys.argv[1]), sys.argv[2], Path(sys.argv[3])
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert actual == expected, (str(archive), actual, expected)
          destination.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              for m in z.infolist():
                  p = PurePosixPath(m.filename)
                  assert not p.is_absolute() and ".." not in p.parts, m.filename
                  assert not stat.S_ISLNK(m.external_attr >> 16), m.filename
              z.extractall(destination)
          inventory = {p.relative_to(destination).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                       for p in sorted(destination.rglob("*")) if p.is_file()}
          assert inventory
          (destination / "../" / (destination.name + "-archive-inventory.json")).write_text(
              __import__("json").dumps({"zipSha256": actual, "inventory": inventory}, sort_keys=True))
          print(f"verified {archive.name}: sha256={actual}, files={len(inventory)}")
          PY
          }
          fetch_artifact 13396815095 e8fb562d7b39f6ff9fda02145cc8926ace16b0eed638115695aed7fd63f68815 browser-smoke-artifacts/pr2422-8ca/product/current-evidence
          fetch_artifact 13394652896 524d17616961c8b8fa9ade48432d51e1e987bb37c1f812dc1eb09ffca0d9da06 browser-smoke-artifacts/pr2422-8ca/product/current-package
          fetch_artifact 13392026858 545cc36e5226a27ef0beef9eed2029703e6b5c338d8de56b8a3ab088fb017414 browser-smoke-artifacts/pr2422-8ca/product/d7-evidence
          fetch_artifact 13391235889 77a11940c4e3bcc5ca9a98d01e469103d639a0f3c7f99d32d28fb4dd2cc8dd79 browser-smoke-artifacts/pr2422-8ca/product/d7-package
      - name: Write the bounded pair and package hash comparison
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          base = Path("browser-smoke-artifacts/pr2422-8ca/product")
          def reports(root):
              found = []
              for path in root.rglob("report.json"):
                  try: row = json.loads(path.read_text())
                  except Exception: continue
                  if isinstance(row, dict) and isinstance(row.get("exampleId"), str):
                      found.append((path, row))
              assert found, f"no product reports under {root}"
              return found
          def inventory(root):
              return {p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in sorted(root.rglob("*")) if p.is_file() and not p.name.endswith("archive-inventory.json")}
          def summarize(root):
              rows = []
              for path, row in reports(root):
                  rows.append({"file": path.relative_to(root).as_posix(), "exampleId": row.get("exampleId"),
                    "label": row.get("label"), "pair": row.get("pair"), "source": row.get("source"),
                    "runtimeIdentity": row.get("runtimeIdentity"), "runtime": row.get("runtime"),
                    "measurement": row.get("measurement"), "fps": row.get("fps"),
                    "rendererCosts": row.get("rendererCosts"), "presentationGaps": row.get("presentationGaps"),
                    "latencyMs": {k: row.get(k) for k in ("shellReadyMs", "coldRunMs", "warmRunMs", "editRunMs")},
                    "packageFiles": row.get("packageSizes", {}).get("files"), "pageErrors": row.get("pageErrors"),
                    "consoleErrors": row.get("consoleErrors"),
                    "hostHardwareNote": "CPU model and GPU adapter are not reported by these product reports"})
              rows.sort(key=lambda x: (x["exampleId"], str(x["label"]), str(x["pair"]), x["file"]))
              return rows
          packages = {}
          for name in ("current-package", "d7-package"):
              root = base / name
              manifests = list(root.rglob("ci-artifact.json"))
              identities = list(root.rglob("runtime-build-identity.json"))
              assert len(manifests) == 1 and len(identities) == 1, (name, manifests, identities)
              packages[name] = {"archive": json.loads((base / f"{name}-archive-inventory.json").read_text()),
                "ciArtifact": json.loads(manifests[0].read_text()), "runtimeIdentity": json.loads(identities[0].read_text()),
                "extractedFileHashes": inventory(root)}
          result = {"schemaVersion": 1, "purpose": "diagnostic evidence summary; not a performance qualification",
            "current8caCumulative": {"archive": json.loads((base / "current-evidence-archive-inventory.json").read_text()),
                                     "reports": summarize(base / "current-evidence")},
            "oldD7Cumulative": {"archive": json.loads((base / "d7-evidence-archive-inventory.json").read_text()),
                                 "reports": summarize(base / "d7-evidence")},
            "normalCandidatePackages": packages}
          for scope, package_name in (("current8caCumulative", "current-package"), ("oldD7Cumulative", "d7-package")):
              package = packages[package_name]
              candidate_rows = [row for row in result[scope]["reports"] if row["label"] == "candidate"]
              expected_workloads = {"parity-square-and-circle", "showcase-camera-follows-path",
                "showcase-first-scene", "showcase-raster-images", "showcase-bezier-paths"}
              counts = {example: sum(row["exampleId"] == example for row in candidate_rows)
                        for example in expected_workloads}
              assert len(candidate_rows) == 15 and set(counts.values()) == {3}, (scope, len(candidate_rows), counts)
              assert {row["exampleId"] for row in candidate_rows} == expected_workloads, (scope, counts)
              manifest_files = package["ciArtifact"]["files"]
              package_hashes = {name: digest for name, digest in manifest_files.items()
                                if name != "web/ci-Cargo.lock"}
              for row in candidate_rows:
                  assert row["runtimeIdentity"] == package["runtimeIdentity"], (scope, row["file"], "runtime identity mismatch")
                  row_hashes = {name: item["sha256"] for name, item in row["packageFiles"].items()}
                  assert row_hashes == package_hashes, (scope, row["file"], "reported package hashes mismatch candidate artifact")
          out = base / "summary.json"
          out.write_text(json.dumps(result, sort_keys=True, indent=2) + "\n")
          for label, key in (("current 8ca", "current8caCumulative"), ("old D7", "oldD7Cumulative")):
              focused = [row for row in result[key]["reports"] if row["exampleId"] == "showcase-bezier-paths"]
              assert len(focused) == 6, (label, len(focused), "expected 3 baseline/candidate pairs")
              print(f"{label} showcase-bezier-paths cumulative rows (source, runtime, FPS window/costs, package hashes):")
              for row in focused:
                  print(json.dumps(row, sort_keys=True, separators=(",", ":")))
          print(f"wrote {out}: current reports={len(result['current8caCumulative']['reports'])}, "
                f"D7 reports={len(result['oldD7Cumulative']['reports'])}, candidate packages=2")
          PY
      - name: Retain current and D7 product evidence summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr2422-8ca-product-evidence-summary
          path: browser-smoke-artifacts/pr2422-8ca/product
          if-no-files-found: warn
          retention-days: 3
