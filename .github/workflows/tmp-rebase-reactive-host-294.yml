name: Rebase reactive host prerequisite

on:
  push:
    branches:
      - tmp/rebase-reactive-host-294-latest

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/rebase-reactive-host-294-latest
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Layer validated prerequisite onto current master
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          set +e
          git cherry-pick 03bc69f131487b0af1e70aa33096b40728195323
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U | sort)"
            expected="web/python/_manim_updaters.py"
            if [ "$unresolved" != "$expected" ]; then
              echo "Unexpected conflict set:" >&2
              printf '%s\n' "$unresolved" >&2
              exit 1
            fi
            git checkout --ours web/python/_manim_updaters.py
            python3 scripts/tmp_resolve_reactive_host_294.py
            git add web/python/_manim_geometry.py web/python/_manim_updaters.py
            GIT_EDITOR=true git cherry-pick --continue
          fi
      - name: Validate merged prerequisite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: web/python
        run: |
          cargo fmt --all -- --check
          cargo test -p noon-core -p noon-compile -p noon-runtime -p noon-web
          python3 scripts/semantic_ownership_check.py
          python3 -m unittest web.python.test_moving_dots_primitives web.python.test_updater_snapshot web.python.test_manim_tutorial_examples
          git diff 10de12d2fe8547b201ddffd9aed68dec309df187...HEAD --check
      - name: Remove temporary resolver and publish validated tree
        run: |
          rm .github/workflows/tmp-rebase-reactive-host-294.yml scripts/tmp_resolve_reactive_host_294.py
          git add -u .github/workflows/tmp-rebase-reactive-host-294.yml scripts/tmp_resolve_reactive_host_294.py
          git commit -m "Remove temporary #294 rebase helpers"
          git push origin HEAD:tmp/rebase-reactive-host-294-latest
