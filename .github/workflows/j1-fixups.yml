name: J1 fixups

on:
  push:
    branches:
      - arch/j1-native-input-signals

permissions:
  contents: write

jobs:
  fixups:
    if: github.event.head_commit.message != 'Add native input compatibility regressions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/j1-native-input-signals
      - name: Apply compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          reactive = Path('web/python/_manim_reactive.py')
          text = reactive.read_text()
          anchor = '\n\ndef install() -> None:\n'
          public = '''\n\npublic = {\n    "ValueTracker": ValueTracker,\n    "NativeVectorSignal": NativeVectorSignal,\n    "NativeBoolSignal": NativeBoolSignal,\n}\n'''
          if 'public = {\n    "ValueTracker": ValueTracker,' not in text:
              if anchor not in text:
                  raise SystemExit('reactive install anchor not found')
              text = text.replace(anchor, public + anchor, 1)
              reactive.write_text(text)

          smoke = Path('scripts/reactive-runtime-smoke.mjs')
          text = smoke.read_text()
          anchor = '''  const authored = await page.evaluate(\n    (pythonSource) => window.noonManimCompat.run(pythonSource),\n    source,\n  );\n\n'''
          assertion = '''  const authored = await page.evaluate(\n    (pythonSource) => window.noonManimCompat.run(pythonSource),\n    source,\n  );\n  assert.deepEqual(\n    authored.document.native_inputs ?? [],\n    [],\n    "ordinary ValueTracker authoring must not declare native input ownership",\n  );\n\n'''
          if 'ordinary ValueTracker authoring must not declare native input ownership' not in text:
              if anchor not in text:
                  raise SystemExit('reactive smoke anchor not found')
              text = text.replace(anchor, assertion, 1)
              smoke.write_text(text)
          PY
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/python/_manim_reactive.py scripts/reactive-runtime-smoke.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add native input compatibility regressions'
          git push origin HEAD:arch/j1-native-input-signals
