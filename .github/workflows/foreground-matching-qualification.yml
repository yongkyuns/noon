name: Foreground matching qualification

on:
  pull_request:
    paths:
      - 'crates/noon*/**'
      - 'web/python/**'
      - 'web/*semantic*'
      - 'web/*authoring*'
      - 'web/manim-raster-host*'
      - 'scripts/manim-raster-*'
      - 'scripts/shared-playback-raster*'
      - 'scripts/foreground-matching-*'
      - 'parity/manim-v0.21/core-examples/foreground_matching.py'
      - 'parity/manim-v0.21/foreground-matching-manifest.json'
      - '.github/actions/dev-wasm-build/**'
      - '.github/workflows/foreground-matching-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foreground-matching-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overlap-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NOON_MANIM_RASTER_MANIFEST: parity/manim-v0.21/foreground-matching-manifest.json
      NOON_MANIM_RASTER_ARTIFACTS: foreground-matching-artifacts
      NOON_MANIM_RASTER_BACKENDS: webgpu,webgl
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Record source identity before building
        env:
          QUALIFIED_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          mkdir -p ci-artifacts/foreground-matching
          git rev-parse HEAD > ci-artifacts/foreground-matching/source-sha.txt
          printf '%s\n' "$QUALIFIED_BASE" > ci-artifacts/foreground-matching/base-sha.txt
          git status --porcelain --untracked-files=all > ci-artifacts/foreground-matching/worktree-before.txt
          git diff "$QUALIFIED_BASE" HEAD --binary > ci-artifacts/foreground-matching/integration.diff
      - name: Test overlap assertions and missing-evidence rejection
        run: |
          node --test scripts/foreground-matching-*.test.mjs
          python3 scripts/foreground-matching-membership.test.py
      - name: Build exact-source browser package
        uses: ./.github/actions/dev-wasm-build
        with:
          preflight: 'true'
          cache-ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Cairo reference and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config
          python -m pip install --disable-pip-version-check 'manim==0.21.0'
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Capture pinned Manim and real Python-worker overlap frames
        id: raster
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/foreground-matching
          node scripts/manim-raster-differential.mjs 2>&1 | tee ci-artifacts/foreground-matching/raster.log
      - name: Enforce whole-frame raster tolerances
        id: tolerances
        if: always() && steps.raster.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/foreground-matching
          node scripts/manim-raster-enforce.mjs 2>&1 | tee ci-artifacts/foreground-matching/tolerances.log
      - name: Prove actual overlap order and visible target occurrences
        id: witnesses
        if: always() && steps.raster.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/foreground-matching
          node scripts/foreground-matching-checks.mjs 2>&1 | tee ci-artifacts/foreground-matching/witnesses.log
      - name: Prove sparse and dense forward playback agree exactly
        id: cadence
        if: always() && steps.raster.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/foreground-matching
          node scripts/shared-playback-raster.mjs 2>&1 | tee ci-artifacts/foreground-matching/cadence.log
      - name: Record qualification outcomes
        if: always()
        env:
          RASTER: ${{ steps.raster.outcome }}
          TOLERANCES: ${{ steps.tolerances.outcome }}
          WITNESSES: ${{ steps.witnesses.outcome }}
          CADENCE: ${{ steps.cadence.outcome }}
        run: |
          mkdir -p ci-artifacts/foreground-matching
          printf 'raster=%s\ntolerances=%s\nwitnesses=%s\ncadence=%s\n' \
            "$RASTER" "$TOLERANCES" "$WITNESSES" "$CADENCE" \
            > ci-artifacts/foreground-matching/outcomes.txt
      - name: Retain source, reference, pixels and strict verdicts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foreground-matching-${{ github.sha }}
          path: |
            ci-artifacts/foreground-matching
            foreground-matching-artifacts
          retention-days: 14
          if-no-files-found: error
      - name: Require every qualification stage
        if: always()
        env:
          RASTER: ${{ steps.raster.outcome }}
          TOLERANCES: ${{ steps.tolerances.outcome }}
          WITNESSES: ${{ steps.witnesses.outcome }}
          CADENCE: ${{ steps.cadence.outcome }}
        run: |
          test "$RASTER" = success
          test "$TOLERANCES" = success
          test "$WITNESSES" = success
          test "$CADENCE" = success
