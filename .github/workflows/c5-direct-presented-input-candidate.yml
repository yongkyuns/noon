name: C5 direct WASM presented input qualification
on:
  push:
    branches: [validation/c5-direct-presented-input-20260921]
permissions:
  contents: read
concurrency:
  group: c5-direct-presented-input-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Assemble verified follow-up on published direct receipt base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/proof"
          base64 -d candidate/c5-direct-presented-input/postfmt002.b64 | xz -d > "$GITHUB_WORKSPACE/proof/input.patch"
          echo '7c49222afcef562abb188631118a5e36ae78b59c63e383a86f8e66652e0921b3  proof/input.patch' | sha256sum -c -
          git worktree add --detach "$RUNNER_TEMP/candidate" 44876d164a868349b9caee6c60317b06f227883c
          test "$(git -C "$RUNNER_TEMP/candidate" rev-parse HEAD^{tree})" = e389c705ed29aa9428a445fef1792e568f47a8aa
          git -C "$RUNNER_TEMP/candidate" apply --check "$GITHUB_WORKSPACE/proof/input.patch"
          git -C "$RUNNER_TEMP/candidate" apply "$GITHUB_WORKSPACE/proof/input.patch"
          for patch in "$GITHUB_WORKSPACE"/candidate/c5-direct-presented-input/followup*.patch; do
            if [ -f "$patch" ]; then
              git -C "$RUNNER_TEMP/candidate" apply "$patch"
              cp "$patch" "$GITHUB_WORKSPACE/proof/"
            fi
          done
          echo "CANDIDATE=$RUNNER_TEMP/candidate" >> "$GITHUB_ENV"
          echo "PROOF=$GITHUB_WORKSPACE/proof" >> "$GITHUB_ENV"
      - name: Use repository-pinned Rust
        run: |
          cd "$CANDIDATE"
          rustup install
          rustup target add wasm32-unknown-unknown
          rustc --version --verbose | tee "$PROOF/rust.txt"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with: {version: v0.16.0}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: c5-direct-presented-cargo-${{ runner.os }}-${{ hashFiles('crates/**/Cargo.toml') }}
          restore-keys: |
            c5-direct-presented-cargo-${{ runner.os }}-
            ${{ runner.os }}-cargo-sources-
      - name: Format and retain exact full source tree
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          cargo fmt --all
          git add -A
          git diff --cached --check
          git write-tree | tee "$PROOF/tree.txt"
          git diff --cached --binary --full-index > "$PROOF/formatted.patch"
          git diff --cached --stat > "$PROOF/stat.txt"
          git archive --format=tar --prefix=source/ "$(cat "$PROOF/tree.txt")" | gzip > "$PROOF/source.tar.gz"
      - name: Execute direct receipt and shared frame regressions
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          cargo test -p noon-web --all-features --lib direct_pointer_presentation::tests -- --nocapture 2>&1 | tee "$PROOF/receipts.log"
          cargo test -p noon --no-default-features --lib execution_session::input::presentation::tests -- --nocapture 2>&1 | tee "$PROOF/shared.log"
      - name: Execute repository fast gate and JavaScript regressions
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          bash scripts/check.sh fast 44876d164a868349b9caee6c60317b06f227883c 2>&1 | tee "$PROOF/fast.log"
          node --test web/*.test.mjs 2>&1 | tee "$PROOF/js.log"
          node --test .github/ci/*.test.mjs scripts/pointer-selection-raster-contract.test.mjs 2>&1 | tee "$PROOF/contracts.log"
      - name: Compile reduced direct Rust and browser WASM
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          cargo check -p noon --no-default-features --target wasm32-unknown-unknown 2>&1 | tee "$PROOF/wasm-direct.log"
          cargo check -p noon-web --no-default-features --target wasm32-unknown-unknown 2>&1 | tee "$PROOF/wasm-browser.log"
      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with: {tool: 'wasm-pack@0.15.0', fallback: none}
      - name: Build actual renderer-smoke browser package with preflight
        env:
          NOON_WASM_SKIP_OPT: '1'
          NOON_RENDERER_SMOKE: '1'
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          bash scripts/build-web-demo.sh 2>&1 | tee "$PROOF/browser-build.log"
          sha256sum web/pkg/noon_web_bg.wasm > "$PROOF/wasm.sha256"
      - name: Install browser qualification dependencies
        run: |
          cd "$CANDIDATE"
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Qualify direct receipt recovery and autonomous publication on both backends
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          node scripts/direct-pointer-presentation-qualification.mjs 2>&1 | tee "$PROOF/browser-receipts.log"
      - name: Qualify DOM and paired Rust Python selection regressions
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          node scripts/browser-pointer-input-smoke.mjs 2>&1 | tee "$PROOF/browser-dom.log"
          node scripts/pointer-selection-qualification.mjs 2>&1 | tee "$PROOF/browser-worker.log"
          node scripts/pointer-selection-direct-qualification.mjs 2>&1 | tee "$PROOF/browser-direct-parity.log"
          node scripts/native-input-smoke.mjs 2>&1 | tee "$PROOF/reactive-input.log"
      - name: Prove real browser regression detects omitted surface cancellation
        env:
          NOON_WASM_SKIP_OPT: '1'
          NOON_RENDERER_SMOKE: '1'
          NOON_SKIP_WEB_PREFLIGHT: '1'
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          file=crates/noon-web/src/execution_canvas.rs
          cp "$file" "$RUNNER_TEMP/canvas-original.rs"
          cp -r web/pkg "$RUNNER_TEMP/passing-pkg"
          trap 'cp "$RUNNER_TEMP/canvas-original.rs" "$file"; rm -rf web/pkg; cp -r "$RUNNER_TEMP/passing-pkg" web/pkg' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/noon-web/src/execution_canvas.rs')
          s = p.read_text()
          guard = 'self.apply_direct_native_input(|source| source.cancel_browser_pointer(false))?;'
          assert s.count(guard) == 1
          p.write_text(s.replace(guard, '// Deliberately omit gesture cancellation for the negative control.'))
          PY
          bash scripts/build-web-demo.sh > "$PROOF/surface-mutation-build.log" 2>&1
          if NOON_POINTER_PRESENTATION_ARTIFACTS="$PROOF/surface-mutation" node scripts/direct-pointer-presentation-qualification.mjs > "$PROOF/surface-mutation.log" 2>&1; then
            echo 'omitted surface cancellation unexpectedly passed' >&2
            exit 1
          fi
          grep -q 'repainted-surface-release-must-not-click' "$PROOF/surface-mutation.log"
          cp "$RUNNER_TEMP/canvas-original.rs" "$file"
          rm -rf web/pkg
          cp -r "$RUNNER_TEMP/passing-pkg" web/pkg
          trap - EXIT
          git diff --exit-code
          sha256sum -c "$PROOF/wasm.sha256"
      - name: Prove regression detects omitted receipt-only refresh
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          file=crates/noon-web/src/direct_pointer_presentation.rs
          cp "$file" "$RUNNER_TEMP/receipt-original.rs"
          trap 'cp "$RUNNER_TEMP/receipt-original.rs" "$file"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/noon-web/src/direct_pointer_presentation.rs')
          s = p.read_text()
          start = s.index('    pub(crate) fn needs_refresh(')
          end = s.index('    pub(crate) fn invalidate(', start)
          p.write_text(s[:start] + '    pub(crate) fn needs_refresh(&self, _session: &ExecutionSession) -> bool { self.refresh_pending }\n\n' + s[end:])
          PY
          if cargo test -p noon-web --all-features --lib signal_only_publication_requests_receipt_refresh_without_scene_dirtiness -- --nocapture > "$PROOF/refresh-mutation.log" 2>&1; then
            echo 'omitted receipt-only refresh unexpectedly passed' >&2
            exit 1
          fi
          grep -q 'signal_only_publication_requests_receipt_refresh_without_scene_dirtiness ... FAILED' "$PROOF/refresh-mutation.log"
          cp "$RUNNER_TEMP/receipt-original.rs" "$file"
          trap - EXIT
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$PROOF/tree.txt")"
          echo passed > "$PROOF/qualification.txt"
      - name: Retain browser evidence even when qualification fails
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/candidate/browser-smoke-artifacts" ]; then
            cp -r "$RUNNER_TEMP/candidate/browser-smoke-artifacts" proof/
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: c5-direct-presented-input-proof
          path: proof/
          if-no-files-found: error
          retention-days: 7
  publish-tested-source:
    needs: qualify
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 44876d164a868349b9caee6c60317b06f227883c
          fetch-depth: 1
      - uses: actions/download-artifact@v8
        with:
          name: c5-direct-presented-input-proof
          path: ${{ runner.temp }}/proof
      - name: Publish clean tested follow-up without validation ancestry
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/proof"
          test "$(cat "$proof/qualification.txt")" = passed
          git apply "$proof/formatted.patch"
          git add -A
          test "$(git write-tree)" = "$(cat "$proof/tree.txt")"
          git diff --cached --exit-code -- .github/workflows
          git -c user.name='Yongkyun Shin' -c user.email='4311628+yongkyuns@users.noreply.github.com' commit -m 'C5: cancel direct gestures on surface reset and refresh receipt-only publications'
          git push origin HEAD:refs/heads/staging/c5-direct-receipt-recovery-${{ github.run_id }}
          git rev-parse HEAD > "$RUNNER_TEMP/published.txt"
          git rev-parse HEAD^{tree} >> "$RUNNER_TEMP/published.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: c5-direct-presented-input-publication
          path: ${{ runner.temp }}/published.txt
          retention-days: 7
