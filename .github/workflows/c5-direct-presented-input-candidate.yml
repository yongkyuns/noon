name: C5 direct WASM presented input qualification
on:
  push:
    branches: [validation/c5-direct-presented-input-20260921]
permissions:
  contents: read
concurrency:
  group: c5-direct-presented-input-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Assemble source on exact native receipt base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/proof"
          cat candidate/c5-direct-presented-input/part*.b64 | base64 -d | xz -d > "$GITHUB_WORKSPACE/proof/input.patch"
          echo '313a4fb76e00d543a68e297d19d6380e1feec7ffc0867d13218a99d1cea4177e  proof/input.patch' | sha256sum -c -
          git worktree add --detach "$RUNNER_TEMP/candidate" c7b574b8a195b1e3954fc622db9c151d3ccab09d
          git -C "$RUNNER_TEMP/candidate" apply --check "$GITHUB_WORKSPACE/proof/input.patch"
          git -C "$RUNNER_TEMP/candidate" apply "$GITHUB_WORKSPACE/proof/input.patch"
          for patch in "$GITHUB_WORKSPACE"/candidate/c5-direct-presented-input/fix*.patch; do
            if [ -f "$patch" ]; then
              git -C "$RUNNER_TEMP/candidate" apply "$patch"
              cp "$patch" "$GITHUB_WORKSPACE/proof/"
            fi
          done
          echo "CANDIDATE=$RUNNER_TEMP/candidate" >> "$GITHUB_ENV"
          echo "PROOF=$GITHUB_WORKSPACE/proof" >> "$GITHUB_ENV"
      - name: Use repository-pinned Rust
        run: |
          cd "$CANDIDATE"
          rustup install
          rustup target add wasm32-unknown-unknown
          rustc --version --verbose | tee "$PROOF/rust.txt"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with: {version: v0.16.0}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: c5-direct-presented-cargo-${{ runner.os }}-${{ hashFiles('crates/**/Cargo.toml') }}
          restore-keys: |
            c5-direct-presented-cargo-${{ runner.os }}-
            ${{ runner.os }}-cargo-sources-
      - name: Format and retain exact full source tree
        run: |
          cd "$CANDIDATE"
          cargo fmt --all
          git add -A
          git diff --cached --check
          git write-tree | tee "$PROOF/tree.txt"
          git diff --cached --binary --full-index > "$PROOF/formatted.patch"
          git diff --cached --stat > "$PROOF/stat.txt"
          git archive --format=tar --prefix=source/ "$(cat "$PROOF/tree.txt")" | gzip > "$PROOF/source.tar.gz"
      - name: Execute direct receipt and shared frame regressions
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          cargo test -p noon-web --all-features --lib direct_pointer_presentation::tests -- --nocapture 2>&1 | tee "$PROOF/receipts.log"
          cargo test -p noon --no-default-features --lib execution_session::input::presentation::tests -- --nocapture 2>&1 | tee "$PROOF/shared.log"
      - name: Execute repository fast gate and JavaScript regressions
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          bash scripts/check.sh fast c7b574b8a195b1e3954fc622db9c151d3ccab09d 2>&1 | tee "$PROOF/fast.log"
          node --test web/*.test.mjs 2>&1 | tee "$PROOF/js.log"
      - name: Compile reduced direct Rust and browser WASM
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          cargo check -p noon --no-default-features --target wasm32-unknown-unknown 2>&1 | tee "$PROOF/wasm-direct.log"
          cargo check -p noon-web --no-default-features --target wasm32-unknown-unknown 2>&1 | tee "$PROOF/wasm-browser.log"
      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with: {tool: 'wasm-pack@0.15.0', fallback: none}
      - name: Build actual renderer-smoke browser package
        env:
          NOON_WASM_SKIP_OPT: '1'
          NOON_RENDERER_SMOKE: '1'
          NOON_SKIP_WEB_PREFLIGHT: '1'
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          bash scripts/build-web-demo.sh 2>&1 | tee "$PROOF/browser-build.log"
      - name: Install browser qualification dependencies
        run: |
          cd "$CANDIDATE"
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Qualify actual direct presentation and stale DOM input on both GPU backends
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          node scripts/direct-pointer-presentation-qualification.mjs 2>&1 | tee "$PROOF/browser-receipts.log"
      - name: Qualify existing DOM and paired Rust Python selection regressions
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          node --test scripts/pointer-selection-raster-contract.test.mjs 2>&1 | tee "$PROOF/raster-contract.log"
          node scripts/browser-pointer-input-smoke.mjs 2>&1 | tee "$PROOF/browser-dom.log"
          node scripts/pointer-selection-qualification.mjs 2>&1 | tee "$PROOF/browser-worker.log"
          node scripts/pointer-selection-direct-qualification.mjs 2>&1 | tee "$PROOF/browser-direct-parity.log"
      - name: Prove regression detects removal of post-binding publication guard
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          file=crates/noon-web/src/browser_pointer_input.rs
          cp "$file" "$RUNNER_TEMP/input-original.rs"
          trap 'cp "$RUNNER_TEMP/input-original.rs" "$file"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/noon-web/src/browser_pointer_input.rs')
          s = p.read_text()
          guard = 'frame.input_token(target.session(), view)?;'
          assert s.count(guard) == 1
          p.write_text(s.replace(guard, 'let _ = view;'))
          PY
          if cargo test -p noon-web --all-features --lib binding_reset_is_revalidated_before_positional_admission -- --nocapture > "$PROOF/post-binding-mutation.log" 2>&1; then
            echo 'omitted post-binding guard unexpectedly passed' >&2
            exit 1
          fi
          grep -q 'binding_reset_is_revalidated_before_positional_admission ... FAILED' "$PROOF/post-binding-mutation.log"
          cp "$RUNNER_TEMP/input-original.rs" "$file"
          trap - EXIT
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$PROOF/tree.txt")"
          echo passed > "$PROOF/qualification.txt"
      - name: Retain browser evidence even when qualification fails
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/candidate/browser-smoke-artifacts" ]; then
            cp -r "$RUNNER_TEMP/candidate/browser-smoke-artifacts" proof/
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: c5-direct-presented-input-proof
          path: proof/
          if-no-files-found: error
          retention-days: 7
  publish-tested-source:
    needs: qualify
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c7b574b8a195b1e3954fc622db9c151d3ccab09d
          fetch-depth: 1
      - uses: actions/download-artifact@v8
        with:
          name: c5-direct-presented-input-proof
          path: ${{ runner.temp }}/proof
      - name: Publish clean tested source without validation ancestry
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/proof"
          test "$(cat "$proof/qualification.txt")" = passed
          git apply "$proof/formatted.patch"
          git add -A
          test "$(git write-tree)" = "$(cat "$proof/tree.txt")"
          git -c user.name='Yongkyun Shin' -c user.email='4311628+yongkyuns@users.noreply.github.com' commit -m 'C5: associate direct WASM pointer input with successful canvas presentation'
          git push origin HEAD:refs/heads/staging/c5-direct-presented-input-${{ github.run_id }}
          git rev-parse HEAD > "$RUNNER_TEMP/published.txt"
          git rev-parse HEAD^{tree} >> "$RUNNER_TEMP/published.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: c5-direct-presented-input-publication
          path: ${{ runner.temp }}/published.txt
          retention-days: 7
