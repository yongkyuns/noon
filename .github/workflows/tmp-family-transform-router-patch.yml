# Temporary branch-only patcher; remove after the router commit lands.
name: Temporary family Transform router patch

on:
  push:
    branches:
      - codex/family-transform-appearance-restoration

permissions:
  contents: write

jobs:
  patch-router:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/family-transform-appearance-restoration
      - name: Route straight flat family transforms through family channels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/noon/src/execution_session.rs")
          text = path.read_text()
          signature = "Straight flat family transforms must share one correspondence/lifecycle"
          if signature in text:
              raise SystemExit(0)
          indent = " " * 16
          marker = indent + "match store.ordered_family_leaf_pairs(*source, *target_state) {"
          if text.count(marker) != 1:
              raise SystemExit(f"expected one family router marker, found {text.count(marker)}")
          block = "\n".join([
              indent + "// " + signature,
              indent + "// authority regardless of whether the endpoint cardinalities happen to match.",
              indent + "// The canonical family channel owns padding appearance, including restoration",
              indent + "// after an earlier unequal-family contraction. Curved equal-family transforms",
              indent + "// keep the per-leaf path below because each leaf owns the authored path arc.",
              indent + "if !curved && is_flat_family(*source) && is_flat_family(*target_state) {",
              indent + "    let mut options = *options;",
              indent + "    if options.path_arc.is_some_and(|arc| {",
              indent + "        arc.abs() < noon_core::MANIM_STRAIGHT_PATH_ARC_THRESHOLD",
              indent + "    }) {",
              indent + "        options.path_arc = None;",
              indent + "    }",
              indent + "    return Ok(declaration.create_family_transform_animation(",
              indent + "        *source,",
              indent + "        *target_state,",
              indent + "        options,",
              indent + "    ));",
              indent + "}",
              "",
          ])
          path.write_text(text.replace(marker, block + marker, 1))
          PY
      - name: Commit router patch
        shell: bash
        run: |
          if git diff --quiet -- crates/noon/src/execution_session.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/noon/src/execution_session.rs
          git commit -m "Route straight flat family transforms through family channels"
          git push origin HEAD:codex/family-transform-appearance-restoration
