name: R3 boundary development
on:
  push:
    branches: [codex/1292-r3-boundary-prep]
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 166b166f25e27a13d2d940f8ac802d0e59fc2f8f
          fetch-depth: 0
      - name: Check the combination with new master without changing either product branch
        run: |
          mkdir -p /tmp/r3-compatibility
          git config user.name 'Yongkyun Shin'
          git config user.email '4311628+yongkyuns@users.noreply.github.com'
          git merge --no-ff --no-edit 71d8bfac1094e8232ae7f4b89872af2a1baff9db
          git diff --check
          git rev-parse HEAD HEAD^{tree} HEAD^1 HEAD^2 > /tmp/r3-compatibility/revisions.txt
          git diff 166b166f25e27a13d2d940f8ac802d0e59fc2f8f HEAD > /tmp/r3-compatibility/master-delta.patch
          git archive --format=tar.gz HEAD > /tmp/r3-compatibility/source.tar.gz
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Existing root-order acceptance and transaction regressions
        run: |
          set -o pipefail
          cargo test -p noon --test root_order_acceptance --test root_order_transaction_regressions 2>&1 | tee /tmp/r3-compatibility/root-order.log
      - name: Native fast gate on the combined tree
        run: |
          set -o pipefail
          bash scripts/check.sh fast 71d8bfac1094e8232ae7f4b89872af2a1baff9db 2>&1 | tee /tmp/r3-compatibility/native.log
      - name: Web static and Python tests
        run: |
          set -o pipefail
          NOON_WEB_PREFLIGHT_ONLY=1 bash scripts/build-web-demo.sh 2>&1 | tee /tmp/r3-compatibility/preflight.log
      - name: Build actual dev WASM from the combined tree
        run: |
          set -o pipefail
          rustup target add wasm32-unknown-unknown
          NOON_SKIP_WEB_PREFLIGHT=1 NOON_WASM_PROFILE=dev NOON_WASM_SKIP_OPT=1 bash scripts/build-web-demo.sh 2>&1 | tee /tmp/r3-compatibility/wasm.log
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.62.1
      - name: Install pinned browser dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Real WASM and Python categories, atomicity and recovery
        run: |
          set -o pipefail
          node scripts/typed-authoring-errors-smoke.mjs 2>&1 | tee /tmp/r3-compatibility/errors-browser.log
          node scripts/manim-compat-smoke.mjs 2>&1 | tee /tmp/r3-compatibility/manim-browser.log
      - name: Retain exact dependencies and final state
        if: always()
        run: |
          test ! -f Cargo.lock || cp Cargo.lock /tmp/r3-compatibility/Cargo.lock
          test ! -d browser-smoke-artifacts/typed-authoring-errors || cp -a browser-smoke-artifacts/typed-authoring-errors /tmp/r3-compatibility/browser
          test ! -f web/pkg/noon_web_bg.wasm || sha256sum web/pkg/* > /tmp/r3-compatibility/wasm-sha256.txt
          git status --short > /tmp/r3-compatibility/status.txt
          git rev-parse HEAD > /tmp/r3-compatibility/final-head.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r3-live-properties-current-master
          path: /tmp/r3-compatibility
          retention-days: 7
