name: R3 boundary development
on:
  push:
    branches: [codex/1292-r3-boundary-prep]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Assemble the bounded advancement projection
        run: |
          mkdir -p /tmp/r3-advance/product /tmp/r3-advance/combined
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          text = pathlib.Path('.github/r3-advance.b64').read_text().strip()
          # Correct a two-character transcription insertion; both exact source
          # checksums remain mandatory before any patch can be applied.
          text = text.replace('jb2/OX5u785f', 'jb2/OX785f')
          assert hashlib.sha256(text.encode()).hexdigest() == '43febbfff1f6b07c604a7964ea1ab63f59b7daa75689193b4d6a75fc8aa90ac2'
          patch = gzip.decompress(base64.b64decode(text, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'a4d3226d739f2184aa2929d4a88b77bc2783ef70c0f6bf71123d893fe8818851'
          pathlib.Path('/tmp/r3-advance/input.patch').write_bytes(patch)
          PY
          git checkout --detach 166b166f25e27a13d2d940f8ac802d0e59fc2f8f
          git apply --index /tmp/r3-advance/input.patch
          cargo fmt --all
          git add -u
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git config user.name 'Yongkyun Shin'
          git config user.email '4311628+yongkyuns@users.noreply.github.com'
          git commit -m 'fix: preserve typed live advancement errors through WASM and Python'
          git rev-parse HEAD HEAD^{tree} > /tmp/r3-advance/product/revisions.txt
          git rev-parse HEAD > /tmp/r3-advance/product-head.txt
          git diff HEAD^ HEAD > /tmp/r3-advance/product.patch
          git archive --format=tar.gz HEAD > /tmp/r3-advance/product/source.tar.gz
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Exact product native fast gate and advancement regressions
        run: |
          set -o pipefail
          cargo test -p noon-web --lib live_advance_projection -- --nocapture 2>&1 | tee /tmp/r3-advance/product/focused.log
          bash scripts/check.sh fast 166b166f25e27a13d2d940f8ac802d0e59fc2f8f 2>&1 | tee /tmp/r3-advance/product/native.log
          NOON_WEB_PREFLIGHT_ONLY=1 bash scripts/build-web-demo.sh 2>&1 | tee /tmp/r3-advance/product/preflight.log
      - name: Build actual product WASM
        run: |
          set -o pipefail
          rustup target add wasm32-unknown-unknown
          NOON_SKIP_WEB_PREFLIGHT=1 NOON_WASM_PROFILE=dev NOON_WASM_SKIP_OPT=1 bash scripts/build-web-demo.sh 2>&1 | tee /tmp/r3-advance/product/wasm.log
          cp -a web/pkg /tmp/r3-advance/product/web-pkg
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.62.1
      - name: Install pinned browser dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Exact product real WASM and Python regressions
        run: |
          set -o pipefail
          NOON_TYPED_ERRORS_ARTIFACTS=/tmp/r3-advance/product/browser node scripts/typed-authoring-errors-smoke.mjs 2>&1 | tee /tmp/r3-advance/product/errors-browser.log
          node scripts/manim-compat-smoke.mjs 2>&1 | tee /tmp/r3-advance/product/manim-browser.log
          git diff --exit-code
          git status --short > /tmp/r3-advance/product/status.txt
          cp Cargo.lock /tmp/r3-advance/product/Cargo.lock
      - name: Integrate freshly checked master only for compatibility qualification
        run: |
          git merge --no-edit 0eca24ef7c74478d0810332179a9197f19a1c39c
          git rev-parse HEAD HEAD^{tree} HEAD^1 HEAD^2 > /tmp/r3-advance/combined/revisions.txt
          git archive --format=tar.gz HEAD > /tmp/r3-advance/combined/source.tar.gz
      - name: Combined native and web qualification
        run: |
          set -o pipefail
          cargo test -p noon --test root_order_acceptance --test root_order_transaction_regressions 2>&1 | tee /tmp/r3-advance/combined/root-order.log
          bash scripts/check.sh fast 0eca24ef7c74478d0810332179a9197f19a1c39c 2>&1 | tee /tmp/r3-advance/combined/native.log
          NOON_WEB_PREFLIGHT_ONLY=1 bash scripts/build-web-demo.sh 2>&1 | tee /tmp/r3-advance/combined/preflight.log
          NOON_SKIP_WEB_PREFLIGHT=1 NOON_WASM_PROFILE=dev NOON_WASM_SKIP_OPT=1 bash scripts/build-web-demo.sh 2>&1 | tee /tmp/r3-advance/combined/wasm.log
          NOON_TYPED_ERRORS_ARTIFACTS=/tmp/r3-advance/combined/browser node scripts/typed-authoring-errors-smoke.mjs 2>&1 | tee /tmp/r3-advance/combined/errors-browser.log
          node scripts/manim-compat-smoke.mjs 2>&1 | tee /tmp/r3-advance/combined/manim-browser.log
          git diff --exit-code
          git status --short > /tmp/r3-advance/combined/status.txt
          cp Cargo.lock /tmp/r3-advance/combined/Cargo.lock
      - name: Publish only the verified incremental product commit
        run: |
          git checkout --detach "$(cat /tmp/r3-advance/product-head.txt)"
          git push origin HEAD:refs/heads/codex/1292-r3-advancement
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r3-advancement-qualification
          path: /tmp/r3-advance
          retention-days: 7
