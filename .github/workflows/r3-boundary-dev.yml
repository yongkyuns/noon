name: R3 boundary development
on:
  push:
    branches: [codex/1292-r3-boundary-prep]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Assemble only the incremental live-property projection
        run: |
          mkdir -p /tmp/r3-property-evidence
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          encoded = pathlib.Path('.github/r3-live-properties.b64').read_text().strip()
          encoded = encoded.replace('LOW3TnPFs/v', 'LOW3TnUs/v')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '2051c276cb977ce6d18ebee75580bfda2239d69a365ec9b9710a06317500a987'
          pathlib.Path('/tmp/r3-property-evidence/input.patch').write_bytes(patch)
          PY
          parent=ef2e4a894a7795471795e62351c8241db59af4ce
          git checkout --detach "$parent"
          git apply --index /tmp/r3-property-evidence/input.patch
          cargo fmt --all
          git add -u
          git diff --cached --check
          git config user.name 'Yongkyun Shin'
          git config user.email '4311628+yongkyuns@users.noreply.github.com'
          git commit -m 'fix: retain typed live transform failures through WASM and Python'
          git rev-parse HEAD HEAD^{tree} > /tmp/r3-property-evidence/revisions.txt
          echo "$parent" > /tmp/r3-property-evidence/base.txt
          git diff "$parent" HEAD > /tmp/r3-property-evidence/product.patch
          git archive --format=tar.gz HEAD > /tmp/r3-property-evidence/source.tar.gz
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Focused native atomicity and incremental delta regression
        run: |
          set -o pipefail
          cargo test -p noon-web --lib live_transform_projection_preserves_atomic_rejection_and_local_retry -- --nocapture 2>&1 | tee /tmp/r3-property-evidence/focused-native.log
      - name: Native architecture, format, check, Clippy and library tests
        run: |
          set -o pipefail
          bash scripts/check.sh fast ef2e4a894a7795471795e62351c8241db59af4ce 2>&1 | tee /tmp/r3-property-evidence/native.log
      - name: Web static and Python tests
        run: |
          set -o pipefail
          NOON_WEB_PREFLIGHT_ONLY=1 bash scripts/build-web-demo.sh 2>&1 | tee /tmp/r3-property-evidence/preflight.log
      - name: Build actual dev WASM from this exact candidate
        run: |
          set -o pipefail
          rustup target add wasm32-unknown-unknown
          NOON_SKIP_WEB_PREFLIGHT=1 NOON_WASM_PROFILE=dev NOON_WASM_SKIP_OPT=1 bash scripts/build-web-demo.sh 2>&1 | tee /tmp/r3-property-evidence/wasm.log
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.62.1
      - name: Install pinned browser dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Real WASM and Python error categories, atomicity and recovery
        run: |
          set -o pipefail
          node scripts/typed-authoring-errors-smoke.mjs 2>&1 | tee /tmp/r3-property-evidence/errors-browser.log
      - name: Existing authoring and continuation regression
        run: |
          set -o pipefail
          node scripts/manim-compat-smoke.mjs 2>&1 | tee /tmp/r3-property-evidence/manim-browser.log
      - name: Publish only the verified scoped candidate to its own branch
        run: git push origin HEAD:refs/heads/codex/1292-r3-live-properties
      - name: Retain exact dependencies and final state
        if: always()
        run: |
          test ! -f Cargo.lock || cp Cargo.lock /tmp/r3-property-evidence/Cargo.lock
          test ! -d web/pkg || cp -a web/pkg /tmp/r3-property-evidence/web-pkg
          test ! -d browser-smoke-artifacts/typed-authoring-errors || cp -a browser-smoke-artifacts/typed-authoring-errors /tmp/r3-property-evidence/browser
          git status --short > /tmp/r3-property-evidence/status.txt
          git rev-parse HEAD > /tmp/r3-property-evidence/final-head.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r3-live-property-qualification
          path: /tmp/r3-property-evidence
          retention-days: 7
