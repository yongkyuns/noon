name: GPU Glow integrate current master into isolated source (temporary)
on:
  push:
    branches: [codex/m1-glow-final-merge-helper-c53f]
    paths: [.github/workflows/m1-glow-final-merge.yml]
permissions:
  contents: read
concurrency:
  group: m1-glow-final-merge-c53f
  cancel-in-progress: true
jobs:
  integrate:
    name: Preserve glow CI, merge latest master, validate source
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout exact already qualified product commit, not helper workflow
        uses: actions/checkout@v7
        with:
          ref: c53f8575fc5f2f7eb7d3c2f2a356a0335ef19464
          fetch-depth: 0
      - name: Three-way merge exact master and require only audited conflicts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c53f8575fc5f2f7eb7d3c2f2a356a0335ef19464
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin 7e2b63b3eca0fbf6032b80eaa5aa8ac743ff9e9f
          test "$(git merge-base HEAD 7e2b63b3eca0fbf6032b80eaa5aa8ac743ff9e9f)" = 849eedb1489227c7efee8865f04461d0b3e6097f
          mkdir -p glow-integrated-evidence
          set +e
          git merge --no-commit --no-ff 7e2b63b3eca0fbf6032b80eaa5aa8ac743ff9e9f > glow-integrated-evidence/merge.log 2>&1
          code=$?
          set -e
          test "$code" = 1
          git diff --name-only --diff-filter=U > glow-integrated-evidence/conflicts.txt
          python3 - <<'PY'
          from pathlib import Path
          actual = set(Path('glow-integrated-evidence/conflicts.txt').read_text().splitlines())
          expected = {
              '.github/workflows/ci.yml',
              'web/thumbnails/showcase/capture-evidence.json',
              'web/thumbnails/showcase/showcase-pointer-selection.png',
              'web/thumbnails/showcase/showcase-translation-drag.png',
          }
          assert actual == expected, (actual, expected)
          PY
      - name: Retain M1 effects jobs and master broader GPU path qualification
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          path = '.github/workflows/ci.yml'
          ours = subprocess.check_output(['git','show',f':2:{path}'], text=True)
          theirs = subprocess.check_output(['git','show',f':3:{path}'], text=True)
          old = '      - "crates/noon-render-wgpu/src/gpu/mesh*"'
          new = '      - "crates/noon-render-wgpu/src/gpu/**"'
          assert ours.count(old) == 1
          assert theirs.count(new) == 1
          assert ours.count('Native glow raster correctness') == 1
          assert 'gpu::' not in ours or 'glow_filter' in ours
          # Unmodified older CI jobs and M1-specific checks must survive intact.
          resolved = ours.replace(old, new)
          assert resolved.count(new) == 1
          assert old not in resolved
          for marker in (
              'Native glow raster correctness', 'Browser reactive and editor',
              'Browser rendering (webgpu)', 'Browser rendering (webgl)',
              'Browser rendering parity', 'gpu/glow_filter',
              'scripts/glow-worker-', 'tests/visual-effects/**',
          ):
              assert marker in resolved, marker
          Path(path).write_text(resolved)
          PY
          git add .github/workflows/ci.yml
          node --test web/ci-workflow-topology.test.mjs
      - name: Retain prior real posters temporarily pending exact merged-source recapture
        run: |
          set -euo pipefail
          git checkout --ours -- \
            web/thumbnails/showcase/capture-evidence.json \
            web/thumbnails/showcase/showcase-pointer-selection.png \
            web/thumbnails/showcase/showcase-translation-drag.png
          git add web/thumbnails/showcase/
          test -z "$(git ls-files -u)"
          git diff --cached --check
          echo "Provisional product source: recapture 22 real posters against this exact integrated build before publishing PR" > glow-integrated-evidence/status.txt
      - name: Commit exact source integration with both actual parents
        run: |
          set -euo pipefail
          git commit -m "Merge current master into M1 Glow preserving GPU qualification and gallery"
          test "$(git rev-parse HEAD^1)" = c53f8575fc5f2f7eb7d3c2f2a356a0335ef19464
          test "$(git rev-parse HEAD^2)" = 7e2b63b3eca0fbf6032b80eaa5aa8ac743ff9e9f
          git rev-parse HEAD > glow-integrated-evidence/integrated-source-sha.txt
          git rev-parse HEAD^{tree} > glow-integrated-evidence/integrated-source-tree.txt
          git diff --check HEAD^1 HEAD
          git diff --exit-code
      - name: Use repository pinned Rust toolchain
        run: |
          rustup install
          rustc --version --verbose | tee glow-integrated-evidence/rustc.txt
      - name: Qualify exact new merged source and all four scoped regressions
        run: |
          set -euo pipefail
          cargo fmt --all -- --check 2>&1 | tee glow-integrated-evidence/rustfmt.log
          cargo test -p noon --no-default-features --test glow_scoped_become -- --nocapture 2>&1 | tee glow-integrated-evidence/become-tests.log
          grep -F 'test result: ok. 4 passed; 0 failed;' glow-integrated-evidence/become-tests.log
          python3 -m unittest discover -s web/python -p 'test_showcase*.py' 2>&1 | tee glow-integrated-evidence/storyboard.log
          node --check scripts/shared-authoring-smoke.mjs
          node --test web/ci-workflow-topology.test.mjs
          git diff --exit-code
      - name: Publish isolated exact source candidate, not the draft PR
        run: |
          set -euo pipefail
          branch=refs/heads/codex/m1-glow-final-source-c53f
          actual=$(git ls-remote origin "$branch" | cut -f1)
          test "$actual" = c53f8575fc5f2f7eb7d3c2f2a356a0335ef19464
          git merge-base --is-ancestor "$actual" HEAD
          git push origin "HEAD:$branch"
          echo "Isolated source published; exact gallery recapture and full CI still required" >> glow-integrated-evidence/status.txt
      - name: Dispatch ordinary CI on exact merged source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"codex/m1-glow-final-source-c53f"}' \
            https://api.github.com/repos/yongkyuns/noon/actions/workflows/ci.yml/dispatches
      - name: Preserve integration evidence even on failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m1-glow-current-master-integration
          path: glow-integrated-evidence/
          if-no-files-found: warn
          retention-days: 7
