name: Manim raster differential

on:
  push:
    branches:
      - master
    paths-ignore:
      - "crates/**/tests/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manim-raster-differential-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Decide canonical raster gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.classify.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch always runs the canonical raster oracle."
            exit 0
          fi

          compare_sha="$BEFORE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            compare_sha="$BASE_SHA"
          fi
          if ! git cat-file -e "${compare_sha}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$compare_sha"
          fi

          changed_paths="$(git diff --name-only "$compare_sha" "$HEAD_SHA")"
          printf '%s\n' "$changed_paths"
          run=false
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              crates/*/tests/*)
                ;;
              *)
                run=true
                break
                ;;
            esac
          done <<< "$changed_paths"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [[ "$run" == true ]]; then
            echo "Canonical raster changes are in scope."
          else
            echo "Only crate integration-test paths changed; canonical raster oracle is not needed."
          fi

  raster:
    name: Canonical Manim raster differential
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      NOON_WASM_SKIP_OPT: "1"
      NOON_SKIP_PLAYGROUND_TEST: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate raster ratchet policy
        run: node scripts/manim-raster-policy.test.mjs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Manim system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config
      - name: Install pinned ManimCE reference
        run: python -m pip install --disable-pip-version-check "manim[typst]==0.21.0" "typst==0.15.0"
      - name: Use stable Rust
        run: |
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Cache Cargo sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - name: Use sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Build browser package
        run: bash scripts/build-web-demo.sh
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.62.1
      - name: Install raster harness dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Render and compare retained Typst fixtures
        env:
          NOON_MANIM_TYPST_RASTER_BACKENDS: webgpu,webgl
          NOON_MANIM_TYPST_RASTER_ARTIFACTS: manim-raster-artifacts/retained-typst
        run: node scripts/manim-typst-raster-differential.mjs
      - name: Enforce retained Typst raster ratchets
        env:
          NOON_MANIM_TYPST_RASTER_BACKENDS: webgpu,webgl
          NOON_MANIM_TYPST_RASTER_ARTIFACTS: manim-raster-artifacts/retained-typst
        run: node scripts/manim-typst-raster-enforce.mjs
      - name: Upload retained Typst measurement artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retained-typst-raster-measurement
          path: manim-raster-artifacts/retained-typst
          if-no-files-found: warn
          retention-days: 14
      - name: Render and compare canonical Manim scenes
        env:
          NOON_MANIM_RASTER_BACKENDS: webgpu,webgl
          NOON_MANIM_RASTER_ARTIFACTS: manim-raster-artifacts
        run: node scripts/manim-raster-differential.mjs
      - name: Capture semantic state at raster frame times
        env:
          NOON_MANIM_RASTER_ARTIFACTS: manim-raster-artifacts
        run: node scripts/manim-raster-semantic-state.mjs
      - name: Enforce per-fixture raster ratchet
        env:
          NOON_MANIM_RASTER_ARTIFACTS: manim-raster-artifacts
        run: node scripts/manim-raster-enforce.mjs
      - name: Verify direct seek and incremental playback at Manim frame times
        env:
          NOON_MANIM_RASTER_BACKENDS: webgpu,webgl
          NOON_MANIM_RASTER_ARTIFACTS: manim-raster-artifacts
        run: node scripts/manim-seek-playback-raster.mjs
      - name: Upload Manim/Noon/diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manim-raster-differential
          path: manim-raster-artifacts
          if-no-files-found: error
          retention-days: 14

  raster-gate:
    name: ManimCE 0.21.0 raster oracle
    needs:
      - scope
      - raster
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report canonical raster gate result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SHOULD_RUN: ${{ needs.scope.outputs.run }}
          RASTER_RESULT: ${{ needs.raster.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SCOPE_RESULT" != "success" ]]; then
            echo "Raster scope classification failed."
            exit 1
          fi
          if [[ "$SHOULD_RUN" == "true" && "$RASTER_RESULT" != "success" ]]; then
            echo "Canonical raster differential failed."
            exit 1
          fi
          if [[ "$SHOULD_RUN" == "true" ]]; then
            echo "Canonical raster differential passed."
          else
            echo "Canonical raster differential skipped: only crate integration-test paths changed."
          fi
