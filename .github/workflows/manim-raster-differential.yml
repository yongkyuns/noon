name: Manim raster differential

on:
  pull_request:
    paths:
      - "parity/manim-v0.21/manifest.json"
      - "parity/manim-v0.21/core-examples/**"
      - "web/semantic-preview-session*"
      - "web/manim-raster-host.js"
      - "web/python/_manim_typst.py"
      - "web/python/examples/text_range_colors.py"
      - "crates/noon-core/src/resources/text*.rs"
      - "crates/noon/src/text*.rs"
      - "crates/noon-web/src/text_parts.rs"
      - "parity/manim-v0.21/text_range_colors*"
      - "scripts/semantic-preview-*"
      - "scripts/agent-preview-capture*.mjs"
      - "scripts/manim-differential.py"
      - "scripts/manim-differential-noon.mjs"
      - ".github/workflows/manim-raster-differential.yml"
  push:
    branches:
      - master
    paths-ignore:
      - "crates/**/tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manim-raster-differential-${{ github.ref }}
  cancel-in-progress: true

jobs:
  raster:
    name: ManimCE 0.21.0 raster oracle
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      NOON_WASM_SKIP_OPT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate raster ratchet policy
        run: node scripts/manim-raster-policy.test.mjs
      - name: Validate preview session lifecycle and authoring context
        run: node --test web/semantic-preview-session.test.mjs web/semantic-preview-context.test.mjs
      - name: Validate capture-to-artifact contract
        run: node --test scripts/agent-preview-capture.test.mjs
      - name: Validate preview evidence assertions
        run: node --test scripts/semantic-preview-observations.test.mjs
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Manim system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config
      - name: Install pinned ManimCE reference
        run: python -m pip install --disable-pip-version-check "manim[typst]==0.21.0" "typst==0.15.0"
      - name: Use stable Rust
        run: |
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - name: Use sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Build browser package
        run: bash scripts/build-web-demo.sh
      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.62.1
      - name: Install raster harness dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Compare public Python semantics with pinned ManimCE
        timeout-minutes: 5
        run: |
          node scripts/manim-differential-noon.mjs browser-smoke-artifacts/manim-differential/noon.json
          python scripts/manim-differential.py --noon-observations browser-smoke-artifacts/manim-differential/noon.json --json > browser-smoke-artifacts/manim-differential/comparison.json
      - name: Upload semantic differential observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manim-semantic-differential
          path: browser-smoke-artifacts/manim-differential
          if-no-files-found: warn
          retention-days: 7
      - name: Verify semantic preview frames, cancellation, and fresh-run recovery
        run: timeout --signal=TERM 180s node scripts/semantic-preview-smoke.mjs
      - name: Verify actual preview PNG capture enters bounded artifact storage
        run: timeout --signal=TERM 90s node scripts/agent-preview-capture-smoke.mjs
      - name: Upload semantic preview evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-preview-evidence
          path: browser-smoke-artifacts/semantic-preview
          if-no-files-found: warn
          retention-days: 14
      - name: Render and compare retained Typst fixtures
        env:
          NOON_MANIM_TYPST_RASTER_BACKENDS: webgpu,webgl
          NOON_MANIM_TYPST_RASTER_ARTIFACTS: manim-raster-artifacts/retained-typst
        run: node scripts/manim-typst-raster-differential.mjs
      - name: Enforce retained Typst raster ratchets
        env:
          NOON_MANIM_TYPST_RASTER_BACKENDS: webgpu,webgl
          NOON_MANIM_TYPST_RASTER_ARTIFACTS: manim-raster-artifacts/retained-typst
        run: node scripts/manim-typst-raster-enforce.mjs
      - name: Upload retained Typst measurement artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retained-typst-raster-measurement
          path: manim-raster-artifacts/retained-typst
          if-no-files-found: warn
          retention-days: 14
      - name: Register native Text range-color raster fixture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("parity/manim-v0.21/manifest.json")
          fixture_path = Path("parity/manim-v0.21/text_range_colors.fixture.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          fixture = json.loads(fixture_path.read_text(encoding="utf-8"))
          if any(item.get("id") == fixture["id"] for item in manifest["fixtures"]):
              raise SystemExit(f"duplicate raster fixture id: {fixture['id']}")
          manifest["fixtures"].append(fixture)
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Render and compare canonical Manim scenes
        env:
          NOON_MANIM_RASTER_BACKENDS: webgpu,webgl
          NOON_MANIM_RASTER_ARTIFACTS: manim-raster-artifacts
        run: |
          status=0
          node scripts/manim-raster-differential.mjs > "$RUNNER_TEMP/noon-raster-command.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/noon-raster-command.log"
          exit "$status"
      - name: Upload canonical raster command output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manim-raster-command-output
          path: ${{ runner.temp }}/noon-raster-command.log
          if-no-files-found: warn
          retention-days: 14
      - name: Capture semantic state at raster frame times
        env:
          NOON_MANIM_RASTER_ARTIFACTS: manim-raster-artifacts
        run: node scripts/manim-raster-semantic-state.mjs
      - name: Enforce per-fixture raster ratchet
        env:
          NOON_MANIM_RASTER_ARTIFACTS: manim-raster-artifacts
        run: node scripts/manim-raster-enforce.mjs
      - name: Verify shared sparse and dense playback at Manim frame times
        env:
          NOON_MANIM_RASTER_BACKENDS: webgpu,webgl
          NOON_MANIM_RASTER_ARTIFACTS: manim-raster-artifacts
        run: node scripts/shared-playback-raster.mjs
      - name: Upload Manim/Noon/diff artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manim-raster-differential
          path: manim-raster-artifacts
          if-no-files-found: error
          retention-days: 14
