name: Agent discovery MCP
on:
  pull_request:
    paths:
      - "tools/noon-mcp/**"
      - "scripts/noon-capabilities.py"
      - "scripts/manim-api-coverage.py"
      - "compat/manim-v0.21.0.json"
      - "web/python/**"
      - "web/semantic-preview-session*"
      - "web/manim-raster-host*"
      - "web/agent-preview-host*"
      - "web/authoring-client.js"
      - "web/authoring-execution-client.js"
      - "scripts/build-web-demo.sh"
      - ".github/actions/dev-wasm-build/**"
      - ".github/workflows/authoring-agent-discovery.yml"
  push:
    branches: [master]
    paths:
      - "tools/noon-mcp/**"
      - "scripts/noon-capabilities.py"
      - "scripts/manim-api-coverage.py"
      - "compat/manim-v0.21.0.json"
      - "web/python/**"
      - "web/semantic-preview-session*"
      - "web/manim-raster-host*"
      - "web/agent-preview-host*"
      - "web/authoring-client.js"
      - "web/authoring-execution-client.js"
      - "scripts/build-web-demo.sh"
      - ".github/actions/dev-wasm-build/**"
      - ".github/workflows/authoring-agent-discovery.yml"
permissions:
  contents: read
concurrency:
  group: agent-discovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  discovery:
    name: MCP contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/noon-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/noon-mcp/package-lock.json
      - name: Install exact locked dependencies without lifecycle hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify service boundaries and real stdio client
        run: npm test
      - name: Preserve explicit CI topology registration
        run: node ../../web/ci-workflow-topology.test.mjs

  preview-isolation:
    name: Docker-isolated real browser preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: source
        name: Detect qualified preview-isolation source
        shell: bash
        run: |
          if [[ -f tools/noon-mcp/src/preview-isolation.mjs \
             && -f tools/noon-mcp/test/preview-isolation.test.mjs \
             && -f tools/noon-mcp/test/docker-isolation-smoke.mjs ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Preview isolation source is not present; discovery-only change."
          fi
      - if: steps.source.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/noon-mcp/package-lock.json
      - if: steps.source.outputs.enabled == 'true'
        name: Install exact locked MCP dependencies without lifecycle hooks
        working-directory: tools/noon-mcp
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: steps.source.outputs.enabled == 'true'
        name: Validate isolation contract units
        working-directory: tools/noon-mcp
        run: node --test test/preview-isolation.test.mjs
      - if: steps.source.outputs.enabled == 'true'
        name: Build current browser package
        uses: ./.github/actions/dev-wasm-build
        with:
          preflight: "false"
          cache-ref: ${{ github.event.pull_request.base.sha }}
      - if: steps.source.outputs.enabled == 'true'
        name: Record Docker runtime
        run: |
          docker version
          docker info --format '{{json .SecurityOptions}}'
      - if: steps.source.outputs.enabled == 'true'
        name: Prepare content-addressed preview runtime
        env:
          NOON_PREVIEW_CACHE: ${{ runner.temp }}/noon-preview
        working-directory: tools/noon-mcp
        run: node scripts/setup-preview-runtime.mjs > "$RUNNER_TEMP/noon-preview-setup.json"
      - if: steps.source.outputs.enabled == 'true'
        name: Verify isolated real-browser preview
        env:
          NOON_PREVIEW_RUNTIME_CONFIG: ${{ runner.temp }}/noon-preview/runtime.json
        working-directory: tools/noon-mcp
        run: |
          set -o pipefail
          timeout --signal=TERM 150s node test/docker-isolation-smoke.mjs | tee "$RUNNER_TEMP/noon-preview-isolation.json"
      - if: steps.source.outputs.enabled == 'true'
        name: Verify persistent shared runner when present
        env:
          NOON_PREVIEW_RUNTIME_CONFIG: ${{ runner.temp }}/noon-preview/runtime.json
        working-directory: tools/noon-mcp
        run: |
          set -o pipefail
          if [[ -f test/docker-runner-smoke.mjs ]]; then
            timeout --signal=TERM 180s node test/docker-runner-smoke.mjs | tee "$RUNNER_TEMP/noon-preview-runner.json"
          else
            echo "Shared runner smoke not present in this revision."
          fi
      - if: steps.source.outputs.enabled == 'true'
        name: Verify shared preview CLI when present
        env:
          NOON_PREVIEW_RUNTIME_CONFIG: ${{ runner.temp }}/noon-preview/runtime.json
        working-directory: tools/noon-mcp
        run: |
          set -o pipefail
          if [[ -f test/docker-cli-smoke.mjs ]]; then
            timeout --signal=TERM 180s node test/docker-cli-smoke.mjs | tee "$RUNNER_TEMP/noon-preview-cli.json"
          else
            echo "Shared preview CLI smoke not present in this revision."
          fi
      - if: steps.source.outputs.enabled == 'true'
        name: Verify configured MCP rendering when present
        env:
          NOON_PREVIEW_RUNTIME_CONFIG: ${{ runner.temp }}/noon-preview/runtime.json
        working-directory: tools/noon-mcp
        run: |
          set -o pipefail
          if [[ -f test/docker-mcp-rendering-smoke.mjs ]]; then
            timeout --signal=TERM 300s node test/docker-mcp-rendering-smoke.mjs | tee "$RUNNER_TEMP/noon-preview-mcp.json"
          else
            echo "MCP rendering smoke not present in this revision."
          fi
      - name: Upload isolation evidence
        if: always() && steps.source.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: agent-preview-isolation-evidence
          path: |
            ${{ runner.temp }}/noon-preview-setup.json
            ${{ runner.temp }}/noon-preview-isolation.json
            ${{ runner.temp }}/noon-preview-runner.json
            ${{ runner.temp }}/noon-preview-cli.json
            ${{ runner.temp }}/noon-preview-mcp.json
            ${{ runner.temp }}/noon-preview/runtime.json
          if-no-files-found: warn
          retention-days: 14
