name: Agent discovery MCP
on:
  pull_request:
    paths:
      - "tools/noon-mcp/**"
      - "scripts/noon-capabilities.py"
      - "scripts/manim-api-coverage.py"
      - "compat/manim-v0.21.0.json"
      - "web/python/**"
      - "web/semantic-preview-session*"
      - "web/manim-raster-host*"
      - "web/authoring-client.js"
      - "web/authoring-execution-client.js"
      - "scripts/build-web-demo.sh"
      - ".github/actions/dev-wasm-build/**"
      - ".github/workflows/authoring-agent-discovery.yml"
  push:
    branches: [master]
    paths:
      - "tools/noon-mcp/**"
      - "scripts/noon-capabilities.py"
      - "scripts/manim-api-coverage.py"
      - "compat/manim-v0.21.0.json"
      - "web/python/**"
      - "web/semantic-preview-session*"
      - "web/manim-raster-host*"
      - "web/authoring-client.js"
      - "web/authoring-execution-client.js"
      - "scripts/build-web-demo.sh"
      - ".github/actions/dev-wasm-build/**"
      - ".github/workflows/authoring-agent-discovery.yml"
permissions:
  contents: read
concurrency:
  group: agent-discovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  discovery:
    name: MCP contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/noon-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/noon-mcp/package-lock.json
      - name: Install exact locked dependencies without lifecycle hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify service boundaries and real stdio client
        run: npm test
      - name: Preserve explicit CI topology registration
        run: node ../../web/ci-workflow-topology.test.mjs

  preview-isolation:
    name: Docker-isolated real browser preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOON_PREVIEW_CACHE: ${{ runner.temp }}/noon-preview
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate isolation contract units
        working-directory: tools/noon-mcp
        run: node --test test/preview-isolation.test.mjs
      - name: Build current browser package with exact provenance
        uses: ./.github/actions/dev-wasm-build
        with:
          preflight: "false"
          cache-ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - name: Record Docker runtime
        run: |
          docker version
          docker info --format '{{json .SecurityOptions}}'
      - name: Prepare content-addressed preview runtime
        working-directory: tools/noon-mcp
        run: node scripts/setup-preview-runtime.mjs > "$RUNNER_TEMP/noon-preview-setup.json"
      - name: Verify isolated real-browser preview
        env:
          NOON_PREVIEW_RUNTIME_CONFIG: ${{ runner.temp }}/noon-preview/runtime.json
        working-directory: tools/noon-mcp
        run: timeout --signal=TERM 150s node test/docker-isolation-smoke.mjs | tee "$RUNNER_TEMP/noon-preview-isolation.json"
      - name: Upload isolation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-preview-isolation-evidence
          path: |
            ${{ runner.temp }}/noon-preview-setup.json
            ${{ runner.temp }}/noon-preview-isolation.json
            ${{ runner.temp }}/noon-preview/runtime.json
          if-no-files-found: warn
          retention-days: 14
