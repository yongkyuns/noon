name: R2 WASM boundary correction
on:
  push:
    branches: [codex/1272-r2-bootstrap]
    paths: ['.github/workflows/r2-wasm-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/1272-r2-typed-membership
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: r2-wasm-fix-${{ runner.os }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Preserve the current string exception mapping at the actual WASM boundary
        run: |
          test "$(git rev-parse HEAD)" = 882bf3063938338551a992cf6dc20f9d58df5af2
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/noon-web/src/authoring_mobject.rs')
          source = path.read_text()
          old = 'self.handle.validate().map_err(js_error)?;'
          assert source.count(old) == 1
          path.write_text(source.replace(old, 'self.handle.validate().map_err(|error| js_error(error.to_string()))?;'))
          PY
          cargo fmt --all
          git diff --check
          cargo check -p noon-web --target wasm32-unknown-unknown --all-features
          git config user.name 'Yongkyun Shin'
          git config user.email 'yongkyuns@gmail.com'
          git add crates/noon-web/src/authoring_mobject.rs
          git commit -m 'fix: map typed handle errors at the WASM language boundary'
          git push origin HEAD:codex/1272-r2-typed-membership
          git rev-parse HEAD > "$RUNNER_TEMP/revision.txt"
          git show HEAD -- crates/noon-web/src/authoring_mobject.rs > "$RUNNER_TEMP/r2-wasm-fix.patch"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r2-wasm-boundary-fix
          path: |
            ${{ runner.temp }}/revision.txt
            ${{ runner.temp }}/r2-wasm-fix.patch
          retention-days: 1
