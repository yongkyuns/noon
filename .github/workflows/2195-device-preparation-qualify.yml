# Temporary #2195 research workflow. Do not merge this branch.
name: "2195 renderer initialization qualification"
on:
  push:
    branches: [codex/2195-device-preparation-qualify]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5f48dbe981554bbd5c9a0964385ae09292c22072
          fetch-depth: 1
          persist-credentials: false
      - name: Preserve exact source and constructor inventory for review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/noon-2195-initialization
          test "$(git rev-parse HEAD)" = 5f48dbe981554bbd5c9a0964385ae09292c22072
          git rev-parse HEAD > /tmp/noon-2195-initialization/base.txt
          git grep -n -E 'FramePreparer::(new|default|for_)|RetainedFramePreparer::|set_packed_path_buffer_limit|prepare(_incremental)?_for_device' -- '*.rs' '*.md' > /tmp/noon-2195-initialization/callers.txt || true
          git archive --format=tar.gz HEAD > /tmp/noon-2195-initialization/source.tar.gz
          sha256sum /tmp/noon-2195-initialization/source.tar.gz > /tmp/noon-2195-initialization/source.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: 2195-initialization-source
          path: /tmp/noon-2195-initialization/
          retention-days: 3
          if-no-files-found: error
