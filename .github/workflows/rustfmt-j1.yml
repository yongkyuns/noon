name: J1 rustfmt

on:
  push:
    branches:
      - arch/j1-native-input-signals

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.event.head_commit.message != 'Apply rustfmt to native input branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/j1-native-input-signals
      - run: |
          rustup default stable
          rustup component add rustfmt
          cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates
          git commit -m 'Apply rustfmt to native input branch'
          git push origin HEAD:arch/j1-native-input-signals
