name: B3 family transform correspondence mode v2

on:
  push:
    branches: [b3-family-transform-correspondence-mode]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply correspondence-mode propagation
        shell: bash
        run: |
          set -euxo pipefail
          git show 0ce4f33ab7759b18fb22ced8f916e351b7829eb1:.github/workflows/b3-family-transform-correspondence-mode.yml \
            | awk 'found && /^          PY$/ { exit } found { sub(/^          /, ""); print } /python3 - <<'\''PY'\''/ { found=1 }' \
            > /tmp/apply-family-mode.py
          python3 /tmp/apply-family-mode.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/noon-core/src/semantic_store/semantic_references.rs')
          s = p.read_text()
          old = '''            SemanticAnimationIntent::FamilyTransformTo {\n                source,\n                target_state,\n            } => {\n'''
          new = '''            SemanticAnimationIntent::FamilyTransformTo {\n                source,\n                target_state,\n                ..\n            } => {\n'''
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))
          PY
          cargo fmt --all
          git diff --check
          cargo check -p noon-core -p noon-compile
          cargo test -p noon-compile published_and_prepared_family_schedules_preserve_correspondence_mode --lib
      - name: Commit source-only selector
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/b3-family-transform-correspondence-mode-v2.yml
          git rm .b3-family-mode-trigger
          git add crates/noon-core/src/semantic_store/semantic_animations.rs
          git add crates/noon-core/src/semantic_store/semantic_transaction.rs
          git add crates/noon-core/src/semantic_store/semantic_transaction/animation_addition.rs
          git add crates/noon-core/src/semantic_store/semantic_references.rs
          git add crates/noon-compile/src/semantic_lowering/animation_schedule.rs
          git commit -m 'Carry family transform correspondence mode through scheduling'
          git push origin HEAD:${GITHUB_REF_NAME}
