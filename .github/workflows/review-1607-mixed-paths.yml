name: Resolve PR 1607 against master
on:
  push:
    branches: [review/1607-mixed-sampled-mega]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  resolve:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Resolve current master against Tiger branch
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=64 origin master fix/ghostscript-tiger-filled-morph-clean
          git checkout --detach origin/master
          set +e
          git merge --no-commit --no-ff origin/fix/ghostscript-tiger-filled-morph-clean
          merge_status=$?
          set -e
          test "$merge_status" -ne 0
          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          test "$conflicts" = 'crates/noon-render-wgpu/src/render_order.rs'

          # Preserve master's newer transient renderer organization, then layer
          # #1607's inverse painter-position cache and sampled-fill realization on it.
          git checkout --ours -- crates/noon-render-wgpu/src/render_order.rs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/noon-render-wgpu/src/render_order.rs')
          s = p.read_text()

          old = '''        self.painter_order_indices.clear();
                  self.painter_order_indices.extend_from_slice(order);
                  self.painter_order_installed = true;
          '''
          new = '''        self.painter_order_indices.clear();
                  self.painter_order_indices.extend_from_slice(order);
                  self.painter_order_positions.clear();
                  self.painter_order_positions
                      .resize(frame.objects.len(), None);
                  for (position, &index) in order.iter().enumerate() {
                      self.painter_order_positions[index as usize] = Some(position);
                  }
                  self.painter_order_installed = true;
          '''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)

          old = '''    pub(crate) fn clear_painter_order(&mut self) {
                  self.painter_order_indices.clear();
                  self.painter_order_installed = false;
              }
          '''
          new = '''    pub(crate) fn clear_painter_order(&mut self) {
                  self.painter_order_indices.clear();
                  self.painter_order_positions.clear();
                  self.painter_order_installed = false;
              }
          '''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)

          old = '''        let old_end = range.end.min(self.painter_order_indices.len());
                  let new_end = range.end.min(order.len());
                  self.painter_order_indices.splice(
          '''
          new = '''        let old_end = range.end.min(self.painter_order_indices.len());
                  let new_end = range.end.min(order.len());
                  self.painter_order_positions
                      .resize(frame.objects.len(), None);
                  for &index in &self.painter_order_indices[range.start.min(old_end)..old_end] {
                      if let Some(position) = self.painter_order_positions.get_mut(index as usize) {
                          *position = None;
                      }
                  }
                  for (offset, &index) in order[range.start..new_end].iter().enumerate() {
                      self.painter_order_positions[index as usize] = Some(range.start + offset);
                  }
                  self.painter_order_indices.splice(
          '''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)

          start = s.index('        noon_core::GeometryRef::VectorPath(path) => {\n')
          end = s.index('        noon_core::GeometryRef::External(_) => {\n', start)
          lines = [
              '        noon_core::GeometryRef::VectorPath(path) => {',
              '            let owner = crate::sampled_morph::SampledMeshOwner::Derived {',
              '                anchor: object.anchor_object_index(),',
              '                occurrence,',
              '            };',
              '            if let Some(path_preparer) = path_preparer {',
              '                let (cache_index, _) = path_preparer',
              '                    .cache_path_mesh_at_progress(',
              '                        path,',
              '                        state.style,',
              '                        render_transform,',
              '                        owner,',
              '                        state.morph,',
              '                    )',
              '                    .map_err(|_| DerivedDisplayRenderError::UnsupportedGeometry(occurrence))?;',
              '                let resident_indices = path_preparer.path_mesh_cache[cache_index]',
              '                    .resident',
              '                    .as_ref()',
              '                    .map(|resident| resident.indices.clone());',
              '                if let Some(indices) = resident_indices {',
              '                    prepared.stats.resident_path_reuses += 1;',
              '                    pack_derived_path_instance(',
              '                        prepared,',
              '                        indices,',
              '                        state,',
              '                        render_transform,',
              '                        style,',
              '                        DerivedPathGeometrySource::Retained,',
              '                    )',
              '                } else {',
              '                    let (mesh, _) = path_preparer',
              '                        .cached_path_mesh(',
              '                            path,',
              '                            state.style,',
              '                            render_transform,',
              '                            owner,',
              '                            state.morph,',
              '                        )',
              '                        .map_err(|_| DerivedDisplayRenderError::UnsupportedGeometry(occurrence))?;',
              '                    pack_derived_path_mesh(prepared, mesh, state, render_transform, style)',
              '                }',
              '            } else {',
              '                let mesh = crate::sampled_morph::tessellate_path_at_progress(',
              '                    path,',
              '                    state.style,',
              '                    render_transform,',
              '                    state.morph,',
              '                )',
              '                .map_err(|_| DerivedDisplayRenderError::UnsupportedGeometry(occurrence))?;',
              '                pack_derived_path_mesh(prepared, &mesh, state, render_transform, style)',
              '            }',
              '        }',
          ]
          s = s[:start] + '\n'.join(lines) + '\n' + s[end:]
          p.write_text(s)
          PY

          git add crates/noon-render-wgpu/src/render_order.rs
          test -z "$(git diff --name-only --diff-filter=U)"
          cargo fmt --all
          cargo fmt --all -- --check

          mkdir -p review-artifacts/crates/noon-compile/src/semantic_lowering/animation_payload
          mkdir -p review-artifacts/crates/noon-render-wgpu/src
          cp crates/noon-compile/src/semantic_lowering/animation_payload/family_transform_channels.rs \
             review-artifacts/crates/noon-compile/src/semantic_lowering/animation_payload/
          cp crates/noon-render-wgpu/src/render_order.rs review-artifacts/crates/noon-render-wgpu/src/
          git rev-parse origin/master > review-artifacts/base-sha.txt
          git diff --binary origin/master > review-artifacts/resolved.diff
          git status --short > review-artifacts/status.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resolved-1607-master
          path: review-artifacts
          retention-days: 2
