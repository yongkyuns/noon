name: Compiler Cache Seed

on:
  push:
    branches:
      - master
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/actions/dev-wasm-build/**"
      - ".github/ci/**"
      - "crates/**"
      - "scripts/build-web-demo.sh"
      - ".github/workflows/compiler-cache-seed.yml"
      - ".github/workflows/pr-fast.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-cache-seed-master
  cancel-in-progress: false

jobs:
  wasm:
    name: Seed dev WASM compiler cache
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_DIR: /home/runner/.cache/noon-sccache-wasm
      SCCACHE_CACHE_SIZE: "1G"
      SCCACHE_LOCAL_RW_MODE: "READ_WRITE"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Seed browser compile artifacts
        uses: ./.github/actions/dev-wasm-build
        with:
          publish-cache: "true"
