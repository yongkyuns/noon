name: Apply morph preload producer patch

on:
  push:
    branches: [codex/restore-morph-preload-residency]
    paths: [.github/workflows/apply-morph-preload-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/restore-morph-preload-residency
          fetch-depth: 0
      - name: Apply producer-side residency patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          path = "crates/noon-web/src/retained_family_execution_encoder.rs"
          replace(path,
          '''use noon_core::{
              Camera2DState, FontResourceLookup, GeometryResourceLookup, RetainedFamilyAnimationPlan,
              TextResourceHandle, TextResourceLookup,
          };
          use noon_runtime::{FrameChanges, RetainedFamilyFrame, RetainedPlannedFamilyFrame};

          use std::collections::HashMap;

          use crate::{
              RetainedExecutionDeltaEncoder, RetainedExecutionTransportError,
              RetainedFamilyExecutionDeltaEnvelope, RetainedFamilyExecutionTransportError,
              RetainedResourceBundle, RetainedResourceInventory, RetainedResourceTransportError,
          };''',
          '''use noon_core::{
              Camera2DState, FontResourceLookup, GeometryRef, GeometryResourceLookup,
              RetainedFamilyAnimationPlan, TextResourceHandle, TextResourceLookup,
          };
          use noon_runtime::{FrameChanges, FrameState, RetainedFamilyFrame, RetainedPlannedFamilyFrame};

          use std::{collections::HashMap, sync::Arc};

          use crate::{
              RenderGeometryPreparation, RetainedExecutionDeltaEncoder, RetainedExecutionTransportError,
              RetainedFamilyExecutionDeltaEnvelope, RetainedFamilyExecutionTransportError,
              RetainedResourceBundle, RetainedResourceInventory, RetainedResourceTransportError,
          };''')
          replace(path,
          '''    observed_plan_count: usize,
              resources: RetainedResourceInventory,
          }''',
          '''    observed_plan_count: usize,
              resources: RetainedResourceInventory,
              render_geometry_indices: HashMap<usize, u32>,
              render_geometries: Vec<Arc<GeometryRef>>,
          }''')
          replace(path,
          '''            observed_plan_count: 0,
                  resources: RetainedResourceInventory::default(),
              }
          }''',
          '''            observed_plan_count: 0,
                  resources: RetainedResourceInventory::default(),
                  render_geometry_indices: HashMap::new(),
                  render_geometries: Vec::new(),
              }
          }''')
          replace(path,
          '''            observed_plan_count: 0,
                  resources: resources.inventory(),
              }
          }''',
          '''            observed_plan_count: 0,
                  resources: resources.inventory(),
                  render_geometry_indices: HashMap::new(),
                  render_geometries: Vec::new(),
              }
          }''')
          start = '''    pub(crate) fn attach_resource_additions(
              &mut self,
              envelope: &mut RetainedFamilyExecutionDeltaEnvelope,
              text_handles: impl IntoIterator<Item = TextResourceHandle>,
              texts: &impl TextResourceLookup,
              geometries: &impl GeometryResourceLookup,
              fonts: &impl FontResourceLookup,
          ) -> Result<(), RetainedResourceTransportError> {
              let new_texts = text_handles
                  .into_iter()
                  .filter(|handle| {
                      !self.resources.contains_text(
                          crate::TransportTextResourceHandle::from_source_handle(*handle),
                      )
                  })
                  .collect::<std::collections::BTreeSet<_>>();
              if new_texts.is_empty() {
                  return Ok(());
              }
              let mut additions = RetainedResourceBundle::capture_additions(
                  new_texts,
                  texts,
                  geometries,
                  fonts,
                  &self.resources,
              )?;
              additions.retain_additions(&mut self.resources);
              debug_assert!(!additions.is_empty());
              envelope.resource_additions = Some(additions);
              Ok(())
          }'''
          new = '''    pub(crate) fn attach_resource_additions(
              &mut self,
              envelope: &mut RetainedFamilyExecutionDeltaEnvelope,
              frame: &FrameState,
              candidate_indices: &[usize],
              text_handles: impl IntoIterator<Item = TextResourceHandle>,
              texts: &impl TextResourceLookup,
              geometries: &impl GeometryResourceLookup,
              fonts: &impl FontResourceLookup,
          ) -> Result<(), RetainedResourceTransportError> {
              let new_texts = text_handles
                  .into_iter()
                  .filter(|handle| {
                      !self.resources.contains_text(
                          crate::TransportTextResourceHandle::from_source_handle(*handle),
                      )
                  })
                  .collect::<std::collections::BTreeSet<_>>();

              let mut staged_indices = HashMap::<usize, (u32, u32)>::new();
              let mut new_geometries = Vec::<Arc<GeometryRef>>::new();
              let mut preparations = Vec::<RenderGeometryPreparation>::new();
              let mut object_resources = HashMap::new();
              for &index in candidate_indices {
                  let Some(render_transform) = frame
                      .render_transforms
                      .get(index)
                      .copied()
                      .flatten()
                  else {
                      continue;
                  };
                  let Some(geometry) = frame.render_geometries.get(index).and_then(Option::as_ref)
                  else {
                      continue;
                  };
                  let object = frame.objects.get(index).ok_or_else(|| {
                      RetainedResourceTransportError::Encode(format!(
                          "invalid renderer resource object index {index}"
                      ))
                  })?;
                  let key = Arc::as_ptr(geometry) as usize;
                  let (resource, local_resource) = if let Some(&resource) =
                      self.render_geometry_indices.get(&key)
                  {
                      (resource, None)
                  } else if let Some(&(resource, local)) = staged_indices.get(&key) {
                      (resource, Some(local))
                  } else {
                      let local = u32::try_from(new_geometries.len()).map_err(|_| {
                          RetainedResourceTransportError::Encode(
                              "too many incremental render resources".into(),
                          )
                      })?;
                      let resource = u32::try_from(self.render_geometries.len())
                          .ok()
                          .and_then(|base| base.checked_add(local))
                          .ok_or_else(|| {
                              RetainedResourceTransportError::Encode(
                                  "too many retained render resources".into(),
                              )
                          })?;
                      staged_indices.insert(key, (resource, local));
                      new_geometries.push(geometry.clone());
                      (resource, Some(local))
                  };
                  if let Some(local_resource) = local_resource {
                      preparations.push(RenderGeometryPreparation {
                          resource: local_resource,
                          style: object.style,
                          transform: render_transform,
                      });
                  }
                  object_resources.insert(object.id, resource);
              }

              for object in &mut envelope.retained.objects {
                  if let Some(&resource) = object_resources.get(&object.object) {
                      object.render_geometry_resource = Some(resource);
                      object.render_geometry = None;
                  }
              }

              if new_texts.is_empty() && new_geometries.is_empty() {
                  return Ok(());
              }
              let mut additions = RetainedResourceBundle::capture_additions(
                  new_texts,
                  texts,
                  geometries,
                  fonts,
                  &self.resources,
              )?;
              additions.retain_additions(&mut self.resources);
              if !new_geometries.is_empty() {
                  additions.set_render_geometries(
                      self.session(),
                      new_geometries.clone().into(),
                      preparations,
                  );
              }
              debug_assert!(!additions.is_empty());
              envelope.resource_additions = Some(additions);
              self.render_geometry_indices.extend(
                  staged_indices
                      .into_iter()
                      .map(|(key, (resource, _))| (key, resource)),
              );
              self.render_geometries.extend(new_geometries);
              Ok(())
          }'''
          replace(path, start, new)

          path = "crates/noon-web/src/semantic_execution_player.rs"
          replace(path,
          '''                    camera,
                          indices,
                      )''',
          '''                    camera,
                          indices.iter().copied(),
                      )''')
          replace(path,
          '''            self.attach_resource_additions(&mut delta, text_handles)?;
              self.snapshot_sent = true;''',
          '''            self.attach_resource_additions(&mut delta, &indices, text_handles)?;
              self.snapshot_sent = true;''')
          replace(path,
          '''            self.attach_resource_additions(&mut delta, text_handles)?;
              Ok(Some(delta))
          } else {''',
          '''            self.attach_resource_additions(
                  &mut delta,
                  changes.object_indices(),
                  text_handles,
              )?;
              Ok(Some(delta))
          } else {''')
          replace(path,
          '''            self.attach_resource_additions(&mut delta, text_handles)?;
              Ok(Some(delta))
          }
              }

              fn attach_resource_additions(
                  &mut self,
                  delta: &mut RetainedFamilyExecutionDeltaEnvelope,
                  text_handles: impl IntoIterator<Item = noon_core::TextResourceHandle>,
              ) -> Result<(), String> {
                  self.encoder
                      .attach_resource_additions(
                          delta,
                          text_handles,''',
          '''            self.attach_resource_additions(
                  &mut delta,
                  changes.object_indices(),
                  text_handles,
              )?;
              Ok(Some(delta))
          }
              }

              fn attach_resource_additions(
                  &mut self,
                  delta: &mut RetainedFamilyExecutionDeltaEnvelope,
                  candidate_indices: &[usize],
                  text_handles: impl IntoIterator<Item = noon_core::TextResourceHandle>,
              ) -> Result<(), String> {
                  self.encoder
                      .attach_resource_additions(
                          delta,
                          self.session.frame(),
                          candidate_indices,
                          text_handles,''')

          path = "crates/noon-web/src/retained_resource_transport.rs"
          replace(path,
          '''pub const RETAINED_RESOURCE_TRANSPORT_VERSION: u32 = 4;''',
          '''pub const RETAINED_RESOURCE_TRANSPORT_VERSION: u32 = 5;''')
          replace(path,
          '''    pub(crate) fn is_empty(&self) -> bool {
              self.texts.is_empty() && self.geometries.is_empty() && self.fonts.is_empty()
          }''',
          '''    pub(crate) fn is_empty(&self) -> bool {
              self.texts.is_empty()
                  && self.geometries.is_empty()
                  && self.fonts.is_empty()
                  && self
                      .render_geometry_resources
                      .as_ref()
                      .is_none_or(|resources| resources.geometries.is_empty())
          }''')
          replace(path,
          '''    #[cfg(test)]
              pub(crate) fn set_render_geometries(''',
          '''    pub(crate) fn set_render_geometries(''')
          PY
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/noon-web/src/retained_family_execution_encoder.rs \
                  crates/noon-web/src/semantic_execution_player.rs \
                  crates/noon-web/src/retained_resource_transport.rs
          git commit -m "Publish live morph renderer resources by stable index"
          git push origin HEAD:codex/restore-morph-preload-residency
