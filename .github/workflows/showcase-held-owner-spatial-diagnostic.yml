name: Held owner spatial diagnostic (temporary)

on:
  push:
    branches:
      - codex/2421-held-owner-spatial-diagnostic
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  spatial-diagnostic:
    name: One WebGPU spatial first pass
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NOON_SHOWCASE_BACKEND: webgpu
      NOON_SHOWCASE_CASES: showcase-spatial-scene
      PINNED_RUNTIME_SOURCE: 7c50b9faf5cfe7c700c59995c2d6696134a6cb7c
    steps:
      - uses: actions/checkout@v7
      - name: Download the exact prior shared runtime
        uses: actions/download-artifact@v8
        with:
          artifact-ids: 13370127613
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41927605033
          path: web
      - name: Verify the pinned runtime inventory and identity
        run: |
          echo "DIAGNOSTIC_EVENT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          cp scripts/showcase-live-review.mjs "$RUNNER_TEMP/showcase-live-review.mjs"
          cp scripts/showcase-renderer-readback.mjs "$RUNNER_TEMP/showcase-renderer-readback.mjs"
          git fetch --no-tags origin "$PINNED_RUNTIME_SOURCE"
          git checkout --detach "$PINNED_RUNTIME_SOURCE"
          GITHUB_SHA="$PINNED_RUNTIME_SOURCE" node .github/ci/wasm-build.mjs verify
          node --input-type=module -e 'import fs from "node:fs"; const v=JSON.parse(fs.readFileSync("web/runtime-build-identity.json", "utf8")); if(v.buildId!=="f46ecefcab83bb14d5774b42688b187e5978f4707866bc759de8e383e6c2c1ad" || v.sourceRevision!==process.env.PINNED_RUNTIME_SOURCE) throw new Error(JSON.stringify(v)); console.log(JSON.stringify({buildId:v.buildId,sourceRevision:v.sourceRevision}));'
          cp "$RUNNER_TEMP/showcase-live-review.mjs" scripts/showcase-live-review.mjs
          cp "$RUNNER_TEMP/showcase-renderer-readback.mjs" scripts/showcase-renderer-readback.mjs
          mkdir -p browser-smoke-artifacts/showcase/webgpu
          node --input-type=module -e 'import fs from "node:fs"; import {execSync} from "node:child_process"; const v=JSON.parse(fs.readFileSync("web/runtime-build-identity.json", "utf8")); fs.writeFileSync("browser-smoke-artifacts/showcase/webgpu/diagnostic-overlay.json", JSON.stringify({eventRevision:process.env.DIAGNOSTIC_EVENT_SHA,pinnedRuntimeSource:process.env.PINNED_RUNTIME_SOURCE,runtimeBuildId:v.buildId,rendererReadbackHelperSha256:execSync("sha256sum scripts/showcase-renderer-readback.mjs",{encoding:"utf8"}).trim().split(" ")[0],liveReviewSha256:execSync("sha256sum scripts/showcase-live-review.mjs",{encoding:"utf8"}).trim().split(" ")[0]}, null, 2)+"\\n");'
      - name: Install pinned browser tools
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Capture the selected authored spatial scene
        id: capture
        run: node scripts/showcase-capture.mjs
      - name: Run unchanged first-pass and replay oracles
        if: ${{ !cancelled() && (steps.capture.outcome == 'success' || steps.capture.outcome == 'failure') }}
        run: node scripts/showcase-live-review.mjs
      - name: Record exact compositor screenshot evidence
        if: ${{ always() && steps.capture.outcome == 'success' || always() && steps.capture.outcome == 'failure' }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile, writeFile } from "node:fs/promises";
          const dir = "browser-smoke-artifacts/showcase/webgpu";
          let report = null, png = null, error = null;
          try { report = JSON.parse(await readFile(`${dir}/report.json`, "utf8")); } catch (cause) { error = String(cause); }
          const capture = report?.results?.find((result) => result.id === "showcase-spatial-scene")?.firstPassCapture ?? null;
          const pngPath = `${dir}/showcase-spatial-scene-first-pass.png`;
          try { png = await readFile(pngPath); } catch (cause) { error ??= String(cause); }
          await writeFile(`${dir}/compositor-screenshot-evidence.json`, JSON.stringify({
            captureKind: capture?.captureKind ?? null,
            compositorScreenshot: capture?.compositorScreenshot ?? null,
            pngPath: png ? pngPath : null,
            pngBytes: png?.length ?? null,
            pngSha256: png ? createHash("sha256").update(png).digest("hex") : null,
            evidenceError: error,
          }, null, 2) + "\\n");
          NODE
      - name: Record post-run worktree and reverify pinned runtime
        if: always()
        run: |
          evidence=browser-smoke-artifacts/showcase/webgpu
          mkdir -p "$evidence"
          git status --short > "$evidence/post-run-git-status.txt"
          git diff --binary > "$evidence/post-run-tracked.diff"
          git checkout -- scripts/showcase-live-review.mjs scripts/showcase-renderer-readback.mjs
          poster=web/thumbnails/showcase/showcase-spatial-scene.png
          poster_sha="$(sha256sum "$poster" | cut -d' ' -f1)"
          if [ "$poster_sha" = "3a3449f2c8fc57a44a3d2b1060aa175e742830f59f9d4cd6d83ff2b5c9d288cf" ]; then
            git checkout -- "$poster"
          elif [ "$poster_sha" != "b537b5e1d5af05dd214c59f0653c01a90af0608510e93d7426dff1f0a98e7f6a" ]; then
            echo "Unexpected showcase poster hash: $poster_sha" >&2
            exit 1
          fi
          GITHUB_SHA="$PINNED_RUNTIME_SOURCE" node .github/ci/wasm-build.mjs verify
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const manifest = JSON.parse(await readFile("web/ci-artifact.json", "utf8"));
          const identity = JSON.parse(await readFile("web/runtime-build-identity.json", "utf8"));
          assert.equal(identity.buildId, "f46ecefcab83bb14d5774b42688b187e5978f4707866bc759de8e383e6c2c1ad");
          await writeFile("browser-smoke-artifacts/showcase/webgpu/runtime-post-check.json",
            JSON.stringify({ sourceRevision: manifest.source, buildId: identity.buildId,
              checkedFiles: Object.keys(manifest.files).length, allPackageHashesMatch: true }, null, 2) + "\n");
          NODE
      - name: Retain report, exact owner PNG, and oracle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: held-owner-spatial-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-smoke-artifacts/showcase/webgpu
          if-no-files-found: warn
          retention-days: 3
