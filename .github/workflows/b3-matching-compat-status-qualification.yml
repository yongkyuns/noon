name: B3 Matching Compatibility Status Qualification
on:
  push:
    branches: [b3-matching-compat-status-qualification]
permissions:
  contents: write
concurrency:
  group: b3-matching-compat-status-qualification
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Correct and validate compatibility status with a minimal diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('compat/manim-v0.21.0.json')
          text = path.read_text()
          old = '    "TransformMatchingShapes": {"status": "supported", "category": "animation", "evidence": "matching-shapes tests"},'
          new = '    "TransformMatchingShapes": {"status": "partial", "category": "animation", "dependency": "#1571", "evidence": "web/python/_manim_animate.py; web/python/_manim_scene.py; web/python/test_manim_transform_matching_shapes.py; web/python/test_manim_matching_timing.py; crates/noon/src/execution_session/family_transform_tests.rs", "reason": "Default normalized point-geometry matching supports duplicate multiplicity, unmatched fades, activation-time capture, authored-target cleanup, constructor/play timing scopes, and same-z active/cleanup ordering through the shared Rust request; Python key_map, transform_mismatches, and fade_transform_mismatches remain explicitly unsupported."},'
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new, 1))

          data = json.loads(path.read_text())
          entry = data['overrides']['TransformMatchingShapes']
          assert entry['status'] == 'partial'
          assert entry['category'] == 'animation'
          assert entry['dependency'] == '#1571'
          for evidence in ('web/python/test_manim_transform_matching_shapes.py', 'web/python/test_manim_matching_timing.py', 'crates/noon/src/execution_session/family_transform_tests.rs'):
              assert evidence in entry['evidence']
          assert 'parity/' not in entry['evidence']
          for option in ('key_map', 'transform_mismatches', 'fade_transform_mismatches'):
              assert option in entry['reason']
          PY
          python3 -m json.tool compat/manim-v0.21.0.json >/dev/null
          grep -q 'TransformMatchingShapes' web/python/_manim_animate.py
          grep -q 'appendMatchingFamilyTransformTo' web/python/_manim_scene.py
          git diff --check
          test "$(git diff --numstat -- compat/manim-v0.21.0.json | awk '{print $1":"$2}')" = "1:1"
          cp compat/manim-v0.21.0.json "$RUNNER_TEMP/manim-v0.21.0.json"
      - name: Publish product-only candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Yongkyun Shin'
          git config user.email '4311628+yongkyuns@users.noreply.github.com'
          git fetch --depth=1 origin 57b109cea22047b9260e5056ec4e26def79cd86c
          git checkout --detach 57b109cea22047b9260e5056ec4e26def79cd86c
          cp "$RUNNER_TEMP/manim-v0.21.0.json" compat/manim-v0.21.0.json
          git add compat/manim-v0.21.0.json
          git diff --cached --check
          test "$(git diff --cached --numstat -- compat/manim-v0.21.0.json | awk '{print $1":"$2}')" = "1:1"
          git commit -m 'docs: classify TransformMatchingShapes supported subset accurately'
          git push --force origin HEAD:refs/heads/b3-matching-compat-status-candidate-v3
          echo "Candidate SHA: $(git rev-parse HEAD)"
          echo "Candidate tree: $(git rev-parse HEAD^{tree})"
