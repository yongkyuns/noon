name: Numeric label preparation
on:
  pull_request:
    paths:
      - 'crates/noon*/**'
      - '.github/workflows/number-label-preparation.yml'
permissions:
  contents: read
concurrency:
  group: number-label-preparation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup install
          mkdir -p number-label-diagnostics
          cargo fmt --all
          git diff --binary > number-label-diagnostics/format.patch
          cp "$(rustup which rustfmt)" number-label-diagnostics/rustfmt
          git rev-parse HEAD > number-label-diagnostics/source-sha.txt
      - uses: actions/upload-artifact@v7
        with:
          name: number-label-diagnostics-${{ github.event.pull_request.head.sha }}
          path: number-label-diagnostics/
          retention-days: 1
