name: C2 session preparation
on:
  push:
    branches: [work/c2-session-input-preparation]
    paths: [.github/workflows/c2-session-preparation.yml, .c2-session.patch.gz, .c2-session-review.patch]
permissions:
  contents: write
concurrency:
  group: c2-session-preparation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Apply verified patch to exact production parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c2-results"
          gzip -dc .c2-session.patch.gz > "$RUNNER_TEMP/c2-session.patch"
          cp .c2-session-review.patch "$RUNNER_TEMP/c2-session-review.patch"
          echo "1699990cba7709264f6d5f133dc89a18222f1d07a54f515ae21d50b14ee53872  $RUNNER_TEMP/c2-session.patch" | sha256sum --check
          git fetch --no-tags --depth=1 origin fdb985b10fc60adce269049030dc4245552ab7be
          git checkout --detach fdb985b10fc60adce269049030dc4245552ab7be
          test "$(git hash-object crates/noon/src/execution_session.rs)" = 327d5818326bafc30891789750c0fe75347eb1e3
          git apply --check "$RUNNER_TEMP/c2-session.patch"
          git apply "$RUNNER_TEMP/c2-session.patch"
          git apply --check "$RUNNER_TEMP/c2-session-review.patch"
          git apply "$RUNNER_TEMP/c2-session-review.patch"
          git add -N crates/noon/src/execution_session/native_input.rs crates/noon/src/execution_session/native_input/tests.rs
          git diff --check
          git rev-parse HEAD > "$RUNNER_TEMP/c2-results/parent.txt"
      - name: Repository-pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup install
          rustc --version --verbose
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Format and focused admission tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          cargo test -p noon --all-features --lib execution_session::native_input::tests -- --nocapture 2>&1 | tee "$RUNNER_TEMP/c2-results/focused.log"
          cargo test -p noon-runtime --lib prepared_frame::tests -- --nocapture 2>&1 | tee "$RUNNER_TEMP/c2-results/prepared-frame.log"
      - name: Repository fast gate
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check.sh fast HEAD 2>&1 | tee "$RUNNER_TEMP/c2-results/fast-gate.log"
      - name: Direct Rust WASM compilation
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p noon --no-default-features --target wasm32-unknown-unknown 2>&1 | tee "$RUNNER_TEMP/c2-results/wasm-check.log"
      - name: Publish only the clean tested candidate
        shell: bash
        run: |
          set -euo pipefail
          git add crates/noon/src/execution_session.rs crates/noon/src/execution_session/native_input.rs crates/noon/src/execution_session/native_input/tests.rs crates/noon/src/integration.rs crates/noon/src/lib.rs crates/noon-runtime/src/prepared_frame.rs
          test "$(git diff --cached --name-only | wc -l)" = 6
          test -z "$(git diff --name-only)"
          git diff --cached --check
          git -c user.name='Noon validation' -c user.email='noon-validation@users.noreply.github.com' commit -m 'C2: admit contextual pointer occurrences atomically through ExecutionSession'
          candidate="work/c2-input-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/$candidate"
          git rev-parse HEAD > "$RUNNER_TEMP/c2-results/candidate.txt"
          printf '%s\n' "$candidate" > "$RUNNER_TEMP/c2-results/candidate-branch.txt"
      - name: Capture exact candidate sources and diff
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff fdb985b10fc60adce269049030dc4245552ab7be -- crates/noon crates/noon-runtime > "$RUNNER_TEMP/c2-results/candidate.patch"
          tar -czf "$RUNNER_TEMP/c2-results/candidate-sources.tar.gz" crates/noon/src/execution_session.rs crates/noon/src/execution_session/native_input.rs crates/noon/src/execution_session/native_input/tests.rs crates/noon/src/integration.rs crates/noon/src/lib.rs crates/noon-runtime/src/prepared_frame.rs
          git hash-object crates/noon/src/execution_session.rs crates/noon/src/execution_session/native_input.rs crates/noon/src/execution_session/native_input/tests.rs crates/noon/src/integration.rs crates/noon/src/lib.rs crates/noon-runtime/src/prepared_frame.rs > "$RUNNER_TEMP/c2-results/source-blobs.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c2-session-validation
          path: ${{ runner.temp }}/c2-results
          retention-days: 3
          if-no-files-found: error
