name: Deploy Noon Playground

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Production deployments must finish even when master is moving quickly.
  # New pushes queue behind the in-flight deployment instead of starving Pages.
  cancel-in-progress: false

jobs:
  build:
    name: Build browser demo
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: "READ_ONLY"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use stable Rust
        run: |
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-

      - name: Use sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Build and validate playground
        run: bash scripts/build-web-demo.sh

      - name: Stamp deployed revision
        run: printf '{"commit":"%s"}\n' "$GITHUB_SHA" > web/build-info.json

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web
          include-hidden-files: true

  deploy:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify deployed revision
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="${PAGE_URL%/}/build-info.json?sha=${EXPECTED_SHA}"
          for attempt in {1..20}; do
            body="$(curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              "$url" 2>/dev/null || true)"
            if [[ "$body" == *"\"commit\":\"${EXPECTED_SHA}\""* ]]; then
              echo "Verified live playground revision ${EXPECTED_SHA}"
              exit 0
            fi
            echo "Waiting for Pages to serve ${EXPECTED_SHA} (attempt ${attempt}/20)"
            sleep 5
          done
          echo "Pages never served expected revision ${EXPECTED_SHA}" >&2
          exit 1
