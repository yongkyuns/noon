name: Deploy Noon Playground

# A successful build or ordinary merge is not deployment authorization.
# Run manually on master with the exact approved commit and explicit confirmation.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Full master commit SHA explicitly approved for demo deployment'
        required: true
        type: string
      confirm_deploy:
        description: 'Deploy this demo revision to the public Pages site (not a package release)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages
  # An authorized deployment must finish; another manual request queues behind it.
  cancel-in-progress: false

jobs:
  build:
    name: Build and deploy browser demo
    # Fail closed before allocating a privileged environment/runner. The helper
    # checks the actual checkout again, including immediately before publication.
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'yongkyuns/noon' && github.ref == 'refs/heads/master' && inputs.confirm_deploy == true && inputs.expected_sha == github.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
    # Required reviewers must be configured by the owner in GitHub settings.
    # Naming this environment alone does not configure an approval rule.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: "READ_ONLY"
      NOON_WASM_PROFILE: release
      NOON_WASM_SKIP_OPT: "0"
      NOON_RENDERER_SMOKE: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authorize exact demo revision
        run: node .github/ci/pages-authorization.mjs

      - name: Use repository-pinned Rust and WASM target
        run: |
          rustup install
          rustup show active-toolchain
          rustc --version --verbose
          rustup target add wasm32-unknown-unknown

      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-

      - name: Use sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Install pinned wasm-opt
        uses: ./.github/actions/install-wasm-opt

      # This remains the demo rebuild path, not promotion of the separately
      # qualified release archive. Exact-byte release promotion is still #2433 work.
      - name: Build and validate playground
        run: bash scripts/build-web-demo.sh

      - name: Stamp deployed revision
        run: printf '{"commit":"%s"}\n' "$GITHUB_SHA" > web/build-info.json

      - name: Install pinned website capture tools
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Capture actual scenes and validate project website
        run: |
          node --test scripts/project-site.test.mjs
          node scripts/capture-project-media.mjs
          node scripts/build-project-site.mjs
          node scripts/project-site-smoke.mjs

      - name: Recheck deployment authorization
        run: node .github/ci/pages-authorization.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
          include-hidden-files: true
          retention-days: 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify deployed revision
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="${PAGE_URL%/}/build-info.json?sha=${EXPECTED_SHA}"
          for attempt in {1..20}; do
            body="$(curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              "$url" 2>/dev/null || true)"
            if [[ "$body" == *"\"commit\":\"${EXPECTED_SHA}\""* ]]; then
              echo "Verified live playground revision ${EXPECTED_SHA}"
              exit 0
            fi
            echo "Waiting for Pages to serve ${EXPECTED_SHA} (attempt ${attempt}/20)"
            sleep 5
          done
          echo "Pages never served expected revision ${EXPECTED_SHA}" >&2
          exit 1
