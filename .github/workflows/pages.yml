name: Deploy Noon Playground

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Production deployments must finish even when master is moving quickly.
  # New pushes queue behind the in-flight deployment instead of starving Pages.
  cancel-in-progress: false

jobs:
  build:
    name: Build and deploy browser demo
    # Keep the allocated runner through publication instead of queuing a second job.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: "READ_ONLY"
      NOON_WASM_PROFILE: release
      NOON_WASM_SKIP_OPT: "0"
      NOON_RENDERER_SMOKE: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Classify complete push for deployment
        id: scope
        env:
          BEFORE_REVISION: ${{ github.event.before }}
        run: node scripts/ci-qualification-scope.mjs pages

      - name: Use repository-pinned Rust and WASM target
        if: ${{ steps.scope.outputs.deploy != 'false' }}
        run: |
          rustup install
          rustup show active-toolchain
          rustc --version --verbose
          rustup target add wasm32-unknown-unknown

      - name: Cache Cargo sources
        if: ${{ steps.scope.outputs.deploy != 'false' }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-

      - name: Use sccache
        if: ${{ steps.scope.outputs.deploy != 'false' }}
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Install pinned wasm-pack
        if: ${{ steps.scope.outputs.deploy != 'false' }}
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Install pinned wasm-opt
        if: ${{ steps.scope.outputs.deploy != 'false' }}
        uses: ./.github/actions/install-wasm-opt

      - name: Build and validate playground
        if: ${{ steps.scope.outputs.deploy != 'false' }}
        run: bash scripts/build-web-demo.sh

      - name: Stamp deployed revision
        if: ${{ steps.scope.outputs.deploy != 'false' }}
        run: printf '{"commit":"%s"}\n' "$GITHUB_SHA" > web/build-info.json

      - name: Configure Pages
        if: ${{ steps.scope.outputs.deploy != 'false' }}
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: ${{ steps.scope.outputs.deploy != 'false' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: web
          include-hidden-files: true
          retention-days: 1

      - name: Deploy
        if: ${{ steps.scope.outputs.deploy != 'false' }}
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify deployed revision
        if: ${{ steps.scope.outputs.deploy != 'false' }}
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="${PAGE_URL%/}/build-info.json?sha=${EXPECTED_SHA}"
          for attempt in {1..20}; do
            body="$(curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              "$url" 2>/dev/null || true)"
            if [[ "$body" == *"\"commit\":\"${EXPECTED_SHA}\""* ]]; then
              echo "Verified live playground revision ${EXPECTED_SHA}"
              exit 0
            fi
            echo "Waiting for Pages to serve ${EXPECTED_SHA} (attempt ${attempt}/20)"
            sleep 5
          done
          echo "Pages never served expected revision ${EXPECTED_SHA}" >&2
          exit 1
