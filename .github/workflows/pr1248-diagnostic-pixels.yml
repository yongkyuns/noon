name: PR1248 diagnostic pixel qualification (temporary)
on:
  push:
    branches: [codex/pr1248-diagnostic-pixels]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CARGO_INCREMENTAL: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 8b18c24842a45dce453a1dc418c7868e6b3c1e9d
      - run: |
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Build diagnostic profile and its web preflight
        env:
          NOON_WASM_PROFILE: dev
          NOON_WASM_SKIP_OPT: '1'
          NOON_SKIP_PLAYGROUND_TEST: '1'
        run: |
          set -euo pipefail
          bash scripts/build-web-demo.sh
          grep -q createDirectLiveUpdaterLifecycleSmokeRenderer web/pkg/noon_web.js
          mkdir -p diagnostic-evidence
          git rev-parse HEAD > diagnostic-evidence/source-sha.txt
          git archive HEAD | gzip > diagnostic-evidence/source.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: pr1248-diagnostic-runtime
          path: |
            web/pkg
            web/python-worker.js
            web/python/compat-bundle.*.json
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr1248-diagnostic-source
          path: diagnostic-evidence
          retention-days: 7
  pixels:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        backend: [webgpu, webgl]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 8b18c24842a45dce453a1dc418c7868e6b3c1e9d
      - uses: actions/download-artifact@v8
        with:
          name: pr1248-diagnostic-runtime
          path: web
      - run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Require direct Rust/WASM pixels, including updater reversal and freeze
        env:
          NOON_BROWSER_SMOKE_BACKEND: ${{ matrix.backend }}
        run: node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr1248-diagnostic-${{ matrix.backend }}
          path: browser-smoke-artifacts
          retention-days: 7
