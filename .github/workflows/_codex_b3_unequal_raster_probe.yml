name: codex b3 unequal family raster probe

on:
  push:
    branches: [codex/b3-unequal-family-raster]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raster:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      NOON_WASM_SKIP_OPT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Remove branch-only probe from build checkout
        run: rm .github/workflows/_codex_b3_unequal_raster_probe.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Manim system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config
      - name: Install pinned ManimCE reference
        run: python -m pip install --disable-pip-version-check "manim[typst]==0.21.0" "typst==0.15.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - name: Build browser package
        run: bash scripts/build-web-demo.sh
      - name: Install raster harness dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Narrow manifest to unequal-family fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('parity/manim-v0.21/manifest.json')
          manifest = json.loads(path.read_text())
          wanted = {
              'unequal-family-transform-expansion',
              'unequal-family-transform-contraction',
          }
          fixtures = [fixture for fixture in manifest['fixtures'] if fixture['id'] in wanted]
          if {fixture['id'] for fixture in fixtures} != wanted:
              raise SystemExit(f'missing unequal-family fixtures: {wanted - {fixture["id"] for fixture in fixtures}}')
          manifest['fixtures'] = fixtures
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Render source-equivalent unequal-family fixtures
        env:
          NOON_MANIM_RASTER_BACKENDS: webgpu,webgl
          NOON_MANIM_RASTER_ARTIFACTS: manim-raster-artifacts
        run: node scripts/manim-raster-differential.mjs
      - name: Enforce standard raster ratchets
        env:
          NOON_MANIM_RASTER_ARTIFACTS: manim-raster-artifacts
        run: node scripts/manim-raster-enforce.mjs
      - name: Upload raster evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b3-unequal-family-raster
          path: manim-raster-artifacts
          if-no-files-found: warn
          retention-days: 14
