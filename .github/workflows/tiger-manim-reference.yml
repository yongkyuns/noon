name: Tiger Manim reference
on:
  push:
    branches: [fix/ghostscript-tiger-filled-morph]
    paths:
      - scripts/tiger-manim-reference.py
      - scripts/tiger-browser-compare.mjs
      - .github/workflows/tiger-manim-reference.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: tiger-manim-reference
  cancel-in-progress: true
jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Manim system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config
      - name: Install pinned Manim
        run: python -m pip install --disable-pip-version-check 'manim==0.21.0'
      - name: Render the actual filled tiger and opacity counterexample
        run: python scripts/tiger-manim-reference.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tiger-manim-reference
          path: browser-smoke-artifacts/tiger-manim-reference
          retention-days: 7
