name: codex b3 test contract patch

on:
  push:
    branches: [codex/b3-unequal-family-test-contract]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/b3-unequal-family-test-contract
      - name: Replace obsolete flat-unequal rejection fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/noon-web/src/canonical_authoring_scene.rs')
          text = path.read_text()
          old = '        let invalid_target = context.scene.family(&[(&left_target).into()]).unwrap();\n'
          new = (
              '        let invalid_nested = context.scene.family(&[(&left_target).into()]).unwrap();\n'
              '        let invalid_target = context.scene.family(&[(&invalid_nested).into()]).unwrap();\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one obsolete fixture, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/_codex_b3_test_contract_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/noon-web/src/canonical_authoring_scene.rs
          git commit -m "Keep nested unequal family rejection coverage"
          git push origin HEAD:codex/b3-unequal-family-test-contract
