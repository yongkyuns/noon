name: Temporary MovingAround gallery validation

on:
  push:
    branches:
      - parity/manim-gallery-moving-around-public

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add public gallery manifest entry
        run: python3 scripts/tmp_add_moving_around_gallery.py
      - name: Use stable Rust and wasm target
        run: |
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Build browser package
        env:
          NOON_SKIP_PLAYGROUND_TEST: "1"
          NOON_WASM_SKIP_OPT: "1"
        run: bash scripts/build-web-demo.sh
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Validate tri-language semantic parity
        run: node scripts/cross-language-parity.mjs
      - name: Execute exact-source tutorial corpus
        run: node scripts/manim-tutorial-smoke.mjs
      - name: Commit only public gallery metadata
        run: |
          git rm scripts/tmp_add_moving_around_gallery.py .github/workflows/tmp-moving-around-gallery-validation.yml
          git add web/python/examples/manim_tutorial_manifest.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Promote tri-language Manim MovingAround demo"
          git push origin HEAD:parity/manim-gallery-moving-around-public
