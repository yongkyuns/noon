name: C5 session inspection qualification

on:
  push:
    branches: [validation/c5-session-inspection-20260923]
    paths:
      - crates/noon/src/execution_session/inspection.rs
      - crates/noon/src/execution_session/inspection/tests.rs
      - scripts/validation/c5-session-inspection.py
      - .github/workflows/c5-session-inspection-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c5-session-inspection-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      BASE_SHA: 697847e30399977ae38751f05e22306756577640
      FEATURE_BRANCH: feat/c5-session-inspection-view
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Prepare exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/c5-session-proof
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --name-only "$BASE_SHA" HEAD | sort > /tmp/c5-session-proof/staging-paths.txt
          printf '%s\n' .github/workflows/c5-session-inspection-validation.yml crates/noon/src/execution_session/inspection.rs crates/noon/src/execution_session/inspection/tests.rs scripts/validation/c5-session-inspection.py | sort | diff -u - /tmp/c5-session-proof/staging-paths.txt
          python3 scripts/validation/c5-session-inspection.py
          rustup install
          rustc --version --verbose | tee /tmp/c5-session-proof/rust-version.txt
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          cp crates/noon/src/execution_session/input/presentation.rs /tmp/c5-session-presentation.good.rs
      - name: Focused shared session and view qualification
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p noon --no-default-features --lib inspection -- --nocapture 2>&1 | tee /tmp/c5-session-proof/inspection.log
          cargo test -p noon --no-default-features --lib execution_session::input -- --nocapture 2>&1 | tee /tmp/c5-session-proof/input.log
          cargo test -p noon --no-default-features --lib execution_session::selection -- --nocapture 2>&1 | tee /tmp/c5-session-proof/selection.log
          cargo check -p noon --no-default-features --target wasm32-unknown-unknown 2>&1 | tee /tmp/c5-session-proof/wasm.log
      - name: ABA stale-view negative control
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/noon/src/execution_session/input/presentation.rs')
          s = p.read_text()
          old = 'self.inspection_revision != session.inspection_view_revision()'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'false'))
          PY
          set +e
          cargo test -p noon --no-default-features --lib execution_session::inspection::tests::zoom_out_and_back_does_not_revive_an_old_displayed_snapshot -- --exact --nocapture > /tmp/c5-session-proof/negative-control.log 2>&1
          result=$?
          set -e
          cp /tmp/c5-session-presentation.good.rs crates/noon/src/execution_session/input/presentation.rs
          test "$result" -ne 0
          grep -F 'test result: FAILED. 0 passed; 1 failed' /tmp/c5-session-proof/negative-control.log
          cargo test -p noon --no-default-features --lib inspection -- --nocapture 2>&1 | tee /tmp/c5-session-proof/restored.log
      - name: Repository fast gate
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check.sh fast "$BASE_SHA" 2>&1 | tee /tmp/c5-session-proof/fast.log
      - name: Publish clean tested source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cmp /tmp/c5-session-presentation.good.rs crates/noon/src/execution_session/input/presentation.rs
          git read-tree "$BASE_SHA"
          paths=(crates/noon/src/execution_session.rs crates/noon/src/execution_session/input.rs crates/noon/src/execution_session/input/presentation.rs crates/noon/src/execution_session/inspection.rs crates/noon/src/execution_session/inspection/tests.rs crates/noon/src/inspection_view.rs crates/noon/src/lib.rs)
          git add "${paths[@]}"
          git diff --cached --name-only "$BASE_SHA" > /tmp/c5-session-proof/paths.txt
          printf '%s\n' "${paths[@]}" | sort | diff -u - /tmp/c5-session-proof/paths.txt
          tree=$(git write-tree)
          printf '%s\n' "$tree" > /tmp/c5-session-proof/tree.txt
          git diff --cached --binary "$BASE_SHA" > /tmp/c5-session-proof/source.patch
          git diff --cached --stat "$BASE_SHA" > /tmp/c5-session-proof/source.stat
          git archive "$tree" | gzip > /tmp/c5-session-proof/source.tar.gz
          sha256sum /tmp/c5-session-proof/source.tar.gz > /tmp/c5-session-proof/source.sha256
          cp Cargo.lock /tmp/c5-session-proof/Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(git commit-tree "$tree" -p "$BASE_SHA" -m 'C5: own inspection navigation and stale-view rejection in the shared session (#1714)')
          test -z "$(git ls-remote --heads origin "refs/heads/$FEATURE_BRANCH")"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "$commit:refs/heads/$FEATURE_BRANCH"
          printf '%s\n' "$commit" > /tmp/c5-session-proof/commit.txt
          git cat-file -p "$commit" > /tmp/c5-session-proof/commit-object.txt
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: c5-session-inspection-proof
          path: /tmp/c5-session-proof
          retention-days: 7
          if-no-files-found: error
