name: Phase B scale pivot prep

on:
  push:
    branches:
      - codex/74-scale-pivot-prep

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 7edd6b41feee02355943868d48754bf0e23a706b
          fetch-depth: 0
      - name: Apply bounded scale-pivot slice
        run: python .github/phase-b-scale-pivot-prep.py
      - name: Format and focused validation
        run: |
          rustup target add wasm32-unknown-unknown
          cargo fmt --all -- --check
          cargo test -p noon manim_scale_preserves_center_and_resolves_explicit_point_and_edge_pivots
          cargo check -p noon-web --target wasm32-unknown-unknown
          python -m py_compile web/python/_manim_semantic_handles.py scripts/manim-differential.py
          git diff --check
      - name: Publish product branch
        run: |
          git config user.name "noon phase-b worker"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B codex/74-scale-pivot-parity
          git add crates/noon/src/semantic_mobject.rs crates/noon/src/semantic_mobject/tests.rs crates/noon-web/src/authoring_mobject.rs web/python/_manim_semantic_handles.py scripts/manim-differential.py
          git commit -m "fix: match Manim scale pivots (#74)"
          git push origin HEAD:refs/heads/codex/74-scale-pivot-parity
