name: Triangle light pre-merge review

# Temporary #2056 review tooling; the established playground- family keeps this
# workflow in the strict CI topology inventory. Required showcase gates stay intact.
on:
  pull_request:
    paths:
      - 'web/python/examples/showcase_triangle_light*'
      - 'web/python/test_showcase_triangle_light*'
      - 'scripts/showcase-triangle-light-*'
      - '.github/workflows/playground-triangle-light-review.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: triangle-light-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Runnable preview and actual WebGL review
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      NOON_SHOWCASE_BACKEND: webgl
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Focused source and package regressions
        run: |
          python3 -m unittest discover -s web/python -p 'test_showcase_triangle_light*.py' -v
          python3 scripts/showcase-triangle-light-preview.test.py -v
          python3 scripts/showcase-triangle-light-deps.test.py -v
      # The existing capture and replay oracles deliberately bind scene checkout
      # and compiled runtime to one exact revision. Reusing an earlier Pages
      # artifact is valid only for informal authoring, not this review gate.
      - name: Build this exact PR head for source-bound capture and replay
        uses: ./.github/actions/dev-wasm-build
        with:
          preflight: 'true'
      - name: Verify the compiled runtime and checkout share the exact PR revision
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          expected = os.environ["SOURCE_SHA"]
          checkout = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          built = json.loads(pathlib.Path("web/runtime-build-identity.json").read_text())
          if checkout != expected or built.get("sourceRevision") != expected:
              raise SystemExit(
                  f"Refusing mixed-revision review: source={expected}, checkout={checkout}, "
                  f"runtime={built.get('sourceRevision')}"
              )
          print(f"Matched source, checkout and compiled runtime revision {expected}")
          PY
      - name: Preserve pinned browser-Python resources for reproducible offline inspection
        id: deps
        run: python3 scripts/showcase-triangle-light-deps.py
      - name: Retain complete external runtime inputs separately from the preview
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: triangle-light-browser-deps
          path: browser-smoke-artifacts/triangle-light-browser-deps
          retention-days: 3
      - name: Install the repository-pinned browser tools
        if: ${{ success() }}
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Capture and record the actual candidate through the existing Noon hosts
        id: candidate
        if: ${{ success() }}
        run: node scripts/showcase-triangle-light-candidate.mjs
      - name: Retain actual frames, playback video, replay results and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: triangle-light-actual-review
          path: browser-smoke-artifacts/triangle-light/webgl
          if-no-files-found: warn
          retention-days: 7
      - name: Package only after actual candidate playback and replay pass
        if: ${{ success() && steps.candidate.outcome == 'success' }}
        run: python3 scripts/showcase-triangle-light-preview.py --output browser-smoke-artifacts/triangle-light-preview --source-revision "$SOURCE_SHA"
      - name: Deliver the validated WebGL preview for user visual review
        uses: actions/upload-artifact@v7
        with:
          name: triangle-light-preview
          path: browser-smoke-artifacts/triangle-light-preview
          if-no-files-found: error
          retention-days: 7
