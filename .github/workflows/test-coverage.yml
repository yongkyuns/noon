name: Test coverage

on:
  push:
    branches:
      - master
    paths:
      - "crates/**"
      - "web/**"
      - "scripts/**"
      - "compat/**"
      - ".github/workflows/test-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Test inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Generate inventory
        run: |
          python3 scripts/test-inventory.py \
            --check \
            --json test-artifacts/test-inventory.json \
            --markdown test-artifacts/test-inventory.md
      - name: Validate semantic ownership inventory
        run: python3 scripts/semantic_ownership_check.py
      - name: Upload inventory
        uses: actions/upload-artifact@v7
        with:
          name: test-inventory
          path: test-artifacts/test-inventory.*
          if-no-files-found: error
          retention-days: 3

  rust:
    name: Rust coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use repository-pinned Rust
        run: |
          rustup install
          rustup show active-toolchain
          rustc --version --verbose
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-llvm-cov
          fallback: none
      - name: Install native audio build dependencies
        run: bash scripts/ci-install-reference-deps.sh libasound2-dev pkg-config
      - name: Generate Rust coverage
        run: |
          mkdir -p test-artifacts
          cargo llvm-cov --workspace --all-features \
            --lcov --output-path test-artifacts/rust.lcov
      - name: Upload Rust coverage
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: test-artifacts/rust.lcov
          if-no-files-found: error
          retention-days: 3

  scripting:
    name: Python and JavaScript coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use fixed Node test runner
        uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python coverage
        run: |
          python -m pip install --disable-pip-version-check "coverage==7.6.12"
          mkdir -p test-artifacts
          coverage run --source=web/python \
            -m unittest discover -s web/python -p 'test_*.py'
          coverage json -o test-artifacts/python-coverage.json
          coverage report > test-artifacts/python-coverage.txt
          cat test-artifacts/python-coverage.txt
      - name: JavaScript coverage
        run: |
          node --version
          npm install --no-save --ignore-scripts c8@10.1.3
          npx c8 \
            --reporter=json-summary \
            --reporter=text \
            --report-dir=test-artifacts/js \
            node --test web/*.test.mjs
      - name: Upload scripting coverage
        uses: actions/upload-artifact@v7
        with:
          name: scripting-coverage
          path: |
            test-artifacts/python-coverage.json
            test-artifacts/python-coverage.txt
            test-artifacts/js
          if-no-files-found: error
          retention-days: 3
