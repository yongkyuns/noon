name: Temporary 1544 restack cleanup

on:
  push:
    branches:
      - codex/1533-scene-family-layout-restacked

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/1533-scene-family-layout-restacked
          fetch-depth: 0
      - name: Remove dead family-layout delegate and self
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/noon/src/live_session/family_layout.rs")
          text = path.read_text()
          block = """    fn family_layout_members(
              &self,
              family: &MobjectFamily,
          ) -> Result<(Vec<noon_core::SemanticNodeId>, Option<Bounds2D64>), LiveSessionError> {
              self.family_layout_measure(family, false)
          }

          """
          if text.count(block) != 1:
              raise SystemExit(f"expected one dead delegate, found {text.count(block)}")
          text = text.replace(block, "", 1)
          if "fn family_layout_members(" in text:
              raise SystemExit("dead delegate still present after replacement")
          path.write_text(text)
          PY
          rm .github/workflows/tmp-1544-restack-clean.yml
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/tmp-1544-restack-clean.yml crates/noon/src/live_session/family_layout.rs "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove dead family layout delegate"
          git push origin HEAD:codex/1533-scene-family-layout-restacked
