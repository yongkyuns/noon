name: B3 CenterTranslation fixes
on:
  push:
    branches: [b3-cyclic-replace-adapter]
    paths:
      - scripts/_b3_center_fix.py
      - .github/workflows/b3-center-fix.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: b3-cyclic-replace-adapter, fetch-depth: 0}
      - run: python3 scripts/_b3_center_fix.py
      - run: cargo fmt --all
      - id: check
        continue-on-error: true
        run: |
          set -o pipefail
          cargo check -p noon-core -p noon-compile -p noon 2>&1 | tee .b3-center-status2.txt
      - if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/noon-core crates/noon-compile crates/noon .b3-center-status2.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'B3: fix activation-time center translation compile [b3-center-fix]'
            git push origin HEAD:b3-cyclic-replace-adapter
          fi
      - if: steps.check.outcome != 'success'
        run: exit 1
