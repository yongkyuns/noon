name: Layer Dependency Ratchet

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layer-dependency-ratchet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-layering:
    name: Engine dependency direction stays one-way
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use repository-pinned Cargo for scanner and fixtures
        run: |
          # Temporary fixture workspaces do not inherit rust-toolchain.toml.
          active_toolchain="$(rustup show active-toolchain)"
          toolchain="${active_toolchain%% *}"
          test -n "$toolchain"
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          cargo --version
          python3 --version

      - name: Validate ratchet scripts
        run: |
          bash -n scripts/layer-dependency-ratchet.sh scripts/layer-dependency-ratchet.test.sh
          python3 -m py_compile scripts/layer_dependency_ratchet.py scripts/layer_dependency_ratchet_test.py

      - name: Prove ratchet catches forbidden edges
        run: bash scripts/layer-dependency-ratchet.test.sh

      - name: Enforce architecture layer dependencies
        run: bash scripts/layer-dependency-ratchet.sh
