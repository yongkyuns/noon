name: Riemann snapshot repair validation
on:
  push:
    branches: [codex/b5-riemann-snapshot-repair]
permissions:
  contents: write
concurrency:
  group: riemann-snapshot-repair
  cancel-in-progress: true
jobs:
  repair:
    if: github.repository == 'yongkyuns/noon'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_HEAD: d5cd0e24da22955ebe77a082911f74592cd1c589
      STACK_BASE: f0c120e916ddde2714ed785b6c4114e6fb04ce83
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 30
      - name: Apply source repair without changing an active branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/b5-riemann-snapshot-repair
          git cat-file -e "$STACK_BASE^{commit}"
          for part in core web tests smoke; do
            git show "$GITHUB_SHA:.github/riemann-repair-$part.py" > "/tmp/riemann-repair-$part.py"
            python3 -m py_compile "/tmp/riemann-repair-$part.py"
          done
          git checkout --detach "$SOURCE_HEAD"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          for part in core web tests smoke; do python3 "/tmp/riemann-repair-$part.py"; done
          git diff --check
          node --input-type=module --check < web/plotting-smoke.js
          PYTHONPATH=web/python python3 -m unittest discover -s web/python -p test_manim_riemann_plan.py -v
      - name: Use repository-pinned Rust
        run: rustup install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Format and run the complete repository fast gate
        run: |
          cargo fmt --all
          bash scripts/check.sh fast "$STACK_BASE"
      - name: Publish only the validated source commit to a fresh candidate branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {
              'crates/noon/src/coordinate_authoring/area.rs',
              'crates/noon/src/coordinate_authoring.rs',
              'crates/noon/src/lib.rs',
              'crates/noon/src/example_scenes/area_helpers.rs',
              'crates/noon-web/src/authoring_coordinates/riemann.rs',
              'crates/noon/src/coordinate_authoring/area/tests.rs',
              'web/python/_manim_plotting.py',
              'web/python/test_manim_riemann_plan.py',
              'web/plotting-smoke.js',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          changed.update(subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          assert changed == expected, (changed - expected, expected - changed)
          subprocess.run(['git','add','--',*sorted(expected)], check=True)
          PY
          git diff --cached --check
          git diff --cached --stat
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME='github-actions[bot]' GIT_COMMITTER_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(printf '%s\n' 'fix: capture Riemann evaluation in one validated Rust plan' | git commit-tree "$tree" -p "$SOURCE_HEAD")
          test "$(git rev-parse "$commit^")" = "$SOURCE_HEAD"
          git push origin "$commit:refs/heads/codex/b5-riemann-candidate-$GITHUB_RUN_ID"
          echo "VALIDATED_COMMIT=$commit"
          echo "Validated commit: $commit" >> "$GITHUB_STEP_SUMMARY"
