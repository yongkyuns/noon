name: M1 current-master qualification (temporary)
on:
  push:
    branches: [codex/m1-master-validation-28ef]
    paths: [.github/workflows/m1-master-validation.yml]
permissions:
  contents: read
  actions: write
concurrency:
  group: m1-master-qualification-28ef
  cancel-in-progress: true
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify merge parents and dispatch canonical CI for exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected=68f7b40b877c24c26af2795af776e25deb6a153c
          actual=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            https://api.github.com/repos/yongkyuns/noon/git/refs/heads/codex/m1-master-integration-28ef | jq -r '.object.sha')
          test "$actual" = "$expected"
          parents=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            https://api.github.com/repos/yongkyuns/noon/git/commits/$actual | jq -r '[.parents[].sha] | join(" ")')
          test "$parents" = "cebee8fc0604cb7691c2bac2871eac0d98887c58"
          merge_parents=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            https://api.github.com/repos/yongkyuns/noon/git/commits/cebee8fc0604cb7691c2bac2871eac0d98887c58 | jq -r '[.parents[].sha] | join(" ")')
          test "$merge_parents" = "28ef95accb372ec4176e584511e712bbcb6c09bb 7efc1a0fbfb94bfba1cdb28b35b396f047fe98a6"
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"codex/m1-master-integration-28ef"}' \
            https://api.github.com/repos/yongkyuns/noon/actions/workflows/ci.yml/dispatches
          echo "Dispatched canonical CI for exact master-integration candidate $actual"
