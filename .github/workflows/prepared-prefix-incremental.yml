name: Incremental prepared prefix experiment
on:
  push:
    branches: [experimental/prepared-prefix-incremental]
permissions:
  contents: write
concurrency:
  group: prepared-prefix-incremental-experiment
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      - name: Pin base and apply checked module wiring
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin a1808765ef106392c1c20b84fe84f09639f5dfc3
          mkdir -p prefix-incremental-artifacts
          if test -f scripts/apply-prepared-prefix-experiment.py; then
            python3 scripts/apply-prepared-prefix-experiment.py
          fi
          rustup show active-toolchain
          rustc --version --verbose | tee prefix-incremental-artifacts/rustc.log
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: prefix-incremental-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
      - name: Format exact candidate and check architecture
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check 2>&1 | tee prefix-incremental-artifacts/format.log
          bash scripts/check.sh architecture a1808765ef106392c1c20b84fe84f09639f5dfc3 2>&1 | tee prefix-incremental-artifacts/architecture.log
      - name: Sparse transfer and semantic reactive admission
        run: |
          set -euo pipefail
          cargo test -p noon-runtime --features prepared-prefix --test prefix_transfer --test prefix_reactive_admission --test finite_replay_locality --test reconciled_replay -- --nocapture 2>&1 | tee prefix-incremental-artifacts/runtime.log
      - name: Source-owner boundary and existing isolation tests
        run: |
          set -euo pipefail
          cargo test -p noon --no-default-features --features prepared-prefix --lib prefix_probe -- --nocapture --test-threads=1 2>&1 | tee prefix-incremental-artifacts/isolation.log
          cargo test -p noon --no-default-features --features prepared-prefix --test prepared_prefix_incremental --test finite_replay_history --test scalar_timeline_replay --test segment_decimal_endpoints -- --nocapture 2>&1 | tee prefix-incremental-artifacts/session.log
      - name: Real Vulkan incremental-prefix frames
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers >/dev/null
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-prefix"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          cargo test -p noon --no-default-features --features prepared-prefix --test prepared_prefix_incremental -- --ignored --nocapture --test-threads=1 2>&1 | tee prefix-incremental-artifacts/raster.log
      - name: Default-off control and direct WASM compilation
        run: |
          set -euo pipefail
          cargo test -p noon --no-default-features --test finite_replay_history --test scalar_timeline_replay --test segment_decimal_endpoints 2>&1 | tee prefix-incremental-artifacts/default-off.log
          cargo check -p noon --no-default-features --features prepared-prefix --target wasm32-unknown-unknown 2>&1 | tee prefix-incremental-artifacts/wasm.log
      - name: Commit tested wiring only to this experimental branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/experimental/prepared-prefix-incremental'
          git diff -- crates docs > prefix-incremental-artifacts/tested-source.patch
          git rev-parse HEAD > prefix-incremental-artifacts/trigger-commit.txt
          cp Cargo.lock prefix-incremental-artifacts/selected-Cargo.lock
          git fetch origin experimental/prepared-prefix-incremental
          test "$(git rev-parse origin/experimental/prepared-prefix-incremental)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/noon-core/src/reactive/native_reactive/compute_ir.rs
          git add crates/noon-compile/Cargo.toml crates/noon-compile/src/replay_revision.rs crates/noon-compile/src/replay_revision/prefix.rs
          git add crates/noon-runtime/Cargo.toml crates/noon-runtime/src/lib.rs crates/noon-runtime/src/replay.rs crates/noon-runtime/src/replay/prefix.rs crates/noon-runtime/src/reactive/runtime.rs crates/noon-runtime/tests/prefix_transfer.rs crates/noon-runtime/tests/prefix_reactive_admission.rs
          git add crates/noon/Cargo.toml crates/noon/src/lib.rs crates/noon/src/execution_session/replay.rs crates/noon/src/execution_session/replay/prefix.rs crates/noon/tests/prepared_prefix_incremental.rs docs/architecture.md
          if test -f scripts/apply-prepared-prefix-experiment.py; then git rm scripts/apply-prepared-prefix-experiment.py; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Wire and format validated incremental prefix experiment (#2211)'
            git push origin HEAD:experimental/prepared-prefix-incremental
          fi
          git diff --exit-code -- crates docs
          git rev-parse HEAD > prefix-incremental-artifacts/validated-commit.txt
      - name: Preserve actual results including failures
        if: always()
        run: |
          set -euo pipefail
          mkdir -p prefix-incremental-artifacts
          git diff -- crates docs > prefix-incremental-artifacts/remaining-source.patch
          git rev-parse HEAD > prefix-incremental-artifacts/checkout-commit.txt
          if test -f Cargo.lock; then cp Cargo.lock prefix-incremental-artifacts/selected-Cargo.lock; fi
          tar -czf prefix-incremental-artifacts/candidate-source.tar.gz \
            crates/noon-core/src/reactive/native_reactive/compute_ir.rs \
            crates/noon-runtime/src/reactive/runtime.rs \
            crates/noon-runtime/src/replay/prefix.rs \
            crates/noon-runtime/tests/prefix_transfer.rs \
            crates/noon-runtime/tests/prefix_reactive_admission.rs \
            crates/noon-compile/src/replay_revision/prefix.rs \
            crates/noon/src/execution_session/replay/prefix.rs \
            crates/noon/tests/prepared_prefix_incremental.rs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: prepared-prefix-incremental
          path: prefix-incremental-artifacts
          retention-days: 3
          if-no-files-found: error
