name: Wait startup observation trace
on:
  push:
    branches: [prep/replay-forward-integration]
    paths: [.github/workflows/wait-startup-trace.yml]
permissions:
  contents: read
  actions: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bb9f4fc798422e11dd706a0819e0cf4c85e10b72
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: product-candidate-1
          run-id: 35388175324
          github-token: ${{ github.token }}
          path: web
      - name: Verify pinned runtime and add passive host tracing
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('web');ident=json.loads((root/'runtime-build-identity.json').read_text())
          assert ident['sourceRevision']=='75bdb7dedcb10c2c63f24680dc639112af8c977c'
          for role in ('worker','wasm','glue'):
              item=ident['files'][role]
              assert hashlib.sha256((root/item['path']).read_bytes()).hexdigest()==item['sha256']
          p=root/'main.js';s=p.read_text()
          trace='\nfunction waitTrace(event, detail = {}) { const entries = globalThis.__waitTrace ??= []; entries.push({event, wall: performance.now(), ...detail}); if (entries.length > 800) entries.shift(); }\n'
          s+=trace
          edits={
            'const initialState = await nextPlayer.state();':'const initialState = await nextPlayer.state(); waitTrace("initial-state", initialState);',
            'function updatePlaybackControls({ supported, player: nextPlayer, durationSeconds }) {':'function updatePlaybackControls({ supported, player: nextPlayer, durationSeconds }) { waitTrace("controls-start", {supported});',
            'async function updateWorkerMetrics() {':'async function updateWorkerMetrics() { waitTrace("poll-entry", {metricsPending, hasPlayer:player!==null, busyDepth, hasContinuation:activeSourceContinuation!==null, playerNeedsRestart});',
            'activePlayer.metrics(),':'activePlayer.metrics().then(value => { waitTrace("metrics-received"); return value; }),',
            'activePlayer.state(),':'activePlayer.state().then(value => { waitTrace("state-received", value); return value; }),',
            'playbackControls?.observe(playbackState);':'playbackControls?.observe(playbackState); waitTrace("observed", playbackState);',
            'function startMetricsPolling() {':'function startMetricsPolling() { waitTrace("poll-start", {hasTimer:metricsTimer!==null});',
          }
          for old,new in edits.items():
              assert s.count(old)==1,old
              s=s.replace(old,new)
          p.write_text(s)
          p=Path('scripts/playground-wait-clock-regression.mjs');s=p.read_text()
          old='await writeFile(path.join(out, "report.json"), JSON.stringify(report, null, 2));'
          assert s.count(old)==1
          s=s.replace(old,'report.hostTrace = await page?.evaluate(() => globalThis.__waitTrace).catch(() => null);\n  '+old)
          p.write_text(s)
          PY
      - name: Install browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Capture three cold WebGPU executions with original assertions
        run: |
          failed=0
          for sample in 1 2 3; do
            NOON_WAIT_BACKEND=webgpu NOON_WAIT_ARTIFACTS="browser-smoke-artifacts/wait-startup-$sample" node scripts/playground-wait-clock-regression.mjs || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wait-startup-observation-trace
          path: browser-smoke-artifacts
          retention-days: 7
          if-no-files-found: error
