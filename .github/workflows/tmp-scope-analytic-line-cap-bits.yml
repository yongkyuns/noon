name: Temporary line-local cap validation

on:
  push:
    branches:
      - fix/analytic-line-stroke-caps

permissions:
  contents: write

jobs:
  stage-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply line-local cap patch
        run: python3 scripts/tmp_scope_analytic_line_cap_bits.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Validate cap packing and renderer
        run: |
          cargo test -p noon-render-wgpu analytic_line
          cargo test -p noon-render-wgpu --lib
      - name: Commit implementation without temporary helpers
        run: |
          rm scripts/tmp_scope_analytic_line_cap_bits.py
          rm .github/workflows/tmp-scope-analytic-line-cap-bits.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Scope analytic line cap flags to line instances"
          git push origin HEAD:fix/analytic-line-stroke-caps
