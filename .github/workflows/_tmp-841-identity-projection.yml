name: Temporary identity projection fix

on:
  push:
    branches:
      - tmp/841-identity-projection-fix

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/841-identity-projection-fix
      - name: Apply identity projection fix
        run: python scripts/_tmp_841_identity_projection.py
      - name: Validate Python authoring
        run: |
          python -m pip install -q pytest
          python -m compileall -q web/python
          PYTHONPATH=web/python python -m pytest -q web/python/test_*.py
          node scripts/build-python-worker.mjs
          git diff --check
      - name: Remove temporary machinery
        run: rm scripts/_tmp_841_identity_projection.py .github/workflows/_tmp-841-identity-projection.yml
      - name: Commit fixed source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Keep legacy identities definition-scoped"
          git push origin HEAD:tmp/841-identity-projection-fix
