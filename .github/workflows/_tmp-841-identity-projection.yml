name: Temporary identity projection fix

on:
  push:
    branches:
      - tmp/841-identity-projection-fix

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/841-identity-projection-fix
      - name: Keep compatibility identities definition-scoped
        run: |
          python - <<'PY'
          from pathlib import Path

          ir = Path('web/python/_noon_ir.py')
          text = ir.read_text()
          old = '''                for object_id, key in self._object_keys.items()
            ],'''
          new = '''                for object_id, key in self._object_keys.items()
                if object_id in self._object_positions
            ],'''
          if text.count(old) != 1:
              raise RuntimeError('identity projection anchor must match exactly once')
          ir.write_text(text.replace(old, new, 1))

          test = Path('web/python/test_unified_scene_binding.py')
          text = test.read_text()
          old = '''    assert [entry["id"] for entry in scene.identity_document()["objects"]] == [0, 1, 2]
'''
          new = '''    # The legacy identity payload remains definition-scoped even though retained
    # content shares the same scene-global allocation domain.
    assert [entry["id"] for entry in scene.identity_document()["objects"]] == [0, 2]
'''
          if text.count(old) != 1:
              raise RuntimeError('mixed identity assertion anchor must match exactly once')
          test.write_text(text.replace(old, new, 1))
          PY
      - name: Validate Python authoring
        run: |
          python -m pip install -q pytest
          python -m compileall -q web/python
          PYTHONPATH=web/python python -m pytest -q web/python/test_*.py
          node scripts/build-python-worker.mjs
          git diff --check
      - name: Remove temporary workflow
        run: rm .github/workflows/_tmp-841-identity-projection.yml
      - name: Commit fixed source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Keep legacy identities definition-scoped"
          git push origin HEAD:tmp/841-identity-projection-fix
