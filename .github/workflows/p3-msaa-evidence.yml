name: Measure P3 analytic MSAA before-after

on:
  push:
    branches: [perf/p3-msaa-evidence]

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Install browser dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install chromium
      - name: Prepare P3 patch and timestamp-capable browser flags
        shell: bash
        run: |
          git diff bdb54cc56f35a13a05d2ca84ac192854dc7868b9 f2fa52b3319c9f900cfe3d7598c318720c2cbe1f -- crates/noon-render-wgpu/src/gpu.rs > /tmp/p3.patch
          cat > /tmp/enable-timestamps.py <<'PY'
          from pathlib import Path
          p = Path('scripts/perf-profile.mjs')
          s = p.read_text()
          anchor = '''      "--enable-unsafe-webgpu",\n      "--use-gpu-in-tests",\n'''
          replacement = '''      "--enable-unsafe-webgpu",\n      "--enable-dawn-features=allow_unsafe_apis",\n      "--enable-webgpu-developer-features",\n      "--use-webgpu-adapter=swiftshader",\n      "--use-gpu-in-tests",\n'''
          assert s.count(anchor) == 1, s.count(anchor)
          p.write_text(s.replace(anchor, replacement, 1))
          PY
      - name: Measure before P3
        shell: bash
        run: |
          git checkout -f bdb54cc56f35a13a05d2ca84ac192854dc7868b9
          python3 /tmp/enable-timestamps.py
          wasm-pack build crates/noon-web --target web --out-dir ../../web/pkg --release --no-opt
          NOON_PERF_BACKEND=webgpu NOON_PERF_COUNTS=10000 NOON_PERF_LAYOUTS=fixed,overdraw \
          NOON_PERF_WARMUP=30 NOON_PERF_FRAMES=300 NOON_PERF_WIDTH=1920 NOON_PERF_HEIGHT=1080 \
          NOON_PERF_PORT=4201 NOON_PERF_ARTIFACT=/tmp/p3-before.json node scripts/perf-profile.mjs
      - name: Measure P3 single-sample analytics
        shell: bash
        run: |
          git checkout -f bdb54cc56f35a13a05d2ca84ac192854dc7868b9
          python3 /tmp/enable-timestamps.py
          git apply /tmp/p3.patch
          cargo fmt --all --check
          cargo test -p noon-render-wgpu --all-features
          wasm-pack build crates/noon-web --target web --out-dir ../../web/pkg --release --no-opt
          NOON_PERF_BACKEND=webgpu NOON_PERF_COUNTS=10000 NOON_PERF_LAYOUTS=fixed,overdraw \
          NOON_PERF_WARMUP=30 NOON_PERF_FRAMES=300 NOON_PERF_WIDTH=1920 NOON_PERF_HEIGHT=1080 \
          NOON_PERF_PORT=4202 NOON_PERF_ARTIFACT=/tmp/p3-after.json node scripts/perf-profile.mjs
      - name: Publish percentile evidence
        shell: bash
        run: |
          python3 - <<'PY' | tee /tmp/p3-summary.md
          import json, math
          before = json.load(open('/tmp/p3-before.json'))
          after = json.load(open('/tmp/p3-after.json'))
          def fmt(v):
              return '—' if v is None or not isinstance(v, (int, float)) or not math.isfinite(v) else f'{v:.3f} ms'
          print('| Layout | GPU p50 before | GPU p50 after | GPU p95 before | GPU p95 after | GPU p99 before | GPU p99 after | p95 gain | Frame p95 before | Frame p95 after |')
          print('|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|')
          for b, a in zip(before['cases'], after['cases']):
              assert b['workload']['layout'] == a['workload']['layout']
              layout = b['workload']['layout']
              bg, ag = b['gpu']['renderPassMs'], a['gpu']['renderPassMs']
              bc, ac = b['cadence']['frameIntervalMs'], a['cadence']['frameIntervalMs']
              bp, ap = bg.get('p95'), ag.get('p95')
              gain = f'{(bp-ap)/bp*100:.1f}%' if isinstance(bp,(int,float)) and isinstance(ap,(int,float)) and bp else '—'
              print(f"| {layout} | {fmt(bg.get('p50'))} | {fmt(ag.get('p50'))} | {fmt(bp)} | {fmt(ap)} | {fmt(bg.get('p99'))} | {fmt(ag.get('p99'))} | {gain} | {fmt(bc.get('p95'))} | {fmt(ac.get('p95'))} |")
          PY
          cat /tmp/p3-summary.md >> "$GITHUB_STEP_SUMMARY"
