name: Temporary updater lifecycle validation

on:
  push:
    branches:
      - parity/manim-rotation-updater-lifecycle

permissions:
  contents: write

jobs:
  stage-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply exact lifecycle patches
        run: |
          sed -i 's/2.0 + f64::EPSILON/2.0 + 1.0e-12/' scripts/tmp_rotation_updater_lifecycle.py
          python3 scripts/tmp_rotation_updater_lifecycle.py
          python3 scripts/tmp_rotation_updater_lifecycle_fix.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("web/python/test_manim_updater_lifecycle.py")
          text = path.read_text()
          text = text.replace(
              'msg=f"stdout:\n{completed.stdout}\nstderr:\n{completed.stderr}",',
              'msg=f"stdout:\\n{completed.stdout}\\nstderr:\\n{completed.stderr}",',
          )
          path.write_text(text)
          PY
      - name: Format Rust
        run: cargo fmt --all
      - name: Validate shared callback schedule
        run: |
          cargo test -p noon-core host_callbacks
          cargo test -p noon-runtime host_callbacks
          cargo test -p noon-web host_player
      - name: Validate Python updater lifecycle
        env:
          PYTHONPATH: web/python
        run: python3 -m unittest web/python/test_manim_updater_lifecycle.py web/python/test_updater_snapshot.py
      - name: Validate worker syntax
        run: node --check web/execution-engine-worker.js
      - name: Commit implementation without temporary helpers
        run: |
          rm scripts/tmp_rotation_updater_lifecycle.py
          rm scripts/tmp_rotation_updater_lifecycle_fix.py
          rm .github/workflows/tmp-rotation-updater-lifecycle.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Support scheduled Manim updater lifecycles"
          git push origin HEAD:parity/manim-rotation-updater-lifecycle
