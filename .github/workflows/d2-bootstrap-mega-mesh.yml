name: D2 bootstrap mega mesh
on:
  push:
    branches:
      - arch/d2-packed-mega-mesh
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.event.head_commit.message == 'Bootstrap D2 packed mega-mesh implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/d2-packed-mega-mesh
      - name: Apply packed mega-mesh implementation
