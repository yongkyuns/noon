name: M1 public Scene source handoff (temporary)
on:
  push:
    branches: [codex/m1-public-handoff-cc1a]
    paths: [.github/workflows/m1-public-handoff.yml]
permissions:
  contents: read
concurrency:
  group: m1-public-source-handoff-cc1a
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: handoff
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: baf90319baa38dcaab252a4bc0f5a48d6f463ecb
          path: candidate
      - name: Verify source pack, every changed blob and complete product tree
        working-directory: candidate
        run: |
          mkdir -p "$RUNNER_TEMP/m1-public-receipt"
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess, zlib
          git = lambda *args: subprocess.check_output(['git', *args])
          assert git('rev-parse', 'HEAD').decode().strip() == 'baf90319baa38dcaab252a4bc0f5a48d6f463ecb'
          encoded = ''.join(pathlib.Path(f'../handoff/.github/ci/m1-public-source-{i}.b64').read_text().strip() for i in [1, 2])
          payload = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert len(payload) == 52930
          assert hashlib.sha256(payload).hexdigest() == 'e5a9088db055053024a42872e78ff77b70f00fa0c9e3350162eda07017647f53'
          blob = lambda data: hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          entries = json.loads(payload)
          assert len(entries) == 26
          for entry in entries:
              path = pathlib.Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts
              if entry['path'] == '.github/workflows/ci.yml':
                  # The connected GitHub integration already installed the
                  # exact verified blob. Do not change it with GITHUB_TOKEN.
                  assert blob(path.read_bytes()) == entry['result']
                  continue
              if entry['base'] is None:
                  assert not path.exists()
                  before = b''
              else:
                  before = path.read_bytes()
                  assert blob(before) == entry['base'], str(path)
              text = before.decode('utf-8')
              limit = len(text)
              for start, end, replacement in reversed(entry['edits']):
                  assert 0 <= start <= end <= limit
                  text = text[:start] + replacement + text[end:]
                  limit = start
              after = text.encode('utf-8')
              assert blob(after) == entry['result'], str(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(after)
              subprocess.check_call(['git', 'add', '--', str(path)])
          assert git('write-tree').decode().strip() == 'b0c8df3a026865e29035eb6193ec07cd19d84448'
          staged = git('diff', '--cached', '--name-only').decode().splitlines()
          assert len(staged) == 25 and '.github/workflows/ci.yml' not in staged, staged
          # The full local gate found one obsolete blanket-admission expectation.
          # Transfer that narrow positive regression without weakening any of the
          # generation, prepared-state, abort or rollback assertions below it.
          path = pathlib.Path('crates/noon-runtime/tests/glow_semantic_publication.rs')
          before = path.read_bytes()
          assert blob(before) == '6998ac4990254529c717fc8892edc1af20761b58'
          old = '    // Normal public session admission is a separate unfinished acceptance gate.\n    assert!(validate_semantic_publication(&tx).is_err());\n'
          new = '    // Raw syntax admits the request; the held preparation below still owns\n    // profile validation, identity reservation and atomic publication.\n    validate_semantic_publication(&tx).unwrap();\n    assert_eq!(f.store.scene_revision(), revision);\n    assert_eq!(f.runtime.frame(), &frame);\n'
          text = before.decode('utf-8')
          assert text.count(old) == 1
          after = text.replace(old, new).encode('utf-8')
          assert blob(after) == 'ffd1ae2568e21343542cc60a82bc3cd5822a872a'
          path.write_bytes(after)
          subprocess.check_call(['git', 'add', '--', str(path)])
          assert git('write-tree').decode().strip() == 'f75a6ea29cfb75820b95c222bd86455679fee9cc'
          assert len(git('diff', '--cached', '--name-only').decode().splitlines()) == 25
          # The independently verified entire source tree is the acceptance
          # digest; the staged diff intentionally excludes the workflow edit.
          PY
          git diff --cached --check
      - name: Publish only verified product source to the isolated source branch
        working-directory: candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(glow): admit public Scene playback with generation-safe live targets'
          git push origin HEAD:refs/heads/codex/m1-public-source-cc1a-final
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
          receipt = {'parent': git('rev-parse', 'HEAD^'), 'commit': git('rev-parse', 'HEAD'),
              'tree': git('rev-parse', 'HEAD^{tree}'),
              'patch_sha256': 'bd46d089d66c78fabdec57dfecf6196c5b67c84e13bf4de3fa9c67a4e29b9b9a',
              'source_pack_sha256': 'e5a9088db055053024a42872e78ff77b70f00fa0c9e3350162eda07017647f53',
              'scope': 'source integrity only; local tests and current-head CI are separate',
              'files': git('diff', '--name-only', 'HEAD^', 'HEAD').splitlines()}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'm1-public-receipt', 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m1-public-source-receipt
          path: ${{ runner.temp }}/m1-public-receipt/
          if-no-files-found: warn
          retention-days: 1
