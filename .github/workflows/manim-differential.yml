name: Manim differential

on:
  push:
    branches:
      - master
    paths-ignore:
      - "crates/**/tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manim-differential-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantics:
    name: ManimCE 0.21.0 semantics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Manim system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config
      - name: Install pinned ManimCE reference
        run: python -m pip install --disable-pip-version-check "manim==0.21.0"
      - name: Compare supported Noon semantics with ManimCE
        run: |
          python scripts/manim-differential.py
          python scripts/manim-dot-ellipse-differential.py
          python scripts/manim-sector-differential.py
          python scripts/manim-elbow-differential.py
          python scripts/manim-frame-sampling-differential.py
