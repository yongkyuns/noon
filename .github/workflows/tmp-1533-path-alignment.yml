name: Temporary 1533 path alignment migration

on:
  push:
    branches:
      - codex/1533-scene-path-alignment-work

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Migrate path alignment onto Scene ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Neutral preparation stays canonical; running publication captures coherent
          # state and publishes resources + semantic edits atomically through the
          # existing ExecutionSession authority.
          Path("crates/noon/src/path_alignment.rs").write_text(r'''//! Pair alignment uses the same atomic retained-resource transaction as family edits.
          use crate::{
              path_editing::{world_path, PreparedPathEdits},
              AuthoringError, ExecutionSession, Mobject,
          };
          use noon_core::{SemanticNodeId, SemanticObjectState, SemanticStore};
          use std::{cell::RefCell, rc::Rc};

          pub(crate) fn prepare_alignment(
              store: &SemanticStore,
              left: (SemanticNodeId, SemanticObjectState),
              right: (SemanticNodeId, SemanticObjectState),
          ) -> Result<PreparedPathEdits, AuthoringError> {
              let original_a = world_path(store, &left.1)?;
              let original_b = world_path(store, &right.1)?;
              let (a, b) =
                  noon_geometry::align_paths(&original_a, &original_b).map_err(AuthoringError::PathQuery)?;
              let mut replacements = Vec::new();
              if a != original_a {
                  replacements.push((left.0, left.1, a));
              }
              if b != original_b {
                  replacements.push((right.0, right.1, b));
              }
              PreparedPathEdits::prepare(store, replacements)
          }

          /// Align two vector paths from one coherent running publication.
          ///
          /// This is a low-level host bridge for integrations that already own the
          /// semantic store/root and execution component. Ordinary application code
          /// should use [`crate::Scene::align_points`].
          pub fn publish_align_points(
              store: &Rc<RefCell<SemanticStore>>,
              root: SemanticNodeId,
              execution: &mut ExecutionSession,
              left: &Mobject,
              right: &Mobject,
          ) -> Result<(), AuthoringError> {
              if !Rc::ptr_eq(store, left.integration_store())
                  || !Rc::ptr_eq(store, right.integration_store())
              {
                  return Err(AuthoringError::ForeignStore);
              }
              left.validate()?;
              right.validate()?;
              if left.node_id() == right.node_id() {
                  return Ok(());
              }
              execution
                  .require_resource_creation_at_root(&store.borrow(), root)
                  .map_err(AuthoringError::from)?;
              let left_state = crate::effective_capture::capture_mobject_state(store, execution, left)?;
              let right_state =
                  crate::effective_capture::capture_mobject_state(store, execution, right)?;
              let mut store = store.borrow_mut();
              prepare_alignment(
                  &store,
                  (left.node_id(), left_state),
                  (right.node_id(), right_state),
              )?
              .publish(&mut store, |store, transaction| {
                  execution
                      .apply_semantic_transaction_at_root(store, root, transaction)
                      .map(|_| ())
                      .map_err(AuthoringError::from)
              })
          }

          impl Mobject {
              /// Match corresponding path contour/curve counts using exact subdivision.
              /// Both operands retain identity, paint and visible shape. Publication is
              /// atomic; aliases are a no-op and unrelated geometry is untouched.
              pub fn align_points(&self, other: &Mobject) -> Result<(), AuthoringError> {
                  if !std::rc::Rc::ptr_eq(self.integration_store(), other.integration_store()) {
                      return Err(AuthoringError::ForeignStore);
                  }
                  let left = self.state()?;
                  let right = other.state()?;
                  if self.node_id() == other.node_id() {
                      return Ok(());
                  }
                  let mut store = self.integration_store().borrow_mut();
                  prepare_alignment(&store, (self.node_id(), left), (other.node_id(), right))?
                      .publish(&mut store, |store, transaction| {
                          transaction.apply(store).map_err(AuthoringError::from)
                      })?;
                  Ok(())
              }
          }
          '''.replace("          ", ""))

          # Export only the narrow low-level host bridge.
          integration = Path("crates/noon/src/integration.rs")
          text = integration.read_text()
          needle = "pub use crate::path_queries::effective_path_query;\n"
          assert text.count(needle) == 1
          text = text.replace(needle, needle + "pub use crate::path_alignment::publish_align_points;\n")
          integration.write_text(text)

          # Delete the compatibility submodule declaration from the root facade.
          live = Path("crates/noon/src/live_session.rs")
          text = live.read_text()
          needle = "mod path_alignment;\n"
          assert text.count(needle) == 1
          live.write_text(text.replace(needle, ""))

          # Scene becomes the ordinary cold/running control owner.
          scene = Path("crates/noon/src/scene.rs")
          text = scene.read_text()
          needle = '''        self.apply_semantic_transaction(transaction).map(|_| ())
              }

              /// Observe one family's effective Runtime layout'''.replace("              ", "")
          assert text.count(needle) == 1, text.count(needle)
          replacement = '''        self.apply_semantic_transaction(transaction).map(|_| ())
              }

              /// Align two vector paths while preserving identity, paint, and visible shape.
              /// Cold Scenes use authored state; running Scenes capture both operands from
              /// one coherent Runtime publication and publish resources + semantic edits
              /// atomically through the Scene-owned execution component.
              pub fn align_points(
                  &mut self,
                  left: &Mobject,
                  right: &Mobject,
              ) -> Result<(), AuthoringError> {
                  let root = self.root;
                  let store = &self.store;
                  if let Some(execution) = self.execution.as_mut() {
                      return crate::path_alignment::publish_align_points(
                          store, root, execution, left, right,
                      );
                  }
                  self.require_object(left)?;
                  self.require_object(right)?;
                  if left.node_id() == right.node_id() {
                      return Ok(());
                  }
                  let left_state = left.state()?;
                  let right_state = right.state()?;
                  let mut store = self.store.borrow_mut();
                  crate::path_alignment::prepare_alignment(
                      &store,
                      (left.node_id(), left_state),
                      (right.node_id(), right_state),
                  )?
                  .publish(&mut store, |store, transaction| {
                      transaction
                          .apply(store)
                          .map(|_| ())
                          .map_err(AuthoringError::from)
                  })
              }

              /// Observe one family's effective Runtime layout'''.replace("              ", "")
          scene.write_text(text.replace(needle, replacement))

          # Browser host uses the same low-level integration bridge as point matching.
          web = Path("crates/noon-web/src/semantic_execution_player.rs")
          text = web.read_text()
          old = '''    #[cfg(target_arch = "wasm32")]
              pub(crate) fn live_align_points(
                  &mut self,
                  left: &noon::Mobject,
                  right: &noon::Mobject,
              ) -> Result<(), AuthoringFailure> {
                  self.with_live_session(|live| live.align_points(left, right))
              }
          '''.replace("              ", "")
          new = '''    #[cfg(target_arch = "wasm32")]
              pub(crate) fn live_align_points(
                  &mut self,
                  left: &noon::Mobject,
                  right: &noon::Mobject,
              ) -> Result<(), AuthoringFailure> {
                  let semantics = self
                      .semantics
                      .clone()
                      .ok_or("execution player has no live semantic store")?;
                  let root = self
                      .semantic_root
                      .expect("live semantic store has one scene root");
                  noon::integration::publish_align_points(
                      &semantics,
                      root,
                      &mut self.session,
                      left,
                      right,
                  )
                  .map_err(AuthoringFailure::from)
              }
          '''.replace("              ", "")
          assert text.count(old) == 1, text.count(old)
          web.write_text(text.replace(old, new))

          # Existing integration tests retain authored-Mobject coverage; running
          # LiveSession-only cases move to Scene's private ownership tests.
          tests = Path("crates/noon/tests/path_alignment.rs")
          text = tests.read_text().replace(
              "use noon::{AnimationOptions, ManimGeometryOptions, Scene, Vec2, VectorPath};",
              "use noon::{ManimGeometryOptions, Scene, Vec2, VectorPath};",
          )

          def remove_test_fn(source: str, name: str) -> str:
              marker = f"#[test]\nfn {name}() {{"
              start = source.index(marker)
              brace = source.index("{", start)
              depth = 0
              end = None
              for i in range(brace, len(source)):
                  ch = source[i]
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              assert end is not None
              while end < len(source) and source[end] == "\n":
                  end += 1
              return source[:start] + source[end:]

          for name in [
              "live_alignment_publishes_both_operands_coherently",
              "live_self_alignment_is_noop_before_unsupported_current_capture",
              "live_foreign_alignment_fails_before_resource_or_frame_publication",
          ]:
              text = remove_test_fn(text, name)

          cold = r'''
          #[test]
          fn scene_alignment_uses_authored_state_before_execution() {
              let mut scene = Scene::new();
              let left = scene.line((0., 0.), (3., 0.)).unwrap();
              let right = scene.square(2.).unwrap();
              let before = left.state().unwrap();
              scene.align_points(&left, &right).unwrap();
              assert_eq!(left.path_query().unwrap().curve_count(), 4);
              assert_eq!(right.path_query().unwrap().curve_count(), 4);
              assert_eq!(left.state().unwrap().style, before.style);

              let foreign = Scene::new().circle(1.).unwrap();
              let revision = scene.revision();
              let resources = geometry_resource_count(&scene);
              let left_before = left.state().unwrap();
              assert!(scene.align_points(&left, &foreign).is_err());
              assert_eq!(left.state().unwrap(), left_before);
              assert_eq!(scene.revision(), revision);
              assert_eq!(geometry_resource_count(&scene), resources);
          }

          '''.replace("          ", "")
          marker = "#[test]\nfn empty_operand_receives_null_geometry_and_closed_contour_stays_closed()"
          assert text.count(marker) == 1
          text = text.replace(marker, cold + marker)
          tests.write_text(text)

          # Scene-internal running regressions can install and inspect owned execution.
          scene_tests = Path("crates/noon/src/scene/tests.rs")
          text = scene_tests.read_text()
          addition = r'''

          #[test]
          fn scene_path_alignment_captures_effective_operands_and_publishes_resources() {
              let mut scene = Scene::new();
              let left = scene.line((0.0, 0.0), (3.0, 0.0)).unwrap();
              let right = scene.square(2.0).unwrap();
              scene.add(&left).unwrap();
              scene.add(&right).unwrap();
              let execution = scene.execution_session().unwrap();
              scene.install_execution(execution);
              scene.owned_live().shift(&left, 1.0, 2.0).unwrap();
              let resources = scene.integration_store().borrow().geometry_resources().len();

              scene.align_points(&left, &right).unwrap();

              assert_eq!(scene.effective_path_query(&left).unwrap().curve_count(), 4);
              assert_eq!(scene.effective_path_query(&right).unwrap().curve_count(), 4);
              assert_eq!(scene.effective_path_query(&left).unwrap().start().unwrap(), (1.0, 2.0));
              assert!(scene.integration_store().borrow().geometry_resources().len() > resources);
          }

          #[test]
          fn scene_path_alignment_alias_is_noop_before_unsupported_capture() {
              let mut scene = Scene::new();
              let object = scene.circle(1.0).unwrap();
              let execution = scene.execution_session().unwrap();
              scene.install_execution(execution);
              scene
                  .owned_live()
                  .declare_and_activate_create(&object, AnimationOptions::new())
                  .unwrap();
              scene.owned_execution_mut().take_frame_changes();
              let revision = scene.revision();
              let resources = scene.integration_store().borrow().geometry_resources().len();

              scene.align_points(&object, &object).unwrap();

              assert_eq!(scene.revision(), revision);
              assert_eq!(scene.integration_store().borrow().geometry_resources().len(), resources);
              assert!(scene.owned_execution_mut().take_frame_changes().is_empty());
          }

          #[test]
          fn scene_path_alignment_foreign_target_fails_atomically() {
              let mut scene = Scene::new();
              let object = scene.line((0.0, 0.0), (3.0, 0.0)).unwrap();
              scene.add(&object).unwrap();
              let execution = scene.execution_session().unwrap();
              scene.install_execution(execution);
              scene.owned_execution_mut().take_frame_changes();
              let foreign = Scene::new().square(2.0).unwrap();
              let before = object.state().unwrap();
              let revision = scene.revision();
              let resources = scene.integration_store().borrow().geometry_resources().len();

              assert!(scene.align_points(&object, &foreign).is_err());

              assert_eq!(object.state().unwrap(), before);
              assert_eq!(scene.revision(), revision);
              assert_eq!(scene.integration_store().borrow().geometry_resources().len(), resources);
              assert!(scene.owned_execution_mut().take_frame_changes().is_empty());
          }

          #[test]
          fn scene_path_alignment_rejects_render_override_before_resource_publication() {
              let mut scene = Scene::new();
              let left = scene.line((0.0, 0.0), (3.0, 0.0)).unwrap();
              let right = scene.circle(1.0).unwrap();
              scene.add(&left).unwrap();
              let execution = scene.execution_session().unwrap();
              scene.install_execution(execution);
              scene
                  .owned_live()
                  .declare_and_activate_create(&right, AnimationOptions::new())
                  .unwrap();
              let before = left.state().unwrap();
              let revision = scene.revision();
              let resources = scene.integration_store().borrow().geometry_resources().len();

              assert!(scene.align_points(&left, &right).is_err());

              assert_eq!(left.state().unwrap(), before);
              assert_eq!(scene.revision(), revision);
              assert_eq!(scene.integration_store().borrow().geometry_resources().len(), resources);
          }
          '''.replace("          ", "")
          assert "fn scene_path_alignment_captures_effective_operands" not in text
          scene_tests.write_text(text.rstrip() + addition + "\n")

          # The compatibility implementation is deleted in this same bounded slice.
          compat = Path("crates/noon/src/live_session/path_alignment.rs")
          assert compat.exists()
          compat.unlink()
          PY

          cargo fmt --all
          git diff --check
          cargo test -p noon --test path_alignment
          cargo test -p noon --lib scene_path_alignment

          python3 - <<'PY'
          from pathlib import Path
          assert not Path("crates/noon/src/live_session/path_alignment.rs").exists()
          assert "mod path_alignment;" not in Path("crates/noon/src/live_session.rs").read_text()
          assert "with_live_session(|live| live.align_points" not in Path("crates/noon-web/src/semantic_execution_player.rs").read_text()
          assert "pub fn publish_align_points" in Path("crates/noon/src/path_alignment.rs").read_text()
          assert "pub fn align_points" in Path("crates/noon/src/scene.rs").read_text()
          PY

          rm .github/workflows/tmp-1533-path-alignment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move path alignment onto Scene-owned execution"
          git push
