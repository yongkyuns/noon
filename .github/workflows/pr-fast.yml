name: PR Fast Gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-fast-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_RW_MODE: "READ_ONLY"

jobs:
  rust-lint:
    name: Rust format and lint
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use stable Rust
        run: |
          rustup default stable
          rustup component add rustfmt clippy

      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-

      - name: Use sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  rust-test:
    name: Rust unit tests
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use stable Rust
        run: rustup default stable

      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-

      - name: Use sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Run fast Rust tests
        run: cargo test --workspace --all-features --lib

  web-preflight:
    name: Web static and unit checks
    runs-on: ubuntu-latest
    env:
      NOON_SKIP_PLAYGROUND_TEST: "1"
      NOON_WEB_PREFLIGHT_ONLY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run web preflight
        run: bash scripts/build-web-demo.sh

  web-fast:
    name: Browser fast checks
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_DIR: /home/runner/.cache/noon-sccache-wasm
      SCCACHE_CACHE_SIZE: "1G"
      SCCACHE_LOCAL_RW_MODE: "READ_ONLY"
    steps:
      - name: Start browser timing
        id: browser-clock
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify browser integration risk
        id: browser-risk
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          changed_paths="$(git diff --name-only "$BASE_SHA" HEAD)"
          printf '%s\n' "$changed_paths"
          printf '%s\n' "$changed_paths" | node scripts/pr-risk-classifier.mjs >> "$GITHUB_OUTPUT"

      - name: Use stable Rust and WASM target
        run: |
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-

      - name: Restore trusted WASM build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            /home/runner/.cache/noon-sccache-wasm
            ~/.cache/.wasm-pack
          key: ${{ runner.os }}-wasm-build-v1-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            ${{ runner.os }}-wasm-build-v1-

      - name: Use sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Build browser package once
        id: browser-package
        env:
          NOON_SKIP_WEB_PREFLIGHT: "1"
          NOON_SKIP_PLAYGROUND_TEST: "1"
          NOON_WASM_PROFILE: "dev"
          NOON_WASM_SKIP_OPT: "1"
        run: |
          SECONDS=0
          set +e
          bash scripts/build-web-demo.sh
          status=$?
          set -e
          echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.62.1

      - name: Install browser smoke dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium

      - name: Check deterministic playback
        id: deterministic-replay
        env:
          NOON_DETERMINISM_MORPH_STRESS_COUNT: "96"
        run: |
          SECONDS=0
          set +e
          node scripts/deterministic-replay-smoke.mjs
          status=$?
          set -e
          echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Check Manim-style authoring
        id: manim-authoring
        run: |
          SECONDS=0
          set +e
          node scripts/manim-compat-smoke.mjs
          status=$?
          set -e
          echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Check canonical retained execution
        if: steps.browser-risk.outputs.retained_execution == 'true'
        id: retained-execution
        run: |
          SECONDS=0
          set +e
          timeout --signal=TERM 60s node scripts/retained-execution-worker-smoke.mjs
          status=$?
          set -e
          echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Check persistent render mode switching
        if: steps.browser-risk.outputs.render_mode_switch == 'true'
        id: render-mode-switch
        run: |
          SECONDS=0
          set +e
          timeout --signal=TERM 60s node scripts/authoring-render-mode-switch-smoke.mjs
          status=$?
          set -e
          echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Check primary WebGPU rendering
        id: webgpu-smoke
        env:
          NOON_BROWSER_SMOKE_BACKEND: webgpu
          NOON_BROWSER_SMOKE_ARTIFACTS: browser-smoke-artifacts/webgpu
        run: |
          SECONDS=0
          set +e
          node scripts/browser-smoke.mjs
          status=$?
          set -e
          echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Check WebGL rendering for renderer-critical changes
        if: steps.browser-risk.outputs.renderer_critical == 'true'
        id: webgl-smoke
        env:
          NOON_BROWSER_SMOKE_BACKEND: webgl
          NOON_BROWSER_SMOKE_ARTIFACTS: browser-smoke-artifacts/webgl
        run: |
          SECONDS=0
          set +e
          node scripts/browser-smoke.mjs
          status=$?
          set -e
          echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Check canonical callback renderer observations on WebGL and WebGPU
        if: steps.browser-risk.outputs.host_updater_diagnostics == 'true'
        id: host-updater-diagnostics
        run: |
          SECONDS=0
          set +e
          node scripts/manim-host-updater-diagnostics.mjs
          status=$?
          set -e
          echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Summarize browser timing
        if: always()
        env:
          START_EPOCH: ${{ steps.browser-clock.outputs.epoch }}
          PACKAGE_SECONDS: ${{ steps.browser-package.outputs.seconds }}
          REPLAY_SECONDS: ${{ steps.deterministic-replay.outputs.seconds }}
          AUTHORING_SECONDS: ${{ steps.manim-authoring.outputs.seconds }}
          RETAINED_REQUIRED: ${{ steps.browser-risk.outputs.retained_execution }}
          RETAINED_SECONDS: ${{ steps.retained-execution.outputs.seconds }}
          MODE_SWITCH_REQUIRED: ${{ steps.browser-risk.outputs.render_mode_switch }}
          MODE_SWITCH_SECONDS: ${{ steps.render-mode-switch.outputs.seconds }}
          WEBGPU_SECONDS: ${{ steps.webgpu-smoke.outputs.seconds }}
          WEBGL_SECONDS: ${{ steps.webgl-smoke.outputs.seconds }}
          RENDERER_CRITICAL: ${{ steps.browser-risk.outputs.renderer_critical }}
          RENDERER_CRITICAL_PATHS: ${{ steps.browser-risk.outputs.renderer_critical_paths }}
          HOST_UPDATER_SECONDS: ${{ steps.host-updater-diagnostics.outputs.seconds }}
        run: |
          total=""
          if [[ "$START_EPOCH" =~ ^[0-9]+$ ]]; then
            total=$(( $(date +%s) - START_EPOCH ))
          fi

          display_seconds() {
            if [[ "$1" =~ ^[0-9]+$ ]]; then
              printf '%ss' "$1"
            else
              printf 'n/a'
            fi
          }

          retained_duration="skipped"
          if [[ "$RETAINED_REQUIRED" == "true" ]]; then
            retained_duration="$(display_seconds "$RETAINED_SECONDS")"
          fi

          mode_switch_duration="skipped"
          if [[ "$MODE_SWITCH_REQUIRED" == "true" ]]; then
            mode_switch_duration="$(display_seconds "$MODE_SWITCH_SECONDS")"
          fi

          webgl_duration="skipped"
          if [[ "$RENDERER_CRITICAL" == "true" ]]; then
            webgl_duration="$(display_seconds "$WEBGL_SECONDS")"
          fi

          {
            echo "### Browser fast checks timing"
            echo
            echo "| Phase | Duration |"
            echo "| --- | ---: |"
            echo "| Browser package | $(display_seconds "$PACKAGE_SECONDS") |"
            echo "| Deterministic replay | $(display_seconds "$REPLAY_SECONDS") |"
            echo "| Manim authoring | $(display_seconds "$AUTHORING_SECONDS") |"
            echo "| Canonical retained execution | $retained_duration |"
            echo "| Persistent render mode switching | $mode_switch_duration |"
            echo "| WebGPU smoke | $(display_seconds "$WEBGPU_SECONDS") |"
            echo "| WebGL renderer-risk smoke | $webgl_duration |"
            echo "| Host-updater diagnostics | $(display_seconds "$HOST_UPDATER_SECONDS") |"
            echo "| Measured browser path | $(display_seconds "$total") |"
            echo
            echo "Retained execution escalation required: ${RETAINED_REQUIRED:-unknown}."
            echo "Render mode-switch escalation required: ${MODE_SWITCH_REQUIRED:-unknown}."
            echo "Renderer-critical WebGL escalation required: ${RENDERER_CRITICAL:-unknown}."
            if [[ "$RENDERER_CRITICAL" == "true" ]]; then
              echo "Renderer-critical paths: ${RENDERER_CRITICAL_PATHS:-unknown}."
            fi
            echo
            echo "The measured browser path starts before checkout and ends after the renderer smoke. Hosted-runner queue time and post-job cleanup are intentionally excluded."
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$total" =~ ^[0-9]+$ ]] && (( total >= 110 )); then
            if [[ "$RENDERER_CRITICAL" == "true" ]]; then
              echo "::notice title=PR Fast Gate timing::Renderer-critical escalation extended the browser path to ${total}s; low-risk PRs retain the 120s target."
            else
              echo "::warning title=PR Fast Gate timing::Browser fast path reached ${total}s, leaving less than 10s of margin against the 120s target."
            fi
          fi
