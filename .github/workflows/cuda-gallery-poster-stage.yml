name: Stage verified CUDA poster (one-shot)

on:
  push:
    branches:
      - gallery/cuda-transpose
    paths:
      - .github/workflows/cuda-gallery-poster-stage.yml

permissions:
  contents: write
  actions: read

jobs:
  stage:
    name: Import verified renderer PNG into gallery branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v8
        with:
          name: cuda-transpose-fidelity
          run-id: 39055762669
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/cuda-fidelity
      - name: Verify and retain the exact real Noon renderer frame
        env:
          FIDELITY_DIR: ${{ runner.temp }}/cuda-fidelity
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from shutil import copyfile
          import struct
          
          root = Path.cwd()
          evidence = json.loads((root / 'web/thumbnails/showcase/cuda-transpose-capture-evidence.json').read_text())
          manifest = json.loads((root / 'web/python/examples/noon_showcase_manifest.json').read_text())
          item = next(e for e in manifest['entries'] if e['id'] == 'showcase-cuda-transpose')
          record = evidence['posters'][0]
          base = Path(os.environ['FIDELITY_DIR'])
          report = json.loads((base / 'report.json').read_text())
          case = next(c for c in report['cases'] if c['name'] == 'column-3-speed-1-none')
          sample = next(p for p in case['pixelSamples'] if p['id'] == 215 and p['alpha'] == 1)
          source = (root / 'web' / item['path']).read_bytes()
          hashed = lambda data: hashlib.sha256(data).hexdigest()
          assert report['status'] == case['status'] == 'passed'
          assert report['cudaValidated'] is False
          assert hashed(source) == report['sceneSha256'] == record['sourceSha256']
          assert sample['kind'] == 'bank' and sample['stride'] == 33
          assert sample['checked'] == sample['labels'] == 32 and sample['occluded'] == 0
          assert abs(sample['time'] - item['thumbnail_time']) < 1e-9
          source_frame = base / evidence['origin']['frame']
          png = source_frame.read_bytes()
          assert hashed(png) == record['image']['pngSha256']
          assert png[:8] == b'\x89PNG\r\n\x1a\n'
          assert (struct.unpack('>II', png[16:24])) == (1280, 720)
          receipt = json.loads(source_frame.with_suffix('.json').read_text())
          assert receipt['metrics']['backend'] == 'WebGPU'
          assert abs(receipt['state']['time'] - record['sample']['publishedTime']) < 1e-9
          assert evidence['origin']['workflowRun'] == 39055762669
          assert evidence['origin']['artifact'] == 12110234543
          output = root / 'web' / item['thumbnail']
          output.parent.mkdir(parents=True, exist_ok=True)
          copyfile(source_frame, output)
          print('Verified exact Noon-rendered frame:', output, 'sha256:', hashed(png))
          PY
      - name: Commit genuine poster and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/thumbnails/showcase/showcase-cuda-transpose.png
          git rm .github/workflows/cuda-gallery-poster-stage.yml
          git commit -m "Stage verified Noon-rendered CUDA gallery poster"
          git push origin HEAD:gallery/cuda-transpose
