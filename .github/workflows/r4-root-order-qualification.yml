name: R4 root-order qualification
on:
  push:
    branches: [codex/1292-r4-root-order-prep]
permissions:
  contents: read
concurrency:
  group: r4-root-order-qualification
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 3b9afa39703936edc13227a8b63bde64e8020bcd
          fetch-depth: 1
          persist-credentials: false
      - name: Reconcile exact product source without changing remote branches
        run: |
          git fetch --no-tags origin 9c429f36330b969968c0fc91f244bfbd6e9c8b9c
          git checkout FETCH_HEAD -- crates/noon-core/src/semantic_store.rs crates/noon-compile/src/semantic_lowering/root_order.rs crates/noon/tests/root_order_acceptance.rs crates/noon/tests/root_order_transaction_regressions.rs
          mkdir -p evidence
          git rev-parse HEAD > evidence/base.txt
          git diff --cached --binary > evidence/product.patch
          rustc --version > evidence/toolchain.txt
          cargo --version >> evidence/toolchain.txt
          cargo fetch
          cargo test -p noon --no-default-features --test root_order_acceptance --test root_order_transaction_regressions 2>&1 | tee evidence/baseline.log
      - name: Retain source and public build inputs for offline focused tests
        run: |
          tar --exclude=.git --exclude=target --exclude=evidence -czf evidence/source.tar.gz .
          toolchain="$(dirname "$(dirname "$(rustup which rustc)")")"
          tar --exclude=share/doc -C "$toolchain" -czf evidence/toolchain.tar.gz bin lib libexec
          tar -C "$HOME/.cargo" -czf evidence/registry.tar.gz registry
          sha256sum evidence/*.tar.gz > evidence/sha256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: r4-offline-test-inputs
          path: evidence
          retention-days: 1
          if-no-files-found: error
