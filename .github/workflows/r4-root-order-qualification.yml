name: R4 root-order qualification

on:
  push:
    branches: [codex/1292-r4-root-order-prep]

permissions:
  contents: read

concurrency:
  group: r4-root-order-qualification
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRODUCT_SHA: 9c429f36330b969968c0fc91f244bfbd6e9c8b9c
      MERGE_SHA: 05de7cb2af4900ad8d33d79c5c1cb8a0b0ba2257
      BASE_SHA: cd1e8aa85c9f50875072be74ec3cf7eb3d65e598
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 9c429f36330b969968c0fc91f244bfbd6e9c8b9c
          fetch-depth: 2
      - name: Use repository Rust toolchain
        run: |
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - name: Use shared compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Verify exact unmodified product head
        run: |
          set -o pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/product-checkout.txt
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          rustc --version | tee evidence/toolchain.txt
          cargo --version | tee -a evidence/toolchain.txt
          cargo fmt --all -- --check
          cargo test -p noon --no-default-features --test root_order_acceptance --test root_order_transaction_regressions --no-fail-fast -- --nocapture 2>&1 | tee evidence/product-acceptance.log
          git diff --exit-code
      - name: Verify exact integration with current master
        run: |
          set -o pipefail
          git fetch --no-tags --depth=2 origin "$MERGE_SHA"
          git checkout --detach "$MERGE_SHA"
          git rev-parse HEAD | tee evidence/integration-checkout.txt
          git show -s --format='%H%n%P%n%s' HEAD | tee evidence/integration-parents.txt
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$PRODUCT_SHA"
          cargo test -p noon --no-default-features --test root_order_acceptance --test root_order_transaction_regressions --no-fail-fast -- --nocapture 2>&1 | tee evidence/integration-acceptance.log
          git diff --exit-code
      - name: Qualify integrated architecture and Rust gates
        run: |
          set -o pipefail
          bash scripts/check.sh fast "$BASE_SHA" 2>&1 | tee evidence/integration-fast.log
      - name: Qualify integrated direct WASM compilation
        run: |
          set -o pipefail
          cargo check -p noon-web --all-features --target wasm32-unknown-unknown 2>&1 | tee evidence/integration-wasm.log
      - name: Retain exact source diagnostics
        if: always()
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/final-checkout.txt
          git diff --binary --full-index "$BASE_SHA" -- crates > evidence/integration.patch || true
          git status --porcelain > evidence/worktree-status.txt
          git ls-tree -r HEAD -- crates/noon-core/src/semantic_store.rs crates/noon-compile/src/semantic_lowering/root_order.rs crates/noon/tests/root_order_acceptance.rs crates/noon/tests/root_order_transaction_regressions.rs > evidence/source-blobs.txt
          cp crates/noon/tests/root_order_acceptance.rs evidence/
          cp crates/noon/tests/root_order_transaction_regressions.rs evidence/
          cp crates/noon-compile/src/semantic_lowering/root_order.rs evidence/
          sha256sum evidence/*.rs > evidence/source-sha256.txt
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: root-order-final-qualification
          path: evidence
          retention-days: 7
          if-no-files-found: error
