name: R3 final paired browser qualification (development only)
on:
  push:
    branches: [codex/1292-r3-callback-errors-prep]
permissions:
  contents: read
  actions: read
jobs:
  paired-browser-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 332254948a0f85a07fb2c15d7471f9dc5969b5ca
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 10120446295
          run-id: 34392333111
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/product
          merge-multiple: true
      - name: Verify exact source, configuration and every immutable package file
        shell: bash
        run: |
          set -euo pipefail
          export EVIDENCE="$RUNNER_TEMP/r3-paired-evidence"
          mkdir -p "$EVIDENCE"
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil, subprocess
          saved = Path(os.environ['RUNNER_TEMP']) / 'product'
          manifest = json.loads((saved / 'ci-artifact.json').read_text())
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          assert head == manifest['source'] == '332254948a0f85a07fb2c15d7471f9dc5969b5ca'
          assert tree == '7d28544070a08f8ef92b0890280e968b75bb0f51'
          assert manifest['schema'] == 1
          build = manifest['build']
          assert build['target'] == 'wasm32-unknown-unknown'
          assert build['profile'] == 'release' and build['features'] == 'default,renderer-smoke'
          assert build['wasmPack'] == '0.15.0' and build['toolchain'] == '1.98.0'
          for name, expected in build['inputs'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          for name, expected in manifest['files'].items():
              relative = Path(name)
              assert relative.parts[0] == 'web' and '..' not in relative.parts, name
              actual = saved.joinpath(*relative.parts[1:])
              assert hashlib.sha256(actual.read_bytes()).hexdigest() == expected, name
          assert manifest['dependencyLock'] == '9fc77831ae25df351229c9902c073657062501a8e5faf8ea313dd9c8284062dd'
          assert manifest['files']['web/ci-Cargo.lock'] == manifest['dependencyLock']
          assert manifest['files']['web/pkg/noon_web_bg.wasm'] == 'abf418f1840cb177502a24412fd66cd424ccca4ec317c8ad5ea4dbcfcf05a903'
          for name in manifest['files']:
              destination = Path(name)
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(saved.joinpath(*destination.parts[1:]), destination)
          shutil.copy2(saved / 'ci-Cargo.lock', 'Cargo.lock')
          report = {'source': head, 'tree': tree, 'pr_head': 'bba54552cd0c6649d7f7d160eafabb6ec11a8b62',
                    'artifact': 10120446295, 'producer_run': 34392333111,
                    'rust_rebuilt': False, 'full_gate_repeated': False,
                    'manifest': manifest}
          Path(os.environ['EVIDENCE'], 'input-verification.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - name: Install the existing pinned browser without an apt-index retry
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Existing paired authoring and actual production-worker family recovery
        shell: bash
        run: |
          set -euo pipefail
          node scripts/shared-authoring-smoke.mjs 2>&1 | tee "$EVIDENCE/shared-authoring.log"
          node scripts/manim-compat-smoke.mjs 2>&1 | tee "$EVIDENCE/manim.log"
      - name: Retain exact identity and results
        if: always()
        shell: bash
        run: |
          git diff --exit-code HEAD
          git status --short > "$EVIDENCE/status.txt"
          git rev-parse HEAD HEAD^{tree} > "$EVIDENCE/revisions.txt"
          node --version > "$EVIDENCE/node.txt"
          sha256sum web/pkg/noon_web_bg.wasm > "$EVIDENCE/wasm-sha256.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r3-final-paired-browser
          path: ${{ env.EVIDENCE }}
          retention-days: 3
          if-no-files-found: error
