name: R3 callback advancement overlap qualification (development only)
on:
  push:
    branches: [codex/1292-r3-callback-errors-prep]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BASE: 5b56124312657c0959e1ca3936930cad0fe7e240
      CANDIDATE: ae2d56e236749cffc9db11d8ee7ed5bcaf55b341
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Correct two native-test lint findings without altering the integrated mapper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r3-input" "$RUNNER_TEMP/r3-evidence"
          echo "EVIDENCE=$RUNNER_TEMP/r3-evidence" >> "$GITHUB_ENV"
          cp scripts/r3-callback-final-combine-prep.py "$RUNNER_TEMP/r3-input/combine.py"
          git config user.name 'Noon qualification bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --detach "$CANDIDATE"
          RUSTC_WRAPPER= python3 "$RUNNER_TEMP/r3-input/combine.py"
          git diff --cached --check
          git commit -m 'test: use direct error assertions in nested callback projection regression'
          test "$(git rev-parse HEAD^)" = "$CANDIDATE"
          git merge-base --is-ancestor "$BASE" HEAD
          git rev-parse HEAD HEAD^{tree} HEAD^ "$BASE" > "$RUNNER_TEMP/r3-evidence/revisions.txt"
          git diff "$BASE" HEAD > "$RUNNER_TEMP/r3-evidence/product.patch"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/r3-evidence/source.tar.gz"
          git push origin HEAD:refs/heads/codex/1350-final-candidate
      - uses: actions/upload-artifact@v7
        with:
          name: r3-callback-overlap-source
          path: ${{ env.EVIDENCE }}
          retention-days: 3
          if-no-files-found: error
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: wasm-pack@0.15.0
      - name: Full gate for the corrected meaningful mapping overlap
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check.sh full "$BASE" 2>&1 | tee "$EVIDENCE/full.log"
          sha256sum web/pkg/noon_web_bg.wasm > "$EVIDENCE/release-wasm-sha256.txt"
      - name: Diagnostic WASM for the same integrated source
        shell: bash
        run: |
          set -euo pipefail
          NOON_SKIP_WEB_PREFLIGHT=1 NOON_WASM_PROFILE=dev NOON_WASM_SKIP_OPT=1 bash scripts/build-web-demo.sh 2>&1 | tee "$EVIDENCE/dev-build.log"
      - name: Existing pinned browser without apt-index installation
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Existing real WASM and Pyodide matrix
        shell: bash
        run: |
          set -euo pipefail
          node scripts/typed-authoring-errors-smoke.mjs 2>&1 | tee "$EVIDENCE/boundary.log"
      - name: Existing paired production-worker recovery
        shell: bash
        run: |
          set -euo pipefail
          node scripts/shared-authoring-smoke.mjs 2>&1 | tee "$EVIDENCE/shared-authoring.log"
          node scripts/manim-compat-smoke.mjs 2>&1 | tee "$EVIDENCE/manim.log"
      - name: Retain exact source, runtime and results
        if: always()
        shell: bash
        run: |
          git status --short > "$EVIDENCE/status.txt"
          git rev-parse HEAD HEAD^{tree} > "$EVIDENCE/final-revisions.txt"
          rustc --version > "$EVIDENCE/toolchain.txt"
          node --version >> "$EVIDENCE/toolchain.txt"
          test ! -f Cargo.lock || cp Cargo.lock "$EVIDENCE/"
          test ! -d web/pkg || cp -r web/pkg "$EVIDENCE/pkg"
          test ! -f web/pkg/noon_web_bg.wasm || sha256sum web/pkg/noon_web_bg.wasm > "$EVIDENCE/dev-wasm-sha256.txt"
          test ! -d browser-smoke-artifacts/typed-authoring-errors || cp -r browser-smoke-artifacts/typed-authoring-errors "$EVIDENCE/boundary-results"
          git diff --exit-code HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r3-callback-overlap-qualification
          path: ${{ env.EVIDENCE }}
          retention-days: 3
          if-no-files-found: error
