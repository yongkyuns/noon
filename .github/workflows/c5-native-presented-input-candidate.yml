name: C5 native presented input qualification
on:
  push:
    branches: [validation/c5-native-presented-input-20260920]
permissions:
  contents: read
concurrency:
  group: c5-native-presented-input-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Assemble exact code-only candidate on the verified snapshot base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/proof"
          base64 -d candidate/c5-native-presented-input/payload.b64 | xz -d > "$GITHUB_WORKSPACE/proof/input.patch"
          echo '6125779aaed31b1abe60fe743b28f5b9e7fb68dad836ff1ad1078ea40891aa75  proof/input.patch' | sha256sum -c -
          git worktree add --detach "$RUNNER_TEMP/candidate" aa9098e251a74e21db738f5391a883b6eb071a67
          git -C "$RUNNER_TEMP/candidate" apply --check "$GITHUB_WORKSPACE/proof/input.patch"
          git -C "$RUNNER_TEMP/candidate" apply "$GITHUB_WORKSPACE/proof/input.patch"
          for patch in "$GITHUB_WORKSPACE"/candidate/c5-native-presented-input/fix*.patch; do
            if [ -f "$patch" ]; then
              git -C "$RUNNER_TEMP/candidate" apply "$patch"
              cp "$patch" "$GITHUB_WORKSPACE/proof/"
            fi
          done
          echo "CANDIDATE=$RUNNER_TEMP/candidate" >> "$GITHUB_ENV"
          echo "PROOF=$GITHUB_WORKSPACE/proof" >> "$GITHUB_ENV"
      - name: Use repository-pinned Rust
        run: |
          cd "$CANDIDATE"
          rustup install
          rustup target add wasm32-unknown-unknown
          rustc --version --verbose | tee "$PROOF/rust.txt"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with: {version: v0.16.0}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: c5-native-presented-cargo-${{ runner.os }}-${{ hashFiles('crates/**/Cargo.toml') }}
          restore-keys: |
            c5-native-presented-cargo-${{ runner.os }}-
            ${{ runner.os }}-cargo-sources-
      - name: Format and record exact source
        run: |
          cd "$CANDIDATE"
          cargo fmt --all
          git add -A
          git diff --cached --check
          git write-tree | tee "$PROOF/tree.txt"
          git diff --cached --binary --full-index > "$PROOF/formatted.patch"
          git diff --cached --stat > "$PROOF/stat.txt"
      - name: Execute shared and native pointer regressions
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          cargo test -p noon --no-default-features --lib execution_session::input::presentation::tests -- --nocapture 2>&1 | tee "$PROOF/shared.log"
          cargo test -p noon-native --all-features --lib -- --nocapture 2>&1 | tee "$PROOF/native.log"
      - name: Execute repository fast gate and unchanged JavaScript regression suite
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          bash scripts/check.sh fast aa9098e251a74e21db738f5391a883b6eb071a67 2>&1 | tee "$PROOF/fast.log"
          node --test web/*.test.mjs 2>&1 | tee "$PROOF/js.log"
      - name: Compile shared direct Rust and reduced browser WASM
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          cargo check -p noon --no-default-features --target wasm32-unknown-unknown 2>&1 | tee "$PROOF/wasm-direct.log"
          cargo check -p noon-web --no-default-features --target wasm32-unknown-unknown 2>&1 | tee "$PROOF/wasm-browser.log"
      - name: Install native virtual display and software GPU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0
      - name: Qualify actual window presentation and receipt rejection
        run: |
          set -o pipefail
          cd "$CANDIDATE"
          xvfb-run -a -s '-screen 0 1280x720x24' cargo test -p noon-native native_surface_smoke_presents_paused_click_selection_and_clear -- --ignored --nocapture --test-threads=1 2>&1 | tee "$PROOF/window.log"
          NOON_SELECTION_PROOF_DIR="$PROOF/native-pixels" cargo test -p noon --all-features --test selection_overlay_raster -- --include-ignored --nocapture 2>&1 | tee "$PROOF/pixels.log"
      - name: Verify stale-frame test detects an omitted publication guard
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          file=crates/noon/src/execution_session/input/presentation.rs
          cp "$file" "$RUNNER_TEMP/presentation-original.rs"
          trap 'cp "$RUNNER_TEMP/presentation-original.rs" "$file"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/noon/src/execution_session/input/presentation.rs')
          source = path.read_text()
          start = source.index('        if self.publication != current {')
          end = source.index('        if self.view.camera != session.camera()', start)
          path.write_text(source[:start] + source[end:])
          PY
          if cargo test -p noon-native --lib stale_presented_frame_cancels_press_without_releasing_or_retagging_coordinates -- --nocapture > "$PROOF/stale-mutation.log" 2>&1; then
            echo 'omitted publication guard unexpectedly passed' >&2
            exit 1
          fi
          grep -q 'stale_presented_frame_cancels_press_without_releasing_or_retagging_coordinates ... FAILED' "$PROOF/stale-mutation.log"
          cp "$RUNNER_TEMP/presentation-original.rs" "$file"
          trap - EXIT
          git diff --exit-code -- "$file"
      - name: Verify real window test detects omitted receipt installation
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          file=crates/noon-native/src/lib.rs
          cp "$file" "$RUNNER_TEMP/native-original.rs"
          trap 'cp "$RUNNER_TEMP/native-original.rs" "$file"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/noon-native/src/lib.rs')
          source = path.read_text()
          before = 'self.pointer.presented = Some(pointer_frame);'
          assert source.count(before) == 1
          path.write_text(source.replace(before, 'let _ = pointer_frame;'))
          PY
          if xvfb-run -a -s '-screen 0 1280x720x24' cargo test -p noon-native native_surface_smoke_presents_paused_click_selection_and_clear -- --ignored --nocapture --test-threads=1 > "$PROOF/receipt-mutation.log" 2>&1; then
            echo 'omitted receipt installation unexpectedly passed' >&2
            exit 1
          fi
          grep -q 'successful present installs a receipt' "$PROOF/receipt-mutation.log"
          cp "$RUNNER_TEMP/native-original.rs" "$file"
          trap - EXIT
          git diff --exit-code -- "$file"
          echo passed > "$PROOF/qualification.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: c5-native-presented-input-proof
          path: proof/
          if-no-files-found: error
          retention-days: 7
  publish-tested-source:
    needs: qualify
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: aa9098e251a74e21db738f5391a883b6eb071a67
          fetch-depth: 1
      - uses: actions/download-artifact@v8
        with:
          name: c5-native-presented-input-proof
          path: ${{ runner.temp }}/proof
      - name: Publish clean tested source without temporary workflow ancestry
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/proof"
          test "$(cat "$proof/qualification.txt")" = passed
          git apply "$proof/formatted.patch"
          git add -A
          test "$(git write-tree)" = "$(cat "$proof/tree.txt")"
          git -c user.name='Yongkyun Shin' -c user.email='4311628+yongkyuns@users.noreply.github.com' commit -m 'C5: admit native pointer input only against successfully presented frames'
          git push origin HEAD:refs/heads/staging/c5-native-presented-input-${{ github.run_id }}
          git rev-parse HEAD > "$RUNNER_TEMP/published.txt"
          git rev-parse HEAD^{tree} >> "$RUNNER_TEMP/published.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: c5-native-presented-input-publication
          path: ${{ runner.temp }}/published.txt
          retention-days: 7
