name: Apply Manim Circle default color

on:
  push:
    branches:
      - parity/manim-create-partial

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parity/manim-create-partial
          fetch-depth: 1
      - name: Apply constructor patch
        run: python3 scripts/_apply_manim_circle_default.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Validate Rust defaults
        run: cargo test -p noon --test manim_style_defaults
      - name: Validate Python syntax
        run: python3 -m py_compile web/python/_manim_compat.py
      - name: Remove temporary patch machinery
        run: |
          rm scripts/_apply_manim_circle_default.py
          rm .github/workflows/_apply-manim-circle-default.yml
      - name: Commit constructor fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: match Manim Circle RED default"
          git push origin HEAD:parity/manim-create-partial
