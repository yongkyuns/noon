name: Apply reactive host updater slice

on:
  push:
    branches:
      - arch/reactive-host-geometry-updaters

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/reactive-host-geometry-updaters
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply implementation
        run: python3 scripts/apply-reactive-host-updater-slice.py
      - name: Format
        run: |
          rustup default stable
          rustup component add rustfmt
          cargo fmt --all
      - name: Validate Rust slice
        run: |
          cargo test -p noon-core
          cargo test -p noon-compile
          cargo test -p noon-runtime
          cargo test -p noon-ir
          cargo test -p noon-web
      - name: Validate Python slice
        run: PYTHONPATH=web/python python3 -m unittest web.python.test_moving_dots_primitives
      - name: Commit validated implementation
        run: |
          rm scripts/apply-reactive-host-updater-slice.py
          rm .github/workflows/reactive-host-updater-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "Support reactive values and geometry in host updaters"
          git push origin HEAD:arch/reactive-host-geometry-updaters
