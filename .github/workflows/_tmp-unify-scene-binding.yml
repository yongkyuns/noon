name: Temporary unified scene binding rewrite

on:
  push:
    branches:
      - tmp/367-unified-scene-binding

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/367-unified-scene-binding
      - name: Fix rewrite anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/_tmp_unify_scene_binding.py")
          text = path.read_text()
          replacements = [
              ('"def _schedule_raw_transform(",', '"def _scene_add(",'),
              ('    member._bind_to_scene(scene, key=key)\\n    _persist_semantic_handle_at_binding(member)\\n\\n\\n', '    member._bind_to_scene(scene, key=key)\\n\\n\\n'),
              ('"def _initial_animation_state(",\n    "def _state_for(",', '"def _initial_animation_state(",\n    "def _retained_presence_tracks(",'),
              ('"def _retained_presence_tracks(",\n    "def _retained_presence_at(",', '"def _retained_presence_tracks(",\n    "def _resolve_retained_lifecycle(",'),
              ('"def _resolve_retained_lifecycle(",\n    "def _bind_retained(",', '"def _resolve_retained_lifecycle(",\n    "def _append_vec2_track(",'),
              ('"def _bind_retained(",\n    "def _append_presence_track(",', '"def _bind_retained(",\n    "def _initial_animation_state(",'),
              ('"def _retained_scene_add(",\n    "def _retained_scene_play(",\n    "",\n    "remove retained scene lifecycle interceptors",', '"def _unique_retained_mobjects(",\n    "def _offset_vec2(",\n    "",\n    "remove retained add/remove interceptors",'),
          ]
          for old, new in replacements:
              text = text.replace(old, new)
          anchor = 'text = replace_once(\n    text,\n    \'\'\'    retained_objects_before = list(self._retained_text_objects)'
          insert = '''text = replace_block(
    text,
    "def _retained_scene_is_present(",
    "def _retained_document(",
    "",
    "remove retained presence interceptor",
)
'''
          if anchor not in text:
              raise RuntimeError("unable to locate retained rollback rewrite anchor")
          text = text.replace(anchor, insert + anchor, 1)
          path.write_text(text)
          PY
      - name: Apply architecture rewrite
        run: python scripts/_tmp_unify_scene_binding.py
      - name: Validate Python syntax and focused ratchets
        run: |
          python -m compileall -q web/python
          PYTHONPATH=web/python python - <<'PY'
          import test_unified_scene_binding as test
          test.test_scene_allocator_is_shared_across_content_projections()
          test.test_retained_content_modules_do_not_own_scene_lifecycle()
          test.test_phase_b_binding_is_content_polymorphic()
          PY
      - name: Regenerate Python worker artifacts
        run: node scripts/build-python-worker.mjs
      - name: Remove temporary rewrite machinery
        run: rm scripts/_tmp_unify_scene_binding.py .github/workflows/_tmp-unify-scene-binding.yml
      - name: Commit rewritten tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Unify scene object binding across retained content"
          git push origin HEAD:tmp/367-unified-scene-binding
