name: R3 family integration qualification (development only)
on:
  push:
    branches: [codex/1350-family-integration-qualification]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE: 406944f8a58218629c14ff247894b3fd2e8c471a
      OLD: 0e69c0754d2ffb853037ef46825aeab7f298790d
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Assemble only the coordinated integration on exact revisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r3-family"
          cp scripts/r3-family-integration-prep.py "$RUNNER_TEMP/r3-family/integrate.py"
          git config user.name 'Noon qualification bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --detach "$OLD"
          git merge --no-commit --no-ff "$BASE" || test -f .git/MERGE_HEAD
          python3 "$RUNNER_TEMP/r3-family/integrate.py"
          RUSTC_WRAPPER= cargo fmt --all
          git add -- crates/noon-web/src/authoring_error.rs crates/noon-web/src/semantic_execution_player.rs crates/noon-web/src/semantic_execution_player/callback_error_tests.rs
          git diff --cached --check
          git commit -m 'fix: reconcile callback error projection with landed family reads and wait recovery'
          test "$(git rev-parse HEAD^)" = "$OLD"
          test "$(git rev-parse HEAD^2)" = "$BASE"
          git rev-parse HEAD HEAD^{tree} HEAD^ HEAD^2 > "$RUNNER_TEMP/r3-family/revisions.txt"
          git diff "$BASE" HEAD > "$RUNNER_TEMP/r3-family/product.patch"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/r3-family/source.tar.gz"
      - name: Restore Cargo sources
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - name: Use existing pinned compiler cache client
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Focused callback errors including actual family read failure
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p noon-web --all-features --lib callback_error_tests -- --nocapture 2>&1 | tee "$RUNNER_TEMP/r3-family/native-focused.log"
      - name: Common native fast gate
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check.sh fast "$BASE" 2>&1 | tee "$RUNNER_TEMP/r3-family/native-fast.log"
      - name: Install repository-pinned package builder
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: wasm-pack@0.15.0
      - name: Build actual candidate WASM and run complete web preflight
        shell: bash
        run: |
          set -euo pipefail
          NOON_WASM_PROFILE=dev NOON_WASM_SKIP_OPT=1 bash scripts/build-web-demo.sh 2>&1 | tee "$RUNNER_TEMP/r3-family/build.log"
      - name: Install existing browser test dependencies
        shell: bash
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Real consolidated WASM and Python error matrix
        shell: bash
        run: |
          set -euo pipefail
          node scripts/typed-authoring-errors-smoke.mjs 2>&1 | tee "$RUNNER_TEMP/r3-family/boundary.log"
      - name: Real paired authoring and production-worker sparse family recovery
        shell: bash
        run: |
          set -euo pipefail
          node scripts/shared-authoring-smoke.mjs 2>&1 | tee "$RUNNER_TEMP/r3-family/shared-authoring.log"
          node scripts/manim-compat-smoke.mjs 2>&1 | tee "$RUNNER_TEMP/r3-family/manim.log"
      - name: Retain exact source, runtime bytes and test evidence
        if: always()
        shell: bash
        run: |
          git status --short > "$RUNNER_TEMP/r3-family/status.txt"
          rustc --version > "$RUNNER_TEMP/r3-family/toolchain.txt"
          node --version >> "$RUNNER_TEMP/r3-family/toolchain.txt"
          test ! -f Cargo.lock || cp Cargo.lock "$RUNNER_TEMP/r3-family/"
          test ! -d web/pkg || cp -r web/pkg "$RUNNER_TEMP/r3-family/pkg"
          test ! -f web/pkg/noon_web_bg.wasm || sha256sum web/pkg/noon_web_bg.wasm > "$RUNNER_TEMP/r3-family/wasm-sha256.txt"
          test ! -d browser-smoke-artifacts/typed-authoring-errors || cp -r browser-smoke-artifacts/typed-authoring-errors "$RUNNER_TEMP/r3-family/boundary-results"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r3-family-integration-qualification
          path: ${{ runner.temp }}/r3-family
          if-no-files-found: error
          retention-days: 3
      - name: Publish qualified candidate only; do not update master or existing PR
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          test "$(git rev-parse HEAD^)" = "$OLD"
          test "$(git rev-parse HEAD^2)" = "$BASE"
          git push origin HEAD:refs/heads/codex/1350-family-integrated-candidate
