name: F2 host bridge retry
on:
  push:
    branches: [arch/f2-engine-worker-transport]
permissions:
  contents: write
jobs:
  integrate:
    if: github.event.head_commit.message == 'Retry F2 host bridge integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/f2-engine-worker-transport
      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Apply bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, guard):
              p = Path(path); text = p.read_text()
              if guard not in text:
                  if old not in text: raise SystemExit(f'anchor missing in {path}: {old[:60]!r}')
                  text = text.replace(old, new, 1)
                  p.write_text(text)

          p = Path('crates/noon-web/src/legacy.rs'); text = p.read_text()
          if 'apply_host_patch_batch_json' not in text:
              a = '    pub fn apply_patch_batch_json(&mut self, json: &str) -> Result<&FrameState, PlayerError> {\n'
              m = '''    /// Apply host-callback mutations without consuming the interactive patch sequence.\n    pub(crate) fn apply_host_patch_batch_json(\n        &mut self,\n        json: &str,\n    ) -> Result<&FrameState, PlayerError> {\n        let batch = decode_patch_batch(json)?;\n        self.apply_patches_transactionally(&batch.patches)?;\n        Ok(self.instance.frame())\n    }\n\n'''
              if a not in text: raise SystemExit('legacy anchor missing')
              p.write_text(text.replace(a, m + a, 1))

          p = Path('crates/noon-web/src/execution_transport.rs'); text = p.read_text()
          if 'pub fn apply_host_patch_batch_delta_json' not in text:
              a = '''    pub fn apply_patch_batch_delta_json(\n        &mut self,\n        json: &str,\n    ) -> Result<Option<String>, ExecutionTransportError> {\n        self.player.apply_patch_batch_json(json)?;\n        self.take_delta_json()\n    }\n'''
              n = a + '''\n    pub fn apply_host_patch_batch_delta_json(\n        &mut self,\n        json: &str,\n    ) -> Result<Option<String>, ExecutionTransportError> {\n        self.player.apply_host_patch_batch_json(json)?;\n        self.take_delta_json()\n    }\n\n    pub fn snapshot_delta_json(&mut self) -> Result<String, ExecutionTransportError> {\n        self.force_snapshot_json()\n    }\n'''
              if a not in text: raise SystemExit('transport host anchor missing')
              text = text.replace(a, n, 1)
          if '#[wasm_bindgen(js_name = applyHostPatchBatchDeltaJson)]' not in text:
              a = '        #[wasm_bindgen(js_name = replaceSceneDeltaJson)]\n'
              n = '''        #[wasm_bindgen(js_name = applyHostPatchBatchDeltaJson)]\n        pub fn apply_host_patch_batch_delta_json(\n            &mut self,\n            json: &str,\n        ) -> Result<Option<String>, JsValue> {\n            self.inner.apply_host_patch_batch_delta_json(json).map_err(js_error)\n        }\n\n        #[wasm_bindgen(js_name = snapshotDeltaJson)]\n        pub fn snapshot_delta_json(&mut self) -> Result<String, JsValue> {\n            self.inner.snapshot_delta_json().map_err(js_error)\n        }\n\n'''
              if a not in text: raise SystemExit('transport wasm anchor missing')
              text = text.replace(a, n + a, 1)
          p.write_text(text)

          p = Path('web/authoring-client.js'); text = p.read_text()
          if 'async attachEnginePort(port)' not in text:
              a = '  terminate() {\n'
              n = '''  async attachEnginePort(port) {\n    if (!(port instanceof MessagePort)) {\n      throw new TypeError("engine host attachment requires a MessagePort");\n    }\n    await this.ready();\n    const requestId = this.#beginRequest();\n    const result = this.#resultFor(requestId);\n    this.#worker.postMessage(envelope("attach_engine_port", { requestId, port }), [port]);\n    return result;\n  }\n\n'''
              if a not in text: raise SystemExit('authoring attach anchor missing')
              text = text.replace(a, n + a, 1)
          if 'message.type === "host_port_attached"' not in text:
              a = '''      if (message.type === "callback_result") {\n        const batch = parsePatchBatchJson(message.patchBatchJson);\n        this.#settle(message.requestId, ({ resolve }) => resolve(batch));\n        return;\n      }\n'''
              n = a + '''\n      if (message.type === "host_port_attached") {\n        this.#settle(message.requestId, ({ resolve }) => resolve(message));\n        return;\n      }\n'''
              if a not in text: raise SystemExit('authoring response anchor missing')
              text = text.replace(a, n, 1)
          p.write_text(text)

          p = Path('web/python-worker.js'); text = p.read_text()
          if 'const HOST_CHANNEL = "noon.host-callback";' not in text:
              text = text.replace('const AUTHORING_PROTOCOL_VERSION = 5;\n', 'const AUTHORING_PROTOCOL_VERSION = 5;\nconst HOST_CHANNEL = "noon.host-callback";\nconst HOST_PROTOCOL_VERSION = 1;\n', 1)
          if 'let engineHostPort = null;' not in text:
              text = text.replace('let requestQueue = Promise.resolve();\n', 'let requestQueue = Promise.resolve();\nlet engineHostPort = null;\n', 1)
          if 'request.type === "attach_engine_port"' not in text:
              a = '''    if (request.type === "callback_phase") {\n      const patchBatchJson = await runCallbackPhase(\n        pyodide,\n        request.sessionId,\n        request.frame,\n        request.sequence,\n      );\n      post("callback_result", { requestId, patchBatchJson });\n      return;\n    }\n'''
              n = a + '''    if (request.type === "attach_engine_port") {\n      engineHostPort?.close?.();\n      engineHostPort = request.port;\n      engineHostPort.addEventListener("message", (event) => {\n        requestQueue = requestQueue.then(() => handleHostRequest(event.data));\n      });\n      engineHostPort.start();\n      post("host_port_attached", { requestId });\n      return;\n    }\n'''
              if a not in text: raise SystemExit('python attach case missing')
              text = text.replace(a, n, 1)
          if 'async function handleHostRequest(request)' not in text:
              a = 'async function runAuthoringSource(pyodide, source, context) {\n'
              n = '''async function handleHostRequest(request) {\n  let requestId = null;\n  let generation = null;\n  try {\n    validateHostRequest(request);\n    requestId = request.requestId;\n    generation = request.generation;\n    const pyodide = await pyodidePromise;\n    const patchBatchJson = await runCallbackPhase(pyodide, request.sessionId, request.frame, request.sequence);\n    postHost("callback_result", { requestId, generation, patchBatchJson });\n  } catch (error) {\n    postHost("error", { requestId, generation, message: error instanceof Error ? error.message : String(error) });\n  }\n}\n\n'''
              if a not in text: raise SystemExit('python host handler anchor missing')
              text = text.replace(a, n + a, 1)
          if 'Python host attachment requires a MessagePort' not in text:
              a = '''  if (request.type === "callback_phase") {\n    if (!Number.isSafeInteger(request.sessionId) || request.sessionId < 0) {\n      throw new Error("Python callback request has an invalid session ID");\n    }\n    if (!Number.isSafeInteger(request.sequence) || request.sequence < 0) {\n      throw new Error("Python callback request has an invalid patch sequence");\n    }\n    if (!isRecord(request.frame)) {\n      throw new Error("Python callback request must contain a frame object");\n    }\n    return;\n  }\n'''
              n = a + '''  if (request.type === "attach_engine_port") {\n    if (!(request.port instanceof MessagePort)) {\n      throw new Error("Python host attachment requires a MessagePort");\n    }\n    return;\n  }\n'''
              if a not in text: raise SystemExit('python request validation anchor missing')
              text = text.replace(a, n, 1)
          if 'function validateHostRequest(request)' not in text:
              a = 'function post(type, payload = {}) {\n'
              n = '''function validateHostRequest(request) {\n  if (!isRecord(request) || request.channel !== HOST_CHANNEL ||\n      request.protocolVersion !== HOST_PROTOCOL_VERSION || request.type !== "callback_phase" ||\n      !Number.isSafeInteger(request.requestId) || request.requestId < 0 ||\n      !Number.isSafeInteger(request.generation) || request.generation < 0 ||\n      !Number.isSafeInteger(request.sessionId) || request.sessionId < 0 ||\n      !Number.isSafeInteger(request.sequence) || request.sequence < 0 || !isRecord(request.frame)) {\n    throw new Error("invalid engine host callback request");\n  }\n}\n\nfunction postHost(type, payload = {}) {\n  if (engineHostPort === null) return;\n  engineHostPort.postMessage({ channel: HOST_CHANNEL, protocolVersion: HOST_PROTOCOL_VERSION, type, ...payload });\n}\n\n'''
              if a not in text: raise SystemExit('python post anchor missing')
              text = text.replace(a, n + a, 1)
          p.write_text(text)
          PY
          cargo fmt --all
      - name: Validate bridge
        run: |
          cargo fmt --all -- --check
          cargo test -p noon-web execution_transport
          node --check web/execution-engine-worker.js
          node --check web/execution-worker-client.js
          node --check web/authoring-client.js
          node --check web/python-worker.js
          cargo check -p noon-web --target wasm32-unknown-unknown
      - name: Commit bridge
        run: |
          rm -f .github/workflows/f2-host-bridge.yml .github/workflows/f2-host-bridge-retry.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/noon-web/src/legacy.rs crates/noon-web/src/execution_transport.rs web/authoring-client.js web/python-worker.js .github/workflows
          git commit -m 'Connect Python host callbacks directly to engine worker'
          git push origin HEAD:arch/f2-engine-worker-transport
