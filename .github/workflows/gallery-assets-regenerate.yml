name: Gallery assets regenerate

on:
  pull_request:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      NOON_WASM_SKIP_OPT: "1"
      NOON_SKIP_PLAYGROUND_TEST: "1"
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Use stable Rust
        run: |
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Build browser package
        run: bash scripts/build-web-demo.sh

      - name: Install capture dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium

      - name: Regenerate posters on current renderer
        run: node scripts/generate-gallery-thumbnails.mjs

      - name: Install and validate generated posters
        run: |
          cp gallery-thumbnail-artifacts/*.png web/thumbnails/manim/generated/
          cp gallery-thumbnail-artifacts/manim_tutorial_manifest.json \
            web/python/examples/manim_tutorial_manifest.json
          node --test web/example-gallery.test.mjs

      - name: Commit renderer-current posters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/thumbnails/manim/generated web/python/examples/manim_tutorial_manifest.json
          if git diff --cached --quiet; then
            echo "Poster assets already match current renderer"
            exit 0
          fi
          git commit -m "Regenerate gallery posters on current renderer"
          git push origin HEAD:${{ github.head_ref }}
