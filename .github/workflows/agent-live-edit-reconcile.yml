name: Agent live-edit reconciliation

on:
  push:
    branches:
      - agent/browser-realtime-architecture

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/browser-realtime-architecture

      - name: Apply atomic live-edit reconciliation
        run: python3 scripts/apply_atomic_live_edit_reconcile.py

      - name: Use stable Rust
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown

      - name: Format Rust
        run: cargo fmt --all

      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Compile workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Geometry correctness
        run: |
          cargo test -p noon-geometry --test tessellation_correctness
          cargo test -p noon-geometry --test stroke_style_parity

      - name: Workspace tests
        run: cargo test --workspace --all-features

      - name: WebGPU wasm compile
        run: cargo check -p noon-render-wgpu --target wasm32-unknown-unknown --no-default-features --features web

      - name: Browser runtime wasm compile
        run: cargo check -p noon-web --target wasm32-unknown-unknown

      - name: Browser package validation
        run: bash scripts/build-web-demo.sh

      - name: Publish validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/noon-web/src/lib.rs web/main.js web/scene-identity.js web/scene-identity.test.mjs web/python/examples/instanced_field.py
          if git diff --cached --quiet; then
            echo "No source changes to publish"
          else
            git commit -m "Make Python scene edits reconcile atomically"
            git push origin HEAD:agent/browser-realtime-architecture
          fi
