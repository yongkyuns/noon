# Temporary PR #1705 final source qualification; self-removes after a passing gate.
name: Graph construction final qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: graph-construction-final-1705
  cancel-in-progress: true

jobs:
  format-test-publish:
    if: github.event.pull_request.number == 1705 && github.event.pull_request.head.repo.full_name == 'yongkyuns/noon' && github.event.pull_request.head.ref == 'codex/b5-public-graph-explicit-layout'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BRANCH: codex/b5-public-graph-explicit-layout
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: true
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Fetch exact review base
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Install pinned Rust
        run: rustup install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-graph-final-1705
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      - name: Format candidate
        run: cargo fmt --all
      - name: Guard formatter scope
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess as sp
          changed = [p for p in sp.check_output(['git','diff','--name-only'], text=True).splitlines() if p]
          bad = [p for p in changed if not p.endswith('.rs')]
          assert not bad, f"rustfmt changed non-Rust paths: {bad}"
          print("formatted Rust paths:", *changed, sep="\n")
          PY
      - name: Run repository fast validation
        run: bash scripts/check.sh fast "$BASE_SHA"
      - name: Publish formatted source and self-remove
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import subprocess as sp

          def out(*args):
              return sp.check_output(['git', *args], text=True).strip()

          remote = out('ls-remote', 'origin', 'refs/heads/' + os.environ['BRANCH']).split()[0]
          assert remote == os.environ['EXPECTED_HEAD'], (
              f"branch advanced from {os.environ['EXPECTED_HEAD']} to {remote}; refusing to overwrite"
          )
          workflow = '.github/workflows/graph-construction-final.yml'
          sp.run(['git', 'rm', workflow], check=True)
          changed = [p for p in out('status', '--porcelain').splitlines() if p]
          assert changed, 'expected workflow self-removal'
          sp.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          sp.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          sp.run(['git', 'add', '-u'], check=True)
          sp.run(['git', 'commit', '-m', 'B5: format and qualify final Graph construction slice'], check=True)
          final = out('rev-parse', 'HEAD')
          sp.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + os.environ['BRANCH']], check=True)
          print('QUALIFIED_SOURCE_HEAD=' + final)
          PY
