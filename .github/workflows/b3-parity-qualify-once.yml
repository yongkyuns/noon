name: B3 exact-time parity qualification
on:
  push:
    branches: [b3-matching-shapes-parity-qualification]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Materialize reviewed patch
        env:
          PATCH_ZLIB_B64: ''
        run: |
          test "$(git rev-parse HEAD^)" = 8b1ef54886219804a497f6f3923419efeb8fd6c6
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, zlib
          encoded = os.environ['PATCH_ZLIB_B64']
          encoded = encoded.replace('VeLGcGcGhs','VeLGcGhs').replace('1ZXGGGGgKw','1ZXGGGgKw').replace('EtjSJqIqIQIq','EtjSJqIQIq')
          patch = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '5f980628cef13a99c3547c234ec0289ef32a2fa1005d4ecd7fc2f9c31c0b554a'
          pathlib.Path('/tmp/b3-parity.patch').write_bytes(patch)
          PY
          git apply --check /tmp/b3-parity.patch
          git apply /tmp/b3-parity.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/manim-raster-differential.yml')
          s = p.read_text()
          anchor = '      - ".github/workflows/manim-raster-differential.yml"\n'
          assert s.count(anchor) == 1
          s = s.replace(anchor, '      - "scripts/manim-raster-*.mjs"\n' + anchor)
          anchor = '        run: node scripts/manim-raster-policy.test.mjs\n'
          assert s.count(anchor) == 1
          s = s.replace(anchor, '        run: |\n          node scripts/manim-raster-policy.test.mjs\n          node --test scripts/manim-raster-samples.test.mjs\n')
          p.write_text(s)
          PY
          rm .github/workflows/b3-parity-qualify-once.yml
      - name: Format source-only candidate
        run: |
          rustup install
          cargo fmt --all
          node --test scripts/manim-raster-samples.test.mjs
          python3 -m py_compile parity/manim-v0.21/core-examples/matching_shapes_reordered.py
          git diff --check
      - name: Publish isolated source-only tree
        id: publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/manim-raster-support.mjs scripts/manim-raster-differential.mjs scripts/manim-raster-samples.test.mjs parity/manim-v0.21/manifest.json parity/manim-v0.21/core-examples/matching_shapes_reordered.py crates/noon/src/execution_session/family_transform_tests.rs .github/workflows/manim-raster-differential.yml .github/workflows/b3-parity-qualify-once.yml
          git commit -m 'test: qualify exact matching phases and stable family cleanup'
          git push origin HEAD:refs/heads/b3-matching-shapes-parity-qualification
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show --stat --oneline HEAD
  native:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
      - run: rustup install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Exact native matching regressions
        run: |
          git rev-parse HEAD
          cargo fmt --all -- --check
          cargo test -p noon --lib matching_family -- --nocapture
          cargo test -p noon --lib native_matches_geometry_then_animates_the_replacement_target
          cargo clippy -p noon --all-targets --all-features -- -D warnings
          bash scripts/check.sh architecture 8b1ef54886219804a497f6f3923419efeb8fd6c6
  raster:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
      NOON_WASM_SKIP_OPT: '1'
      NOON_MANIM_RASTER_BACKENDS: webgpu,webgl
      NOON_MANIM_RASTER_ARTIFACTS: manim-raster-artifacts
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned reference and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config
          python -m pip install --disable-pip-version-check 'manim[typst]==0.21.0' 'typst==0.15.0'
          rustup install
          rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Build normal browser package
        id: build
        run: bash scripts/build-web-demo.sh
      - name: Install existing harness dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Select only the new fixture for focused qualification
        run: |
          git rev-parse HEAD
          node --test scripts/manim-raster-samples.test.mjs
          node scripts/manim-raster-policy.test.mjs
          cp parity/manim-v0.21/manifest.json "$RUNNER_TEMP/b3-full-manifest.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('parity/manim-v0.21/manifest.json')
          manifest = json.loads(p.read_text())
          manifest['fixtures'] = [f for f in manifest['fixtures'] if f['id'] == 'matching-shapes-reordered']
          assert len(manifest['fixtures']) == 1
          p.write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Paired actual-frame raster comparison
        id: capture
        run: node scripts/manim-raster-differential.mjs
      - name: Capture semantic state at the same times
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        run: node scripts/manim-raster-semantic-state.mjs
      - name: Enforce unchanged strict limits
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        run: node scripts/manim-raster-enforce.mjs
      - name: Dense and direct playback parity
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        run: node scripts/shared-playback-raster.mjs
      - name: Restore full manifest and print evidence inventory
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/b3-full-manifest.json"; then cp "$RUNNER_TEMP/b3-full-manifest.json" parity/manim-v0.21/manifest.json; fi
          find manim-raster-artifacts -maxdepth 3 -type f -name '*.json' -print || true
          git diff --stat
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: b3-matching-exact-time-evidence
          path: manim-raster-artifacts
          if-no-files-found: warn
          retention-days: 14
