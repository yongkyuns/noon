name: Mobile candidate export (temporary)
on:
  push:
    branches: [codex/mobile-demo-diagnosis]
permissions:
  contents: write
jobs:
  export:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Materialize reviewed source-only candidate, not a release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mobile-export"
          python3 scripts/mobile-patch-transfer.py
          gzip -dc mobile-repair.patch.gz > "$RUNNER_TEMP/mobile-export/source.patch"
          cp mobile-followup.patch "$RUNNER_TEMP/mobile-export/followup.patch"
          git restore mobile-repair.patch.gz
          git fetch --depth=1 origin 16d0a45eef9ec0328e59deb58802cc4ed31dac31
          git checkout --detach 16d0a45eef9ec0328e59deb58802cc4ed31dac31
          git apply --index "$RUNNER_TEMP/mobile-export/source.patch"
          git apply --index "$RUNNER_TEMP/mobile-export/followup.patch"
          # Workflow authorization belongs to the connected repository client.
          # Export only the eight source/test/doc files with the Actions token.
          git restore --source=HEAD --staged --worktree .github/workflows/playground-cross-browser.yml
          git diff --cached --check
          git diff --cached --name-only > "$RUNNER_TEMP/mobile-export/files.txt"
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 8
          git config user.name 'Yongkyun Shin'
          git config user.email 'yongkyuns@gmail.com'
          git commit -m 'Make ordinary browser Scene barriers portable without JSPI'
          git rev-parse HEAD | tee "$RUNNER_TEMP/mobile-export/candidate-sha.txt"
          git rev-parse HEAD^{tree} | tee "$RUNNER_TEMP/mobile-export/candidate-tree.txt"
          git show --stat --oneline HEAD
          git push origin HEAD:refs/heads/codex/mobile-portable-source
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-source-export
          path: ${{ runner.temp }}/mobile-export
          retention-days: 3
