name: Mobile candidate qualification on macOS (temporary)
on:
  push:
    branches: [codex/mobile-demo-diagnosis]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e6830f9d16ca6c18ec5376f0d4e73431b8251ef8
      - name: Python and worker contracts
        run: |
          python3 -m unittest discover -s web/python -p 'test_*.py'
          node --test web/python-worker-source.test.mjs web/authoring-client.test.mjs
          node scripts/build-python-worker.mjs
      - name: Obtain immutable exact-baseline release WASM
        env:
          BASE: 16d0a45eef9ec0328e59deb58802cc4ed31dac31
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mobile-evidence" "$RUNNER_TEMP/saved-pages/site"
          git rev-parse HEAD > "$RUNNER_TEMP/mobile-evidence/source-sha.txt"
          gh run download 34170342894 --repo yongkyuns/noon --name github-pages --dir "$RUNNER_TEMP/saved-pages"
          tar -xf "$RUNNER_TEMP/saved-pages/artifact.tar" -C "$RUNNER_TEMP/saved-pages/site"
          cp "$RUNNER_TEMP/saved-pages/site/build-info.json" "$RUNNER_TEMP/mobile-evidence/runtime-build-info.json"
          python3 -c 'import json,os; assert json.load(open(os.environ["RUNNER_TEMP"]+"/mobile-evidence/runtime-build-info.json"))["commit"] == os.environ["BASE"]'
          mkdir -p web/pkg
          cp "$RUNNER_TEMP/saved-pages/site/pkg/noon_web.js" web/pkg/
          cp "$RUNNER_TEMP/saved-pages/site/pkg/noon_web_bg.wasm" web/pkg/
          shasum -a 256 web/pkg/* > "$RUNNER_TEMP/mobile-evidence/wasm-sha256.txt"
      - name: Install pinned browser harness
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install webkit chromium
      - name: Mobile touch, intermediate frames, no-JSPI, Text and rerun
        run: node scripts/playground-main-thread-mobile-smoke.mjs
      - name: Desktop regression
        run: node scripts/playground-browser-matrix-smoke.mjs
      - name: Tutorial regression
        run: node scripts/manim-tutorial-smoke.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-macos-qualification
          path: |
            ${{ runner.temp }}/mobile-evidence
            browser-smoke-artifacts
          retention-days: 3
