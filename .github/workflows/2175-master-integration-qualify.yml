# Research-only source integration qualification. Never merge this workflow.
# The tested merge is staged in a detached Git worktree; no branch ref is updated.
name: 2175 current-master source integration proof

on:
  push:
    branches:
      - codex/2175-master-integration-qualify-20261019

permissions:
  contents: read

concurrency:
  group: 2175-integration-proof-20261019
  cancel-in-progress: false

jobs:
  integrated-qualification:
    name: Test exact PR plus pinned master on standard Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      EXPECTED_PR: 5b4962cf0f490c966c915f5b4557b7e5d328d25b
      EXPECTED_MASTER: fc3a20c60dbe7c33695e96ecb9c2958984f14d90
      EXPECTED_MERGE_BASE: 85b67388db42a073493583b341babd6fac1cfd5d
      PROOF_DIR: /tmp/noon-2175-integrated
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Stage authenticated two-parent source integration without changing refs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_DIR"
          git fetch --no-tags origin "$EXPECTED_PR" "$EXPECTED_MASTER"
          test "$(git rev-parse "$EXPECTED_PR")" = "$EXPECTED_PR"
          test "$(git rev-parse "$EXPECTED_MASTER")" = "$EXPECTED_MASTER"
          actual_base="$(git merge-base "$EXPECTED_PR" "$EXPECTED_MASTER")"
          echo "$actual_base" > "$PROOF_DIR/merge-base.txt"
          test "$actual_base" = "$EXPECTED_MERGE_BASE"
          git -c user.name='Noon integration qualification' -c user.email='noreply@github.com' switch --detach "$EXPECTED_PR"
          git -c user.name='Noon integration qualification' -c user.email='noreply@github.com' merge --no-commit --no-ff "$EXPECTED_MASTER"
          test "$(git rev-parse HEAD)" = "$EXPECTED_PR"
          test "$(git rev-parse MERGE_HEAD)" = "$EXPECTED_MASTER"
          test -z "$(git ls-files -u)"
          # Master already carries two literal third-party license whitespace issues.
          # Fail closed unless that notice is byte-identical to pinned master.
          # Keep the original failure evidence and check every other staged path.
          notice=crates/noon/src/code_display/THIRD_PARTY_NOTICES.md
          test "$(git rev-parse ":$notice")" = "$(git rev-parse "$EXPECTED_MASTER:$notice")"
          set +e
          git diff --cached --check -- "$notice" > "$PROOF_DIR/inherited-notice-whitespace.txt" 2>&1
          notice_status=$?
          set -e
          test "$notice_status" -eq 2
          grep -Fq "$notice:2195: trailing whitespace." "$PROOF_DIR/inherited-notice-whitespace.txt"
          grep -Fq "$notice:3214: new blank line at EOF." "$PROOF_DIR/inherited-notice-whitespace.txt"
          test "$(grep -c "^$notice:" "$PROOF_DIR/inherited-notice-whitespace.txt")" -eq 2
          git diff --cached --check -- . ":(exclude)$notice"
          git write-tree > "$PROOF_DIR/staged-tree.txt"
          printf '%s\n' "$EXPECTED_PR" > "$PROOF_DIR/pr-head.txt"
          printf '%s\n' "$EXPECTED_MASTER" > "$PROOF_DIR/master-head.txt"
          git diff --cached --name-status > "$PROOF_DIR/integrated-paths.txt"
          git diff --cached --stat > "$PROOF_DIR/integrated-stat.txt"
          git diff --cached --binary > "$PROOF_DIR/integrated.patch"
          sha256sum "$PROOF_DIR/integrated.patch" > "$PROOF_DIR/integrated-patch.sha256"
          git status --short > "$PROOF_DIR/status-before.txt"
          printf 'INTEGRATED_TREE=%s\n' "$(cat "$PROOF_DIR/staged-tree.txt")"
          printf 'MASTER_DELTA_PATHS=%s\n' "$(wc -l < "$PROOF_DIR/integrated-paths.txt")"
          # No research workflow, source-publishing script, or temporary file may
          # leak into the staged engine merge from the two exact production refs.
          test ! -f .github/workflows/2175-master-integration-qualify.yml

      - name: Install repository-pinned Rust and native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          rustup install
          rustup target add wasm32-unknown-unknown
          rustc --version --verbose | tee "$PROOF_DIR/toolchain.txt"
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libvulkan1 mesa-vulkan-drivers libasound2-dev libudev-dev

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-2175-integration-sources-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
            ${{ runner.os }}-capture-cargo-sources-

      - name: Install production-pinned wasm-pack
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Run required repository full local gate against the integrated source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check.sh full HEAD 2>&1 | tee "$PROOF_DIR/full-gate.log"

      - name: Confirm exact ordinary/packed/limited native pixels and every 4x MSAA sample
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p noon-render-wgpu --lib gpu::retained_text::tests::mixed_mega_native_exact_pixels_against_individual_paths -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$PROOF_DIR/native-mixed-msaa.log"
          grep -q 'test result: ok. 1 passed' "$PROOF_DIR/native-mixed-msaa.log"
          test "$(grep -c 'MIXED_MEGA_NATIVE_EXACT step=' "$PROOF_DIR/native-mixed-msaa.log")" -eq 4

      - name: Exercise integrated browser WebGPU and WebGL renderer paths
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
          # Both original, unchanged 30-second browser smokes are required gates.
          # Run WebGL even if WebGPU fails; preserve each original exit status.
          set +e
          NOON_BROWSER_SMOKE_BACKEND=webgpu NOON_BROWSER_SMOKE_ARTIFACTS="$PROOF_DIR/browser-webgpu" node scripts/browser-smoke.mjs 2>&1 | tee "$PROOF_DIR/browser-webgpu.log"
          webgpu_status=${PIPESTATUS[0]}
          NOON_BROWSER_SMOKE_BACKEND=webgl NOON_BROWSER_SMOKE_ARTIFACTS="$PROOF_DIR/browser-webgl" node scripts/browser-smoke.mjs 2>&1 | tee "$PROOF_DIR/browser-webgl.log"
          webgl_status=${PIPESTATUS[0]}
          set -e
          printf 'WebGPU original smoke exit=%s\nWebGL original smoke exit=%s\n' "$webgpu_status" "$webgl_status" | tee "$PROOF_DIR/browser-smoke-status.txt"
          diagnostic_modes=""
          if (( webgpu_status != 0 )); then diagnostic_modes="$diagnostic_modes webgpu"; fi
          if (( webgl_status != 0 )); then diagnostic_modes="$diagnostic_modes webgl"; fi
          if [[ -n "$diagnostic_modes" ]]; then
            # Independent, research-only probe: no edits to product code, smoke
            # fixture, scripts/browser-smoke.mjs, limits, timeouts or thresholds.
            # Capture browser events, WASM resource timings and readiness stages.
            set +e
            NOON_DIAG_MODES="$diagnostic_modes" node --input-type=module <<'NODE' 2>&1 | tee "$PROOF_DIR/browser-diagnostic.log"
          import { spawn } from "node:child_process";
          import { mkdir, writeFile } from "node:fs/promises";
          import path from "node:path";
          import playwright from "playwright";
          const { chromium } = playwright;
          const root = process.cwd();
          const modes = (process.env.NOON_DIAG_MODES ?? "").trim().split(/\s+/).filter(Boolean);
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          for (const backend of modes) {
            const dest = path.join(process.env.PROOF_DIR, "browser-" + backend);
            await mkdir(dest, { recursive: true });
            const port = backend === "webgpu" ? 43831 : 43832;
            const base = "http://127.0.0.1:" + port;
            const report = { backend, startedAt: new Date().toISOString(), samples: [], events: [] };
            const record = (kind, value) => {
              if (report.events.length < 150) report.events.push({ elapsedMs: Date.now() - started, kind, value });
            };
            const started = Date.now();
            const server = spawn("python3", ["-m", "http.server", String(port), "--bind", "127.0.0.1", "--directory", root], { stdio: ["ignore", "pipe", "pipe"] });
            let serverOutput = "";
            for (const stream of [server.stdout, server.stderr]) stream.on("data", (chunk) => {
              serverOutput = (serverOutput + chunk.toString()).slice(-12000);
            });
            let browser, page;
            try {
              let available = false;
              for (let i = 0; i < 80; i++) {
                try {
                  const response = await fetch(base + "/web/browser-smoke.html");
                  if (response.ok) { available = true; break; }
                } catch {}
                await sleep(100);
              }
              if (!available) throw new Error("diagnostic HTTP server not ready");
              const args = backend === "webgpu" ? [
                "--enable-unsafe-webgpu", "--enable-unsafe-swiftshader",
                "--use-webgpu-adapter=swiftshader", "--use-gpu-in-tests",
                "--ignore-gpu-blocklist", "--enable-features=Vulkan",
                "--use-gl=angle", "--use-angle=swiftshader",
                "--use-vulkan=swiftshader", "--disable-gpu-sandbox",
                "--disable-dev-shm-usage",
              ] : [
                "--disable-features=WebGPU", "--enable-unsafe-swiftshader",
                "--ignore-gpu-blocklist", "--use-gl=angle",
                "--use-angle=swiftshader", "--disable-gpu-sandbox",
                "--disable-dev-shm-usage",
              ];
              browser = await chromium.launch({ channel: "chromium", headless: true, args });
              report.chromiumVersion = browser.version();
              page = await browser.newPage({ viewport: { width: 1000, height: 600 } });
              page.on("pageerror", (error) => record("pageerror", String(error)));
              page.on("console", (message) => record("console-" + message.type(), message.text().slice(0, 1500)));
              page.on("requestfailed", (request) => record("requestfailed", {
                url: request.url(), reason: request.failure()?.errorText ?? null,
              }));
              page.on("response", (response) => {
                const url = response.url();
                if (response.status() >= 400 || /(\.wasm|noon_web\.js)/.test(url))
                  record("response", { status: response.status(), url });
              });
              page.on("crash", () => record("page-crash", true));
              await page.goto(base + "/web/browser-smoke.html", { waitUntil: "load", timeout: 30000 });
              for (let i = 0; i < 8; i++) {
                const snapshot = await Promise.race([
                  page.evaluate(() => ({
                    documentReadyState: document.readyState,
                    webgpuExposed: !!navigator.gpu,
                    noonSmoke: window.noonSmoke?.state ? {
                      ready: window.noonSmoke.state.ready,
                      error: window.noonSmoke.state.error,
                      frames: window.noonSmoke.state.frames,
                    } : null,
                    directSmoke: window.noonDirectExecutionSmoke ? {
                      ready: window.noonDirectExecutionSmoke.ready,
                      error: window.noonDirectExecutionSmoke.error,
                    } : null,
                    resources: performance.getEntriesByType("resource").slice(-40).map((e) => ({
                      name: new URL(e.name).pathname,
                      durationMs: Math.round(e.duration),
                      responseEndMs: Math.round(e.responseEnd),
                      decodedBytes: e.decodedBodySize,
                    })),
                  })).catch((error) => ({ evaluateError: String(error) })),
                  sleep(3000).then(() => ({ evaluateTimeoutMs: 3000 })),
                ]);
                report.samples.push({ elapsedMs: Date.now() - started, ...snapshot });
                if (snapshot.noonSmoke?.ready) break;
                await sleep(5000);
              }
              await page.screenshot({ path: path.join(dest, "diagnostic-startup.png"), timeout: 5000 });
            } catch (error) {
              report.diagnosticError = String(error?.stack ?? error);
            } finally {
              report.durationMs = Date.now() - started;
              report.serverOutputTail = serverOutput;
              if (browser) try { await Promise.race([browser.close(), sleep(5000)]); } catch {}
              server.kill("SIGTERM");
              await writeFile(path.join(dest, "diagnostic-startup.json"), JSON.stringify(report, null, 2) + "\n");
              console.log("Research-only startup diagnostic " + backend + ": " + JSON.stringify({
                durationMs: report.durationMs,
                error: report.diagnosticError ?? null,
                samples: report.samples.map((s) => ({
                  elapsedMs: s.elapsedMs,
                  ready: s.noonSmoke?.ready ?? null,
                  stateError: s.noonSmoke?.error ?? null,
                  resourceCount: s.resources?.length ?? null,
                  evaluateTimeoutMs: s.evaluateTimeoutMs ?? null,
                })),
                eventCount: report.events.length,
              }));
            }
          }
          NODE
            diagnostic_status=${PIPESTATUS[0]}
            set -e
            printf 'Research diagnostic exit=%s\n' "$diagnostic_status" | tee "$PROOF_DIR/browser-diagnostic-status.txt"
          fi
          test "$webgpu_status" -eq 0
          test "$webgl_status" -eq 0

      - name: Verify tested staged merge has not changed and preserve exact source identity
        # Verify source provenance even when a preceding qualification fails.
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PR"
          test "$(git rev-parse MERGE_HEAD)" = "$EXPECTED_MASTER"
          test "$(git write-tree)" = "$(cat "$PROOF_DIR/staged-tree.txt")"
          git diff --quiet
          # Reapply the same fail-closed policy after every test and source check.
          notice=crates/noon/src/code_display/THIRD_PARTY_NOTICES.md
          test "$(git rev-parse ":$notice")" = "$(git rev-parse "$EXPECTED_MASTER:$notice")"
          test "$(grep -c "^$notice:" "$PROOF_DIR/inherited-notice-whitespace.txt")" -eq 2
          grep -Fq "$notice:2195: trailing whitespace." "$PROOF_DIR/inherited-notice-whitespace.txt"
          grep -Fq "$notice:3214: new blank line at EOF." "$PROOF_DIR/inherited-notice-whitespace.txt"
          git diff --cached --check -- . ":(exclude)$notice"
          sha256sum crates/noon-render-wgpu/src/gpu/mod.rs > "$PROOF_DIR/integrated-renderer-sha256.txt"
          printf 'VALIDATED_INTEGRATION_TREE=%s\n' "$(git write-tree)"
          printf 'NO_BRANCH_REF_UPDATED=true\n' > "$PROOF_DIR/proof-complete.txt"

      - name: Retain source identity, execution logs and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: 2175-current-master-integration-proof
          path: ${{ env.PROOF_DIR }}
          retention-days: 3
          if-no-files-found: warn
