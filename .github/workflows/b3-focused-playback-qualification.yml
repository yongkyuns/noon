name: B3 focused matching playback qualification
on:
  push:
    branches: [tooling/b3-focused-playback-qualification]
    paths: [.github/workflows/b3-focused-playback-qualification.yml]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
      NOON_WASM_SKIP_OPT: '1'
      NOON_MANIM_RASTER_BACKENDS: webgpu,webgl
      NOON_SHARED_PLAYBACK_FIXTURES: matching-shapes-reordered
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 3b5841d08129afb46d12d6c5c990a6eceb24811d
          show-progress: false
      - name: Verify exact product source
        run: test "$(git rev-parse HEAD)" = 3b5841d08129afb46d12d6c5c990a6eceb24811d
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned reference
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config
          python3 -m pip install --disable-pip-version-check 'manim[typst]==0.21.0' 'typst==0.15.0'
      - name: Install repository-pinned Rust and WASM target
        run: |
          rustup install
          rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Build full browser inputs
        run: bash scripts/build-web-demo.sh
      - name: Install raster harness
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Create focused external manifest
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('parity/manim-v0.21/manifest.json').read_text())
          manifest['fixtures'] = [f for f in manifest['fixtures'] if f['id'] == 'matching-shapes-reordered']
          assert len(manifest['fixtures']) == 1
          Path(os.environ['RUNNER_TEMP'], 'b3-focused.json').write_text(json.dumps(manifest))
          PY
          echo "NOON_MANIM_RASTER_MANIFEST=$RUNNER_TEMP/b3-focused.json" >> "$GITHUB_ENV"
      - name: Capture paired frames
        run: node scripts/manim-raster-differential.mjs
      - name: Enforce unchanged strict raster limits
        run: node scripts/manim-raster-enforce.mjs
      - name: Sparse versus dense for matching fixture only
        run: node scripts/shared-playback-raster.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: b3-focused-playback-evidence
          path: manim-raster-artifacts
          if-no-files-found: warn
          retention-days: 7
