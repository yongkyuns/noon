name: Temporary shared family translation migration

on:
  push:
    branches:
      - agent/arch-shared-family-translation

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix migration anchors
        run: python3 scripts/tmp_fix_family_translation_helper.py
      - name: Apply migration
        run: python3 scripts/tmp_shared_family_translation_migration.py
      - name: Format
        run: cargo fmt --all
      - name: Check diff formatting
        run: git diff --check
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Rust semantic tests
        run: cargo test -p noon-web authoring_mobject
      - name: WASM compile
        run: cargo check -p noon-web --target wasm32-unknown-unknown
      - name: Python family translation regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: web/python
        run: |
          python3 -m unittest \
            web.python.test_manim_shared_family_translation \
            web.python.test_manim_shared_family_identity \
            web.python.test_manim_shared_placement_handles \
            web.python.test_manim_shared_layout_queries
      - name: Ownership audit
        run: python3 scripts/semantic_ownership_check.py
      - name: Commit migration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            crates/noon-web/src/authoring_mobject.rs \
            web/python/_manim_semantic_handles.py \
            web/python/test_manim_shared_family_translation.py \
            compat/semantic-ownership-v1.json \
            scripts/check-web-package.mjs
          git rm \
            .github/workflows/tmp-shared-family-translation.yml \
            scripts/tmp_shared_family_translation_migration.py \
            scripts/tmp_fix_family_translation_helper.py
          git commit -m 'Move family translation into shared Rust semantics'
          git push origin HEAD:agent/arch-shared-family-translation
