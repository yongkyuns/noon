name: Fix parity179 master integration

on:
  push:
    branches:
      - agent/parity-179-screen-space

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply integration fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/noon-render-wgpu/src/lib.rs')
          text = path.read_text()
          old = 'self.cache_path_mesh(path, object.style)'
          new = 'self.cache_path_mesh(path, object.style, object.transform)'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale cache_path_mesh call, found {count}')
          path.write_text(text.replace(old, new))
          PY
      - name: Validate merged source
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test -p noon-core -p noon-runtime -p noon-render-wgpu
          python -m unittest discover -s web/python -p 'test_*.py'
          node --check scripts/manim-compat-smoke.mjs
          git diff --check
      - name: Commit clean integration fix
        shell: bash
        run: |
          rm .github/workflows/agent-parity179-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate screen-space stroke cache with current master'
          git push
