name: Issue 1601 lifecycle parity probe

on:
  push:
    branches:
      - scratch/1601-parity-probe

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all -- --check
      - run: cargo test -p noon --all-features native_unequal_family_transform_persists_before_second_animation

  direct-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build browser package
        uses: ./.github/actions/dev-wasm-build
        with:
          preflight: "true"
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Run direct lifecycle proof in WebGL
        env:
          NOON_BROWSER_SMOKE_BACKEND: webgl
          NOON_BROWSER_SMOKE_ARTIFACTS: browser-smoke-artifacts/webgl
        run: node scripts/browser-smoke.mjs
