name: Align Rust Manim stroke mode

on:
  push:
    branches:
      - agent/parity-179-screen-space

permissions:
  contents: write

jobs:
  align-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align Rust Manim constructors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('crates/noon/src/legacy.rs')
          text = source.read_text()
          old = '    snapshot.style.stroke_width = MANIM_CAIRO_DEFAULT_STROKE_WIDTH;\n'
          new = old + '    snapshot.style.stroke_width_mode = StrokeWidthMode::ScreenSpace;\n'
          if text.count(old) != 1:
              raise SystemExit('expected one Manim stroke-width assignment')
          source.write_text(text.replace(old, new))

          test = Path('crates/noon/tests/manim_style_defaults.rs')
          text = test.read_text()
          first = '        assert!((snapshot.style.stroke_width - 0.04).abs() < f32::EPSILON);\n'
          first_new = first + '        assert_eq!(snapshot.style.stroke_width_mode, noon_core::StrokeWidthMode::ScreenSpace);\n'
          if text.count(first) != 1:
              raise SystemExit('expected one loop stroke-width assertion')
          text = text.replace(first, first_new)
          second = '    assert!((snapshot.snapshot().style.stroke_width - 0.04).abs() < f32::EPSILON);\n'
          second_new = second + '    assert_eq!(snapshot.snapshot().style.stroke_width_mode, noon_core::StrokeWidthMode::ScreenSpace);\n'
          if text.count(second) != 1:
              raise SystemExit('expected one circle stroke-width assertion')
          test.write_text(text.replace(second, second_new))
          PY
      - name: Validate authoring parity
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          python -m unittest discover -s web/python -p 'test_*.py'
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
          node scripts/cross-language-parity.mjs
          node --check scripts/manim-compat-smoke.mjs
          git diff --check
      - name: Commit clean authoring alignment
        shell: bash
        run: |
          rm .github/workflows/agent-parity179-authoring-align.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align Rust Manim constructors with screen-space strokes'
          git push
