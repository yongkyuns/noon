name: B6 matching foreground anchors proof
on:
  push:
    branches: [codex/validate-b6-matching-anchors-20260923]
    paths:
      - .github/workflows/b6-matching-anchors-proof.yml
      - .github/ci/b6-matching-anchors.patch.gz.b64
permissions:
  contents: write
concurrency:
  group: b6-matching-foreground-anchors-proof
  cancel-in-progress: false
env:
  BASE: 4bf851b4643b8b4b96dfdc31fc47300b802bac28
  SOURCE_BRANCH: codex/b6-matching-foreground-anchors-20260923
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: 'true'
  SCCACHE_GHA_RW_MODE: READ_ONLY
  WGPU_BACKEND: vulkan
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Pin exact clean source and verify candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b6-anchors"
          python - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          patch = gzip.decompress(base64.b64decode(Path('.github/ci/b6-matching-anchors.patch.gz.b64').read_text()))
          assert hashlib.sha256(patch).hexdigest() == '8153fc0e9d9032c3546e47e98cfe96f3fdfb460365fbc3120c568d48d9fcf4f1'
          Path(os.environ['RUNNER_TEMP'], 'b6-anchors', 'candidate.patch').write_bytes(patch)
          PY
          git fetch --no-tags --depth=1 origin "$BASE"
          git checkout --detach "$BASE"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git rev-parse HEAD^{tree})" = '30c70bb124a72dbcb09f99e8d5b8cfd42dc27618'
          test -z "$(git status --porcelain)"
          printf 'base=%s\n' "$BASE" > "$RUNNER_TEMP/b6-anchors/identity.txt"
      - name: Use pinned Rust
        run: |
          rustup install
          rustc --version --verbose
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Reproduce two actual matching order failures on unchanged production
        shell: bash
        run: |
          set -euo pipefail
          git apply --include=crates/noon/src/execution_session/matching_foreground_tests.rs "$RUNNER_TEMP/b6-anchors/candidate.patch"
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/noon/src/execution_session.rs')
          text = path.read_text()
          old = 'mod family_transform_tests;'
          assert text.count(old) == 1
          path.write_text(text.replace(old, old + '\n#[cfg(test)]\nmod matching_foreground_tests;', 1))
          PY
          set +e
          cargo test -p noon --no-default-features --lib matching_inflight -- --nocapture 2>&1 | tee "$RUNNER_TEMP/b6-anchors/before.log"
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -ne 0
          grep -F 'test result: FAILED. 0 passed; 2 failed;' "$RUNNER_TEMP/b6-anchors/before.log"
          test "$(grep -Fc 'assertion `left == right` failed' "$RUNNER_TEMP/b6-anchors/before.log")" -eq 2
          test "$(git diff --name-only)" = 'crates/noon/src/execution_session.rs'
          git checkout -- crates/noon/src/execution_session.rs
          rm crates/noon/src/execution_session/matching_foreground_tests.rs
          test -z "$(git status --porcelain)"
      - name: Apply complete candidate and format
        shell: bash
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/b6-anchors/candidate.patch"
          cargo fmt --all
          git diff --check
      - name: Qualify matching lifetime, transient evaluation, and worker codec
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p noon --no-default-features --lib matching_inflight -- --nocapture 2>&1 | tee "$RUNNER_TEMP/b6-anchors/after.log"
          cargo test -p noon --no-default-features --lib 2>&1 | tee "$RUNNER_TEMP/b6-anchors/noon-lib.log"
          cargo test -p noon --no-default-features --test foreground_admission --test foreground_membership --test foreground_declarations --test root_order_acceptance --test root_order_transaction_regressions --test composition_admission -- --nocapture 2>&1 | tee "$RUNNER_TEMP/b6-anchors/typed.log"
          cargo test -p noon-runtime --lib 2>&1 | tee "$RUNNER_TEMP/b6-anchors/runtime.log"
          cargo test -p noon-render-wgpu --lib 2>&1 | tee "$RUNNER_TEMP/b6-anchors/renderer.log"
          cargo test -p noon-web --lib 2>&1 | tee "$RUNNER_TEMP/b6-anchors/web-lib.log"
          cargo check -p noon --no-default-features --target wasm32-unknown-unknown 2>&1 | tee "$RUNNER_TEMP/b6-anchors/wasm.log"
          cargo check -p noon-web --target wasm32-unknown-unknown 2>&1 | tee "$RUNNER_TEMP/b6-anchors/web-wasm.log"
      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - name: Qualify real before and after anchor pixels
        shell: bash
        env:
          NOON_TRANSIENT_ANCHOR_PROOF: ${{ runner.temp }}/b6-anchors/transient-anchor.rgba
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-b6-anchors"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          cargo test -p noon-render-wgpu --test transient_anchor_order -- --include-ignored --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/b6-anchors/vulkan.log"
      - name: Complete repository fast gate and web preflight
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check.sh fast "$BASE" 2>&1 | tee "$RUNNER_TEMP/b6-anchors/fast.log"
          NOON_WEB_PREFLIGHT_ONLY=1 bash scripts/build-web-demo.sh 2>&1 | tee "$RUNNER_TEMP/b6-anchors/web-preflight.log"
      - name: Publish only qualified feature source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/native-host-smoke.yml',
              'crates/noon-render-wgpu/src/gpu/derived_display.rs',
              'crates/noon-render-wgpu/src/render_order.rs',
              'crates/noon-render-wgpu/tests/transient_anchor_order.rs',
              'crates/noon-runtime/src/derived_display_evaluation.rs',
              'crates/noon-runtime/src/renderer_publication.rs',
              'crates/noon-web/src/retained_family_execution_transport.rs',
              'crates/noon/src/execution_session.rs',
              'crates/noon/src/execution_session/family_transform.rs',
              'crates/noon/src/execution_session/family_transform_tests.rs',
              'crates/noon/src/execution_session/matching_foreground_tests.rs',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          actual.update(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          assert actual == expected, (actual, expected)
          subprocess.run(['git', 'add', '--', *sorted(expected)], check=True)
          PY
          git diff --cached --check
          git config user.name 'Yongkyun Shin'
          git config user.email '4311628+yongkyuns@users.noreply.github.com'
          tree=$(git write-tree)
          source=$(printf '%s\n' 'B6: preserve in-flight matching foreground anchors' | git commit-tree "$tree" -p "$BASE")
          printf 'source=%s\ntree=%s\n' "$source" "$tree" | tee -a "$RUNNER_TEMP/b6-anchors/identity.txt"
          git push origin "$source:refs/heads/$SOURCE_BRANCH"
      - name: Retain exact source and evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/b6-anchors"
          git add -N crates/noon/src/execution_session/matching_foreground_tests.rs crates/noon-render-wgpu/tests/transient_anchor_order.rs 2>/dev/null || true
          git diff HEAD --binary > "$RUNNER_TEMP/b6-anchors/final.patch"
          git ls-files -z | tar --null -T - -czf "$RUNNER_TEMP/b6-anchors/source.tar.gz"
          git status --porcelain > "$RUNNER_TEMP/b6-anchors/status.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: b6-matching-foreground-anchors-proof
          path: ${{ runner.temp }}/b6-anchors
          retention-days: 14
          if-no-files-found: error
