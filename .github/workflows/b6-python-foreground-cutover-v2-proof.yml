name: B6 Python foreground cutover v2 proof
on:
  push:
    branches: [codex/validate-b6-python-foreground-cutover-v2]
permissions:
  contents: read
concurrency:
  group: b6-python-foreground-cutover-v2-proof
  cancel-in-progress: true
env:
  FEATURE: 65af6e91f734c7a115bef081bea7aec6d54a1116
  BASE: f47cf9071f3d81f88c9303002a183a0d13f200eb
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_RW_MODE: "READ_ONLY"
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout proof harness
        uses: actions/checkout@v7
        with:
          path: tooling
          persist-credentials: false
      - name: Checkout exact feature source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.FEATURE }}
          fetch-depth: 0
          path: feature
          persist-credentials: false
      - name: Verify exact feature identity and scope
        working-directory: feature
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FEATURE"
          cargo fmt --all -- --check
          git diff --check "$BASE" HEAD
          python3 - <<'PY'
          import os, subprocess
          allowed = {
            'crates/noon-web/src/canonical_authoring_scene.rs',
            'crates/noon-native/examples/foreground_membership.rs',
            'crates/noon/src/example_scenes.rs',
            'crates/noon/src/example_scenes/foreground_membership.rs',
            'web/python/_manim_scene.py',
            'web/python/noon.py',
            'web/python/test_scene_foreground.py',
            'web/python/test_scene_keyed_membership.py',
            'web/python/examples/foreground_membership.py',
          }
          actual=set(subprocess.check_output(
              ['git','diff','--name-only',os.environ['BASE'],'HEAD'], text=True
          ).splitlines())
          assert actual == allowed, actual ^ allowed
          PY
      - name: Use repository-pinned Rust and WASM target
        working-directory: feature
        run: |
          rustup install
          rustup target add wasm32-unknown-unknown
          rustc --version --verbose
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('feature/Cargo.toml', 'feature/crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Run Python facade and key regression tests
        working-directory: feature
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: web/python
        run: python3 -m unittest -v test_scene_foreground test_scene_keyed_membership
      - name: Run canonical Rust foreground adapter tests
        working-directory: feature
        run: |
          cargo test -p noon-web canonical_foreground_batches_use_shared_membership_and_authoritative_query -- --nocapture
          cargo test -p noon-web foreground_add_requires_binding_before_publication -- --nocapture
          cargo test -p noon --lib example_scenes::foreground_membership::tests -- --nocapture
      - name: Check direct Rust WASM compilation
        working-directory: feature
        run: cargo check -p noon-web --target wasm32-unknown-unknown
      - name: Run complete repository fast gate
        working-directory: feature
        run: bash scripts/check.sh fast "$BASE"
      - name: Build exact feature browser product
        working-directory: feature
        env:
          NOON_WASM_SKIP_OPT: "1"
        run: bash scripts/build-web-demo.sh
      - name: Install Chromium proof dependencies
        working-directory: tooling
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Execute actual Python foreground example through Pyodide/WASM
        working-directory: tooling
        env:
          NOON_ROOT: ${{ github.workspace }}/feature
        run: xvfb-run -a node scripts/b6-python-foreground-cutover-proof.mjs
      - name: Retain browser proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: b6-python-foreground-cutover-v2-proof
          path: feature/browser-smoke-artifacts/b6-python-foreground
          if-no-files-found: warn
          retention-days: 14
