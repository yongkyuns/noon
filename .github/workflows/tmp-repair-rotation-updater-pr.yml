name: Temporary RotationUpdater PR repair

on:
  push:
    branches:
      - parity/manim-rotation-updater-lifecycle

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rebase final tree onto current master
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --no-tags --deepen=32 origin parity/manim-rotation-updater-lifecycle master
          git merge --no-edit origin/master
      - name: Restore accidental Python cache artifacts
        run: |
          git checkout origin/master -- \
            web/python/__pycache__/_manim_compat.cpython-312.pyc \
            web/python/__pycache__/_manim_phase_b.cpython-312.pyc \
            web/python/__pycache__/_noon_ir.cpython-312.pyc \
            web/python/__pycache__/noon.cpython-312.pyc
          git rm -f \
            web/python/__pycache__/_manim_updaters.cpython-312.pyc \
            web/python/__pycache__/test_manim_updater_lifecycle.cpython-312.pyc \
            web/python/__pycache__/test_updater_snapshot.cpython-312.pyc
      - name: Validate lifecycle implementation
        env:
          PYTHONPATH: web/python
        run: |
          cargo fmt --all -- --check
          cargo test -p noon-core host_callbacks
          cargo test -p noon-runtime host_callbacks
          cargo test -p noon-web host_player
          python3 -m unittest web/python/test_manim_updater_lifecycle.py web/python/test_updater_snapshot.py
          node --check web/execution-engine-worker.js
      - name: Commit clean repaired tree
        run: |
          rm .github/workflows/tmp-repair-rotation-updater-pr.yml
          git add -A
          git commit -m "Repair updater lifecycle PR onto current master"
          git push origin HEAD:parity/manim-rotation-updater-lifecycle
