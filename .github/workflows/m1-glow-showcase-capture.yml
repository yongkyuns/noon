name: M1 Glow Showcase canonical build dispatch (temporary)
on:
  push:
    branches: [codex/m1-glow-showcase-capture-68f]
    paths: [.github/workflows/m1-glow-showcase-capture.yml]
permissions:
  contents: read
  actions: write
concurrency:
  group: m1-glow-showcase-build-dispatch
  cancel-in-progress: true
jobs:
  dispatch:
    name: Dispatch exact-source canonical CI build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact source head and dispatch unmodified CI workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected=0ca5ee4c7057098aad3639a202c95b83b297577c
          actual=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            https://api.github.com/repos/yongkyuns/noon/git/refs/heads/codex/m1-glow-showcase-source-68f | jq -r '.object.sha')
          test "$actual" = "$expected"
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"codex/m1-glow-showcase-source-68f"}' \
            https://api.github.com/repos/yongkyuns/noon/actions/workflows/ci.yml/dispatches
          echo "Exact gallery source $expected dispatched through canonical CI; normal source and artifact identity guards remain active."
