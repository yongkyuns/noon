name: GPU glow showcase real capture (temporary)
on:
  push:
    branches: [codex/m1-glow-showcase-capture-68f]
    paths: [.github/workflows/m1-glow-showcase-capture.yml]
permissions:
  contents: read
concurrency:
  group: m1-glow-showcase-capture-68f
  cancel-in-progress: true
jobs:
  capture:
    name: Actual Noon showcase pixels and source-bound poster
    runs-on: ubuntu-latest
    timeout-minutes: 125
    permissions:
      contents: write
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_DIR: /home/runner/.cache/noon-sccache-wasm
      SCCACHE_CACHE_SIZE: "1G"
      SCCACHE_LOCAL_RW_MODE: "READ_ONLY"
      NOON_SHOWCASE_BACKEND: webgl
    steps:
      - name: Checkout exact product candidate without helper files
        uses: actions/checkout@v7
        with:
          ref: 0ca5ee4c7057098aad3639a202c95b83b297577c
      - name: Prove exact source and gallery storyboard
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0ca5ee4c7057098aad3639a202c95b83b297577c
          python3 -m unittest discover -s web/python -p 'test_showcase*.py'
          node --test web/showcase-gallery.test.mjs web/showcase-capture.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          scene = Path("web/python/examples/showcase_gpu_glow.py").read_bytes()
          compile(scene, "showcase_gpu_glow.py", "exec")
          assert hashlib.sha1(b"blob " + str(len(scene)).encode() + bytes([0]) + scene).hexdigest() == "257bacd0e074653c011de70b22b0b2c0d4983593"
          manifest = json.loads(Path("web/python/examples/noon_showcase_manifest.json").read_text())
          assert len(manifest["entries"]) == 22 and sum(e["id"] == "showcase-gpu-glow" for e in manifest["entries"]) == 1
          PY
      - name: Build original Rust/WASM browser package and verify identity
        uses: ./.github/actions/dev-wasm-build
        with:
          preflight: "true"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.62.1
      - name: Install pinned browser smoke dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Capture all 22 real showcase lessons and review the glow storyboard
        run: node scripts/showcase-capture.mjs
      - name: Qualify retained poster sources, frames, and gallery contracts
        run: |
          node --test web/showcase-gallery.test.mjs scripts/showcase-posters.test.mjs web/showcase-capture.test.mjs
          python3 -m unittest discover -s web/python -p 'test_showcase*.py'
      - name: Publish only captured PNGs and evidence to an isolated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/thumbnails/showcase/
          git diff --cached --check
          test -f web/thumbnails/showcase/showcase-gpu-glow.png
          test -f web/thumbnails/showcase/capture-evidence.json
          git commit -m 'test(showcase): retain 22 real gallery posters and exact source evidence'
          git push origin HEAD:refs/heads/codex/m1-glow-showcase-captured-68f
          echo "Published actual captured gallery PNGs at $(git rev-parse HEAD)"
      - name: Preserve capture pixels and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m1-glow-gallery-real-capture
          path: |
            browser-smoke-artifacts/showcase/webgl/
            web/thumbnails/showcase/showcase-gpu-glow.png
            web/thumbnails/showcase/capture-evidence.json
          if-no-files-found: warn
          retention-days: 7
