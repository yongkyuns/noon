name: F2 playground migration retry
on:
  push:
    branches:
      - arch/f2-engine-worker-transport
permissions:
  contents: write
jobs:
  migrate:
    if: github.event.head_commit.message == 'Run F2 playground migration retry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/f2-engine-worker-transport
      - name: Apply migration
        run: python3 scripts/f2-playground-migrate.py
      - name: Validate JavaScript
        run: |
          node --check web/main.js
          node --check web/execution-engine-worker.js
          node --check web/execution-worker-client.js
          node --check scripts/execution-worker-smoke.mjs
          node --check scripts/execution-worker-host-smoke.mjs
          node --test web/execution-transport.test.mjs
      - name: Commit migration
        run: |
          rm -f scripts/f2-playground-migrate.py
          rm -f .github/workflows/f2-playground-migration.yml
          rm -f .github/workflows/f2-playground-migration-retry.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/main.js scripts/build-web-demo.sh .github/workflows/ci.yml docs/execution-worker-transport.md scripts/f2-playground-migrate.py .github/workflows/f2-playground-migration.yml .github/workflows/f2-playground-migration-retry.yml
          git commit -m 'Make worker topology the default browser execution path'
          git push origin HEAD:arch/f2-engine-worker-transport
