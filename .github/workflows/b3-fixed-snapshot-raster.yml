name: B3 fixed-snapshot raster qualification
on:
  push:
    branches: [b3-matching-shapes-parity-qualification]
permissions:
  contents: read
concurrency:
  group: b3-fixed-snapshot-raster
  cancel-in-progress: true
jobs:
  raster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: 9890ad9d88f87e10f6c65287e6b857a256600f9a
      CARGO_INCREMENTAL: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
      NOON_WASM_SKIP_OPT: '1'
      NOON_MANIM_RASTER_BACKENDS: webgpu,webgl
      NOON_MANIM_RASTER_ARTIFACTS: manim-raster-artifacts
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 9890ad9d88f87e10f6c65287e6b857a256600f9a
          fetch-depth: 2
          show-progress: false
      - name: Validate exact candidate and sampler
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node --test scripts/manim-raster-samples.test.mjs
          node scripts/manim-raster-policy.test.mjs
          python3 -m py_compile parity/manim-v0.21/core-examples/matching_shapes_reordered.py
          cp parity/manim-v0.21/manifest.json "$RUNNER_TEMP/b3-full-manifest.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('parity/manim-v0.21/manifest.json').read_text())
          manifest['fixtures'] = [f for f in manifest['fixtures'] if f['id'] == 'matching-shapes-reordered']
          assert len(manifest['fixtures']) == 1
          Path(os.environ['RUNNER_TEMP'], 'b3-focused-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned reference
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config
          python -m pip install --disable-pip-version-check 'manim[typst]==0.21.0' 'typst==0.15.0'
      - name: Verify equivalent Manim geometry and real reference times
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import numpy as np
          from manim import tempconfig
          path = 'parity/manim-v0.21/core-examples/matching_shapes_reordered.py'
          sources = [subprocess.check_output(['git', 'show', 'HEAD^:' + path], text=True), Path(path).read_text()]
          scenes = []
          for source in sources:
              namespace = {}
              exec(source, namespace)
              with tempconfig({'dry_run': True}):
                  scene = namespace['MatchingShapesReordered']()
                  animations = []
                  scene.play = lambda *args, **kwargs: animations.extend(args)
                  scene.wait = lambda *args, **kwargs: None
                  scene.construct()
                  scenes.append((scene, animations))
          for old_root, new_root in zip(scenes[0][0].mobjects, scenes[1][0].mobjects, strict=True):
              for old, new in zip(old_root.family_members_with_points(), new_root.family_members_with_points(), strict=True):
                  np.testing.assert_array_equal(old.points, new.points)
                  np.testing.assert_array_equal(old.get_fill_rgbas(), new.get_fill_rgbas())
                  np.testing.assert_array_equal(old.get_stroke_rgbas(), new.get_stroke_rgbas())
                  assert old.get_stroke_width() == new.get_stroke_width()
          for old_anim, new_anim in zip(scenes[0][1], scenes[1][1], strict=True):
              for old, new in zip(old_anim.to_add.family_members_with_points(), new_anim.to_add.family_members_with_points(), strict=True):
                  np.testing.assert_array_equal(old.points, new.points)
                  np.testing.assert_array_equal(old.get_fill_rgbas(), new.get_fill_rgbas())
                  np.testing.assert_array_equal(old.get_stroke_rgbas(), new.get_stroke_rgbas())
          print('Original Polygon and supported VMobject fixture geometry/paint agree exactly')
          PY
          cp "$RUNNER_TEMP/b3-focused-manifest.json" parity/manim-v0.21/manifest.json
          python scripts/manim-raster-semantic-reference.py --manifest parity/manim-v0.21/manifest.json --output "$RUNNER_TEMP/b3-reference-probe.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { sampleRasterFrames } from './scripts/manim-raster-support.mjs';
          const reference = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/b3-reference-probe.json`));
          const fixture = JSON.parse(fs.readFileSync('parity/manim-v0.21/manifest.json')).fixtures[0];
          const frames = reference.fixtures[0].frames;
          const samples = sampleRasterFrames(frames.map(f => f.time), [0, .25, .5, .75, 1], fixture.sample_times);
          console.log(JSON.stringify({ source_sha: process.env.SOURCE_SHA, frame_count: frames.length, samples }, null, 2));
          JS
          cp "$RUNNER_TEMP/b3-full-manifest.json" parity/manim-v0.21/manifest.json
          git diff --exit-code
      - name: Verify completed wrapper binding regression
        run: python web/python/test_manim_matching_completion_bindings.py
      - name: Install repository-pinned Rust and WASM target
        run: |
          rustup install
          rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Build normal browser package with full manifest
        run: bash scripts/build-web-demo.sh
      - name: Install existing harness dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Select only the new fixture for raster qualification
        run: cp "$RUNNER_TEMP/b3-focused-manifest.json" parity/manim-v0.21/manifest.json
      - name: Paired actual-frame raster comparison
        id: capture
        run: node scripts/manim-raster-differential.mjs
      - name: Capture semantic state at the same times
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        run: node scripts/manim-raster-semantic-state.mjs
      - name: Enforce unchanged strict limits
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        run: node scripts/manim-raster-enforce.mjs
      - name: Dense and direct playback parity
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        run: node scripts/shared-playback-raster.mjs
      - name: Restore full manifest and report evidence
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/b3-full-manifest.json"; then cp "$RUNNER_TEMP/b3-full-manifest.json" parity/manim-v0.21/manifest.json; fi
          mkdir -p manim-raster-artifacts
          printf '%s\n' "$SOURCE_SHA" > manim-raster-artifacts/source-sha.txt
          if test -f "$RUNNER_TEMP/b3-reference-probe.json"; then cp "$RUNNER_TEMP/b3-reference-probe.json" manim-raster-artifacts/materialized-reference-probe.json; fi
          find manim-raster-artifacts -maxdepth 3 -type f -name '*.json' -print
          git diff --stat
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: b3-matching-materialized-frames
          path: manim-raster-artifacts
          if-no-files-found: error
          retention-days: 14
