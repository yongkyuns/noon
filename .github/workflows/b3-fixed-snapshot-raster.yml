name: B3 fixed-snapshot raster qualification
on:
  push:
    branches: [b3-matching-shapes-parity-qualification]
permissions:
  contents: read
jobs:
  raster:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
      NOON_WASM_SKIP_OPT: '1'
      NOON_MANIM_RASTER_BACKENDS: webgpu,webgl
      NOON_MANIM_RASTER_ARTIFACTS: manim-raster-artifacts
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dfb53177eb258092a2628cc0dbc1411fc9fca747
          show-progress: false
      - name: Validate exact candidate and sampler
        run: |
          test "$(git rev-parse HEAD)" = dfb53177eb258092a2628cc0dbc1411fc9fca747
          node --test scripts/manim-raster-samples.test.mjs
          node scripts/manim-raster-policy.test.mjs
          python3 -m py_compile parity/manim-v0.21/core-examples/matching_shapes_reordered.py
          cp parity/manim-v0.21/manifest.json "$RUNNER_TEMP/b3-full-manifest.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('parity/manim-v0.21/manifest.json')
          manifest = json.loads(p.read_text())
          manifest['fixtures'] = [f for f in manifest['fixtures'] if f['id'] == 'matching-shapes-reordered']
          assert len(manifest['fixtures']) == 1
          p.write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned reference
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config
          python -m pip install --disable-pip-version-check 'manim[typst]==0.21.0' 'typst==0.15.0'
      - name: Verify all requested times exist in real Manim output
        run: |
          python scripts/manim-raster-semantic-reference.py --manifest parity/manim-v0.21/manifest.json --output manim-raster-artifacts/materialized-reference-probe.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { sampleRasterFrames } from './scripts/manim-raster-support.mjs';
          const reference = JSON.parse(fs.readFileSync('manim-raster-artifacts/materialized-reference-probe.json'));
          const fixture = JSON.parse(fs.readFileSync('parity/manim-v0.21/manifest.json')).fixtures[0];
          const frames = reference.fixtures[0].frames;
          const samples = sampleRasterFrames(frames.map(f => f.time), [0, .25, .5, .75, 1], fixture.sample_times);
          console.log(JSON.stringify({ source_sha: 'dfb53177eb258092a2628cc0dbc1411fc9fca747', frame_count: frames.length, samples }, null, 2));
          JS
      - name: Install repository-pinned Rust and WASM target
        run: |
          rustup install
          rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Build normal browser package
        run: bash scripts/build-web-demo.sh
      - name: Install existing harness dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Paired actual-frame raster comparison
        id: capture
        run: node scripts/manim-raster-differential.mjs
      - name: Capture semantic state at the same times
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        run: node scripts/manim-raster-semantic-state.mjs
      - name: Enforce unchanged strict limits
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        run: node scripts/manim-raster-enforce.mjs
      - name: Dense and direct playback parity
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        run: node scripts/shared-playback-raster.mjs
      - name: Restore full manifest and report evidence
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/b3-full-manifest.json"; then cp "$RUNNER_TEMP/b3-full-manifest.json" parity/manim-v0.21/manifest.json; fi
          find manim-raster-artifacts -maxdepth 3 -type f -name '*.json' -print || true
          git diff --stat
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: b3-matching-materialized-frames
          path: manim-raster-artifacts
          if-no-files-found: warn
          retention-days: 14
