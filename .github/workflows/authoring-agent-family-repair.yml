name: Prepare reviewed agent family repair
on:
  push:
    branches: [codex/noon-agent-family-repair]
    paths: [.github/workflows/authoring-agent-family-repair.yml, .agent-family-repair.patch]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 7c1d834ab0272761ee546ad379a6c24909c47253
          path: source
          persist-credentials: false
      - name: Apply the reviewed patch to the exact PR head
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = 7c1d834ab0272761ee546ad379a6c24909c47253
          echo '5d6f58a67179d3b653f8a8718d153fa25137e7b9f88e13e393798fe7ed8ccfe0  ../control/.agent-family-repair.patch' | sha256sum --check
          git apply --check ../control/.agent-family-repair.patch
          git apply ../control/.agent-family-repair.patch
      - name: Format Rust and validate patch scope
        working-directory: source
        run: |
          cargo fmt --all
          python3 - <<'PY'
          import subprocess
          expected = {'crates/noon-web/src/canonical_authoring_scene.rs', 'scripts/semantic-preview-smoke.mjs', 'web/python/_manim_semantic_handles.py', 'web/python/test_manim_live_family_construction.py'}
          modified = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          added = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          assert modified | added == expected, (modified, added)
          PY
          git diff --check
      - name: Run wrapper and preview regression contracts
        working-directory: source
        run: |
          python3 -B -m unittest discover -s web/python -p test_manim_live_family_construction.py -v
          node --test web/semantic-preview-session.test.mjs scripts/semantic-preview-observations.test.mjs
      - name: Run shared Rust publication regressions
        working-directory: source
        run: |
          cargo test -p noon-web --lib live_family
          cargo test -p noon-web --lib live_created_group_arrange_and_target_preserve_returned_player_after_prior_plays
      - name: Check the real WASM wrapper
        working-directory: source
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p noon-web --target wasm32-unknown-unknown --features renderer
      - name: Publish a source-only repair commit for connector review
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'Noon agent repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/noon-web/src/canonical_authoring_scene.rs scripts/semantic-preview-smoke.mjs web/python/_manim_semantic_handles.py web/python/test_manim_live_family_construction.py
          git diff --cached --check
          git diff --cached > "$RUNNER_TEMP/noon-family-validated.patch"
          git commit -m 'Publish live Python family construction through the canonical session' -m 'Refs #1197 and #1202. Reuse the shared live family API; preserve revision validation and canonical raster gates. Includes wrapper, Rust publication, and late-construction browser regressions.'
          git rev-parse HEAD 'HEAD^{tree}' | tee "$RUNNER_TEMP/noon-family-result.txt"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/codex/noon-agent-family-result
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: noon-family-repair-review
          path: |
            ${{ runner.temp }}/noon-family-validated.patch
            ${{ runner.temp }}/noon-family-result.txt
          if-no-files-found: warn
          retention-days: 7
