name: Image review source (temporary)
on:
  push:
    branches: [codex/b2-image-workspace-bootstrap]
    paths: [.github/workflows/image-review-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cf4f2a9e82c8f128d8d2c34eb7760d39ab4b409f
          fetch-depth: 0
          persist-credentials: false
      - name: Export only source and reviewed diff
        run: |
          mkdir -p /tmp/image-review-source
          git archive --format=tar HEAD | gzip -1 > /tmp/image-review-source/source.tar.gz
          git diff --binary 6aad6282be4a6ef5dbc557087656b55ab3f1d7c7 HEAD > /tmp/image-review-source/review.patch
          git rev-parse HEAD > /tmp/image-review-source/commit.txt
          git rev-parse HEAD^{tree} > /tmp/image-review-source/tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-review-source-cf4f2a9
          path: /tmp/image-review-source
          retention-days: 2
