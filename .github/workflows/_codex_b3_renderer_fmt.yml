name: codex b3 renderer fmt

on:
  push:
    branches: [codex/b3-derived-display-renderer]

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/b3-derived-display-renderer
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and qualify renderer slice
        shell: bash
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p noon-render-wgpu derived_display --lib
          rm .github/workflows/_codex_b3_renderer_fmt.yml
          git config user.name "Yongkyun Shin"
          git config user.email "yongkyuns@gmail.com"
          git add -A
          git commit -m "Apply rustfmt to derived display renderer"
          git push origin HEAD:codex/b3-derived-display-renderer
