name: Qualify 1614 completion bindings
on:
  push:
    branches: [tooling/qualify-1614-completion-bindings]
    paths: ['.github/workflows/qualify-1614-bindings.yml', 'scripts/qualify-1614-patch.py']
permissions:
  contents: write
concurrency:
  group: qualify-1614-bindings
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: 'true'
  SCCACHE_GHA_RW_MODE: READ_ONLY
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply exact-source candidate
        run: |
          test "$GITHUB_REF" = refs/heads/tooling/qualify-1614-completion-bindings
          python3 scripts/qualify-1614-patch.py
      - name: Use pinned Rust
        run: rustup install
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Format and retain candidate on isolated branch only
        run: |
          cargo fmt --all
          git diff --check
          git add crates/noon-web/src/canonical_authoring_scene.rs crates/noon-web/src/canonical_authoring_scene/membership_bindings.rs crates/noon-web/src/canonical_authoring_scene/membership_bindings/tests.rs crates/noon-web/src/semantic_execution_player.rs web/python/_manim_scene.py web/python/test_manim_transform_matching_shapes.py scripts/manim-compat-smoke.mjs
          test -z "$(git diff --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: associate published matching targets after completion (candidate)' || test -z "$(git status --porcelain)"
          git show --stat --oneline HEAD
          git push origin HEAD:refs/heads/tooling/qualify-1614-completion-bindings
      - name: Focused native completion and atomicity regressions
        run: cargo test -p noon-web canonical_authoring_scene::membership_bindings --lib --all-features
      - name: Repository fast gate
        run: bash scripts/check.sh fast c32666fbb7e39d10fae2e067f3ad397abe870b7f
      - name: Python facade regressions
        run: python3 -m unittest discover -s web/python -p 'test_*.py'
      - name: Build current browser package
        uses: ./.github/actions/dev-wasm-build
        env:
          SCCACHE_GHA_ENABLED: 'false'
          SCCACHE_DIR: /home/runner/.cache/noon-sccache-wasm
          SCCACHE_CACHE_SIZE: 1G
          SCCACHE_LOCAL_RW_MODE: READ_ONLY
        with:
          cache-ref: c32666fbb7e39d10fae2e067f3ad397abe870b7f
      - name: Install browser test dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Real Python matching completion through Rust WASM and renderer
        run: node scripts/manim-compat-smoke.mjs
      - name: Record exact candidate
        if: always()
        run: |
          git rev-parse HEAD
          git diff c32666fbb7e39d10fae2e067f3ad397abe870b7f HEAD --stat
