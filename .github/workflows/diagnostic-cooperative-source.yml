name: Diagnostic cooperative source
on:
  push:
    branches: [diagnostic/noon-cooperative-source-20261023]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Apply exact-source candidate
        run: python3 .github/diagnostics/cooperative-source.py apply
      - name: Install pinned Rust
        run: |
          rustup install
          rustc --version --verbose | tee /tmp/cooperative-source/rustc.txt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Format and retain exact candidate
        run: |
          cargo fmt --all
          python3 .github/diagnostics/cooperative-source.py save
      - name: Cooperative source and browser Rust regressions
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p noon --no-default-features --features prepared-prefix --lib cooperative_source 2>&1 | tee /tmp/cooperative-source/source-tests.log
          cargo test --locked -p noon-web --all-features --lib 2>&1 | tee /tmp/cooperative-source/web-tests.log
          cargo test --locked -p noon --no-default-features --features prepared-prefix --test prepared_prefix_identity 2>&1 | tee /tmp/cooperative-source/identity-tests.log
          node --test web/cooperative-preparation-driver.test.mjs 2>&1 | tee /tmp/cooperative-source/task-tests.log
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Build direct prepared WASM canvas
        shell: bash
        run: |
          set -o pipefail
          wasm-pack build crates/noon-web --target web --out-dir ../../web/pkg --dev --no-opt --features prepared-prefix,renderer-smoke --locked 2>&1 | tee /tmp/cooperative-source/wasm-build.log
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.62.1
      - name: Install pinned Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Qualify actual autonomous preparation, input, cancellation and failure
        shell: bash
        env:
          NOON_PREPARED_CANVAS_ARTIFACTS: /tmp/cooperative-source/browser/canvas
          NOON_PREPARED_SOURCE_ARTIFACTS: /tmp/cooperative-source/browser/source
        run: |
          set -o pipefail
          node scripts/prepared-canvas-qualification.mjs 2>&1 | tee /tmp/cooperative-source/canvas-tests.log
          node scripts/prepared-source-qualification.mjs 2>&1 | tee /tmp/cooperative-source/browser-tests.log
      - name: Repository fast gate and CI topology
        shell: bash
        run: |
          set -o pipefail
          node --test .github/ci/*.test.mjs 2>&1 | tee /tmp/cooperative-source/ci-topology.log
          bash scripts/check.sh fast HEAD 2>&1 | tee /tmp/cooperative-source/fast-gate.log
      - name: Retain tested blobs without moving product refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo fmt --all -- --check
          python3 .github/diagnostics/cooperative-source.py save
          python3 .github/diagnostics/cooperative-source.py store
      - name: Retain source and evidence including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cooperative-source-qualification
          path: /tmp/cooperative-source
          retention-days: 3
