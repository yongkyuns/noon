name: Replay browser offline kit
on:
  push:
    branches: [prep/replay-history-repair]
    paths: [.github/workflows/replay-browser-kit.yml]
permissions:
  contents: read
jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Export public test tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kit/bin"
          cd "$RUNNER_TEMP/kit"
          curl --fail --location --silent --show-error https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz -o wasm-bindgen.tar.gz
          echo 'b51f0208fdff83515a787bd8ab9ac5865ed84dabb66d0c709957bb59793c645f  wasm-bindgen.tar.gz' | sha256sum --check
          tar -xzf wasm-bindgen.tar.gz
          cp wasm-bindgen-0.2.128-x86_64-unknown-linux-musl/wasm-bindgen bin/
          npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/browsers" npx playwright install chromium
          tar --zstd -cf tools.tar.zst bin node_modules
          tar -C "$RUNNER_TEMP/browsers" --zstd -cf browser.tar.zst .
          sha256sum tools.tar.zst browser.tar.zst > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: replay-browser-offline-kit
          path: |
            ${{ runner.temp }}/kit/tools.tar.zst
            ${{ runner.temp }}/kit/browser.tar.zst
            ${{ runner.temp }}/kit/SHA256SUMS
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
