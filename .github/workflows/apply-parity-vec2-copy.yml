name: Apply durable Vec2 copy contract

on:
  push:
    branches:
      - agent/parity-vec2-copy-contract
    paths:
      - .github/workflows/apply-parity-vec2-copy.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/parity-vec2-copy-contract
          fetch-depth: 0

      - name: Patch Vec2 copy contract and regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          noon_path = Path("web/python/noon.py")
          noon = noon_path.read_text()
          old = '''    def __new__(cls, x: float = 0.0, y: float = 0.0) -> Vec2:\n        return tuple.__new__(cls, (float(x), float(y)))\n\n    @property\n'''
          new = '''    def __new__(cls, x: float = 0.0, y: float = 0.0) -> Vec2:\n        return tuple.__new__(cls, (float(x), float(y)))\n\n    def __getnewargs__(self) -> tuple[float, float]:\n        """Return scalar constructor arguments for tuple/pickle reconstruction."""\n\n        return (self.x, self.y)\n\n    def __copy__(self) -> Vec2:\n        """Immutable vectors can be shared by shallow copies."""\n\n        return self\n\n    def __deepcopy__(self, memo: dict[int, Any]) -> Vec2:\n        """Immutable vectors can be shared without tuple reconstruction."""\n\n        memo[id(self)] = self\n        return self\n\n    @property\n'''
          if old not in noon:
              raise SystemExit("Vec2 constructor anchor not found")
          noon_path.write_text(noon.replace(old, new, 1))

          animate_path = Path("web/python/_manim_animate.py")
          animate = animate_path.read_text()
          workaround = '''\ndef _vec2_deepcopy(value: _base.Vec2, memo: dict[int, object]) -> _base.Vec2:\n    """Treat immutable Vec2 metadata as an atomic value during target-state copies."""\n\n    memo[id(value)] = value\n    return value\n\n\n# VMobject.copy() deep-copies wrapper metadata when `.animate` constructs its target.\n# Vec2 is an immutable tuple subclass with a scalar `(x, y)` constructor, so Python's\n# default tuple reconstruction incorrectly passes the whole tuple as `x`. Registering\n# an atomic deepcopy contract avoids that reconstruction without changing scene data.\n_base.Vec2.__deepcopy__ = _vec2_deepcopy\n\n'''
          if workaround not in animate:
              raise SystemExit("temporary Vec2 deepcopy workaround not found")
          animate_path.write_text(animate.replace(workaround, "\n", 1))

          test_path = Path("web/python/test_vec2_copy.py")
          test_path.write_text('''import copy\nimport pickle\nimport unittest\n\nfrom noon import Vec2\n\n\nclass Vec2CopyTests(unittest.TestCase):\n    def test_copy_and_deepcopy_keep_immutable_value_atomic(self) -> None:\n        value = Vec2(1.0, 2.0)\n\n        self.assertIs(copy.copy(value), value)\n        self.assertIs(copy.deepcopy(value), value)\n        self.assertEqual(copy.deepcopy(value), Vec2(1.0, 2.0))\n\n    def test_pickle_reconstructs_vec2_with_scalar_arguments(self) -> None:\n        value = Vec2(-1.25, 3.5)\n        restored = pickle.loads(pickle.dumps(value))\n\n        self.assertIsInstance(restored, Vec2)\n        self.assertEqual(restored, value)\n        self.assertEqual((restored.x, restored.y), (-1.25, 3.5))\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')

          workflow = Path(".github/workflows/apply-parity-vec2-copy.yml")
          workflow.unlink()
          PY

      - name: Validate focused Python tests
        run: |
          cd web/python
          python3 -m unittest test_vec2_copy.py test_layout.py

      - name: Commit durable fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/python/noon.py web/python/_manim_animate.py web/python/test_vec2_copy.py .github/workflows/apply-parity-vec2-copy.yml
          git commit -m "Fix Vec2 copy reconstruction semantics"
          git push origin HEAD:agent/parity-vec2-copy-contract
