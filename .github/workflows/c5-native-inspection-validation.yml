name: C5 native inspection qualification

on:
  push:
    branches: [validation/c5-native-inspection-20260923]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c5-native-inspection-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      BASE_SHA: 697847e30399977ae38751f05e22306756577640
      STAGING_BASE: b08f998b12372e4ecdc07adae15cffa326274bd2
      FEATURE_BRANCH: feat/c5-native-inspection-view
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sources-
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Prepare exact source and retain it before tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/c5-native-proof
          git merge-base --is-ancestor "$STAGING_BASE" HEAD
          git diff --name-only "$STAGING_BASE" HEAD | sort > /tmp/c5-native-proof/staging-paths.txt
          printf '%s\n' .github/workflows/c5-native-inspection-validation.yml crates/noon/src/live_program/inspection.rs crates/noon-native/src/pointer_input/inspection.rs crates/noon-native/src/pointer_input/inspection/tests.rs scripts/validation/c5-native-inspection.py | sort | diff -u - /tmp/c5-native-proof/staging-paths.txt
          python3 scripts/validation/c5-session-inspection.py
          python3 scripts/validation/c5-native-inspection.py
          rustup install
          rustc --version --verbose | tee /tmp/c5-native-proof/rust-version.txt
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          paths=(.github/workflows/native-host-smoke.yml crates/noon/src/execution_session.rs crates/noon/src/execution_session/input.rs crates/noon/src/execution_session/input/presentation.rs crates/noon/src/execution_session/inspection.rs crates/noon/src/execution_session/inspection/tests.rs crates/noon/src/inspection_view.rs crates/noon/src/lib.rs crates/noon/src/live_program.rs crates/noon/src/live_program/inspection.rs crates/noon-native/src/execution_source.rs crates/noon-native/src/lib.rs crates/noon-native/src/pointer_input.rs crates/noon-native/src/pointer_input/inspection.rs crates/noon-native/src/pointer_input/inspection/tests.rs crates/noon-native/src/selection_overlay/tests.rs)
          git read-tree "$BASE_SHA"
          git add "${paths[@]}"
          git diff --cached --name-only "$BASE_SHA" > /tmp/c5-native-proof/paths.txt
          printf '%s\n' "${paths[@]}" | sort | diff -u - /tmp/c5-native-proof/paths.txt
          tree=$(git write-tree)
          printf '%s\n' "$tree" > /tmp/c5-native-proof/tree.txt
          git archive "$tree" | gzip > /tmp/c5-native-proof/source.tar.gz
          git diff --cached --binary "$BASE_SHA" > /tmp/c5-native-proof/source.patch
          git diff --cached --stat "$BASE_SHA" > /tmp/c5-native-proof/source.stat
          sha256sum /tmp/c5-native-proof/source.tar.gz > /tmp/c5-native-proof/source.sha256
          cp crates/noon-native/src/execution_source.rs /tmp/c5-native-execution.good.rs
      - name: Focused shared and native qualification
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p noon --no-default-features --lib inspection -- --nocapture 2>&1 | tee /tmp/c5-native-proof/shared.log
          cargo test -p noon-native --lib pointer_input::inspection -- --nocapture 2>&1 | tee /tmp/c5-native-proof/native.log
          cargo check -p noon-web --target wasm32-unknown-unknown 2>&1 | tee /tmp/c5-native-proof/wasm.log
      - name: Uncomposed native camera negative control
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/noon-native/src/execution_source.rs')
          s = p.read_text()
          old = 'self.session().inspection_camera().map_err(Into::into)'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'self.session().camera().map_err(Into::into)'))
          PY
          set +e
          cargo test -p noon-native --lib pointer_input::inspection::tests::zoom_only_viewport_needs_no_semantic_pointer_binding_or_timeline -- --exact --nocapture > /tmp/c5-native-proof/negative-control.log 2>&1
          result=$?
          set -e
          cp /tmp/c5-native-execution.good.rs crates/noon-native/src/execution_source.rs
          test "$result" -ne 0
          grep -F 'test result: FAILED. 0 passed; 1 failed' /tmp/c5-native-proof/negative-control.log
      - name: Native surface and callback presentation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0
          xvfb-run -a -s "-screen 0 1280x720x24" cargo test -p noon-native native_surface_smoke_presents_inspection_zoom_and_recovery -- --ignored --nocapture --test-threads=1 2>&1 | tee /tmp/c5-native-proof/surface.log
          xvfb-run -a -s "-screen 0 1280x720x24" cargo test -p noon-native native_surface_smoke_presents_callback_continuation_endpoint -- --ignored --nocapture --test-threads=1 2>&1 | tee /tmp/c5-native-proof/callback-surface.log
      - name: Repository fast gate
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check.sh fast "$BASE_SHA" 2>&1 | tee /tmp/c5-native-proof/fast.log
      - name: Publish clean tested source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cmp /tmp/c5-native-execution.good.rs crates/noon-native/src/execution_source.rs
          while IFS= read -r path; do git add "$path"; done < /tmp/c5-native-proof/paths.txt
          tree=$(git write-tree)
          test "$tree" = "$(cat /tmp/c5-native-proof/tree.txt)"
          cp Cargo.lock /tmp/c5-native-proof/Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(git commit-tree "$tree" -p "$BASE_SHA" -m 'C5: connect session inspection zoom to native presentation and live ownership (#1714)')
          test -z "$(git ls-remote --heads origin "refs/heads/$FEATURE_BRANCH")"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "$commit:refs/heads/$FEATURE_BRANCH"
          printf '%s\n' "$commit" > /tmp/c5-native-proof/commit.txt
          git cat-file -p "$commit" > /tmp/c5-native-proof/commit-object.txt
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: c5-native-inspection-proof
          path: /tmp/c5-native-proof
          retention-days: 7
          if-no-files-found: error
