name: Apply issue 1604 family become contract

on:
  push:
    branches: [fix/1604-family-become-state-contract]

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/1604-family-become-state-contract
          fetch-depth: 0
      - name: Apply receiver-owned become state contract
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'receiver_owned_become_state' crates/noon/src/state_replacement.rs; then
            echo 'source patch already applied'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/noon/src/state_replacement.rs')
          text = path.read_text()

          old = '''#[derive(Clone)]
          enum PersistentTargetNode {
              Object,
              Family {
                  members: Vec<SemanticNodeId>,
                  z_index: f64,
              },
          }
          '''
          new = '''#[derive(Clone)]
          enum PersistentTargetNode {
              Object,
              Family { members: Vec<SemanticNodeId> },
          }

          /// `become` copies visual object state, not receiver identity/painter provenance.
          ///
          /// Manim aligns a short source by copying a source-side submobject, then replaces
          /// points/style from the target. Mirror that ownership split here: reused or
          /// synthesized receiver nodes keep source-side presentation/role/bindings while
          /// content, transform and style come from the fitted target. A receiver created
          /// from an empty source starts with ordinary/default metadata. The semantic store
          /// assigns its own insertion-order tie break when the node is admitted.
          fn receiver_owned_become_state(
              prototype: Option<&SemanticObjectState>,
              target: &SemanticObjectState,
          ) -> SemanticObjectState {
              let mut state = prototype
                  .cloned()
                  .unwrap_or_else(|| SemanticObjectState::new(target.content));
              state.content = target.content;
              state.transform = target.transform;
              state.style = target.style.clone();
              state
          }

          fn aligned_source_prototype(
              source_members: &[SemanticNodeId],
              target_len: usize,
              target_index: usize,
          ) -> Option<SemanticNodeId> {
              if source_members.is_empty() {
                  return None;
              }
              if source_members.len() >= target_len {
                  return source_members.get(target_index).copied();
              }
              let source_index = target_index * source_members.len() / target_len;
              source_members.get(source_index).copied()
          }
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''            SemanticNodeKind::Family(presentation) => Ok(PersistentTargetNode::Family {
                          members: node.members_iter().collect(),
                          z_index: presentation.z_index,
                      }),
          '''
          new = '''            SemanticNodeKind::Family(_) => Ok(PersistentTargetNode::Family {
                          members: node.members_iter().collect(),
                      }),
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    fn reconcile_node(
                  &mut self,
                  candidate: Option<SemanticNodeId>,
                  target: SemanticNodeId,
              ) -> Result<SemanticTransactionNodeRef, AuthoringError> {
          '''
          new = '''    fn reconcile_node(
                  &mut self,
                  candidate: Option<SemanticNodeId>,
                  prototype: Option<SemanticNodeId>,
                  target: SemanticNodeId,
              ) -> Result<SemanticTransactionNodeRef, AuthoringError> {
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''                    SemanticTransactionNodeRef::Pending(
                              self.transaction
                                  .create_node(SemanticNodeCreation::object(state.clone())),
                          )
          '''
          new = '''                    let prototype_state = prototype.and_then(|prototype| {
                              self.store
                                  .node(prototype)
                                  .and_then(|node| node.semantic_object_state())
                          });
                          let state = receiver_owned_become_state(prototype_state, state);
                          SemanticTransactionNodeRef::Pending(
                              self.transaction
                                  .create_node(SemanticNodeCreation::object(state)),
                          )
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''            PersistentTargetNode::Family { members, z_index } => {
                      let (receiver, reused) = if let Some(source) = reusable {
                          self.source_to_target.insert(source, target);
                          (SemanticTransactionNodeRef::Existing(source), Some(source))
                      } else {
                          let pending = self.transaction.create_node(SemanticNodeCreation::family());
                          if z_index != 0.0 {
                              self.transaction.set_z_index(pending, z_index);
                          }
                          (SemanticTransactionNodeRef::Pending(pending), None)
                      };
                      // Publish the mapping before descending so aliases in the target
                      // DAG converge on exactly one receiver-owned identity.
                      self.target_to_receiver.insert(target, receiver);
                      if let Some(source) = reused {
                          self.reconcile_existing_family(source, &members)?;
                      } else {
                          for target_member in members {
                              let member = self.reconcile_node(None, target_member)?;
                              self.transaction.add_member(receiver, member);
                          }
                      }
                      Ok(receiver)
                  }
          '''
          new = '''            PersistentTargetNode::Family { members } => {
                      let (receiver, reused) = if let Some(source) = reusable {
                          self.source_to_target.insert(source, target);
                          (SemanticTransactionNodeRef::Existing(source), Some(source))
                      } else {
                          let pending = self.transaction.create_node(SemanticNodeCreation::family());
                          let prototype_members = prototype
                              .and_then(|prototype| self.store.node(prototype))
                              .and_then(|node| match node.kind() {
                                  SemanticNodeKind::Family(presentation) => {
                                      if presentation.z_index != 0.0 {
                                          self.transaction.set_z_index(pending, presentation.z_index);
                                      }
                                      Some(node.members_iter().collect::<Vec<_>>())
                                  }
                                  _ => None,
                              })
                              .unwrap_or_default();
                          self.target_to_receiver.insert(
                              target,
                              SemanticTransactionNodeRef::Pending(pending),
                          );
                          for (index, target_member) in members.iter().copied().enumerate() {
                              let member = self.reconcile_node(
                                  None,
                                  aligned_source_prototype(&prototype_members, members.len(), index),
                                  target_member,
                              )?;
                              self.transaction.add_member(pending, member);
                          }
                          return Ok(SemanticTransactionNodeRef::Pending(pending));
                      };
                      // Publish the mapping before descending so aliases in the target
                      // DAG converge on exactly one receiver-owned identity.
                      self.target_to_receiver.insert(target, receiver);
                      if let Some(source) = reused {
                          self.reconcile_existing_family(source, &members)?;
                      }
                      Ok(receiver)
                  }
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        for (index, &target_member) in target_members.iter().enumerate() {
                      desired.push(self.reconcile_node(current.get(index).copied(), target_member)?);
                  }
          '''
          new = '''        for (index, &target_member) in target_members.iter().enumerate() {
                      desired.push(self.reconcile_node(
                          current.get(index).copied(),
                          aligned_source_prototype(current, target_members.len(), index),
                          target_member,
                      )?);
                  }
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    let root = reconcile.reconcile_node(Some(source.node_id()), target.node_id())?;
          '''
          new = '''    let root = reconcile.reconcile_node(
                  Some(source.node_id()),
                  Some(source.node_id()),
                  target.node_id(),
              )?;
          '''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('crates/noon/tests/family_state.rs')
          text = path.read_text()
          marker = '''fn family(scene: &Scene) -> MobjectFamily {
              let a = scene.square(1.0).unwrap();
              let mut b = scene.rectangle(1.0, 2.0).unwrap();
              b.shift(2.0, 0.0).unwrap();
              let nested = scene.family(&[(&a).into(), (&b).into()]).unwrap();
              scene.family(&[(&a).into(), (&nested).into()]).unwrap()
          }
          '''
          replacement = marker + '''
          fn object_state(scene: &Scene, id: noon::SemanticNodeId) -> noon::SemanticObjectState {
              scene
                  .integration_store()
                  .borrow()
                  .semantic_object_state_checked(id)
                  .unwrap()
                  .clone()
          }

          fn assert_become_visual_state(
              receiver: &noon::SemanticObjectState,
              target: &noon::SemanticObjectState,
          ) {
              assert_eq!(receiver.content, target.content);
              assert_eq!(receiver.transform, target.transform);
              assert_eq!(receiver.style, target.style);
          }
          '''
          assert marker in text
          text = text.replace(marker, replacement, 1)

          start = text.index('#[test]\nfn unequal_family_become_reuses_receiver_identity_and_never_imports_target_ids()')
          end = text.index('\n#[test]\nfn dimension_matching_uses_aggregate_bounds', start)
          new_test = r'''#[test]
          fn unequal_family_become_reuses_receiver_identity_and_never_imports_target_ids() {
              let scene = Scene::new();
              let source_leaf = scene.square(1.0).unwrap();
              source_leaf.set_z_index(7.0).unwrap();
              let source_state = source_leaf.state().unwrap();
              let source = scene.family(&[(&source_leaf).into()]).unwrap();
              let source_root = source.node_id();
              let first_target = scene.circle(2.0).unwrap();
              first_target.set_z_index(-4.0).unwrap();
              let mut second_target = scene.rectangle(3.0, 1.0).unwrap();
              second_target.shift(4.0, 1.0).unwrap();
              second_target.set_z_index(11.0).unwrap();
              let target = scene
                  .family(&[(&first_target).into(), (&second_target).into()])
                  .unwrap();
              let target_ids = leaves(&target);
              let target_states = target_ids
                  .iter()
                  .map(|&id| object_state(&scene, id))
                  .collect::<Vec<_>>();
              let revision = scene.revision();

              source.become_family(&target, Default::default()).unwrap();

              assert_eq!(source.node_id(), source_root);
              assert_eq!(scene.revision(), revision.checked_next().unwrap());
              let receiver_ids = leaves(&source);
              assert_eq!(receiver_ids.len(), 2);
              assert_eq!(receiver_ids[0], source_leaf.node_id());
              assert!(!target_ids.contains(&receiver_ids[0]));
              assert!(!target_ids.contains(&receiver_ids[1]));
              assert_ne!(receiver_ids[1], source_leaf.node_id());
              let receiver_states = receiver_ids
                  .iter()
                  .map(|&id| object_state(&scene, id))
                  .collect::<Vec<_>>();
              for (receiver, target) in receiver_states.iter().zip(&target_states) {
                  assert_become_visual_state(receiver, target);
                  // `become` copies target visual state, not target painter metadata.
                  // The synthesized expansion leaf is a receiver-owned copy of the
                  // aligned source leaf, matching Manim's add_n_more_submobjects path.
                  assert_eq!(receiver.z_index(), source_state.z_index());
              }
              assert_eq!(
                  receiver_states[0].insertion_order(),
                  source_state.insertion_order()
              );
              assert_ne!(
                  receiver_states[1].insertion_order(),
                  target_states[1].insertion_order()
              );
              assert!(
                  receiver_states[1].insertion_order() > receiver_states[0].insertion_order()
              );
              assert_eq!(
                  target_ids
                      .iter()
                      .map(|&id| object_state(&scene, id))
                      .collect::<Vec<_>>(),
                  target_states
              );

              // Contracting topology only changes membership. Detached receiver-owned
              // descendants retain valid identities for any other handles/aliases.
              let empty = scene.family(&[]).unwrap();
              let expanded_ids = receiver_ids.clone();
              let revision = scene.revision();
              source.become_family(&empty, Default::default()).unwrap();
              assert_eq!(source.node_id(), source_root);
              assert!(leaves(&source).is_empty());
              assert_eq!(scene.revision(), revision.checked_next().unwrap());
              {
                  let store = scene.integration_store().borrow();
                  for &id in &expanded_ids {
                      assert!(store.node(id).is_some());
                  }
              }

              source.become_family(&target, Default::default()).unwrap();
              let reexpanded_ids = leaves(&source);
              assert_eq!(reexpanded_ids.len(), target_ids.len());
              assert!(reexpanded_ids.iter().all(|id| !target_ids.contains(id)));
              let store = scene.integration_store().borrow();
              for id in expanded_ids {
                  assert!(store.node(id).is_some());
              }
          }

          #[test]
          fn live_unequal_family_become_preserves_same_z_receiver_painter_order() {
              use noon_compile::semantic_execution_object_id;

              let mut scene = Scene::new();
              let source_leaf = scene.square(2.0).unwrap();
              source_leaf.set_z_index(5.0).unwrap();
              let source = scene.family(&[(&source_leaf).into()]).unwrap();
              let peer = scene.square(2.0).unwrap();
              peer.set_z_index(5.0).unwrap();

              let first_target = scene.circle(1.0).unwrap();
              first_target.set_z_index(-10.0).unwrap();
              let second_target = scene.circle(1.0).unwrap();
              second_target.set_z_index(20.0).unwrap();
              let target = scene
                  .family(&[(&first_target).into(), (&second_target).into()])
                  .unwrap();
              let target_ids = leaves(&target);

              scene
                  .add_many(&[(&source).into(), (&peer).into()])
                  .unwrap();
              let mut session = scene.execution_session().unwrap();
              scene
                  .live(&mut session)
                  .become_family(&source, &target, Default::default())
                  .unwrap();

              let receiver_ids = leaves(&source);
              assert_eq!(receiver_ids.len(), 2);
              for &receiver in &receiver_ids {
                  assert_eq!(object_state(&scene, receiver).z_index(), 5.0);
              }
              let actual = session
                  .painter_order()
                  .iter()
                  .map(|&row| session.frame().objects[row as usize].id)
                  .collect::<Vec<_>>();
              let expected = [
                  semantic_execution_object_id(receiver_ids[0]),
                  semantic_execution_object_id(receiver_ids[1]),
                  semantic_execution_object_id(peer.node_id()),
              ];
              assert_eq!(actual, expected);
              assert!(target_ids
                  .iter()
                  .map(|&id| semantic_execution_object_id(id))
                  .all(|id| !actual.contains(&id)));
          }
          '''
          text = text[:start] + new_test + text[end:]
          path.write_text(text)
          PY
          cargo fmt --all
          git diff --check
          cargo test -p noon --test family_state unequal_family_become_reuses_receiver_identity_and_never_imports_target_ids
          cargo test -p noon --test family_state live_unequal_family_become_preserves_same_z_receiver_painter_order
          cargo test -p noon --test family_state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/noon/src/state_replacement.rs crates/noon/tests/family_state.rs
          git commit -m 'fix(become): preserve receiver-owned presentation metadata'
          git push origin HEAD:fix/1604-family-become-state-contract
