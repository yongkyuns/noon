s</text><text x="2496" y="1691" class="cb">retained renderer</text><text x="2496" y="1710" class="cb">state only</text><path d="M1040,1360 L1040,1590" class="ea"/><text x="1040" y="1495" text-anchor="middle" class="ss">publication + changes</text><path d="M1700,1450 L1700,1590" class="eg"/><text x="1700" y="1495" text-anchor="middle" class="ss">ObjectContentRef::Geometry</text><path d="M1260,1642.5 L1500,1642.5" class="eg"/><path d="M1900,1642.5 L2100,1605" class="ea"/><path d="M1700,1695 L1700,1725" class="er"/><path d="M1900,1777.5 L2020,1777.5" class="ea"/><path d="M2490,1605 L2550,1605 L2550,1640" class="ea"/><path d="M2420,1777.5 L2605,1777.5 L2605,1755" class="ea"/><text x="1400" y="1882" text-anchor="middle" class="n">Canonical VectorPath path: PathCommand → VectorPath/resource handle → GeometryRef → TessellatedPath → packed GPU buffers. No SVG d-string.</text></svg>