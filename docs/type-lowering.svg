</style></defs><rect width="100%" height="100%" fill="#F8FAFD"/><text x="40" y="42" font-size="30" font-weight="700">Noon implementation types: ownership → lowering → rendering</text><text x="40" y="70" class="ss">Reader map; docs/architecture.md remains normative. Material-inspired theme.</text><rect x="1800" y="37" width="22" height="16" rx="5" class="b"/><text x="1831" y="50" class="ss">authority</text><rect x="2015" y="37" width="22" height="16" rx="5" class="g"/><text x="2046" y="50" class="ss">resource</text><rect x="2220" y="37" width="22" height="16" rx="5" class="a"/><text x="2251" y="50" class="ss">derived</text><rect x="2420" y="37" width="22" height="16" rx="5" class="p"/><text x="2451" y="50" class="ss">orchestration</text><rect x="40" y="95" width="2720" height="205" rx="18" class="layer"/><text x="64" y="131" class="st">1 · noon — authoring API</text><text x="64" y="154" class="ss">Public handles and construction inputs</text><rect x="80" y="165" width="300" height="105" rx="14" class="t"/><text x="96" y="193" class="ct">Scene</text><text x="96" y="216" class="cb">shared SemanticStore</text><text x="96" y="235" class="cb">root: SemanticNodeId · cursor</text><rect x="450" y="165" width="300" height="105" rx="14" class="t"/><text x="466" y="193" class="ct">Mobject</text><text x="466" y="216" class="cb">Rc&lt;RefCell&lt;SemanticStore&gt;&gt;</text><text x="466" y="235" class="cb">id: SemanticNodeId · handle only</text><rect x="1050" y="165" width="390" height="105" rx="14" class="t"/><text x="1066" y="193" class="ct">ManimGeometryOptions</text><text x="1066" y="216" class="cb">GeometryRef · SemanticTransform2_5D</text><text x="1066" y="235" class="cb">SemanticStyle · z_index</text><path d="M380,217.5 L450,217.5" class="eg"/><text x="415" y="207" text-anchor="middle" class="ss">factory</text><rect x="40" y="330" width="2720" height="330" rx="18" class="layer"/><text x="64" y="366" class="st">2 · noon-core — Semantic Scene authority</text><text x="64" y="389" class="ss">Authoritative authored identity, state, and heavy geometry resources</text><rect x="460" y="420" width="280" height="115" rx="14" class="b"/><text x="476" y="448" class="ct">SemanticStore</text><text x="476" y="471" class="cb">scene-global authored truth</text><text x="476" y="490" class="cb">nodes + resource arenas</text><rect x="780" y="420" width="280" height="115" rx="14" class="t"/><text x="796" y="448" class="ct">SemanticNodeId + Node</text><text x="796" y="471" class="cb">generational identity · kind</text><text x="796" y="490" class="cb">membership / parents / members</text><rect x="1100" y="420" width="280" height="115" rx="14" class="t"/><text x="1116" y="448" class="ct">SemanticObjectState</text><text x="1116" y="471" class="cb">content · f64/2.5D transform</text><text x="1116" y="490" class="cb">style · presentation · role · signals</text><rect x="1420" y="420" width="280" height="115" rx="14" class="t"/><text x="1436" y="448" class="ct">SemanticObjectContent</text><text x="1436" y="471" class="cb">Geometry(StoredGeometry)</text><text x="1436" y="490" class="cb">or Text(handle)</text><rect x="1740" y="420" width="280" height="115" rx="14" class="g"/><text x="1756" y="448" class="ct">StoredGeometry</text><text x="1756" y="471" class="cb">analytic values inline</text><text x="1756" y="490" class="cb">or GeometryResourceHandle</text><rect x="2060" y="420" width="280" height="115" rx="14" class="g"/><text x="2076" y="448" class="ct">GeometryResourceArena</text><text x="2076" y="471" class="cb">arena + GeometryId + version</text><text x="2076" y="490" class="cb">immutable Arc&lt;VectorPath&gt;</text><rect x="2060" y="555" width="360" height="80" rx="14" class="g"/><text x="2076" y="583" class="ct">VectorPath + PathCommand[]</text><text x="2076" y="606" class="cb">Move · Line · Quadratic · Cubic · Close</text><path d="M740,477.5 L780,477.5" class="eg"/><path d="M1060,477.5 L1100,477.5" class="eg"/><path d="M1380,477.5 L1420,477.5" class="eg"/><path d="M1700,477.5 L1740,477.5" class="er"/><path d="M2020,477.5 L2060,477.5" class="er"/><path d="M2200,535 L2200,555" class="er"/><path d="M600,270 L600,420" class="eg"/><text x="600" y="318" text-anchor="middle" class="ss">read / edit</text><path d="M1245,270 L1245,420" class="eg"/><text x="1245" y="318" text-anchor="middle" class="ss">into_state()</text><rect x="40" y="690" width="2720" height="230" rx="18" class="layer"/><text x="64" y="726" class="st">3 · noon-compile — Execution Plan authority</text><text x="64" y="749" class="ss">Derived execution identity and renderer-independent compiled scene</text><rect x="430" y="770" width="400" height="110" rx="14" class="a"/><text x="446" y="798" class="ct">SemanticExecutionIndex</text><text x="446" y="821" class="cb">SemanticNodeId → derived ObjectId</text><text x="446" y="840" class="cb">compatibility bridge</text><rect x="1000" y="770" width="400" height="110" rx="14" class="a"/><text x="1016" y="798" class="ct">SemanticExecutionObject</text><text x="1016" y="821" class="cb">semantic_id · execution_id · content</text><text x="1016" y="840" class="cb">Transform2D · Style · presentation</text><rect x="1580" y="770" width="400" height="110" rx="14" class="b"/><text x="1596" y="798" class="ct">CompiledObject</text><text x="1596" y="821" class="cb">ObjectId · ObjectContentRef</text><text x="1596" y="840" class="cb">Transform2D · Style · dynamic/live</text><rect x="2160" y="770" width="440" height="110" rx="14" class="b"/><text x="2176" y="798" class="ct">CompiledScene</text><text x="2176" y="821" class="cb">stable/tombstoned slots · tracks</text><text x="2176" y="840" class="cb">painter order · resources</text><path d="M830,825 L1000,825" class="ea"/><path d="M1400,825 L1580,825" class="ea"/><path d="M1980,825 L2160,825" class="ea"/><path d="M600,535 L600,770" class="ea"/><text x="600" y="675" text-anchor="middle" class="ss">visible-leaf identity</text><path d="M1240,535 L1240,770" class="ea"/><text x="1240" y="675" te