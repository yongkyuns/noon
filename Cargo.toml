[workspace]
members = [
    "crates/noon",
    "crates/noon-core",
    "crates/noon-geometry",
    "crates/noon-compile",
    "crates/noon-runtime",
    "crates/noon-render-wgpu",
    "crates/noon-native",
    "crates/noon-python",
    "crates/noon-export",
    "crates/noon-web",
    "crates/noon-typst",
    "crates/noon-text",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.98.1"
repository = "https://github.com/yongkyuns/noon"
